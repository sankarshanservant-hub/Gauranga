open_questions:
  - "День явления: магха-пурнима (БР, НВ, T, наш календарь) или Васанта-панчами (ПВ, M) (⚠6)."
  - "Как ушёл из дома — тайно (T, M, БР) или с согласия матери (B), или со всадником джагирдара (ПВ) (⚠7)."
  - "Когда явились Гаура и Вишнуприя — до праздника (B, БР) или после (T, M) (⚠11)."
  - "Посвящение Харирамы — у Рамачандры (M, ПВ) или у Нароттамы (T) (⚠12)."
  - "Год ухода не назван; день — только у M (⚠13)."
