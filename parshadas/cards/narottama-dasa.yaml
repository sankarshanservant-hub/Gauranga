# Карточка лица (формат — parshadas/CARDS.md § 3). Источник — только parshadas/facts/narottama-dasa.md и lila-db.
id: "@narottama-dasa"
names:
  ru: "Нароттама Дас Тхакур (Тхакур Махашая)"
  en: "Narottama Dasa Thakura (Thakura Mahashaya)"
  variants: ["Нароттама", "Тхакур Махашая (звание от Дживы, B; ПВ 12)", "Тхакур (звание от Дживы, T)", "Шри Тхакур", "Махашая (НВ, БР)", "Парамахамса Шри Нароттама Даса Тхакур (M)", "Чампака-манджари (во Врадже, T; ПВ 11)"]
  facts: [F1, F2, F3]
kind: acharya
circle: [vrindavana, later]
period: [P13, P14, P15]
period_note: "Сам Господь в Рамакели и у Канаи-Натшалы звал его и оставил для него прему в Падме ещё до его рождения (P13; F7–F10); рождение и детство в Кхетури (P14 по lila-db ev-narottama-birth; F12–F24); всё остальное — после сокрытия Господа: уход во Вриндаван, Локанатха и Джива, книги в Гауду, паломничество, праздник в Кхетури, ученики, уход в Гамбхиле (P15; F25–F93)."
life:
  appearance:
    date: "около середины XV в. эры Шака (T)"
    tithi: "Пурнима месяца Мадхава (≈ магха) — по нашему календарю (1 февраля 2026; в 2027 г. — кришна-пратипад, т. к. пурнима-титхи кшая)"
    place: "#kheturi"
    conf: "магха-пурнима — T, БР 1.281, НВ 2.4; шукла-панчами (Васанта-панчами) магхи — M, ПВ 9.48 (⚠6; T ошибочно приписывает пурниму ПВ); даём по календарю Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-22). Место — Кхетури (B; T: Кхетури в подокруге Гопалпур, Раджшахи; M: отец жил в Гопалпуре на Падмавати)"
    facts: [F12, F17]
  disappearance:
    date: ""
    tithi: "Кришна-панчами месяца Дамодара (≈ карттика) — по нашему календарю (30 октября 2026)"
    place: "#gambhila"
    conf: "день — только M 123 (кришна-панчами карттики), совпадает с календарём ШЧСМ (541/ru, проверено 2026-11-22); место — Гамбхила на Ганге (M; НВ 11.330, через Будхари); B и T об уходе не говорят (⚠13). Ушёл в водах Ганги — «скрылся», «растворился, словно молоко» (НВ), не «умер» (⚠Б2)"
    facts: [F91, F92]
  samadhi: []
origin:
  places: ["#kheturi", "#gopalapura"]
  family: ["@krishnananda-datta", "@narayani-kheturi", "@purushottama-datta", "@santosha-datta"]
  varna: "каястха (Датта); по «Анубхашье» — истинный брахман-вайшнав (⚠Б1)"
  facts: [F12, F13, F14, F15, F16, F98]
  note: "Отец — раджа-заминдар Кришнананда Датта; мать Нараяни; дядя Пурушоттама (младший — T, старший — M); двоюродный брат Сантоша (⚠5). Пожизненный брахмачари (F4)."
relations:
  - {type: father, who: "@krishnananda-datta", facts: [F12, F13, F26, F28, F57], note: "Раджа, заминдар Гопалпура; ушёл из мира, пока сын был в странствиях (M 111) / по «другим» T — сын ушёл после его смерти (⚠7)."}
  - {type: mother, who: "@narayani-kheturi", facts: [F13, F21, F26], note: "B: ушёл с её согласия; T, M, БР 1.288–291 — тайно (⚠7)."}
  - {type: uncle, who: "@purushottama-datta", facts: [F14, F15, F26, F57], note: "Брат отца (младший — T; старший — M, ⚠5); отец Сантоши."}
  - {type: relative, who: "@santosha-datta", facts: [F15, F28, F57, F58, F59, F65, F67, F75], events: [ev-kheturi-festival, ev-santosha-datta-sangita-madhava],
     note: "Двоюродный брат, раджа Кхетури и ученик (B 1100; M 111; БР 10.205); построил храм и устроил праздник."}
  - {type: disciple, who: "@santosha-datta", facts: [F58], note: "Посвящён в мантру Радха-Кришны (M 111)."}
  - {type: guru, who: "@lokanatha", facts: [F33, F34, F42, F60, I1, I2, "@lokanatha:F60", "@lokanatha:F66", "@lokanatha:F67"], events: [ev-narottama-meets-lokanatha, ev-narottama-initiation, ev-narottama-returns-kheturi],
     note: "Дикша-гуру; Нароттама — его единственный ученик; тайное служение, посвящение в шравана-пурниму; повелел вернуться в Кхетури и установить Божества (= @lokanatha F60–F68)."}
  - {type: siksha-guru, who: "@jiva-gosvami", facts: [F2, F32, F35, F36, F37, F39], events: [ev-srinivasa-narottama-shyamananda-vrindavana, ev-narottama-thakura-mahashaya, ev-books-mission-decision, ev-jiva-srinivasa-letters],
     note: "Учил его книгам Госвами; дал звание «Тхакур (Махашая)»; послал к Локанатхе и с книгами в Гауду (= @jiva-gosvami F150–F152, F169)."}
  - {type: other, who: "@mahaprabhu", facts: [F7, F8, F9, F10, F72], events: [ev-lord-calls-narottama-ramakeli, ev-prema-left-in-padma, ev-kheturi-festival],
     note: "До его рождения звал его по имени и оставил для него прему в Падме; явился со спутниками в его киртане в Кхетури."}
  - {type: other, who: "@nityananda", facts: [F8, F11, F56], events: [ev-prema-left-in-padma, ev-narottama-receives-prema, ev-nityananda-shows-ekachakra],
     note: "Слёзы Нитьянанды — та према; во сне велел принять её от Падмавати; по НВ 5 в облике брахмана показал ему Экачакру."}
  - {type: friend, who: "@srinivasa-acharya", facts: [F35, F36, F37, F41, F66, F69, F76, F88, F89, F90], events: [ev-srinivasa-narottama-shyamananda-vrindavana, ev-srinivasa-narottama-farewell-parikrama, ev-books-leave-vrindavana, ev-kheturi-festival-invitations, ev-kheturi-festival, ev-srinivasa-ramachandra-disappearance],
     note: "Друг и соученик у Дживы, «единый душой»; вместе везли книги; Шриниваса совершил абхишеку в Кхетури; плач «йе анила према-дхана» — о нём."}
  - {type: friend, who: "@shyamananda", facts: [F35, F36, F41, F53, F66, F77], events: [ev-srinivasa-narottama-shyamananda-vrindavana, ev-books-leave-vrindavana, ev-narottama-shyamananda-nrisimhapura],
     note: "Третий из ачарьев; встреча в Нрисимхапуре; месяцы в Кхетури (B 1105)."}
  - {type: companion, who: "@ramachandra-kaviraja", facts: [F76, F80, F84, F88, F90, F98], events: [ev-narottama-bhajana-kheturi, ev-narasimha-raya-conversion, ev-srinivasa-ramachandra-disappearance],
     note: "Дражайший спутник, «второе я» (БР 1.269 «абхиннатма»); «Нароттама Дас просит общения с Рамачандрой» («Прартхана»)."}
  - {type: met, who: "@jahnava", facts: [F49, F66, F68, F69, F70, F71, F74, F75, F77, F89], events: [ev-narottama-gauda-pilgrimage, ev-kheturi-festival, ev-jahnava-kheturi, ev-jahnava-returns-through-kheturi],
     note: "Милость в Кхардахе; праздник в Кхетури — под её руководством; по её слову начал киртан; ачарьи приняли её как джагад-гуру (B 171)."}
