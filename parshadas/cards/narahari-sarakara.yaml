period: [P07, P12, P14, P15]
period_note: "Лично: в Навадвипе — служение чамарой, рядом с Гададхарой (P07; много эпизодов — по «Чайтанья-мангале» Лочана и падам, lila-db); каждый год — в Пури на Ратха-ятре с жителями Шрикханды (P12, P14); после сокрытия Господа — в Шрикханде: Шриниваса, Нароттама, свадьба Шринивасы; уход и праздник разлуки (P15). Год рождения 1479/80 (T по ГВА) — до явления Господа (P01). Появление в киртане в Кхетури (M) — уже после ухода (F63)."
