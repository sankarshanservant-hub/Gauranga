  facts: [F8, F9, F10, F12, F13, F16]
  note: "Младший из трёх сыновей Нараяны Даса (Нараянадевы Саркара) и Гойи, дочери Мурари Сена (T 69); после смерти отца учился в Навадвипе на попечении старшего брата Мукунды (F16)."
