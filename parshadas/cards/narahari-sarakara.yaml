     note: "Сын Мукунды; по строфе у B 284 — ученик Нарахари (F39); дядя воспитывал его с любовью (T). Вместе танцевали в группе Кханды на Ратха-ятре (F31); учредил праздник разлуки по Нарахари (F69). ⚠ T 200 ошибочно зовёт его сыном Нарахари (F14)."}
