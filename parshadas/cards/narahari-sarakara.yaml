    facts: [F65, F66, F67, F68, F69, F70]
    events: [ev-gadadhara-dasa-narahari-departure, ev-katwa-khanda-memorial-festivals]
    note: "Календарь ШЧСМ: «День ухода Шрилы Нарахари Саракара Тхакура» — Кешава-маса, тёмная половина (5.12.2026, в год махадвадаши — на двадаши). Праздник разлуки учредил Рагхунандана; великий праздник — на двадаши (B) ≠ «на тринадцатый день» (T по БР 9.512–514) (F69)."
origin:
