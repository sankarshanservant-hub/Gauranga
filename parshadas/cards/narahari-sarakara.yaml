open_questions:
  - "Брихад-врати (B 181 по скану; B 674 — «тьяги-кула») — в рабочем переводе B ошибочно «домохозяин»; T и M о его семье молчат."
  - "Сколько и какие Божества он установил: три Божества Господа в Шрикханде, Катве и Ганганагаре (T) или Махапрабху и Нитьянанда из шести Божеств Шрикханды (B); «Гауранга и Мадана-Гопала» (M) (F41, F44)."
  - "Когда Шриниваса узнал о скором сокрытии Господа: от Нарахари (T, B) или Нарахари велел ждать попутчиков (M) (F55)."
  - "День великого праздника разлуки: двадаши (B) или «тринадцатый день» (T по БР 9.512–514) (F69)."
  - "Строка о падах о Врадже до рождения Гауранги — Райшекхара (B, «некоторые») или Лочана (M) (F17)."
  - "«Бхаджанамрита» — проза (B) или книга песен (M) (F74); «Падакалпатару» у M — ошибка (F79)."
  - "Ссылки: ГГД «117» (T) = 177; «ГГД 197» (B) — по нашему переводу дружба с Чирандживой в ст. 209; ЧЧ Ади «10.78–89» (B) = 10.78."
  - "Песни с подписью «Нарахари» в БР и антологиях — чьи (Саркар или Чакраварти) — не решено (F80); в lila-db часть пад помечена «Саркар?»."
