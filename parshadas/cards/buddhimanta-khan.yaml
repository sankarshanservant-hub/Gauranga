period_note: "Лично — в Навадвипе: «болезнь вайю» и свадьба Господа с Вишнуприей (P05; F10–F17), ночные киртаны, действо в доме Чандрашекхары, игры в Ганге (P07; F18–F22); встреча в Шантипуре после санньясы (P09; F23); ежегодные хождения гаудийцев в Пури (P12, P14; F24–F25). P13 — лишь у Джаянанды (арадхана Мадхавендры Пури у Адвайты, Кулия; F27–F28). Прежнее рождение царём Суварна Сеной в Сатья-югу (F4) — вне шкалы."
