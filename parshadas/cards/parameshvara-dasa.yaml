  - {type: co-worker, who: "@sundarananda", facts: [F25], note: "Джаянанда: с Нитьянандой, Рамадасом и Сундаранандой (= @sundarananda F31)."}
  - {type: other, who: "@raghava-pandita", facts: [F19], events: [ev-gauda-journey-ganga-villages], note: "Пришёл к Господу в дом Рагхавы в Панихати (= @raghava-pandita F23)."}
  - {type: other, who: "@raghunatha-dasa", facts: [F26], events: [ev-panihati-chida-dadhi], note: "Гость праздника чида-дадхи (ЧЧ Антья 6.62)."}
