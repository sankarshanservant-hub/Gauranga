period_note: "Лично: в Панихати с Господом (ЧБ Антья 5.95–96, P13, F19); с Нитьянандой в Гауде (P12 по lila-db, F21–F25); на празднике чида-дадхи (ЧЧ Антья 6.62, P14, F26); после сокрытия Господа — в Кхардахе при Джахнаве и Васудхе, Шриниваса и Нароттама, Кхетури, Вриндаван, изваяние Радхи, Атпур (P15, F31–F50). P07 — лишь по его паде о празднике у Адвайты (F51; очевидец по каталогу пад). В перечнях ветвей Нитьянанды (ЧЧ Ади 11.29; ЧБ Антья 5.718–756) — упоминания."
