places_note: "Шрипат — Атпур (Антпур; в БР 13.245 и «Гаудия-бхашье» — «Тада-Атпур»; прежде — Вишакхала / Бишакхали), ветка Чампаданга линии Хаора — Амта, округ Хугли; самадхи там же. Гаралгачха — по B 918 в Хугли, по B 921 и T 89 — «в округе Пури» (⚠6). Акна-Махеш близ Шрирампура — шрипат Камалакары Пиппалаи (чудо с шакалом)."
