  - {type: deity-served, who: "@gaura-deity-antpur", facts: [F20], note: "Божество Гауранги в (Тада-)Атпуре — по «Гаудия-бхашье» к ЧБ Антья 5.95–96; B 919, T 89 (⚠1)."}
  - {type: deity-served, who: "@radha-gopinatha-antpur", facts: [F18, F48, F49], note: "Установил в Атпуре по велению Джахнавы (БР 13.245–246); ныне на одном троне с Баладевой (суждение Бхактисиддханты — противно таттве, F18)."}
  - {type: served-by, who: "@jahnava", facts: [F31, F32, F34, F35, F37, F38, F41, F42, F43, F44, F47, F48],
     events: [ev-srinivasa-khardaha-jahnava, ev-jahnava-kheturi, ev-kheturi-festival, ev-jahnava-vrindavana, ev-jahnava-radha-for-madana-mohana],
     note: "Её «очень дорогой слуга» (B 921): готовил путь в Кхетури (НВ 6.193), шёл с ней в Кхетури и Вриндаван, представлял ей Госвами (БР 11.101–106), вёз во Вриндаван изваяние Радхи для Гопинатхи (БР 13), по её велению явил служение Радха-Гопинатхе в Атпуре. Тип: Джахнава — та, кому он служил. = @jahnava F38, F44, F45, F51, F52, F72, F99, F100, F104."}
  - {type: other, who: "@vasudha", facts: [F31, F32, F48], note: "При Васудхе и Джахнаве в Кхардахе; им рассказал о Радхе у Гопинатхи (БР 13.242–243; T 200)."}
  - {type: other, who: "@virabhadra", facts: [F32], note: "M 190: привёл Шринивасу и к Вирачандре."}
  - {type: met, who: "@srinivasa-acharya", facts: [F32, F45, F46], events: [ev-srinivasa-khardaha-jahnava],
     note: "Узнал его в Кхардахе и отвёл к Джахнаве (БР 4.82–87); в Катве показал ему изваяние Радхи (БР 13.82–121); в Яджиграме рассказал о её установке (БР 13.223–239)."}
  - {type: met, who: "@narottama-dasa", facts: [F33, F45], events: [ev-narottama-gauda-pilgrimage], note: "В Кхардахе указал ему путь в Нилачалу (БР 8.219; B 921 по скану; T 89); в Катве: «Пойте, о Нароттама, Шриниваса!» (БР 13.113)."}
  - {type: other, who: "@govinda-kaviraja", facts: [F39, F40], note: "Представил Говинду Госвами Вриндавана и попросил их послушать его стихи — так тот получил имя «Кавираджа» (БР 11.114, 11.145–147)."}
  - {type: met, who: "@gopala-bhatta", facts: [F38], events: [ev-jahnava-vrindavana], note: "Назвал Джахнаве Госвами Вриндавана: Гопала Бхатта, Бхугарбха, Локанатха, Кришнадас Брахмачари, Кришна Пандит, Мадху Пандит, Джива (БР 11.104–105; НВ 9.16)."}
  - {type: met, who: "@jiva-gosvami", facts: [F38], note: "Там же (M 68 ошибочно приписывает называние имён Дживе, ⚠8). = @jiva-gosvami F78."}
  - {type: other, who: "@gopinatha-vrindavana", facts: [F43, F44, F45, F46, F47], events: [ev-jahnava-gopinatha], note: "Привёз Ему изваяние Радхи от Джахнавы; Радху поставили слева от Гопинатхи (БР 13.229–232; НВ 9.84). B — для Говиндадевы, «Према-виласа» — для Мадана-мохана (⚠5)."}
  - {type: co-worker, who: "@purandara-pandita", facts: [F19, F21], events: [ev-gauda-journey-ganga-villages], note: "Вдвоём прибежали к Господу в Панихати (ЧБ Антья 5.95–96); вместе шли с Нитьянандой."}
  - {type: co-worker, who: "@gadadhara-dasa", facts: [F21], events: [ev-nityananda-sent-to-gauda], note: "= @gadadhara-dasa F13, F16."}
  - {type: co-worker, who: "@abhirama", facts: [F21], events: [ev-nityananda-sent-to-gauda], note: "Рамадас — в той же свите Нитьянанды (ЧБ Антья 5.231)."}
