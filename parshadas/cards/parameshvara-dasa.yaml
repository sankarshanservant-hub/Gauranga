     note: "Ветвь древа Нитьянанды, «единственное прибежище — Нитьянанда» (ЧЧ Ади 11.29); «Нитьянанда — его жизнь, в его теле — игры Нитьянанды» (ЧБ Антья 5.732); один из двенадцати гопалов; шёл с Ним в Гауду (ЧБ Антья 5.231–240). Дикша не названа — «гуру» в смысле Господина-прибежища. = @nityananda F262, F267, F403."}
  - {type: other, who: "@mahaprabhu", facts: [F19, F20], events: [ev-gauda-journey-ganga-villages],
