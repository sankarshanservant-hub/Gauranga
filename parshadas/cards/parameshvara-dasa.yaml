open_questions:
  - "Для кого Джахнава послала изваяние Радхи: Гопинатха (БР 13, НВ 9), Говиндадева (B 921) или Мадана-мохан («Према-виласа» 16) (⚠5)."
  - "Видел ли он союз Радхи и Гопинатхи вместе с Джахнавой (B 920) или один, привезя изваяние (БР 13); предание T 89 о «слиянии» Джахнавы с Радхой (⚠4)."
  - "Где Гаралгачха — Хугли (B 918) или «округ Пури» (B 921, T 89) (⚠6)."
  - "«Виграха» ЧБ 5.95 — Божество Гауранги в Атпуре («Гаудия-бхашья») и/или тело (как в 5.93, 5.732) (⚠1)."
  - "Год и место ухода, день явления неизвестны."
