# Карточка лица (формат — parshadas/CARDS.md § 3). Источник — только parshadas/facts/krishnadasa-kaviraja.md и lila-db.
id: "@krishnadasa-kaviraja"
names:
  ru: "Кришнадас Кавираджа Госвами"
  en: "Krishnadasa Kaviraja Gosvami"
  variants: ["Шри Кавираджа Госвами (B)", "Кришнадас (так сам в колофонах ЧЧ; «О Кришнадас!» — Нитьянанда во сне, ЧЧ Ади 5.195)", "Кавираджа (ПВ, БР)", "Krishna Das Kaviraj Goswami (T)", "Krishnadasa Kaviraja Goswami (M)"]
  facts: [F1, F2]
kind: acharya
circle: [vrindavana, later]
period: [P15]
period_note: "С Господом лично не встречался (ни B, ни T, ни M, ни ЧЧ этого не говорят). По Бхактисиддханте родился ок. 1520 г. (F57) — в годы игр Господа в Пури жил в Бенгалии. Вся известная жизнь — после сокрытия Господа (P15): киртан и сон в Джхаматпуре, Вриндаван и Радха-кунда, ЧЧ (заверш. 1615 г. по ЧЧ Антья 20.158; 1581 г. по ПВ 24 — ⚠6), встречи со Шринивасой, Нароттамой, Шьяманандой, Вирачандрой, Джахнавой. Как автор ЧЧ — в сотнях лил lila-db (колофоны, слово автора)."
life:
  appearance:
    date: ""
    tithi: ""
    place: "#jhamatpur?"
    conf: "день и год явления источники не называют (Бхактисиддханта, по T 195: «вероятно, ок. 1520 г.»); в календаре Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-22) дня явления нет. Место: T (по Бхактисиддханте) — родился в Джхаматпуре; ЧЧ и B — лишь жил там (⚠8)."
    facts: [F7, F57]
  disappearance:
    date: ""
    tithi: "Падманабха маса, Гаура-двадаши (ашвина шукла-двадаши) — календарь ШЧСМ"
    place: "#radha-kunda?"
    conf: "День — по календарю ШЧСМ (541/ru, проверено 2026-11-22: 23 октября 2026 г., вместе с Рагхунатхой Дасом и Рагхунатхой Бхаттой); так же T 198 (ашвина шукла-двадаши, после Рагхунатхи Даса) и B 504 (один день ухода у трёх). Год — ок. 1616/1617 (Бхактисиддханта, T 195). Предание ПВ 13 — оставил тело у Радха-кунды от горя при вести о похищении книг (ур. C) — B и Бхактисиддханта отвергают (⚠11, ⚠Б6)."
    facts: [F56, F57, F59, F60, F61, F62]
  samadhi:
    - {place: "#radha-damodara-temple", facts: [F58], note: "T 195 — по «Бхумике» Бхактисиддханты, во дворе храма Радха-Дамодары (⚠7)."}
    - {place: "#radha-kunda", facts: [F25, F58], note: "T 198 — хижина и самадхи на Радха-кунде; M 254 — его бхаджан-кутир на берегу Радха-кунды (⚠7)."}
origin:
  places: ["#jhamatpur", "#naihati-katwa", "#katwa"]
  family: ["@kaviraja-brother"]
  varna: "неизвестна: B — брахман или каястха (догадка составителя), T (Бхактисиддханта) — одна из трёх (брахман, каястха, вайдья); «Кавираджа» — звание, не каста (F2, F3; ⚠Б5)"
  facts: [F3, F4, F5, F6, F7, F8]
  note: "Джхаматпур близ Наихати (ЧЧ Ади 5.181), округ Бардхаман, линия Катвы, станция Салар (B 1085; T 195; «Анубхашья» и «Амрита-праваха-бхашья» к 5.181); там храм Гаура-Нитай / Шри Махапрабху и, по T 198, следы стоп Нитьянанды и его деревянная сандалия. Родители неизвестны (Бхактисиддханта, T 195); «Бхагиратха и Сунанда» — только поздние справочники (T 198, ур. D, ⚠10). Брат — без имени (ЧЧ); «Шьямадас Кавираджа» — по ГВА (T 196). Брак: по B — вероятно, не женат; T — мнения расходятся (F6)."
sampradaya:
  name: "ученик Рагхунатхи Даса Госвами (линия рупануг: Сварупа — Рупа и Санатана — Рагхунатха Дас — Кришнадас Кавираджа)"
  facts: [F22, F23, F54]
relations:
  - {type: guru, who: "@raghunatha-dasa", facts: [F22, F24, F25, F52, F56, F59], events: [ev-krishnadasa-kaviraja-departure],
     note: "ЧЧ Антья 20.97, 20.146 — «мой гуру Шри Рагхунатха дас» («Анубхашья»: научивший бхаджану); ПВ — посвящение от него (T 198); B 629 — принял его своим гуру; жил рядом с ним на Радха-кунде; от него — описания махабхавы последних дней и «кадча» Сварупы (B 1086; T 197); «Мукта-чарита» Рагхунатхи — «силой общения» с Кавираджей (B 649–650); один день ухода (B 504; T 198). = @raghunatha-dasa F65, F120, F125."}
  - {type: other, who: "@nityananda", facts: [F8, F13, F14, F15, F16, F18, F20, F68], events: [ev-kaviraja-nityananda-jhamatpur],
     note: "Довольный упрёком брату, Нитьянанда явился ему во сне в Джхаматпуре и послал во Вриндаван (ЧЧ Ади 5.180–199); по Его милости — прибежище Госвами и даршан Мадана-Гопала и Говинды (5.200–227); местное предание — посвящение в мантру от Нитьянанды (T 198, ⚠9); ПВ 18.48 — «пишет о себе как об ученике Прабху». = @nityananda F391–F395."}
  - {type: siksha-guru, who: "@rupa-gosvami", facts: [F16, F17, F21, F23, F37, F43], note: "Шикша-гуру (ЧЧ Ади 1.36–37); по милости Рупы приблизился к бхакти-расе (5.203); «лучший последователь Рупы» (B 1086; T 198); развернул одиннадцать шлок Рупы в «Говинда-лиламриту» (БР 1.818; B 335, 390). = @rupa-gosvami F106, F324–F325, F355, F563–F566."}
  - {type: siksha-guru, who: "@sanatana-gosvami", facts: [F16, F17, F23], note: "Шикша-гуру (ЧЧ Ади 1.36); по милости Санатаны узнал истины бхакти (5.203)."}
  - {type: siksha-guru, who: "@jiva-gosvami", facts: [F23, F37, F38, F43, F49, F53, F61, F62], events: [ev-virachandra-jiva-vrindavana, ev-jiva-srinivasa-letters],
     note: "Шикша-гуру (ЧЧ; B 534; T 190); заключения ЧЧ — из «Сандарбх» (B 507); силу писать ГЛ обрёл общением с ним (B 534); ЧЧ написана при его жизни (B 522; T 189); поклон Кавираджа в письме Дживы (B 525); клевета о колодце отвергнута (T 190; B 524–525). = @jiva-gosvami F6, F81, F99–F101, F105, F361."}
  - {type: siksha-guru, who: "@gopala-bhatta", facts: [F23, F32, F44, F45], events: [ev-lokanatha-forbids-mention],
     note: "Один из шести шикша-гуру (B 605); дал позволение писать ЧЧ, но запретил писать о себе (БР 1.222–224; B 606–607; T 176, 179); «Става-панчака» о нём — под именем Кавираджа (B 602)."}
  - {type: siksha-guru, who: "@raghunatha-bhatta", facts: [F23, F56], note: "Один из шести наставников (ЧЧ Ади 1.36); один день ухода (B 504). = @raghunatha-bhatta F31–F32."}
  - {type: other, who: "@svarupa-damodara", facts: [F16, F24, F54], note: "Записи («кадча») Сварупы, сохранённые Рагхунатхой, — основа поздних игр в ЧЧ (Мадхья 2.84; Антья 3.267–268, 14.7–9; T 197; B 229); прибежище у его стоп — по милости Нитьянанды (Ади 5.202)."}
  - {type: other, who: "@lokanatha", facts: [F25, F33, F34, F50], events: [ev-lokanatha-forbids-mention],
     note: "Благословил писать ЧЧ, но запретил писать о себе (БР 1.225; B 1075; T 151; M 98); с ним и Рагхунатхой — на Радха-кунде («Карнананда» 4). = @lokanatha F57."}
  - {type: other, who: "@bhugarbha", facts: [F29, F34, F50], note: "С его и Локанатхи разрешения начал писать последние игры; Бхугарбха и ученики хотели слышать о Гауре (ЧЧ Ади 8.68–69; B 265–267). = @bhugarbha F33."}
  - {type: other, who: "@haridasa-pandita-govinda", facts: [F29], events: [ev-kaviraja-ordered-to-write-cc], note: "По его милости и велению взялся описать последние игры (ЧЧ Ади 8.59–65)."}
  - {type: other, who: "@madana-mohana-vrindavana", facts: [F18, F30, F31, F36], events: [ev-kaviraja-ordered-to-write-cc],
     note: "Гирлянда Мадана-Гопалы — позволение писать (ЧЧ Ади 8.73–77); «Мадана-мохан диктует» (8.78–79); принял Его своим Божеством (8.80); «Сам Мадан-Гопал повелел» (Антья 20.99); первый поклон ЧЧ — Радха-Мадана-мохану (Ади 1.15). ⚠15, ⚠Б2."}
  - {type: other, who: "@gosani-dasa-pujari", facts: [F30], events: [ev-kaviraja-ordered-to-write-cc], note: "Надел ему гирлянду Мадана-Гопалы (ЧЧ Ади 8.74–76)."}
  - {type: other, who: "@govinda-deity", facts: [F18, F36], note: "По милости Нитьянанды — неземной даршан Шри Говинды (B 1086, по скану; ЧЧ Ади 5.217–227); поклон Радха-Говиндадеве (Ади 1.16)."}
  - {type: other, who: "@gopinatha-vrindavana", facts: [F36], note: "Поклон Гопинатхе в начале ЧЧ (Ади 1.17, 1.19; M 177–178)."}
  - {type: sibling, who: "@kaviraja-brother", facts: [F5, F12, F13], events: [ev-minaketana-ramadasa-kaviraja-house],
     note: "Верил в Чайтанью, но не в Нитьянанду; поспорил с Минакетаной и лишился преданности; Кавираджа укорил его (ЧЧ Ади 5.172–178); имя «Шьямадас» — только ГВА (T 196). ⚠Б4."}
  - {type: guest, who: "@minaketana-ramadasa", facts: [F9, F10, F11, F12, F13], events: [ev-minaketana-ramadasa-kaviraja-house],
     note: "Гость на суточном киртане в его доме в Джхаматпуре (ЧЧ Ади 5.161–178); Кавираджа встал на его сторону. = @minaketana-ramadasa F9–F22."}
  - {type: other, who: "@gunarnava-mishra", facts: [F11], events: [ev-minaketana-ramadasa-kaviraja-house], note: "Брахман, служивший Божеству в его доме; не приветствовал Рамадаса (ЧЧ Ади 5.168–171; B — «не чтил имени Нитьянанды», ⚠1)."}
  - {type: other, who: "@vrindavana-dasa", facts: [F27, F28], note: "Почтил как Вьясу игр Чайтаньи (ЧЧ Ади 8.34–40, 13.48; Антья 20.82); лишь упоминал описанное им, восполнял опущенное (Мадхья 4.5–9); по мнению некоторых, с Лочаном дал ЧБ её имя (T 194; M 78). = @vrindavana-dasa F24."}
  - {type: met, who: "@srinivasa-acharya", facts: [F47, F53, F60, F66], events: [ev-srinivasa-narottama-shyamananda-vrindavana, ev-books-mission-decision, ev-books-stolen-vana-vishnupura],
     note: "Шриниваса на Радха-кунде получил его милость (БР 4.393–396 A, T «4.392»; B 666; M 192; T 205); БР 5.701–702 — любил его как свою жизнь. = @srinivasa-acharya F55, F79."}
  - {type: met, who: "@narottama-dasa", facts: [F51, F66], events: [ev-narottama-thakura-mahashaya], note: "Нароттама считал его средоточием круга преданных после шести Госвами, черпал у него вдохновение (B 1086); песни Нароттамы о нём (T 198, 210; ⚠4)."}
  - {type: met, who: "@shyamananda", facts: [F50], events: [ev-shyamananda-comes-to-vrindavana], note: "Благословил его (B 1104); ПВ 12.306–312 — принял пришедшего Духкхи Кришнадаса в своей хижине. Его прежнее имя «Духкхи Кришнадас» — тёзка: M pdf 243–249 — глава о Шьямананде, не о Кавирадже."}
  - {type: met, who: "@ramachandra-kaviraja", facts: [F48], note: "Рамачандра получил даршан его стоп на Радха-кунде (M 199)."}
  - {type: met, who: "@govinda-kaviraja", facts: [F60], note: "БР 11.268 (изд. A) — обнял Говинду Кавираджу при прощании; поклон Кавираджа — в письме Дживы Говинде (по нашему переводу ПВ)."}
  - {type: met, who: "@virabhadra", facts: [F49], events: [ev-virachandra-jiva-vrindavana], note: "Вышел встречать Вирачандру во Вриндаване (B 1095; M 15; БР 13)."}
  - {type: met, who: "@jahnava", facts: [F69], events: [ev-jahnava-vrindavana], note: "ПВ 16.164 — почтил Джахнаву у Радха-кунды (ур. C; по ПВ 13 он к тому времени уже ушёл — противоречие ПВ)."}
  - {type: disciple, who: "@mukunda-dasa-radhakunda", facts: [F55, F61], note: "Ученик, жил в его бхаджан-кутире на Радха-кунде (M 254–255); шила Говардханы — после него у Мукунды («Нароттама-виласа», прил., ур. C); «копия Мукунды» — в отвергнутой клевете (T 190; B 524)."}
  - {type: lineage-successor, who: "@vishvanatha-chakravarti", facts: [F42, F54, F55], note: "Поселился в его бхаджан-кутире; во сне Радха подтвердила правоту Кавираджа о 24½ слогах (B 974; T 198); шикша-парампара Бхактисиддханты (M 255). = @vishvanatha-chakravarti F29, F39, F59–F61."}
  - {type: other, who: "@radha", facts: [F42, F63], note: "Во сне Вишванатхи называет его «Моя дорогая подруга / нарма-сахачари» (B 974; T 198; ⚠Б7)."}
  - {type: other, who: "@prabodhananda-sarasvati", facts: [F35], note: "По T 180 — через Гопалу Бхатту просил не описывать его в ЧЧ."}
  - {type: other, who: "@raghava-gosvami-govardhana", facts: [F47], note: "Вместе на Радха-кунде оказали милость Шринивасе (БР 4; B 666; M 192)."}
  - {type: other, who: "@gopala-guru", facts: [F54], note: "Два потока рага-бхаджана Сварупы: Рагхунатха — Кавираджа и Вакрешвара — Гопала Гуру (B 274; T 202)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F2, F3, F4, F6, F7, F27, F40, F41, F57, F58, F62, F63], note: "«Бхумика» к изд. ЧЧ Гаудия-матха (по T 195–196): происхождение, варна, ашрам, Ратнарекха; годы ок. 1520 — ок. 1616/17; «Анубхашья» к Ади 10.85 — опровержение клеветы; о верховенстве ЧЧ (T 198); предупреждение о расе (B 1086)."}
  - {type: other, who: "@bhaktivinoda", facts: [F24], note: "«Амрита-праваха-бхашья»: ЧЧ — суть «кадчи» Сварупы, которую Рагхунатха знал наизусть (T 197, 131)."}
  - {type: other, who: "@bhakti-pramoda-puri", facts: [F29, F30, F42], note: "Предисловие к изд. ЧЧ Шри Чайтанья Гаудия Матха: поручение вайшнавов, гирлянда, сон Вишванатхи (по T 197–198)."}
  - {type: other, who: "@narahari-chakravarti", facts: [F65, F67], note: "БР 1.215–225 — о его книге и запретах Госвами; «Намамрита-самудра» 266 — молитва к нему."}
  - {type: other, who: "@krishnadasa-brahmachari", facts: [F49, F64], note: "Тёзка, не путать: служитель Мадана-мохана (ГГД 164); стоит рядом в списке встречавших Вирачандру (B 1095; M 15)."}
