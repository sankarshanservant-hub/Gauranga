  - {trait: "непредсказуемость: решения о поездке менял, не считаясь с удобствами", facts: [F35, F52]}
  - {trait: "смирение и чувство разлуки: «к вайшнавам нет ни капли привязанности», «а теперь и плакать не может»", facts: [F48, F64, F87, F89, F99]}
  - {trait: "радость при утрате: «один вор даёт, другой забирает»", facts: [F25]}
