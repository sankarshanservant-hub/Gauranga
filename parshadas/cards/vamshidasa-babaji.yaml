teachings_given:
  - {text: "«Плачь» — путь к Богу; милость Кришны обретают слезами любви", facts: [F101, F102]}
  - {text: "Поклоняйтесь Нитаю — обретёте Гауру; вне поклонения Гаура-Нитаю радости нет", facts: [F59, F98, F102]}
  - {text: "Милость к живым, вкус к Имени, служение вайшнавам — вечная дхарма", facts: [F67]}
  - {text: "Чрезмерная (показная) преданность — признак вора: устами «Хари», в уме иное", facts: [F56, F102]}
  - {text: "Род (вамша) не защищает от вора-майи", facts: [F57]}
  - {text: "Гуру — знающий Кришна-таттву, кто бы он ни был; в бхаджане нет различий касты (ЧЧ)", facts: [F55]}
  - {text: "Не живи с неверующими; отвергай дурное общество", facts: [F87, F99]}
  - {text: "Придуманные «мантры», противные сиддханте, недопустимы", facts: [F103]}
