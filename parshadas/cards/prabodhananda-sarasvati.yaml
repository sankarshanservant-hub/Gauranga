open_questions:
  - "Тождество с Пракашанандой: Лал Дас, «Адвайта-пракаша», Ашутош Деб, «Абхидхана» — да; Бхактисиддханта, B, T — нет (другое лицо) (F35–F43)."
  - "Годы: Шрирангам — 1510 (T 178, lila-db) / 1511 (B, M) / 1512 (T 179); 1433 Шака (B, Бхактисиддханта) (F9, F43)."
  - "Гопала — ученик дикши (T, «Анубхашья») или шикши (B 607) (F14)."
  - "Кто отправил Гопалу во Вриндаван: Господь/родители (B, T, БР) или сам Прабодхананда на исходе дней («Према-виласа») (F16)."
  - "Прежнее имя «Гопала-гуру» — имя или описание («гуру Гопалы») (F2)."
  - "Авторство «Радха-раса-судханидхи» (спор с другой сампрадаей), «Кришна-валлабхи» к «Гопала-тапани», «Прабодха-яти» у Дживы (F24, F26, F27)."
  - "Даты явления и ухода неизвестны; в календаре ШЧСМ их нет; самадхи у Калия-дахи — только B (F20)."
