  - "Происхождение: мусульманская семья (ЧЧ, ЧБ, B) или брахман, воспитанный мусульманами (T «по некоторым источникам»; «Адвайта-виласа» — отец Ханаулла Кази); год рождения 1451 — лишь по «Адвайта-виласе» (⚠2)."
  - "Порядок ранних лил: Бенаполь → Чандапур → Шантипур (ЧЧ) и Пхулия/суд/змей/Харинади (ЧБ); B ставит Чандапур позже (⚠5)."
  - "Был ли Харидас в Рамакели «до прихода в Пури» (B 875) — по ЧЧ он жил в Пури раньше (⚠12)."
  - "Прежнее рождение: ГГД 93–95 (сын Ричики) ≠ Мурари 1.4.8–12 (сын мудреца Рамы) (⚠1)."
  - "Год ухода не назван ни одним источником."
