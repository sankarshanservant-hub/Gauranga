  en: "Haridasa Thakura"
  variants: ["Шри Харидас Тхакур", "Намачарья Харидас (B, T)", "Тхакур Харидас (ЧЧ, ЧБ)", "мудрец Харидас (Мурари)", "Брахма-Харидас («Адвайта-пракаша», «Према-виласа»)", "Srila Namacharya Hari Das Thakur (T)"]
  facts: [F1]
kind: associate
circle: [elders, navadvipa, puri]
period: [P01, P05, P07, P08, P09, P12, P13, P14]
period_note: "Лично — задолго до явления Господа (Бенаполь, Чандапур, Пхулия, Шантипур — P01; Чандапур в lila-db — P05), в Навадвипе с начала санкиртаны (P07–P08), в Шантипуре после санньясы (P09), в Пури с первой Ратха-ятры после южного странствия (P12–P14), в Рамакели (P13); ушёл до сокрытия Господа (P14). После ухода — самадхи (Шриниваса, Нароттама — P15) и явление в киртане в Кхетури (B 1101)."
life:
  appearance:
    date: ""
    tithi: ""
    place: "#budhana"
    conf: "место — Будхан (Джессор): B 858, T 24 (где именно — неясно, F8); год и месяц — только по «Адвайта-виласе» (T 24): аграхаяна 1372 г. Шака (1451) — поздний источник (⚠2); в календаре Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-15) дня явления нет"
    facts: [F8, F11, F14]
  disappearance:
    date: ""
    tithi: "Гаура-чатурдаши месяца Хришикеша — по нашему календарю (в 2026 г. — 25 сентября); T 33 — шукла-чатурдаши бхадры (совпадает)"
    place: "#siddha-bakula"
    conf: "ушёл из этого мира в Сиддха-бакуле (Пури) по своей воле, прижав стопы Господа к груди (ЧЧ Антья 11.53–57); год ни одна книга не называет — незадолго до сокрытия Господа (F115)"
    facts: [F14, F113, F114, F115, F116, F117, F118]
  samadhi: [{place: "#haridasa-samadhi", facts: [F120, F121, F125, F126]}]
origin:
  places: ["#budhana"]
  family: []
  varna: "родился в мусульманской семье (B 858, T 20; ЧЧ, ЧБ); по T 24 «по некоторым источникам» — брахман (Сумати и Гаури), воспитанный мусульманами; по «Адвайта-виласе» — сын Ханауллы Кази (⚠2). Вайшнав не определяется рождением (ЧБ Ади 16.237–240)"
  facts: [F7, F9, F10, F11]
