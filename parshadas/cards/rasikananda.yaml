id: "@rasikananda"
names:
  ru: "Расикананда Дева Госвами"
  en: "Rasikananda Deva Gosvami"
  variants: ["Расика-Мурари", "Мурари", "Мурари Дас", "Расика", "Расикендра", "Расика-шекхара", "Расика-дева"]
  facts: [F2, F3, F4, Q2]
kind: acharya
circle: [later]
period: [P15]
period_note: "Всё — после сокрытия Господа (P15): род. 1590 (РМ, T, M — пересчёт РМ: ночь на 29.10.1590), ум. 1652 (T, M; по РМ — в 62 года 4 месяца, т. е. пхальгуна 1574 шака ≈ 28.02.1653). Встреча с гуру — в 18 лет (≈ 1608), обращение Дхаренды — «двадцать лет» (РМ Д5.11) ≈ 1610; уход Шьямананды — 1552 шака (РМ Пш13.49). События lila-db (Шьямананда в Уткале, Кхетури) — по ПВ/НВ/БР; их датировка с годом рождения 1590 не сходится (F57)."
sampradaya: {name: "линия Нитьянанды: Гауридас Пандит → Хридая Чайтанья → Шьямананда → Расикананда", facts: [F25, F51]}
life:
  appearance:
    year: 1590
    place: "#rohini-rayani"
    tithi: "ночь Дипавали — амавасья месяца Дамодары при наступлении Гаура-пратипада (накануне Говардхана-пуджи), 18-й день тулы, воскресенье, третья стража ночи (РМ П4.36–42, с. 15–16); по пересчёту — ночь с 28 на 29 октября 1590 г.; в нашем календаре дня явления нет"
    conf: "год 1512 шака — РМ (с гороскопом; новолуние Дипавали 1590 г. действительно пришлось на воскресенье), T, M; M: 18 картика, ночь Дивали; место — РМ и БР (Маллабхуми, Суварнарекха), T (Мединипур), B (Раньяни — столица отца)"
    facts: [F5, F6]
  disappearance:
    year: 1652
    place: "#remuna"
    tithi: "пхальгуна, пратипада по окончании Шива-чатурдаши (РМ У16.3) = Гаура-пратипад месяца Говинды, через два дня после Шиваратри (наш календарь); по пересчёту от даты рождения РМ — 28.02.1653"
    conf: "год 1652 — T (по скану) и M (1578 шака — расчёт M не сходится); РМ года не даёт: 62 года 4 месяца (У15.37) — начало 1653 г.; T: праздник в Шива-чатурдаши Магхи, 12 дней в Ремуне (в РМ нет)"
    facts: [F42, F43, F44, F46, F120, F122]
  samadhi:
    - {place: "#remuna", kind: "самадхи перед Гопалой (Кширачора-Гопинатхой) — без тела, с его одеждами, украшениями, гирляндами и сандалом (РМ У16.29–32); пушпа-самадхи (T: с семью учениками — в РМ нет)", facts: [F45]}
origin:
  places: ["#rohini-rayani", "#mallabhumi", "#suvarnarekha", "#medinipur", "#cuttack"]
  facts: [F6, F7, F8, F9, F11, F12, F67, F68]
  note: "Сын Ачьюты (Ачьютананды), правителя Маллабхуми, из рода каранов (РМ, T), и Бхавани, дочери Халадхары Паттанаяка, карана из Каттака (РМ); у отца несколько жён и много сыновей, старший брат — Кашинатха Дас (РМ; ≠ M: единственный сын)."
relations:
  - {type: guru, who: "@shyamananda", facts: [F1, F16, F17, F18, F19, F20, F21, F22, F23, F24, F25, F27, F39, F73, F74, F75, F76, F77, F79, F81, F83, F87, F92, F97, F98, F99, F100],
     events: [ev-shyamananda-utkala, ev-narottama-shyamananda-nrisimhapura],
     note: "Главный ученик; гуру назван ему небесным голосом (БР 15.32–33) или Самим Кришной (РМ П14); Шьямананда пришёл из Враджа по велению Говинды (РМ П15); встреча — в Гхантшиле (БР, РМ, T, B; M — Рохини); посвящён в мантру Радхи-Кришны, затем посвящена жена (РМ Д1; M); гуру испытал его (БР 15.52; РМ Д1, Д8); дал ему имя «Тхакур Госаи» (Пш12); Расика удержал его от ухода во Врадж (Пш12); при уходе в Нрисимхапуре (1552 шака) Шьямананда повязал ему ткань и отдал «всю власть» в Шьямананда-мандали (Пш13)."}
  - {type: father, who: "@achyutananda-rayani", facts: [F7, F8, F9, F11]}
  - {type: deity-served, who: "@govinda-gopivallabhapura", facts: [F28, F29, F30],
     note: "РМ: предсказан Шьяманандой (Д3); явлен при жизни Шьямананды по повелению Джаганнатхи, резчиками Рагхунатхой и Анандой, установлен Расикой (Пш10–Пш11); после ухода Шьямананды Расика передал служение Радхананде (Пш14). БР 15.81, ПВ 19.90 — без времени; M, B — при установлении; T 215 — при уходе Шьямананды."}
  - {type: other, who: "@jagannatha-deity", facts: [F97, F112, F114], note: "РМ: велит явить Говинду в Гопиваллабхапуре (Пш10); зовёт Расику на Ратха-ятру, шлёт свою ткань; колесницы трогаются от его прикосновения (У7, У10)."}
  - {type: deity-served, who: "@gopivallabha-raya", facts: [F28, F78, F84],
     note: "Родовое Божество (РМ Д3): Расика вернул Его, отнятое раджой Бханджем, взял с собой при уходе из дома; Шьямананда нарёк Его «Гопиваллабха Рай», а село Кашипур — Гопиваллабхапуром и поставил адхикари Шьямадаси."}
  - {type: spouse, who: "@shyamadasi", facts: [F14, F24, F72, F75, F78, F84], note: "Иччхадеви (БР: Иччха), дочь Балабхадры Даса, правителя Хиджли; при посвящении — Шьямадаси (РМ П10–П12, Д1)."}
  - {type: other, who: "@gopijana-vallabha-dasa", facts: [F66, F89, F120], note: "Автор «Расика-мангалы», сын Расамайи из его круга; поэма начата в 9-ю, закончена в 12-ю анку гаджапати Балабхадры (≈ 1658–1660 по пересчёту издателей); ему и Тулаши Расика открыл повеление уйти (У14)."}
  - {type: other, who: "@gopala-remuna", facts: [F44, F45, F121, F122], note: "РМ: велел сделать себе самадхи у Гопалы; один вошёл в храм и «вместе с телом» скрылся в Гопале; самадхи перед Гопалой (У15–У16). T, M — Кширачора-Гопинатха."}
  - {type: son, who: "@radhananda-gopivallabhapura", facts: [F48, F49, F68, F84, F101], note: "Старший сын; после ухода Шьямананды по общему решению вайшнавов Расика повязал ему ткань и вручил служение Говинде (РМ Пш14)."}
  - {type: relative, who: "@nayanananda-gopivallabhapura", facts: [F49, F51], note: "Внук (B); преемник в линии (T 221)."}
  - {type: lineage-successor, who: "@radha-damodara-gosvami", facts: [F51, F52], note: "M: прямой ученик Расикананды; T, B: ученик Наянананды."}
  - {type: lineage-successor, who: "@baladeva-vidyabhushana", facts: [F41, F51, F52], note: "Баладева — в его линии; комментарий на «Шьямананда-шатаку»."}
  - {type: disciple, who: "@vaidyanatha-bhanja", facts: [F38, F85, F86, F93], note: "Раджа в Раджгархе с братьями; диспут, отказ от убийства животных — «милостыня» Расике (РМ Д12–Д16); принимает его в Банпуре (Пш7)."}
  - {type: co-worker, who: "@damodara-yogi", facts: [F26, F31, F88], event: ev-shyamananda-utkala, note: "Посвящён Шьяманандой в Чакулии при Расике — «первые два ученика» (РМ Д1); по БР — после ухода из Раяни; в Раньяни (B) / Рохини (M); праздник в Дхаренде (БР, T)."}
  - {type: lineage-predecessor, who: "@hridaya-chaitanya", facts: [F25, F51, F88, F90, F100], note: "Хридаянанда приезжает в Дхаренду и благословляет Шьямананду, Расику и Дамодару (РМ Д11); пляшет на весенней расе в Гопиваллабхапуре (Пш2–Пш5); его уход и арадхана (Пш13)."}
  - {type: lineage-predecessor, who: "@gauridasa-pandita", facts: [F51]}
  - {type: other, who: "@jiva-gosvami", facts: [F25, F53, F73], event: ev-books-leave-vrindavana, note: "Под влиянием Дживы Шьямананда принял мадхурья-бхаву (T); Джива предсказал, что Мурари Дас примет прибежище Шьямананды (ПВ 13, lila-db); передал Шьямананде веление Мадана-Гопалы идти в Уткалу ради Расики-Мурари (РМ П15)."}
  - {type: met, who: "@narottama-dasa", facts: [F55, F57, F63], events: [ev-narottama-shyamananda-nrisimhapura, ev-kheturi-festival], note: "По НВ 4, 6–8: милость в Нрисимхапуре; в Кхетури поручил ему позаботиться обо всех."}
  - {type: met, who: "@srinivasa-acharya", facts: [F47, F57], event: ev-kheturi-festival, note: "Только по lila-db; T: уход их всех — начало «тёмного периода»."}
  - {type: met, who: "@virabhadra", facts: [F57], event: ev-narottama-sacred-thread, note: "Только по lila-db (ПВ 19)."}
  - {type: other, who: "@narahari-chakravarti", facts: [F2, F3, F11, F12, F14, F59, F60, F61, F62, Q2, Q3], note: "«Бхакти-ратнакара» 15 — главный первоисточник T и M (сверено по бенгальскому, этап В); песня Нарахари о Расика-Мурари (БР 15.87–90)."}
  - {type: other, who: "@nityananda-dasa-author", facts: [F3, F35, F54, F56, F64, Q4, Q5], note: "«Према-виласа»: Расикананда и Мурари — два лица (19.88; 20.190–193, «двое брахманов»)."}
