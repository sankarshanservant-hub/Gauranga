character:
  - {trait: "томление по гуру: всю ночь плакал, повторяя имя Шьямананды (БР); после явления Кришны не ел и не спал, в уме поклоняясь Шьямананде (РМ)", facts: [F16, F18, F19, I1]}
  - {trait: "с младенчества — любовь к Имени и «Бхагавате»: плакал при имени Кришны, с детства — лакх имён; отрешённость юноши", facts: [F69, F70, F71]}
  - {trait: "служил вайшнавам любого рождения — ради этого оставил родной дом и наследство", facts: [F34, F78]}
  - {trait: "строгость в служении Божеству: перерыв в служении — «оскорбление» (РМ Д11)", facts: [F84]}
  - {trait: "предан гуру всем существом — и потому наделён его силой", facts: [F27, F33, I2]}
  - {trait: "сила проповеди: обращал пашанди, яванов, разбойников, царей, даже слона (БР 15.84; слонов и тигров — только M)", facts: [F33, F34, F36, F37, F38]}
  - {trait: "всегда опьянён санкиртаной (БР 15.86); «словно безумец» — M", facts: [F34]}
  - {trait: "тщательное служение Божеству Говинды", facts: [F29, F30]}
  - {trait: "гуру-бхакти, которую «не описать одними устами»: принял удары гуру как милость, по письму гуру ночью ушёл через лес; вера в служение вайшнавам", facts: [F59, F64, F76, F81]}
  - {trait: "служил родителям; с детства находил во всём хари-бхакти", facts: [F11, F13]}
