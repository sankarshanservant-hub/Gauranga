open_questions:
  - "Расикананда и Мурари — одно лицо (БР, T) или двое (ПВ; M 215 в перечне) (F3)."
  - "Место встречи с Шьяманандой: Гхантшила (БР, РМ, T, B) или Рохини (M) (F17). Как назван гуру: небесный голос (БР) или явление Кришны (РМ) (F18); встреча на дороге на рассвете (БР) или в собрании раджи (РМ) (F21)."
  - "Жена: Иччха (БР 15.30) = Иччхадеви из Хиджли, при посвящении Шьямадаси (РМ; снимает «≠ M»); Малати (ПВ 20) (F14, F58)."
  - "Когда вверено служение Говинде: при установлении (M, B; РМ — Говинду установил сам Расика при жизни Шьямананды) или при уходе Шьямананды (T 215) (F28, F29, F97)."
  - "Гаджапати: Нрисимхадева, царь Пури (РМ) — или Ганапати/Гаджапати Паташпура (T, M) (F38, F95)."
  - "Уход: один вошёл в храм и «вместе с телом» скрылся в Гопале (РМ) — или вошёл в Божество, а семь учеников оставили тела (T) (F44, F45)."
  - "Учитель Баладевы Радха-Дамодара — ученик Расикананды (M) или Наянананды (T, B) (F51, F52)."
  - "Год ухода 1652 (T, M), но у M 1578 Шака ≈ 1656; по РМ — 62 г. 4 мес., т. е. начало 1653 г. (внутренний счёт РМ не вполне сходится); путь в Ремуну — Баншда (РМ, ≈ T «Вамшадаха») и Сарата (РМ, M); день — пратипада после Шива-чатурдаши в пхальгуну (РМ) = Гаура-пратипад Говинды (календарь); T — Шива-чатурдаши Магхи (F42, F43, F46)."
  - "Год рождения 1590 и участие в празднике в Кхетури (ПВ, НВ) (F57)."
  - "Каста: каран (РМ П3, T) или брахман (ПВ 20.191) (F9, F3)."
