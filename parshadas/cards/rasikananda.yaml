open_questions:
  - "Расикананда и Мурари — одно лицо (БР, T) или двое (ПВ; M 215 в перечне) (F3)."
  - "Место встречи с Шьяманандой: Гхантшила (БР, РМ, T, B) или Рохини (M) (F17). Как назван гуру: небесный голос (БР) или явление Кришны (РМ) (F18); встреча на дороге на рассвете (БР) или в собрании раджи (РМ) (F21)."
  - "Жена: Иччха (БР 15.30) = Иччхадеви из Хиджли, при посвящении Шьямадаси (РМ; снимает «≠ M»); Малати (ПВ 20) (F14, F58)."
  - "Когда вверено служение Говинде: при установлении (M, B) или при уходе Шьямананды (T 215); РМ т. 1 — явление Говинды лишь предсказано (F28, F29)."
  - "«Расика-мангала» т. 2 (Пашчима и Уттара вибхаги — поздние годы и уход) не найден: сон, слон и тигры, Ахмед Бег и др., уход в Ремуне по РМ не сверены."
  - "Учитель Баладевы Радха-Дамодара — ученик Расикананды (M) или Наянананды (T, B) (F51, F52)."
  - "Год ухода 1652 (T, M), но у M 1578 Шака ≈ 1656; путь в Ремуну — из Вамшадахи (T) или Сарата-грамы (M); праздник — Шива-чатурдаши Магхи (T) / Гаура-пратипад Говинды (календарь) (F42, F43, F46)."
  - "Год рождения 1590 и участие в празднике в Кхетури (ПВ, НВ) (F57)."
  - "Каста: каран (РМ П3, T) или брахман (ПВ 20.191) (F9, F3)."
