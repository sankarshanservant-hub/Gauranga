  - {who: "противники: бхунья Уддханда; пандиты-мимамсаки Хиджли; раджа Рамачандра Дхал (его сын — ученик); кол-вождь на пути в Нагпур (обращён); ходжа падшаха (РМ У3–У5, У11–У12)", type: opposed, facts: [F106, F108, F110, F115, F117]}
