open_questions:
  - "Шрихатта: дом дяди по матери (B) или родная деревня (M); чтение названия — Будан/Буран или Буранги (Бадуна у M) (F9)."
  - "Переселение в Навадвип — «позже» (B) или после смерти отца (M) (F11)."
  - "Когда поселился в Тамлуке: после санньясы Господа (B 189, «иные говорят», с «?»), «в конце концов» (T) или после ухода Махапрабху (M, «Тамала») (F37)."
  - "Ведущий певец на Ратха-ятре: по B 193 — Васудева с братьями; по ЧЧ Мадхья 13.42–43, T, M и B 847 — Говинда, Васудева подпевает (F35)."
  - "Пересказ пады «Ки кахиба…» у M расходится с текстом у B (Кумары, «десять сторон», концовка-призыв) (F22)."
  - "«Васудева» при Кази-далане (ЧБ Мадхья 23.209, B 848) — Гхош или Датта? (см. «Не взято»)."
  - "Нумерация ветвей у M (82–84) не совпадает с подзаголовками нашего перевода ЧЧ (F5)."
