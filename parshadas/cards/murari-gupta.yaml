open_questions:
  - "Место рождения: Шрихатта (ЧБ Ади 2.35; B, T) или Радха-деша (ЧЧ Ади 13.61) (F8, ⚠1)."
  - "Возраст: почти ровесник Господа (B) или несколько старше (T) (F11)."
  - "Где и когда — «Рамаштака» и благословение: в Навадвипе до санньясы (ЧЧ Ади 17.69, «Кадача» 2.7, Лочан, Карнапура) или в Шантипуре ок. 1514 г. (ЧБ Антья 4; B 778) — или в обоих случаях (F43, F80, ⚠3)."
  - "Кто объяснил сон о Нитьянанде: «друг Рамы» ЧБ Мадхья 3.157 — Господь (наш перевод) или Мурари (B 91) (F64, ⚠4)."
  - "Надёжность печатного текста «Кадачи» и её дата (1435 Шака — раньше части событий) (F29, F30, ⚠5)."
  - "Год и место ухода неизвестны; дата — шарад-пурнима (T = календарь ШЧСМ) (F97)."
