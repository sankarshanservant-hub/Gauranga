character:
  - {trait: "смирение: сердце Господа тает от его кротости; в Пури приходит к Господу с травой в зубах: «не касайся меня»", facts: [F6, F82, I1]}
  - {trait: "безраздельная верность ишта-деве Рамачандре — не может оставить Его стоп даже по слову Господа, и Господь одобряет эту ништху", facts: [F87, F88, F89, F90, F92]}
  - {trait: "бескорыстие: не берёт ни даров, ни денег, кормит семью врачеванием и исцеляет тело и душу", facts: [F63, I6]}
  - {trait: "не мыслит жизни без Господа: решает оставить тело прежде Его ухода", facts: [F58, F59, F60, F61, I5]}
  - {trait: "экстатическая любовь: разбрасывает рис со словами «Ешь, Кришна!», вытирает руки с остатками Господа о голову", facts: [F52, F54]}
  - {trait: "учёность и сдержанность: не вступает в споры, но отвечает Нимаю как равный; не гневается, хоть и «частица Рудры»", facts: [F4, F20, F21, F22]}
  - {trait: "память о Господе как служение: летописец ранних игр", facts: [F25, F26, F30, I7]}
