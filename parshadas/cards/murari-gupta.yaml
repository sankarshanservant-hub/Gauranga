id: "@murari-gupta"
names:
  ru: "Мурари Гупта"
  en: "Murari Gupta"
  variants: ["Гупта (обращение Господа: ЧЧ Мадхья 15.138, 15.153; ЧБ Мадхья 3.44, Антья 4.317)", "вайдья (лекарь) Мурари, «лев среди лекарей» («Кадача» 2.2.11, 2.4.22, 4.17.11)", "«лучший из врачей» (ЧБ Мадхья 10.10–11)", "Мурари Пандит (ЧБ Мадхья 1.70)", "Рамадас — имя, написанное Господом у него на лбу (ЧЧ Ади 17.69)", "Мурари Гупта Тхакур (B)"]
  facts: [F1, F2, F43]
kind: associate
circle: [navadvipa, puri]
period: [P01, P03, P04, P05, P07, P08, P09, P12, P13, P14, P15]
period_note: "Лично — в Навадвипе: учёба у Гангадаса и спор с Нимаем (F19–F23; P04–P05), после Гаи — Вараха в его доме, «Рамадас», махапракаша, ЧБ Мадхья 20 (сон о Нитьянанде, рис и «лекарство», Гаруда, нож), бхава Баларамы в его доме, наставление служить Адвайте (F32–F77; P07); плач после санньясы (F78; P08); Шантипур (F79; P09); ежегодно в Пури — с 1513 г. (F81–F86; P12, P14); Рамакели и Шантипур ок. 1514 г. (F80, F93; P13); после сокрытия Господа — милость Шринивасе и встреча с Нароттамой в Навадвипе (F95–F96; P15). P01 — среди спутников, родившихся прежде Господа (F12); P03 — у Лочана (F24) и в перечне Джаянанды (F13). Пути в Нилачалу с Господом (Лочан) и встреча у Алаланатхи («Карча») — ≠ ЧЧ (⚠6)."
life:
  appearance:
    date: ""
    tithi: ""
    place: "#shrihatta"
    conf: "день и год явления источники не называют (B, T, M); место — Шрихатта (ЧБ Ади 2.35; B, T) ≠ Радха-деша (ЧЧ Ади 13.61, ⚠1); в календаре Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-14) дня явления нет"
    facts: [F8, F97]
  disappearance:
    date: ""
    tithi: "пурнима месяца Падманабхи (≈ ашвина), Шарадия Раса-ятра (шарад-пурнима) — по нашему календарю (26.10.2026)"
    conf: "T 43 — шарад-пурнима, день осенней раса-лилы; календарь ШЧСМ (541/ru): «День ухода Шрилы Мурари Гупты» в Шарадия Раса-ятру — совпадает; B, M дат не дают; год и место ухода неизвестны (жил ещё при Шринивасе и Нароттаме)"
    facts: [F97, F95, F96]
origin:
  places: ["#shrihatta", "#navadvipa", "#mayapur", "#house-murari"]
  family: []
  varna: "вайдья (каста врачей): T — семья аюрведических врачей; «Кадача» 1.1.10 — «сын врача»; ЧЧ Антья 10.140 — среди небрахманов"
  facts: [F8, F9, F10, F13, F16]
  note: "Родители неизвестны (T). Семья переселилась из Силхета в Навадвипу и жила по соседству с домом Господа (T). Дом — в Майяпуре близ Йогапитхи: ныне храм с образами Рамы и Ситы (B); Бхактисиддханта заложил там храм 18.03.1934 и основал «Шрипат Мурари Гупты» (T 259, 269); в первый день Навадвипа-парикрамы ШЧСМ — «Мурари Гупта Бхавана» (F16–F17)."
relations:
  - {type: companion, who: "@mahaprabhu", facts: [F6, F19, F20, F21, F22, F23, F32, F33, F34, F35, F36, F37, F38, F39, F43, F44, F45, F46, F47, F48, F49, F51, F52, F53, F54, F55, F57, F60, F61, F62, F75, F76, F77, F82, F87, F88, F89, F90, I1, I3, I4], events: [ev-nimai-murari-debate, ev-varaha-bhava-murari, ev-murari-ramadasa, ev-murari-sees-rama-mahaprakasha, ev-murari-rice-lord-indigestion, ev-murari-garuda, ev-murari-knife, ev-murari-test-rama-devotion],
     note: "Соученик у Гангадаса (ЧБ Ади 10); Господь любил его, как Рама — Ханумана (ЧБ Мадхья 3.19); Вараха в его доме (ЧБ Мадхья 3; ЧЧ Ади 17.19); видение Рамы на махапракаше, объяснение имени «Гупта» (ЧБ Мадхья 10); «Рамадас» (ЧЧ Ади 17.69); рис, вода-«лекарство», Гаруда, нож (ЧБ Мадхья 20); испытание верности Раме (ЧЧ Мадхья 15.137–157); смирение в Пури (ЧЧ Мадхья 11.152–158) — ⚠Б1–⚠Б5."}
  - {type: deity-served, who: "@rama", facts: [F3, F16, F43, F44, F80, F87, F88, F89, F90, F91, F92], events: [ev-murari-ramadasa, ev-murari-sees-rama-mahaprakasha, ev-murari-test-rama-devotion, ev-anupama-rama-devotion], note: "Ишта-дева — Рамачандра; «Рамаштака» (ЧЧ Ади 17.69; ЧБ Антья 4.315–344; «Кадача» 2.7); в его доме ныне — образы Рамы и Ситы (B 774)."}
  - {type: other, who: "@hanuman", facts: [F3, F44, F45, F90, F91], note: "ГГД 91: Мурари Гупта — Хануман; «Я — Рамачандра, ты — Хануман» (ЧБ Мадхья 10.14); «ты Сам Хануман» (ЧЧ Мадхья 15.156)."}
  - {type: other, who: "@varaha", facts: [F34, F35, F36, F37, F38, F39], events: [ev-varaha-bhava-murari], note: "Господь в бхаве Варахи в его доме — Яджна-Вараха (ЧБ Мадхья 3.42)."}
  - {type: other, who: "@nityananda", facts: [F49, F50, F51, F64, F65, F66, F73, I2], events: [ev-nityananda-first-meeting, ev-nityananda-visits-advaita, ev-murari-dream-nityananda-elder], note: "Сон: Нитьянанда-Халадхара, Господь с опахалом позади (ЧБ Мадхья 20.14–18; T — наоборот, ⚠8); с тех пор кланялся сперва Нитьянанде; «Только Вы понимаете друг друга» (ЧБ Мадхья 4.57); искал Его и отвёл к Адвайте («Кадача» 2.8–2.9; Лочан); = @nityananda F143, F155, F185–F186, F445."}
  - {type: siksha-guru, who: "@advaita", facts: [F42, F77, F80], events: [ev-murari-serve-advaita, ev-shantipura-after-natashala], note: "Господь велел ему служить Адвайте («Кадача» 2.18.25–30; Лочан; Карнапура 11.47); учение о Самости он «слышал от Камалакши» («Кадача» 2.6.26); «Рамаштака» — в доме Адвайты в Шантипуре (ЧБ Антья 4); Адвайта прославил «Кадачу» (4.26.25–26). Тип — по наставлению Господа (siksha условно)."}
  - {type: other, who: "@srivasa", facts: [F30, F49, F51, F57, F67, F72, F77, F95], events: [ev-murari-dream-nityananda-elder, ev-murari-garuda], note: "По повелению Шривасы начал «Кадачу» (1.1.9–12); Гаруда и сон о Нитьянанде — в доме Шривасы (ЧБ Мадхья 20); вместе пришли к Господу перед санньясой (M 89)."}
  - {type: other, who: "@damodara-pandita", facts: [F27, F30, F74, F98], events: [ev-damodara-murari-question, ev-ekamra-bhubaneshvara], note: "Собеседник «Кадачи»: Дамодара спрашивает, Мурари рассказывает (в т. ч. о нирмалье Шивы, 3.9.8–21); через Дамодару «Кадачу» узнал Лочан (M 77; ≠ ЧМ); = @damodara-pandita F40, F58, F62."}
  - {type: other, who: "@gangadasa-pandita", facts: [F19, F20, F21, F80], events: [ev-study-gangadasa, ev-nimai-murari-debate, ev-shantipura-after-natashala], note: "Учитель Мурари и Нимая; с Гангадасом и Шачи пошёл в Шантипур (ЧБ Антья 4.237–238)."}
  - {type: friend, who: "@krishnananda-navadvipa", facts: [F19], note: "Соученик у Гангадаса (ЧБ Ади 8.38)."}
