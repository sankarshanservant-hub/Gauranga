events_note: "ev-murari-test-rama-devotion — рассказ Господа в Пури (ЧЧ Мадхья 15.137–157) о давнем испытании (в lila-db — P07). ev-murari-ramadasa — ЧЧ Ади 17.69, «Кадача» 2.7 (Навадвипа) и ЧБ Антья 4.315–345 (Шантипур, ок. 1514 г.; ⚠3). ev-ekamra-bhubaneshvara, ev-damodara-murari-question — беседы «Кадачи» и ЧМ (Мурари — рассказчик). Только по lila-db и малым первоисточникам: ev-childhood-companions (Джаянанда, F13), ev-lokanatha-sent-to-vrindavana («Према-виласа» 7, F72). Остальные 50+ событий lila-db, где он лишь назван, — в реестре «Не взято»."
