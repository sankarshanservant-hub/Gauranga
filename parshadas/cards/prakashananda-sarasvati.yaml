  - {type: other, who: "@paramananda-kirtaniya", facts: [F41], events: [ev-varanasi-sannyasis], note: "Пел у Бинду-Мадхавы, когда пришёл Пракашананда (ЧЧ Мадхья 25.62; у B — «Парамананда»)."}
  - {type: other, who: "@keshava-bharati", facts: [F16, F22, F26], note: "Пракашананда называет Господа учеником Кешавы Бхарати (ЧЧ Ади 7.66; Мадхья 17.116); Господь из ветви «Бхарати» считает ветвь «Сарасвати» высшей («Анубхашья» к Ади 7.64)."}
  - {type: other, who: "@shankaracharya", facts: [F29, F30, F38], note: "Последователь его школы; по ЧЧ Ади 7.109–136 Господь показал косвенность его толкований, а сам Пракашананда, уже обращённый, признал, что Шанкара исказил сутры ради адвайта-вады (Мадхья 25.45–48; ⚠Б3)."}
  - {type: other, who: "@sarvabhauma", facts: [F16, F57], note: "В насмешках: «и Сарвабхаума, говорят, обезумел от Чайтаньи» (ЧЧ Мадхья 17.119); T 178 — обращение Сарвабхаумы и Пракашананды больше спасения Джагая и Мадхая."}
  - {type: other, who: "@murari-gupta", facts: [F8, F9], events: [ev-varaha-bhava-murari, ev-murari-dream-nityananda-elder], note: "В его доме Господь дважды обличил Пракашананду (ЧБ Мадхья 3.35–40, 20.31–40). = @murari-gupta F37, F53."}
  - {type: other, who: "@prabodhananda-sarasvati", facts: [F56, F57, I6],
