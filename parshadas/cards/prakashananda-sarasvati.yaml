teachings_note: "Получил от Господа: Веданта-сутра — слово Бога, Брахман — Бхагаван, паринама-вада, пранава, самбандха-абхидхея-прайоджана (ЧЧ Ади 7.106–146; F29–F31); «Бхагаватам» — естественный комментарий к «Брахма-сутре», чатух-шлоки, «изучай „Бхагаватам“ и пой имя Кришны» (Мадхья 25.89–152; F46)."
