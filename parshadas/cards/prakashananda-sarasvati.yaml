  - {type: other, who: "@tapana-mishra", facts: [F20, F34, F41], events: [ev-kashi-tapana-mishra, ev-varanasi-sannyasis],
     note: "Вместе с Чандрашекхарой просил Господа о милости к хулителям (Ади 7.49–51); ликовал (7.153); пел у Бинду-Мадхавы (Мадхья 25.62)."}
  - {type: other, who: "@sanatana-gosvami", facts: [F20, F34, F41, F46, F48], events: [ev-sanatana-kashi-instruction, ev-varanasi-sannyasis],
