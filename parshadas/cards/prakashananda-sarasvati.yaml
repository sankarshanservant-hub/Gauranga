  - {type: other, who: "@lala-dasa", facts: [F56], note: "Его «Бхакта-мала» (с. 358) отождествила Пракашананду с Прабодханандой — ошибка (B 607, 888)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F2, F5, F7, F10, F11, F39, F56, F57],
