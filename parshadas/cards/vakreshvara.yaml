open_questions:
  - "Место рождения — Гуптипара (только M) (F14)."
  - "Дата ухода — шукла-шаштхи Ашадхи (T, M); B молчит, в нашем календаре дня нет (F62)."
  - "Как он пришёл к Девананде: сам, из милости (B), «по воле судьбы» (T) или Девананда пришёл на киртан в дом другого преданного (M) (F25)."
  - "Кто установил Радхаканту в доме Каши Мишры: при Гопале Гуру (B; M pdf 65), сам Вакрешвара (M 238) или Господь передал служение Гопале Гуру (T) (F48)."
  - "Отождествление: Анируддха с вошедшей Шаширекхой (ГГД) и Тунгавидья (паддхати; ГГД 163 — Тунгавидья = Прабодхананда) (F3–F8)."
  - "Время написания «Гаура-кришнодаи»: конец XVII в. Шака, 1680 Шака (B) — у M «17-й год эры Гауры» (F60, F61)."
  - "Ветвь Чайтаньи или Гададхары (T 62) (F11)."
