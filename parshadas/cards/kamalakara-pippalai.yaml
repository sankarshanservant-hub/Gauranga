  - {trait: "детское чувство пастушка и радость санкиртаны (ванданы); день и ночь пел славу Радхи и Кришны («Вайшнавачара-дарпана»)", facts: [F4, F7]}
  - {trait: "устроитель: расчистил джунгли Махеша и создал образцовое селение (только T)", facts: [F21]}
