open_questions:
  - "Чья «Виджая-кханда» говорит, что Нитьянанда дал ему Панихати, — источник не найден (⚠10)."
  - "Видьюнмала — дочь Камалакары и жена Судхамаи (НВВ, B, T) или жена Ядунатхи/Ядунанданы (Бхактисиддханта, «Вайшнавачара-дарпана») (⚠3)."
  - "Место явления: Кхалиджули (B, «Анубхашья») или Акна-Махеш («Шрипат-парьятана», T) (⚠5)."
  - "Год ухода 1485 шака (1563) по преданию рода и его присутствие на празднике в Кхетури (БР 10.375) — не сведены (⚠12)."
  - "Одно ли лицо «Пиппалаи» и «Камалакара дас» соседних стихов вандан (ч. 1, 100; ч. 5, 85–86) (⚠7)."
