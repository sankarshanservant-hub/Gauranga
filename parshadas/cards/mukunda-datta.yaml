relations:
  - {type: sibling, who: "@vasudeva-datta", facts: [F3, F15, F52, F53, F54],
     note: "Старший брат; Васудева считал младшего Мукунду старшим, ибо тот раньше обрёл милость Господа (ЧЧ Мадхья 11.138–140); оба — певцы Гауранги (ГГД 140); пел в группе Мукунды на Ратха-ятре."}
  - {type: companion, who: "@mahaprabhu", facts: [F8, F9, F11, F13, F14, F19, F21, F22, F23, F24, F25, F26, F27, F28, F29, F30, F33, F34, F37, F39, F45, F52, F53, F55],
     events: [ev-nimai-challenges-mukunda, ev-mukunda-danda-prasada, ev-mukunda-datta-instruction, ev-sannyasa-katwa],
     note: "Однокашник и друг с детства (ЧЧ Ади 10.40; Мадхья 11.138); главный певец Его киртанов; наказание-милость (ЧБ Мадхья 10) и наставление о двуруком облике (Мурари 2.4; Карнапура); один из пятерых, кому Господь открыл решение о санньясе; благословение: «когда бы Я ни пришёл, ты будешь Моим певцом» (ЧБ Мадхья 10.260)."}
  - {type: friend, who: "@gadadhara-pandita", facts: [F16, F17, F18], events: [ev-gadadhara-initiation-pundarika],
     note: "Неразлучные друзья (ЧБ Мадхья 7.44–45); Мукунда свёл Гададхару с Пундарикой и помог ему принять у того посвящение. = @gadadhara-pandita F38–F41."}
  - {type: friend, who: "@pundarika-vidyanidhi", facts: [F15, F17, F18], events: [ev-gadadhara-initiation-pundarika],
     note: "Земляк из Читтагонга; лишь Мукунда и Васудева знали его истинную славу (ЧБ Мадхья 7.39–43); его стих о милости Кришны (ШБ 3.2.23) открыл прему Пундарики. = @pundarika-vidyanidhi F30–F41."}
  - {type: other, who: "@advaita", facts: [F10, F22, F28, F35], events: [ev-advaita-feast-shantipura],
     note: "С детства — в собрании Адвайты; по ЧБ Мадхья 10.189 — читал с Адвайтой «Васиштху»; Адвайта: «удачливый Мукунда тоже был счастлив наказанием» (ЧЧ Ади 12.41); ел с Ним в Шантипуре (ЧЧ Мадхья 3.106–107). = @advaita F61, F155."}
  - {type: other, who: "@srivasa", facts: [F19, F21, F24], events: [ev-mukunda-danda-prasada, ev-dance-shrivasa-house],
     note: "Пел во дворе Шриваса; Шриваса просил за него на маха-пракаше и передавал его вопрос Господу. = @srivasa F63."}
  - {type: met, who: "@ishvara-puri", facts: [F12], events: [ev-ishvara-puri-navadvipa], note: "Его пение в собрании Адвайты открыло прему неузнанного Ишвары Пури (ЧБ Ади 11.77–81). = @ishvara-puri F29."}
  - {type: other, who: "@gangadasa-pandita", facts: [F8], note: "По B 808 — учился у него вместе с Нимаем (без первоисточника, ⚠5). = @gangadasa-pandita F20."}
  - {type: co-worker, who: "@nityananda", facts: [F32, F33, F37, F41, F50], events: [ev-sannyasa-katwa, ev-journey-to-puri, ev-danda-broken, ev-messenger-to-gauda-after-south],
     note: "Вместе при санньясе и на пути в Пури; вместе решили послать Кала Кришнадаса в Гауду (ЧЧ Мадхья 10.67)."}
  - {type: co-worker, who: "@chandrashekhara-acharya", facts: [F33, F34, F46], events: [ev-sannyasa-katwa, ev-chandrashekhara-drama],
     note: "Совершили обряды санньясы (ЧЧ Ади 17.272–273); шли за Господом по Радха-деше (Мадхья 3.11); в действе у Чандрашекхары Мукунда начал киртан. = @chandrashekhara-acharya F20, F37."}
  - {type: co-worker, who: "@jagadananda-pandita", facts: [F37, F43, F50], events: [ev-journey-to-puri, ev-sarvabhauma-deliverance], note: "Спутники на пути в Пури; стихи Сарвабхаумы: Джагадананда принёс лист, Мукунда переписал шлоки на стену (ЧЧ Мадхья 6.251–252)."}
  - {type: co-worker, who: "@damodara-pandita", facts: [F37, F43, F50], events: [ev-journey-to-puri, ev-return-from-south], note: "Спутники на пути в Пури и в ожидании Господа с юга. = @damodara-pandita F5–F8, F12–F13, F18."}
  - {type: friend, who: "@gopinatha-acharya", facts: [F41, F42], events: [ev-sarvabhauma-meeting, ev-gopinatha-sarvabhauma-debate], note: "Знакомый по Навадвипе; встретил его у Львиных врат, через него — к Сарвабхауме; вместе осуждали майявадские речи Сарвабхаумы (ЧЧ Мадхья 6)."}
  - {type: other, who: "@sarvabhauma", facts: [F42, F43], events: [ev-sarvabhauma-deliverance], note: "Гневался на его майявадские речи («это и есть его милость к нему» — «Анубхашья»); сберёг его две шлоки о Господе."}
  - {type: other, who: "@brahmananda-bharati", facts: [F51], events: [ev-brahmananda-bharati-deerskin], note: "Доложил Господу о его приходе; диалог «где же Бхарати Госвами?» (ЧЧ Мадхья 10.151–156)."}
  - {type: other, who: "@kala-krishnadasa", facts: [F50], events: [ev-messenger-to-gauda-after-south], note: "Вместе с Нитьянандой, Джагаданандой и Дамодарой решили послать его вестником в Гауду."}
  - {type: co-worker, who: "@murari-gupta", facts: [F29, F48, F53, F54], events: [ev-narendra-jala-keli, ev-mukunda-datta-instruction],
     note: "Вместе получили наставление (ЧЧН 1; Мурари 2.4); пели в одной группе на Ратха-ятре; «словно второй Мукунда» шёл с ним в Пури (махакавья 14.28); бились в воде на озере Нарендра (ЧБ Антья 8.123)."}
  - {type: co-worker, who: "@haridasa-thakura", facts: [F35, F46, F53], events: [ev-advaita-feast-shantipura, ev-chandrashekhara-drama, ev-ratha-yatra-gundicha], note: "Звали к трапезе у Адвайты вместе; Харидас — танцор в группе Мукунды на Ратха-ятре."}
  - {type: co-worker, who: "@kashishvara", facts: [F53, F57], events: [ev-ratha-yatra-gundicha], note: "Во главе второго кольца вокруг Господа (ЧЧ Мадхья 13.89)."}
  - {type: met, who: "@yavana-governor-pichhalda", facts: [F55], events: [ev-yavana-governor-boat], note: "Мукунда сказал ему, как послужить Господу: помочь добраться до Ганги (ЧЧ Мадхья 16.190–191)."}
  - {type: met, who: "@raghunatha-dasa", facts: [F56], events: [ev-raghunatha-dasa-joins-lord], note: "Первым увидел его и представил Господу (ЧЧ Антья 6.190)."}
  - {type: other, who: "@chhota-haridasa", facts: [F57], events: [ev-chhota-haridasa-prayaga], note: "Слышал у моря его пение после ухода (ЧЧ Антья 2.153–154)."}
  - {type: other, who: "@svarupa-damodara", facts: [F51, F53, F57], events: [ev-svarupa-paramananda-arrive], note: "Встречал его в Пури; пел в его группе в танце (ЧЧ Мадхья 13.73). = @svarupa-damodara F17."}
  - {type: other, who: "@mukunda-dasa", facts: [], note: "Тёзка, не путать: Мукунда Дас из Шрикханды, придворный врач, отец Рагхунанданы."}
  - {type: other, who: "@mukunda-sanjaya", facts: [], note: "Тёзка, не путать: в его чанди-мандапе Нимай держал школу (ЧБ Ади 10)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F2, F5, F8, F14, F19, F20, F42], note: "«Анубхашья» к ЧЧ Ади 10.40 — родина Чханхара, Мадхукантха (ГГД 140), сводка его лил по ЧБ; пояснения издания ЧБ по «Гаудия-бхашье» к Мадхья 10."}
