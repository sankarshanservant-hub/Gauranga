period_note: "Лично — с юности в Навадвипе (однокашник Нимая, собрание Адвайты, P05) через киртаны у Шриваса и наказание-милость (P07), санньясу в Катве (P08), путь в Пури (P09) и первые годы в Нилачале (P10–P12), путь Господа в Гауду (P13), ежегодные приходы из Гауды (P14). P01 (нисхождение спутников, lila-db ev-associates-descend) — лишь перечень."
