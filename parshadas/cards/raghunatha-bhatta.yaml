period_note: "Лично — мальчиком в Каши, когда Господь жил у Чандрашекхары и ел у Тапаны Мишры (P13); дважды по восемь месяцев в Пури и посылка во Вриндаван (P14); во Вриндаване — чтение «Бхагаваты» в собрании Рупы, храм Говинды, свита Рупы в Матхуре; ушёл до прихода Шринивасы (P15). Встреча Господа с его отцом в Восточной Бенгалии (P05) — до его рождения, только в рассказе."
