open_questions:
  - "Год явления: 1505 (кадача, M), около 1503 (T), около 1425 Шака (Бхактисиддханта) (F29, F30)."
  - "Год ухода: 1579 (B, M) или 1579/1580 (T); титхи: ашвина шукла-двадаши (панджика, наш календарь) или джьештха шукла-дашами (кадача) (F29, F31)."
  - "Сколько Господь был в Каши на обратном пути: два месяца (ЧЧ, B, T) или десять дней (M) (F22)."
  - "Что Господь надел ему на шею при первом прощании: прасадную гирлянду (B), бусы (T) или гирлянду туласи (M) (F49); и что он носил позже — гирлянду и бетель (B, M) или гирлянду и бусы (T) (F71)."
  - "Кто сделал украшения Говинде: ученик (B) или он сам (T, M) (F68)."
  - "ГГД 185: относится ли «хижина у Радха-кунды» к нему (B, T) или к Рагхунатхе Дасу (наш перевод) (F2)."
  - "Сон Тапаны Мишры: Гаура как Бхагаван (B), брахман (T) или бог (M) (F13)."
