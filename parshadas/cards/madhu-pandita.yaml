open_questions:
  - "Кто явил Гопинатху: Мадху Пандит (БР 2, «Садхана-дипика», «Анубхашья» к Ади 12.87) или Парамананда Госвами вместе с ним (B; «Абхидхана» — обрёл Парамананда, Мадху — первый служитель) (⚠3)."
  - "Явление Говиндадевы: Йогапитха у Гома-тилы (БР 2) или Говинда-кунда (B, без источника) (⚠4)."
  - "Сатиртха — Бхавананда (БР 13.320) или Мадхавачарья (B 1095) (⚠5); «Гопинатха Адхикари» B и M — его звание, а не отдельное лицо."
  - "Встречал ли он Махапрабху лично (ванданы — «слуга Чайтаньи»); годы жизни и уход неизвестны, в календаре ШЧСМ его дней нет (⚠6)."
  - "Саимбона: кто установил там Нандадулала (⚠7)."
