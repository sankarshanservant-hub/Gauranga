period_note: "Явление Гопинатхи у Вамшивата отнесено в lila-db к P14 лишь оценочно (brt-0062; ⚠6). Лично во Вриндаване — в эпоху Дживы Госвами (P15): встречает Шринивасу и провожает его с книгами (F18–F19b), Нароттаму (F20), Джахнаву (F21), Вирачандру (F22). Встречал ли он Махапрабху, источники не говорят (ванданы — «слуга Чайтаньи», F23)."
