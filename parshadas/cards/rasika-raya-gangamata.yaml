  - "Причина ухода Божества из Джайпура: бедность брахмана (B 970) или оскорбление и бездетность (B 968, T 218) (⚠1)."
  - "Пришёл ли Он вместе со Шри Радхарани (B 968) или Она — позже (B 970, T молчат) (⚠2)."
