  - "Прежний служитель и кто принёс Божество: брахман Чандра Шарма принёс Его сам (B, T) или Гангамата принесла Его от Кришны Мишры из Джайпура («Анубхашья» к ЧЧ Ади 8.59–60) (⚠5)."
  - "Где дом Сарвабхаумы (ныне матх): у Шветаганги (B) или у Маркандея-сараса в Балукханде («Анубхашья» к Мадхья 6.8) (F29)."
