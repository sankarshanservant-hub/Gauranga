  - {type: other, who: "@jagannatha-deity", facts: [F6], note: "Шри Джаганнатха во сне повелел брахману отвезти Расика Рая к Гангамате в Пурушоттама-кшетру."}
  - {type: other, who: "@radha", facts: [F1, F8, F28], note: "По B 968 брахман принёс Его вместе со Шри Радхарани; ныне — Шри Шри Радха-Расикарай (B 968; T 218); B 970 и T о Её приходе молчат (⚠2)."}
  - {type: other, who: "@sarvabhauma", facts: [F28, F29], note: "В матхе Гангаматы (по T — прежний дом Сарвабхаумы) рядом с Расика Раем — Дамодара-шалаграма, которому служил Сарвабхаума."}
