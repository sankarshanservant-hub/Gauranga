relations:
  - {type: opposed, who: "@mahaprabhu", facts: [F9, F10, F13, F18], events: [ev-nagara-kirtana-kazi],
     note: "Разбил мриданг и запретил киртан (ЧБ Мадхья 23.101–107; ЧЧ Ади 17.124–128); Господь с ночным шествием пришёл к его дому."}
  - {type: nephew, who: "@mahaprabhu", facts: [F5, F21, F29],
     note: "«Родство по деревне»: Ниламбара Чакраварти — Кази «дядя» (чача), Господь — его «племянник» (ЧЧ Ади 17.148–150); Господь зовёт его «дядя» (17.172)."}
  - {type: other, who: "@mahaprabhu", facts: [F24, F26, F29, F39, F41, F42, F44], events: [ev-nagara-kirtana-kazi],
     note: "Милость и наставление (не посвящение): Господь наставил его (ЧЧ Ади 17.152–218; «Гаура-кришнодая» 5.44 — «наставил в истинном писании»), даровал милость, и Кази молил о преданности (17.220)."}
  - {type: uncle, who: "@nilambara-chakravarti", facts: [F5], note: "По деревне — «дядя» (чача) Кази (ЧЧ Ади 17.148; «Анубхашья»); ≠ T 39 — «брат» Ниламбары (⚠5)."}
  - {type: other, who: "@nrisimha", facts: [F31, F32], note: "Во сне Нрисимхадева вскочил ему на грудь и пригрозил (ЧЧ Ади 17.178–186; «Анубхашья» к 17.179); БР 2.310 — Господь стал Нрисимхой."}
  - {type: subject-of, who: "@gauda-sultan", facts: [F4, F35], note: "Подчинён падишаху Гауды (Хусейн Шаху — «Анубхашья» к ЧЧ Ади 17.195); по АПБ и B — его родственник; по «Анубхашье» — «говорят, был его гуру»; БР 2.298 — царь очень его любил."}
  - {type: other, who: "@haridasa-thakura", facts: [F15], note: "Вёл переднюю группу шествия (ЧЧ Ади 17.136; по ЧБ 23.142 — среднюю)."}
  - {type: other, who: "@advaita", facts: [F15, F41], note: "Вёл одну из групп шествия (ЧЧ 17.136 — среднюю; ЧБ 23.141 — переднюю); B 734 — Кази стал другом и поклялся не мешать киртану."}
  - {type: other, who: "@nityananda", facts: [F12, F15], note: "Танцевал рядом с Господом в шествии (ЧЧ 17.137); пашанди: «Кази положит конец веселью Нитьянанды» (ЧБ 23.113); = @nityananda F210, F449."}
  - {type: other, who: "@srivasa", facts: [F9, F15, F47], note: "По ЧБ 23.143 — вёл последнюю группу; T — мриданг разбит у дома Шривасы, Кхол-бхангар данга = Шривас-ангана (⚠1); = @srivasa F81, F113."}
  - {type: other, who: "@shridhara", facts: [F42, F48, F49], note: "Кази шёл с киртаном до двора Шридхары и там повернул назад (АПБ к ЧЧ Ади 17.70); дом Шридхары — близ гробницы Кази (B 771; T 58, ⚠10); = @shridhara F11, F42, F65."}
  - {type: other, who: "@gadadhara-dasa", facts: [I3, F44], note: "B 137 сравнивает: как Господь заставил Чанд Кази произнести имя Хари, так Гададхара дас — кази своей деревни (тёзка, не он); = @gadadhara-dasa F35."}
  - {type: other, who: "@vrindavana-dasa", facts: [F19, F45], note: "ЧБ Мадхья 23 подробно описывает шествие и разгром дома, но не беседу; ЧЧ Ади 17.138, 142 отсылает к нему и восполняет беседой."}
  - {type: other, who: "@bhaktivinoda", facts: [F5, F7, F10, F28, F42], note: "«Амрита-праваха-бхашья» к ЧЧ Ади 17: дом рода Кази в Брахмана-пушкарини, три «писания яванов», Кази повернул назад у двора Шридхары."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F2, F3, F6, F7, F11, F46, F47], note: "«Анубхашья» к ЧЧ Ади 17 и «Гаудия-бхашья» к ЧБ Мадхья 23: фаудждар, имена, потомки, гробница, улица Вамана-пукура, Кхол-бхангар данга; T 269 — центр у самадхи Чанд Кази."}
  - {type: other, who: "@jagannatha-dasa-babaji", facts: [F47], note: "Указал место, где Кази разбил мриданг (T 223; = @srivasa F113)."}
