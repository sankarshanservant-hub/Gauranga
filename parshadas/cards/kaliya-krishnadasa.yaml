period_note: "Время жизни источники не называют. По lila-db — в перечнях спутников Нитьянанды в Гауде (vv-0061 — ev-nityananda-preaching-gauda, vv-0073 — ev-associates-of-nityananda-wonders, условно P12) и в ветвях Нитьянанды ЧЧ Ади 11.37 (cc-0157, PX). Проповедь в Пабне, брак, сыновья, путь во Вриндаван — по преданию потомков, без дат (F17–F27). После сокрытия Господа (P15) — лишь если он тот «Кришнадас из Акаихата», что встречал спутников Джахнавы на пути в Кхетури (БР 10.409; НВ 6.264–268; T 95), — тождество спорно (F32, ⚠6), в period не включено."
