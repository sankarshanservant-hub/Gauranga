open_questions:
  - "Порядок переездов: Ариядаха → Катва (B 815) или Навадвипа → Катва → Эриядаха (B 135, T, M); где он скрылся — по «Нароттама-виласе», «Према-виласе», M — в Катве (⚠2)."
  - "Самадхи: Катва (B 817, T) или Ариядаха (M по Бхактиведанте Свами; B 140) (⚠9)."
  - "День ухода: кришна-аштами картики (B, T, «Према-виласа») или светлая аштами (M; календарь ШЧСМ — Гопаштами) (⚠8)."
  - "«Праздник, данный Дасом Гададхарой в Катве» (B 931) — его собственный или поминальный по нему (⚠7)."
  - "Тот ли «Гададхара» в ЧЧ Антья 10.141 (⚠10)."
