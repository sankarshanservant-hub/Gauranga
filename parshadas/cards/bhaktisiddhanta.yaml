relations:
  - {type: father, who: "@bhaktivinoda", facts: [F3, F8, F11, F13, F14, F15, F16, F23, F33, F38, F39, F40, F41, F42, F45, F46, F57, F69, F168, F177, F238, F244, F245, F246, Q6], note: "Отец и шикша-гуру: посвятил в Имя и мантру Нрисимхи, научил поклонению Курме, брал в паломничества (Каши, Праяга, Гая; Пури, Агартала); позволил (T — велел) принять дикшу у Гауракишоры; послал на собрание в Балигхаи (1911). После его ухода — редактор «Саджджана-тошани», установил его образ в Годруме (1919), пушпа-самадхи у Радха-кунды (1935). = @bhaktivinoda F17, F67, F107, F152, F154, F202, F203."}
  - {type: mother, who: "@bhagavati-devi", facts: [F3, F8, F9, F71], note: "Четвёртый ребёнок; ушла 23.06.1920, ровно через шесть лет после Бхактивиноды (T)."}
  - {type: guru, who: "@gaurakishora-dasa-babaji", facts: [F38, F39, F58, F130, F182, F190, F239, F240, F241, F242, F243, F269], note: "Первая встреча — 1898, Свананда-сукхада-кунджа; бхагавати-дикша в магху 1900 г., имя Варшабханави-даита Дас; единственный ученик; совершил его последние обряды (Нутан-чора, Кулия, 1915) и перенёс самадхи в Чайтанья Матх (1932). = @gaurakishora-dasa-babaji F29, F56, F64."}
  - {type: other, who: "@jagannatha-dasa-babaji", facts: [F247], note: "Излил на него любовь в «Бхакти-бхаване»; велел составить вайшнавскую панджику («Навадвипа-панджика»). = @jagannatha-dasa-babaji F49–F50."}
  - {type: other, who: "@vamshidasa-babaji", facts: [F46, F249], note: "Бхактивинода познакомил их в Навадвипе; кланялся ему издали, ученикам общаться не позволял."}
  - {type: disciple, who: "@bhakti-vilasa-tirtha", facts: [F66, F150, F199, F260, F261, F263, F264, F265, F266, F267], note: "Кунджавихари Видьябхушана — генеральный секретарь миссии, «другой его образ»; в «Guiding Principles» (31.12.1936) назначен управлять миссией."}
  - {type: sannyasa-disciple, who: "@bhakti-pradipa-tirtha", facts: [F74, F75, F136], note: "Ученик Бхактивиноды; первый санньяси «Вишва-вайшнава-раджа-сабхи» (1.11.1920); послан в Европу (1933)."}
  - {type: disciple, who: "@bhakti-hridaya-bona", facts: [F122, F136, F139, F140, F166], note: "Проповедник в Лондоне и Европе (1933–1935); B: перед королём и королевой Англии 20.07.1933."}
  - {type: disciple, who: "@shridhara-maharaja", facts: [F186, F259, F274, F278], note: "Посвящён в 1927 г., санньяса 1930 г. с именем «Бхакти Ракшака»; «после моего ухода останется хотя бы один, кто представит мои выводы»; в последний день пел по его просьбе «Шри Рупа-манджари-пада»."}
  - {type: disciple, who: "@bhakti-pramoda-puri", facts: [F259], note: "Пранавананда Брахмачари; пришёл в 1915 г.; записывал лекции 13 лет."}
  - {type: disciple, who: "@bhakti-dayita-madhava", facts: [F250, F259], note: "Восстановил место его явления в Пури; устроитель празднования 100-летия."}
  - {type: disciple, who: "@bhaktivedanta-svami", facts: [F259, F280], note: "Упомянут среди учеников (T 290, гл. о Шридхаре Махарадже); N I.3 — лишь он полностью исполнил завет о проповеди на Западе; подробнее — @bhaktivedanta-svami."}
  - {type: other, who: "@madhusudana-gosvami-sarvabhauma", facts: [F52, F245], note: "Вриндаванский учёный: на собрании в Балигхаи (1911) дал ему слово; через год назвал его достойным преемником Бхактивиноды."}
  - {type: other, who: "@manindra-chandra-nandi", facts: [F42, F54, F73, F83], note: "Махараджа Касимбазара: слушал его в Пури (1902–03); собрание в Касимбазаре (1912/1922 — ⚠2) и четырёхдневный пост; обещал пособие на «Вайшнава-манджушу», но не дал."}
  - {type: lineage-predecessor, who: "@rupa-gosvami", facts: [F68, F89, F108, F155, F192, F193, F212, F224, F253, Q4], note: "Цель — стать пылью стоп рупанугов; принял на себя неоконченное дело Рупы и Санатаны; «не отличен от Рупы и Сварупы» (объявление «Гаудии»)."}
  - {type: lineage-predecessor, who: "@svarupa-damodara", facts: [F192, F193]}
