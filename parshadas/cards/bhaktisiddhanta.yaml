    place: "#kolkata"
    conf: "B 1129: 1.01.1937; T: 5.30 утра, «четверг, 1 января»; объявление «Гаудии» (T): конец ночи на четверг, пятница утром 1.01.1937; B 1133: «четверг, 31.12.1936 — день явления лилы сокрытия» — ушёл на рассвете после ночи с четверга на пятницу (⚠13); место — Калькутта, Шри Гаудия-матх в Багбазаре (T: вернулся в Калькутту 9.12.1936; Багбазар прямо — лишь в поздних книгах, F279); календарь ШЧСМ (проверено 2026-11-23): Нараяна-маса, кришна-чатуртхи (27.12.2026) — совпадает"
    facts: [F184, F185, F186, F187, F188, F189, F190, F191, F261, F278, F279]
