open_questions:
  - "Дата санньясы: 27 марта 1918 (B и «Сарасвати-джаяшри», 13 чайтры 1324, пхалгуни-пурнима); «7 марта» T и N — ошибка (⚠5)."
  - "Касимбазар: 1912 (T и «Сарасвати-джаяшри»); «1922» B — описка (⚠2)."
  - "Обет Имени: «сто крор» (B) / «миллиард (десять крор)» (T) (⚠1); первый ученик — 1906 (T) или 1909 (N)."
  - "Место ухода — Багбазар Гаудия-матх: прямо лишь в поздних книгах (F279); самадхи — Шри Чайтанья Матх, Майяпур (B 1135 и поздние книги)."
  - "Бенгальский оригинал последних наставлений (Q4) и изречений (Q8) — в репозитории нет (⚠21, ⚠Б18)."
