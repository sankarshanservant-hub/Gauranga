period_note: "XIX–XX вв. (1874–1937): ачарья гаудия-сампрадаи, сын Бхактивиноды Тхакура, ученик Гауракишоры Даса Бабаджи; основатель Шри Чайтанья Матха и Гаудия-матхов; в лилах Господа не участвует, событий lila-db нет."
sampradaya: {name: "Брахма-Мадхва-Гаудия-сампрадая (Рупануга): бхагавати-дикша от Гауракишоры Даса Бабаджи (магха 1900), шикша — от Бхактивиноды Тхакура; тридандина санньяса 1918 г. (по примеру Рамануджа-сампрадаи); 29-й в парампаре от Кришны (Санъял 1933), «девятый от Шри Чайтаньи» («Гаудия»)", facts: [F39, F48, F59, F60, F192, F275]}
life:
  appearance:
