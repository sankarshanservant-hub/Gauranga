  - {type: companion, who: "@nityananda", facts: [F14, F15, F23], events: [ev-nityananda-panihati-abhisheka], note: "Под киртан трёх братьев плясал Нитьянанда (ЧБ Антья 5.259; Панихати)."}
  - {type: deity-served, who: "@gopinatha-agradvipa", facts: [F24, F25, F26, F30, F31, F32, I2],
     note: "Явил Гопинатху в Аградвипе из чёрного камня по указанию Господа; Гопинатха во сне обещал Сам совершить по нему пинду и поныне ежегодно предлагает её в день его ухода (⚠Б2, ⚠Б4)."}
  - {type: co-worker, who: "@vakreshvara", facts: [F20], event: ev-ratha-yatra-gundicha, note: "Танцор его группы на Ратха-ятре."}
  - {type: co-worker, who: "@chhota-haridasa", facts: [F20], note: "Подпевал в его группе (у B — «(Чхота?) Харидас»)."}
  - {type: co-worker, who: "@raghava-pandita", facts: [F20, F23], note: "Подпевал в его группе; в доме Рагхавы в Панихати братья пели Нитьянанде."}
  - {type: co-worker, who: "@srivasa", facts: [F17, F21, F22], event: ev-dance-shrivasa-house, note: "Вели группы киртана во дворе Шривасы (ЧБ Мадхья 8.141–142); вместе шли в Пури на третий год (ЧЧ Мадхья 16.16)."}
  - {type: co-worker, who: "@mukunda-datta", facts: [F17, F35], note: "Вёл другую группу в день Хари-васары; герой его пады о вести Гададхары (T)."}
  - {type: other, who: "@gadadhara-pandita", facts: [F35], note: "В паде «Пранера Мукунда хе» Гададхара приносит Мукунде весть о санньясе."}
  - {type: other, who: "@srinivasa-acharya", facts: [F38], event: ev-srinivasa-schooling, note: "Рассказывал мальчику Шринивасе об играх Гауры (B 661; БР 2.204); благословил младенца (T 204); милость (M 188)."}
  - {type: other, who: "@narottama-dasa", facts: [F39], event: ev-kheturi-festival, note: "Среди спутников, явившихся с Господом на киртане Нароттамы в Кхетури (БР 10, по M)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F12, F16, F25, F26, F32, I1], note: "«Гаудия-бхашья»: кая-вьюха ашрая-виграхи; «певцы Вриндавана»; «Анубхашья» к ЧЧ Ади 11.15: Гопинатха в Аградвипе и пинда."}
  - {type: other, who: "@bhaktivedanta-svami", facts: [F7, F24], note: "По комментарию к ЧЧ (у M): основал храм Гопинатхи в Аградвипе."}
