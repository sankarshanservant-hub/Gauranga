period: [P07, P08, P12, P15]
period_note: "Лично — в Навадвипе (киртан во дворе Шривасы, нагара-киртан в день Кази — P07; пада о санньясе — P08), в Пури (остался с Господом, когда Нитьянанда ушёл в Гауду; ведущий четвёртой группы на Ратха-ятре; ежегодные хождения из Гауды — P12) и в Панихати с Нитьянандой (P12, ЧБ — ⚠5 реестра); после ухода Господа — в Аградвипе, близ Чакханди (детство Шринивасы — P15). В Кхетури (P15) — среди спутников, явившихся с Господом (БР 10, по M). Пады — lila-db/lilas/padas.yaml."
