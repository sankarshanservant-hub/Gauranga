open_questions:
  - "Родина, семья, годы жизни, день и место ухода неизвестны; в календаре ШЧСМ его дней нет."
  - "Кто решил уйти из Враджа и почему согласился Господь: ЧЧ — Балабхадра с санодия-брахманом, Господь — ради преданного; T 102 и B 1041 — из почтения к духовному брату гуру; B 892 — трое (⚠3)."
  - "Сколько спутников было из Гауды: «лишь Балабхадра» (ЧЧ Мадхья 1.238, T 108) или с ним слуга (ЧЧ 17.17); «Гаура-кришнодая» 14.57 — трое (⚠4)."
