  - {type: guest, who: "@anupama", facts: [F41, F42], events: [ev-rupa-prayaga], note: "Вместе с Рупой получил от него остатки трапезы Господа (ЧЧ Мадхья 19.59)."}
  - {type: host, who: "@vallabha-bhatta", facts: [F42], events: [ev-vallabha-bhatta-adaila], note: "По его просьбе Балабхадра готовил для Господа в Адаиле (ЧЧ Мадхья 19.87). = @vallabha-bhatta F31."}
  - {type: other, who: "@haridasa-thakura", facts: [F46], events: [ev-haridasa-sthavara-jangama-deliverance], note: "Слышал от Балабхадры о спасении существ Джхарикханды (ЧЧ Антья 3.72). = @haridasa-thakura F110."}
