  - {type: other, who: "@raghunatha-bhatta", facts: [F23], events: [ev-kashi-tapana-mishra], note: "Мальчиком массировал стопы Господа после трапезы, приготовленной Балабхадрой (M 148; ЧЧ Мадхья 17.89–90). = @raghunatha-bhatta F21."}
