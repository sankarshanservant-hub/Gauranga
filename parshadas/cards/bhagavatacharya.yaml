open_questions:
  - "Одно ли лицо ученик Гададхары, получивший имя от Махапрабху (ЧБ, ЧЧ Ади 12.79, ГГД), и Бада Шьямадас, ученик Адвайты, получивший имя от Адвайты (ПВ, АП)? «Анубхашья» к Ади 12.58 — Бхагаватачарья был у Адвайты, потом у Гададхары (⚠1)."
  - "Имя «Рагхунатха» — только по Бхактисиддханте («говорят»); не путать с брахманом Рагхунатхой ГГД 200 (⚠2)."
  - "Тот ли он «Бхагавата Ачарья» праздника в Кхетури (ПВ 19, БР 9–10, НВ 6, 8) (⚠4)."
  - "Годы жизни, дни явления и ухода неизвестны; в календаре ШЧСМ его дней нет."
