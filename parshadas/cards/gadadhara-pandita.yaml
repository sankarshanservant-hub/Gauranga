id: "@gadadhara-pandita"
names:
  ru: "Гададхара Пандит"
  en: "Gadadhara Pandita"
  variants: ["Гададхара Пандит Госвами", "Гадаи", "Пандит Госвами (Пандит-госани)", "Гададхара Дев", "Гаура-шакти"]
  facts: [F9, F10]
kind: associate
circle: [panca-tattva, navadvipa, puri]
period: [P02, P04, P05, P07, P08, P09, P10, P12, P13, P14, P15]
period_note: "Лично: рождение (P02; T — Белети, 1486; по ПВ — Навадвипа), детство и учёба с Нимаем, Ишвара Пури (P04–P05), Навадвипа и дикша у Пундарики (P07), санньяса Господа и путь в Пури (P08–P09), Пури: Тота-Гопинатха, «Бхагавата», Валлабха, Каттак (P10–P14), сокрытие Господа, Шриниваса и уход через 11 месяцев (P15). Отождествление с Радхой — вне шкалы."
life:
  appearance:
    date: "1486 (1408 Шака)"
    tithi: "амавасья месяца вайшакха"
    place: "#beleti"
    conf: "по T; M — на год младше Господа; по «Према-виласе» (D) — Навадвипа"
    facts: [F11, F12, F13]
    events: [ev-gadadhara-birth]
  disappearance:
    date: "1456 Шака (по T — 1535)"
    tithi: "амавасья джьяштхи (T 47) ≠ амавасья ашадхи (T 237)"
    place: "#puri"
    conf: "спорно (месяц)"
    facts: [F91, F93, F94, F95]
    events: [ev-gadadhara-departure]
    note: "Через одиннадцать месяцев после сокрытия Господа (F91). B 140 говорит о «самадхи Гададхары Пандита» в Эриядахе — по контексту речь о Дасе Гададхаре ⚠ (F96)."
origin:
  places: ["#beleti", "#chattagrama", "#navadvipa"]
  family: ["@madhava-mishra", "@ratnavati", "@vaninatha-gadadhara"]
  varna: "брахман (варендра, готра Кашьяпа)"
  facts: [F11, F14, F15, F16, F17, F18]
  note: "Из Читтагонга; в 12 лет семья переселилась в Навадвипу (T); M — родители жили по соседству с Джаганнатхой Мишрой в Майяпуре."
relations:
  # семья
  - {type: father, who: "@madhava-mishra", facts: [F14, F18, F41], note: "Варендра-брахман, готра Кашьяпа; друг Пундарики Видьянидхи."}
  - {type: mother, who: "@ratnavati", facts: [F14, F17], note: "Почитала Шачи как старшую сестру (M)."}
  - {type: sibling, who: "@vaninatha-gadadhara", facts: [F15, F98], note: "Младший брат (T); тот ли он Двиджа Ванинатха, служивший Гаура-Гададхаре в Чампахатти (B), — не сказано."}
  - {type: neighbor, who: "@jagannatha-mishra", facts: [F17]}
  - {type: other, who: "@shachi", facts: [F17, F30, F69], event: ev-gadadhara-receives-prema, note: "Просила его всегда быть рядом с Нимаем (F30); «иду повидать Шачи-мату» (F69)."}
  # Господь
  - {type: companion, who: "@mahaprabhu", facts: [F1, F5, F9, F19, F22, F28, F30, F31, F32, F33, F34, F56, F61, F65, F69, F71, F90, Q1, Q5],
     note: "Неразлучный с детства; шакти Гаура-Кришны; Господь — «Гададхара-прананатха», «Гадаи-Гауранга». Испытание с Валлабхой (F65–F66), Каттак (F69–F71)."}
  # гуру и наставники
  - {type: guru, who: "@pundarika-vidyanidhi", facts: [F18, F37, F38, F42, F43, F44, F45, F46, F47, F48, F49, F50, Q7], event: ev-gadadhara-initiation-pundarika,
     note: "Дикша в Навадвипе после раскаяния в сомнении; кто посоветовал — сам (T 53, M, B) или Господь (T 46) (F45); повторная мантра в Пури (F50). Вришабхану — отец Радхи (F49)."}
