open_questions:
  - "Место рождения: Белети в Читтагонге (T) или Навадвипа («Према-виласа»); год — 1486 (T) или на год позже Господа (M) (F11, F13)."
  - "Месяц ухода: джьяштха (T 47) или ашадха (T 237) (F94)."
  - "Как Шриниваса узнал о его уходе — по пути из Пури (M), в Бенгалии по дороге обратно (B), в Яджпуре по пути в Пури (ПВ) (F93)."
  - "Кто посоветовал принять дикшу у Пундарики — Господь (T 46) или он сам (T 53, M, B) (F45); сколько стихов прочёл Мукунда (F43)."
  - "Ученики Гададхары — пуджари Мадана-мохана: Ананта Ачарья и Харидас (M) или Кришнадас Брахмачари (B) (F80)."
  - "Ачьютананда — ученик Гададхары («Шакха-нирнаямрита», B) или Адвайты (Анубхашья) (F81)."
  - "Двиджа Ванинатха из Чампахатти — брат ли он Гададхары (F15, F98)."
  - "B 140: «самадхи Гададхары Пандита» в Эриядахе — оговорка вместо Даса Гададхары? (F96)."
  - "T: путь Господа из Каттака — «через Джхарикханду» ⚠ (по ЧЧ — в Гауду) (F70)."
