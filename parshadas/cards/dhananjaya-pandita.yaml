open_questions:
  - "Место рождения: Джараграм в Читтагонге («Абхидхана», Бхактисиддханта, B «некоторые»), Сиван-Мулук близ Болпура («Гауранга-мадхури») или Шиталаграм (M, «принятое мнение») (F6–F10)."
  - "Где Божества Гопинатхи, Нитай-Гауры и Дамодары: в Шиталаграме (B, T) или в Джаланди (M) (F25, F30)."
  - "Расстояние Санчра-Панчры от Мемари: 3 кроши (B), 6 миль (M) или 2 мили от Сатдеула-Таджапура (T); одно село или два (T) (F19, F23)."
  - "Праздник ухода: шукла-аштами Картики (T, M, наш календарь) — но T говорит о празднике в середине Магхи, M — в январе (F37, F38)."
  - "Санджая — брат или ученик (F14); севаиты — потомки одного ученика (B) или учеников (T, M); M в цитате — «потомки Дхананджаи» (F32)."
  - "T 96: «Нитьянанда избавил самого падшего…», обращение разбойников — вероятно, смешение текста T (F36)."
