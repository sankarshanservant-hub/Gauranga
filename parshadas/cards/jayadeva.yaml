     note: "Не встречались в лиле Господа; по преданию (Бхактивинода) Господь явил ему облик Гауры и предрёк, что будет вкушать его поэму в Пури (⚠Б2). Махапрабху вкушал «Гита-говинду» со Сварупой и Раманандой (ЧЧ Ади 13.42; Мадхья 2.77, 10.115; Антья 15, 17, 20)."}
  - {type: other, who: "@jagannatha-deity", facts: [F26, F33, F34, F35, F37],
