  - {type: friend, who: "@govardhana-acharya", facts: [F9, F10, F11], note: "Придворный поэт Лакшманы Сены; сообщил царю, кто автор «Дашаватара-стотры»."}
  - {type: friend, who: "@umapatidhara", facts: [F10], note: "Придворный поэт Лакшманы Сены, назван в «Гита-говинде» (1.4)."}
  - {type: other, who: "@mahaprabhu", facts: [F13, F14, F15, F56, F57, F58, F59, F60, F61, F62, F66, F67, F68, F69, F70],
