  - {type: other, who: "@krishna", facts: [F28, F29, F30, F31, F32], note: "По преданию (B, M) Сам Кришна вписал «дехи пада-паллавам ударам» и принял прасад из рук Падмавати (T — Джаганнатха; ⚠9, ⚠Б4)."}
  - {type: other, who: "@radha", facts: [F20, F21, F29, F66], note: "«Гита-говинда» — песнь о сокровенных играх Радхи и Говинды (⚠Б1)."}
  - {type: other, who: "@svarupa-damodara", facts: [F57, F58, F59, F60, F61, F62], note: "Пел Господу «Гита-говинду» по Его настроению (ЧЧ Мадхья 10.115; Антья 15.84, 17.5–6, 17.62). = @svarupa-damodara F54, F79, F88."}
  - {type: other, who: "@ramananda-raya", facts: [F24, F58, F60, F61], note: "Читал Господу стихи «Гита-говинды»; песни его «Джаганнатха-валлабха-натаки» — в манере Джаядевы. = @ramananda-raya F90."}
  - {type: other, who: "@bhaktivinoda", facts: [F11, F12, F13, F14, F15], note: "«Навадвипа-дхама-махатмья» — предание о Лакшмане Сене, Чампахати и видении Гауры; бхава Гауры в сердцах Джаядевы, Билвамангалы, Чандидаса, Видьяпати."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F51, F71, F72, F22], note: "«Анубхашья» к ЧЧ Ади 13.42 — краткое жизнеописание; последние годы — в Джаганнатха-кшетре; запрет мирского прочтения песен (⚠Б1). T 263: слово «нактам» ГГ 1.1 и час ухода Бхактисиддханты."}
  - {type: other, who: "@rupa-gosvami", facts: [F23], note: "В «Падьявали» стихи из сочинений Джаядевы не включены, «Гита-говинда» и так ходила книгой. = @rupa-gosvami F540–F541."}
  - {type: other, who: "@raghunatha-dasa", facts: [F64], note: "Песня «Шри Джаядева-вандана» под именем «дас Рагхунатха» («Пада-калпатару»; B 651–652). = @raghunatha-dasa F69."}
  - {type: other, who: "@vidyapati", facts: [F15, F56, F57, F58, F59, F60], note: "Их песни вкушал Господь вместе (ЧЧ Ади 13.42 и др.)."}
  - {type: other, who: "@chandidasa", facts: [F15, F56, F57, F58, F60], note: "Там же."}
  - {type: other, who: "@bilvamangala", facts: [F15, F23, F60, F69], note: "«Кришна-карнамрита»; в одном ряду у Бхактивиноды, Рупы и ЧЧ."}
  - {type: other, who: "@keshava-kashmiri", facts: [F70], events: [ev-keshava-kashmiri-defeat], note: "ЧЧ Ади 16.101: ободряя дигвиджайи, Господь говорит, что изъяны есть даже у Бхавабхути, Джаядевы, Калидасы. = @keshava-kashmiri F23."}
  - {type: other, who: "@govinda-servant", facts: [F67], events: [ev-devadasi-gita-govinda-song], note: "Удержал Господа, бежавшего на пение «Гита-говинды» девадаси (ЧЧ Антья 13.78–88). = @govinda-servant F41."}
  - {type: other, who: "@gopala-bhatta", facts: [F63], note: "Комментарий «Кришна-валлабха» (под его именем) цитирует «Гита-говинду». = @gopala-bhatta F95."}
  - {type: other, who: "@prabodhananda-sarasvati", facts: [F65], note: "T 177: толкование на «Гита-говинду» среди его сочинений."}
