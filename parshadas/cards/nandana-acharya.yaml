  note: "Родословная спорна: B (и T вслед за ним) — сын Чатурбхуджи Пандита, брат Вишнудаса и Гангадаса (сведение ЧБ Антья 5.745 и ЧЧ Ади 11.43, ⚠2); «Гаудия-вайшнава-абхидхана» (у T 48) — сын астролога Лакшми Нараяна, брат Бхагавана Адхикари Сарвабхаумы; род жил в Бахиркханде близ Таракешвара, затем в Навадвипе (Шрихатия, Дакшин-пара)."
