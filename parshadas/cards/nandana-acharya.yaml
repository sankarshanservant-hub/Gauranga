open_questions:
  - "Отец и братья: Чатурбхуджа, Вишнудас и Гангадас (B, вывод из ЧБ и ЧЧ) или Лакшми Нараян и Бхагаван Адхикари Сарвабхаума («Абхидхана», T) (F2, F6, F8)."
  - "Хромота и встреча Господа после юга: двустишие «Карчи» — о «Кханджан Ачарье», видимо Бхагаване Ачарье (F11, ⚠3)."
  - "Сколько Господ скрывалось в его доме: два (ЧЧ Ади 10.39) или трое (B, T) (F9–F10)."
  - "Кто привёл Шривасу к Господу: Нандана (B, T 50, ЧБ) или Харидас (T 31) (F35)."
  - "Нандана Ачарья Бхавана в Ишодьяне: «в память о доме» (B) или «на месте дома» (T) (F45)."
  - "Даты явления и ухода неизвестны; в календаре ШЧСМ их нет (F46)."
