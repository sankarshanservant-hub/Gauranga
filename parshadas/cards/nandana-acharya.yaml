period_note: "Лично — в Навадвипе в годы санкиртаны: ночные киртаны, приход Нитьянанды, Адвайты, сокрытие Господа в его доме (F12–F37, F42–F43); в Шантипуре после санньясы (F38); в Пури — с бенгальскими преданными на Ратха-ятре и при угощениях (F39–F41, F44). Встреча Господа после юга (F11) — спорно (⚠3)."
