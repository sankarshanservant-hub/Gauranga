  - {type: disciple, who: "@bhagavata-dasa-babaji", facts: [F15], note: "Ученик по веше; тот дал вешу Гауракишоре (M 61; Mб 830; T 240–241)."}
  - {type: disciple, who: "@rasavihari-gosvami", facts: [F15], note: "Ученик по дикше из Пуруньи (Бурдван); гуру раджи Трипуры Ишана Чандры Маникьи (T 223–224)."}
  - {type: lineage-successor, who: "@gaurakishora-dasa-babaji", facts: [F15, F41, F45], note: "Ученик его ученика; в 1893 г. Бабаджи велел ему жить в Навадвипе; оба — у кадамбы на месте явления. = @gaurakishora-dasa-babaji F13, F15, F16, F64, F67."}
  - {type: lineage-successor, who: "@bhaktisiddhanta", facts: [F4, F5, F43, F49, F50, F63, F75, F76, F77], note: "Велел мальчику (12 лет) составить «Навадвипа-панджику»; Бхактисиддханта — в «Гаудия-бхашье» и «Анубхашье» о нём; свапна-самадхи; триданда-санньяса — во славу веши его гуру."}
  - {type: served-by, who: "@bihari-dasa-babaji", facts: [F57, F58, F65, F70], note: "Сильный враджаваси, личный слуга: носил его в корзине на плечах; подношения, двенадцать рупий, щенки (T 223; M 61; Mб 830–831)."}
  - {type: other, who: "@vishnupriya", facts: [F40, F47, F48], note: "Определил день её явления (шукла-панчами магхи); предложил служение Махапрабху с Лакшми и Вишнуприей; по его дозволению Бхактивинода установил Гауру-Вишнуприю. = @vishnupriya F12, F145, F147."}
  - {type: other, who: "@mahaprabhu", facts: [F38, F39, F40, F42, F43, F44], note: "Указал место явления Господа (Йогапитху) и Шриваса-ангану «божественным видением», «по побуждению Самого Гауры» (1893)."}
  - {type: other, who: "@jagannatha-mishra", facts: [F40, F43], note: "Предложил служение Джаганнатхе Мишре и Шачи на месте их дома; «Гаудия-бхашья»: место дома установлено под его водительством."}
  - {type: other, who: "@shachi", facts: [F40], note: "Предложил служение Шачи и Джаганнатхе в одном здании (T 223)."}
  - {type: other, who: "@srivasa", facts: [F39, F42, F46], note: "Указал Шриваса-ангану (Кхола-бхангар-дангу); с Бхактивинодой открыл там центр санкиртаны (B 149–150)."}
  - {type: other, who: "@chand-kazi", facts: [F39, F43], note: "Место, где Кази разбил мриданг; Йогапитха — близ самадхи Кази."}
  - {type: other, who: "@nityananda", facts: [F31], note: "Пел в Амладжоре «нитай ки нама энечхе ре…» (Q5)."}
  - {type: other, who: "@rupa-gosvami", facts: [F18, F63, Q4], note: "Служение по наставлениям Рупы; «лучший из рупануг» (аштака); учение — в русле Рупы (Бхактисиддханта)."}
  - {type: other, who: "@shridhara-maharaja", facts: [F14, F55, F56], note: "SG — место в парампаре; «Бхактивинода-дашакам»: Бхактивинода «дорог Джаганнатхе-прабху»; M: Коладвипа — там, где ныне храм Шридхара Махараджа. = @shridhara-maharaja F158."}
  - {type: other, who: "@bhakti-pramoda-puri", facts: [F78], note: "Статья о его заслугах в «Сарасвати-джаяшри» (1948). = @bhakti-pramoda-puri F24."}
  - {type: other, who: "@bhakti-dayita-madhava", facts: [F74], note: "Ушёл в его титхи (27.02.1979)."}
  - {type: other, who: "@rasikananda", facts: [F74], note: "Тот же день ухода (Гаура-пратипад Говинда-масы)."}
