  - {type: other, who: "@ishana-nagara", facts: [F45], note: "«Адвайта-пракаша» (ур. D): растила его; после ухода Адвайты велела ему жениться."}
  - {type: other, who: "@yogamaya", facts: [F6, F7, F40], note: "По ГГД 86 — Йогамайя (см. identities)."}
  - {type: other, who: "@govinda-acharya", facts: [F7], note: "ГГД 41: Паурнамаси — он (против отождествления Ситы с Паурнамаси у M, ⚠2)."}
