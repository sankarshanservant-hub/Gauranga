  - {type: other, who: "@parameshvara-dasa", facts: [F31], events: [ev-kirtan-festival-advaita-house], note: "Его пада (ПК 23) о празднике в доме Адвайты. = @parameshvara-dasa F51."}
  - {type: other, who: "@malini", facts: [F42, F43], note: "Пады Нарахари; «Намамрита-самудра» 10 — в одном ряду хранительниц Гауры."}
