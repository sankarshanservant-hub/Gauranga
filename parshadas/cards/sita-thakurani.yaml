period_note: "Лично: свадьба с Адвайтой (P01; F5); дары и имя Младенцу (P02; F11–F18); детство Нимая — забота вместе с Шачи (P03–P04, по M; F19–F23); откровение и Шантипур («Йога-васиштха», P07; F24–F31); Шантипур после санньясы (P09; F32–F33); ежегодные приходы в Пури (P12–P14; F34–F35); благословение Шринивасе после сокрытия Господа (P15; F38). Поздние предания (ПВ, «Адвайта-пракаша») — лишь в рассказах (F44–F45)."
