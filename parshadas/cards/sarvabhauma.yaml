    date: ""
    tithi: ""
    place: "#vidyanagara-bengal?"
    conf: "день и год явления источники не называют; T 112 по ГВА — «первая половина XIV в. эры Шака» (без первоисточника); родина — Видьянагара близ Навадвипы, где жил отец (F3–F4); в календаре Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-19) дня явления нет"
    facts: [F3, F4, F6]
  disappearance:
    date: ""
    tithi: ""
    place: ""
    conf: "день, год и место ухода неизвестны; после сокрытия Господа жив (БР 3 — встреча со Шринивасой, F114); ЧЧ Мадхья 1.141, ЧЧН 10 — уходил в Каши (F125); в календаре ШЧСМ (541/ru, проверено 2026-11-19) дня ухода нет (есть лишь парикрама Видьянагар Сарвабхаума Гаудия Матха в Гаура-чатурдаши, F122)"
    facts: [F114, F122, F125]
