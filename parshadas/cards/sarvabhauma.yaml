id: "@sarvabhauma"
names:
  ru: "Сарвабхаума Бхаттачарья"
  en: "Sarvabhauma Bhattacharya"
  variants: ["Васудева (собственное имя)", "Шрила Васудева Сарвабхаума (B)", "Васудева Бхаттачарья Сарвабхаума (B 233)", "Vasudeva Sarvabhauma Bhattacharya (T)", "Sarvabhauma Pandit (T 204, M 29)", "Сарвабхаума Махашой (ЧБ)", "Васудева Сарвабхаума (Мурари)", "Бхаттачарья (ЧЧ)"]
  facts: [F1, F2]
kind: associate
circle: [puri]
period: [P10, P11, P12, P13, P14, P15]
period_note: "Лично — с прихода Господа в Пури (P10: обморок в храме, дом Сарвабхаумы, веданта, обращение; ЧЧ Мадхья 6) через проводы на юг (P11), посредничество за царя и пир с Амогхой (P12), удержание Господа от Вриндавана и утешение Гададхары (P13), поздние игры в Пури и уход в Каши (P14; ЧЧ Мадхья 1.141, ЧЧН 10) до встречи со Шринивасой после сокрытия Господа (P15; БР 3). До P10 — лишь в рассказах о прошлом (учёба, Митхила, Навадвипа; F14–F21)."
life:
