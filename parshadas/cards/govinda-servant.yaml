events_note: "ev-govinda-ishvara-puri-servant — ЧЧ Ади 10.138–142, Мадхья 10.130–150, ЧЧН 8, ГКД 11.20 (не путать с ev-govinda-joins-lord — это Говинда-кузнец из «Карчи», @govinda-karmakara); ev-jagamohana-dance-govinda-crosses — ЧЧ Антья 10.66–101; ev-month-stored-prasada — Антья 10.106–130, ГКД 17.35–41; ev-devotees-gather-nilachala — ЧЧН 8, Карнапура 13.130–131 (в lila-db — P10); ev-dravida-brahmana-vibhishana — Лочан, Шеша 52.48–51; ev-jahnava-vrindavana — «Према-виласа» 16.261 (ур. C); ev-advaita-gaura-kirtan — ЧБ Антья 9.195–196; ev-nilachala-sankirtana — пада Нарахари; ev-lord-daily-routine-puri — Карнапура 18, «Шачисуну-аштака». Не включены: ev-radha-desha-wandering, ev-journey-to-puri (ЧБ Антья 1.52, 2.35 — «Говинда» после санньясы; по ЧЧ слуга пришёл позже — ⚠10, в lila-db cb-3005, cb-3019 тег сомнителен) и ev-nimai-pandit-teaching (лишь мангала ЧБ Ади 13.2 «привратник Говинда»)."
