relations:
  - {type: guru, who: "@ishvara-puri", facts: [F6, F7, F8, F9, F10, I3], events: [ev-govinda-ishvara-puri-servant],
     note: "Ученик и слуга; по велению гуру перед его уходом пришёл служить Господу (ЧЧ Ади 10.138–139; Мадхья 10.132–134); ЧЧН 8.13 — послан ещё при жизни Ишвары Пури (⚠4). = @ishvara-puri F59–F64."}
  - {type: served-by, who: "@mahaprabhu", facts: [F9, F11, F12, F13, F15, F16, F17, F18, F19, F21, F22, F23, F24, F25, F26, F28, F29, F30, F31, F34, F36, F37, F38, F39, F40, F41, F45, I1, I2],
     events: [ev-govinda-ishvara-puri-servant, ev-jagamohana-dance-govinda-crosses, ev-month-stored-prasada, ev-devadasi-gita-govinda-song],
     note: "Личный и главный слуга Господа в Пури (служение телу, пища, припасы, сосуд для омовения стоп, привратник); Господь принял его как слугу своего гуру, по приказу гуру (Ади 10.140; Мадхья 10.142–147, ⚠Б2); дасья-раса (Мадхья 2.78); «никогда не покидай Меня» (Антья 13.87); переход через тело Господа ради служения (Антья 10, ⚠Б1)."}
  - {type: sibling, who: "@kashishvara", facts: [F3, F6, F8, F9, F16, F18, F51],
     note: "Духовный брат (оба — ученики Ишвары Пури); вместе служили Господу: Кашишвара впереди в толпе, Говинда — позади с сосудом воды (ЧЧ Мадхья 12.207); по ГГД 137 — Бхрингара и Бхангура; пришёл позже Говинды (Мадхья 10.134, 10.185)."}
  - {type: co-worker, who: "@ramai-puri", facts: [F13, F15], note: "Помогал Говинде, носил воду (ЧЧ Ади 10.143–144); по ГГД 139 — Пайода."}
  - {type: co-worker, who: "@nandai", facts: [F13, F15], note: "Помощник Говинды (ЧЧ Ади 10.143–144); по ГГД 139 — Варида."}
  - {type: co-worker, who: "@svarupa-damodara", facts: [F20, F38, F49, F54], events: [ev-gauda-devotees-arrive-puri, ev-kurma-form-telinga-cows, ev-limbs-elongated-separation, ev-face-rubbing-gambhira],
     note: "Вместе встречали гаудийцев гирляндами (ЧЧ Мадхья 11.74–81); вместе спали у двери Гамбхиры и искали Господа (Антья 14, 17, 19); Сварупа представил Говинду Адвайте. = @svarupa-damodara F20, F62, F67, F75, F77."}
  - {type: other, who: "@sarvabhauma", facts: [F9, F11, F12], note: "При нём Говинда пришёл к Господу; спросил о слуге-шудре и посоветовал исполнить приказ гуру (ЧЧ Мадхья 10.136–146)."}
  - {type: other, who: "@advaita", facts: [F13, F20, F36], events: [ev-gauda-devotees-arrive-puri], note: "Поднёс ему гирлянду и простёрся перед ним; Адвайта его ещё не знал (ЧЧ Мадхья 11.78–81); угощения Адвайты Говинда первыми называл Господу (Антья 10.118)."}
  - {type: other, who: "@nityananda", facts: [F20, F43], events: [ev-lord-refuses-to-see-king], note: "Гирлянда на третий год (Мадхья 16.38–39); Нитьянанда попросил у Говинды накидку Господа для царя (Мадхья 12.36)."}
  - {type: served-by, who: "@haridasa-thakura", facts: [F21, F44, F46], events: [ev-haridasa-departure, ev-rupa-arrives-haridasa-puri], note: "Носил ему остатки Господа; в последний день — махапрасад (ЧЧ Антья 11.16–20)."}
  - {type: other, who: "@raghava-pandita", facts: [F25, F36], events: [ev-month-stored-prasada], note: "Хранил его мешки с угощениями на весь год (ЧЧ Антья 10.55–56, 10.128)."}
  - {type: other, who: "@damayanti", facts: [F25], note: "B 822: бережно хранил её припасы и давал Господу понемногу."}
  - {type: other, who: "@kalidasa", facts: [F18, F19], events: [ev-kalidasa-foot-water], note: "Не давал никому воды со стоп Господа; по знаку Господа отдал Калидасу остатки (ЧЧ Антья 16.40–57)."}
  - {type: served-by, who: "@raghunatha-dasa", facts: [F49], events: [ev-raghunatha-dasa-joins-lord, ev-raghunatha-stops-invitations, ev-raghunatha-rotten-rice, ev-govardhana-shila-gunja-gift],
     note: "Пять дней кормил его остатками Господа; Рагхунатха обращался к Господу через Сварупу или Говинду (ЧЧ Антья 6). = @raghunatha-dasa F102–F103."}
  - {type: served-by, who: "@raghunatha-bhatta", facts: [F53, F55], events: [ev-raghunatha-bhatta-first-visit-puri], note: "По велению Господа нашёл ему жильё (ЧЧ Антья 13.104); M — дал прасад, убрал гостинцы."}
  - {type: other, who: "@jagadananda-pandita", facts: [F53, F54], events: [ev-jagadananda-sandal-oil, ev-jagadananda-bed-banana], note: "Через Говинду — масло и постель; Говинда докладывал Господу, поел ли Джагадананда (ЧЧ Антья 12–13)."}
  - {type: other, who: "@shrikanta-sena", facts: [F52], events: [ev-nityananda-kicks-shivananda], note: "Велел снять рубашку перед поклоном; Господь: «не говорите ему ничего» (ЧЧ Антья 12.37–38)."}
  - {type: served-by, who: "@shivananda-sena", facts: [F52], events: [ev-karnapura-child-mercy], note: "По велению Господа давал семье Шивананды остатки Господа (ЧЧ Антья 12.52–53)."}
  - {type: other, who: "@ramachandra-puri", facts: [F51], events: [ev-ramachandra-puri-criticism], note: "Через Говинду Господь установил урезанную меру пищи (ЧЧ Антья 8.50–59)."}
  - {type: other, who: "@chhota-haridasa", facts: [F47], events: [ev-chhota-haridasa-punished, ev-chhota-haridasa-prayaga], note: "Господь велел Говинде не пускать его; позже Говинда и другие слышали его пение у моря (ЧЧ Антья 2)."}
  - {type: other, who: "@sanatana-gosvami", facts: [F48], events: [ev-sanatana-puri-sores, ev-sanatana-hot-sand-test], note: "Приносил ему махапрасад; дал тарелку остатков в саду Ямешвары (ЧЧ Антья 4.50, 4.121)."}
  - {type: other, who: "@rupa-gosvami", facts: [F46], events: [ev-rupa-arrives-haridasa-puri], note: "Принёс ему и Харидасу прасад от Господа (ЧЧ Антья 1.64)."}
  - {type: other, who: "@kamalakanta-vishvasa", facts: [F42], events: [ev-kamalakanta-letter-prataparudra], note: "Господь велел больше его не пускать (ЧЧ Ади 12.36)."}
  - {type: other, who: "@prataparudra", facts: [F43, F63], events: [ev-lord-refuses-to-see-king], note: "Накидка Господа для царя — через Говинду (Мадхья 12.36); у Лочана царь просит Говинду о встрече (Шеша, 51.87–90)."}
  - {type: other, who: "@gadadhara-pandita", facts: [F50], events: [ev-gadadhara-vallabha-initiation], note: "Послан за ним вместе со Сварупой и Джагаданандой (ЧЧ Антья 7.150)."}
  - {type: other, who: "@paramananda-puri", facts: [F19, F23, F47], note: "По знаку Господа принёс прасад для него (Антья 16.105); с ним шёл в Гауду; спор о Младшем Харидасе."}
  - {type: other, who: "@shankara-pandita", facts: [F57, F60], events: [ev-srinivasa-gadadhara-puri], note: "ЧЧН 8: Господь велит Говинде быть благосклонным к Шанкаре; после сокрытия Господа Шриниваса застал их обоих в разлуке (БР 3.188–193)."}
  - {type: met, who: "@srinivasa-acharya", facts: [F56, F57], events: [ev-prema-for-srinivasa, ev-srinivasa-gadadhara-puri], note: "Господь открыл Говинде о рождении Шринивасы (БР 2); после сокрытия Господа обнял его (B 807; БР 3). = @srinivasa-acharya F12, F36."}
  - {type: other, who: "@chaitanya-dasa", facts: [F56], events: [ev-prema-for-srinivasa], note: "Проводил его с женой к Джаганнатхе (БР 2)."}
  - {type: other, who: "@gopala-guru", facts: [F58], note: "По T — ребёнком служил Господу под началом Говинды; в БР 8 вспоминает, как Говинда растирал стопы Господа. = @gopala-guru F4."}
  - {type: other, who: "@govinda-karmakara", facts: [], note: "Тёзка, не путать: автор «Карчи»; B 769 приписывает её «личному слуге Говинде» (⚠9); гипотеза Д. Ч. Сена о тождестве — не принимаем."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F3, F12, F31, F45], note: "«Анубхашья» к ЧЧ Ади 10.138–143 и Мадхья 2.78: Бхангура (ГГД 137), чистая дасья-раса, переход через Господа ради служения."}
