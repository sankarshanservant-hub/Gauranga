id: "@govinda-servant"
names:
  ru: "Говинда (слуга Господа)"
  en: "Govinda (the Lord's servant)"
  variants: ["Шри Говинда", "Шри Говинда дас (B)", "Govinda Das (T)", "слуга Говинда (ЧЧ)", "привратник Говинда, двара-пала (ЧБ)", "слуга лучшего из Пури («Гаура-кришнодая»)"]
  facts: [F1]
kind: associate
circle: [puri]
period: [P12, P13, P14, P15]
period_note: "Лично — с прихода к Господу в Пури после южного странствия (P12; F9–F14) до сокрытия Господа (P14) и после него — встреча со Шринивасой (P15; F57). P13 — шёл с Господом в Гауду на пути во Вриндаван и встречал Его по возвращении (F23, F24). В ЧБ «Говинда» идёт за Господом уже после санньясы (P09; ЧБ Антья 1.52, 2.35) — отождествление спорно (⚠10), в period не включено; мангалы ЧБ с «привратником Говиндой» (lila-db cb-0094, cb-0073 — P05/PX) — лишь упоминания."
