open_questions:
  - "Кто «Говинда», идущий за Господом сразу после санньясы в ЧБ Антья 1.52, 2.35: по ЧЧ слуга Ишвары Пури пришёл лишь после южного странствия (⚠10)."
  - "Когда Ишвара Пури послал его: перед уходом (ЧЧ) или ещё при жизни (ЧЧН 8.13) (⚠4); пришёл ли он прямо (ЧЧ) или после тиртх (Карнапура 13.130) (⚠5)."
  - "ГГД 116 (Пундарикакша Вайкунтхи) — тот ли это Говинда (⚠1)."
  - "Родина, годы жизни, день и место ухода неизвестны; в календаре ШЧСМ его дней нет; «прожил недолго после Шринивасы» — только B (⚠8)."
