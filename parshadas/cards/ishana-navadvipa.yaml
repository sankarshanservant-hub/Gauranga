  - {type: served-by, who: "@shachi", facts: [F10, F11, F12, F13, F14, F17, F18, F19, F20, F21, F22, I2], events: [ev-nityananda-meal-shachi, ev-lament-after-lord-leaves, ev-lord-eats-shachi-offering],
     note: "Всю жизнь служил матери Господа (ЧБ Мадхья 8.74; «Гаудия-бхашья»); Шачи очень любила его («Вайшнава-вандана»); после санньясы — забота о доме; знаки Шачи после ухода Господа (пада Васу Гхоша); убирал по её зову (ЧЧ Мадхья 15.63). = @shachi F47, F49, F51, F151, F181."}
  - {type: served-by, who: "@vishnupriya", facts: [F18, F19, F22, F24, F25, F26], events: [ev-srinivasa-vishnupriya-mercy],
     note: "После санньясы Господа заботился о ней (B 909; T 67; «Гаудия-бхашья»); при ней — вестник и провожатый Шринивасы («Према-виласа» 4, ур. C). = @vishnupriya F93, F99–F102, F106."}
  - {type: served-by, who: "@nityananda", facts: [F15, F16], events: [ev-nityananda-meal-shachi], note: "Подавал воду омыть стопы Гауре и Нитьянанде перед трапезой (ЧБ Мадхья 8.59). = @nityananda F174, F458."}
  - {type: served-by, who: "@vamshivadana", facts: [F22, F23], note: "После ухода Махапрабху и Шачи Вамшивадананда служил Вишнуприе и Ишане (B 910 по скану; T 68); T 67 — оба заботились о Вишнуприе и Шачи."}
  - {type: met, who: "@srinivasa-acharya", facts: [F24, F25, F26, F27, F31, F34, F35, F36, F39, F40], events: [ev-srinivasa-vishnupriya-mercy, ev-srinivasa-khardaha-jahnava, ev-abhirama-whip-srinivasa],
     note: "Привёл его к Вишнуприе и сопровождал к Джахнаве и Абхираме («Према-виласа» 4–5, ур. C); позвал его в Навадвипу (БР 11.723, 12.127) и провёл с Нароттамой и Рамачандрой по девяти островам (БР 12); прощание и весть об уходе (БР 13.8–21). = @srinivasa-acharya F109, F139, Q18."}
  - {type: met, who: "@narottama-dasa", facts: [F28, F29, F34, F35, F39, F40], note: "Обнял и благословил его в доме Господа, отпустил в Нилачалу (БР 8.88–108; M 107; B 1099); провожатый в Навадвипа-парикраме (БР 12)."}
  - {type: met, who: "@ramachandra-kaviraja", facts: [F32, F34, F35, F39, F40], note: "Благословил его в доме Джаганнатхи Мишры (B 1110; M pdf 182); провожатый в Навадвипа-парикраме (БР 12). = @jagannatha-mishra F106."}
  - {type: met, who: "@shyamananda", facts: [F33], note: "M 206: в доме Гауранги благословил Дукхи Кришнадаса; первоисточник не назван (⚠8). = @jagannatha-mishra F105."}
  - {type: met, who: "@jahnava", facts: [F27, F30, F31], events: [ev-srinivasa-khardaha-jahnava], note: "В Навадвипе был глубоким стариком, утешал её (M 69; БР 11.768); в Кхардахе — вестник и посланец с её письмом к Абхираме («Према-виласа» 5). = @jahnava F87."}
  - {type: met, who: "@virabhadra", facts: [F27], events: [ev-srinivasa-khardaha-jahnava], note: "В Кхардахе пошёл с Вирачандрой за Шринивасой («Према-виласа» 5.11–13)."}
  - {type: met, who: "@abhirama", facts: [F26, F27], events: [ev-abhirama-whip-srinivasa], note: "Вручил ему письмо Джахнавы; Абхирама посылал его за Шринивасой и дал его Шринивасе в спутники («Према-виласа» 5.35–64, ур. C)."}
  - {type: met, who: "@raghunandana", facts: [F40], note: "Шриниваса рассказал Рагхунандане в Шрикханде о встрече с Ишаной и о его уходе (БР 13.17–21). = @raghunandana F62."}
