character:
  - {trait: "безраздельная преданность маленькому Нимаю: носил Его на руках, исполнял все Его прихоти, и Нимай не мог без него ни мгновения", facts: [F6, F7]}
  - {trait: "служение матери Господа всю жизнь — как служение преданному, которое выше поклонения Самому Господу", facts: [F10, F11, F18, I2]}
  - {trait: "верность дому Господа: после санньясы взял на себя заботу о Шачи, Вишнуприе и доме и до конца оставался в нём", facts: [F19, F35, F38]}
  - {trait: "сострадание и любовь к младшим вайшнавам (Шриниваса, Нароттама, Рамачандра): кормит, благословляет, обнимает со слезами, сам зовёт и ведёт по местам игр", facts: [F25, F28, F32, F35, F39]}
  - {trait: "знаток всех истин и живая память Навадвипы: знает места игр и рассказывает о них", facts: [F4, F14, F35]}
  - {trait: "разлука с Господом: один в доме Господа, в слезах взывает «Вишвамбхара!»", facts: [F35]}
