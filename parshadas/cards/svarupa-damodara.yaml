period_note: "Лично: в Навадвипе у стоп Господа как Пурушоттама Ачарья (P07); после санньясы Господа — санньяса в Каши (P10, по «Према-виласе» в lila-db); приход в Пури после южного паломничества Господа (P12); провожает Господа во Вриндаван и встречает по возвращении (P13); неотлучно — в последние годы, в Гамбхире (P14); ушёл в день Ратха-ятры вскоре после сокрытия Господа (P15). P00 — только как источник знания о причинах нисхождения (ЧЧ Ади 4)."
