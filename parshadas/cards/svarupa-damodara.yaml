article: {ru: "parshadas/ru/svarupa-damodara.md", en: "parshadas/en/svarupa-damodara.md"}
open_questions:
  - "Отождествление: в статье — Лалита (ЧЧ Антья 6.10, Бхактивинода, Шридхар Махарадж), ГГД 160 — Вишакха сноской (F98, F99)."
  - "Когда ушёл в Каши: после санньясы Господа (ЧЧ, B, M, «Према-виласа») или ещё до неё (Бхактисиддханта в «Анубхашье» к Ади 4.105, по T) (F6, F106)."
  - "Как он принял санньясу: санньяса без йогапатты (B, ЧЧ) или лишь брахмачарья у дашанами (Бхактисиддханта по T) (F9, F105, F106)."
  - "Первая встреча с Раманандой: по приходе Рамананды в Пури (B), с царём Пратапарудрой (T), около того же времени (M) (F108)."
  - "Год ухода не указан; день — Ашадха шукла-двития (B; наш календарь), у M — неясное «второй день от полнолуния» (F146)."
  - "Гопала Гуру — ученик Вакрешвары (B 201, T) или «ученик Сварупы» (B 581, вероятно опечатка) (F144)."
  - "Детали эпизодов: кто вернулся просить прощения за гаудию в Гундиче (F118); сколько раз хлопнул рыбака и где тот был (F133); кто просил прасад для праздника Харидаса (F131)."
