  note: "Родство с Джагадишей Пандитом (младший из трёх братьев: Джагадиша, Хиранья, Махеша) — лишь «по мнению некоторых». Шрила Бхактисиддханта: к ЧЧ Ади 11.30 — по преданию шрипата Яшады у Джагадиши был брат Махеша, ушедший с ним в Майяпур; к Ади 11.32 — что это и есть Махеша Пандит, в авторитетных книгах нет, сомнительно; M 57 подаёт как факт (⚠13)."
