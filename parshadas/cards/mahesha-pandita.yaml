period_note: "Лично — спутник Нитьянанды в Гауде (P14: праздник в Панихати и путь в Саптаграм, F23–F24) и после сокрытия Господа (P15: Шриниваса и Нароттама в Кхардахе, F26–F29). В перечнях спутников Нитьянанды (ЧЧ Ади 11.32, ЧБ Антья 5.744; lila-db cc-0157, cb-3089 — PX) и в снах Нароттамы (НВ 2.123, 4.129) — лишь упоминания; Кхетури (НВ 7.119, БР 10.595) — лично или среди явившихся с Господом, неясно (⚠14); Лочан Мадхья 24.59 (Навадвипа) — отождествление не уточнено (⚠15)."
