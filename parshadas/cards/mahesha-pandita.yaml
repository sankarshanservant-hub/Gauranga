open_questions:
  - "Год переноса шрипата из Палпары: 1334 (1927; «Анубхашья», T) или 1314 (B — вероятно, опечатка) (⚠2, ⚠3); название — Катхалпули или Катхалдхули (⚠6)."
  - "Был ли он братом Джагадиши Пандита (⚠13) и где родился (M — Чакдаха)."
  - "Махеша ЧЧ Ади 10.111 (ветвь Чайтаньи) — то же лицо? (⚠11); Махеша Пандит у Лочана в Навадвипе (⚠15)."
  - "Был ли в Кхетури лично (⚠14); год и место ухода, место самадхи неизвестны."
