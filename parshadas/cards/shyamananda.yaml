character:
  - {trait: "любовь к Гауда-мандале и спутникам Господа: уходя во Вриндаван, плачет и молит Гауду о милости", facts: [F14, F26]}
  - {trait: "верность гуру: всё во Вриндаване — по его велению; с весёлым лицом сносит его брань", facts: [F24, F30, F41, I3]}
  - {trait: "служение и смирение: носит воду для Дживы; плачет, что «забыл стопы Дживы»", facts: [F34, F75]}
  - {trait: "проповедь киртаном (стиль ренети); обращает разбойников, безбожников и иноверцев", facts: [F66, F67, F73, F113, F120, F131]}
  - {trait: "скорбь разлуки со спутниками Господа и с гуру: «словно мёртвый» после сокрытия махантов Пури; «не останусь на земле» после ухода Хридаянанды", facts: [F115, F135]}
  - {trait: "сострадание к ученику и сила гуру: наделил Расикананду своей силой", facts: [F70, I4]}
