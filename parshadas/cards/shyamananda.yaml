id: "@shyamananda"
names:
  ru: "Шьямананда Прабху (Духкхи Кришнадас)"
  en: "Shyamananda Prabhu (Duhkhi Krishnadasa)"
  variants: ["Духкхи (детское имя)", "Кришнадас (имя при посвящении)", "Духкхи Кришнадас", "Шьямананда (имя от Дживы; по РМ П2.48 — от Хридаянанды)", "Расикендра-мастака-мани («Шьямананда-шатака»)", "Канака-манджари (сиддха-имя, ПВ 19–20)", "Духкхини Кришнадас (БР 7.11; 15.105)", "Тхакур (РМ)", "сын Дурики (РМ П1.10; БР 7.456)"]
  facts: [F1, F2, F3, F4, F111, F122, F124]
kind: acharya
circle: [later]
period: [P15]
period_note: "Всё — после сокрытия Господа (P15): род. 1534 (T; B — 1533), посвящение в Амбике, учение у Дживы во Вриндаване, отправка книг (1582–83, T), Кхетури, проповедь в Уткале; уход — 1552 шака (1630; T, РМ)."
sampradaya:
  name: "линия Нитьянанды через Гауридаса Пандита: Гауридас → Хридая Чайтанья → Шьямананда → Расикананда"
  facts: [F18, F88]
life:
  appearance:
    year: 1534
    date: ""
    tithi: "пурнима в конце Вишну-масы (≈ чайтра-пурнима) — по нашему календарю (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-22: 2.04.2026, день Васанта-расы); T и M — чайтра-пурнима"
    place: "#dharenda"
    conf: "год 1456 шака (1534) — T; B — 1533 «сразу после ухода Махапрабху» (⚠2); место — Дхаренда-Бахадурпур (БР 1.354 «по словам людей», T, M); дом семьи — Дандешвар (БР 1.351; B) (⚠1)"
    facts: [F7, F8, F9]
  disappearance:
    year: 1630
    date: ""
    tithi: "кришна-пратипада Вамана-масы (≈ ашадха), на другой день после Снана-ятры — по нашему календарю (30.06.2026); T, M, РМ — ашадха, кришна-пратипада"
    place: "#nrisimhapura?"
    conf: "год 1552 шака (1630) — T и РМ (Пш13.49–50); M года не даёт; место — Нрисимхапур (T — последние годы; РМ — дом Уддханды Рая) или Гопиваллабхапур (M — самадхи там) (⚠12)"
    facts: [F80, F81, F135]
  samadhi:
    - {place: "#gopivallabhapura", kind: "самадхи (по M 215); T и B о самадхи молчат", facts: [F82]}
    - {place: "#nrisimhapura", kind: "«место сокрытия» в селении, где он ушёл (РМ Пш13.68; ур. B с оговоркой) (⚠12)", facts: [F135]}
origin:
  places: ["#dharenda", "#dandeshvara", "#medinipur", "#suvarnarekha"]
  family: ["@krishna-mandala", "@durika"]
  varna: "садгоп (БР 1.352; T; M; ПВ 20); по «Анубхашье» — истинный брахман-гуру (⚠Б3)"
  facts: [F5, F6, F7, F113, F123]
  note: "Предки — из Бенгалии (B; T по «Абхидхане» — из Гауды; РМ П2.20 — Кришна Мандал, покинув Гауду, поселился в Уткале; БР 7.459 — Дандешвар «в стране Гауда»); братья и сёстры умерли до его рождения — отсюда имя Духкхи (F2); по РМ — младший брат Баларама, которому он передал дом, и брак до ухода из дома (F123, ⚠23)."
relations:
  - {type: father, who: "@krishna-mandala", facts: [F6, F7, F16, F19, F113, F123]}
  - {type: mother, who: "@durika", facts: [F6, F122, F123]}
  - {type: spouse, who: "@shyamapriya", facts: [F131, F132, F136], note: "Только РМ (Д11.25–28): дочь Джаганнатхи из Большого Баларампура; по РМ у него три Тхакурани (П1.11; Д12.12; Пш12.11; У3) (⚠23)."}
  - {type: guru, who: "@hridaya-chaitanya", facts: [F3, F17, F18, F22, F23, F24, F30, F41, F54, F55, F72, F79, I1, I3],
     events: [ev-shyamananda-initiation-ambika, ev-shyamananda-utkala],
     note: "Дикша-гуру в Амбике (дал имя Кришнадас; БР 1.374–380); послал во Вриндаван и вверил Дживе («Джива — мой второй я», БР 1.408); по M — разгневался из-за новой тилаки, но, упрекнутый во сне Самой Радхой, обнял ученика (⚠Б2); послал в Уткал (M, НВ 3; БР 7.449–458); его уход — M 214, РМ Пш13; по БР 6.50 мадхурья-бхава получена у Дживы «по повелению Шри Гуру»; по РМ П2.48 — он и дал имя «Шьямананда» (⚠24)."}
  - {type: lineage-predecessor, who: "@gauridasa-pandita", facts: [F18, F21, F38, F88], note: "Гуру его гуру; T 213: Шьямананда — «слуга слуги Субалы»; Божества Гаура-Нитай в его доме (B 1102)."}
  - {type: siksha-guru, who: "@jiva-gosvami", facts: [F4, F29, F30, F32, F33, F36, F42, F46, F59, F92, F104, F106, F107, F110, F116, F117, F125, F126],
     events: [ev-shyamananda-comes-to-vrindavana, ev-srinivasa-narottama-shyamananda-vrindavana, ev-shyamananda-nupura, ev-books-leave-vrindavana],
     note: "Учил его «Бхагавате», книгам Госвами, дал имя «Шьямананда» (БР 1.401; B; T; «Анубхашья» Ади 10.85), подготовил к служению Радхе (B), послал с книгами в Гауду; во второй приход учил «Шат-сандарбхам» (M 199); во второй раз вверил Шринивасе и отправил с выверенными книгами (БР 9.223–224); по РМ П15 — передал ему повеление Мадана-гопалы идти в Уткал. = @jiva-gosvami."}
  - {type: friend, who: "@srinivasa-acharya", facts: [F31, F33, F42, F51, F52, F53, F59, F60, F63, F64, F65, F85, F86, F89, F90, F96, F104, F106, F110, F113, F116, F117, F118, F119],
     events: [ev-books-leave-vrindavana, ev-books-stolen-vana-vishnupura, ev-vira-hambira-conversion, ev-kheturi-festival, ev-kheturi-mahantas-depart],
     note: "Друзья на всю жизнь (M 193; B 667 — «одной жизни и цели»); трое ачарьев; Шриниваса послал его в Уткал после похищения книг; снова вместе во Вриндаване и в Вишнупуре (M 199). = @srinivasa-acharya F61, F62, F72, F92–F98, F106."}
  - {type: friend, who: "@narottama-dasa", facts: [F31, F33, F46, F52, F54, F57, F61, F63, F85, F86, F89, F96, F103, F106, F113, F114, F118],
     events: [ev-books-leave-vrindavana, ev-narottama-returns-kheturi, ev-narottama-shyamananda-nrisimhapura, ev-kheturi-festival],
     note: "Джива вверил его Нароттаме (ПВ 12); месяцы (B) / десять дней (ПВ 13) в Кхетури — Нароттама наставлял его; встреча в Нрисимхапуре (B, M, НВ 4); праздник в Кхетури."}
  - {type: disciple, who: "@rasikananda", facts: [F46, F68, F70, F71, F73, F74, F77, F80, I4, F117, F119, F120, F124, F126, F127, F128, F129, F130, F131, F133, F134, F135, F136],
     events: [ev-shyamananda-utkala, ev-kheturi-festival],
     note: "Главный ученик; встреча в Гхатшиле (B, T, БР, РМ) / Рохини (M) (⚠13); служение Говинде в Гопиваллабхапуре (⚠11); по РМ — преемник «всей власти» (⚠12). По РМ — Шьямананде о нём было повеление Хридаянанды и Мадана-гопалы (П2.50, П15); «он со мной будет непрестанно странствовать» (Д3.92); по БР 9.258 встречал его в Уткале при возвращении из Вишнупура. Подробно — @rasikananda F16–F31, F53–F64, F70–F137."}
  - {type: disciple, who: "@damodara-yogi", facts: [F71, F73, F77, F120, F128, F130, F135], event: ev-shyamananda-utkala, note: "Йогин (ведантист-санньяси по ПВ 19), обращённый к бхакти; места расходятся (⚠14); РМ Д1 — в Чакулии, видение у Кхарвы; его уход — РМ Пш13.16."}
  - {type: disciple, who: "@sher-khan", facts: [F66, F68], event: ev-shyamananda-utkala, note: "Наместник-патхан, разбивший кхолы; во сне Господь велел принять мантру у Шьямананды; имя Чайтанья Дас (ПВ 19–20; ур. C)."}
  - {type: disciple, who: "@shyamadasi", facts: [F70, F128, F130], note: "Жена Расики посвящена вместе с ним (M 158; РМ — имя Шьямадаси, @rasikananda F75)."}
  - {type: other, who: "@raghunatha-dasa", facts: [F29, F43, F97, F104, F108, F109], event: ev-shyamananda-comes-to-vrindavana, note: "B: принял его и послал к Дживе; ПВ 12: радовался, что его парама-гуру — Гауридас; благословил книги (B 1104)."}
  - {type: other, who: "@krishnadasa-kaviraja", facts: [F29, F43], event: ev-shyamananda-comes-to-vrindavana, note: "ПВ 12: Рагхунатха послал его к дряхлому Кавирадже; благословил книги (B 1104). = @krishnadasa-kaviraja F50."}
  - {type: other, who: "@lokanatha", facts: [F43, F61, F108, F109], note: "Благословил книги; по B — по его велению Шьямананду пригласили в Кхетури."}
  - {type: other, who: "@bhugarbha", facts: [F43, F108, F109]}
  - {type: other, who: "@gopala-bhatta", facts: [F33, F43, F108, F109], note: "БР 6.416: «Да будет милостив к тебе Шри Радха-рамана!»"}
  - {type: other, who: "@uddhava-dasa-vraja", facts: [F43], note: "Среди махантов у храма Говинды, провожавших троих (БР 6.514 — по нашему переводу; T 97; B 996)."}
  - {type: other, who: "@vira-hambira", facts: [F49, F50, F53, F60, F113, F117], events: [ev-books-stolen-vana-vishnupura, ev-vira-hambira-conversion], note: "Его люди похитили книги; стал учеником Шринивасы (B по скану); M 199: Шьямананда изумился бхакти царя; БР 7.472 — возложил его письмо на голову; 9.235 — «по милости Прабху я обрёл стопы этих двоих»."}
  - {type: other, who: "@santosha-datta", facts: [F54, F61, F103], event: ev-narottama-returns-kheturi, note: "Раджа Кхетури, хозяин праздника (НВ 3; M 66)."}
  - {type: other, who: "@jahnava", facts: [F63, F65], event: ev-kheturi-festival, note: "Три ачарьи встретили её процессию в Кхетури; признали её джагад-гуру (B 171)."}
  - {type: other, who: "@ramachandra-kaviraja", facts: [F59, F117], note: "Вместе со Шринивасой обходили Божества Вриндавана (M 199); вместе ушли из Вриндавана в Вишнупур (БР 9.227–235)."}
