open_questions:
  - "Год рождения: 1533 (B) или 1534 (T) (⚠2)."
  - "Где ушёл и где самадхи: Нрисимхапур (T, РМ) или Гопиваллабхапур (M) (⚠12)."
  - "Источник рассказа M о Вишакхе, облике гопи и гневе Хридаи Чайтаньи (вероятно, «Шьямананда-пракаша» / «Абхирама-лиламрита») — не сверен."
  - "Порядок встречи со Шринивасой и Нароттамой во Вриндаване (⚠8; БР 6 — как B); куда пошёл после похищения книг (⚠7)."
  - "Семья по «Расика-мангале»: брак до ухода из дома, младший брат Баларама, три Тхакурани (Шьямаприя и др.) — БР и прочие молчат (⚠23)."
  - "Ранняя жизнь по «Расика-мангале»: имя от Хридаянанды, всеиндийское паломничество, путь из Враджа прямо к Расике без похода с книгами (⚠24)."
