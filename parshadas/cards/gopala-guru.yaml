open_questions:
  - "Происхождение имени «Гуру»: урок о святом имени преданному в Пури (T), объяснение практики ребёнку (песня в T) или ласковая шутка Господа (M) (F8–F11)."
  - "Как он получил Радхаканту: от Самого Господа (T, с днём Магха шукла-двадаши), после ухода Вакрешвары (M) или «при нём» / основал сам (B); M 238 — установил Вакрешвара (F25–F29)."
  - "Отождествление: Манджумедха/Манджумедхика (Гуру-пранали — B, T) или Тунгавидья (M) (F51, F52)."
  - "Его учителя в расе: Вакрешвара (B, T) или также Сварупа и Рагхунатха (M); B 581 «ученик Сварупы» (F19–F21)."
  - "Чудо на костре и передача матха: чиновники ведомства (T 203) или люди царя (T 62); законная передача до окончательного ухода (T 203) (F57–F59)."
  - "Даты жизни; ремонт храма 1538–1548 (только T) (F30)."
  - "«Гаура-говиндарчана-паддхати» — только T (F40)."
