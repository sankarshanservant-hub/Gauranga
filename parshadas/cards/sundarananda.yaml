open_questions:
  - "День ухода: Картика-пурнима (T, наш календарь), кришна-экадаши Пауши (праздник в Махешпуре, B), Магха-пурнима (B «где-то») (F26–F28)."
  - "Божества: оба увезены в Саидабад, в Махешпуре — деревянное (T) или увезён лишь Радха-валлабха, а Радха-валлабха и Радха-рамана служат в Махешпуре и ныне (B) (F14, F15)."
  - "Кадамба на лимонном дереве: чудо Сундарананды (Девакинандана, B, T) или Нитьянанды (ЧБ Антья 5) (F21)."
  - "Тигры: ловил сам (B) или его слуга (ванданы) (F24)."
  - "Расстояние от Мадждии: 13 (B) или 14 миль (T) (F9); где самадхи — не сказано (F29)."
