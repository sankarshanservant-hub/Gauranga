     note: "Старший брат; через его милость Говинда пришёл к Шринивасе; велел переселиться в Телия Будхари (БР 9.121–135); просил Ачарью о посвящении брата (БР 10.166–170); по ПВ 14 — привёл Шринивасу к больному Говинде."}
  - {type: grandfather, who: "@damodara-sena-kavi", facts: [F4, F6, F7, F8], events: [ev-ramachandra-kaviraja-birth], note: "Дед по матери, поэт-шакта (БР 9.143; M 154); T 212 и B 1108 — ученик Нарахари (⚠5); B 939 один раз — «পিতামহ» (описка)."}
  - {type: guru, who: "@srinivasa-acharya", facts: [F11, F12, F13, F16, F17, F18, F24, F28, F34, F35, F36], events: [ev-govinda-kaviraja-initiation, ev-srinivasa-disciples],
     note: "Посвятил в мантру Радха-Кришны в Будхари (БР 10.171; по ПВ 14 — после исцеления остатками); велел описывать лилу Чайтаньи (БР 10.294) и Радхи-Кришны, читать БРС и «Уджджвалу» (ПВ 14.188–192); дал славу «Кавираджи» (БР 10.296). = @srinivasa-acharya F90."}
  - {type: spouse, who: "@mahamaya-govinda", facts: [F41], note: "Махамая (B 944; ПВ 20.16); милость ей оказал Шриниваса (ПВ 20.15; «Карнананда» 1.113)."}
  - {type: son, who: "@divyasimha-kaviraja", facts: [F18, F42, F43], events: [ev-govinda-kaviraja-initiation, ev-srinivasa-disciples], note: "Ученик Шринивасы («Карнананда» 1.114); по ПВ 14 — ходил с письмом за Шринивасой и встретил его."}
  - {type: relative, who: "@ghanashyama-kaviraja", facts: [F43], note: "Внук, сын Дивьясимхи (только B 944)."}
  - {type: siksha-guru, who: "@jiva-gosvami", facts: [F24, F26, F32, F33, F55, F60, F61], events: [ev-jiva-srinivasa-letters, ev-jiva-sends-gopala-virudavali], note: "Дал (с другими Госвами) звание «Кавираджа» (B 523; T 189 — «Анубхашья» к ЧЧ Ади 10.85; БР 1.446–447, ⚠3); при прощании во Вриндаване просил присылать песни и дал «Гопала-вирудавали» (БР 11.281–284); в письмах просил присылать его песни (БР 1.449–450; 14.29–39); Говинда послал ему «Гитамриту» (БР 14.39). = @jiva-gosvami F180."}
  - {type: other, who: "@gopala-bhatta", facts: [F54, F55], events: [ev-jahnava-vrindavana, ev-jiva-sends-gopala-virudavali], note: "Обнял его при знакомстве у места Акруры и при прощании (БР 11.117, 11.275)."}
  - {type: other, who: "@lokanatha", facts: [F55], events: [ev-jiva-sends-gopala-virudavali], note: "Через Говинду передал наставления Нароттаме (БР 11.276–279)."}
  - {type: other, who: "@krishnadasa-kaviraja", facts: [F55, F60], events: [ev-jiva-sends-gopala-virudavali], note: "Обнял Говинду при прощании (БР 11.285); поклоны от него — в письме Дживы (БР 14.36–38)."}
  - {type: other, who: "@vira-hambira", facts: [F59], events: [ev-vira-hambira-yajigrama], note: "Прощаясь в Кантака-нагаре, кланялся стопам Рамачандры и Говинды (БР 13.134)."}
  - {type: other, who: "@vamshidasa-chakravarti", facts: [F53, F57], events: [ev-vamshidasa-chakravarti-initiation], note: "Увидел Шринивасу в доме Говинды в Будхари (БР 10.305)."}
  - {type: other, who: "@narahari-chakravarti", facts: [F61, F64], note: "Автор БР и ГЧЧ; песнь о поэзии Говинды (БР 14.41–44), строфа о нём в ГЧЧ 1.22 (ур. C)."}
  - {type: other, who: "@jahnava", facts: [F24, F37], events: [ev-jahnava-vrindavana, ev-jahnava-returns-through-kheturi], note: "Принимал её в Будхари (M 66); шёл с ней во Вриндаван и обратно — Кхетури, Будхари, Экачакра, Кантака-нагар (БР 10.749; 11.114–404, 11.673–680; НВ 9); B 941 — среди давших титул. = @jahnava F56, F101."}
  - {type: other, who: "@parameshvara-dasa", facts: [F24, F54], events: [ev-jahnava-vrindavana], note: "Представил его Госвами («сосуд бхакти-расы, жизнь всех вайшнавов») и попросил послушать его стихи (БР 11.115, 11.145–147). = @parameshvara-dasa F39–F40."}
  - {type: friend, who: "@narottama-dasa", facts: [F32, F33, F36, F40], events: [ev-kheturi-festival, ev-jiva-srinivasa-letters], note: "Песнь «Слава Тхакуру Нароттаме» (БР 1.438–444); жил с ним и Рамачандрой в Кхетури (БР 14.30); передал ему слова Госвами и «Гопала-вирудавали» (БР 11.354–355; НВ 9.141–142)."}
  - {type: friend, who: "@santosha-datta", facts: [F21, F39], events: [ev-santosha-datta-sangita-madhava], note: "С его позволения сочинил «Сангита-мадхаву»; «едины во всём, различны лишь тела» (БР 1.461, 1.480)."}
  - {type: host, who: "@virabhadra", facts: [F38], events: [ev-virachandra-yajigrama-kheturi], note: "M 14–15: Вирачандра два дня гостил в его доме в Будхари; он совершил ему пуджу."}
  - {type: other, who: "@shyamananda", facts: [F36], events: [ev-kheturi-festival], note: "Послан Шринивасой к Шьямананде (НВ 6.165)."}
  - {type: other, who: "@raghunandana", facts: [F36], events: [ev-kheturi-festival], note: "На празднике в Кхетури приставлен к жилищу Рагхунанданы (НВ 6.320)."}
  - {type: other, who: "@harinarayana-raja", facts: [F32], note: "По его просьбе сложил песнь о Раме (БР 1.456–460)."}
  - {type: other, who: "@rupa-gosvami", facts: [F28, I3], note: "Песни — по расам «Бхакти-расамрита-синдху» и «Уджджвала-ниламани» (B 941; ПВ 14.191–192). = @rupa-gosvami F328."}
  - {type: other, who: "@vidyapati", facts: [F27], note: "Слагал пады по образцу пад Видьяпати (B 941)."}
  - {type: other, who: "@durga", facts: [F8, F10, F13, F18, F34], events: [ev-govinda-kaviraja-initiation, ev-chand-raya-deliverance], note: "Прежде поклонялся Бхагавати; её голос велел служить Кришне (БР 9.159; ПВ 14.119–128); ПВ 18.202–205 — Дурга приводит его в пример Чанд Раю (⚠Б1, ⚠Б3)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F2, F24], note: "«Анубхашья» к ЧЧ Ади 10.78–79 (младший сын Чирандживы — Говинда дас Кавирадж, автор пад) и 10.85 (Джива дал имя «Кавираджа»)."}
  - {type: other, who: "@govinda-servant", facts: [], note: "Тёзка, не путать: слуга Господа в Пури (у B — «Шри Говинда дас»)."}
  - {type: other, who: "@govinda-acharya", facts: [], note: "Тёзка, не путать: «слагатель песен и стихов» ГГД 41 (Паурнамаси) — спутник Господа."}
