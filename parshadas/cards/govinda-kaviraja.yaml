open_questions:
  - "Как он пришёл к Шринивасе: по БР (знамения, посвящение в Будхари) или по ПВ 14 (смертельная болезнь, исцеление остатками) (⚠1)."
  - "Где братья жили до Будхари: Кумаранагар (БР 9.133) или Кумарахатта (B 940) (⚠2)."
  - "Даты явления и ухода (1459 и 1535 гг. Шака) — только B, без первоисточника (⚠11)."
  - "«Гитамрита»: БР 14.39 называет её посланной Дживе (собрание песен) — сохранилась ли и что в неё входило (⚠8)."
  - "Пады БР 5 и 12 с подписью «Говиндадас» — все ли его (⚠12)."
