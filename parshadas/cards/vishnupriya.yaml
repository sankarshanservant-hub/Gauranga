    place: "#navadvipa"
    facts: [F104, F105, F106, F100, F103, F90]
    events: [ev-vishnupriya-departure, ev-shachi-vishnupriya-passing]
    note: "Время и место ухода в книгах не названы; она пережила Господа и жила в доме Гауры в Майяпуре (F104); весть получил Шриниваса в Яджиграме (F105); Ишана пережил её (F100). По T 68 она пережила и Шачи (F102) — но там же Шриниваса застаёт Шачи (F95). Только у Говинда-девы: Шачи и Вишнуприя ушли ещё до ухода Господа (lila-db, ev-shachi-vishnupriya-passing)."
