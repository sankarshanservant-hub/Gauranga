id: "@vishnupriya"
names:
  ru: "Вишнуприя-деви"
  en: "Vishnupriya Devi"
  variants: ["Вишнуприя Тхакурани", "Ишвари", "Вишнуприя-ма", "Мать мира (джаганмата)", "Лакшми", "Махалакшми", "Нараяни", "Прия", "Парамешвари"]
