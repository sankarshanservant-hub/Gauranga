id: "@vasudeva-datta"
names:
  ru: "Васудева Датта"
  en: "Vasudeva Datta"
  variants: ["Шри Васудева Датта Тхакур", "Датта Тхакур", "Васу Датта (Лочан)", "Васудева Датта Махашая (ЧБ Антья 8.14)", "слуга Господа, махашая (ЧЧ Ади 10.41)", "единственный самоцвет рода Даттов (махакавья 13.146)", "старший брат Мукунды (ЧЧН 8)", "слуга Вайкунтхи («Анубхашья»)"]
  facts: [F1]
kind: associate
circle: [navadvipa, puri]
circle_note: "Жил в Навадвипе, затем в Кумарахатте (Канчанапалли); после санньясы Господа — ежегодно приходил в Пури с преданными Гауды."
period: [P07, P12, P13, P14]
period_note: "Лично — в Навадвипе: киртаны у Шриваса, Пундарика, шествие к Кази (P07; ЧБ, B, T); первые приходы в Пури: Ратха-ятра, Айтота, молитва о всех существах (P12, 1513–1514; ЧЧ Мадхья 11–15); поход Господа в Гауду: Кумарахатта, «Я продан Васудеве» (P13, 1514/15; ЧБ Антья 5, ЧЧ Мадхья 16); дальнейшие приходы в Пури (P14). P01 (нисхождение спутников), P03 (детские товарищи, Джаянанда), P05 (пир Лакшми, школа Адвайты), P08 (санньяса — Джаянанда), P15 (сокрытие — Лочан, только изд. 1983 г.) — лишь перечни или поздние источники."
