  facts: [F3, F4, F5, F6, F7, F9, F14, F16]
relations:
  - {type: sibling, who: "@mukunda-datta", facts: [F2, F4, F5, F11, F31, F33],
     note: "Младший брат; оба — певцы Гауранги (ГГД 140: Мадхукантха и Мадхуврата); Васудева считал младшего старшим, ибо тот раньше обрёл милость Господа (ЧЧ Мадхья 11.139–140); пел в его группе на Ратха-ятре. = @mukunda-datta F2–F3, F52–F53."}
  - {type: companion, who: "@mahaprabhu", facts: [F9, F19, F20, F21, F22, F24, F25, F26, F27, F28, F30, F31, F32, F34, F36, F38],
     events: [ev-vasudeva-datta-prayer, ev-shantipura-reunion, ev-gundicha-nine-days-lilas, ev-gauda-journey-ganga-villages],
     note: "Господь радовался ему больше, чем Мукунде (Мадхья 11.138); велел переписать «Брахма-самхиту» и «Карнамриту»; в Айтоте плясал под одно его пение (14.98); на его молитву ответил, что Кришне не нужно его страдание (15.167–169); называл Себя проданным ему (ЧБ Антья 5.26–30); в 1514/15 навестил его дом (Мадхья 16.206)."}
  - {type: friend, who: "@shivananda-sena", facts: [F14, F15, F27, F28, F30, F36],
     events: [ev-farewell-gauda-devotees-instructions, ev-gauda-journey-ganga-villages],
     note: "Ближайший друг и сосед в Кумарахатте; по велению Господа — его «сархел», ведущий хозяйство щедрого Васудевы (ЧЧ Мадхья 15.93–96); вместе ходили в Пури и вместе встречали Господа (махакавья 14; ЧБ Антья 5.18). = @shivananda-sena F15, F32."}
  - {type: friend, who: "@srivasa", facts: [F9, F14, F26, F27, F36],
     events: [ev-shantipura-reunion],
     note: "Близкий друг; жил рядом с ним в Кумарахатте; в доме Шриваса — киртаны в Навадвипе и слова Господа «Я продан Васудеве» (ЧБ Антья 5). = @srivasa F95, F124."}
  - {type: friend, who: "@pundarika-vidyanidhi", facts: [F3, F11], events: [ev-gadadhara-initiation-pundarika],
     note: "Земляк из Читтагонга; лишь Мукунда и Васудева знали славу его тайной премы (ЧБ Мадхья 7.43). = @pundarika-vidyanidhi F12, F15, F30."}
  - {type: protege, who: "@yadunandana-acharya", facts: [F6, F41], events: [ev-raghunatha-dasa-escape],
     note: "Ядунандана Ачарья получил его милость (ЧЧ Ади 12.57; Антья 6.161) и почитал его гуру-благодетелем; но учеником (по дикше) он был у Адвайты (Антья 6.162; «Анубхашья»: «избранник его милости, но не ученик») — ⚠5. Ядунандана — дикша-гуру Рагхунатхи Даса."}
  - {type: other, who: "@raghunatha-dasa", facts: [F41], note: "Ученик облагодетельствованного им Ядунанданы (ЧЧН 10.3; ЧЧ Антья 6.161). = @raghunatha-dasa F2, F13."}
  - {type: patron, who: "@vrindavana-dasa", facts: [F16, F18], events: [ev-vrindavana-dasa-birth],
     note: "Мамгачхи — родина Вриндавана Даса и место Божества Васудевы; по «Према-виласе» 23.71–72 Васудева содержал Вриндавана с матерью при своём храме; по M 234 — Нараяни жила в его доме."}
  - {type: patron, who: "@narayani", facts: [F18], note: "Вдова, мать Вриндавана Даса; жила в его доме (M 234) / при его храме («Према-виласа» 23.72). ⚠Б5."}
  - {type: deity-served, who: "@madana-gopala-mamgachi", facts: [F16, F17],
     note: "Установил Божество Шри Мадана-Гопалы в Мамгачхи (Модадрума-двипа); при Бхактисиддханте Ему служили без заботы («Анубхашья» к Ади 10.41); ныне — рядом с Божествами Саранги Тхакура (T 94; календарь ШЧСМ) — ⚠4."}
  - {type: neighbor, who: "@saranga-thakura", facts: [F17], note: "Мадана-Гопала Васудевы — в храме Саранги Тхакура в Мамгачхи (T 94). = @saranga-thakura F24."}
  - {type: co-worker, who: "@murari-gupta", facts: [F33, F35, F37, F40],
     note: "Пели в одной группе на Ратха-ятре; бились в воде в Индрадьюмне (ЧЧ Мадхья 14.80); вместе посылали угощения (Антья 10.121); вместе не отпускали Джагадананду (Антья 12.98). = @murari-gupta F84–F86, F94."}
  - {type: other, who: "@jagadananda-pandita", facts: [F40], events: [ev-jagadananda-visits-shachi], note: "Пришедшего от Господа Джагадананду Мурари и Васудева окружили заботой и не отпускали (ЧЧ Антья 12.98); B 857 пересказывает неточно (⚠2)."}
  - {type: other, who: "@shachi", facts: [F40], note: "По B 857 — пришёл к Шачи с вестью о Господе; по ЧЧ Антья 12.98 так не сказано (⚠2). = @shachi F114."}
  - {type: other, who: "@svarupa-damodara", facts: [F32], note: "У него Васудева по велению Господа взял две книги с юга, чтобы переписать (ЧЧ Мадхья 11.141–142). = @svarupa-damodara F149."}
  - {type: other, who: "@advaita", facts: [F13, F29, F36],
     note: "С преданными Гауды во главе с Адвайтой ежегодно шёл в Пури; по махакавье 14.60 Адвайта, позванный царём, взял его спутником; «Адвайта-пракаша» 10.28 (ур. D): принял от Адвайты мантру — ⚠6."}
  - {type: other, who: "@gopinatha-acharya", facts: [F30], events: [ev-prataparudra-watches-devotees-roof], note: "Показал его царю с крыши дворца: «А это Васудева Датта и Шивананда Сен» (ЧЧ Мадхья 11.87; ЧЧН 8)."}
  - {type: other, who: "@prataparudra", facts: [F30, F36], events: [ev-prataparudra-watches-devotees-roof], note: "Узнал его, глядя с крыши (ЧЧ Мадхья 11.87)."}
  - {type: other, who: "@haridasa-thakura", facts: [F22], events: [ev-haridasa-sthavara-jangama-deliverance], note: "Напомнил Господу: «Когда Васудева молил освободить все души, Ты пообещал» — и спас всех санкиртаной (ЧЧ Антья 3.73–75)."}
  - {type: other, who: "@prahlada", facts: [F22], note: "Господь: «ты — сам Прахлада» (ЧЧ Мадхья 15.165) — сравнение по качеству, не отождествление."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F6, F14, F16, F21, F22, F41, I1, I2, I3],
     note: "«Анубхашья» к ЧЧ Ади 10.41 (Мамгачхи, Мадана-Гопала), Мадхья 15.93–95, 15.162–163 (сравнение с Христом), 15.165, 15.167–169, Антья 6.161–162 и 6.263 (Ядунандана — не ученик)."}
  - {type: other, who: "@kavi-karnapura", facts: [F1, F6, F24, F28, F30, F31, F34, F36], note: "Махакавья 13.146, 14.14–101, 17.30–39, 20.17; «Чайтанья-чандродая», акты 8–10."}
  - {type: other, who: "@vasu-ghosha", facts: [], note: "Тёзка, не путать: Васудева Гхош, киртания, брат Говинды и Мадхавы Гхошей."}
  - {type: other, who: "@vasudeva-vipra", facts: [], note: "Тёзка, не путать: прокажённый брахман Курма-кшетры (ЧЧ Мадхья 7)."}
