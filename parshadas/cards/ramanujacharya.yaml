teachings_given:
  - "вишиштадвайта: мир и дживы пронизаны Брахманом и зависят от Него, но отличны от Него (рыба и вода, жемчуг на нити) (F19)"
  - "панча-самскара и предание Вишну для всех (F22, F33)"
  - "вайшнавские знаки (тилака, знаки Вишну) по шрути (F28)"
  - "единый порядок храмового поклонения (F37)"
