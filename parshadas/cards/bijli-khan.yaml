  - {type: opposed, who: "@krishnadasa-rajput", facts: [F10, F14], events: [ev-pathans-ramadasa],
     note: "Схвачен отрядом; пригрозил патханам своими двумястами воинами (ЧЧ: «турками») и сотней пушек (ЧЧ 18.173–175)."}
  - {type: opposed, who: "@krishnadasa-mathura", facts: [F9, F10, F11, F12, F13], events: [ev-pathans-ramadasa],
     note: "Санодия-брахман, ученик Мадхавендры Пури; схвачен; бесстрашно объяснил предводителю, что санньяси — его гуру (ЧЧ 18.167–171; по B — вместе с Кришнадасом, ⚠2)."}
  - {type: opposed, who: "@balabhadra-bhattacharya", facts: [F9, F10, F16], events: [ev-pathans-ramadasa],
