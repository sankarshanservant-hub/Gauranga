  - {type: other, who: "@bhaktivinoda", facts: [F19, F20, F24, F27], note: "«Амрита-праваха-бхашья» к ЧЧ Мадхья 18: Биджали Хан и его всадники — «преданные Кришны»; пир — суфий; «деревня патханов-вайшнавов» (источник B 893, ⚠7)."}
