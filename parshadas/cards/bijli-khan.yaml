relations:
  - {type: met, who: "@mahaprabhu", facts: [F8, F9, F15, F16, F17, F20, F21, F24, F25, F26, I1, I3], events: [ev-pathans-ramadasa],
     note: "Отряд Биджли Хана схватил спутников Господа, приняв их за отравителей; очнувшись, Господь плясал с «Хари!», патханы отпустили пленных; после спора Господа с пиром Биджли Хан, видя удачу слуги, сказал «Кришна, Кришна» и пал к стопам; Господь поставил стопу ему на голову (ЧЧ Мадхья 18.163–212; ⚠Б2, ⚠Б6)."}
  - {type: servant, who: "@ramadasa-pathan", facts: [F5, F18, F19, F20, F22, F23, F24], events: [ev-pathans-ramadasa],
