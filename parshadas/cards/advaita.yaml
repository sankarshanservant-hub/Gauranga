period_note: "Лично: явление и юность в Шрихатте/Шантипуре, странствия, дикша, Харидас (P01); явление Господа (P01–P02); толь в Навадвипе, Вишварупа, Ишвара Пури (P04–P05); откровения и Навадвипа (P07); санньяса и Шантипур (P08–P09); ежегодно в Пури (P12, P14); приход Господа в Шантипур после Рамакели (P13); уход — после ухода Господа (P15; книги: T — 1559). P00 — Садашива/Маха-Вишну, причина явления."
life:
  appearance:
    date: "1434"
    tithi: "маги шукла-саптами (Адвайта-саптами); по нашему календарю — Гаура-саптами месяца Мадхава"
    place: "#lauda"
    conf: "титхи — T (и «Адвайта-пракаша», D) = календарь; год — T («Гаудия-вайшнава-абхидхана») и предание; место спорно"
    facts: [F19, F20, F21, F22, F23]
    events: [ev-advaita-birth]
    note: "Место: Наваграм (Лауда, Навограм) в Шрихатте — B, T (БР), «Абхидхана» (Лаура); Шантипур — «Према-виласа» и «некоторые жития» (B считает менее надёжным). B: в год явления Господа Адвайте было 52 (F23)."
  disappearance:
    date: "1559"
    tithi: ""
    place: "#shantipura?"
    conf: "спорно"
    facts: [F23, F141]
    events: [ev-advaita-departure]
    note: "T («Гаудия-вайшнава-абхидхана»): 1559 г., в 125 лет; «Адвайта-виласа» — «век с четвертью». B и M ни даты, ни места не дают. Ушёл после Господа, раньше (M pdf 216) или вместе (M 66) с Ситой, до Кхетури. В нашем календаре дня ухода нет. lila-db: Джаянанда (C), P15."
