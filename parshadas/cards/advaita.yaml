  - "Время и обстоятельства дикши у Мадхавендры: три версии (F30); «джнянавада» до дикши — B, ⚠ лила (F32)."
  - "Прыжок Господа в Гангу: из-за пыли со стоп (B) или из-за слов «иссушил прему» (T, ЧБ Мадхья 17) (F85, F86)."
  - "Шачи-апарадха: просьба о преме (B) или о даршане в Махапракашу (T); кто пришёл к кому (F94, F95)."
  - "Хронология B против ЧЧ/ЧБ: Кази «после санньясы» (F101); кто послал Чандрашекхару (F103); путь в Шантипур (F105); Рамакели до/после Шантипура (F123); первый приход в Пури — через год или три (F112)."
  - "Ответ Адвайты Ачьюте: стыд и просьба о прощении (B, ЧБ) ≠ радость (ЧЧ Ади 12.17) (F125). Кто ответил «солнце не закрыть рукой» (F122)."
  - "Стряпня: в Шантипуре — Сита (T, M) / Шачи (B); в Пури — Адвайта (B, T) / Сита (M) (F108, F120)."
  - "Сыновья: шесть (T) / три (M) / один (B); «Нрисимха, сын Адвайты» (M) (F136, F139). Год рождения Ачьюты (F138)."
  - "Уход: 1559 г., 125 лет — только T; ни места, ни титхи; в нашем календаре дня ухода нет (F23, F141)."
  - "Богословские сноски: F1/F3 (Маха-Вишну и Садашива), F31–F32 (дикша и «джнянавада» — лила), F58/F67/F72 («не узнал», «проверка»), F92 (Йога-васиштха), F96 (апарадха Шачи)."
