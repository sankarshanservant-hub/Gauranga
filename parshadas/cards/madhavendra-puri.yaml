     note: "Парама-гуру Господа (через Ишвару Пури). Господь называл его первым устроителем бхакти-расы (F24), рассказал его историю в Ремуне (F60, F108), читал его шлоку (F110), праздновал день его памяти у Адвайты (F157). Личная встреча в реестре не описана."}
