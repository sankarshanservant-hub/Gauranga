     note: "По B — гуру гуру гуру Валлабхи (Валлабха ← Гададхара Пандит ← Пундарика ← Мадхавендра); в детстве Валлабха учил у него Веды (по «Нидж-варте» — в Каши). Валлабхитское предание о том, что Валлабха поставил его к служению Шринатхаджи (F178–F180), B считает вымыслом (F209)."}
