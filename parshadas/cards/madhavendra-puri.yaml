    conf: "титхи — по календарю Шри Чайтанья Сарасват Матха (так же T); место и год спорны"
    facts: [F139, F148, F150, F151, F152, F153, F154]
    note: "Место: T — Ремуна; ЧЧ места не называет; Телевала и «252 варты» — юг, куда он пошёл за сандалом (F152). Время: до рассказа Господа в Ремуне, пхалгуна 1431 Шака (F153) ≠ «через 32 года после ухода родился Виттхаланатха» — это дало бы ок. 1483 г., до явления Господа (F154). День: принят по календарю Шри Чайтанья Сарасват Матха — Гаура-двадаши (шукла-двадаши) Говинда-масы, т. е. пхалгуны (28.02.2026; 19.03.2027); так же T (F151); у Мурари день памяти — шукла-двадаши чайтры (lila-db, ev-madhavendra-puri-aradhana) — дано сноской (решение пользователя, 2026-10-15)."
