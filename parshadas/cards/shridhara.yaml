period_note: "Лично — в Навадвипе: шутки и торг Нимая с ним в годы учительства (F14–F27; ЧБ Ади 12, Мадхья 9); махапракаша и благословение (F28–F39); шествие к Кази и вода из железного сосуда (F40–F48); тыква накануне санньясы и плач после ухода Господа (F49–F50); в Шантипуре после санньясы (F51); в Пури — с бенгальскими преданными на Ратха-ятре (F52–F53). P03 — лишь в перечне товарищей детства у Джаянанды (F55, по-видимому он); P13 — Мурари 4.14 (шутки после прихода в Кулию, F56)."
