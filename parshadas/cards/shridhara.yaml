  - {type: companion, who: "@nityananda", facts: [F4, F13, F46], events: [ev-shridhara-kholavecha], note: "Один из двенадцати гопалов, традиционно — спутников Нитьянанды (B 115, 271; T 58); Нитьянанда с Адвайтой возглавлял киртан в его дворе (БР 12, по T); по «Навадвипа-дхама-махатмье» Нитьянанда показывает Дживе его дом — «вишрама-стхана» (⚠2)."}
