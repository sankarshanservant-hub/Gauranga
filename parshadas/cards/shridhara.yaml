open_questions:
  - "Где точно стоял дом: в миле к востоку (B, Бхактисиддханта) или к юго-востоку (T) от самадхи Чанда Кази; пруд — небольшой, есть (B) или большой, исчез (T по «Навадвипа-дхама-махатмье») (F11, F13)."
  - "Кто очистился, выпив воды: Господь о Себе (ЧБ Мадхья 23.443–445, Бхактисиддханта) — B относит слова к Шридхаре (F45, ⚠1)."
  - "Отождествление: Кусумасава (ГГД 133) или Судама (таблица издателей «Карчи» 1926, ур. D) (F3, F63)."
  - "Двенадцать гопалов — спутники Нитьянанды (B, T) при том, что ЧЧ Ади 10.67 числит его ветвью Чайтаньи (F4, ⚠2)."
  - "Дата ухода — только календарь ШЧСМ (пурнима Тривикрамы, Снана-ятра); год и место ухода неизвестны; дня явления нет (F54)."
