character:
  - {trait: "бескорыстная бхакти акинчаны: половину скудного заработка — Ганге, от восьми сиддх и царства отказывается ради имени Господа и служения «тому брахману»", facts: [F7, F34, F35, F36]}
  - {trait: "правдивость: «как Юдхиштхира», никогда не меняет честной цены", facts: [F8]}
  - {trait: "ночами напролёт громко поёт имена, не обращая внимания на насмешки", facts: [F10, F29, F40]}
  - {trait: "любящая уступчивость: сердится на шутки Нимая, но, взглянув на Его красоту, отдаёт всё и считает это своей удачей", facts: [F18, F24, F25, F26]}
  - {trait: "смирение: корит себя, что не смог достойно принять Господа, и плачет, что Владыка богов пил его воду", facts: [F44, F47]}
