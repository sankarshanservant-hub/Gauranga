# Карточка лица (формат — parshadas/CARDS.md § 3). Источник — только parshadas/facts/kashishvara.md и lila-db.
id: "@kashishvara"
names:
  ru: "Кашишвара Пандит"
  en: "Kashishvara Pandita"
  variants: ["Шри Кашишвара Пандит (B)", "Брахмачари Кашишвара (ЧЧ Ади 10.138; B)", "Кашишвара Госани / Госвами (ЧЧ Мадхья 10.185, Ади 8.66; ГГД 166; БР 4.195)", "сильный Кашишвара (ЧЧ Ади 10.142; B 326, 331)", "Kashisvara Pandit, Brahmachari or Goswami (T)", "Kashishwara Pandit Goswami (M)"]
  facts: [F1, F44]
kind: associate
circle: [puri, vrindavana]
period: [P12, P13, P14, P15]
period_note: "Лично — с прихода к Господу в Пури после южного странствия, обойдя тиртхи (P12; F18, ЧЧ Мадхья 10.185) до отправки во Вриндаван с Божеством Гаура-Говинды (после открытия Говиндадевы Рупой; F35–F39) и там — до своего ухода, вскоре после сокрытия Господа (P15; БР 4.195, F46). P13 — шёл с Господом из Ориссы к Вриндавану и встречал Его по возвращении (F28). В ЧБ «Кашишвара» есть и в навадвипских киртанах (P05–P08: ЧБ Мадхья 8.114, 13.338, 23.451) — тот ли это Кашишвара, источники не согласуют (⚠6), в period не включено."
life:
  appearance:
    date: ""
    tithi: ""
    place: "#chatra?"
    conf: "год и день явления источники не называют; шрипат — Чатра (F5), родом из Бенгалии (ЧЧ Антья 7.49, F8); в календаре Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-15) дня явления нет"
    facts: [F5, F8]
  disappearance:
    date: ""
    tithi: "Гаура (шукла) чатурдаши месяца Картика (Дамодара-маса)"
    place: "#vrindavana"
    conf: "по нашему календарю (ШЧСМ, 541/ru, проверено 2026-11-15) — Гаура Чатурдаши Дамодара-масы (2026 — 23 ноября), так и B 829, T 140; «по другому мнению» (B, T) — раса-пурнима в Ашвину, M 76 — только пурнима Ашвины; год неизвестен; по БР 4.195 — вскоре после сокрытия Господа, до прихода Шринивасы во Врадж (T 205, B 664); самадхи — во Вриндаване (БР 6.444, 9.204, 11.257–258; F52, F53)"
    facts: [F45, F46, F52, F53]
origin:
  places: ["#chatra"]
  family: ["отец — Шри Васудева Бхаттачарья, род Канджилал Кану, готра Ватсья (F6)", "@rudra-pandita — сын сестры (F9)", "род брата — Чаудхури Чатры, распорядители служения (F10)"]
  varna: "брахман (сын Васудевы Бхаттачарьи, F6; ЧЧ Антья 10.154 — готовил Господу как брахман, F8); родовой титул «Чаудхури» (F7)"
  facts: [F5, F6, F7, F8, F9, F10]
sampradaya:
  name: "ученик Ишвары Пури (линия Мадхавендры Пури); брахмачари"
  facts: [F14, F15, F16]
relations:
  - {type: guru, who: "@ishvara-puri", facts: [F14, F15, F16, F17, I2], events: [ev-govinda-ishvara-puri-servant],
     note: "Дорогой ученик и слуга; по велению гуру перед его уходом пришёл служить Господу (ЧЧ Ади 10.138–139; Мадхья 10.133–134). = @ishvara-puri F59–F61."}
  - {type: served-by, who: "@mahaprabhu", facts: [F17, F18, F19, F20, F21, F22, F23, F25, F26, F27, F28, F30, F35, F36, F37, I1, I2, I3],
     events: [ev-govinda-ishvara-puri-servant, ev-netrotsava-darshan, ev-ratha-yatra-gundicha, ev-gundicha-garden-feast, ev-gaura-govinda-kashishvara],
     note: "Господь принял его служение как слуги Своего гуру, по приказу гуру (ЧЧ Ади 10.140; Мадхья 10.142–147, ⚠Б4); сильный Кашишвара шёл впереди к Джаганнатхе, раздвигая толпу (Ади 10.141–142; Мадхья 12.207, ⚠Б1); во втором круге на Ратха-ятре (Мадхья 13.89); раздавал прасад (Мадхья 12.163–164); Господь — «бесконечно дорогой Кашишваре» (Антья 11.4); послан во Вриндаван с Божеством Гаура-Говинды (БР 2.438–443)."}
  - {type: sibling, who: "@govinda-servant", facts: [F2, F14, F17, F18, F19, F21, F27],
     note: "Духовный брат (оба — ученики Ишвары Пури); по ГГД 137 — Бхрингара и Бхангура; Говинда пришёл сразу, Кашишвара — позже, обойдя тиртхи (Мадхья 10.134, 10.185; ⚠5); Кашишвара впереди, Говинда позади с сосудом воды (Мадхья 12.207). = @govinda-servant F3, F6–F9, F12, F16, F18."}
  - {type: nephew, who: "@rudra-pandita", facts: [F9], note: "Сын сестры, Рудра (Рудрарама) Пандит из Валлабхапура, установивший Радха-валлабху («Анубхашья» к Ади 8.66, 10.106; ЧЧ Ади 10.106; ГГД 135 — Варутхапа); M 75 сливает Валлабхапур с Чатрой (⚠7)."}
  - {type: disciple, who: "@govinda-gosani", facts: [F43, F54], note: "Ученик, дорогой слуга Божества Говинды (ЧЧ Ади 8.66; БР 13.323, F54); M 15 — пуджари Говинды; по «Према-виласе» 18.23–25 — нашёл прибежище у стоп (Бхактакаши или Кашишвары, ⚠14)."}
  - {type: other, who: "@yadavacharya-gosani", facts: [F43, F54], note: "M 15 и БР 13.323 (F54) — ученик Кашишвары; «Према-виласа» 18.24, 25.498 — вместе с Говиндой Госани; по ЧЧ Ади 8.67 — спутник Рупы (тот ли — не сказано; ⚠14)."}
  - {type: deity-served, who: "@gaura-govinda-deity", facts: [F35, F36, F37, F38, F39, F40, I3], events: [ev-gaura-govinda-kashishvara],
     note: "Божество — Свой облик, данное Господом (БР 2.439–443); поставлено справа от Говиндадевы (БР 2.443; «Анурага-валли» 4.89; M 76 — «слева», ⚠11); по «Садхана-дипике» (БР 2.444; B 326) — Божество Кришны, стоявшее рядом с Джаганнатхой (⚠11)."}
  - {type: deity-served, who: "@govinda-deity", facts: [F38, F40], events: [ev-gaura-govinda-kashishvara],
     note: "Служил Говиндадеве во Вриндаване; по «Анурага-валли» 4.93 (ур. C) — первый адхикари Говинды, назначенный Рупой."}
  - {type: other, who: "@rupa-gosvami", facts: [F35, F39, F40, F41], events: [ev-gaura-govinda-kashishvara],
     note: "Послан Господом во Вриндаван по вести Рупы об открытии Говиндадевы, «жить рядом с Рупой и Санатаной» («Садхана-дипика»); «Анурага-валли» 4: Рупа принял его и назначил адхикари, позже — Кришну Пандита."}
  - {type: other, who: "@sanatana-gosvami", facts: [F29, F39, F42],
     note: "Господь познакомил с ним Санатану в Пури (ЧЧ Антья 4.110); Санатана славит его в мангалачаранах ХБВ и «Вайшнава-тошани» (B 485, 490). = @sanatana-gosvami F392 и мангалы."}
  - {type: other, who: "@krishna-pandita-govinda", facts: [F40, F47], note: "Преемник в служении Говинде: после его ухода («Нароттама-виласа» 2.243) или ещё при его жизни («Анурага-валли» 4.98) (⚠13)."}
  - {type: friend, who: "@lokanatha", facts: [F41, F42], events: [ev-lokanatha-life-vrindavana], note: "Названы вместе в мангалах Санатаны; вриндаванский круг (БР 1.202, 1.319–323)."}
  - {type: other, who: "@gopala-bhatta", facts: [F41], events: [ev-lokanatha-life-vrindavana], note: "БР 1.202: Гопала Бхатта с любовью общался с ним во Вриндаване."}
  - {type: friend, who: "@krishnadasa-brahmachari", facts: [F41], events: [ev-divya-simha-krishnadasa], note: "«Према-виласа» 24.183, 25.822 (ур. C): великая дружба."}
  - {type: co-worker, who: "@svarupa-damodara", facts: [F23, F24, F29], events: [ev-gundicha-garden-feast, ev-haridasa-departure, ev-vallabha-bhatta-puri],
     note: "Вместе раздавали прасад (ЧЧ Мадхья 12.163–164; Антья 7.66; 11.84); вместе слышали пение Младшего Харидаса (Антья 2.153)."}
  - {type: co-worker, who: "@jagadananda-pandita", facts: [F23, F24, F29], events: [ev-gundicha-garden-feast, ev-haridasa-departure], note: "Вместе раздавали прасад; ЧЧ Антья 11.4 — Господь «дорог Кашишваре, Владыка жизни Джагадананды»."}
  - {type: co-worker, who: "@mukunda-datta", facts: [F22], events: [ev-ratha-yatra-gundicha], note: "Второй круг на Ратха-ятре: «Кашишвара, Мукунда и все преданные» (ЧЧ Мадхья 13.89)."}
  - {type: other, who: "@nityananda", facts: [F22], events: [ev-ratha-yatra-gundicha], note: "Первый круг — Нитьянанда, второй — Кашишвара (ЧЧ Мадхья 13.88–89)."}
  - {type: other, who: "@prataparudra", facts: [F22], events: [ev-ratha-yatra-gundicha], note: "Третий круг — царь со свитой (ЧЧ Мадхья 13.90)."}
  - {type: other, who: "@sarvabhauma", facts: [F19], note: "Посоветовал Господу исполнить приказ гуру и принять служение Кашишвары и Говинды (ЧЧ Мадхья 10.142–147)."}
  - {type: other, who: "@advaita", facts: [F25, F31], events: [ev-gauda-devotees-arrive-puri], note: "Шёл с Господом встречать его и гаудийцев (ЧБ Антья 8.56–61; Мурари 4.17.19); пада Рамананды — «могучий Кашишвара поддерживает Адвайту»."}
  - {type: other, who: "@ramachandra-puri", facts: [F27], events: [ev-ramachandra-puri-criticism], note: "После его упрёков Господь велел Говинде и Кашишваре есть в другом месте (ЧЧ Антья 8.58–59). = @ramachandra-puri F23, F29."}
  - {type: other, who: "@shridhara", facts: [F33], events: [ev-shridhara-kholavecha], note: "ЧБ Мадхья 23.451: плакал, видя милость Господа к Шридхаре (тот ли Кашишвара — ⚠6)."}
  - {type: other, who: "@vakreshvara", facts: [F3, F30], note: "ЧБ Мадхья 1.6: Господь «дорог сердцу Вакрешвары и Кашишвары»; ГГД 73 и 166 — Шаширекха (⚠4). = @vakreshvara F64, F67."}
  - {type: other, who: "@haridasa-thakura", facts: [F24, F30], events: [ev-haridasa-departure], note: "ЧБ Мадхья 24.3 — Господь «жизнь и богатство Харидаса и Кашишвары»; раздавал прасад на празднике его ухода (ЧЧ Антья 11.84)."}
  - {type: other, who: "@srinivasa-acharya", facts: [F46, F52], note: "Ушёл до прихода Шринивасы во Врадж; Шриниваса оплакивал его и, уходя из Вриндавана, поклонился его самадхи (БР 4.195, 4.214, 6.444–449; T 205; B 664)."}
  - {type: other, who: "@narottama-dasa", facts: [F48], events: [ev-narottama-path-vision], note: "«Нароттама-виласа» 2.188–196: Нароттама оплакивал его; во сне утешен четырьмя (Рупа, Санатана, Рагхунатха Бхатта, Кашишвара)."}
  - {type: other, who: "@kashi-mishra", facts: [F31], note: "Тёзка, не путать: хозяин дома Господа в Пури (Карнапура 16.33 называет их рядом)."}
  - {type: other, who: "@kashinatha", facts: [], note: "Тёзка, не путать: сват второй женитьбы Господа (у M 85 — «Двиджа-Кашишвара», ⚠12)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F2, F3, F5, F9, F10, F11, F20, F44], note: "«Анубхашья» к ЧЧ Ади 8.66, 10.106, Мадхья 10.186: родина, род, Божества Чатры, Рудра Пандит, отождествление вриндаванского Кашишвары Госвами с учеником Ишвары Пури; «сильный Кашишвара с толком применяет силу в служении»."}
