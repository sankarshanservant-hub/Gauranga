open_questions:
  - "Тот ли Кашишвара навадвипских игр ЧБ (Мадхья 8.114, 13.338, 23.451) и гаудиец «Чайтанья-чандродаи» (акт 8), что ученик Ишвары Пури (⚠6)."
  - "Отождествления в лиле Кришны: Бхрингара (ГГД 137), Шаширекха (ГГД 166), манджари («Према-виласа») (⚠4)."
  - "Время ухода: вскоре после сокрытия Господа (БР 4.195) или позже («Анурага-валли»; M 15 — даже при Вирачандре, но это неверно понятая БР 13.322–324, F54; ⚠13); год неизвестен; самадхи — во Вриндаване (БР 6.444, F52, F53)."
  - "Версии передачи Гаура-Говинды: Божество облика Господа (БР 2.439–443) или Божество Кришны рядом с Джаганнатхой («Садхана-дипика») (⚠11)."
