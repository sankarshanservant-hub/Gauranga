events_note: "ev-govinda-ishvara-puri-servant — ЧЧ Ади 10.138–142, Мадхья 10.130–150, 10.185–186; ev-gundicha-garden-feast — ЧЧ Мадхья 12.163–164 (в lila-db cc-2040 тег не проставлен); ev-prataparudra-mercy — Мадхья 13.183 (cc-2054, тег не проставлен; Кашишвары не было рядом); ev-departure-for-gauda — Мадхья 16.127–129; ev-gaura-govinda-kashishvara — БР 2.436–445, «Анурага-валли» 4.70–98; ev-nilachala-sankirtana, ev-gaura-dance-with-devotees — пады ПК 2257, 2064; ev-chaitanya-dasa-feast — ЧЧ Антья 10.154; ev-narottama-path-vision — «Нароттама-виласа» 2.188–196; ev-srinivasa-narottama-shyamananda-vrindavana — «Анурага-валли» 4.100 (после его ухода); ev-kaviraja-ordered-to-write-cc — ЧЧ Ади 8.66 (его ученик Говинда Госани); ev-divya-simha-krishnadasa, ev-rupa-narayana — «Према-виласа» 24, 19 (ур. C). Не включено: ev-shridhara-kholavecha (ЧБ Мадхья 23.451 — тот ли Кашишвара, ⚠6; связь — в relations)."
