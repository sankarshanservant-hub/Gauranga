    conf: "B (гл. о Мадхавендре): санньяса за 39 дней до ухода, 1587 Викрамы / 1452 Шака / 1530 (F78); «Анубхашья»: триданди-санньяса и уход в 1452 Шака в Варанаси; день не назван; в календаре ШЧСМ (541/ru, проверено 2026-11-15) дня ухода нет"
    facts: [F77, F78]
