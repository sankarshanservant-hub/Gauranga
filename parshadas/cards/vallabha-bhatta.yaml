sampradaya:
  name: "посвящён Гададхарой Пандитом в мантру Кишора-Гопалы (ЧЧ Антья 7.144–145, 167; ветвь Гададхары — «Шакха-нирная» по «Анубхашье»); основатель пушти-марги (шуддхадвайта); по позднейшей «Амрита-праваха-бхашье» — ачарья сампрадаи Вишнусвами"
  facts: [F3, F4, F43, F63, F74]
relations:
  - {type: father, who: "@lakshmana-bhatta", facts: [F5, F10, F13], note: "Лакшмана Бхатта («Баттар» в B), андхра-брахман; ушёл из этого мира, когда сыну было 11 лет (B) — «Анубхашья»: весть о кончине отца Валлабха получил в Шешадри."}
  - {type: mother, who: "@ellamma", facts: [F5, F7, F14, F21], note: "Эллама Гару (B); с её позволения он отправился в паломничество и женился."}
  - {type: son, who: "@gopinatha-son-of-vallabha", facts: [F33, F76, F78], note: "Старший сын (1432 Шака); ребёнком склонился к стопам Господа в Адаиле (ЧЧ Мадхья 19.108); ушёл в Пури через 10 лет после ухода отца (B 50)."}
  - {type: son, who: "@vitthalanatha", facts: [F33, F76, F77], note: "Младший сын (1437 Шака); при приходе Господа в Адаил ещё не родился («Анубхашья» к Мадхья 19.108). Подробно — @madhavendra-puri F171–F189."}
  - {type: guru, who: "@gadadhara-pandita", facts: [F3, F42, F43, F56, F62, F63], events: [ev-gadadhara-vallabha-initiation],
     note: "Сначала Гададхара отказал без воли Господа (ЧЧ Антья 7.146–148); посвящение в мантру Кишора-Гопалы — с позволения Господа (7.167). = @gadadhara-pandita F65–F67."}
  - {type: met, who: "@mahaprabhu", facts: [F25, F26, F27, F28, F30, F32, F33, F34, F35, F38, F39, F40, F45, F46, F47, F48, F49, F50, F51, F52, F53, F55, F57, F58, F59, F60, F61, F62, F63],
     events: [ev-vallabha-bhatta-adaila, ev-vallabha-bhatta-puri, ev-vallabha-sridhara-svami, ev-gadadhara-vallabha-initiation],
     note: "Принял Господа в Адаиле (ЧЧ Мадхья 19); в Пури Господь сокрушил его гордость учёностью ради его блага (Антья 7); ⚠Б1, ⚠Б2. Встречи в Каши, у Манаси-Ганги и др. — только варты (D)."}
  - {type: met, who: "@rupa-gosvami", facts: [F30, F31, F64], events: [ev-rupa-prayaga], note: "В Праяге Рупа и Анупама кланялись ему издали; Валлабха признал их лучшими из всех (ЧЧ Мадхья 19.66–72). = @rupa-gosvami F81–F94, F285–F286."}
  - {type: met, who: "@anupama", facts: [F30, F31], note: "Вместе с Рупой в Праяге и Адаиле (ЧЧ Мадхья 19.65–89); тёзка — тоже Валлабха."}
  - {type: host, who: "@raghupati-upadhyaya", facts: [F32], events: [ev-raghupati-upadhyaya], note: "Рагхупати пришёл к Господу в доме Валлабхи; Валлабха и домочадцы изумились его удаче (B 938; T 100; ЧЧ Мадхья 19.92–108)."}
  - {type: other, who: "@balabhadra-bhattacharya", facts: [F31], note: "По просьбе Валлабхи готовил для Господа в Адаиле (ЧЧ Мадхья 19.87)."}
  - {type: other, who: "@krishnadasa-rajput", facts: [F31], note: "Получил остатки Господа в Адаиле (ЧЧ Мадхья 19.89; B 299)."}
  - {type: met, who: "@jiva-gosvami", facts: [F64], events: [ev-jiva-vallabha-dispute], note: "Спор о поправках к БРС (БР 5, по T) или о «Таттва-дипе» (B, по Бхактивиноде); ⚠Б9. = @jiva-gosvami F69–F70, F93."}
  - {type: other, who: "@advaita", facts: [F53, F57], note: "Валлабха спорил с ним о том, вправе ли «жена» звать «мужа» по имени; Адвайта отослал его к Господу (ЧЧ Антья 7.99–101)."}
  - {type: other, who: "@shridhara-svami", facts: [F45, F58, F61], events: [ev-vallabha-sridhara-svami], note: "Валлабха отвергал его комментарий; Господь назвал Шридхару гуру мира и велел толковать «Бхагавату» по нему (ЧЧ Антья 7.109–132)."}
  - {type: other, who: "@svarupa-damodara", facts: [F39, F42, F53, F62], note: "Господь славил Сварупу перед Валлабхой (Антья 7.38–45); Сварупа раздавал прасад на его пиру и ходил за Гададхарой. = @svarupa-damodara F69–F70."}
  - {type: other, who: "@ramananda-raya", facts: [F39, F40], note: "Господь славил Рамананду перед Валлабхой (Антья 7.23–37). = @ramananda-raya F67, F128."}
  - {type: other, who: "@sarvabhauma", facts: [F38], note: "Господь славил Сарвабхауму перед Валлабхой (Антья 7.21–22; T 116; B 1030)."}
  - {type: other, who: "@jagadananda-pandita", facts: [F39, F53, F62], note: "Среди бенгальских вайшнавов, прославленных Господом; раздавал прасад на пиру Валлабхи. = @jagadananda-pandita F77, F82."}
  - {type: lineage-predecessor, who: "@madhavendra-puri", facts: [F3, F12, F23, F24], note: "B: линия Валлабха ← Гададхара ← Пундарика ← Мадхавендра; в детстве учил у него Веды (по вартам; ≠ B 844 — гурукула «Мадхавананды», ⚠Б8); Гопала Мадхавендры. = @madhavendra-puri F137, F163–F198."}
  - {type: patron, who: "@krishnadeva-raya", facts: [F16, F19], note: "Царь Виджаянагары принял его с почётом, одарил и сделал главным жрецом (B 845)."}
  - {type: deity-served, who: "@shrinathji-deity", facts: [F23, F24, F44, F75], note: "Гопала (Шринатхджи) Мадхавендры на Говардхане: установка и восстановление храма Валлабхой — по B (1499 / 1519; ⚠Б6); «Анурага-валли» 8.89 — «адхикари Натхджи»."}
  - {type: other, who: "@keshava-puri", facts: [F79], note: "B 74: «некоторые говорят» — старший брат Валлабхачарьи; достоверность под вопросом (⚠Б10)."}
  - {type: other, who: "@vallabhacharya", facts: [], note: "Тёзка, не путать: отец Лакшмиприи, житель Навадвипы."}
