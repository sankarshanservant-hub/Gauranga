period_note: "Лично с Господом — в Праяге и Адаиле на пути из Вриндавана (P13; ЧЧ Мадхья 19.61–113; 1434/1435 Шака) и в Пури на Ратха-ятре (P14; ЧЧ Антья 7). Детство, странствия, Виджаянагара, Говардхана — до встреч (по B и «Анубхашье»); спор с Дживой во Вриндаване (F64) — по БР/T и B, вне lila-db-периодов Господа; встречи у Манаси-Ганги, в Каши и др. — только в валлабхитских книгах (D; F80)."
life:
