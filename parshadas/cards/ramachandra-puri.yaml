  facts: [F1]
kind: other
kind_note: "Санньяси ордена Пури, ученик Мадхавендры, отвергнутый гуру; в ЧЧ Антья 8 — хулитель, упрекавший Господа и Его спутников (F3, F12, F24–F26). ГГД 92 включает его в лилу Гауры (прежде — Вибхишана; ради дела в него вошла Джатила, F5); ванданы славят его среди санньяси (F6). Не «спутник-слуга» и не противник-асура: пример оскорбления гуру и вайшнавов (⚠Б1, ⚠Б6)."
circle: [elders, puri]
period: [P05, P13, P14]
period_note: "Лично — при уходе Мадхавендры (P05 по lila-db; F8–F14); в Варанаси в пору путешествия Господа во Вриндаван — Господь объявлял, что живёт в его матхе (P13; ЧБ Мадхья 19.105; F43–F44); в Нилачале в поздние годы (P14; ЧЧ Антья 8; F15–F40). Год прихода в Нилачалу и ухода из неё ЧЧ не называет."
