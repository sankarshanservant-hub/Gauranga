  - {type: other, who: "@chandrashekhara-vaidya", facts: [F44], events: [ev-kashi-tapana-mishra], note: "В Каши Господь на деле жил у Чандрашекхары, а объявлял — в матхе Рамачандры Пури («Гаудия-бхашья» к ЧБ Мадхья 19.105)."}
  - {type: other, who: "@vrindavana-dasa", facts: [F43], note: "ЧБ Мадхья 19.105 — единственное упоминание о нём в ЧБ."}
