relations:
  - {type: guru, who: "@madhavendra-puri", facts: [F3, F8, F9, F10, F11, F12, F13, F14], events: [ev-madhavendra-puri-departure],
     note: "Посвящённый ученик; при уходе гуру стал учить его «Брахману», и Мадхавендра в гневе отверг его (ЧЧ Антья 8.16–25; = @madhavendra-puri F141–F147)."}
  - {type: other, who: "@ishvara-puri", facts: [F13], events: [ev-madhavendra-puri-departure],
     note: "Духовный брат; Ишвара Пури служил гуру и стал «океаном премы», Рамачандра — «хулителем всех»: «свидетели милости и немилости великой души» (ЧЧ Антья 8.26–30; = @ishvara-puri F21)."}
  - {type: other, who: "@mahaprabhu", facts: [F15, F16, F24, F25, F26, F27, F30, F31, F32, F35, F36, F39, F42, F43, F44, I9, I10], events: [ev-ramachandra-puri-criticism, ev-kashi-tapana-mishra],
     note: "Господь из гуру-буддхи кланялся ему и назвал Себя его учеником, но его упрёки (муравьи, «санньяси ест сладкое») привели к тому, что Он сократил пищу (ЧЧ Антья 8.1, 8.50 «санкоча-бхая», ⚠Б3); то служил ему, то не считался с ним, «как с травинкой» (8.92); в Каши объявлял, что живёт в его матхе (ЧБ Мадхья 19.105)."}
  - {type: other, who: "@paramananda-puri", facts: [F15, F16, F33, F34], events: [ev-ramachandra-puri-criticism],
     note: "Духовный брат; поклонился его стопам (ЧЧ Антья 8.6), а затем с преданными просил Господа не урезать трапезу из-за его хулы (8.69–81; = @paramananda-puri F53–F54)."}
  - {type: host, who: "@jagadananda-pandita", facts: [F18, F19, F21], events: [ev-ramachandra-puri-criticism],
     note: "Угостил его прасадом Джаганнатхи; тот перекормил Джагадананду и осудил «обжорство» последователей Чайтаньи (ЧЧ Антья 8.8–14; = @jagadananda-pandita F38). Кавираджа противопоставляет искренность Джагадананды его лицемерию (T 109)."}
  - {type: other, who: "@govinda-servant", facts: [F23, F27, F29], events: [ev-ramachandra-puri-criticism], note: "Через Говинду Господь установил урезанную меру пищи (ЧЧ Антья 8.50–59)."}
  - {type: other, who: "@kashishvara", facts: [F23, F29], note: "Ел вместе с Господом и Говиндой; Господь велел ему питаться в другом месте (ЧЧ Антья 8.38, 8.59)."}
  - {type: other, who: "@gadadhara-pandita", facts: [F38], note: "У него, Бхагавана Ачарьи и Сарвабхаумы Господь ел без сокращения (ЧЧ Антья 8.88–89)."}
  - {type: other, who: "@bhagavan-acharya", facts: [F38]}
  - {type: other, who: "@sarvabhauma", facts: [F38]}
