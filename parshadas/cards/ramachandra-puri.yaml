sampradaya:
  name: "Ученик Мадхавендры Пури (B 74: «мнивший себя учеником»; Бхактисиддханта: «притворный ученик со склонностью к майявада»); санньяси признанного ордена (T: одного из десяти орденов Шанкары)"
