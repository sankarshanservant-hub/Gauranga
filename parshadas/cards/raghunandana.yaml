open_questions:
  - "День ухода: шукла-чатуртхи (T по БР 13.183–184) или шукла-чатурдаши (M) шраваны; в календаре ШЧСМ дня нет (F68)."
  - "Где встретились с Абхирамой: Шрикханда (T) или Бараданги (B, M); где ныне нупура: Акаихат (M) или Кадуи (B) (F46–F48)."
  - "День свадьбы Шринивасы: кришна-трития (B) или акшая-трития (M) вайшакхи (F55)."
  - "Какие Божества: Гопинатха (детство), Гауранга (БР 9, B), Гаура-Гопала (T), «Гопал-Гауранга» и Божества Нарахари «Гауранга и Мадана-Гопала» (M) (F34, F35, F66)."
  - "«Ученик Кришнадас» в Акаи-хате (только T) — кто это (F47)."
  - "Кандарпа-манджари (M) — в ГГД нет (F3); ⚠ богословская сноска: Мадана/Кандарпа = Прадьюмна, не мирской Камадева (F4, F5)."
  - "Встречал ли Рагхунандана Вирачандру в Шрикханде (M pdf 22) — по БР 13 его там принял Канаи после ухода отца (F78)."
