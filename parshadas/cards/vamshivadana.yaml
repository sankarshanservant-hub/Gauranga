  - {type: served-by, who: "@ishana-navadvipa", facts: [F16, F17], note: "После сокрытия Махапрабху и Шачи служил Вишнуприе и Ишане (B 910 по скану; T 68); T 67 — оба удостоились служения семье Господа. = @ishana-navadvipa F22, F23."}
