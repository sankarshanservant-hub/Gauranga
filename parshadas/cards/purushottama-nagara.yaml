  - {type: son, who: "@kanu-thakura", facts: [F14, F16, F34, F35, F36, F37, F38, F39, F40, F41, F42, F43], events: [ev-purushottama-nagara-wonders],
     note: "ЧЧ Ади 11.40; Нитьянанда взял младенца (B — «двенадцатилетнего», ⚠4) в Кхардаху, назвал Шишу Кришнадасом; Джива во Вриндаване — Тхакур Канаи; шрипат Бодхкхана. Потомки Кану считают его отцом не Нагару, а Даса Пурушоттаму ГГД 130 (Стокакришну) — против ГГД 131 и «Анубхашьи» (⚠2)."}
  - {type: guru, who: "@nityananda", facts: [F18, F19, F20, F21, F31, Q1, Q2], events: [ev-purushottama-nagara-wonders, ev-nityananda-preaching-gauda],
     note: "Господин и прибежище (дикша не названа): с рождения погружён в Его стопы (ЧЧ Ади 11.39); в сердце его играет Нитьянанда (ЧБ Антья 5.742); один из двенадцати гопалов; «дорогой Нитьянанде» («Анурага-валли» 8.44). = @nityananda F350, F351, F367, F369, F404."}
  - {type: disciple, who: "@devakinandana-dasa", facts: [F22, F31, F33, Q5, Q6], note: "Автор «Вайшнава-ванданы» — его мантра-ученик (B 945; T 92; M 140; «Анурага-валли» 8.44–45; вандана ч. 2, ст. 87; ч. 3, ст. 1, 31)."}
  - {type: disciple, who: "@madhava-acharya-ganga", facts: [F32, F33], note: "По мнению некоторых (B 926; T 92) — его ученик, по другим — Нитьянанды или Джахнавы; M и «Анубхашья» — главный ученик (M «Madhvacarya», ⚠6). = @jahnava F98, @nityananda F367."}
  - {type: other, who: "@jahnava", facts: [F16, F25, F27, F28, F39], note: "Божества её гади в Сукхасагаре перевезены вместе с его Божествами (Бериграм, Чандуре — «пат Васу-Джахнавы»); вырастила его сына (T: усыновила; «Абхидхана» — отдан ей на колени) и взяла во Вриндаван. = @jahnava F80, F107–F109."}
  - {type: other, who: "@gadadhara-dasa", facts: [F22], note: "Вандана Девакинанданы (ч. 2, ст. 91): Гададхара Дас и Говинда Гхош — при его явлении (строка неясна); в ч. 5, ст. 68 чудо с цветком карави приписано Гададхаре Дасу."}
  - {type: other, who: "@govinda-ghosha", facts: [F22], note: "Там же (ч. 2, ст. 91)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F5, F24, F25, F27, F29, F33], note: "«Анубхашья» к ЧЧ Ади 11.38–40 — источник главы B (шрипат, Божества, ученики); отвечает потомкам Кану: Нагара Пурушоттама ГГД 131 — именно сын Садашивы (⚠2)."}
