open_questions:
  - "Кто отец Кану Тхакура: Нагара Пурушоттама, сын Садашивы (ГГД 131, ЧЧ Ади 11.38–40, «Анубхашья»), или Дас Пурушоттама — Стокакришна (ГГД 130; предание потомков Кану, «Первая вандана») (⚠2)."
  - "Сколько было Кану, когда Нитьянанда взял его: «двенадцать лет» (B, «Анубхашья») или «двенадцать дней» («Абхидхана») (⚠4); год явления Кану — 1457 (B) или 1450 (M) Шака (⚠9)."
  - "Какому Пурушоттаме принадлежат дни явления и ухода «Шрилы Пурушоттама Тхакура» в календаре ШЧСМ (⚠8); год и место ухода неизвестны."
  - "Откуда пояснение B о четырнадцати маузах «Нагара-деши» (⚠10)."
