period_note: "Время жизни источники не называют. По lila-db (cc-0158 — ЧЧ Ади 11.38–40, ванданы vv-0020, vv-0021) — в перечне спутников Нитьянанды в Гауде, условно P12 (ev-purushottama-nagara-wonders). Сын Кану явился, по потомкам, в 1457 г. Шака (≈ 1535, т. е. уже после сокрытия Господа, P15; по M — 1450 Шака ≈ 1528) — сам Пурушоттама в этих рассказах лишь упоминается (F15–F16, ⚠9). Вандана Девакинанданы и «Вайшнавабхидхана» (vv-0059, PX) — поклонение ему как гуру автора."
