places_note: "Шрипат — Сукхасагар (между ст. Чакдаха и Шимурали; старый поглотила река, новый — в 3–4 милях от Чандуре к югу от Калиганджа). Его Божества: Беледанга → Сукхасагар → Сахебданга-Бериграм → Чандуре (Чандурия; округ Надия, в миле от ст. Симурали и Палпары), ныне под надзором рода Ганги из Джирата. Бодхкхана — шрипат сына, Кану; Кхардаха — куда Нитьянанда взял младенца Кану; Гуптипара — по преданию, жилище деда Камсари Сена. Нагара-деша — местность из пяти (T) или четырнадцати (B) селений вокруг Палпары (F7, ⚠10)."
