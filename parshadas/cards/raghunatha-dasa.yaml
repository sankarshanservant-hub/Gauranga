period_note: "Лично: юношей в Шантипуре у Господа (P13); в Саптаграме и Панихати, затем в Пури при Господе под опекой Сварупы (P14); после ухода Господа и Сварупы — во Врадже, на Радха-кунде, до глубокой старости (P15). Детство (милость Харидаса в Чандпуре) — до P13."
