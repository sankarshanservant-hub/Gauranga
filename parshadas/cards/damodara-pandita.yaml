period_note: "Лично — в Навадвипе в годы санкиртаны (ЧМ, пады, ЧЧН — F65, F66, F72); в Катву за Господом (F41); в Шантипуре и на пути в Пури (F4–F7); в Пури — с 1510 г. (F8–F25), в Гауду и обратно (1514, F26–F28); послан в Навадвипу к Шачи и приходил оттуда в Пури (F33–F36, F55–F60); после ухода Господа — в Навадвипе (F38–F39, F69, F71). P00 — как собеседник Мурари о причинах нисхождения (F58)."
