open_questions:
  - "Последние годы и год ухода: правил до 1540 (B, T) или передал царство сыну ещё при Господе и жил вдали от Нилачалы (БР 3.214, 3.219); ЧЧН — в Пури после сокрытия Господа (⚠4)."
  - "Порядок: тайный даршан и сон по ЧБ (после Гауды) и встреча на первой Ратха-ятре по ЧЧ; версии Лочана, Мурари и «Гаура-кришнодаи» (шестирукий облик) — не сливать (⚠6, ⚠9, F89)."
  - "«Ветвь Гададхары» (B, T) или ветвь древа Шри Чайтаньи (ЧЧ Ади 10.135) — источник B и T не назван (⚠1)."
  - "Сколько сыновей у Гаури и кто старший — БР не говорит (⚠2)."
