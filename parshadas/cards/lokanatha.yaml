period_note: "Лично — в Навадвипе у Господа в аграхаяну перед санньясой, послан во Врадж (P07; F18–F32); ищет Господа на Юге (P11, B — с Бхугарбхой) и во Вриндаване, разминувшись с Ним (P13; F35–F37); жизнь у Чир-гхата и Кишора-кунды, Радха-винода, Госвами (P14; F38–F55); после сокрытия Господа — Нароттама, Шриниваса, Джахнава, запрет Кавирадже (P15; F57–F77). Учёба у Адвайты (P05) — только «Адвайта-пракаша» (D, F84)."
