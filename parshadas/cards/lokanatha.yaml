relations:
  - {type: father, who: "@padmanabha-chakravarti", facts: [F7, F8, F15, F16, F17], note: "Ученик и любимец Адвайты (B 1069; M 96; БР 1.298); M однажды — «Бхаттачарья» (⚠6)."}
  - {type: mother, who: "@sita-lokanatha", facts: [F7, F15, F16]}
