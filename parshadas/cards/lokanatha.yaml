  - {type: guru, who: "@mahaprabhu", facts: [F3, F22, F25, F27, F31, F37, F71], events: [ev-lokanatha-sent-to-vrindavana, ev-lokanatha-searches-lord, ev-lokanatha-dream-narottama-prophecy],
     note: "Господь и наставник: обнял, послал вестником во Врадж к Чир-гхату, утешил во сне; «гуру Локанатхи — Гауранга» (T 219; M 255) — формального посвящения источники не описывают (⚠Б6)."}
  - {type: other, who: "@advaita", facts: [F8, F84], events: [ev-lokanatha-comes-to-advaita], note: "Гуру его родителей; по «Адвайта-пракаше» (D) — учитель и дал мантру Кришны."}
  - {type: friend, who: "@bhugarbha", facts: [F4, F32, F33, F34, F35, F38, F42, F45, F78], events: [ev-lokanatha-sent-to-vrindavana, ev-lokanatha-bhugarbha-in-vraja, ev-lokanatha-life-vrindavana],
     note: "Неразлучный друг («тела лишь разные», БР 1.317); вместе ушли во Врадж (B, T; M — встретил там); седьмой и восьмой Госвами. = @bhugarbha F12–F23."}
  - {type: other, who: "@gadadhara-pandita", facts: [F32, F85], note: "Отпустил с ним своего ученика Бхугарбху (B 1073); «Шакха-нирная» (через «Анубхашью», с «?») относит Локанатху к его ветви (⚠11)."}
  - {type: deity-served, who: "@radha-vinoda-deity", facts: [F47, F48, F49, F50, F51, F52, F53, F55], event: ev-lokanatha-life-vrindavana,
     note: "Явился у Кишора-кунды в Умрао (B — во сне велел служить; T, M, БР — Господь в ином облике вручил); носил Его в сумке-храме на груди; ныне — в храме Радха-Гокулананды (T 152)."}
  - {type: disciple, who: "@narottama-dasa", facts: [F60, F61, F62, F63, F64, F65, F66, F67, F68, F69, F70, F71], events: [ev-narottama-meets-lokanatha, ev-narottama-initiation, ev-books-leave-vrindavana, ev-narottama-returns-kheturi, ev-kheturi-six-deities],
     note: "Единственный ученик: тайное служение, посвящение в полнолуние шраваны; велел вернуться в Кхетури, служить Гауранге и Кришне, вайшнавам и устроить санкиртану; шесть Божеств Кхетури — по его повелению."}
  - {type: companion, who: "@rupa-gosvami", facts: [F39, F40, F62], event: ev-gopala-mathura-vitthaleshvara, note: "В свите Рупы месяц в Матхуре у Гопалы (ЧЧ Мадхья 18.49); скорбел о его уходе."}
  - {type: companion, who: "@sanatana-gosvami", facts: [F39, F41, F62], note: "Назвал его имя в ХБВ 1.4 и во вступлении «Вайшнава-тошани» (ст. 9)."}
  - {type: companion, who: "@gopala-bhatta", facts: [F39, F40, F42, F43]}
  - {type: companion, who: "@raghunatha-dasa", facts: [F40, F44, F83], note: "У Радха-кунды с Рагхунатхой Дасом и Кришнадасом («Карнананда» 4.432)."}
  - {type: companion, who: "@raghunatha-bhatta", facts: [F40]}
  - {type: companion, who: "@jiva-gosvami", facts: [F40, F63, F70, F73, F80], note: "Джива привёл к нему Нароттаму (M 105) и Шринивасу (B 665; БР 4.354–360)."}
  - {type: other, who: "@krishnadasa-kaviraja", facts: [F44, F57, F58], events: [ev-lokanatha-forbids-mention, ev-kaviraja-ordered-to-write-cc], note: "Благословил писать ЧЧ, но запретил упоминать себя; Кавираджа назвал лишь имя (Мадхья 18.49)."}
  - {type: other, who: "@kashishvara", facts: [F41], note: "Назван вместе с ним в ХБВ 1.4 и «Вайшнава-тошани»."}
  - {type: met, who: "@srinivasa-acharya", facts: [F67, F73], events: [ev-srinivasa-arrives-vrindavana, ev-books-mission-decision, ev-srinivasa-second-vrindavana], note: "Вверил его Радха-виноде (БР 4.359); благословил в путь; Шриниваса знал его замысел о Нароттаме (БР 7.119)."}
  - {type: met, who: "@shyamananda", facts: [F68, F73], note: "Благословил посылку троих с книгами (B 1104); по его велению Шьямананду позвали в Кхетури (B 1106)."}
  - {type: met, who: "@jahnava", facts: [F74], event: ev-jahnava-vrindavana}
  - {type: met, who: "@ramachandra-kaviraja", facts: [F75, F80], note: "Милость; по M — дал звание «Кавираджа» (≠ B — Джива)."}
  - {type: other, who: "@vrindavana-dasa", facts: [F46], note: "ЧБ его не называет."}
  - {type: other, who: "@vishvanatha-chakravarti", facts: [F71], note: "В дикша-линии Вишванатхи: Махапрабху — Локанатха — Нароттама — Ганганараяна — Кришначарана — Радхарамана — Вишванатха."}
  - {type: other, who: "@gaurakishora-dasa-babaji", facts: [F72, I5], note: "Параллель: обет не брать учеников и единственный ученик (Бхактисиддханта / Нароттама)."}
  - {type: other, who: "@kavi-karnapura", facts: [F2], note: "ГГД 187."}
  - {type: other, who: "@narahari-chakravarti", facts: [F43, F78, F79, F80], note: "БР 1.295–347; песня о Гопале Бхатте; «Намамрита-самудра» 27."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F3, F57, F60, F85], note: "«Анубхашья» к ЧЧ Мадхья 18.49 (родина, брат, единственный ученик, запрет — «из великого смирения») и к Ади 12."}
