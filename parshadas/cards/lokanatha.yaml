open_questions:
  - "Брат Прагалбха (T, M, «Анубхашья») или единственный сын (B) (F9, ⚠3)."
  - "Причина ухода из дома: бегство от женитьбы (B, ПВ) или после ухода родителей (НВ) (F17, ⚠4)."
  - "Шёл ли во Врадж вместе с Бхугарбхой (B, T) или один через тиртхи (M, БР 1.308) (F32–F33)."
  - "Как явился Радха-винода: во сне (B) или Господь в ином облике вручил Божество (T, M, БР) (F49)."
  - "Лила-манджари (ГГД 187) — Манджулали (ПВ, АВ) (⚠5)."
  - "День, год и место ухода и самадхи: Радха-Гокулананда во Вриндаване (T) или Югала-кунда в Кхадираване (M); ашадха (T) или шравана (M) (F76–F77, ⚠12)."
