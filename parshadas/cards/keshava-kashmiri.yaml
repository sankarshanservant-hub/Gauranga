  - {type: other, who: "@vrindavana-dasa", facts: [F45], note: "Подробно описал победу (ЧБ Ади 13); Кришнадас Кавираджа дополняет разбором шлоки (ЧЧ Ади 16.26–27)."}
  - {type: other, who: "@krishnadasa-kaviraja", facts: [F45, F20, F22, F35], note: "ЧЧ Ади 16.25–109 — разбор шлоки о Ганге."}
