period_note: "Лично — с Нитьянандой в Гауде (Панихати, Эндиядаха; ЧЧ Ади 10.117–118 — после прихода гаудийцев в Пури, P12) и ежегодно в Пури на Ратха-ятре (P12–P14; F19, F20); поселение в Даихате — после санньясы (B 189) или после ухода Господа (M 245) (F22, P15). В Кхетури (P15) — среди спутников, явившихся с Господом на киртане Нароттамы (по БР 10, у M). Навадвипские упоминания (M pdf 41 «Мадхава» при арати; Лочан) — не уточнены, в period не включены."
