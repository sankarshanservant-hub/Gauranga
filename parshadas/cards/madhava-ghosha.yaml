open_questions:
  - "Дни явления и ухода, год и место ухода, самадхи — неизвестны; в календаре ШЧСМ его дней нет (F23)."
  - "Когда поселился в Даихате: после санньясы Господа (B 189, «иные говорят»), «в конце концов» (T) или после ухода Махапрабху (M) (F22, ⚠6)."
  - "Дана-кханда: пел (ЧБ), «давал представление» (T) или «поставил драму с помощью Нитьянанды и Гададхары» (M, «Анубхашья» — *абхиная*) (F16–F18, ⚠7)."
  - "«Мадхава» среди девяти в группе Сварупы (ЧЧ Мадхья 13.73) и при арати в Навадвипе (M pdf 41) — Мадхава Гхош ли (F21, F25)."
  - "Старшинство трёх братьев не названо (F6)."
