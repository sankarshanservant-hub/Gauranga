period: [P04, P07, P09, P12, P13, P14]
period_note: "Лично — в Бенгалии и в Пури: по «Према-виварте» воспитал Джагадананду и привёл его к Господу (P04/P07, F26); по падам — свидетель игр в Навадвипе и разлуки после санньясы (F22, ⚠5); в Кумарахатте принимал Господа в доме Шривасы и у себя (ЧБ Антья 5; ЧЧ Мадхья 16, P09/P13, F17–F18); каждый год вёл преданных Гауды в Пури (P12–P14): Пратапарудра, собака, Накула и Нрисимхананда, удар Нитьянанды, Пури Дас, Рагхунатха (F19–F75)."
