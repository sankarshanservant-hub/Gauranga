open_questions:
  - "Когда он впервые увидел Господа: в Пури, придя с Мурари (Махакавья 13.127), или ещё в Навадвипе и Шантипуре (пады по Маджумдару; ЧЧ Мадхья 11.149 «с самого начала») (F19, F22, ⚠5)."
  - "Даты, место ухода и самадхи неизвестны; в календаре ШЧСМ его нет (F5, F60)."
  - "Храм Кришна-раи в Канчрапаре — храм ли это Шринатхи (Кришнадева ГГД 211 — в Кумарахатте) (F9, F12, ⚠11)."
  - "Авеша и авирбхава: в Накуле и Нрисимхананде (ЧЧ Ади 10.57–59) или наоборот (ГГД 74 по «Анубхашье») (F48, ⚠4)."
  - "Пада ГПТ1 № 25 «দাস শিবানন্দ» — его ли (F23)."
