  en: "Shivananda Sena"
  variants: ["Шри Шивананда Сен (B, T)", "Шивананда, светильник рода Сена, первый среди спутников Махапрабху (ГГД 4)", "«Шива» — в устах Нитьянанды (ЧЧ Антья 12.20)", "ближайший слуга Господа (ЧЧ Ади 10.54)"]
  facts: [F1]
