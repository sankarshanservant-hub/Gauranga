teachings_given:
  - {title: "«Гаятри-нигудхартха»: смысл гаятри — служение Шримати Радхарани («радха-падам дхимахи»)", facts: [F28, F30, F31, F99]}
  - {title: "звук гаятри — песнь флейты Кришны, полная Радха-премы", facts: [F31]}
  - {title: "в «Гите» раскрываются мадхура- и паракия-раса Враджа («упаянти», 10.10)", facts: [F100, F101, Q7]}
  - {title: "милость Махапрабху — по милости Нитьянанды; падшим — прибежище в Навадвипе (апарадха-бханджан-пат)", facts: [F85, Q5]}
  - {title: "не делиться знанием бхакти — «гьяна-шатхья»: помогать каждому искреннему", facts: [F88]}
  - {title: "«Чайтанья Сарасват» — преемственность от Чайтаньи до Сарасвати", facts: [F91]}
  - {title: "отношения гуру и ученика — не только дасья", facts: [F144]}
  - {title: "мы — шуддха-шакты: Радхарани — шуддха-шакти Господа", facts: [F154]}
  - {title: "духовная революция — внутри; служить Кришне через Его близких слуг — гуру, Нитьянанду, Радхарани", facts: [F127]}
  - {title: "Бхактиведанта Свами — шактьявеша-аватара", facts: [F125]}
teachings_received:
