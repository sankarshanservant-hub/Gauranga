  - {type: disciple, who: "@nandana-mishra", facts: [F51, F66], note: "«Нандана» (B, M) / «Нанда» (T) Мишра; комментарий к «Сиддханта-дарпане» (B)."}
  - {type: lineage-successor, who: "@jagannatha-dasa-babaji", facts: [F52, F85, F87, F88], note: "Через Уддхаву Даса (у T — двух Уддхав) и Мадхусудану Даса Бабаджи с Сурья-кунды; в песни-парампаре Бхактисиддханты — «баладева, джаганнатха»."}
