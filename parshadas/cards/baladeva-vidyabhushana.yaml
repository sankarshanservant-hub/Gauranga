open_questions:
  - "Время рождения (1680-е / XVII в. / начало XVIII в.) и род (кхандаит / вайшья) (⚠1, ⚠2); год ухода (после 1764; 1768 — M) (⚠9)."
  - "Где и от кого он узнал учение Махапрабху: Радха-Дамодара в Пури (M) или во Вриндаване (B); чей ученик Радха-Дамодара (⚠3)."
  - "Галта: рамананди или рамануджи; год 1704 / 1706; послан один или с Кришнадевой; срок 18 / 7 дней / 3 месяца (⚠4–⚠7)."
  - "Авторство «Веданта-шьямантаки» (⚠17) и «Айшварья-кадамбини» (= @vishvanatha-chakravarti ⚠9)."
