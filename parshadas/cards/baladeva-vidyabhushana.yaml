  - {type: other, who: "@jiva-gosvami", facts: [F4, F13, F32, F46, F62, F70], note: "«Второй Джива»; комментарий на «Шат-/Таттва-сандарбху», хвала Дживе. = @jiva-gosvami F367–F373."}
  - {type: other, who: "@rupa-gosvami", facts: [F2, F64, F71, F74, F81], note: "Комментарии на «Става-малу», «Лагху-бхагаватамриту», «Натака-чандрику»; «Гитавали» — Рупы. = @rupa-gosvami F251, F331, F332, F445–F452, F522, F568, F574."}
  - {type: other, who: "@sanatana-gosvami", facts: [F30, F62, F64, F81], note: "= @sanatana-gosvami F402, F474."}
  - {type: other, who: "@gopala-bhatta", facts: [F70], note: "Толкование «друга» в «Таттва-сандарбхе» (B 619). = @gopala-bhatta F80."}
  - {type: other, who: "@gopala-guru", facts: [F62], note: "Список ачарьев — и по его «Садхана-паддхати» (B 981). = @gopala-guru F49."}
  - {type: other, who: "@prataparudra", facts: [F58, F59, F76], note: "Стихи о милости Шри Чайтаньи к Гаджапати — в «Прамея-ратнавали», «Сиддханта-дарпане», «Сахитья-каумуди»."}
  - {type: other, who: "@mahaprabhu", facts: [F57, F58, F63, F64, F76], note: "Поклоны и стихи Шри Чайтанье в начале и конце трудов."}
  - {type: other, who: "@bhaktivinoda", facts: [F66, F67, F68, F72, F84], note: "Изучал его труды в Пури; издал «Вишну-сахасра-наму» (1886), «Сиддханта-дарпану» (1890), «Гиту» (1891) с его комментариями. = @bhaktivinoda F58, F126."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F70, F71, F72, F85, F87, F89, F90], note: "Шикша-парампара («баладева, джаганнатха…»); «Анубхашья» цитирует его комментарии."}
  - {type: other, who: "@shridhara-maharaja", facts: [F12, F18, F69, F81, F88, I7], note: "SG: «в телесном смысле, может быть, — член Мадхва-сампрадаи… Он — наш гуру»."}
