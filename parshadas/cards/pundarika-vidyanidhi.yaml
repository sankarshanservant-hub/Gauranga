  facts: [F9, F10, F11, F12, F13, F14, F70, F71]
  note: "ЧБ Мадхья 7.10, Ади 2.36–37: Господь повелел ему явиться в Чаттаграме. Отец переселился в Багхию (Дакка) (комм. Бхактисиддханты; T 52 — род оттуда); родился в Чакрашале (T); шрипат — деревня Мегхала / Мекхала у Хатхазари (B 748, 69, 853; T 43, 52, 85); второй дом — у Ганги в Майяпуре (#house-pundarika)."
