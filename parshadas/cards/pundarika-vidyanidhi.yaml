period: [P00, P01, P07, P09, P12, P14]
period_note: "Из старших, посланных прежде Господа (F7); ученик Мадхавендры Пури (F16); в Навадвипе Господь тоскует о нём и являет его славу, он приезжает, даёт дикшу Гададхаре, бывает на киртанах, в махапракаше и при спасении Джагая и Мадхая (F18–F50); в Пури — ежегодно с преданными Гауды, водные игры со Сварупой, вторичная дикша Гададхары, Одана-шашти (F52–F66). «Отец», лично — не в детстве Господа: Господь впервые видит его в Навадвипе (F45–F47). После санньясы — в разлуке («Чандродая», акт 4) и в Шантипуре (ЧЧ Мадхья 3.153; F77, F80); в Пури — с первого прихода бенгальцев (ЧЧ Мадхья 11; F78), водные игры в Индрадьюмне (F79), жильё в Ямешваре (F74)."
