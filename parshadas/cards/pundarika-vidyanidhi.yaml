open_questions:
  - "Чья жена Ратнавати (Киртида): Пундарики (комм. Бхактисиддханты к ЧБ Ади 2.36–37, B 748, T 52) или Мадхавы Мишры (T 44, M); ГГД 57 допускает оба чтения (F5, F9, F70)."
  - "Отец — Банешвара или Шукламбара («другое мнение» — комм. Бхактисиддханты, B 748) (F9, F70)."
  - "В каком настроении Господь звал его «отцом»: Кришны в разлуке с Радхой (комм. Бхактисиддханты, T 52) или Радхи (T 54; наш перевод ГГД 55) (F3, F70)."
  - "Место рождения: Чакрашала (T) — B и M не называют; шрипат Мегхала / Мекхала — написание расходится (F11, F12)."
  - "Кто посоветовал Гададхаре дикшу: сам Гададхара (B, T 53, M) или Господь (T 46) (F41); когда Пундарика пришёл к Господу — в ту же ночь (B 811) или «однажды ночью» (ЧБ) (F45)."
  - "Водный бой со Сварупой: два случая — Нарендра на Чандана-ятру (ЧБ Антья 8.124; T 54) и Индрадьюмна после Ратха-ятры (ЧЧ Мадхья 14.80); B 751 смешивает (F53, F79)."
  - "«Ачарьянидхи» в ЧЧ (Мадхья 10.82, 12.157; Антья 7.48, 10.4, 10.120, 10.139) — он ли: так у Бхактисиддханты (комм. к ЧБ Ади 2.36–37) и T 109; сама ЧЧ не поясняет (F1, F69, F70, F81)."
  - "Радхаштами в его доме — БР 12.3177 по T, не сверено (F51)."
  - "Год явления, день, год и место ухода неизвестны; дня ухода в календаре ШЧСМ нет."
