  - {type: other, who: "@mahaprabhu", facts: [F3, F6, F16, F18, F19, F20, F21, F27, F45, F46, F47, F48, F49, F50, F52, F57, F67], events: [ev-gadadhara-initiation-pundarika, ev-mahaprakasha-abhisheka, ev-tattva-bhakti-kalpataru],
