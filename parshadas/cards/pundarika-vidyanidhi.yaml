names:
  ru: "Пундарика Видьянидхи"
  en: "Pundarika Vidyanidhi"
  variants: ["Видьянидхи", "Преманидхи («сокровищница любви»)", "Пундарикакша (ГГД)", "Видьянидхи-махашая", "Ачарьянидхи (только T)"]
  facts: [F1, F4, F47]
kind: associate
circle: [elders, navadvipa, puri]
period: [P00, P01, P07, P12, P14]
period_note: "Из старших, посланных прежде Господа (F7); ученик Мадхавендры Пури (F16); в Навадвипе Господь тоскует о нём и являет его славу, он приезжает, даёт дикшу Гададхаре, бывает на киртанах, в махапракаше и при спасении Джагая и Мадхая (F18–F50); в Пури — ежегодно с преданными Гауды, водные игры со Сварупой, вторичная дикша Гададхары, Одана-шашти (F52–F66). «Отец», лично — не в детстве Господа: Господь впервые видит его в Навадвипе (F45–F47)."
life:
  appearance:
    date: "шукла-панчами месяца магха (Мадхава-маса), Шри Кришна Васанта-панчами; по календарю ШЧСМ — 03.02.2025, 23.01.2026, 12.02.2027"
    tithi: "шукла-панчами (васанта-панчами), магха"
    place: "#chakrashala"
    conf: "титхи и место — только T 52; B и M не называют; календарь Шри Чайтанья Сарасват Матха даёт ту же титхи — совпадает с T"
    facts: [F11]
    note: "Календарь Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru и 540/ru; проверено 2026-10-22): «День явления Шрилы Пундарика Видьянидхи» — Мадхава-маса, гаура-панчами (Шри Кришна Васанта-панчами). Год явления источники не называют."
  disappearance:
    date: ""
    conf: "день, год и место ухода ни одна книга не называет; в календаре ШЧСМ дня ухода нет"
    facts: []
