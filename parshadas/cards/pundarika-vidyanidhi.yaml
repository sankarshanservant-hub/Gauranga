  - {type: friend, who: "@svarupa-damodara", facts: [F53, F55, F59, F60, F65, F74, F76, F79], events: [ev-narendra-jala-keli, ev-indradyumna-jala-keli, ev-pundarika-odana-shashthi-slap],
     note: "Задушевный друг ещё с тех пор, как Сварупа звался Пурушоттамой Ачарьей (ЧБ Антья 10.52; B 69, 211); шутливая борьба при встрече в Пури (ЧБ Антья 10.74–76); жили вместе в Нилачале, вместе ходили на даршан Джаганнатхи, брызгались водой на Нарендре; Сварупа ликовал о пощёчинах-милости."}
  - {type: friend, who: "@mukunda-datta", facts: [F15, F30, F31, F32, F33, F36, F39, F70, F71], note: "Земляк из Чаттаграма; один знал его как вайшнава, привёл к нему Гададхару и пением о бхакти открыл его прему; по преданию потомков, часто совершал бхаджан у его кутира в Мекхале (комм. Бхактисиддханты)."}
  - {type: other, who: "@vasudeva-datta", facts: [F12, F15, F30], note: "Земляк; вместе с Мукундой знал его славу (B 749, 855); Мекхала — в 10 крошах от Чханхары."}
  - {type: friend, who: "@madhava-mishra", facts: [F5, F15], note: "Отец Гададхары — его добрый друг (T 53); по ГГД 57 — особое проявление Вришабхану."}
  - {type: companion, who: "@advaita", facts: [F7, F16, F52, F71, F74, F77], event: ev-gauda-devotees-yearly-visit, note: "По T — посвящён у Мадхавендры одновременно с Адвайтой; ежегодно шёл в Нилачалу в группе во главе с Адвайтой."}
  - {type: companion, who: "@srivasa", facts: [F48, F52], note: "Каждую ночь — на киртанах в доме Шривасы; в третий год шёл с ним в Нилачалу (ЧЧ Мадхья 16.16)."}
