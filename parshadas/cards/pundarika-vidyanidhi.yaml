  - {type: friend, who: "@svarupa-damodara", facts: [F53, F55, F59, F60, F65], events: [ev-narendra-jala-keli, ev-pundarika-odana-shashthi-slap],
     note: "Задушевный друг (B 69, 211); жили вместе в Нилачале, вместе ходили на даршан Джаганнатхи, брызгались водой на Нарендре; Сварупа ликовал о пощёчинах-милости."}
  - {type: friend, who: "@mukunda-datta", facts: [F15, F30, F31, F32, F33, F36, F39], note: "Земляк из Чаттаграма; один знал его как вайшнава, привёл к нему Гададхару и пением о бхакти открыл его прему."}
  - {type: other, who: "@vasudeva-datta", facts: [F12, F15, F30], note: "Земляк; вместе с Мукундой знал его славу (B 749, 855); Мекхала — в 10 крошах от Чханхары."}
  - {type: friend, who: "@madhava-mishra", facts: [F5, F15], note: "Отец Гададхары — его добрый друг (T 53); по ГГД 57 — особое проявление Вришабхану."}
  - {type: companion, who: "@advaita", facts: [F7, F16, F52], event: ev-gauda-devotees-yearly-visit, note: "По T — посвящён у Мадхавендры одновременно с Адвайтой; ежегодно шёл в Нилачалу в группе во главе с Адвайтой."}
  - {type: companion, who: "@srivasa", facts: [F48, F52], note: "Каждую ночь — на киртанах в доме Шривасы; в третий год шёл с ним в Нилачалу (ЧЧ Мадхья 16.16)."}
  - {type: companion, who: "@govinda-ghosha", facts: [F52], note: "ЧЧ Мадхья 16.16 (B 848)."}
  - {type: companion, who: "@chandrashekhara-acharya", facts: [F48, F52], note: "Ачарьяратна — в списке идущих в Нилачалу (ЧЧ Мадхья 16.16); киртаны у Шривасы и Чандрашекхары (T 106)."}
  - {type: companion, who: "@gangadasa-pandita", facts: [F48, F50], note: "Вместе названы на киртанах и при Джагае и Мадхае (ЧБ Мадхья 13.238–240)."}
  - {type: met, who: "@jagai-madhai", facts: [F50], event: ev-jagai-madhai-deliverance}
  - {type: deity-served, who: "@jagannatha-deity", facts: [F55, F58, F59, F60, F61, F62, F63, F64, F66], event: ev-pundarika-odana-shashthi-slap,
     note: "Ежедневный даршан на рассвете; Одана-шашти: разыгранное осуждение крахмальной ткани и пощёчины во сне — милость (⚠Б3)."}
  - {type: other, who: "@balarama", facts: [F62, F63, F66], event: ev-pundarika-odana-shashthi-slap, note: "Вместе с Джаганнатхой бил его во сне по щекам (ЧЧ Мадхья 16.80; ЧБ Антья 10)."}
  - {type: other, who: "@vallabhacharya", facts: [F17], note: "B 27: цепь гуру Валлабхи — Мадхавендра → Пундарика → Гададхара → Валлабха (против «Чаураси байтхак»)."}
  - {type: other, who: "@vrindavana-dasa", facts: [F67], note: "Описал его жизнь (ЧБ Мадхья 7, Антья 10) и плод слушания о нём."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F44, F56], note: "Комментарии «Гаудия-бхашьи» (по T 54–55): вайшнава не узнать по внешности; мантра — шабда-брахман."}
  - {type: other, who: "@ramananda-raya", facts: [F68], note: "B 689–690: та же подлинная вайрагья, хоть внешне в богатстве."}
