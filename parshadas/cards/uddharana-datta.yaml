open_questions:
  - "Год ухода: Шака 1463 (B, T) против БР 8.202 — «сокрылся недавно» перед приходом Нароттамы (⚠7)."
  - "Порядок: Кхардах → Саптаграм (ЧБ, БР 12.3722–3752) и после свадьбы — Надия → Шантипур → Саптаграм → Кхардах (БР 12.4009–4013; M 65, T 199 — с расхождениями) (⚠5, F50)."
  - "Родители и сын — «по мнению некоторых» («Анубхашья») (⚠3); место самадхи — Уддхаранпур или Вриндаван."
  - "Кто такой «раджа Найраджа» (⚠4); отождествление в «Гопала-нирнае» — Махабала (⚠9)."
