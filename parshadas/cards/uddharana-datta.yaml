    conf: "Шака 1403 (1481 г.) — B и T, без первоисточника; день не назван; в календаре Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-16) дня явления нет"
    facts: [F6]
