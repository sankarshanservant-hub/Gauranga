events_note: "ev-nityananda-preaching-gauda — ЧБ Антья 5.443–460, 5.718–756 (cb-3083, cb-3089), пада Баларамы даса (pad-0204), «Гопала-нирная» (vv-0061); ev-uddharana-pilgrimage-nityananda — ванданы (vv-0030, vv-0051, vv-0076; так и БР 8.186); ev-nityananda-advaita-meeting-shantipura — Мурари 4.22.22–25 (mkc-0248); ev-panihati-chida-dadhi — ЧЧ Антья 6.63 (cc-4065); ev-nityananda-marriage — АП 20, НВВ 1, ПВ 24 (apr-0136, apr-0139, nvv-0005, nvv-0007, pvl-0231, pvl-0270); ev-nityananda-awakens-shridama — НВВ 10.55 (nvv-0068); ev-tattva-bhakti-kalpataru — ЧЧ Ади 11.41 (cc-0159). ev-jahnava-returns-through-kheturi (БР 11.773–779) и ev-narottama-gauda-pilgrimage (БР 8.142–205) — записи этих событий в lila-db только из «Нароттама-виласы», где он не назван; БР 8 и 11 ещё не внесены — связь отмечена в notes событий (сплошная проверка, 2026-11-16). БР 12.3722–3752 (Нитьянанда в Саптаграме) — в lila-db записи нет (БР 12 ещё не переведена)."
