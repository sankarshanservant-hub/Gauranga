period: [P12, P14, P15]
period_note: "Лично — спутник Нитьянанды в Гауде: Саптаграм и путь в Шантипур (P12; ЧБ Антья 5, БР 12, Мурари 4.22 — F16–F25, F44), праздник в Панихати (P14; ЧЧ Антья 6.63 — F42), сватовство и свадьба Нитьянанды (P15 в lila-db; F22–F23, F45–F46). После его ухода — Джахнава, Нароттама, Вирачандра в его доме (P15; F32–F34). Перечни ветвей и слуг Нитьянанды (ЧЧ Ади 11.41, ЧБ Антья 5.743 — PX) — лишь упоминания."
