    date: "1541"
    tithi: "Пауша (Нараяна-маса), кришна-трайодаши"
    place: ""
    conf: "Шака 1463 (= 1541/42 г.; T ошибочно — «1552», ⚠6), Пауша кришна-трайодаши — B и T (B: по другому мнению — Аграхаяна); по календарю ШЧСМ (541/ru, проверено 2026-11-16) — «День ухода Шрилы Уддхарана даса Тхакура», Нараяна маса, кришна-трайодаши (5 января 2027 г., вместе с днём ухода Махеши Пандита); по БР 8.202 сокрылся незадолго до прихода Нароттамы — хронология спорна (⚠7)"
    facts: [F31, F33]
  samadhi: [{place: "#uddharanapura", facts: [F30], note: "к западу от храма в Уддхаранпуре; по мнению некоторых — во Вриндаване (B 923, по «Анубхашье»)"}]
origin:
  places: ["#saptagrama"]
  family: ["@kara-datta", "@bhadravati-saptagrama", "@shrinivasa-datta"]
  varna: "суварна-ваник (торговец золотом) по рождению (ЧБ Антья 5.453; B 922; T 90)"
  facts: [F6, F7, F8, F9, F10]
  note: "Имена родителей и сына — у B, T, M как факт, в «Анубхашье» к ЧЧ Ади 11.41 — «по мнению некоторых» (⚠3). Вайшнав не определяется рождением: он — вечный спутник Субаху, лишь явившийся в этом роду (⚠Б1)."
relations:
