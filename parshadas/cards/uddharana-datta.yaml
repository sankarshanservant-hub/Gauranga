     note: "Вечный слуга Нитьянанды, ветвь Его древа (ЧЧ Ади 11.41); принимал Его в Саптаграме и готовил Ему пищу (ЧБ Антья 5.449–453; БР 8, 12); с Ним обходил святые места Гауды (вандана; БР 8.186); сватал Ему дочерей Сурьядаса (ПВ 24, АП 20, НВВ 1). «Гуру» — в смысле господина и прибежища; формального посвящения источники не называют. = @nityananda F297–F299, F338, F348, F369, F405–F406, I4."}
  - {type: other, who: "@advaita", facts: [F18, F22, F24, F44], events: [ev-nityananda-advaita-meeting-shantipura], note: "Шёл с Нитьянандой из Саптаграма в Шантипур к Адвайте (Мурари 4.22.22; БР 12.3752); M 65 — пригласил Нитьянанду из дома Адвайты в Саптаграм."}
  - {type: other, who: "@suryadasa-pandita", facts: [F45], events: [ev-nityananda-marriage], note: "Сватал Нитьянанде его дочерей; в Амбике назвал Его Сурьядасу «Ньяя-чудамани» (АП 20.8–9; НВВ 1.88–90; ПВ 24.615–620; ур. C)."}
  - {type: host, who: "@jahnava", facts: [F22, F23, F32], events: [ev-jahnava-returns-through-kheturi], note: "После свадьбы Нитьянанды — в Саптаграме у него (T 199, M 65); после его ухода она посетила его дом (B 924; T 91, 200; M 70; БР 11.773–779). = @jahnava F35, F37, F90."}
  - {type: other, who: "@vasudha", facts: [F22], note: "M 65 — вместе с Нитьянандой и Джахнавой (у Адвайты, затем в Саптаграме)."}
  - {type: other, who: "@virabhadra", facts: [F34, F47, F51], events: [ev-nityananda-awakens-shridama], note: "M 14 (БР 13.283–287) — по пути во Вриндаван гостил два дня у его сына; НВВ 10.55 — Вирачандра пересказывает предание, слышанное от Уддхараны (ур. C)."}
  - {type: other, who: "@narottama-dasa", facts: [F33], events: [ev-narottama-gauda-pilgrimage], note: "Пришёл в его дом в Саптаграме вскоре после его ухода и застал преданных в разлуке (БР 8.200–205; M 108; T 209)."}
  - {type: other, who: "@abhirama", facts: [F47], events: [ev-nityananda-awakens-shridama], note: "Предание о пробуждении Шридамы-Абхирамы — со слов Уддхараны (НВВ 10.55)."}
  - {type: other, who: "@hoda-krishnadasa", facts: [F45], events: [ev-nityananda-marriage], note: "ПВ 24.614–620: в доме Кришнадаса Хода в Догачхии сообщает о сватовстве."}
  - {type: other, who: "@mahesha-pandita", facts: [F19, F31], note: "Последовал за Нитьянандой в Саптаграм (T 86); собрат по двенадцати гопалам; их дни ухода совпадают (Пауша кришна-трайодаши; календарь ШЧСМ)."}
  - {type: other, who: "@raghunatha-dasa", facts: [F42], events: [ev-panihati-chida-dadhi], note: "Гость его праздника чида-дадхи в Панихати (ЧЧ Антья 6.63)."}
  - {type: deity-served, who: "@gaura-shadbhuja-saptagrama", facts: [F36], note: "Установил и служил своими руками; справа Нитьянанда, слева Гададхара (B; T — без Гададхары)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F12, F26, F29, F30, F36, F37, F38, F39], note: "«Анубхашья» к ЧЧ Ади 11.41 и «Гаудия-бхашья» к ЧБ Антья 5.453 — основа главы B (шрипат, Наихати, Уддхаранпур, родные — «по мнению некоторых»)."}
  - {type: other, who: "@bhaktivedanta-svami", facts: [F38, F39, F41], note: "Бывал в его храме в детстве и в 1967 г.; его комментарий к ЧЧ Ади 11.41 приводит T 92. = @bhaktivedanta-svami F9."}
