open_questions:
  - "Год и место ухода, место самадхи; родина и родители — неизвестны."
  - "Число носильщиков бревна: 16 (ЧЧ), 32 (ГГД), «более ста» (БР) (⚠1)."
  - "Был ли он в Кхетури: только T 96, против БР 10.374 (⚠4)."
  - "Атрибуция «Пата-парьятаны» (только T, ⚠12) и основание Бали-матха в Пури («многие говорят», B, T)."
  - "Тот ли Рамадас — «Шри Рама», «Рамаи», «киртания Рамадас» Мурари, пад и поздних житий (lila-db)."
