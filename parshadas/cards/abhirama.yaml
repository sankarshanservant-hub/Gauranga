period: [P12, P14, P15]
period_note: "Лично в первоисточниках: P12 — послан Господом с Нитьянандой в Гауду (ЧЧ Ади 10.117–118, 11.13–14; Мадхья 15.43; ЧБ Антья 5.231–240; F12–F15); P14 — Чида-дадхи в Панихати (ЧЧ Антья 6.61, 6.90; F18); P15 — после сокрытия Нитьянанды: Шриниваса и Нароттама в Кханакуле (БР 4, 8; F40–F46), Вирачандра (поздние источники, F38, F59). Пады ставят его рядом с Господом в Навадвипе (P07: гоштха-лила, нанда-утсава — F58, ур. A–C), Джаянанда — с Нитьянандой после санньясы (P09), «Нитьянанда-вамша-вистара» — встреча с Нитьянандой-авадхутой во Вриндаване (P05) — в period не включены (поздние или поэтические свидетельства)."
