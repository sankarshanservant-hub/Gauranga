relations:
  - {type: companion, who: "@nityananda", facts: [F3, F4, F12, F13, F14, F15, F16, F17, F18, F20, F46], events: [ev-nityananda-sent-to-gauda, ev-nityananda-panihati-abhisheka, ev-nityananda-preaching-gauda, ev-panihati-chida-dadhi],
     note: "Самый дорогой спутник («чья жизнь — Нитьянанда»); по велению Господа послан с Ним в Гауду; по Его велению — ачарья и проповедник; «безумен от погружённости в Нитьянанду» (БР 4.103–104); по Его воле женился (БР 4.107); Нитьянанда приходил в его дом (БР 4.120); после Его сокрытия — в безмолвной разлуке (БР 4.125). = @nityananda F261–F262, F267, F349, F365, F369, F377."}
  - {type: other, who: "@mahaprabhu", facts: [F5, F12], events: [ev-nityananda-sent-to-gauda], note: "Преданный Чайтаньи, посланный Им с Нитьянандой в Гауду; потому числится в обеих ганах (ЧЧ Ади 11.13–15; Мадхья 15.43)."}
  - {type: spouse, who: "@malini-abhirama", facts: [F20, F21, F43, F45], events: [ev-abhirama-whip-srinivasa], note: "Малини-деви, дочь брахмана; брак по воле Нитьянанды (БР 4.107); вместе служили Гопинатхе; удержала его руку, когда он касался Шринивасы плетью (БР 4.141–143); вместе благословили Нароттаму (БР 8.225)."}
  - {type: siksha-disciple, who: "@srinivasa-acharya", facts: [F40, F41, F42, F43, F44, F60], events: [ev-srinivasa-khardaha-jahnava, ev-abhirama-whip-srinivasa],
     note: "Испытал его и трижды коснулся плетью Джая-мангала, даровав прему; «как ученик, хотя не посвящённый» (T 88); по «Шакха-нирнае» («Анубхашья») — «половина ученика» (24½). = @srinivasa-acharya F46."}
  - {type: met, who: "@narottama-dasa", facts: [F45, F54], events: [ev-narottama-gauda-pilgrimage], note: "Нароттама пришёл в Кханакул; Абхирама в разлуке почти не сознавал внешнего; вместе с Малини благословил его и велел идти в Нилачалу (БР 8.223–227; M 108)."}
  - {type: companion, who: "@gadadhara-dasa", facts: [F5, F12, F13, F54], events: [ev-nityananda-sent-to-gauda], note: "Вместе посланы с Нитьянандой; оба в двух ганах (ЧЧ Ади 11.13–15). = @gadadhara-dasa F16."}
  - {type: companion, who: "@madhava-ghosha", facts: [F5, F12], events: [ev-nityananda-sent-to-gauda], note: "ЧЧ Ади 10.117–118: трое — Рамадас, Мадхава и Васудева Гхош — пошли с Нитьянандой; так же в обеих ганах (B 188)."}
  - {type: companion, who: "@vasu-ghosha", facts: [F5, F12], events: [ev-nityananda-sent-to-gauda], note: "Там же (ЧЧ Ади 10.117–118; B 188)."}
  - {type: companion, who: "@raghunatha-vaidya-upadhyaya", facts: [F13], note: "Вместе на пути в Гауду (ЧБ Антья 5.231–233)."}
  - {type: companion, who: "@parameshvara-dasa", facts: [F3, F13], note: "Вместе на пути в Гауду; один из двенадцати гопалов (ЧБ Антья 5.231–240; B 919)."}
  - {type: companion, who: "@purandara-pandita", facts: [F13], note: "Вместе на пути в Гауду (ЧБ Антья 5.231–233)."}
  - {type: companion, who: "@sundarananda", facts: [F3, F15, F18], events: [ev-associates-of-nityananda-wonders], note: "Один из двенадцати гопалов; в Панихати — «Шри Рама, Сундара, Гауридас» (Мурари 4.22); на Чида-дадхи (ЧЧ Антья 6.61)."}
  - {type: companion, who: "@gauridasa-pandita", facts: [F3, F15, F58], events: [ev-goshtha-lila-navadvipa], note: "Один из двенадцати гопалов; в падах о гоштха-лиле — рядом (Шридама и Субала)."}
  - {type: other, who: "@raghava-pandita", facts: [F15, F50], note: "Нитьянанда с Рамадасом и Гададхарой первым пришёл в его дом в Панихати (T 80); «мешки Рагхавы» в «Пата-парьятане», приписываемой Абхираме (T 78)."}
  - {type: other, who: "@raghunatha-dasa", facts: [F18], events: [ev-panihati-chida-dadhi], note: "Гость на празднике Чида-дадхи, устроенном Рагхунатхой (ЧЧ Антья 6.61, 6.90)."}
  - {type: other, who: "@virabhadra", facts: [F38, F49, F59], events: [ev-virachandra-recognized, ev-virabhadra-initiation, ev-virachandra-pilgrimage],
     note: "Вирабхадра вынес его поклоны; Абхирама сложил «Вирабхадраштаку» (B 917; T 88); поздние источники (ур. C): узнал в младенце Гаурангу; разбил флейтой лодку, когда тот плыл к Адвайте за мантрой; представил его спутникам в Пури."}
  - {type: other, who: "@ganga-nityananda", facts: [F38, F49], note: "Дочь Нитьянанды Гангамата (Ганга-деви) вынесла его поклоны; «Ганга-стотра» (B 917; T 88)."}
  - {type: other, who: "@jahnava", facts: [F40, F59], events: [ev-srinivasa-khardaha-jahnava, ev-virabhadra-initiation], note: "Послала к нему Шринивасу (БР 4.93; ПВ 5 — с письмом); по ПВ 24 и НВВ 3 — послала его вернуть Вирабхадру (ур. C)."}
  - {type: other, who: "@vasudha", facts: [F40], note: "Вместе с Джахнавой велела Шринивасе идти к Абхираме (БР 4.93)."}
  - {type: other, who: "@ishana-navadvipa", facts: [F40], events: [ev-abhirama-whip-srinivasa], note: "По ПВ 4–5 (ур. C) — спутник Шринивасы к Абхираме, доставил письмо Джахнавы. = @ishana-navadvipa F26–F27."}
  - {type: met, who: "@raghunandana", facts: [F36, F39], note: "Открыл его как воплощение Мадана (Лочан, Сутра 651–652); Рагхунандана выдержал его поклон, вместе пели и плясали (Шрикханда — T; Бараданги — B, M; нупура упала в Акаи-хате). = @raghunandana F4, F45–F47."}
  - {type: other, who: "@mukunda-dasa", facts: [F39], note: "Отец Рагхунанданы; спрятал сына, боясь поклона Абхирамы (песня Уддхавы даса, B 288)."}
  - {type: met, who: "@gopala-guru", facts: [F39], note: "Пришёл в Пури испытать мальчика поклоном; Господь взял его на колени (только T 62, 202). = @gopala-guru F12–F13."}
  - {type: deity-served, who: "@gopinatha-khanakul", facts: [F22, F23, F26, F27, F28, F30, F45, F53], note: "Явился ему во сне и указал место; обретён при рытье Рама-кунды (БР 4.113–119; B 915; T 88; M 1); на плите пробирного камня с лилой похищения одежд."}
  - {type: disciple, who: "@vedagarbha-acharya", facts: [F2, F60], note: "Ученик; его стих приводит БР 4.112; по «Шакха-нирнае» («Анубхашья») — в Кайяре, потомки служат Божеству."}
  - {type: other, who: "@jayananda", facts: [F47], note: "Джаянанда распространяет свою «Чайтанья-мангалу» по благословению Абхирамы (ур. C)."}
  - {type: other, who: "@bhaktivinoda", facts: [F32], note: "Посетил его шрипат (T 233). = @bhaktivinoda F74."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F32, F57, F60], note: "Посетил Кханакул на парикраме Гаура-мандалы (T 89); «Анубхашья» к ЧЧ Ади 11.13 — основа главы B (шрипат, Божества, кнут, перечень учеников)."}
  - {type: other, who: "@minaketana-ramadasa", facts: [F48], note: "Тёзка, не путать; T 96 по ошибке ставит Абхираму рядом с ним в свите Джахнавы в Кхетури (БР 10.374 — только Минакетана Рамадас, ⚠4)."}
  - {type: other, who: "@ramadasa-shivananda-son", facts: [], note: "Тёзка, не путать (ЧЧ Ади 10.62)."}
  - {type: other, who: "@ramadasa-phulia", facts: [], note: "Тёзка, не путать («Према-виласа» 24)."}
