events: []
events_note: "В lila-db событий нет (XIX–XX вв.). По T/B/M: детство в Уле и Калькутте; служба (Орисса, Бенгалия, Бихар); Пури 1869–1874 (Бишикишан, Бхагавата-самсад, рождение Бхактисиддханты); встреча с Джаганнатхой Дасом Бабаджи (1880); открытие места явления (1887–1893); Божества Гауры-Вишнуприи (21.03.1894); отставка (1894), Годрума; бабаджи-веша (1908); уход 23.06.1914."
teachings_given:
  - {text: "Не умствовать о Боге, а с верой петь Святое Имя (вывод T из его детства)", facts: [F31]}
  - {text: "Бог всемогущ и потому может иметь форму; Он — вечный господин, я — вечный слуга (Видьясагару)", facts: [F35]}
  - {text: "Различие чистого имени, намабхасы и намапарадхи", facts: [F78]}
  - {text: "С хулителем вайшнавов не говорить", facts: [F95]}
  - {text: "Мирская варнашрама сама по себе не ведёт к предании; соблюдать дайва-варнашраму", facts: [F113, F114]}
  - {text: "Петь имя громко, но по счёту — защита от невнимательности", facts: [F179]}
  - {text: "Оставить дом духа Кали и поклоняться Луне Годрумы, помня игры Гауры-Гададхары", facts: [F125]}
teachings_received: []
