events: []
events_note: "В lila-db событий нет (XIX–XX вв.). По T/B: Вриндаван (30 лет); Навадвипа с 1893 г.; встреча с Бхактисиддхантой (1898) и его посвящение (1900); наставления; уход 17.11.1915 и спор о похоронах; перенос самадхи (1932)."
teachings_given:
  - {text: "Мнимое «спасение мира» ради денег и почёта — падение за обман", facts: [F45]}
  - {text: "Чтение «Бхагаваты» за деньги — не бхаджан, а вред миру", facts: [F46, F40]}
  - {text: "Благочестие и учёность не дают права на дикшу", facts: [F31]}
  - {text: "Дворец губит отреченца: хочешь общества — приходи в дхаму есть мадхукари", facts: [F50]}
  - {text: "«Нет никого, кто мне неприятен или мил; все достойны почтения»", facts: [F43]}
  - {text: "Святой — в доме у Бхактивиноды, не на «базаре»", facts: [F26]}
