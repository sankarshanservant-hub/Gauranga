period_note: "Лично — в Навадвипе после возвращения Господа из Гаи (P07: према в его доме, рис из сумы, трапеза у него, киртаны; F10–F44); после санньясы — в Шантипуре (P09; ЧЧ Мадхья 3.153; по Джаянанде — зван в Катву, F45); ходил с гаудийцами в Пури на Ратха-ятру (P12; F46–F47); Господь принял подаяние в его доме по пути из Кулии (P13, только Лочан, ⚠12); после сокрытия Господа встречал Шринивасу и Нароттаму в Навадвипе (P15; F48–F49). P01 — лишь назван в обете Адвайты (ЧБ Ади 2.118–119, F9). Пляска в Кхетури (БР 10.593, НВ 7.117) — видение Господа со спутниками, не включено."
