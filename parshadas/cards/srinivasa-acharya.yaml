id: "@srinivasa-acharya"
names:
  ru: "Шринивас Ачарья (Тхакур)"
  en: "Srinivasa Acharya (Thakura)"
  variants: ["Шринивас", "Шри Ачарья Прабху", "Ачарья Тхакур", "Шринивас Тхакур", "гранточарья (так про себя назвал его Вира Хамбир, T)"]
  facts: [F1, F57, F134]
kind: acharya
circle: [later, vrindavana]
period: [P14, P15]
period_note: "Родился при жизни Господа (P14: предсказание в Пури, рождение в Чакханди); всё служение — после сокрытия Господа (P15): Пури у Гададхары, Навадвипа, Вриндаван у Дживы и Гопалы Бхатты, книги в Гауду, Вишнупур, Кхетури, Яджиграм."
life:
  appearance:
    date: "1530 (только T)"
    tithi: "вайшакха-пурнима (пурнима месяца Мадхусудана), накшатра Рохини — B, M, T и наш календарь"
    place: "#chakhandi"
    conf: "день — все согласны; год — только T"
    facts: [F15, F16]
  disappearance:
    date: ""
    tithi: "Гаура-аштами месяца Дамодара (Гопаштами) — по нашему календарю; книги дня не дают"
    place: ""
    conf: "Место и год книги не называют; кто ушёл раньше — Шринивас или Рамачандра — расходятся: M — Шринивас ушёл, не вынеся вести об уходе Рамачандры; T 213, B 1111 — Рамачандра ушёл после Шринивасы; T 210 — наоборот (F135)."
    facts: [F135, F136]
origin:
  places: ["#chakhandi", "#yajigrama"]
  family: ["@chaitanya-dasa", "@lakshmipriya-chakhandi", "@balarama-yajigrama"]
  varna: "брахман (рархи / род Ратия Гхантешвари)"
  facts: [F7, F8, F9, F10, F24, F132]
  note: "Отец Гангадхара Бхаттачарья — «Чайтанья Дас»; мать Лакшмиприя — дочь Баларамы Випры из Яджиграма; после смерти отца жил с матерью в доме деда в Яджиграме."
