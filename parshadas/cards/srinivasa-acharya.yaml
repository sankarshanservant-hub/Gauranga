  - {type: guru, who: "@gopala-bhatta", facts: [F50, F52, F53, F54, F56, F66, F92], events: [ev-srinivasa-initiation], note: "Дикша-гуру; посвятил во Вриндаване (B: после омовения в Ямуне; M: в храме Радха-раманы)."}
  - {type: siksha-guru, who: "@jiva-gosvami", facts: [F4, F51, F52, F55, F56, F57, F58, F62, F63, F64, F65, F66, F67, F68, F76, F92, F93, F94, F96, F118, F119], events: [ev-srinivasa-arrives-vrindavana, ev-srinivasa-acharya-title, ev-srinivasa-narottama-shyamananda-vrindavana, ev-books-mission-decision, ev-jiva-srinivasa-letters], note: "Дал титул «Ачарья», жильё у Радха-Дамодары; послал с книгами в Гауду; два письма; называл «махаттама»."}
  - {type: companion, who: "@narottama-dasa", facts: [F2, F59, F60, F62, F72, F101, F109, F134, F135, F138], events: [ev-srinivasa-narottama-shyamananda-vrindavana, ev-kheturi-festival], note: "Друг, «единый душою»; вместе обошли Врадж и Навадвипу; Кхетури; песни Нароттамы о нём."}
  - {type: companion, who: "@shyamananda", facts: [F61, F62, F72, F92, F94, F95, F106], events: [ev-srinivasa-narottama-shyamananda-vrindavana], note: "Джива вверил Шьямананду Шринивасу (B)."}
