  - {type: daughter, who: "@hemalata", facts: [F117, F120, F123, F126], note: "Старшая дочь; после его ухода проповедовала; сорвала кантхи с Рупы Кавираджа; гуру Ядунанданы Даса."}
  - {type: daughter, who: "@krishnapriya-srinivasa", facts: [F120]}
  - {type: daughter, who: "@kanchanalatika", facts: [F120], note: "Младшая дочь (B, «Карнананда»); M вместо неё называет «Пхулапи Тхакурани»."}
  - {type: son, who: "@vrindavana-acharya", facts: [F118, F121], event: ev-jiva-srinivasa-letters, note: "Старший сын; имя «Вриндаван Дас» дал Джива."}
