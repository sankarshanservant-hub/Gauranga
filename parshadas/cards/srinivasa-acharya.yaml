open_questions:
  - "Кто ушёл раньше — Шринивас или Рамачандра (M ≠ T 213, B 1111; T 210 ≠ T 213) (F135); место ухода не названо."
  - "Порядок: ушли ли Нарахари и Гададхара Дас до второго прихода во Вриндаван (B, T) или после (M) (F91, F100)."
  - "Свадьба: вайшакха кришна-трития (B) или акшая-трития (M) (F82); куда ушёл Шьямананда после кражи — в Уткал (B, T, M гл. о Нароттаме) или в Амбика-Калну (M) (F72)."
  - "Третья дочь — Канчаналатика (B, «Карнананда») или Пхулапи (M) (F120); кто дал Рамачандре титул «Кавирадж» — Шринивас (T 206) или Джива (T 189, 212, B 523, 1109) (F89)."
  - "Мотив поездки родителей в Пури — увидеть Господа (B гл.) или просить сына (T, B 1088) (F11)."
  - "Порядок после Кхетури: БР 10–13 (= T) ≠ B, M (⚠13); Рамачандру во Вриндаван послал Рагхунандана (БР 9) или Шриниваса (M), Ишвари (АнВ) (F164)."
  - "Второй брак: невеста Гауранга-прия по сну Гауры (БР 13) или Падмавати, названная так Вирачандрой (ПВ 17); после смерти сыновей (АнВ 6) (⚠11)."
  - "Имя Виры Хамбира: Чайтанья Дас от Дживы (БР 9, ПВ 20) ≠ Харичарана Дас (ПВ 13), Гопаладас (Крн 1.346) (⚠10)."
  - "Четвёртая дочь Ямуна — только «Анурага-валли» 7 (F192); дочь Шринивасы Пхулапи (M) — ? (F120)."
