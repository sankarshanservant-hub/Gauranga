open_questions:
  - "Годы жизни: 1489–1564 (Бхактивинода) / 1493–1568 (рукопись Радха-раманы; M — 1493) / 1489–1558 (Ашутош Дэв по T) (F3, F5, F7)."
  - "День ухода: шравана-шукла-двадаши (B; наш календарь — Гаура-двадаши Шридхары) против «бхадры» у T — вероятно, солнечный месяц (F8, F616)."
  - "Нумерация «Падьявали»: «прийах со 'йам» — 383 (B 383, T) / 387 (B 311, ВЧД); «йах каумара-харах» — 382 (B) / 386 (ВЧД) (F172, F173, F544)."
  - "Номера стихов: «тунде тандавини» — ВМ 1.33 (B) / 1.15 (T, ВЧД); «Чайтанья-чандродая» 9.104 (B) / 9.38 (T) (F100, F181)."
  - "Кто переселился в Бакла-Чандрадвипу — Кумарадева (B, T) или Мукунда (M); дочерей Падманабхи — 18 (B) или 8 (M) (F12, F13)."
  - "Время и порядок: ночью (B, T) или вечером (M) встреча в Рамакели; кто советовал Господу уйти — Санатана (T) или оба (M) (F51, F62)."
  - "Где ушёл Анупама — в Гауде (B) или в пути (T); кто сказал Санатане (F153)."
  - "Был ли Санатана во Врадже, когда Рупа уходил из Пури (B), или пришёл в Пури позже (T) (F208)."
  - "Путь Говинды из Вриндавана: сразу в Джайпур (B 327–328), через Бхаратпур (T), через Галту (B 989) (F241)."
  - "B pdf 1098: Господь будто бы послал Рупу и Санатану во Вриндаван «до Своего прихода» — против ЧЧ (F299)."
  - "Сладкий рис: место (Тери-кадамба / Павана-саровар) и ответ Санатаны (запрет / самоукор) (F259, F262)."
  - "Явил ли Радха-раману Рупа (B, «по некоторым рассказам») или Гопала Бхатта; дата у M «1599» (F280, F281)."
  - "Датировка «Дана-кели-каумуди» (1549 или 1495) и время написания «Хамса-дуты» и «Уддхава-сандеши» относительно встречи с Господом (F374, F395, F506, F508)."
