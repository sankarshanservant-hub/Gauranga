  - {type: companion, who: "@brahmananda-puri", facts: [F15, F16], note: "Собрат-ученик Мадхавендры; вместе при встрече с Нитьянандой."}
  - {type: other, who: "@ramachandra-puri", facts: [F21], event: ev-madhavendra-puri-departure,
