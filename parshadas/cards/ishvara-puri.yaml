  - "Время ухода: до санньясы Господа (M) ≠ после вестей о санньясе и жизни в Пури (B) (F57, F58)."
  - "Санньяса (B) или посвящение (T) у Мадхавендры (F12)."
  - "Где Нимай впервые встретил его: на дороге (B, M) или у Адвайты (T) (F31)."
  - "Мантра: десятисложная (ЧБ, T, B) ≠ «гаятри» (M) (F52)."
