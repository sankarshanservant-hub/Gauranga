period_note: "Нисходит прежде Господа (F69); лично присутствует при уходе Мадхавендры и встрече того с Нитьянандой (P05), в Навадвипе до Гаи (P05) и в Гае (P06); после — лишь вести о Господе и наказ ученикам (F56–F59); упоминается в рассказах о Ремуне (P09), Пандарпуре (P11), Говинде и Кашишваре (P12)."
life:
