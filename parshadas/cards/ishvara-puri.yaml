  - {type: other, who: "@mukunda-datta", facts: [F29, F68], note: "Песней открыл его экстаз в собрании Адвайты."}
  - {type: host, who: "@gopinatha-acharya", facts: [F34, F37], note: "Несколько месяцев (M — месяц) гостил в его доме в Навадвипе; там же, по БР, написал «Кришна-лиламриту»."}
  - {type: host, who: "@shachi", facts: [F32], note: "Приготовила бхогу для Кришны и подала ему прасад."}
  - {type: siksha-disciple, who: "@gadadhara-pandita", facts: [F36, F37], note: "Учил его по своей «Кришна-лиламрите»."}
  - {type: other, who: "@paramananda-puri", facts: [F73], note: "Духовный брат; потому Господь чтил его как гуру."}
  - {type: other, who: "@ranga-puri", facts: [F74, F77], note: "Духовный брат; узнав, что Господь — ученик Ишвары Пури, исполнился нежности."}
  - {type: other, who: "@srivasa", facts: [F11, F67], note: "Поселился в Кумарахатте у места его рождения; «Девалая» напротив Чайтанья-добы."}
  - {type: other, who: "@shivananda-sena", facts: [F68], note: "Жил в Кумарахатте, городе его рождения."}
  - {type: other, who: "@sarvabhauma", facts: [F63], note: "Спросил Господа, почему Ишвара Пури взял в слуги шудру."}
