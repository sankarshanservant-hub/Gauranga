relations:
  - {type: guru, who: "@bhaktisiddhanta", facts: [F13, F14, F16, F17, F18, F19, F20, F21, F26, F27, F28, F29, F30, F31, F32, F45, F56, F57, F60, F95, F100, F102, F118], note: "Первая встреча — пхалгуни-пурнима 1915 г., Враджа-паттана; дикша — январь 1916 г.; основал для него Бхактивинода-асану (1918); генеральный секретарь миссии, «второй образ моего гуру», «главная опора Гаудия-матха»; в «Guiding Principles» (31.12.1936) — «Кунджа-бабу будет управлять, пока жив». = @bhaktisiddhanta F66, F150, F199, F260–F267."}
