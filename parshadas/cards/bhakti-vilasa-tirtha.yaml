  - {type: disciple, who: "@bhakti-prajnana-yati", facts: [F106, F107, F109, F110, F111, F112, F113], note: "Нандадулал Брахмачари — «особо дорогой ученик»; 10 месяцев учил его философии, в 1952 г. послал в Мадрас; письма 1957–1970; после его ухода — ачарья матхов (гл. 121; = @bhakti-prajnana-yati)."}
  - {type: co-worker, who: "@shridhara-maharaja", facts: [F118, F120], note: "Духовный брат; в последний день Прабхупады попросил брахмачари спеть «Шри Рупа-манджари-пада», но Прабхупада пожелал слышать Шридхара Махараджа (N, SSM). = @shridhara-maharaja F80, F81, F160."}
  - {type: co-worker, who: "@bhakti-dayita-madhava", facts: [F102, F103, F104], note: "Духовный брат: Сарбхог (1936); упрашивал его принять санньясу и присутствовал на ней (1944); «Кунджа-да» в его воспоминаниях (T 286, вероятно он)."}
  - {type: co-worker, who: "@bhakti-pramoda-puri", facts: [F105], note: "По его просьбе Бхакти Прамода Пури семь лет был главным пуджари Йогапитхи (T 294)."}
  - {type: co-worker, who: "@bhakti-pradipa-tirtha", facts: [F117], note: "Проповедь в Налпуре и Маникпуре (1922, «Сарасвати-джаяшри»)."}
  - {type: lineage-predecessor, who: "@madhavendra-puri", facts: [F84], note: "В речи в Удупи (1957): Мадхавендра Пури — парама-гуру Махапрабху, из Мадхва-сампрадаи."}
  - {type: lineage-predecessor, who: "@madhvacharya", facts: [F83, F84, F90], note: "Удупи: гражданское чествование (1957), ответная речь о преемстве; чествование Педжавар-свами."}
