    place: "#chanchuri-purulia"
    conf: "B 1130: 19 чайтры 1301 = понедельник, 2.04.1894 — внутреннее противоречие (19 чайтры 1301 ≈ 1.04.1895, понедельник, по расчёту шукла-саптами — как в календаре ШЧСМ; 2.04.1894 — около кришна-двадаши); столетие праздновали в 1994 г. (гл. 121). Календарь Шри Чайтанья Сарасват Матха (vaishnavacalendar.org/chiangmai/541/ru, проверено 2026-11-23): Вишну-маса, гаура-саптами (25.03.2026; 13.04.2027) — по нему тиртхи (⚠1). Место — Чанчри/Чанчури-Пурулия, Калия, Нарайл, Джессор (B по скану; T 259)."
    facts: [F2, F3, F113]
  disappearance:
    date: "1976-09-10"
    tithi: "Падманабха-маса, кришна-двития (календарь ШЧСМ); 3.20 пополудни, пятница"
    place: "#kolkata"
    conf: "B 1145: 10.09.1976, 3.20 пополудни, после двух месяцев болезни (заболел в Ковуре, привезён в Калькутту; место ухода прямо — Калькутта лишь по смыслу); по расчёту — около кришна-двитии; календарь ШЧСМ (проверено 2026-11-23): Падманабха-маса, кришна-двития (28.09.2026) — совпадает; гл. 121 — та же дата."
    facts: [F92, F93, F94, F112]
