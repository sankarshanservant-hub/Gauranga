    note: "Время и место ухода в реестре не названы. По T, после ухода Господа и Шачи Вамшивадана служил Вишнуприе (F51) — но там же Шриниваса застаёт Шачи живой (F50; противоречие внутри T); Гададхара дас вёл дела Шачи и Вишнуприи, пока их не стало (F52); Джахнава после Кхетури уже не застала её (F71). B 910 (по скану): после ухода Махапрабху и Шачи Вамшивадана служил Вишнуприе и Ишане (F51); по БР 4.55 Шачи явила Шринивасе милость лишь во сне (F65) — т. е. к его приходу её уже не было; упоминание Шачи в пересказе T 68 / B 911 — добавление авторов (F50). Только у Говинда-девы (C): Шачи и Вишнуприя ушли ещё до ухода Господа (lila-db)."
