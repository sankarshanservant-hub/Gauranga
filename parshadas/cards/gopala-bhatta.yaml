period_note: "Лично — мальчиком в Шрирангаме, когда Господь провёл чатурмасью у Венкаты Бхатты (P11); после смерти родителей — во Вриндаване с Рупой и Санатаной, письмо и дары Господа из Нилачалы (P14); явление Радха-рамана (1542), свита Рупы в Матхуре, позволение и запрет Кавираджу, посвящение Шринивасы, встречи с Джахнавой, Нароттамой, Рамачандрой — после ухода Рупы и Санатаны (P15)."
