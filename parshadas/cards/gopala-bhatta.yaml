open_questions:
  - "Годы жизни: 1503–1578 (Бхактивинода, M) или 1500–1585 («Радхарамана-пракатья», T) (F3, F4); титхи явления: кришна-трития (наш календарь) или кришна-трайодаши (M) пауши (F5)."
  - "Чей сын: Венкаты (БР, «Анурага-валли», T, M) или Трималлы (Мурари) (F96–F98)."
  - "Гуру: Прабодхананда — дикша-гуру (T, ХБВ 1.2) или учитель шастр / шикша-гуру (B 596, 607) (F23, F102, F104)."
  - "Что прислал Господь: дор, каупину, бахирвас (B), каупину и одежды бабаджи (M), пояс, каупину и сиденье (T) (F30)."
  - "Шалаграм один (T, 1-я версия) или двенадцать (B, M, T 2-я версия) (F42); явление — сам Гопала Бхатта или Рупа по сну (F47)."
  - "Род служителей Радха-раманы — от Дамодары Даса (B 601) или от Гопинатхи (B 666) (F50)."
  - "Комментарий к «Кришна-карнамрите»: его (БР, T, M) или тёзки из Дравиды (B) (F92)."
  - "«Гопи-бхритья» в подписи «Самскара-дипики» — имя, эпитет или скрытое имя (F89)."
