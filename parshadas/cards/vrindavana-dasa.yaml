relations:
  - {type: mother, who: "@narayani", facts: [F5, F6, F8, F9, F11, F17, F18, F22, F35], events: [ev-vrindavana-dasa-birth, ev-narayani-remnants, ev-shrivasa-sees-chaturbhuja],
     note: "Нараяни, вкусившая остатки Господа (ЧЧ Ади 8.41; ЧБ Антья 5.757, Мадхья 2.321–325, 10.290–296); по ГГД 43 — Килимбика. В своей книге он не говорит, что она — его мать (B 1079); Нитьянанда принял его ради неё (B 1080, по скану)."}
  - {type: father, who: "@vaikuntha-dasa-vipra", facts: [F10, F11], note: "Имя — только по ГВА и «Према-виласе» 23 (через B 1078, T 36, 190); ушёл из мира до рождения сына (≠ приложение рус. изд. ЧБ — «во младенчестве», ⚠3)."}
  - {type: grandfather, who: "@nalina-pandita", facts: [F6], note: "Дед по матери — старший брат Шривасы (ГВА; B 1078; T 36, 190)."}
  - {type: relative, who: "@srivasa", facts: [F6, F7, F35], note: "Двоюродный дед по матери (খুল্লমাতামহ, B 1079); у Шривасы жила Нараяни; ≠ B 866 «внук сестры Шривасы» (⚠2). = @srivasa F134, F142."}
  - {type: relative, who: "@malini", facts: [F7, F11, F17], note: "Двоюродная бабушка; в её родительском доме в Мамгачхи он рос (B 1078; T 191; M 234 — по Бхактисиддханте)."}
  - {type: guru, who: "@nityananda", facts: [F20, F21, F22, F23, F34], events: [ev-tattva-nityananda-advaita],
     note: "Посвящённый ученик, «последний из Его слуг» (ЧБ Антья 5.757); «удостоился величайшей милости Нитьянанды» (ЧЧ Антья 20.82); после его посвящения Нитьянанда пробыл явленным недолго (вывод B 1078–1079); M — посвящение вскоре после сокрытия Господа."}
  - {type: other, who: "@mahaprabhu", facts: [F16, F19, F23, F29], note: "Лично Господа не видел — родился после Навадвипа-лилы (ЧБ Ади 12.284; Мадхья 8.198); «Гаурасундара — Господь моего Господа»; «Сам Шри Чайтанья говорит его устами» (ЧЧ Ади 8.39). T 191 о благословениях Господа у Шривасы — против ЧБ (⚠4)."}
  - {type: disciple, who: "@ramahari-denur", facts: [F39], note: "Один из четырёх учеников; уттара-радхия каястха, наследник имущества и служения в Денуре; потомки служат поныне (B 1079). ≠ приложение рус. изд. ЧБ — «из кшатриев» (⚠7)."}
  - {type: patron, who: "@vasudeva-datta", facts: [F13, F18], note: "Мамгачхи — родина Вриндавана и место Мадана-Гопалы Васудевы (B 853; T 44/86); по ПВ 23 Васудева содержал его с матерью при своём храме, там он учился; M 234 — Нараяни служанкой в доме Васудевы (⚠Б2). = @vasudeva-datta F16, F18."}
  - {type: other, who: "@krishnadasa-kaviraja", facts: [F3, F24, F27, F29], events: [ev-kaviraja-ordered-to-write-cc],
     note: "Кавираджа прославил его как Вьясу игр Чайтаньи (ЧЧ Ади 8.33–42, 11.54–55, 13.48–49; Мадхья 4.5–9; Антья 20.82–88) и дополнил то, что он описал кратко; по T 194, M 78 — «некоторые считают», что Кавираджа (с Лочаном) дал книге имя «Чайтанья-бхагавата»."}
  - {type: other, who: "@lochana-dasa", facts: [F24, F31, F46], note: "Лочан славит его в ЧМ (Сутра-кханда 35); по T 190 — из-за одноимённой поэмы Лочана книгу Вриндавана переименовали (⚠6); молчание ЧБ о Нарахари не означает неприязни (B 179–180)."}
  - {type: other, who: "@murari-gupta", facts: [F10, F32], note: "Опирался на «кадачу» Мурари (B 228); Мурари отца Вриндавана не называет (B 1078)."}
  - {type: other, who: "@jahnava", facts: [F42], events: [ev-kheturi-festival, ev-jahnava-kheturi], note: "Шёл со Шри Джахнавой на праздник в Кхетури (M 234; T 89, 209 — БР 10.376–377; M 66, 112, 214). = @jahnava F51, F52, F68."}
  - {type: other, who: "@haridasa-pandita-govinda", facts: [F28], note: "Харидас Пандит (с Анантой Ачарьей) во Вриндаване постоянно читал ЧБ (ЧЧ Ади 8.59–65; B 266)."}
  - {type: other, who: "@ananta-acharya", facts: [F28], note: "Слушал ЧБ во Вриндаване (B 266; ЧЧ Ади 8.59–60)."}
  - {type: other, who: "@narahari-sarakara", facts: [F31], note: "ЧБ не называет ни его, ни Шрикханду; сахаджии видят в этом неприязнь — чистые преданные отвергают (B 179–180; T 69); «тот, кто напишет, ещё не родился» — намёк на Вриндавана, «по словам некоторых» (B 184). = @narahari-sarakara F84–F86."}
  - {type: other, who: "@vyasa", facts: [F2, F3], note: "По ГГД 109 — он сам Ведавьяса (с вошедшим в него Кусумапидой); по ЧЧ — Вьяса игр Чайтаньи."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F5, F17, F23, F24, F34, F44], note: "«Гаудия-бхашья» к ЧБ (Антья 5.757; Ади 9.225; Ади 17.154–158; Мадхья 8.198, 10.290–296) и очерк «Жизнь Тхакура» во введении (по «Анубхашье» к ЧЧ Ади 8.34, 11.54); M 234 цитирует его о детстве в доме Малини; основал храм и установил Божества на месте его рождения (T 94, 252, 258)."}
  - {type: other, who: "@bhaktivinoda", facts: [F38], note: "Посетил Денур, шрипат Вриндавана даса (T 233)."}
  - {type: neighbor, who: "@govinda-maharaja", facts: [F44], note: "Шрила Б. С. Говинда Дев-Госвами родился рядом с домом, где жил Вриндаван дас (= @govinda-maharaja F6)."}
  - {type: other, who: "@vrindavana-acharya", facts: [], note: "Тёзка, не путать: старший сын Шринивасы Ачарьи, названный Дживой (БР 14.19–20; B 674)."}
  - {type: other, who: "@gauranga-dasa-sonatala", facts: [], note: "Тёзка, не путать: сын Кала Кришнадаса, «Вриндаван дас», рождённый во Вриндаване (B 933; T 95)."}
