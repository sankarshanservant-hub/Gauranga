period_note: "Родился уже после Навадвипа-лилы Господа (ЧБ Ади 12.284, Мадхья 8.198; F16) — по B не раньше ок. 1518 г., по M ок. 1514 г. (⚠4); в годы игр Господа в Пури — ребёнок в Мамгачхи, лично Господа не видел (B 1079). Деятельная жизнь — после сокрытия Господа (P15): посвящение от Нитьянанды, «Чайтанья-бхагавата», Денур, Кхетури. Нараяни как четырёхлетняя девочка — в P07 (@narayani). lila-db ev-vrindavana-dasa-birth стоит в P12 по «Према-виласе» (⚠10). Как автор ЧБ — во множестве лил PX (колофоны, слово автора)."
