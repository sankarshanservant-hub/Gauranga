open_questions:
  - "Год рождения: T 1507 (против ЧБ), B ≥ ок. 1518, M ок. 1514 (⚠4); место — Мамгачхи или Кумарахатта (⚠3)."
  - "Кто и когда переименовал «Чайтанья-мангалу» в «Чайтанья-бхагавату»; год написания — 1535 (T, ГВА) или 1573 (ПВ 24) (⚠6)."
  - "Год, место ухода и самадхи неизвестны (1511 Шака — догадка)."
  - "Божества Гаура-Нитай: поныне в Мамгачхи (B, T) или перенесены (приложение рус. изд. ЧБ); Рамахари — каястха (B) или кшатрий (приложение) (⚠7)."
