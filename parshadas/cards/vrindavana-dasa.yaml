origin:
  places: ["#modadrumadvipa", "#kumarahatta", "#shrihatta"]
  family: ["@narayani", "@vaikuntha-dasa-vipra", "@nalina-pandita", "@srivasa", "@malini"]
  varna: "брахман сословия радхия (B 1079); слух смартов и сахаджиев, будто он не брахман, — отвергнут (приложение рус. изд. ЧБ; ⚠Б2)"
  facts: [F5, F6, F7, F10, F11, F12]
  note: "Мать — Нараяни, дочь Налины Пандита, старшего брата Шривасы (ГВА; B 1078; T 190; ЧБ Мадхья 2.321 — «дочь брата»); ≠ B 866 «внук сестры Шривасы» (⚠2). Отец — Вайкунтха дас (Вайкунтханатха) Випра, предки из Шрихатты; ушёл из мира, когда сын был во чреве (ГВА, ПВ 23, T); сам Вриндаван дас его не называет (B 1078; «Анубхашья» к ЧЧ Ади 8.41). Дом мужа Нараяни — Мамгачхи, род Малини (B, M) или Кумарахатта (T 36, ГВА, ПВ) (⚠3)."
sampradaya:
  name: "ученик Нитьянанды Прабху"
