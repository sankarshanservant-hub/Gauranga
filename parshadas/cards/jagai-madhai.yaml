  - "Годы жизни, время и место ухода неизвестны; в календаре ШЧСМ их дней нет; «Према-виласа» 19 — на празднике в Катоа (⚠13); самадж — в Мадхаитале близ Катвы («Анубхашья», F80)."
  - "Точное место гхата Мадхая (бхашья: близ Шринатхапура; гхат поглотила Ганга) (⚠7)."
