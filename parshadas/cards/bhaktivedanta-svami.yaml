events: []
events_note: "Лицо XX в.; событий lila-db нет. Вехи (по N и T): 1896 явление; 1922 встреча с Бхактисиддхантой; 1930 знакомство со Шридхаром Махараджем; 1932 посвящение; 1935 Радха-кунда; 1936 эссе в «Harmonist»; «Back to Godhead»; ~1950 Вриндаван; титул «Бхактиведанта»; 1959 санньяса; 13.08.1965 «Джаладута»; 1966 ИСККОН; 1967 Сан-Франциско, Индия, Навадвип; 1970 BBT; 1971 Москва; 17.03.1973 Маяпур; март 1977 последняя встреча; 1977 уход."
teachings_given:
  - {title: "сознание Кришны — дхарма души, а не продукт одной культуры", facts: [F6, F7]}
  - {title: "сознание Кришны не ждёт политических перемен (урок Бхактисиддханты, 1922)", facts: [F29]}
  - {title: "истинный гуру — представитель Вьясадевы в преемственности; мантра вне сампрадаи бесплодна (эссе 1936)", facts: [F44, Q2]}
  - {title: "семь целей ИСККОН", facts: [F71]}
  - {title: "книги — основа, практичность — принцип, проповедь — суть, чистота — сила", facts: [F72]}
  - {title: "юкта-вайрагья: всё — на служение Кришне", facts: [F77]}
  - {title: "без полномочий от Кришны нельзя проповедовать (ЧЧ Антья 7.11)", facts: [F89, Q5]}
  - {title: "наставляющий гуру — проявление Кришны (ЧЧ Ади 1.47, его комментарий)", facts: [F95]}
  - {title: "мантра Харе Кришна — «большая пушка» против майи", facts: [F75]}
  - {title: "толкование песни Лочана даса: путь Нитай-Гауры радостен — пой и танцуй", facts: [F17]}
teachings_received:
