    note: "Ушёл раньше праздника в Кхетури: Джахнава не застала его и Малини в навадвипском доме (M 66). B 1101: на празднике в Кхетури давно сокрывшийся Шриваса вновь явился и пел с преданными."
origin:
  places: ["#shrihatta", "#navadvipa", "#house-srivasa"]
  family: ["@jaladhara-pandita", "@nalina-pandita", "@srirama-pandita", "@shripati", "@shrinidhi", "@malini"]
  varna: "брахман"
  facts: [F3, F4, F9, F10, F11]
  note: "Из Шрихатты; ещё до явления Господа поселился в Навадвипе-Майяпуре у Ганги, рядом с домом Джаганнатхи Мишры (F10). Братьев четверо (T, M, B) ≠ по «Према-виласе» (через ГВА, у T) — пятеро сыновей Джаладхары Пандита, Шриваса — второй (F4)."
relations:
  # семья
  - {type: sibling, who: "@srirama-pandita", facts: [F3, F46, F76, F96, F98, F115, F119, F127], note: "Младший брат (Рамаи); по ГГД — мудрец Парвата; Господь велел ему служить старшему брату (F98); гонец к Адвайте (F46)."}
  - {type: sibling, who: "@shripati", facts: [F3, F112], note: "Брат; с Шринидхи был на празднике в Кхетури, принимал Джахнаву и Нароттаму в навадвипском доме Шривасы."}
  - {type: sibling, who: "@shrinidhi", facts: [F3, F112], note: "Брат (T: он же Шриканта)."}
  - {type: father, who: "@jaladhara-pandita", facts: [F4], note: "Только T по ГВА со ссылкой на «Према-виласу»."}
  - {type: sibling, who: "@nalina-pandita", facts: [F4, F7, F134], note: "Старший брат, отец Нараяни — по T (ГВА) и B 1078 (ГВА); в главе B — «какой-то брат»."}
  - {type: spouse, who: "@malini", facts: [F6, F19, F20, F21, F47, F51, F99, F112, F115, F120], note: "Малини-деви; по ГГД — кормилица Амбика; кормила Нитьянанду как сына (F47); ходила с мужем в Пури (F99)."}
  - {type: niece, who: "@narayani", facts: [F7, F8, F37, F65, F134], event: ev-narayani-remnants, note: "Дочь брата; четырёх лет заплакала «Кришна!» (F37); вкушала остатки Господа (F65); мать Вриндавана даса."}
  - {type: relative, who: "@vrindavana-dasa", facts: [F8, F134], note: "Внук брата (сын Нараяни): Шриваса — его двоюродный дед (B 1079) ≠ B 866 «внук сестры». Ребёнком жил с матерью в доме Шривасы (T 190–191)."}
  # Господь и Панча-таттва
  - {type: met, who: "@mahaprabhu", facts: [F19, F22, F23, F24, F25, F26, F27, F28, F31, F32, F33, F34, F35, F36, F59, F78, F89, F92, F95, F96, F97, F98, F106], event: ev-shrivasa-sees-chaturbhuja,
     note: "Его дом — место ночных киртанов и откровений Господа; Господь назвал Себя и Нитьянанду его вечными сыновьями (F92). M: Нимай почитал Шривасу и Малини вторыми отцом и матерью (F21)."}
  - {type: host, who: "@nityananda", facts: [F40, F41, F42, F43, F44, F45, F47, F48, F49, F50, F51, F52, F110, F119], event: ev-lord-tests-shrivasa-nityananda,
     note: "Нитьянанда жил у Шривасы, считая его отцом, Малини — матерью; Шриваса — ачарья Вьяса-пуджи Нитьянанды (F44); неколебимая вера в Нитьянанду (F48) — и благословение (F49)."}
  - {type: friend, who: "@advaita", facts: [F10, F14, F16, F46, F83, F125, F126, F127], event: ev-advaita-worships-lord-shrivasa,
     note: "До явления Господа пел с ним имя (F10); Адвайта возглавлял местных вайшнавов — Шривасу и др. (F125); Шриваса просил за Адвайту, когда Господь укрылся у Нанданы (F83, F125)."}
  - {type: friend, who: "@jagannatha-mishra", facts: [F14, F20], note: "M: близкий друг; Шриваса бывал у него постоянно, «как тень»."}
  - {type: other, who: "@shachi", facts: [F19, F20, F27, F28, F79, F126], note: "Утешил её, когда Нимай стал являть экстаз (F28); просил для неё премы (F79; по B 733 — оскорбление Адвайты, F126)."}
  # Навадвипа
  - {type: companion, who: "@haridasa-thakura", facts: [F10, F40, F119, F125], note: "Вместе искали Нитьянанду (F40, F119)."}
  - {type: other, who: "@nandana-acharya", facts: [F40, F83, F125], note: "У него тайно жил Нитьянанда и укрывался Господь; Нандана привёл Шривасу к Господу (B 762–763, T 50 ≠ T 31 — Харидас)."}
  - {type: other, who: "@chandrashekhara-acharya", facts: [F19, F53, F76], event: ev-chandrashekhara-drama, note: "Жена Чандрашекхары с Малини пришла к Шачи при рождении Господа (F19); киртан то у Шривасы, то у Чандрашекхары (F53)."}
  - {type: other, who: "@mukunda-datta", facts: [F63, F128], event: ev-mukunda-danda-prasada, note: "Шриваса заступился за Мукунду на махапракаше и передавал вопросы и ответы (F63)."}
  - {type: opposed, who: "@devananda-pandita", facts: [F62, F75, F121], event: ev-devananda-rebuked, note: "Ученики Девананды выбросили Шривасу с чтения «Бхагаватам»; M: Шриваса потом обнял и простил Девананду (F75)."}
  - {type: opposed, who: "@gopala-chapala", facts: [F68, F69, F70], event: ev-gopala-chapala-forgiven, note: "Подбросил предметы культа Бхавани; заболел проказой; прощён по милости Шривасы в Кулии."}
  - {type: servant, who: "@duhkhi-sukhi", facts: [F61], event: ev-duhkhi-named-sukhi, note: "Служанка Шривасы; Господь назвал её Сукхи; Шриваса перестал видеть в ней служанку."}
  - {type: other, who: "@murari-gupta", facts: [F9, F67], note: "Тоже из Шрихатты; игры с Мурари в доме Шривасы (облик Гаруды, порядок поклонов)."}
  - {type: other, who: "@vakreshvara", facts: [F67, F75, F121], note: "Плясал в доме Шривасы 72 часа; через служение ему Девананда освободился от оскорбления Шривасы."}
  - {type: other, who: "@chand-kazi", facts: [F81, F131], event: ev-nagara-kirtana-kazi, note: "T: Кази сломал мридангу у дома Шривасы ≠ B: по домам горожан; место — «Кхола-бхангар-данга» = Шривас-ангана (T 223)."}
  # Кумарахатта
  - {type: friend, who: "@vasudeva-datta", facts: [F94, F95, F96, F124], note: "Ближайший друг; жил рядом в Кумарахатте; пришёл к Господу в дом Шривасы."}
  - {type: neighbor, who: "@shivananda-sena", facts: [F94, F95, F99, F124], note: "Сосед по Кумарахатте; пришёл к Господу в дом Шривасы; вёл паломников в Пури (третий год — Малини со Шривасой)."}
  - {type: other, who: "@raghava-pandita", facts: [F96, F107, F124], note: "Из дома Шривасы Господь пошёл к Рагхаве в Панихати; оба дома — среди четырёх мест явления Господа."}
  - {type: other, who: "@ishvara-puri", facts: [F94, F95, F124], note: "Дом Шривасы в Кумарахатте — рядом с местом рождения Ишвары Пури («Чайтанья-доба»)."}
  # Пури
  - {type: other, who: "@svarupa-damodara", facts: [F101, F103, F104, F105, F108, F122, F123], event: ev-hera-panchami, note: "Спор на Хера-панчами: Шриваса — слуга Лакшми-Нараяны с природой Нарады, Сварупа — слуга Радхи (F104–F105); оба — главные певцы на Ратха-ятре (B 207; M 243)."}
  - {type: other, who: "@prataparudra", facts: [F102], event: ev-ratha-yatra-gundicha, note: "«Удар вайшнава — честь»: остановил Харичандану."}
  - {type: other, who: "@harichandana", facts: [F102], note: "Шриваса шлёпнул его, когда тот мешал ему смотреть танец Господа."}
  - {type: other, who: "@chhota-haridasa", facts: [F132], note: "Шриваса спросил Господа о его участи (B 885)."}
  - {type: other, who: "@kala-krishnadasa", facts: [F133], note: "Принёс весть о возвращении Господа с юга."}
  # после сокрытия Господа и позднее
  - {type: other, who: "@jiva-gosvami", facts: [F110], event: ev-jiva-meets-nityananda-navadvipa, note: "Благословил Дживу по велению Нитьянанды."}
  - {type: other, who: "@srinivasa-acharya", facts: [F111, F137], note: "Шриниваса видел его в Навадвипе перед путешествием во Вриндаван."}
  - {type: other, who: "@jahnava", facts: [F112], note: "Не застала Шривасу и Малини в живых; ночь в Шривас-ангане (M 66, 70)."}
  - {type: other, who: "@narottama-dasa", facts: [F112], note: "Пришёл в дом Шривасы, поклонился его братьям."}
  - {type: other, who: "@jagannatha-dasa-babaji", facts: [F58, F113], note: "Указал место Шривас-анганы (1892); предложил установить там Панча-таттву."}
  - {type: other, who: "@bhaktivinoda", facts: [F58, F113]}
  - {type: other, who: "@bhaktisiddhanta", facts: [F58, F114, F116], note: "Открыл центр санкиртаны в Шривас-ангане (B 149–150, по скану); освящение храмовых зданий 1934 (T); комментарий о Панча-таттве (T 35–36)."}
  # Божество
  - {type: deity-served, who: "@nrisimha", facts: [F30, F31, F80], event: ev-nrisimha-bhava-shrivasa, note: "Шриваса поклонялся Нрисимхадеве за затворённой дверью, когда пришёл Господь (F30–F31)."}
