period: [P01, P02, P03, P04, P05, P06, P07, P08, P12, P13, P14, P15]
period_note: "Лично — в Навадвипе до явления Господа (киртан с братьями, гонения; P01), при явлении и в детстве Нимая (P02–P05), в пору откровения и ночных киртанов в своём доме (P06–P07); после санньясы — в Кумарахатте, ежегодно в Пури (P08, P12–P14); после сокрытия Господа — встречи с Дживой и Шринивасой (P15). К празднику в Кхетури его уже не было (M 66). Шривас-ангана в XIX–XX вв. (Джаганнатха дас Бабаджи, Бхактивинода, Бхактисиддханта) — память места."
