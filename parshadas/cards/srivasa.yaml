open_questions:
  - "Год и место ухода не названы; ушёл до Кхетури (M 66), но B 1101 говорит о его «явлении» на празднике (F112, F136)."
  - "Братьев четверо (T, M, B) или пятеро сыновей Джаладхары (T по ГВА/ПВ); Нараяни — дочь старшего брата Налины (T, B 1078) или «какого-то брата» (глава B) (F3, F4, F7); Вриндаван дас — внук брата (B 1079) или «внук сестры» (B 866) (F134)."
  - "Когда переселился в Кумарахатту: после санньясы Господа (T, B, M 226) или после Его ухода (M 233) (F11)."
  - "Шриваса на Ратха-ятре — запевала второй группы (T 40, ЧЧ Мадхья 13) или танцор (T 77 — бхера-киртан, ЧЧ Антья 10; B 199 — киртан у жилища Господа) (F101, F122)."
  - "Шествие к Кази: Шриваса вёл одну из трёх частей (B 872) или шёл с Господом (B 1059); Кази сломал мридангу у дома Шривасы (T) или по домам горожан (B) (F81, F131)."
  - "Начало ночного киртана в хари-васару: вечером (T, ЧБ Мадхья 8.77–78) или с рассвета (B по скану) (F53)."
  - "Девананда: случай был до явления Господа (M 17) — у B и T без даты; прощение — через Шривасу (M 20) или через Вакрешвару (T, B) (F62, F75, F121)."
  - "Кто привёл Шривасу к укрывшемуся у Нанданы Господу: Харидас (T 31) или Нандана (T 50, B 762) (F83, F125)."
  - "Ворона унесла сосуд с гхи для поклонения Вишну (B 97) или латунную чашу для служения Кришне (B 154) (F51, F120)."
  - "Тёща: кто её вывел — Шриваса сам (T) или велел другому тайком (B) (F72)."
  - "Посещение Господом Кумарахатты: из Шантипура сразу после санньясы (B 161) или через пять лет, по пути из Пури (M 226, ЧБ Антья 5) (F95)."
  - "В lila-db нет событий: удар Харичанданы (F102), спор о Хера-панчами со Сварупой (есть общее ev-hera-panchami), Шривас-ангана в XIX–XX вв. (F113–F114) — вне рамок базы."
