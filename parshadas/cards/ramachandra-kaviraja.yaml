period_note: "Вся жизнь — после сокрытия Господа (P15): Кумаранагар и Шрикханда, встреча со Шринивасой в Яджиграме, Вриндаван у Госвами, Вана-Вишнупур, Будхари, Кхетури, путь с Джахнавой, уход во Вриндаване. Господа лично не видел (Гаурасундара являлся ему во сне, БР 10.224–238); ЧЧ называет его лишь в перечне ветвей Нитьянанды (Ади 11.51, по «Анубхашье»); ЧБ о нём молчит."
