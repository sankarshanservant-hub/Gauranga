  - {type: grandfather, who: "@damodara-sena-kavi", facts: [F9, F10, F13, F14, F28], events: [ev-ramachandra-kaviraja-birth], note: "Дед по матери, великий поэт Кханды; «ученик Нарахари» (B 1108, T 212) ≠ шакта/почитатель Шивы (M 154, B 939, B 1109; БР 9.143) — ⚠15."}
  - {type: guru, who: "@srinivasa-acharya", facts: [F20, F21, F22, F23, F24, F26, F31, F33, F37, F41, F42, F44, F48, F50, F60, I1], events: [ev-ramachandra-kaviraja-meets-srinivasa, ev-ramachandra-obedience, ev-srinivasa-samadhi-nose-ring, ev-srinivasa-ramachandra-disappearance],
     note: "Встреча в Яджиграме на пути со свадьбы; «из рождения в рождение ты мой ближайший друг» (БР 8.544; B — 8.574); мантра Радхи-Кришны; личный слуга (T 212; B 659 — бхритья); вверял ему Виру Хамбира и Нароттаму. = @srinivasa-acharya F87–F89, F93, F125, F131, F135."}
  - {type: friend, who: "@narottama-dasa", facts: [F43, F46, F47, F48, F49, F51, F55, F60], events: [ev-narottama-bhajana-kheturi, ev-kheturi-festival, ev-narasimha-raya-conversion, ev-srinivasa-ramachandra-disappearance],
     note: "Неразлучный друг, «второе я» (БР 1.269–276; B 176 — абхиннатма); «Нароттама Дас просит общества Рамачандры» («Прартхана»); вместе в Кхетури; оплакан Нароттамой («Йе анила према-дхана»). = @narottama-dasa F80, F84, F88, F90."}
  - {type: siksha-guru, who: "@jiva-gosvami", facts: [F33, F34, F37, F38, F44], events: [ev-jiva-srinivasa-letters], note: "Принял его во Вриндаване, повёл к Радха-Дамодаре и самадхи Рупы (БР 9.197–200); дал звание «Кавираджа» (B 1109, B 523, T 212, T 189; ⚠8); писал ему письма (БР 14). = @jiva-gosvami F180."}
  - {type: met, who: "@gopala-bhatta", facts: [F35, F38], note: "Милость Гопалы Бхатты (B 1111; T 212; M 156); вместе с Шринивасой служил ему (БР 9.216)."}
  - {type: met, who: "@lokanatha", facts: [F35], note: "Милость Локанатхи (B 1109, 1111; T 212; M 156)."}
  - {type: met, who: "@bhugarbha", facts: [F35, I3], note: "Милость Бхугарбхи (B 1109, 1111; T 212; M 156); B 265 — Нароттама и Рамачандра как Локанатха и Бхугарбха."}
  - {type: met, who: "@raghunatha-dasa", facts: [F36], note: "На Радха-кунде обнял его, погрузившись в прему (B 1111; T 212–213; M 199; БР 9.208–210)."}
  - {type: met, who: "@krishnadasa-kaviraja", facts: [F36], note: "Встреча на Радха-кунде (M 199; БР 9.211). = @krishnadasa-kaviraja F48."}
  - {type: other, who: "@paramananda-bhattacharya", facts: [F37], note: "Среди давших ему звание «Кавираджа» (БР 1.267–268, по T 212)."}
  - {type: other, who: "@raghunandana", facts: [F30], note: "С его позволения (B 1109; M 155) или по его слову (БР 9.110–112) пошёл во Вриндаван."}
  - {type: met, who: "@ishana-navadvipa", facts: [F40], note: "Благословил его в доме Мишры в Майяпуре (B 1110; M 156); по T 67, B 673, B 910, M 201, БР 12 — вместе со Шринивасой и Нароттамой (⚠9)."}
  - {type: siksha-disciple, who: "@vira-hambira", facts: [F41], events: [ev-ramachandra-instructs-vira-hambira, ev-vira-hambira-conversion], note: "T 212 — его шикша-гуру; Шриниваса вверил ему царя (БР 9.264; 13.53); наставления — «Карнананда» 4–6 (C)."}
  - {type: disciple, who: "@harirama-acharya", facts: [F49, F50], events: [ev-harirama-ramakrishna-conversion], note: "Ученик, слагатель пад (B 1111; M 156; B 675; БР 15.114); T 210 — посвящён Нароттамой (⚠13)."}
  - {type: co-worker, who: "@ganganarayana-chakravarti", facts: [F51], events: [ev-narasimha-raya-conversion], note: "Вместе в облике гончара и торговца бетелем победили смартов на рынке Кумарапура (B 1110; T 210; M 121–122; НВ 10.171–187)."}
  - {type: opposed, who: "@rupa-narayana", facts: [F51, F52], events: [ev-narasimha-raya-conversion], note: "Пандит-дигвиджаи, побеждённый в Кумарапуре выводами «Бхагаваты» (B 1110, по скану); затем ученик Нароттамы."}
  - {type: opposed, who: "@narasimha-raya", facts: [F51, F52], events: [ev-narasimha-raya-conversion], note: "Раджа, шедший со смартами против Нароттамы; после спора в Кумарапуре и сна — ученик Нароттамы."}
  - {type: other, who: "@jahnava", facts: [F55], events: [ev-jahnava-returns-through-kheturi, ev-kheturi-festival], note: "Встречал её в Кхетури (M 69; БР 11.302–308), проводил из Кхетури в Будхари и к Экачакре (БР 11.361–404); T 200 — она гостила в Будхари, «доме Рамачандры»."}
  - {type: companion, who: "@shyamananda", facts: [F34, F39, F41, F42], events: [ev-srinivasa-second-vrindavana], note: "Вместе со Шринивасой во Вриндаване (M 199; T 206) и на пути в Вана-Вишнупур (БР 9.227–236)."}
  - {type: other, who: "@draupadi-ishvari", facts: [F44], note: "Поклонился обеим Ишвари; её вопрос о его смехе в ночь полнолуния (БР 14.50, 14.57–62)."}
  - {type: other, who: "@mahaprabhu", facts: [F43], note: "Гаурасундара явился ему во сне в Будхари: «По Моей воле ты не знаешь самого себя… вы с Нароттамой будете раздавать Мою према-бхакти» (БР 10.224–238)."}
  - {type: other, who: "@shiva", facts: [F28, F29], note: "Ответ шактам: Шива и Брахма — гуна-аватары Кришны (B 1109; M 155; ⚠Б3)."}
  - {type: other, who: "@durga", facts: [F52], events: [ev-narasimha-raya-conversion], note: "Во сне велела радже Нарасимхе искать прибежища у Нароттамы (⚠Б5)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F17, F63], note: "«Анубхашья» к ЧЧ Ади 11.51: с рождения отрешён; сын Чирандживы, ученик Шринивасы, имя «Кавирадж» — от Дживы."}
  - {type: other, who: "@ramachandra-poet", facts: [F57], note: "Пада с подписью «Рамачандра Дас», которую M относит к нему; тождество не установлено (⚠16)."}
