  - {trait: "неразлучная дружба с Нароттамой — «одно тело, ум и жизнь»", facts: [F46, F47]}
  - {trait: "бесстрашие и твёрдость в вере: тилака и Хари-нама перед гневом шактов, ответ из шастр", facts: [F27, F29]}
  - {trait: "учёность и поэтический дар («царь поэтов»), обращённые на служение: побеждает смартов в облике торговца", facts: [F15, F37, F51]}
  - {trait: "смирение и сладостный нрав, покорившие Госвами Вриндавана", facts: [F38, F44, F57]}
  - {trait: "глубокая разлука со спутниками Господа, в которой он ушёл в вечные игры", facts: [F55, F58]}
