period: [P11, P12, P13, P14, P15]
period_note: "Лично: правитель на Годавари, встреча с Господом и беседы в Видьянагаре (P11); оставил службу и пришёл в Пури, посредник за Пратапарудру (P12); провожал Господа до Ремуны (Бхадраки) и Катаки, снаряжал Его во Вриндаван (P13); неотлучный спутник Господа в разлуке — в Гамбхире и в саду Джаганнатха-валлабха (P14); жил и после сокрытия Господа (P15: утешил Пратапарудру, встретил Шринивасу). P01 — только в перечнях нисхождения спутников (lila-db)."
