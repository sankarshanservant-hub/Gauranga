  - "Место явления: Бентпур близ Алаланатхи — только местное предание (B) (F3)."
  - "День ухода: джьештха или вайшакха кришна-панчами (T) — вероятно, один день; наш календарь — Тривикрама кришна-панчами; год и место неизвестны (F132)."
  - "Где Господь простился с ним: Ремуна или Бхадрака (B под вопросом); T — проводил за Читротпалу; B 1016 — пришёл с Господом в Катаку (F48, F133, F135)."
  - "Приезд в Пури: сначала к Господу (B) или сначала к царю в Катаке и Пури (T) (F40, F120)."
  - "Встреча по Мурари и Лочану (во дворце в Канчи-нагаре, видение в медитации) ≠ ЧЧ (на берегу Годавари) (F82, F84, F85)."
  - "Гуру: Рагхавендра Пури по «Бхаджана-нирнае» (только T) (F113)."
