  - {type: disciple, who: "@mukundadeva-gangamata", facts: [F24, F25, F26, F34, F35, F37, F38], note: "Царь Пури: слушал её «Бхагаватам», по сну Джаганнатхи дал место у Швета-ганги; после чуда Ганги принял у неё посвящение (по B, T — лишь он; M, ГВА — с пуджари/парихами, ⚠4); от земли-дакшины она отказалась, приняла ежедневный прасад для вайшнавов."}
  - {type: disciple, who: "@mahiratha-sharma", facts: [F39], note: "Смарта-брахман из Дхананджаяпура; посвящён в Радха-Кришна-мантру; по её велению проповедовал (Ганджам — B; Бенгалия — M, «Махидхара», ⚠11)."}
  - {type: deity-served, who: "@rasika-raya-gangamata", facts: [F41, F42, F43, F44], note: "По сну Джаганнатхи брахман Чандра Шарма принёс Его к ней; приняла по Его велению; служила до ухода. = @rasika-raya-gangamata F6–F27. «Анубхашья»: она привезла Его от Кришны Мишры из Джайпура (⚠6)."}
  - {type: other, who: "@chandra-sharma-jaipur", facts: [F41, F42], note: "Принёс Расика-рая и, когда она отказалась, оставил Его в её роще туласи."}
  - {type: lineage-successor, who: "@banamali-dasa-gangamata", facts: [F9, F43], note: "Ему вверила служение Расика-раю (B 971); по «Анубхашье» — (5) Шри Ванамали в преемстве матха (вывод, ⚠2)."}
  - {type: other, who: "@jagannatha-deity", facts: [F6, F25, F29, F34, F37, F41], note: "Веления во сне царю, ей и брахману; Сам источил Гангу из Своих стоп и омыл её (⚠Б2)."}
  - {type: other, who: "@ganga-devi", facts: [F29, F30, F31], note: "Пришла к ней в Швета-ганге, желая её общества, и течением принесла её в храм (предание, ⚠Б2)."}
  - {type: other, who: "@sarvabhauma", facts: [F18, F20, F21, F36, F44], note: "Его обветшавший дом в Пури, где оставался Дамодара-шалаграма, которому он служил, она восстановила — ныне Гангамата-матх («Анубхашья» к Мадхья 6.8)."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F8, F9, F21, F47], note: "«Анубхашья» к ЧЧ Ади 8.59–60 (преемство матха) и Мадхья 6.8 (дом Сарвабхаумы = Гангамата-матх); T 249 — беседовал в Пури с пуджари её матха."}
