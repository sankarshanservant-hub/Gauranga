period_note: "Нисходит прежде Господа (F7); при рождении Господа — его жена у Шачи (F11); опекает дом Мишры и Шачи (F9, F10); лично — в Гае (только M, F12), в киртанах и действе в своём доме (F13–F31), при Джагае и Мадхае (F15), шествии к Кази (F34), санньясе в Катве и в Шантипуре (F35–F40); затем ежегодно в Пури на чатурмасью (F41–F44)."
