open_questions:
  - "Кто послал его в Навадвипу после санньясы: Господь из Катвы (ЧБ, B 735, «Чайтанья-мангала») или Нитьянанда из Радха-деши (ЧЧ Мадхья 3, T, B 743) (F38, F39)."
  - "Бывал в доме Мишры ещё до явления Господа (T) или после (B) (F9)."
  - "Божества, установленные Бхактисиддхантой в Чайтанья Матхе: Гуру-Гауранга и Радха-Говинда (T) ≠ Гандхарвика-Гиридхари (комментарий к ЧБ Ади 2.34) ≠ танцующий Гаура (B 149) (F33)."
  - "Был ли он с Господом в Гае — только M (F12)."
  - "Дни явления и ухода неизвестны; в нашем календаре их нет."
