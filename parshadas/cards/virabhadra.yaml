period_note: "Лично — после сокрытия Махапрабху и Нитьянанды (P15): посвящение у Джахнавы, брак, путь во Вриндаван (БР 13), праздники в Шрикханде, Кантака-нагаре, Боракули, Кхетури, встречи со Шринивасой и Нароттамой (F12–F57). Год явления неизвестен; в lila-db ev-virachandra-birth — P15 условно; ev-virachandra-secret-counsel (P12, «Вайшнава-вандана», ур. C) — лишь предсказание о нём, в period не включено."
