events_note: "Почти все события — по поздним книгам (НВВ, ПВ, АП — ур. C–D; F62); ур. B — НВ 3, 6, 11 (ev-narottama-gauda-pilgrimage, ev-jahnava-kheturi, ev-virachandra-yajigrama-kheturi), «Гаура-кришнодая» 16 (ev-nityananda-marriage), БР 1 (ev-srinivasa-birth — милость Шринивасе); ур. A — ЧЧ Ади 11 (ev-tattva-bhakti-kalpataru). Путь во Вриндаван по БР 13 (F24–F38) в lila-db отдельным описанием не заведён — входит в ev-virachandra-pilgrimage (ПВ 19, НВВ 10). ev-kheturi-festival, ev-radha-krishna-appear-kheturi, ev-narottama-sacred-thread — его присутствие на великом празднике Кхетури только по ПВ (⚠6). Не включены: ev-tattva-bhakti-kalpataru, ev-tattva-holy-name (учение, не событие его жизни), ev-nityananda-awakens-shridama, ev-legend-shiva-bhuvaneshvara (его рассказы в НВВ о других)."
