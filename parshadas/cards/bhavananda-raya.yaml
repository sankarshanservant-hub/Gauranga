period_note: "Лично: пришёл с четырьмя сыновьями к Господу, вернувшемуся с юга, и отдал Ему себя и сыновей, оставив при Нём Ванинатху (ЧЧ Мадхья 10.49–61; F19–F26); в деле Гопинатхи Паттанаяка — с пятью сыновьями благодарит Господа (ЧЧ Антья 9.127–131; F41–F42). «Бхавананда» в ЧЧ Мадхья 1.253 (жившие с Господом в Пури) — тождество не доказано (F46, ⚠3)."
