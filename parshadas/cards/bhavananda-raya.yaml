  - {type: companion, who: "@mahaprabhu", facts: [F12, F15, F19, F20, F21, F22, F23, F24, F25, F26, F27, F31, F32, F33, F36, F41, F42, F45, I2, I3], events: [ev-bhavananda-raya-pandu, ev-tattva-bhakti-kalpataru, ev-gopinatha-pattanayaka-pardoned],
