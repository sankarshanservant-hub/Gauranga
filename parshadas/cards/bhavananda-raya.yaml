  family: ["@ramananda-raya", "@gopinatha-pattanayaka", "@kalanidhi", "@sudhanidhi", "@vaninatha-raya", "@shikhi-mahiti"]
  varna: "карана — орисская служилая община, общественно — шудры (T 122; B: «шаукра-карана»); сам себя в смирении называет шудрой (ЧЧ Мадхья 10.54)"
  facts: [F2, F3, F4, F5, F6, F8, F10, F11, F22]
  note: "Землевладелец в селении Бентпур у Алаланатхи (Брахмагири), в шести крошах (≈ 12 милях) от Пури (B 764, 1031; T 122, 145; сторона света у авторов — «к западу», ⚠1); потомки — «Чаудхури Паттанаяк», живут там поныне. «Гаура-кришнодая» 11.6 — «владыка Видьяпуры» (⚠6)."
