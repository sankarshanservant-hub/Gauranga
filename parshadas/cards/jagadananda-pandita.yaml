  note: "Родители, род и родина в книгах не названы; T лишь заключает, что родился в Бенгалии (ЧЧ Антья 7.48–49 — среди вайшнавов, явившихся в Бенгалии). По «Према-виварте» 8.15–19 его в детстве растил и учил Шивананда Сена, а Кави Карнапура «живёт в моей деревне» (Кумарахатта/Канчанапалли — вывод, сама поэма деревню не называет); по «Чандродае» (акт 9) он «долго жил» в доме Шивананды (F89)."
