open_questions:
  - "Спутники из Шантипура: B — с Гададхарой, ЧЧ — с Дамодарой, ЧБ — шестеро (F11)."
  - "Сколько дней постился после разбитого кувшина: два (B) или три (T; ЧЧ — «на третий день») (F46)."
  - "Толкование наказа ЧЧ Антья 13.37: брахманы-чобе (T) или рагамаргии без знания айшварьи (B) (F63)."
  - "ГГД 51: «по некоторому различению» (наш перевод) или «нет различия» (T) (F2)."
  - "Родина, семья, годы, день явления и ухода неизвестны; в календаре ШЧСМ их нет (F7, F78)."
  - "Посох: по ЧБ данду оставил Нитьянанде Джагадананда, по ЧЧ Мадхья 5 — Сам Господь (F15, F79)."
  - "Махакавья Карнапуры 13.123: пришёл в Пури позже, с Гададхарой и Параманандой Пури — ≠ ЧЧ Мадхья 3.209–210 (F91)."
  - "Авторство «Према-виварты» (F104); сведения о детстве — только по ней и по фрагментам Джаянанды."
