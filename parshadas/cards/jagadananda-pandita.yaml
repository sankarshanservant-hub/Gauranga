  - {type: met, who: "@sarvabhauma", facts: [F16, F17, F18, F19, F88], events: [ev-sarvabhauma-deliverance], note: "Передал Господу две шлоки Сарвабхаумы (ЧЧ Мадхья 6.248–256)."}
