period_note: "Лично — с начала санкиртаны в Навадвипе (киртаны у Шривасы и Чандрашекхары, F8–F10); спутник Господа на пути в Пури после санньясы (F11–F16); постоянный спутник в Пури (F17–F30, F34–F59); ежегодный посланец к Шачи в Навадвипу (F39–F41, F73); путешествие во Вриндаван к Санатане (F61–F72). Детство и встреча с Господом в Надии — только по «Према-виварте» (F97, F98, F101) и фрагментам Джаянанды (F92, ур. C)."
