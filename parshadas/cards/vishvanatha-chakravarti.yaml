character:
  - {trait: "отрешённость с юности: брак не привязал его; по велению гуру ночь с женой провёл в воспевании Имени", facts: [F12, F13, F14]}
  - {trait: "послушание гуру — благословение гуру дало ему жить во Врадже и писать", facts: [F14, F33, F56]}
  - {trait: "жажда постичь смысл мантры: готов был оставить тело, пока Радха не открыла ему смысл", facts: [F59, F60, F61, F62]}
  - {trait: "ясность и простота при глубине: сделал доступными раса-книги Рупы", facts: [F40, F48, F49]}
  - {trait: "ревность о чистоте учения: опроверг «ати-бари», защитил честь сампрадаи через учеников", facts: [F22, F24, F70, F73]}
  - {trait: "смирение: смутился, когда стало известно о чуде с дождём", facts: [F56]}
