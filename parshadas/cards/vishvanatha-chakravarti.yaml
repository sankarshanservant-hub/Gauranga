relations:
  - {type: guru, who: "@radharamana-chakravarti", facts: [F16, F17, F18, F19, F21, Q1], note: "Шикша-, затем дикша-гуру (B 972); M 254 — дикша от Кришначараны; НВ-прил. — «Рамачарана» (⚠4)."}
  - {type: lineage-predecessor, who: "@krishnacharana-chakravarti", facts: [F16, F17, F18, F19, F21], note: "Гуру его гуру; жил в Саиядабаде; по M 254 — дал ему мантра-дикшу (⚠4)."}
  - {type: lineage-predecessor, who: "@ganganarayana-chakravarti", facts: [F16, F18, F19, Q1], note: "«Ганга» в его стихе-мангале; Кришначарана — его ученик и, по некоторым, приёмный сын; хвалы ему — в «Ставамрита-лахари» (НВ 10, 12)."}
  - {type: lineage-predecessor, who: "@narottama-dasa", facts: [F18, F19, F20, F22, F43, F45], note: "Четвёртый от Нароттамы в линии; «Нароттамаштака»; «Санкалпа-калпадрума» — под руководством Локанатхи и Нароттамы."}
  - {type: lineage-predecessor, who: "@lokanatha", facts: [F18, F19, F43, F45], note: "«Натха» в стихе-мангале; «Локанатхаштака»."}
  - {type: lineage-predecessor, who: "@krishnadasa-kaviraja", facts: [F20, F29, F59, F61, F64], note: "В шикша-линии по Бхактисиддханте; жил в его бхаджан-кутире на Радха-кунде; видение Радхи подтвердило слова Кавираджа о полуслоге («она — Моя нарма-сахачари», ⚠Б2)."}
  - {type: siksha-guru, who: "@mukunda-dasa-radhakunda", facts: [F29], note: "Ученик Кавираджа; у него изучал книги Госвами (M 254–255; НВ-прил.)."}
  - {type: siksha-disciple, who: "@baladeva-vidyabhushana", facts: [F65, F66, F70, F71, F72, F73, F75, F77], note: "Самый способный ученик; учил его «Бхагавате» и ачинтья-бхеда-абхеде; послал в Галту; после его ухода Баладева возглавил движение. Подробности — реестр Баладевы."}
  - {type: disciple, who: "@krishnadeva-sarvabhauma", facts: [F67, F70, F73], note: "Вместе с Баладевой послан на диспут в Галту (B; у T, M — только Баладева, ⚠5)."}
  - {type: disciple, who: "@jagannatha-chakravarti", facts: [F68, F69], note: "Отец Нарахари Чакраварти (БР 15.47–48; T 70 — двусмысленно, ⚠12); посвящён, когда Вишванатха пришёл в Гауду (НВ-прил.)."}
  - {type: other, who: "@narahari-chakravarti", facts: [F68, F69], note: "Сын его ученика; приводит стихи «Ставамрита-лахари» в БР и НВ; по НВ-прил. — видел Вишванатху во сне."}
  - {type: opposed, who: "@rupa-kaviraja", facts: [F22, F24, F25], note: "Опроверг его учение «ати-бари» в «Сарартха-даршини» на Третью песнь (T); B — ученик Шринивасы, НВ-прил. — ученик Кришначараны (⚠10)."}
  - {type: opposed, who: "@balarama-mishra", facts: [F22], note: "B 972: «движение Баларамы, сына Адвайты, и его потомков» — без первоисточника (⚠Б6)."}
  - {type: deity-served, who: "@gokulananda-deity", facts: [F37, F38], note: "Установил служение; храм на Радха-кунде (B) / во Вриндаване (T) (⚠7); по НВ-прил. — Божество передал ему брахмачари по велению Самого Гокулананды."}
  - {type: deity-served, who: "@govardhana-shila-raghunatha", facts: [F37, F39], note: "Шила Рагхунатхи Даса ныне почитается в храме Гокулананды (B); по НВ-прил. — через Кавираджа, Мукунду и Кришнаприю."}
  - {type: other, who: "@krishnapriya-radhakunda", facts: [F39], note: "Давала ему служить Говардхана-шиле (НВ-прил.)."}
  - {type: other, who: "@jai-singh-ii", facts: [F70, F71, F72], note: "Пригласил его в Галту (B) / в Джайпур (T) / прислал гонца во Вриндаван (M) (⚠5)."}
  - {type: other, who: "@radha", facts: [F61, F62, F63, F64], note: "Явилась ему у Радха-кунды и открыла смысл полуслога кама-гаятри (⚠Б1, ⚠Б2)."}
  - {type: other, who: "@mahaprabhu", facts: [F58], note: "По НВ-прил. — во сне остановил его «Чайтанья-расаяну» (⚠Б10)."}
  - {type: other, who: "@jiva-gosvami", facts: [F49, F54, F57, F35], note: "Опирался на «Сандарбхи»; прославлял Дживу; «не отличен от Дживы во взглядах» (НВ-прил., B 527; ⚠11). = @jiva-gosvami F107, F363."}
  - {type: other, who: "@rupa-gosvami", facts: [F27, F40, F48, F50, F51], note: "Последовал его примеру, уйдя во Вриндаван; комментарии и изложения его книг. = @rupa-gosvami F326, F327, F575."}
  - {type: other, who: "@sanatana-gosvami", facts: [F49, F52, F79], note: "Следовал «Вайшнава-тошани». = @sanatana-gosvami F400, F401, F483."}
  - {type: other, who: "@bhaktisiddhanta", facts: [F20, F77, F78], note: "Шикша-парампара; «почтение Вишванатхе и его ученикам…» (⚠Б7)."}
  - {type: other, who: "@bhaktivinoda", facts: [F77, F79], note: "Издал «Гиту» с его комментарием (1886)."}
  - {type: other, who: "@bhakti-pramoda-puri", facts: [F64], note: "Рассказ о полуслоге в предисловии к ЧЧ (= @bhakti-pramoda-puri F23)."}
  - {type: other, who: "@vishnupriya", facts: [F53], note: "Беседа Гауры и Вишнуприи в его аштакалия-смаране (B 134, ⚠Б9)."}
