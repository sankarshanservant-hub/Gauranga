open_questions:
  - "Год рождения (1638 / 1656 / 1664) и год и место ухода (ок. 1708, Радха-кунда — только T) (⚠3)."
  - "Кто дал дикшу: Радхарамана (B, T, M 255) или Кришначарана (M 254); «Рамачарана» НВ-прил. (⚠4)."
  - "Галта: рамананди или рамануджи; послан ли с Баладевой Кришнадева; куда звал царь (⚠5)."
  - "Храм Гокулананды — Радха-кунда (B) или Вриндаван (T) (⚠7); возвращался ли он в Гауду после 1670 (⚠6)."
  - "Источник рассказа о полуслоге — «Мантрартха-дипика» (B) или комментарий к ЧЧ (T) (⚠2); «Айшварья-кадамбини» — его ли (⚠9)."
