open_questions:
  - "Как явились Божества Гаура-Нитай: по повелению Господа (B), Господа Сами дали Свои мурти (Мурари; в паде — пришли с двумя Божествами и предложили выбор, F72) или вырезаны из дерева ним по преданию (T) (F34–F36, F39)."
  - "Когда: M ставит прощание в Амбике перед санньясой, но в паде Господа уходят в Нилачалу; lila-db — P13, Мурари 4.14 (F32, F39)."
  - "Потомки: «рода нет» (B 166, T) — и тут же сыновья и внуки (B 167); Аннапурна — дочь (M, T) или внучка (B); Бхактисиддханта не принимал родства по ГВА (F13–F17)."
  - "День ухода: шукла-двадаши (T, календарь ШЧСМ) или экадаши (M) шраваны; место — по самадхи во Вриндаване (F66, F70–F71)."
  - "Подарок Господа: «Гитамрита» (B) или «Бхагавад-гита» (T, M); подлинность рукописи оспаривается (M) (F25, F31)."
  - "Божества храма: «Махапрабху» (B) или «Гаура-Нитьянанда» (T) (F24)."
  - "Стряпня: гневается Гауридас (B) или Божества (M); старость — только M (F42–F43). Два (B) или три (M) дня до праздника (F48)."
  - "Ссылки на БР 7 и 11 не сверены — нет нашего перевода этих глав."
  - "Тождество Кришнадаса-поэта (по Маджумдару — брат Гауридаса) с Кришнадасом Саркхелом не установлено."
