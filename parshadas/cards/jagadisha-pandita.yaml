open_questions:
  - "Кто из братьев пошёл с ним к Ганге — Хиранья (B, T) или Махеша (M, «Анубхашья»); были ли три брата (B 835, T 86) (F12–F15)."
  - "Как шло событие экадаши: ходил ли Мишра к Джагадише (B, T) или брахманы сами принесли угощение (ЧБ Ади 6) (F26–F28, ⚠4)."
  - "Когда Господь послал его в Нилачалу (T — до санньясы) и когда он переселился в Яшаду (M — вероятно, после санньясы) (F40, F53)."
  - "День явления: шукла-двадаши Пауши (B, T, «Анубхашья»), Гаура экадаши Нараяны (наш календарь) или шукла-экадаши магхи — Бхима-экадаши (ДЧВ) (F69, F84, ⚠14)."
  - "ДЧВ: брат, пришедший с ним к Ганге, — Махеша (как M и «Анубхашья»), Хиранья — лишь друг (F91, F93)."
  - "ДЧВ: Калавати во Врадже (F113) — против ГГД 143/192; источник предания неизвестен (⚠20)."
  - "Кто такой «хромой Бхагаван», отец Рагхунатхи Ачарьи: тот ли Бхагаван Ачарья из Пури (ДЧВ — да; ЧЧ о сыне молчит) (F110, ⚠19)."
  - "Сноски перевода ДЧВ о «слиянии двух Джагадиш» (ГГД 143 и 192) противоречат «Анубхашье» — пересмотреть (⚠21)."
