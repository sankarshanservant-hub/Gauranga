period_note: "Лично — в Навадвипе с детских игр Господа (P03, экадаши) и в киртанах (P07); родился раньше Господа по Его велению (P01, ЧБ Ади 2.98–99). Нилачала и Божество Джаганнатхи — время не названо (T: велено до санньясы, F40; M: переселение в Яшаду «вероятно после санньясы», F53). Ходил с гаудийцами в Пури (P12, ЧБ Антья 8.28; M); при встрече Господа с Шачи в Шантипуре (P13, ЧБ Антья 4.273, тождество вероятное); Панихати (P14, ЧЧ Антья 6.62). P15 — среди спутников, явившихся в Кхетури (БР 10; M 114) — не лично в обычном смысле. По «Джагадиша-чаритра-виджае» (ДЧВ, поздний источник, ур. C): детство, учёба, свадьба и переселение в Навадвипу (P01); экадаши (P03); послан в Нилачалу после усмирения Кази (P07, F96); приходы Господа в Яшоду после санньясы (P09, F102–F107); с Господом в Пури и с Нитьянандой в Гауду (P10, P12, F108–F109)."
