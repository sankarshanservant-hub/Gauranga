events_note: "Место — #jashra (Яшода; дубль #yashoda-gram сведён 2026-11-23). Тег @jagadisha-pandita есть в lila-db у ev-navadvipa-vaishnavas-before-advent (ЧБ Ади 2), ev-jagadisha-hiranya-ekadashi (ЧЧ Ади 10, 14; ЧБ Ади 6; ванданы), ev-shridhara-kholavecha (ЧБ Мадхья 23.452), ev-gauda-devotees-set-out-puri (ЧБ Антья 8.28), ev-panihati-chida-dadhi (ЧЧ Антья 6.62), ev-nityananda-preaching-gauda (vv-0061), ev-tattva-bhakti-kalpataru (ЧЧ Ади 11.30). По реестру, но без тега в записях lila-db: ev-closed-door-kirtan-scoffers (ЧБ Мадхья 8.115, F35), ev-jala-keli-navadvipa (Мадхья 13.336, F37), ev-nagara-kirtana-kazi (Мадхья 23.150, F38), ev-shantipura-after-natashala (Антья 4.273, F67), ev-kheturi-festival (БР 10; M 114, F68). Нилачала и Божество Джаганнатхи, приезды Господа в Яшаду и Гаура-Гопала (F40–F64) — отдельных событий в lila-db нет (вторичные источники и «Анубхашья»). +2026-11-23: события «Джагадиша-чаритра-виджаи» (events-jagadisha.yaml, jcv-0002…0016; поздний источник, ур. C) — рождение, детство, спор, свадьба, переселение, второй экадаши, послание в Нилачалу, Джаганнатха в Яшоде, приходы Господа, Гаура-Гопала, Нритья-виноди, Рагхунатха Ачарья, сокрытие; ev-advent-eclipse-devotees-rejoice — jcv-0007. БР 12 (brt-6040, brt-7020) — ev-jagadisha-hiranya-ekadashi; brt-7062, brt-7082 — пады о киртанах (F74)."
