period_note: "Лично: детство в Рамакели при Рупе и Санатане (по БР — видел Господа в Рамакели, P13; T сомневается); после сокрытия Махапрабху — Навадвипа, Каши, Врадж (P15): глава вайшнавов Враджа, учитель Шринивасы, Нароттамы и Шьямананды, отправка книг в Гауду (1504 Шака), переписка, сочинения до 1514 Шака и позже."
life:
  appearance:
    date: "по пяти версиям: 1455 Шака / ≈1533 (Бхактивинода; рукопись Вишвамбхарананды; T «по другим источникам»), 1580 Самват = 1445 Шака / ≈1523 (рукопись Ванамали Лала), 1511 (1433 Шака; ГВА, по T)"
    tithi: "бхадра шукла-двадаши (T); по нашему календарю — Гаура-двадаши месяца Хришикеша (≈ бхадра), в день явления Ваманадевы (23 сентября 2026)"
    place: "#chandradvipa"
    conf: "место: Бакла-Чандрадвипа (B) / Рамакели (T, по Анубхашье); год спорен — пять версий; срок жизни 85 лет (B, T)"
    facts: [F8, F9, F10, F11, F12, F13, F14, F15, F16, F17, F40, F50]
  disappearance:
    date: "1540 Шака / ≈1618 (Бхактивинода, Вишвамбхарананда; T «по другим»), 1665 Самват = 1530 Шака / ≈1608 (Ванамали Лал), 1596 (1518 Шака; ГВА, по T)"
    tithi: "пауша шукла-трития (B, T); по нашему календарю — Гаура-трития месяца Нараяна (≈ пауша); ближайший — 10 января 2027 (в день ухода Джагадиши Пандита)"
    place: "#vrindavana"
    conf: "день по B и T совпадает с нашим календарём; год — по той же версии, что и явление"
    facts: [F18, F9, F11, F13, F15, F16, F381]
