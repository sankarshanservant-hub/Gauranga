open_questions:
  - "Год рождения и ухода — пять версий (1511/1523/1533 — 1596/1608/1618); видел ли Джива Господа в Рамакели (БР) — согласуется лишь с версией ГВА (F8–F17, F50)."
  - "Место рождения: Бакла-Чандрадвипа (B) или Рамакели (T) (F40)."
  - "Сон: Гаура вручает Дживу Нитьянанде (B) или танцует в киртане (T) (F56)."
  - "Спор с Валлабхой: поправки к БРС и изгнание (T, БР 5) или «Таттва-дипа» (B); как совместить рассказ БР о прощении с оценкой Анубхашьи («клевета») (F69–F71, F93, F97, F98)."
  - "Радха-Дамодара: изначальное Божество в Джайпуре (B) или во Вриндаване (T) (F86)."
  - "Имя «Шьямананда»: от Дживы (B, T) или от Радхи (M); где найдена нупура; кто послал Дукхи к Дживе (F153, F156, F159, F161)."
  - "Титулы «Ачарья» и «Кавираджа»: повод и кто дал (F149, F180)."
  - "Время «Гопала-чампу»: колофоны 1510/1514 Шака против M (начата во второй приход Шринивасы) и «Карнананды» (при Рагхунатхе Дасе) (F106, F179, F279, F291)."
  - "Год ухода Анупамы — 1436 Шака (B) ⚠ (F48)."
  - "Атрибуции: «Сара-санграха», «Вайшнава-вандана», комментарии к «Дана-кели-каумуди»/«Лалита-мадхаве», «Бхринга-сандеша», «Джахнава-аштака» (F345–F353)."
