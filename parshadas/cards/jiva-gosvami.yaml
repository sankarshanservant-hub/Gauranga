events_note: "События — по реестру. ev-jiva-exiled-by-rupa и ev-rupa-narayana (дигвиджайи) — по ПВ/БР; Анубхашья (T) и B называют рассказ о наказании Дживы за победу над дигвиджайи клеветой сахаджиев (F97, F98), хотя T сам приводит прощение по БР 5 (F69–F71). ev-krishnadasa-kaviraja-departure (смерть Кавираджа от вести о краже, ПВ) — B считает вставкой (F100, F101); ev-krishnadasa-kaviraja-revived (Карнананда) в реестре нет. ev-gopala-champu-dispute — ср. «Карнананду» о свакии/паракии (F106). Эпизоды lila-db, где Джива лишь присутствует (ev-rupa-sanatana-renunciation, ev-rupa-sanatana-departure, ev-srinivasa-vision-rupa-sanatana, ev-narottama-initiation, ev-narottama-champaka-manjari и др.), сюда не вынесены (query.py @jiva-gosvami)."
