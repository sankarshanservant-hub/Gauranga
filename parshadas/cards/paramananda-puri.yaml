open_questions:
  - "Откуда и с кем он пришёл в Пури: ЧЧ — с юга вдоль Ганги, через дом Шачи, с Камалакантой; ЧЧН — из Варанаси; Карнапура — из Навадвипы с Гададхарой и Джагаданандой (F19–F25, ⚠7)."
  - "Место первой встречи: гора Ришабха (ЧЧ) или по пути из Шрирангама (Мурари, Лочан) / у Сетубандхи (Джаянанда) (F12, F18)."
  - "Исход заступничества за Младшего Харидаса: B и T — Господь соглашался пустить его; ЧЧ Антья 2 и B 883 — нет (F45, ⚠1)."
  - "Мощь Вишварупы в нём (ЧЧН) — против предания о Нитьянанде; толкование «Пури-ишвары» у переводчиков расходится (F61, ⚠Б8)."
  - "«Говинда-виджая» — что это за книга; известна лишь по упоминаниям (F60)."
  - "Годы жизни, место и день ухода неизвестны; в календаре ШЧСМ его дней нет (F5)."
