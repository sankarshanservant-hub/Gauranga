id: "@paramananda-puri"
names:
  ru: "Парамананда Пури"
  en: "Paramananda Puri"
  variants: ["Шри Парамананда Пури", "Пури Госвами / Пури Госани", "Пурипада", "Пури (ЧЧ Мадхья 11.204, 12.208; Антья 16.105, 19.12)", "Парамананда Пури-ишвара, Пури-ишвара («Чайтанья-чандродая»)", "Пури Шри Парамананда (ГГД 118)"]
  facts: [F1]
kind: associate
circle: [elders, puri]
period: [P11, P12, P13, P14, P15]
period_note: "Лично — с первой встречи на горе Ришабха в южном странствии (P11; F12–F18); затем через Гауду (дом Шачи) в Пури и постоянно при Господе (P12, P14; F19–F59); с Господом на пути в Гауду (P13; F58, F64, F65); жив после ухода Господа — его видел Шриниваса (P15; F55). P01 — лишь «явился в Трихуте» (ЧБ Ади 2.43); P07 — лишь мангалы ЧБ (F57) и санньяса Мадхавы Ачарьи по ПВ (F67). В lila-db колодец (ev-paramananda-puri-well-ganga) и приход санньяси (ev-devotees-gather-nilachala) отнесены к P10 — по ЧЧ он пришёл в Пури лишь после южного странствия (P12)."
