  facts: [F13, F14, F15, F16, F17, F20, F21, F22]
  note: "Дом отца — в Шалиграме близ Навадвипа (T, M; БР 12.3875 — там же и свадьба, F160); «Пата-нирная» 64 — место Сурьядаса «в Кхане» (чтение неясно, F164) ≠ дом и храм Сурьи даса в Амбике (T 87; B 171 — «Сурья дас из Амбики-Кальны»); родилась в Амбике-Калне (B)."
