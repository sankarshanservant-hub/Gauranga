open_questions:
  - "Вайшакха шукла-навами — день явления (B, наш календарь) или ухода (T)? M: явление — шукла-аштами (F25, F103)."
  - "Обстоятельства ухода: вхождение в тело Радхики в храме Гопинатхи (T 89) — единственное свидетельство в трёх книгах; год неизвестен (F104)."
  - "Место рождения: Амбика-Кална (B) или Шалиграм, где жил отец (T, M); дом Сурьи даса — в Шалиграме (T, M) или в Амбике (T 87; B 171) (F20, F24)."
  - "Кто из сестёр Ананга-манджари (ГГД 66); T пересказывает стих неточно (F6)."
  - "Справа (B) или слева (НВВ) от Гопинатхи (F8); изваяние Радхи — для Говинды (B) или для Мадана-мохана (НВВ) (F100)."
  - "Дядя в свите: Кришнадас Саркхел (T) или «Кришна Мишра» (M ⚠) (F19)."
  - "День её стряпни в Кхетури: первое подношение / утро после дня явления / третий день (F64)."
  - "Где она гостила у Шринивасы и куда пошла потом: Катва → Яджиграм (T 206); Яджиграм → Навадвипа (M 69) ≠ Яджиграм → Кхардаха (M pdf 235) (F85, F86)."
  - "Маршрут возвращения: со Шрикхандой (T) или без (M) (F81)."
  - "Мадхавачарья — ученик Нитьянанды, Джахнавы или Пурушоттамы (F98)."
  - "Титул «кавираджа» Говинде: Джива (T 189; так и B 523) или Джива, Шринивас и Джахнава (B 941) (F101)."
  - "«Према-виласа» 19 о поклонении Гауре в Кхетури — по B вставка; по B 672 19-я и 20-я виласы вообще не подлинны (F66)."
