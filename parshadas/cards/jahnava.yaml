# Карточка лица (формат — parshadas/CARDS.md § 3). Источник — только parshadas/facts/jahnava.md и lila-db.
id: "@jahnava"
names:
  ru: "Джахнава-деви"
  en: "Jahnava Devi"
  variants: ["Джахнава-мата", "Джахнава Тхакурани", "Джахнава Ишвари", "Нитьянандешвари", "Джахнави (ГГД)",
             "Нитьянанда-шакти", "Нитьянанда-сварупини", "Бхакта-сварупини"]
  facts: [F1, F2, F3, F4]
kind: family
circle: [panca-tattva, navadvipa, vrindavana, later]
period: [P15]
period_note: "БР 10–13 (дополнение 2026-11-23): сначала Кхетури, затем Врадж, возвращение через Кхетури — Будхари — Экачакру — Катву — Яджиграм — Шрикханду — Навадвипу — Амбику — Саптаграм; потом Радха для Гопинатхи, свадьба Вирачандры и второй путь во Врадж. Лично — после брака с Нитьянандой (Шалиграм, Навадвипа, Шантипур, Кхардаха); главное — после ухода Нитьянанды: Кхардаха, праздник в Кхетури, путешествие во Врадж и обратно (все — P15). В lila-db порядок событий её жизни взят из «Нитьянанда-вамша-вистары» и «Нароттама-виласы» (Вриндаван — до праздника в Кхетури); по T, M и B — сначала Кхетури, затем Врадж (F67, F69)."
life:
  appearance:
    date: "ок. 1409 г. Шака (≈ 1487) — только B"
    tithi: "вайшакха (Мадхусудана-маса) шукла-навами («Гаура-навами»), в один день с явлением Ситы-деви"
    place: "#ambika-kalna"
    conf: "титхи — по B и нашему календарю; M — шукла-аштами; у T этот же день — день ухода; год и место — только B"
    facts: [F23, F24, F25]
    note: "Наш календарь (Шри Чайтанья Сарасват Матх): Гаура-навами Мадхусудана-масы — явление Нитьянанда-шакти Шри Джахнавы-деви. T и M дом отца помещают в Шалиграме (F20); B называет отца «Сурья дас Саркхел из Амбики-Кальны» (F24)."
  disappearance:
    tithi: "вайшакха шукла-навами — только T"
    place: "#vrindavana"
    conf: "спорно"
    facts: [F103, F104]
    events: [ev-jahnava-gopinatha]
    note: "БР об уходе молчит, но говорит о втором её путешествии во Вриндаван (13.266–282, F158). T 200: ушла в вайшакха шукла-навами (по B и календарю — день явления, F25). T 89: в последнем путешествии во Врадж вошла в тело Радхики в храме Гопинатхи (свидетель — Парамешвари дас). M и B о дне и обстоятельствах ухода молчат. lila-db (НВВ, C): Гопинатха усадил её по левую руку от Себя."
  samadhi: []
origin:
  places: ["#saligrama", "#ambika-kalna"]
  family: ["@suryadasa-pandita", "@bhadravati", "@vasudha", "@kamsari-mishra-shaligrama"]
