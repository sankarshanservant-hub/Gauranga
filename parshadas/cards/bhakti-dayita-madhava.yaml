open_questions:
  - "Год/годовщина санньясы: T — Пхалгуна-пурнима 1944 г., «457-я годовщина», «в 40 лет»; по расчёту — 458-я годовщина и 39 лет (F50)."
  - "Хронология первых поездок в Ассам: «после Восточного Пакистана» (около 1947), но во время войны с Японией (F55); Хаули–Барпета — 1945 (F66)."
  - "Ассамские матхи: «три» (Тезпур, Гаухати, Гоалпара — T 282) и Сарбхог 1955 «под управлением» (T 288) (F68)."
  - "Чандигарх: сектор 20-A (перечень) или 20-B (T 282, школы) (F92)."
  - "«Говинда 26» в дате ухода по T не сходится с Гаура-пратипадом (новолуние 26.02.1979) — вероятно, иной счёт дней (F89)."
  - "Бенгальский год ухода: T — 1386, по счёту — 1385 (февраль 1979 г.); вероятно, опечатка T (F89)."
  - "Нараян Чандра Мукхопадхьяя: T — «позднее принял от него санньясу, Бодхаян Махарадж»; но Бхакти Прасун Бодхаян Махарадж до 1944 г. уже санньяси и духовный брат (F18, F49, F50)."
