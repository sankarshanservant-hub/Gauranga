period_note: "Нисходит прежде Господа (F6–F7); до явления — среди вайшнавов при Адвайте (F34–F35); учитель Нимая после упанаяны (F12–F22, F58–F59); после Гаи — встреча и увещевание (F24–F31); лично — в махапракаше, при спасении Джагая и Мадхая, в действе у Чандрашекхары (привратник — F60), шествии к Кази, у Шридхары (F38–F47); в последнюю ночь Господа в Навадвипе и после Его ухода — вестник между преданными и Шачи (F61); скорбит о санньясе (F48); в Шантипуре — в 1510 г. и в 1514 г., когда привёл туда Шачи (F49); в Пури — на Ратха-ятре и в играх на озере Нарендра (F50–F56)."
