- id: mc-kazi
  title: {ru: "Кази Навадвипы", en: "The qazi of Navadvipa"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Чханд Кази разбивает мридангу и запрещает киртан под угрозой лишения касты и имущества; шествие с факелами к его
      дому; беседа о коровах и Коране — ЧЧ Ади 17.124–177; «если падишах узнает, накажет» — ЧЧ Ади 17.195. Подробно —
      ЧБ Мадхья 23.101–420 (шествие).
    en: >-
      Chand Kazi breaks a mridanga and forbids kirtan on pain of loss of caste and property; the torchlit procession to
      his house; the dialogue on cows and the Quran — CC Adi 17.124–177; 'if the padishah hears of it he will punish
      you' — CC Adi 17.195. In detail — CB Madhya 23 (the procession).
  text:
    ru: >-
      Кази — мусульманский судья, назначенный султаном; в Навадвипе он судил, следил за порядком и мог наказывать
      индусов. Когда по всему городу зазвучал киртан, мусульмане пожаловались, и Чханд Кази вошёл в дом, разбил
      мридангу и пригрозил отнять касту и имущество у всякого, кто будет петь. В ответ Господь вывел вечером весь город
      с факелами и светильниками к дому кази. Испуганный кази сначала спрятался, а потом вышел, назвал Нимая
      «племянником» — дед Господа Ниламбара Чакраварти был ему как дядя — и после долгого спора о коровах и писаниях
      обещал больше не мешать киртану.
    en: >-
      The qazi was a Muslim judge appointed by the sultan; in Navadvipa he judged cases, kept order and could punish
      Hindus. When kirtan rang out all over town, Muslims complained, and Chand Kazi entered a house, broke a mridanga
      and threatened to take caste and property from anyone who sang. In answer the Lord led the whole town in the
      evening with torches and lamps to the qazi's house. The frightened qazi hid at first, then came out, called Nimai
      'nephew' — the Lord's grandfather Nilambara Chakravarti had been like an uncle to him — and after a long debate
      on cows and scriptures promised never again to hinder kirtan.
  hagiography: ["ЧЧ Ади 17.124–177", "ЧЧ Ади 17.195", "ЧБ Мадхья 23.101–420"]
  sources: []
  images: []
  game: {model: "дом кази с садом за глинобитной стеной; разбитая мриданга (событие)", where: ["navadvipa/kazi-house"]}

- id: mc-prison-sanatana
  title: {ru: "Тюрьма Санатаны и подкуп стража", en: "Sanatana's prison and the bribed jailer"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 19.27–34 (заключение), 20.3–15 (письмо Рупы, предложение 5000 *мудра̄*, затем груда в 7000; кандалы;
      ночная переправа через Гангу). Устройство тюрьмы не описано.
    en: >-
      CC Madhya 19.27–34 (imprisonment), 20.3–15 (Rupa's letter, an offer of 5,000 mudras, then a heap of 7,000;
      shackles; crossing the Ganga by night). The prison itself is not described.
  text:
    ru: >-
      Отказавшись идти с султаном в поход на Ориссу, Санатана оказался в заточении, в кандалах. Рупа оставил ему письмо и
      10 000 монет у купца. Санатана сначала уговаривал начальника тюрьмы, мусульманина, отпустить его ради
      благочестия и обещал пять тысяч монет; тот боялся гнева царя. Тогда Санатана высыпал перед ним груду в семь тысяч
      и научил, что сказать: узник прыгнул в реку в кандалах и утонул. Той же ночью страж снял с него оковы и
      переправил через Гангу.
    en: >-
      Having refused to go with the sultan on campaign against Orissa, Sanatana was imprisoned in shackles. Rupa had
      left him a letter and 10,000 coins with a merchant. Sanatana first urged the jailer, a Muslim, to free him for
      piety's sake and promised five thousand coins; the man feared the king's anger. Then Sanatana poured out a heap
      of seven thousand before him and told him what to say: the prisoner jumped into the river in his chains and
      drowned. That same night the jailer struck off his fetters and ferried him across the Ganga.
  hagiography: ["ЧЧ Мадхья 19.27–34", "ЧЧ Мадхья 20.3–15"]
  sources: []
  images: []
  game: {model: "кирпичное помещение с решёткой, железные ножные кандалы; ночная лодка на Ганге", where: ["gauda/prison"]}

- id: mc-gajapati-court
  title: {ru: "Царь Ориссы Пратапарудра и его сановники", en: "King Prataparudra of Orissa and his officers"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Указ наместникам строить для Господа дома с припасами, новые лодки на переправах, памятные колонны; министры
      Харичандан и Мангарадж; знатные женщины на слонах в крытых паланкинах — ЧЧ Мадхья 16.110–122, 16.150–157;
      сыновья Бхавананды Рая на службе (Рамананда, Гопинатха, Ванинатха) — ЧЧ Антья 9.13–54; Рамананда — правитель
      провинции, едет к реке на паланкине с музыкантами — ЧЧ Мадхья 8.14. Годы Пратапарудры (ок. 1497–1540) —
      общепринятые, проверить по PD (Hunter, Orissa 1872).
    en: >-
      An order to governors to build houses with provisions for the Lord, new boats at the crossings, memorial columns;
      the ministers Harichandana and Mangaraja; noble ladies on elephants in covered howdahs — CC Madhya 16.110–122,
      16.150–157; Bhavananda Raya's sons in service (Ramananda, Gopinatha, Vaninatha) — CC Antya 9.13–54; Ramananda as
      a provincial governor comes to the river in a palanquin with musicians — CC Madhya 8.14. Prataparudra's years
      (c. 1497–1540) are the accepted ones; to verify in PD (Hunter, Orissa 1872).
  text:
    ru: >-
      Орисса была отдельным царством, и её царь-гаджапати Пратапарудра считал себя слугой Джаганнатхи. Страной он
      правил через наместников и сановников-каранов: целая семья Бхавананды Рая служила ему — Рамананда был правителем
      южной провинции, Гопинатха собирал подати, Ванинатха служил при дворе. Когда Господь пошёл в Бенгалию, царь
      разослал по стране указ: в каждой деревне поставить для Него новые дома с припасами, на каждой реке держать
      новую лодку, а на местах омовения Господа ставить памятные столбы; знатные женщины выехали проститься с Ним на
      слонах.
    en: >-
      Orissa was a separate kingdom, and its gajapati king Prataparudra counted himself Jagannatha's servant. He ruled
      the land through governors and karana officers: the whole family of Bhavananda Raya served him — Ramananda
      governed the southern province, Gopinatha collected revenue, Vaninatha served at court. When the Lord set out for
      Bengal, the king sent an order across the land: in every village new houses with provisions were to be built
      for Him, a new boat kept ready at every river, and memorial pillars set up where the Lord bathed; noble ladies
      rode out on elephants to see Him off.
  hagiography: ["ЧЧ Мадхья 16.110–122", "ЧЧ Мадхья 16.150–157", "ЧЧ Мадхья 8.14", "ЧЧ Антья 9.13–54"]
  sources: []
  images: []
  game: {model: "царский указ на пальмовом листе; гонцы; слон с крытым паланкином-хаудой", where: ["puri/palace", "road-to-puri"],
         notes: "царь с золотой метлой — mc-king-sweeper (puri.yaml)"}

- id: mc-revenue-collector
  title: {ru: "Сборщик податей и его казнь на мечах", en: "The revenue collector and the sword platform"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Гопинатха Паттанаяк собирает подати в Маладжатхья Дандапате; недостача «2 лакха кахан каури» (*дуилакш̣а
      ка̄хана кауд̣и*); предлагает в уплату коней; царевич велит сбросить его с помоста на мечи; царь прощает и удваивает
      жалованье, дарит шёлковую ткань — ЧЧ Антья 9.13–54, 9.110–135. Бенгальские сборщики Хиранья и Говардхана — ЧЧ
      Антья 3.165, 6.17–34; главный сборщик Гопала Чакраварти — 3.188.
    en: >-
      Gopinatha Pattanayaka collects revenue in Malajathya Dandapata; a shortfall of '2 lakh kahans of cowries' (duilaksha
      kahana kaudi); he offers horses in payment; the prince orders him thrown from a platform onto swords; the king
      forgives him, doubles his pay and gives him a silk cloth — CC Antya 9.13–54, 9.110–135. Bengali collectors Hiranya
      and Govardhana — CC Antya 3.165, 6.17–34; the chief collector Gopala Chakravarti — 3.188.
  text:
    ru: >-
      Подати в Бенгалии и Ориссе собирали откупщики и чиновники: они отвечали перед царём головой и нередко оставляли
      часть себе. У Гопинатхи Паттанаяка, брата Рамананды Рая, недостача составила два лакха кахан каури — более 250
      миллионов раковин. Он предлагал в уплату своих коней, но поссорился с царевичем, и тот велел поднять его на помост
      и сбросить на выставленные внизу мечи. Махапрабху отказался вмешиваться — «Я нищий санньяси», — но по милости
      Джаганнатхи царь простил долг, удвоил Гопинатхе жалованье и пожаловал шёлковую накидку.
    en: >-
      Revenue in Bengal and Orissa was gathered by tax-farmers and officials who answered to the king with their heads
      and often kept a share. Gopinatha Pattanayaka, Ramananda Raya's brother, fell short by two lakh kahans of cowries
      — over 250 million shells. He offered his horses in payment but quarrelled with the prince, who ordered him raised
      on a platform and thrown onto swords set below. Mahaprabhu refused to intervene — 'I am a beggar sannyasi' — but by
      Jagannatha's grace the king forgave the debt, doubled Gopinatha's pay and granted him a silk cloth.
  hagiography: ["ЧЧ Антья 9.13–54", "ЧЧ Антья 9.110–135", "ЧЧ Антья 3.165", "ЧЧ Антья 3.188", "ЧЧ Антья 6.17–34"]
  sources: ["шкала: 1 кахан = 16 пан = 1280 каури (пословный ЧЧ Антья 9.19; ср. mc-cowrie-money)"]
  images: []
  game: {model: "помост-чанга из брёвен высотой 3–4 м, внизу — вбитые остриём вверх мечи (событие)", where: ["puri/palace"]}

- id: mc-silver-taka
  title: {ru: "Серебряная тангка (така) и «монеты» житий", en: "The silver tanka (taka) and the 'coins' of the hagiographies"}
  rubric: town
  era_evidence: epoch
  evidence_note:
    ru: >-
      В житиях крупные суммы названы просто *мудра̄* «монета» (ЧЧ Мадхья 19.9, 20.8, 20.14, 20.39; Антья 6.146, 6.151,
      6.259) — металл не указан, перевод «золотые» — толкование. Серебряная *тангка* как главная монета индийских
      султанов XIII–XIV вв., «по сути то же, что позднейшая рупия», и бенгальское *така* = рупия — HJ 1903, s.v. TANGA
      (с. 896–897), TUCKA (с. ~940). Серебряные тангки бенгальских султанов XV–XVI вв. известны по нумизматике (найти PD).
    en: >-
      The hagiographies name large sums simply as mudra 'coin' (CC Madhya 19.9, 20.8, 20.14, 20.39; Antya 6.146, 6.151,
      6.259) — the metal is not stated; 'gold' in translation is interpretation. The silver tanka as the main coin of
      the Indian sultans in the 13th–14th c., 'substantially the same with the rupee of later days', and Bengali taka =
      rupee — HJ 1903, s.v. TANGA (pp. 896–897), TUCKA (p. ~940). The silver tankas of the Bengal sultans of the
      15th–16th c. are known from numismatics (find PD).
  text:
    ru: >-
      Над мелочью-каури стояла серебряная монета — тангка, предок рупии: бенгальцы и сегодня называют рупию «така».
      Султаны Бенгалии чеканили её с арабскими надписями, без изображений. Такими монетами считали жалованье, подати,
      цену коней, взятки и дары: Рупа оставил у купца десять тысяч монет, Санатана высыпал перед тюремщиком семь тысяч,
      а Рагхунатха раздавал спутникам Нитьянанды по пять, десять и двадцать. Простой человек мог за всю жизнь не
      держать в руках столько серебра.
    en: >-
      Above the small change of cowries stood the silver coin — the tanka, ancestor of the rupee: Bengalis still call
      the rupee 'taka'. The sultans of Bengal struck it with Arabic legends and no images. Such coins counted pay,
      revenue, the price of horses, bribes and gifts: Rupa left ten thousand coins with a merchant, Sanatana poured out
      seven thousand before his jailer, and Raghunatha gave Nityananda's companions five, ten or twenty each. An ordinary
      man might never in his life hold so much silver.
  hagiography: ["ЧЧ Мадхья 19.9", "ЧЧ Мадхья 20.8", "ЧЧ Мадхья 20.14", "ЧЧ Мадхья 20.39", "ЧЧ Антья 6.146–153", "ЧЧ Антья 6.259"]
