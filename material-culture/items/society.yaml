- id: mc-sultan-gauda
  title: {ru: "Султан Гауды Хусейн-шах", en: "Husain Shah, Sultan of Gauda"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Царь Бенгалии» Хусейн-шах приезжает к Санатане, заключает его под стражу, идёт войной на Ориссу — ЧЧ Мадхья
      19.18–30; запрещает препятствовать Господу в Рамакели — ЧЧ Мадхья 1.168–181, ЧБ Антья 4.55–66 («если полгода не
      платить жалованья слугам — устроят заговор»; «разрушил храмы Ориссы» — 4.67, 4.78); прошлое Хусейна-хана,
      слуги Субуддхи Рая — ЧЧ Мадхья 25.180–186. Годы правления Алауддина Хусейн-шаха (1493–1519) — общепринятая
      датировка по монетам и надписям (уточнить по PD: Stewart 1813, Blochmann).
    en: >-
      The 'king of Bengal' Husain Shah visits Sanatana, puts him under guard and makes war on Orissa — CC Madhya
      19.18–30; forbids anyone to hinder the Lord at Ramakeli — CC Madhya 1.168–181, CB Antya 4.55–66 ('if I do not
      pay my servants for six months they will plot against me'; 'he destroyed the temples of Orissa' — 4.67, 4.78);
      Husain Khan's past as Subuddhi Raya's servant — CC Madhya 25.180–186. The reign of Alauddin Husain Shah
      (1493–1519) is the accepted dating from coins and inscriptions (to verify in PD: Stewart 1813, Blochmann).
  text:
    ru: >-
      Бенгалией в юности Господа правил султан Алауддин Хусейн-шах; его столица Гауда стояла на Ганге, у нынешнего
      Малды, и рядом с ней — деревня Рамакели, где жили его министры Рупа и Санатана. Жития помнят, что прежде он был
      простым служащим у землевладельца Субуддхи Рая, а став царём, вёл войны с Ориссой и разорял её храмы. Но когда
      ему рассказали о Шри Чайтанье в Рамакели, султан признал: тот, за кем без жалованья идут тысячи, — не простой
      человек, и велел никому не чинить Ему препятствий, «будь то кази или начальник стражи».
    en: >-
      In the Lord's youth Bengal was ruled by Sultan Alauddin Husain Shah; his capital Gauda stood on the Ganga near
      present-day Malda, and beside it lay the village of Ramakeli, where his ministers Rupa and Sanatana lived. The
      hagiographies remember that he had once been a mere employee of the landholder Subuddhi Raya, and that as king
      he warred with Orissa and ravaged its temples. Yet when he was told of Shri Chaitanya at Ramakeli, the sultan
      admitted that one whom thousands follow without pay is no ordinary man, and ordered that no one hinder Him,
      'be he qazi or chief of the watch'.
  hagiography: ["ЧЧ Мадхья 1.166–181", "ЧЧ Мадхья 19.18–30", "ЧЧ Мадхья 25.180–186", "ЧБ Антья 4.55–67", "ЧБ Антья 4.78"]
  sources: []
  images: [{file: "material-culture/img/creighton-1808-gaur-gateway-tomb-husain-shah.jpg", license: "PD (Public Domain Mark 1.0)",
            author: "James Moffat по рисунку Henry Creighton, ок. 1808", url: "https://wellcomecollection.org/works/s4ad6rk9"}]
  game: {model: "руины Гауды: кирпичные ворота с остроконечной аркой; в сцене — султан в тюрбане и кафтане с одним спутником",
         where: ["gauda/ramakeli"], notes: "о двух братьях-министрах — mc-royal-ministers"}
  todo: "даты и титулатура Хусейн-шаха — по PD (Stewart, History of Bengal 1813; Blochmann, JASB 1873–75)"

- id: mc-royal-ministers
  title: {ru: "Царская служба: Дабир Кхас и Сакар Маллик", en: "Royal service: Dabir Khas and Sakar Mallik"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Рупа — министр Дабир Кхас — ЧЧ Мадхья 1.175–181, 1.207; ЧБ Ади 1.171, 13.192; «Сакар Маллик и Рупа» — ЧБ Антья
      9.239; Санатана, сказавшись больным, перестаёт ездить ко двору, его дела ведут подчинённые; султан присылает
      лекаря проверить — ЧЧ Мадхья 19.13–23; Рупа увозит деньги на лодке, делит их и оставляет 10 000 монет у
      торговца — 19.6–9, 19.34; зять Санатаны Шрикант закупает коней для султана на 3 лакха — 20.38–39. Значение
      титулов (перс. *дабир-и хас* — личный секретарь; *сакар/сагир маллик* — младший сановник?) — уточнить.
    en: >-
      Rupa as the minister Dabir Khas — CC Madhya 1.175–181, 1.207; CB Adi 1.171, 13.192; 'Sakar Mallik and Rupa' — CB
      Antya 9.239; Sanatana, pleading illness, stops attending court, his subordinates do his work, and the sultan
      sends a physician to check — CC Madhya 19.13–23; Rupa takes money home by boat, divides it and leaves 10,000
      coins with a merchant — 19.6–9, 19.34; Sanatana's brother-in-law Shrikanta buys horses for the sultan with 3
      lakhs — 20.38–39. The meaning of the titles (Pers. dabir-i khas — private secretary; sakar mallik?) is to be
      verified.
  text:
    ru: >-
      Султану служили не только мусульмане: братья Рупа и Санатана, учёные брахманы, были его ближайшими министрами и
      носили персидские титулы — Дабир Кхас и Сакар Маллик. Они вели переписку и казну двора, жили в Рамакели в
      богатых домах, ездили ко двору и держали подчинённых. Султан так нуждался в Санатане, что, когда тот сказался
      больным, прислал своего лекаря, а потом приехал сам. Уходя к Господу, Рупа увёз богатство на лодках: половину
      раздал брахманам и вайшнавам, четверть — родне, а остальное оставил на хранение у знакомого купца.
    en: >-
      Not only Muslims served the sultan: the brothers Rupa and Sanatana, learned brahmins, were his closest ministers
      and bore Persian titles — Dabir Khas and Sakar Mallik. They handled the court's correspondence and treasury,
      lived in fine houses at Ramakeli, rode to court and kept subordinates. The sultan needed Sanatana so badly that
      when he pleaded illness the sultan sent his own physician and then came in person. Leaving for the Lord, Rupa
      took his wealth away by boat: half he gave to brahmins and Vaishnavas, a quarter to his kin, and the rest he left
      in the keeping of a merchant he knew.
  hagiography: ["ЧЧ Мадхья 1.175–181", "ЧЧ Мадхья 1.207", "ЧБ Антья 9.239", "ЧЧ Мадхья 19.4–23", "ЧЧ Мадхья 19.34",
                "ЧЧ Мадхья 20.38–39"]
  sources: []
  images: []
  game: {model: "персонажи-сановники: тонкое дхоти и верхняя ткань при дворе — кафтан и тюрбан (⚠ уточнить придворную одежду индусов на службе султана)",
         where: ["gauda/ramakeli"]}
