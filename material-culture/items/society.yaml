- id: mc-gold-mohur
  title: {ru: "Золотые мохуры и толы золота", en: "Gold mohurs and tolas of gold"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      У слуги Ишаны «восемь золотых мохуров» (*суварн̣ера аш̣т̣а мохара*) — ЧЧ Мадхья 20.19, 20.24–35; Рагхунатха дарит
      «семь тол золота» и «две толы» (*сон̣а̄ тола̄-са̄те*) — ЧЧ Антья 6.146, 6.153; золото, серебро и монеты среди даров
      Ситы — ЧЧ Ади 13.112–113. Мохур — от перс. *muhr* «печать»; золотая монета с ок. 1200 г. ≈ 100 рати чистого
      золота — HJ 1903, s.v. MOHUR, GOLD (с. ~572).
    en: >-
      The servant Ishana has 'eight gold mohurs' (suvarnera ashta mohara) — CC Madhya 20.19, 20.24–35; Raghunatha gives
      'seven tolas of gold' and 'two tolas' (sona tola-sate) — CC Antya 6.146, 6.153; gold, silver and coins among
      Sita's gifts — CC Adi 13.112–113. Mohur is from Pers. muhr 'seal'; a gold coin since c. 1200 of about 100 ratis of
      pure gold — HJ 1903, s.v. MOHUR, GOLD (p. ~572).
  text:
    ru: >-
      Золото ходило редко и стоило дорого: им платили за крупное и прятали на чёрный день. Слуга Санатаны Ишана тайком
      нёс в пути восемь золотых мохуров, и в горах Патара предводитель разбойников-бхуйя через гадателя узнал о них и
      собирался ночью убить путников. Санатана отругал слугу — «зачем ты несёшь то, что может стоить нам жизни?» — и
      сам отдал золото разбойнику, а тот, тронутый честностью, провёл его через горы. Золото считали и по весу — толами
      (около 11–12 г): Рагхунатха пожертвовал на праздник Нитьянанды семь тол золота.
    en: >-
      Gold circulated rarely and was dear: it paid for big things and was hidden against a rainy day. Sanatana's
      servant Ishana secretly carried eight gold mohurs on the road, and in the Patara hills a bandit chief, a bhuiya,
      learned of them through a fortune-teller and planned to kill the travellers at night. Sanatana scolded the
      servant — 'why carry what may cost us our lives?' — and gave the gold to the bandit himself, who, moved by his
      honesty, led him across the hills. Gold was also reckoned by weight in tolas (about 11–12 g): Raghunatha gave
      seven tolas of gold for Nityananda's festival.
  hagiography: ["ЧЧ Мадхья 20.16–35", "ЧЧ Антья 6.146", "ЧЧ Антья 6.153", "ЧЧ Ади 13.112–113"]
  sources: ["Hobson-Jobson (1903), s.v. MOHUR, GOLD, с. ~572"]
  images: []
