- id: mc-mudga-supa
  title: {ru: "Мудга-супа — дал из мунга", en: "Mudga-supa — mung dal"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *мудга-сӯпа* — ЧЧ Мадхья 3.44 (горшочки с супом из мунга вокруг горы риса); *бхр̣ш̣т̣а-ма̄ш̣а-мудга-сӯпа* —
      Мадхья 15.214 (суп из жареного урада и мунга, «посрамляющий нектар»); *мудга-д̣а̄ли-сӯпа* — Антья 10.137; запасы
      мунга — ЧБ Ади 4.34, ЧБ Антья 4.462; «суп из мунга» у Джаянанды (фр. 10, дв. 20). Рецепт — Пак-пранали, с. 116.
    en: >-
      mudga-supa — CC Madhya 3.44; bhrishta-masha-mudga-supa — Madhya 15.214 (soup of roasted urad and mung); mudga-
      dali-supa — Antya 10.137; stores of mung — CB Adi 4.34, CB Antya 4.462; mung soup in Jayananda (fr. 10 v. 20).
      Recipe — Pak-pranali p. 116.
  text:
    ru: >-
      Дал — жидкая похлёбка из колотых бобов; самый «чистый» и лёгкий — из мунга, его едят и здоровые, и больные. На
      праздничном листе вокруг горы риса стоят чашечки с мунг-далом; для особого вкуса зёрна мунга (и урада) сначала
      поджаривают на сухой сковороде — получается «бхришта-супа» с ореховым ароматом, которым Сарвабхаума угощал Господа.
      Дал льют на рис и едят вместе с овощами.
    en: >-
      Dal is a liquid pottage of split pulses; the "purest" and lightest is mung, eaten by the healthy and the sick
      alike. On a festive leaf, cups of mung dal stand around the mound of rice; for a special flavour the mung (and
      urad) are first roasted in a dry pan, giving the nutty "bhrishta-supa" with which Sarvabhauma treated the Lord.
      Dal is poured over the rice and eaten with the vegetables.
  recipe:
    ru: >-
      Реконструкция по Пак-пранали, с. 116 («сонамуг»): лучший мунг — «золотой» сона-муг. Мунг обжарить до
      золотистого (для бхришта-супы) или взять сырым; варить в уже горячей воде; когда закипит и поднимется пена —
      добавить пасту куркумы; когда разварится — взбить мутовкой; положить пасту тмина и чёрного перца, имбирную пасту,
      соль; заправить гхи (или маслом) с тмином и лавровым листом. «Немного сладкого и молока делают мунг-дал
      вкуснее». Зимой кладут кубики ман-качу. ⚠ В книге также «паста чили» — опустить, хватит перца и имбиря.
    en: >-
      Reconstruction after Pak-pranali p. 116: the best mung is "golden" sona-mug. Roast the mung golden (for
      bhrishta-supa) or use raw; cook in water already hot; when it foams add turmeric paste; when soft, whisk; add
      cumin-and-pepper paste, ginger paste and salt; temper with ghee (or oil), cumin and bay leaf. "A little sweet and
      milk make mung dal tastier." In winter add cubes of mankachu. ⚠ Omit the book's chilli paste.
  hagiography: ["ЧЧ Мадхья 3.44", "ЧЧ Мадхья 15.214", "ЧЧ Антья 10.137", "ЧБ Ади 4.34", "ЧБ Антья 4.462",
                "Джаянанда, фр. 10, дв. 20"]
  sources: ["Пак-пранали, с. 116 (сонамуг, правила дала)"]
  images: []
  game: {model: "глиняные чашечки с жёлтым жидким далом вокруг горки риса", where: ["mishra-house/kitchen"]}

- id: mc-bara
  title: {ru: "Бада — жареные лепёшки из дала", en: "Bada — fried lentil fritters"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *мудга-бад̣а̄, ма̄ш̣а-бад̣а̄, кала̄-бад̣а̄* — ЧЧ Мадхья 3.50, 15.215; *мадхура̄мла-бад̣а̄* — 3.49, 15.214 (*бад̣а̄мла̄ди*);
      *чха̄на̄-бад̣а̄, бад̣а̄, гхола* и *ка̄̐джи-бад̣а̄* — 15.210, 15.216; *пхула-бад̣а̄* — Антья 10.149; *бад̣а̄-бад̣и-кад̣и* —
      Мадхья 4.70; у Джаянанды — *бара, канджи-бара, дахи-бара, чхана-бара*. В переводе ЧЧ «лепёшки», «творожники»,
      «клёцки». Рецепты дахи-бады и гхол-бады — Пак-пранали, с. 415–416.
    en: >-
      mudga-, masha-, kala-bada — CC Madhya 3.50, 15.215; madhuramla-bada — 3.49, 15.214; chhana-bada, bada, ghola and
      kanji-bada — 15.210, 15.216; phula-bada — Antya 10.149; bada-badi-kadi — Madhya 4.70; Jayananda has bara,
      kanji-bara, dahi-bara, chhana-bara. Dahi-bada and ghol-bada recipes — Pak-pranali pp. 415–416.
  text:
    ru: >-
      Бада (бара) — круглые оладьи из растёртого и взбитого дала, жаренные в масле или гхи. Из мунга — лёгкие, из урада
      (маша) — мягкие и пышные, из спелых бананов — сладкие «кала-бада». Их едят горячими, а ещё вымачивают: в
      простокваше (дахи-бада), в пахте (гхола), в кислой рисовой воде (канджи-бада) или в кисло-сладкой подливе. Пышные
      «пхула-бада» с простоквашей, лимоном и имбирём сын Шивананды Сена принёс Господу — и Тот сказал: «Этот мальчик
      понял, чего Я хочу».
    en: >-
      Bada (bara) are round fritters of ground, whipped dal fried in oil or ghee. Mung bada are light, urad (masha)
      bada soft and puffy, and kala-bada of ripe bananas sweet. They are eaten hot, or soaked: in curd (dahi-bada), in
      buttermilk (ghola), in sour rice water (kanji-bada) or in a sweet-sour sauce. Puffy "phula-bada" with curd, lemon
      and ginger were what Shivananda Sena's son brought the Lord — who said, "This boy has understood what I want."
  recipe:
    ru: >-
      Реконструкция по Пак-пранали, с. 415–416: «дахи-бада» — сырой мунг-дал замочить, снять шелуху, растереть на камне
      и хорошо взбить, посолить перед самой жаркой (Амиш 1902, с. 330: «если посолить заранее — бада станет жёсткой»);
      жарить в масле небольшими оладьями; простоквашу смешать с солью, растёртыми мускатным орехом, кардамоном,
      гвоздикой, корицей; в гхи бросить горчицу и, как затрещит, влить в простоквашу; опустить в неё бады. «Гхол-бада» —
      бады из урада, опущенные в пахту с солью и куркумой, заправленную гхи. ⚠ «ланка» (чили) в книге — заменить
      чёрным перцем; пряности «гарам масала» уместны умеренно (гвоздика, кардамон в ЧЧ Антья 10.30 есть).
    en: >-
      Reconstruction after Pak-pranali pp. 415–416: dahi-bada — soak raw mung dal, skin it, grind on the stone and whip
      well, salting just before frying (Amish 1902 p. 330: salted early, bada turn hard); fry small fritters in oil;
      mix curd with salt and ground nutmeg, cardamom, clove, cinnamon; crackle mustard seed in ghee and pour into the
      curd; drop in the bada. Ghol-bada — urad bada dropped into buttermilk with salt and turmeric, tempered with ghee.
      ⚠ Replace the book's chilli with black pepper.
  hagiography: ["ЧЧ Мадхья 3.49–50", "ЧЧ Мадхья 4.70", "ЧЧ Мадхья 15.210", "ЧЧ Мадхья 15.214–216",
                "ЧЧ Антья 10.148–151", "Джаянанда, Васу 1897 (перечень кушаний)"]
  sources: ["Пак-пранали, с. 415–416 (дахи-бада, гхол-бада, дахи-пакаури)", "Амиш 1902, с. 330 (тесто для бады не солить заранее)"]
  images: []
  game: {model: "золотистые оладьи 5–6 см на листе; чашка с белой простоквашей, в которой плавают бады", where: ["mishra-house/kitchen"]}

- id: mc-pitha-puli
  title: {ru: "Питха и пули — рисовые пирожки", en: "Pitha and puli — rice-flour cakes"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *кш̣ӣра-пулӣ, на̄рикела-пулӣ, йата пит̣ха̄* — ЧЧ Мадхья 3.50, 15.215–216; *пит̣ха̄-па̄на̄* (питха и сладкий напиток) —
      Мадхья 15.89, 15.221, Антья 6.110, 10.109, 10.119, 12.126; «пироги и пайас» в день рождения Господа (пхалгуна) —
      барамасья Джаянанды (Васу 1897, строфа 1); *дугдха-пули, нарикела-пули, шравасат-пули* — Джаянанда, фр. 10,
      дв. 22–24. Рецепты — Миштанна-пак 1898, с. 260–263.
    en: >-
      kshira-puli, narikela-puli, all kinds of pitha — CC Madhya 3.50, 15.215–216; pitha-pana — Madhya 15.89, 15.221,
      Antya 6.110, 10.109, 10.119, 12.126; "cakes and payasa" on the Lord's birthday (Phalguna) — Jayananda's
      baramasya (Vasu 1897, st. 1); dugdha-, narikela-, shravasat-puli — Jayananda fr. 10 vv. 22–24. Recipes —
      Mishtanna-pak 1898 pp. 260–263.
  text:
    ru: >-
      Питха — общее имя домашних пирожков из рисовой муки: тонкие блинчики на камне, варёные «пули» в форме полумесяца
      с кокосовой начинкой, пули, сваренные в молоке с гуром (кширапули). Их пекут к праздникам — особенно в холодные
      месяцы нового риса — и это женское искусство, которым славились хозяйки. В день рождения Господа, в полнолуние
      пхалгуны, Навадвипа праздновала «с пирогами и пайасом», а в Пури преданные снова и снова передавали Ему через
      Говинду «питха-пана» — пирожки и сладкий напиток.
    en: >-
      Pitha is the general name for home-made rice-flour cakes: thin crêpes on a stone, boiled crescent-shaped "puli"
      with coconut filling, puli cooked in milk with gur (kshira-puli). They are made for festivals — especially in the
      cold months of new rice — and it is a women's art for which housewives were famous. On the Lord's birthday, the
      full moon of Phalguna, Navadvipa celebrated "with cakes and payasa", and in Puri the devotees kept sending Him
      "pitha-pana" — cakes and a sweet drink — through Govinda.
  recipe:
    ru: >-
      Реконструкция по Миштанна-пак 1898, с. 260–263. «Сару-чакли»: равные части пасты урад-дала (без шелухи) и рисовой
      муки развести жидко; на камне или тава смазать маслом срезом черенка баклажана, налить тесто, разровнять
      пальмовым листом, перевернуть. «Бхапа-пули»: рисовую муку замесить на кипятке, слепить пули с начинкой из тёртого
      кокоса (с гуром), опустить в кипяток, сварить, остудить в холодной воде. «Дудхе аотано пули» (= кшира-пули): те же
      пули варить не в воде, а в молоке, добавив гур, пока молоко не загустеет. Анахронизмов нет.
    en: >-
      Reconstruction after Mishtanna-pak 1898 pp. 260–263. Saru-chakli: equal parts of skinned urad paste and rice
      flour in a thin batter; grease a stone or griddle with a cut aubergine stalk, pour, spread with a palm leaf, turn.
      Bhapa-puli: knead rice flour with boiling water, shape puli filled with grated coconut and gur, boil, cool in cold
      water. Dudhe aotano puli (= kshira-puli): the same puli cooked in milk with gur until it thickens. No anachronisms.
  hagiography: ["ЧЧ Мадхья 3.50", "ЧЧ Мадхья 15.89", "ЧЧ Мадхья 15.215–216", "ЧЧ Антья 6.110", "ЧЧ Антья 10.109",
                "ЧЧ Антья 12.126", "Джаянанда, фр. 10, дв. 22–24", "Джаянанда, барамасья (Васу 1897), строфа 1"]
  sources: ["Миштанна-пак 1898, с. 260–263 (сару-чакли, бхапа-пули, дудхе аотано пули)",
            "Миштанна-пак 1898, с. 230 (питха в определённые дни года — «часть дхармы»; женское искусство)"]
  images: []
  game: {model: "белые пули-полумесяцы 6–8 см в миске с молоком; стопка тонких блинчиков", where: ["mishra-house/kitchen"]}

- id: mc-payasa
  title: {ru: "Пайас (параманна) — рис, сваренный в молоке", en: "Payasa (paramanna) — rice cooked in milk"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *сагхр̣та-па̄йаса* в новых глиняных горшках — ЧЧ Мадхья 3.53; *гхр̣та-сикта парама̄нна… ча̄̐па̄кала̄-гханадугдха-а̄мра* —
      Мадхья 15.217; *па̄йаса* — Мадхья 4.74, Антья 6.110; *кш̣ӣра-одана* — Мадхья 15.89; у Джаянанды *паеш, параманна*
      (фр. 10, дв. 18, 23). Рецепт — Пак-пранали, с. 455–456: «раньше вместо розовой воды клали камфору и кардамон».
    en: >-
      payasa with ghee in new clay pots — CC Madhya 3.53; paramanna with ghee, champa bananas, thickened milk and mango
      — Madhya 15.217; payasa — Madhya 4.74, Antya 6.110; kshira-odana — Madhya 15.89; payesh, paramanna in Jayananda
      (fr. 10 vv. 18, 23). Recipe — Pak-pranali pp. 455–456: "formerly camphor and cardamom were used instead of rose".
  text:
    ru: >-
      Пайас, или параманна — «высшая пища»: ароматный рис, долго томлённый в цельном молоке до густоты, со сладким.
      Им по правилу «заканчивают сладким» любой пир. Сарвабхаума подал Господу пайас, политый гхи, с бананами
      чампа, сгущённым молоком и ломтиками манго, в новом глиняном горшке. Лучший пайас — из нового непропаренного
      риса тонкого ароматного сорта; «всё дело в молоке: плохое молоко никакие изыски не спасут».
    en: >-
      Payasa, or paramanna — "the supreme food": fragrant rice slowly simmered in whole milk until thick, with
      sweetening. By the rule "end with sweetness" every feast closes with it. Sarvabhauma served the Lord payasa
      drizzled with ghee, with champa bananas, thickened milk and slices of mango, in a new clay pot. The best payasa
      is of new, unparboiled rice of a fine fragrant variety; "it all depends on the milk — no refinement saves bad milk."
  recipe:
    ru: >-
      Реконструкция по Пак-пранали, с. 455–456 («камини чалер паес»): ½ поя (≈ 115 г) ароматного риса камини (новый,
      атап — непропаренный), 2 сера (≈ 1,9 л) молока, 1½ поя сахара или батасы. Рис варить прямо в молоке без воды
      (так лучше), примерно чхатак риса на сер молока, всё время мешая; сладкое класть, когда рис почти готов — батаса
      лучше сахара (молоко не «отходит»); как загустеет — сразу снять: перестоявший пайас невкусен. Ароматизировать
      порошком камфоры и мелкого кардамона («так делали прежде»). По ЧЧ Мадхья 15.217 сверху — гхи, бананы чампа,
      кхира и манго. Изюм, фисташки, розовая вода из книги — позднейшие, опустить.
    en: >-
      Reconstruction after Pak-pranali pp. 455–456: ≈ 115 g fragrant kamini rice (new, unparboiled), ≈ 1.9 l milk,
      sugar or batasa. Cook the rice directly in milk without water, about a chhatak of rice per seer of milk, stirring
      constantly; add sweetening when the rice is nearly done — batasa is better than sugar (the milk does not split);
      take off as soon as it thickens. Flavour with powdered camphor and small cardamom ("as was done formerly"). Per
      CC Madhya 15.217 top with ghee, champa bananas, khira and mango. Omit the book's raisins, pistachios and rose water.
  hagiography: ["ЧЧ Мадхья 3.53", "ЧЧ Мадхья 4.74", "ЧЧ Мадхья 15.89", "ЧЧ Мадхья 15.217", "ЧЧ Антья 6.110",
                "Джаянанда, фр. 10, дв. 18, 23"]
  sources: ["Пак-пранали, с. 455–456 (паес; камфора и кардамон «прежде»)", "Миштанна-пак 1898, гл. 10 (45 видов пайаса и питхи)",
            "Sen 1911, с. 247–248 (пайас — после жареного, перед кислым)"]
  images: []
  game: {model: "новый глиняный горшок с густым белым пайасом, гхи сверху, бананы и дольки манго", where: ["mishra-house/kitchen"]}

- id: mc-gopinatha-kshira
  title: {ru: "Кхир Гопинатхи — «амрита-кели»", en: "Gopinatha's kshira — 'amrita-keli'"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 4.115–120 (вечерняя бхога — *кш̣ӣра* в двенадцати глиняных горшочках, «амрита-кели», «Гопинатхера
      кшира»), 4.127–139 (Гопинатх прячет горшочек для Мадхавендры Пури под Своей накидкой; Пури разбивает пустой
      горшок на кусочки и хранит в узелке), 4.205–207 (Господу подносят 12 горшочков: 5 Он берёт, 7 отдаёт пуджари).
      Состав не описан — кхир (рис в молоке или уваренное молоко). Ремуна, Орисса.
    en: >-
      CC Madhya 4.115–120 (the evening bhoga — kshira in twelve clay pots, "amrita-keli"), 4.127–139 (Gopinatha hides
      a pot for Madhavendra Puri under His cloth; Puri breaks the empty pot and keeps the shards in a knot), 4.205–207
      (twelve pots offered to the Lord: He takes five, gives seven to the priest). The composition is not described.
      Remuna, Orissa.
  text:
    ru: >-
      В Ремуне, на пути в Пури, Господу Гопинатхе каждый вечер подносят кхир в двенадцати глиняных горшочках — он
      зовётся «амрита-кели», «игра нектара». Мадхавендра Пури захотел узнать его вкус, чтобы готовить такой же для
      своего Гопала, — и тут же устыдился желания. Ночью Гопинатх Сам спрятал один горшочек под Своей одеждой и велел
      пуджари отдать его Пури, сидевшему на базаре; так Божество прозвали «Кширачора» — «укравший кхир». Пустой
      горшок Пури разбил и каждый день съедал по черепку, храня осколки в узелке.
    en: >-
      At Remuna, on the road to Puri, Lord Gopinatha is offered kshira every evening in twelve clay pots — it is called
      "amrita-keli", "the play of nectar". Madhavendra Puri wished to know its taste so as to cook the same for his
      Gopala — and at once felt ashamed of the wish. At night Gopinatha Himself hid one pot under His cloth and told the
      priest to give it to Puri, sitting in the market; so the Deity became known as "Kshira-chora", "who stole the
      kshira". Puri broke the empty pot and ate a shard each day, keeping the pieces in a knot of his cloth.
  hagiography: ["ЧЧ Мадхья 4.1", "ЧЧ Мадхья 4.19–20", "ЧЧ Мадхья 4.115–139", "ЧЧ Мадхья 4.205–207"]
  sources: []
  images: []
  game: {model: "ряд из 12 небольших глиняных горшочков (≈ 10–12 см) с кхиром перед Божеством", where: ["remuna/temple"],
         notes: "горшочки с крышками-шара; один — за складкой одежды Божества"}
  todo: "PD: Hunter, Orissa 1872 / Mitra, Antiquities of Orissa — Ремуна и «кшира» (кхир) Гопинатхи в XIX в."

- id: mc-dadhi-chida
  title: {ru: "Дадхи-чида и дугдха-чида — пир в Панихати", en: "Dadhi-chida and dugdha-chida — the feast at Panihati"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Антья 6.51–80: рецепт приведён в самом житии (6.56–58); 400 больших глиняных горшков (*холна̄*) и 5–7 огромных
      *мр̣т-кун̣д̣ика̄*; каждому — два горшка, с *дугдха-чида̄* и *дадхи-чида̄*; 20 раздатчиков. Дугдха-чида — также
      ЧЧ Мадхья 3.54, 15.216. Дополняет карточку mc-khai-chida (рецепт и подача). Ежегодный праздник «данда-махотсава»
      в Панихати — поздняя традиция.
    en: >-
      CC Antya 6.51–80: the recipe is given in the text itself (6.56–58); 400 large earthen pots (holna) and 5–7 huge
      ones; two pots for each guest, with dugdha-chida and dadhi-chida; twenty servers. Dugdha-chida also CC Madhya
      3.54, 15.216. Supplements card mc-khai-chida (recipe and serving).
  text:
    ru: >-
      Нитьянанда в шутку «наказал» Рагхунатху даса: «Накорми Моих спутников простоквашей с рисовыми хлопьями!» — и
      на берегу Ганги в Панихати сошлась вся округа. Принесли сотни глиняных горшков, рис-чиду замочили, одну половину
      смешали с простоквашей, сахаром и бананами, другую — с уваренным молоком, бананами чампа, сахаром, гхи и
      камфорой. Каждому поставили по два горшка; места не хватило, и брахманы ели на берегу и даже стоя в воде. Нитьянанда
      в медитации призвал Махапрабху, и Они, смеясь, кормили друг друга из каждого горшка.
    en: >-
      Nityananda jokingly "punished" Raghunatha dasa: "Feed My companions curd with flattened rice!" — and the whole
      district gathered on the Ganga bank at Panihati. Hundreds of clay pots were brought; the chida was soaked, half
      mixed with curd, sugar and bananas, half with thickened milk, champa bananas, sugar, ghee and camphor. Everyone
      got two pots; there was not enough room, and brahmins ate on the bank and even standing in the water. Nityananda
      called Mahaprabhu in meditation, and laughing, They fed each other from every pot.
  recipe:
    ru: >-
      Житие (ЧЧ Антья 6.56–58): чиду замочить в горячем молоке; половину смешать с дадхи (простоквашей), чини (сахаром)
      и бананами; другую половину — с *гхана̄вр̣та-дугдха* (уваренным молоком), бананами чампа, сахаром, гхи и камфорой.
      Подавать в глиняных горшках, по два на человека. Пропорции не указаны; по Пак-пранали, с. 456 («чирар паес»)
      молоко уваривают наполовину, а чиду перед этим один раз ополаскивают водой.
    en: >-
      The text (CC Antya 6.56–58): soak chida in hot milk; mix half with dadhi, sugar and bananas; the other half with
      thickened milk, champa bananas, sugar, ghee and camphor. Serve in clay pots, two per person. No proportions are
      given; Pak-pranali p. 456 reduces the milk by half and rinses the chida once in water first.
  hagiography: ["ЧЧ Антья 6.48–80", "ЧЧ Мадхья 3.54", "ЧЧ Мадхья 15.216"]
  sources: ["Пак-пранали, с. 456 (чирар паес)"]
  images: []
  game: {model: "ряды больших глиняных горшков на берегу Ганги под деревом; помост (чабутара) для Нитьянанды",
         where: ["panihati/ganga-bank"]}

- id: mc-ruti-wheat
  title: {ru: "Рути и пшеничная мука — редкость на бенгальском столе", en: "Ruti and wheat flour — rare on the Bengali table"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 4.67 (*годхӯма-чӯрн̣а* — пшеничная мука, принесённая жителями деревни), 4.71–73 (*рут̣и* горами — Аннакута
      Гопала на Говардхане, Врадж). Бенгальские перечни (Мадхья 3, 15; Антья 10) рути не называют. Кхаджа из муки —
      ЧЧ Мадхья 14.31. Наблюдение Пак-пранали (с. 112): на северо-западе едят дал с рути — для Бенгалии это чужое.
    en: >-
      CC Madhya 4.67 (godhuma-churna — wheat flour brought by villagers), 4.71–73 (heaps of ruti — Gopala's Annakuta at
      Govardhana, Vraja). The Bengali lists (Madhya 3, 15; Antya 10) do not name ruti. Pak-pranali notes that people of
      the north-west live on dal and ruti — foreign to Bengal.
  text:
    ru: >-
      Бенгалия ест рис; пшеница здесь — привозная и праздничная. Зато во Врадже, когда Мадхавендра Пури открыл Божество
      Гопала, крестьяне принесли весь свой рис, дал и пшеничную муку, и семеро поваров напекли рути (пресных лепёшек)
      «горами» вокруг горы риса на листьях палаша. Для игры: в Навадвипе лепёшки — редкость, в Матхуре и на пути через
      Бихар — обычная еда; пшеничная мука в Бенгалии шла больше на жаренные в гхи сладости вроде кхаджи.
    en: >-
      Bengal eats rice; wheat here is imported and festive. But in Vraja, when Madhavendra Puri revealed the Deity of
      Gopala, the villagers brought all their rice, dal and wheat flour, and seven cooks made ruti (unleavened flatbreads)
      "in mountains" around the mountain of rice on palasha leaves. For the game: in Navadvipa flatbreads are a rarity,
      in Mathura and on the road through Bihar ordinary food; in Bengal wheat flour went mostly into ghee-fried sweets
      like khaja.
  hagiography: ["ЧЧ Мадхья 4.67–75", "ЧЧ Мадхья 14.31"]
  sources: ["Пак-пранали, с. 112 (хиндустанцы живут далом и рути; в Бенгалии гхи в дал кладут редко — от бедности)"]
  images: []
  game: {model: "стопки круглых пресных лепёшек (15–18 см) на листьях палаша", where: ["vraja/govardhana"]}

- id: mc-mudga-ankura
  title: {ru: "Пророщенный мунг с имбирём", en: "Sprouted mung with ginger"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *са-лаван̣а мудга̄н̇кура, а̄да̄ кха̄ни кха̄ни* — ЧЧ Мадхья 14.33 (прасад Джаганнатхи в саду: солёные ростки мунга и
      имбирь кусочками); *ан̇курера сане мудга* — ЧБ Антья 4.467 (запасы у Адвайты рядом с кхирой и сахарным тростником).
      Поздняя традиция подношения ростков мунга с имбирём — в обиходе вайшнавов; PD-подтверждения пока нет.
    en: >-
      sa-lavana mudgankura, ada khani khani — CC Madhya 14.33 (Jagannatha prasada in the garden: salted mung sprouts and
      pieces of ginger); ankurera sane mudga — CB Antya 4.467 (stores at Advaita's next to khira and sugarcane).
  text:
    ru: >-
      Не всё на столе варят: целые зёрна мунга замачивают, держат в мокрой ткани день-два, пока не проклюнутся белые
      ростки, — и подают сырыми, с солью и ломтиками свежего имбиря. Это лёгкое, «прохладное» угощение стояло среди
      прасада Джаганнатхи на пиру после уборки Гундичи, а у Адвайты в Шантипуре ростки мунга хранили рядом с кувшинами
      молока и связками сахарного тростника. Кусочки имбиря с солью — и сами по себе закуска, «пробуждающая аппетит».
    en: >-
      Not everything is cooked: whole mung beans are soaked and kept in a wet cloth for a day or two until white sprouts
      appear — and served raw, with salt and slices of fresh ginger. This light, "cooling" dish stood among Jagannatha's
      prasada at the feast after the cleaning of Gundicha, and at Advaita's in Shantipur mung sprouts were kept next to
      jars of milk and bundles of sugarcane. Ginger pieces with salt are a relish of their own that "wakes the appetite".
  hagiography: ["ЧЧ Мадхья 14.33", "ЧБ Антья 4.467"]
  sources: []
  images: []
  game: {model: "глиняная миска с пророщенным мунгом и ломтиками имбиря", where: ["puri/jagannatha-vallabha-garden", "shantipur/advaita-house"]}

- id: mc-sugar
  title: {ru: "Сахар: гур, кханда, чини, мисри", en: "Sugar: gur, khanda, chini, misri"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Ступени сахара — ЧЧ Мадхья 19.179 (*бӣджа, икш̣у, раса, гуд̣а, кхан̣д̣а, са̄ра, ш́аркара̄, сита̄, мичхари, уттама-
      мичхари* — семя, тростник, сок, гур, кханда, «сара», шаркара, сита, мисри, лучшая мисри; сравнение со ступенями
      бхакти). *чини* — Антья 6.53, 6.57–58; *кхан̣д̣а-са̄ра* — Мадхья 14.31, 15.55, Антья 10.135; *ш́аркара̄* — Мадхья 3.48;
      *икш̣у-дан̣д̣а* — ЧБ Антья 4.467; *падмачини* — Мадхья 14.31, Антья 10.119; сахарные деревца — Мадхья 14.32;
      *набат* — Мадхья 14.30, Джаянанда. Очистка — Миштанна-пак 1898, с. 52–57.
    en: >-
      The stages of sugar — CC Madhya 19.179 (seed, cane, juice, gur, khanda, sara, sharkara, sita, misri, best misri;
      a simile for the stages of bhakti). chini — Antya 6.53, 6.57–58; khanda-sara — Madhya 14.31, 15.55, Antya 10.135;
      sharkara — Madhya 3.48; sugarcane — CB Antya 4.467; padmachini — Madhya 14.31, Antya 10.119; sugar trees — Madhya
      14.32; nabat — Madhya 14.30, Jayananda. Refining — Mishtanna-pak 1898 pp. 52–57.
  text:
    ru: >-
      Сладкое Бенгалии — из сахарного тростника (и пальмового сока). Кришнадас Кавирадж перечисляет ступени, как
      знает их каждая хозяйка: тростник → сок → тёмный густой гур → рыхлый кханда → кхандасара → белая шаркара → сита →
      мисри, прозрачный леденцовый сахар, и лучший мисри — так зреет и вкус преданности. Сахар-чини клали в чиду в
      Панихати, кхандасару и леденцы подносили Господу у Шачи и у бенгальских преданных, а в Пури Джаганнатхе подносили
      сахарные «деревца» с листьями, цветами и плодами и сахар в форме лотосов (падмачини).
    en: >-
      Bengal's sweetness comes from sugarcane (and palm sap). Krishnadasa Kaviraja lists the stages as every housewife
      knew them: cane → juice → dark thick gur → loose khanda → khandasara → white sharkara → sita → misri, the clear
      rock sugar, and the best misri — so too ripens the taste of devotion. Chini went into the chida at Panihati,
      khandasara and rock sugar were offered to the Lord at Shachi's and by the Bengali devotees, and in Puri Jagannatha
      was offered sugar "trees" with leaves, flowers and fruit, and sugar in the shape of lotuses (padmachini).
  recipe:
    ru: >-
      Как делали «деши чини» (Миштанна-пак 1898, с. 52–53, XIX в., способ старинный): гур из тростникового сока
      выкладывают в глиняные сосуды-«пете» с отверстием, патока («мат») стекает 2–3 дня; сверху кладут пласты речной или
      прудовой водоросли (шевла), и за неделю верхний слой гура белеет — его соскребают, снова накрывают водорослью, и
      так до конца. Этот «кханд» растворяют в воде, кипятят, брызгая водой с молоком, — пена-грязь всплывает, её
      снимают; сироп мешают на стенках, пока не загустеет, растирают камнем — готов чини. Батаса — капли сиропа на
      циновке (с. 55–57), набат — уваренный гур, застывший в форме (с. 57). Мисри кристаллизуют на нитях. Там же: «фабричный
      сахар чище, но некоторые индусы считают его нечистым».
    en: >-
      How "deshi chini" was made (Mishtanna-pak 1898 pp. 52–53, an old method): cane gur is put into perforated clay
      pots and the molasses drains for 2–3 days; layers of river or pond weed are laid on top, and within a week the top
      layer whitens — it is scraped off, re-covered, and so on. This khand is dissolved, boiled while sprinkling milky
      water — the scum rises and is skimmed; the syrup is worked on the pan sides until it sets and ground with a stone
      — chini is ready. Batasa — drops of syrup on a mat (pp. 55–57), nabat — reduced gur set in a mould (p. 57).
  hagiography: ["ЧЧ Мадхья 19.179", "ЧЧ Мадхья 3.48", "ЧЧ Мадхья 14.30–32", "ЧЧ Мадхья 15.55", "ЧЧ Антья 6.53–58",
                "ЧЧ Антья 10.119", "ЧЧ Антья 10.135", "ЧБ Антья 4.467", "ЧБ Мадхья 9.82 (*икш̣у* — тростник)"]
  sources: ["Миштанна-пак 1898, с. 52–57 (очистка гура водорослями, сироп, батаса, набат)",
            "«Анубхашья» к ЧЧ Мадхья 14.30 (набат — сладость, сваренная в сиропе)"]
  images: []
  game: {model: "связки сахарного тростника; тёмный гур в горшке; белые батасы и прозрачные кристаллы мисри на подносе",
         where: ["mishra-house/kitchen", "navadvipa/market"]}

- id: mc-ladu
  title: {ru: "Ладу (наду) — сладкие шарики", en: "Ladu (nadu) — sweet balls"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *ла̄д̣у* — ЧЧ Мадхья 14.28, *д̣а̄ли-марича-ла̄д̣у* — 14.30; *на̄д̣у* Дамаянти — Антья 10.22 (*дханийа̄-маухарӣ* —
      кориандр и фенхель; в переводе «анис»), 10.23 (*ш́ун̣т̣хӣ-кхан̣д̣а на̄д̣у* — имбирные), 10.25 (кокосовые и «ганга-джали»),
      10.28–30 (из рисовых хлопьев и жареного риса с камфорой, перцем, гвоздикой, кардамоном), 10.32 (из гороха); *на̄д̣у* от
      преданных — Антья 10.109; «сахарные ладду» — Джаянанда, фр. 10, дв. 21. Рецепт — Миштанна-пак 1898, с. 70–71.
    en: >-
      ladu — CC Madhya 14.28, dali-maricha-ladu — 14.30; Damayanti's nadu — Antya 10.22 (coriander and fennel; the
      translation says "anise"), 10.23 (ginger), 10.25 (coconut and "ganga-jali"), 10.28–30 (of rice flakes and roasted
      rice with camphor, pepper, clove, cardamom), 10.32 (of peas); nadu from the devotees — Antya 10.109; sugar ladus —
      Jayananda fr. 10 v. 21. Recipe — Mishtanna-pak 1898 pp. 70–71.
  text:
    ru: >-
      Наду — шарики размером с крупный орех, скатанные из чего угодно сухого, сваренного в сахарном сиропе или гуре:
      из тёртого кокоса, из поджаренного рисового порошка, из кунжута, из семян кориандра и фенхеля, из сушёного
      имбиря. Они долго хранятся, и потому Дамаянти отправляла их Господу в Пури на весь год, с камфорой, гвоздикой и
      кардамоном; имбирные наду, по её заботе, ещё и помогали пищеварению. Белые кокосовые шарики звались «ганга-джал» —
      «вода Ганги».
    en: >-
      Nadu are balls the size of a large nut, rolled from almost anything dry cooked in sugar syrup or gur: grated
      coconut, roasted rice powder, sesame, coriander and fennel seed, dried ginger. They keep a long time, so Damayanti
      sent them to the Lord in Puri for the whole year, with camphor, clove and cardamom; the ginger nadu, in her care,
      also helped digestion. White coconut balls were called "ganga-jal" — "Ganga water".
  recipe:
    ru: >-
      Реконструкция «ананда-ладу» по Миштанна-пак 1898, с. 70–71 (делают на аннапрашану, упанаяну, свадьбу): непропаренный
      рис (атап) вымыть и грубо истолочь; кунжута — половина от риса: замочить, оттереть от шелухи на мешковине, истолочь;
      смешать с гуром без воды (+ тёртый кокос — «лучше всего»), скатать шарики, обжарить в гхи или горчичном масле
      до трещинок и прокатить в сиропе или гуре. По житию (ЧЧ Антья 10.29–30): жареный рис шали смолоть, смешать с гхи,
      сварить в сахарном сиропе, добавить камфору, чёрный перец, гвоздику, кардамон — и скатать.
    en: >-
      Reconstruction of ananda-ladu after Mishtanna-pak 1898 pp. 70–71 (made for annaprashana, upanayana, weddings):
      wash and coarsely pound unparboiled rice; half as much sesame, soaked, rubbed free of husk, pounded; mix with gur
      without water (+ grated coconut, "best of all"), roll balls, fry in ghee or mustard oil until they crack, and coat
      in syrup or gur. By the text (CC Antya 10.29–30): grind roasted shali rice, mix with ghee, cook in sugar syrup, add
      camphor, black pepper, clove and cardamom, and roll.
  hagiography: ["ЧЧ Мадхья 14.28–30", "ЧЧ Антья 10.22–32", "ЧЧ Антья 10.109", "Джаянанда, фр. 10, дв. 21"]
  sources: ["Миштанна-пак 1898, с. 70–71 (ананда-ладу)", "«Амрита-праваха-бхашья» к ЧЧ Антья 10.24 (кола-шунтхи — сушёные ягоды кул)"]
  images: []
  game: {model: "плетёная корзинка с шариками 3–4 см: белыми (кокос), бурыми (гур), пёстрыми (кунжут)",
         where: ["mishra-house/kitchen", "puri/gambhira"]}

- id: mc-ukhda-khaichur
  title: {ru: "Укхда и кхаичур — воздушный рис в сиропе с камфорой", en: "Ukhda and khaichur — puffed rice in syrup with camphor"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Антья 10.28 (из чиды — *худ̣ум*, обжаренный в гхи, в сиропе, с камфорой — шарики), 10.31 (*ш́а̄ли-дха̄нйера кхаи… чини-
      па̄ке укхд̣а̄… карпӯра̄ди дийа̄*); «Анубхашья» к 10.28: *худ̣ум* — восточнобенгальское имя мури; *кхаичур* — у
      Джаянанды (Васу 1897, перечень). Рецепт кхаичура (с камфорой, имбирём, кардамоном, корицей) — Миштанна-пак 1898,
      с. 62–63: совпадает с житием почти дословно.
    en: >-
      CC Antya 10.28 (hurum from chida, fried in ghee, in syrup, with camphor — balls), 10.31 (khai of shali rice in
      sugar syrup — ukhda, with camphor); Anubhashya on 10.28: hurum is the East Bengali name for muri; khaichur in
      Jayananda (Vasu 1897 list). The khaichur recipe (camphor, ginger, cardamom, cinnamon) — Mishtanna-pak 1898 pp.
      62–63 — matches the text almost word for word.
  text:
    ru: >-
      Воздушный рис кхаи (рис, лопнувший в горячем песке) варят в густом сахарном сиропе, всё время мешая, чтобы зёрна
      чуть раскрошились, затем добавляют растёртые камфору, сушёный имбирь, кардамон и капельку гхи — и катают рыхлые
      ароматные шарики или оставляют россыпью. Дамаянти сделала такую «укхду» из лучшего риса шали для Господа в Пури. Ещё
      в XIX в. лучший кхаи для кхаичура везли из Дханекхали.
    en: >-
      Puffed rice khai (rice popped in hot sand) is cooked in thick sugar syrup with constant stirring so the grains
      crumble a little, then ground camphor, dry ginger, cardamom and a drop of ghee are added — and loose fragrant balls
      are rolled, or it is left crumbly. Damayanti made such "ukhda" of the best shali rice for the Lord in Puri. Even in
      the 19th c. the best khai for khaichur came from Dhanekhali.
  recipe:
    ru: >-
      Реконструкция по Миштанна-пак 1898, с. 62–63 («кхаичур»): 1 сер свежего хорошо раскрывшегося кхаи на 1 сер сахарного
      сиропа; варить, непрерывно мешая лопаткой, пока кхаи частью не раскрошится и не начнёт склеиваться; снять, всыпать
      порошки: мелкий кардамон 4 аны, корица 4 аны, сушёный имбирь 2 аны, камфора 1½ аны (≈ 1 ана = 1/16 толы); добавить
      немного горячего гхи; скатать шарики и обвалять в сахаре. Можно на гуре — тогда без обвалки. Анахронизмов нет.
    en: >-
      Reconstruction after Mishtanna-pak 1898 pp. 62–63: 1 seer of fresh well-popped khai to 1 seer of sugar syrup;
      cook, stirring constantly, until the khai partly crumbles and begins to bind; off the fire add powdered small
      cardamom, cinnamon, dry ginger and camphor; a little hot ghee; roll balls and coat in sugar. With gur no coating is
      needed. No anachronisms.
  hagiography: ["ЧЧ Антья 10.28", "ЧЧ Антья 10.31"]
  sources: ["Миштанна-пак 1898, с. 62–63 (кхаичур; кхаи из Дханекхали)", "«Анубхашья» к ЧЧ Антья 10.28 (худум = мури)"]
  images: []
  game: {model: "рыхлые белые шарики воздушного риса в сиропе, в глиняном горшочке", where: ["puri/gambhira", "mishra-house/kitchen"]}

- id: mc-khaja
  title: {ru: "Кхаджа и тила-кхаджа — слоёная сладость", en: "Khaja and tila-khaja — layered sweet"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *кха̄джа̄, кхан̣д̣аса̄ра… тила̄кха̄джа̄ра прака̄ра* — ЧЧ Мадхья 14.31 (прасад Джаганнатхи); «Анубхашья»: тиле-кхаджа —
      кхаджа с кунжутом, обжаренным в гхи. Кхаджа и поныне — одна из главных сладостей Пури. Рецепты — Миштанна-пак 1898,
      с. 143–145 (кхаджа), с. ~66–67 (тиле-кхаджа — плитки сиропа с кунжутом).
    en: >-
      khaja, khandasara, tila-khaja — CC Madhya 14.31 (Jagannatha prasada); Anubhashya: tile-khaja is khaja with sesame
      fried in ghee. Khaja is still a chief sweet of Puri. Recipes — Mishtanna-pak 1898 pp. 143–145 (khaja), pp. ~66–67
      (tile-khaja — syrup slabs with sesame).
  text:
    ru: >-
      Кхаджа — хрупкая слоёная лепёшка: тесто из пшеничной муки с большим количеством гхи раскатывают, смазывают,
      складывают и снова раскатывают, пока не наберётся множество тончайших слоёв; в горячем гхи они раскрываются, как
      листы книги, а потом их пропитывают густым сиропом. Среди прасада Джаганнатхи, которым Господь угощал киртанщиков
      в саду после уборки Гундичи, были кхаджа и кунжутная кхаджа. Простая «тиле-кхаджа» бенгальского базара — тонкие
      плитки сахарного сиропа, густо посыпанные кунжутом.
    en: >-
      Khaja is a brittle layered pastry: dough of wheat flour with plenty of ghee is rolled, greased, folded and rolled
      again until it has many very thin layers; in hot ghee they open like the leaves of a book, and then they are
      soaked in thick syrup. Among Jagannatha's prasada with which the Lord fed the kirtan singers in the garden after
      cleaning Gundicha were khaja and sesame khaja. The plain "tile-khaja" of a Bengali market is thin slabs of sugar
      syrup thickly strewn with sesame.
  recipe:
    ru: >-
      Реконструкция по Миштанна-пак 1898, с. 143–145: мука 1 сер, гхи 1 сер, сахар 1½ сера; в муку — не меньше поя гхи на
      сер (моян), месить очень круто («хоть молотом»); раскатать тонко «как лист», смазать гхи, свернуть, расплющить,
      снова раскатать — повторить много раз; нарезать, каждую дольку раскатать кружком и жарить в гхи, пока слои не
      поднимутся; пропитать сиропом крутой варки (сначала дать стечь гхи — оно пригодится). Тиле-кхаджа (с. ~66–67): сироп
      или гур уварить до твёрдого, вылить на доску, посыпать очищенным кунжутом, нарезать плитками.
    en: >-
      Reconstruction after Mishtanna-pak 1898 pp. 143–145: flour 1 seer, ghee 1 seer, sugar 1½ seers; rub at least a
      quarter seer of ghee into each seer of flour, knead very stiff; roll "thin as a leaf", grease, roll up, flatten,
      roll again — many times; cut, roll each piece into a round and fry in ghee until the layers rise; soak in hard-
      boiled syrup. Tile-khaja: boil syrup or gur hard, pour on a board, strew with husked sesame, cut into slabs.
  hagiography: ["ЧЧ Мадхья 14.31"]
  sources: ["Миштанна-пак 1898, с. 143–145 (кхаджа), с. ~66–67 (тиле-кхаджа)", "«Анубхашья» к ЧЧ Мадхья 14.31"]
  images: []
  game: {model: "золотистые слоёные ромбы 6–8 см, блестящие от сиропа; плитки с кунжутом", where: ["puri/temple-market", "puri/jagannatha-vallabha-garden"]}

- id: mc-sar-sarapuri
  title: {ru: "Сар, сарабхаджа, сарапури — сладости из молочных пенок", en: "Sar, sarabhaja, sarapuri — sweets of milk skin"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *сара̄мр̣та, сарабха̄джа̄, сарапурӣ* — ЧЧ Мадхья 14.29 (прасад Джаганнатхи); *сара* — Мадхья 4.74 (Аннакута);
      *сарапурӣ* — Антья 18.106; «сливки» у Джаянанды (фр. 10, дв. 25). «Анубхашья» к Мадхья 14.29: сарабхаджу и
      сарапури особенно хорошо готовят в Надии, около Кришнанагара (XX в.). Рецепт сара и сарабхаджи — Миштанна-пак 1898,
      с. 44–47. ⚠ Слава кришнанагарских сарапури и сарабхаджи — поздняя (XVIII–XIX вв.); в Пури эпохи — храмовые.
    en: >-
      saramrita, sarabhaja, sarapuri — CC Madhya 14.29 (Jagannatha prasada); sara — Madhya 4.74; sarapuri — Antya
      18.106; cream in Jayananda (fr. 10 v. 25). Anubhashya on Madhya 14.29: sarabhaja and sarapuri are best made in
      Nadia near Krishnanagar. Recipe — Mishtanna-pak 1898 pp. 44–47. ⚠ The fame of Krishnanagar sarapuri is later.
  text:
    ru: >-
      Сар — плотная пенка, которая образуется на молоке, томящемся на слабом огне. Её снимают и кладут слоями одну на
      другую, получая толстый пласт; пласт режут, обжаривают в гхи и окунают в сироп — это сарабхаджа, а слоёные «пирожки»
      из пенок с начинкой — сарапури. Такие сладости подносили Джаганнатхе и раздавали в саду после уборки Гундичи;
      Радха в «Говинда-лиламрите» тоже готовит Кришне сарапури.
    en: >-
      Sar is the thick skin that forms on milk simmering over a low fire. It is lifted off and laid in layers one on
      another into a thick sheet; the sheet is cut, fried in ghee and dipped in syrup — that is sarabhaja, while layered
      "pastries" of milk skin with a filling are sarapuri. Such sweets were offered to Jagannatha and distributed in the
      garden after cleaning Gundicha; Radha too prepares sarapuri for Krishna.
  recipe:
    ru: >-
      Реконструкция по Миштанна-пак 1898, с. 44–47: две широкие сковороды с молоком; в одной под слабым огнём наращивают
      сар, другую держат на углях; пенки поднимают и кладут на пенку во второй сковороде — 3–4 раза; затем пласт осторожно
      вынуть, нарезать квадратами; в гхи с мелким кардамоном и мисри выложить куски, полить их молоком с пенками,
      перевернуть, прогреть. Сарабхаджа: пласт сара в 2–3 слоя обжарить минуту в гхи с кардамоном и проварить в сиропе.
    en: >-
      Reconstruction after Mishtanna-pak 1898 pp. 44–47: two wide pans of milk; in one, over a low fire, sar is grown;
      the other is kept on embers; the skins are lifted and laid onto the skin in the second pan — 3–4 times; the sheet
      is lifted out and cut into squares; laid in ghee with small cardamom and misri, basted with milk, turned and
      warmed. Sarabhaja: a 2–3-layer sheet fried a minute in ghee with cardamom and cooked in syrup.
  hagiography: ["ЧЧ Мадхья 4.74", "ЧЧ Мадхья 14.29", "ЧЧ Антья 18.106"]
  sources: ["Миштанна-пак 1898, с. 44–47 (сар, сарбхаджа)", "«Анубхашья» к ЧЧ Мадхья 14.29 (сарабхаджа, сарапури — Надия, Кришнанагар)"]
  images: []
  game: {model: "широкая сковорода с молоком на углях; квадраты слоёных пенок на блюде", where: ["puri/temple-kitchen"]}

- id: mc-jagannatha-sweets
  title: {ru: "Сладкий прасад Джаганнатхи: амрита-гутика, манохара и другие", en: "Jagannatha's sweet prasada: amrita-gutika, manohara and others"}
  rubric: puri
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 14.25–34 (балаганди-бхога: *манохара̄, ла̄д̣у… амр̣та-гут̣ика̄, кш̣ӣрса̄, амр̣та-ман̣д̣а̄, сараватӣ, кумд̣а̄-курӣ,
      хари-валлабха, се̐оти, карпӯра, ма̄латӣ, нава̄та, амр̣ти, падмачини, чандрака̄нти, кха̄джа̄, вийари, кадма̄*), 15.221
      (*амр̣та-гут̣ика̄, пит̣ха̄-па̄на̄* — прасад у Сарвабхаумы), 12.167, Антья 10.118–126 (амрита-гутика месяц не теряла вкуса).
      Толкования — «Анубхашья» к Мадхья 14.28–31 и «Амрита-праваха-бхашья» к Мадхья 12.167. Многие названия неясны (сами
      комментаторы ставят «?»).
    en: >-
      CC Madhya 14.25–34 (the Balagandi offering: manohara, ladu, amrita-gutika, kshirsa, amrita-manda, saravati,
      kumda-kuri, hari-vallabha, seoti, karpura, malati, navata, amriti, padmachini, chandrakanti, khaja, viyari,
      kadma), 15.221, 12.167, Antya 10.118–126. Glosses — Anubhashya on Madhya 14.28–31 and Amrita-pravaha-bhashya on
      Madhya 12.167. Many names are unclear (the commentators themselves add "?").
  text:
    ru: >-
      Сладости Пури — особый мир: их готовят храмовые повара и продают у Львиных ворот. «Амрита-гутика» — толстые пури,
      опущенные в загущённое молоко; «манохара» — род сандеша; «кширса» — уваренное молоко; «амрити» — жаренные в гхи
      спирали, вроде джилипи; «чандраканти» — тонкие урадовые блинчики в форме луны; «кадма» — твёрдые сахарно-рисовые
      шарики; «падмачини» — сахар в форме лотоса. На празднике в саду Господь Сам раздавал этот прасад рядам преданных, а
      оставшимся накормили нищих. Себе же Он однажды попросил «простых овощей», а сладкое велел дать спутникам.
    en: >-
      The sweets of Puri are a world of their own: temple cooks make them and they are sold at the Lion Gate.
      "Amrita-gutika" are thick puris soaked in thickened milk; "manohara" is a kind of sandesh; "kshirsa" — reduced
      milk; "amriti" — ghee-fried spirals like jilipi; "chandrakanti" — thin moon-shaped urad crêpes; "kadma" — hard
      balls of sugar and rice flour; "padmachini" — lotus-shaped sugar. At the garden feast the Lord Himself served this
      prasada to the rows of devotees, and the rest fed the poor. For Himself He once asked for "plain vegetables" and had
      the sweets given to His companions.
  hagiography: ["ЧЧ Мадхья 12.167", "ЧЧ Мадхья 14.25–45", "ЧЧ Мадхья 15.221", "ЧЧ Антья 10.118–126"]
  sources: ["«Анубхашья» к ЧЧ Мадхья 14.28–31 (манохара, кширса, амрити, набат, чандраканти, бияри, кадма, тиле-кхаджа)",
            "«Амрита-праваха-бхашья» к ЧЧ Мадхья 12.167 (амрита-гутика — толстые пури в кшире, «амрита-расавали»)",
            "«Амрита-праваха-бхашья» к ЧЧ Мадхья 14.25 (ни-сакри — молочное, фрукты и пр., не варёное)"]
  images: []
  game: {model: "лотки с горками сладостей у Львиных ворот: спирали, шарики, плитки, сахарные лотосы", where: ["puri/lion-gate", "puri/jagannatha-vallabha-garden"]}
  todo: "отождествить хари-валлабху, сеоти, кумда-кури, вияри (Hunter, Orissa 1872; Mitra 1880 — список храмовых сладостей)"

- id: mc-chhana
  title: {ru: "Чхана — творог в житиях", en: "Chhana — curd cheese in the biographies"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *на̄рикела-ш́асйа, чха̄на̄, ш́аркара̄ мадхура* — ЧЧ Мадхья 3.48 (кокос, чхана, сладкое с сахаром; в переводе — «простокваша»);
      *чха̄на̄, па̄на̄, паид̣а…* — Мадхья 14.26 (в переводе — «йогурт»); *чха̄на̄-бад̣а̄* — 15.210 («жареные творожники»);
      разночтение к Антья 10.109 — «падмачини, чхана» («Анубхашья»); «Анубхашья» к Антья 18.106: гангаджала и др. — «лепёшки
      из творога (чханы) с сахаром». Джаянанда (ок. 1560): «творог-чхена», *чхана-бара*, *маччха-чхена*, *чхана* (фр. 10,
      дв. 20, 25; Васу 1897). Значит, чхана как кушанье известна текстам XVI — нач. XVII в.; когда появился прессованный
      сандеш из чханы — вопрос открыт (см. mc-sandesh).
    en: >-
      chhana with coconut and sugar — CC Madhya 3.48 (translated "curd"); chhana among Jagannatha's prasada — Madhya
      14.26; chhana-bada — 15.210; a variant reading at Antya 10.109; Anubhashya on Antya 18.106: "cakes of chhana with
      sugar". Jayananda (c. 1560): chhena, chhana-bara, maccha-chhena. So chhana as a dish is known to 16th — early
      17th-c. texts; when pressed chhana sandesh appeared remains open (see mc-sandesh).
  text:
    ru: >-
      Чхана — свежий творог, который получают, «разбивая» кипящее молоко кислой сывороткой и откидывая хлопья на ткань.
      Привычно думать, что чхану в Бенгалии стали делать поздно, но жития её называют: у Адвайты Господу подали чхану
      с кокосом и сахаром, у Сарвабхаумы — жареные «чхана-бады», а Джаянанда в перечне пира Лакшми-деви пишет о
      «твороге-чхене». В игре чхана — белые комочки на листе или оладьи, а не узорный прессованный сандеш.
    en: >-
      Chhana is fresh curd cheese obtained by "breaking" boiling milk with sour whey and draining the curds on a cloth.
      It is commonly thought that Bengal began making chhana late, but the biographies name it: at Advaita's the Lord was
      served chhana with coconut and sugar, at Sarvabhauma's fried "chhana-badas", and Jayananda lists "chhena" at
      Lakshmi-devi's feast. In the game chhana is white lumps on a leaf or fritters, not a moulded patterned sandesh.
  recipe:
    ru: >-
      Реконструкция по Миштанна-пак 1898, с. 48–49: молоко вскипятить; рядом держать «дамбал» — старую кислую сыворотку
      (чем старше, тем лучше); побрызгать сывороткой на дно сосуда, влить горячее молоко, снова сыворотку — и так
      понемногу, пока хлопья не соберутся «пышным пластом»; откинуть на ткань. Чхана-бада: свежую чхану растереть, слепить
      лепёшки и обжарить в гхи (ср. «чхана бхаджа», с. 49–50), по желанию — в сироп.
    en: >-
      Reconstruction after Mishtanna-pak 1898 pp. 48–49: boil milk; keep "dambal" — old sour whey (the older the
      better) — at hand; sprinkle whey into the vessel, pour in hot milk, more whey, little by little, until the curds
      gather "in a fluffy cake"; drain on a cloth. Chhana-bada: knead fresh chhana, shape cakes and fry in ghee (cf.
      chhana-bhaja pp. 49–50), optionally into syrup.
  hagiography: ["ЧЧ Мадхья 3.48", "ЧЧ Мадхья 14.26", "ЧЧ Мадхья 15.210", "ЧЧ Антья 10.109 (разночтение)",
                "ЧЧ Антья 18.106", "Джаянанда, фр. 10, дв. 20, 25"]
  sources: ["Миштанна-пак 1898, с. 48–50 (чхана на старой сыворотке; чхана-бхаджа)",
            "«Анубхашья» к ЧЧ Антья 10.109 (разночтение «падма-чини, чхана»), к Антья 18.106"]
  images: []
  game: {model: "белые творожные комочки на листе; золотистые творожные оладьи", where: ["mishra-house/kitchen"],
         notes: "не рисовать узорный прессованный сандеш — его форма поздняя"}

- id: mc-ambal
  title: {ru: "Амбал и мадхурамла — кислое и кисло-сладкое", en: "Ambal and madhuramla — sour and sweet-sour dishes"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *мадхура̄мла-бад̣а̄, амла̄ди па̄̐ча-чхайа* — ЧЧ Мадхья 3.49 («пять-шесть кислых»); *мадхура̄мла, бад̣а̄мла̄ди амла
      па̄̐ча чхайа* — 15.214 («Анубхашья»: мадхурамла — чатни, сладко-кислое; бадамла — кислое с бадами); *мадхура̄мла* —
      Антья 10.135. Кислое — перед сладким в конце трапезы (Sen 1911, с. 247–248; Амиш 1902, с. 21). Рецепты — Пак-
      пранали, гл. 14, с. 451–453.
    en: >-
      madhuramla-bada, five or six sour dishes — CC Madhya 3.49; 15.214 (Anubhashya: madhuramla is chatni, sweet-sour;
      badamla — sour with badas); Antya 10.135. Sour comes before the final sweets (Sen 1911 pp. 247–248; Amish 1902
      p. 21). Recipes — Pak-pranali ch. 14 pp. 451–453.
  text:
    ru: >-
      Ближе к концу трапезы подают кислое — амбал (амла): жидкое блюдо из зелёного манго, тамаринда, ягод кул или
      лимона, сваренное с горчицей и пажитником, иногда с бадами; а «мадхурамла» — то же, но с гуром или сахаром, сладко-
      кислое, вроде чатни. Кислое «освежает рот» после жирного и готовит к сладостям. У Адвайты и у Сарвабхаумы Господу
      подали по пять-шесть кислых блюд, а в Пури бенгальские хозяйки баловали Его мадхурамлой.
    en: >-
      Towards the end of the meal comes the sour — ambal (amla): a thin dish of green mango, tamarind, kul berries or
      lemon cooked with mustard and fenugreek, sometimes with badas; madhuramla is the same with gur or sugar, sweet-sour,
      like a chutney. Sourness "refreshes the mouth" after rich food and prepares for the sweets. At Advaita's and at
      Sarvabhauma's the Lord was served five or six sour dishes, and in Puri the Bengali housewives spoiled Him with
      madhuramla.
  recipe:
    ru: >-
      Реконструкция по Пак-пранали, с. 452 («кадам-пхулер амбал» — из цветков кадамбы; приём общий для амбала): в масле или
      гхи бросить зёрна горчицы и пажитника, накрыть, пока не отщёлкают; положить кислую основу (зелёное манго, ягоды кул,
      тамаринд — «сырой тамаринд лучше, спелый чернит»), обжарить, добавить куркуму, соль, воду; проварить до густоты; по
      желанию — бади; в конце взбитая паста горчицы с маслом («вкус как у амбала с кашанди»). Для мадхурамлы — гур. Вариант
      на соке финиковой пальмы (с. 453): утренний свежий сок (не дневной, забродивший) уваривают, снимая пену.
    en: >-
      Reconstruction after Pak-pranali p. 452 (an ambal of kadamba flowers; the method is general): crackle mustard and
      fenugreek seed in oil or ghee under a lid; add the sour base (green mango, kul, tamarind — "raw tamarind is better,
      ripe blackens"), fry, add turmeric, salt and water; cook until thick; optionally bari; at the end whipped mustard
      paste with oil. For madhuramla add gur. A variant on date-palm sap (p. 453): fresh morning sap, not fermented
      midday sap, reduced while skimming.
  hagiography: ["ЧЧ Мадхья 3.49", "ЧЧ Мадхья 15.214", "ЧЧ Антья 10.135"]
  sources: ["Пак-пранали, с. 451–453 (амбалы: кадам-пхул, финиковый сок; тамаринд)", "«Анубхашья» к ЧЧ Мадхья 15.214",
            "Амиш 1902, с. 21 (порядок подачи: … калия, амбал, пайас, дахи, кхира, сладости)"]
  images: []
  game: {model: "чашечка из листа с жидким желтоватым кислым супом с кусочками манго", where: ["mishra-house/kitchen"]}

- id: mc-kasundi-achar
  title: {ru: "Кашанди и ачар — горчичный соус и соленья", en: "Kasundi and achar — mustard sauce and pickles"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Антья 10.15–16 (*а̄мра-ка̄ш́анди, а̄да̄-джха̄ла-ка̄ш́анди, нембу-а̄да̄, а̄мра-кали, а̄мси, а̄ма-кхан̣д̣а, таила̄мра, а̄ма-сатта̄*),
      10.18 (*ш́укта̄-па̄та̄-ка̄ш́анди*), 10.24 («сто видов ачара»); Мадхья 14.34 (*лембу-кула-а̄ди… а̄ча̄ра* — лимонные и ююбовые
      соленья, «Анубхашья»); Мадхья 15.90 (*ка̄ш́амр̣ди, а̄ча̄ра* — у Рагхавы). «Анубхашья» к Антья 10.16: тайламра — манговый
      ачар в горчичном масле. Рецепты — Пак-пранали, с. 441–443; ама-сатта — Миштанна-пак, с. ~278.
    en: >-
      CC Antya 10.15–16 (mango kasundi, ginger kasundi, lemon-ginger, mango buds, amsi, mango pieces, tailamra,
      ama-satta), 10.18, 10.24 ("a hundred kinds of achar"); Madhya 14.34 (lemon and jujube pickles); Madhya 15.90
      (kashamdi and achar at Raghava's). Anubhashya on Antya 10.16: tailamra — mango pickle in mustard oil. Recipes —
      Pak-pranali pp. 441–443.
  text:
    ru: >-
      Кашанди — острый бенгальский соус из молотой и выдержанной на солнце горчицы, часто с зелёным манго; ачар — соленья
      из манго, лимона, ягод кул, имбиря в соли и горчичном масле. Их делают весной и в начале лета, когда много зелёных
      манго, и хранят в глиняных кувшинах, время от времени выставляя на солнце. Сушёная на солнце пастила из спелого манго
      (ама-сатта) хранится до следующего сезона. Всё это Дамаянти сложила в мешки Рагхавы, и Господь в Пури целый год ел
      понемногу её соленья.
    en: >-
      Kasundi is a pungent Bengali sauce of ground, sun-cured mustard, often with green mango; achar are pickles of
      mango, lemon, kul berries and ginger in salt and mustard oil. They are made in spring and early summer when green
      mangoes abound and kept in clay jars, set out in the sun now and then. Sun-dried leather of ripe mango (ama-satta)
      keeps until the next season. All this Damayanti packed into Raghava's bags, and in Puri the Lord ate a little of
      her pickles all year long.
  recipe:
    ru: >-
      Реконструкция «джхал-кашанди» по Пак-пранали, с. 442–443: горчица 5 серов + рай-горчица ½ сера; перебрать, промыть
      4–5 раз, высушить на солнце, смолоть; понемногу заливать горячей водой, мешая палкой, полчаса, до состояния
      «глины»; сушить на солнце 8–10 дней; добавить зелёное манго (½ мана) и толочь в дхенки 3–4 раза с промежутками по
      два дня, суша на солнце, пока не станет «как воск»; смешать с солью (1½ сера) и чистым горчичным маслом. Хранить,
      иногда выставляя на солнце. «Лебу-джара» (с. 441–442): целые лимоны с ¼ веса соли выдерживают, пока не «созреют».
      Ама-сатта: сок спелого манго тонким слоем сушить на солнце слой за слоем.
    en: >-
      Reconstruction of jhal-kasundi after Pak-pranali pp. 442–443: mustard seed with some rai; pick over, wash 4–5
      times, sun-dry, grind; add hot water little by little, stirring half an hour, to a "clay"; sun-dry 8–10 days; add
      green mango and pound in the dhenki 3–4 times at two-day intervals, sun-drying, until "like wax"; mix with salt and
      pure mustard oil. Keep, sunning it now and then. Lebu-jara (pp. 441–442): whole lemons cured with a quarter of
      their weight in salt. Ama-satta: ripe mango juice sun-dried layer upon layer.
  hagiography: ["ЧЧ Мадхья 14.34", "ЧЧ Мадхья 15.90", "ЧЧ Антья 10.15–24"]
  sources: ["Пак-пранали, с. 441–443 (джхал-кашанди, тетул-кашанди, лебу-джара)", "«Анубхашья» к ЧЧ Мадхья 14.34, Антья 10.16",
            "Миштанна-пак 1898, с. ~278 (амсаттвер шарбат — ама-сатта)"]
  images: []
  game: {model: "глиняные кувшины с горловиной под тканью на солнце; плитки оранжевой манговой пастилы на циновке",
         where: ["mishra-house/courtyard", "mishra-house/storeroom"]}

- id: mc-dadhi-bhat
  title: {ru: "Дадхи-бхат с лимоном и имбирём — простая еда, которую любил Господь", en: "Curd-rice with lemon and ginger — the simple food the Lord loved"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Антья 10.146–151 (у Шивананды Сена Господь переел дорогого прасада; на другой день его сын Чайтанья дас принёс
      *дадхи, лембу, а̄да̄, пхула-бад̣а̄, лаван̣а* — «этот мальчик понял Мою мысль»; Господь ест *дадхи-бха̄та* и отдаёт ему
      остатки); *лембу-а̄да̄-кхан̣д̣а* — Мадхья 15.55 (у Шачи: имбирь с лимоном); *са̄рдрака* (имбирный салат) — Мадхья 3.45;
      *а̄да̄, лаван̣а, лембу* — Антья 10.135; Мадхья 12.167 (Господь просит себе *ла̄пхра̄-вйан̃джана* — простое овощное).
    en: >-
      CC Antya 10.146–151 (at Shivananda Sena's the Lord overate rich prasada; next day his son Chaitanya dasa brought
      curd, lemon, ginger, phula-bada and salt — "this boy knows My mind"; the Lord eats curd-rice and gives him the
      remnants); lembu-ada-khanda — Madhya 15.55; sardraka — Madhya 3.45; ginger, salt, lemon — Antya 10.135; Madhya
      12.167 (the Lord asks for plain lapra vegetables).
  text:
    ru: >-
      Роскошные пиры Господь принимал из любви к преданным, а Сам предпочитал простое. Когда Шивананда Сен накормил Его
      дорогим прасадом сверх меры, на следующий день юный Чайтанья дас принёс лишь простоквашу, лимон, имбирь, соль и
      пышные бады. Господь обрадовался: «Этот мальчик знает, чего Я хочу», — съел рис с простоквашей и отдал мальчику
      остатки. Нарезанный свежий имбирь с солью и лимоном (сардрака) — закуска «для огня пищеварения»: её подавали в
      начале трапезы и у Шачи, и у Адвайты.
    en: >-
      The Lord accepted lavish feasts out of love for His devotees, but Himself preferred simple food. When Shivananda
      Sena had fed Him too much rich prasada, the next day young Chaitanya dasa brought only curd, lemon, ginger, salt and
      puffy badas. The Lord was delighted: "This boy knows what I want," ate rice with curd and gave the boy the remnants.
      Sliced fresh ginger with salt and lemon (sardraka) is a relish "for the digestive fire": it was served at the start
      of the meal both at Shachi's and at Advaita's.
  recipe:
    ru: >-
      Житие: варёный рис + дадхи (простокваша) + соль; к нему лимон (лембу), свежий имбирь (ада) кусочками и пхула-бада.
      Реконструкция «бхат макха» по Амиш 1902, с. 45: горячий рис помять с гхи и щепотью соли, натереть коркой лимона-
      «каламба» с солью (растирать о камень — «чем больше трёшь, тем сильнее аромат»), перемешать.
    en: >-
      The text: boiled rice + dadhi (curd) + salt, with lemon, fresh ginger pieces and phula-bada. Reconstruction of
      "bhat makha" after Amish 1902 p. 45: mash hot rice with ghee and a pinch of salt, rub with lemon peel and salt
      ("the more you rub, the stronger the scent"), mix.
  hagiography: ["ЧЧ Мадхья 3.45", "ЧЧ Мадхья 12.167", "ЧЧ Мадхья 15.55", "ЧЧ Антья 10.135", "ЧЧ Антья 10.146–151"]
  sources: ["Амиш 1902, с. 45 (бхат макха: рис с гхи, солью и лимонной коркой)"]
  images: []
  game: {model: "горка белого риса с простоквашей, половинка лимона, ломтики имбиря, щепоть соли на краю листа",
         where: ["puri/shivananda-lodging"]}

- id: mc-coconut-water
  title: {ru: "Кокосовая вода для Кришны: служение Рагхавы Пандита", en: "Coconut water for Krishna: Raghava Pandita's service"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 15.70–84: на рынке кокос стоит *па̄̐ча ган̣д̣а̄* (5 ганда = 20 каури), а Рагхава платит *ча̄ри ча̄ри пан̣а* (по
      4 паны = 320 каури) за плод, привозя их за *даш́а-крош́а*; ежедневно 5–7 кокосов очищают и *суш́ӣтала… джале д̣уба̄н̃а̄*
      — держат в воде, чтобы охладить; срезают верх и подносят; затем раскалывают и подносят мякоть. Слуга коснулся
      притолоки — кокосы выброшены. Пить сок молодого кокоса — ЧБ Мадхья 8.293. Охлаждение в воде — Миштанна-пак 1898, с. 278.
    en: >-
      CC Madhya 15.70–84: in the market a coconut costs 5 ganda (20 cowries), but Raghava pays 4 pana (320 cowries)
      each, fetching them from ten kroshas; daily 5–7 coconuts are husked and kept in water to cool, the top cut and
      offered; then split and the flesh offered. A servant touched the lintel — the coconuts were thrown away. Drinking
      green-coconut water — CB Madhya 8.293. Cooling in water — Mishtanna-pak 1898 p. 278.
  text:
    ru: >-
      Молодой зелёный кокос — лучший напиток жаркого дня: внутри до стакана сладковатой прохладной воды и нежная
      мякоть. У Рагхавы Пандита в Панихати сотни пальм, но он искал самые сладкие кокосы за десять крош и платил за плод
      в шестнадцать раз дороже рыночной цены. Каждый день он держал 5–7 очищенных кокосов в воде, чтобы охладились,
      срезал верхушку и подносил Кришне — и порой Кришна выпивал всё до капли. Однажды слуга, держа кокосы, задел рукой
      притолоку, куда оседает пыль со стоп прохожих, — и Рагхава выбросил их за ограду: подношение должно быть чистым.
    en: >-
      A young green coconut is the best drink on a hot day: inside, up to a glass of sweetish cool water and tender
      flesh. Raghava Pandita at Panihati had hundreds of palms, yet he sought the sweetest coconuts ten kroshas away and
      paid sixteen times the market price. Each day he kept 5–7 husked coconuts in water to cool, cut off the top and
      offered them to Krishna — and sometimes Krishna drank every drop. Once a servant holding the coconuts brushed the
      lintel, where dust from passers-by's feet settles — and Raghava threw them over the fence: an offering must be pure.
  hagiography: ["ЧЧ Мадхья 15.69–84", "ЧБ Мадхья 8.293"]
  sources: ["Миштанна-пак 1898, с. 278 («дабер джал»: кокос держат в холодной воде 3–4 часа, срезают верх, кладут кусочек мисри)"]
  images: []
  game: {model: "очищенные зелёные кокосы со срезанной верхушкой в глиняном тазу с водой", where: ["panihati/raghava-house"],
         notes: "цена: 1 кокос = 20 каури на рынке; у Рагхавы — 320 каури"}

- id: mc-buttermilk-rasala
  title: {ru: "Пахта, расала и шикхарини — молочные напитки", en: "Buttermilk, rasala and shikharini — dairy drinks"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *дадхи, дугдха, ма̄т̣ха̄, ш́икхарин̣ӣ… матхани, сара* — ЧЧ Мадхья 4.74; *дадхи-дугдха, нанӣ, такра, раса̄ла̄, ш́икхарин̣ӣ* —
      14.33 («Анубхашья»: такра — пахтанье, гхол; расала — шербет, пана); *гхола* — 15.210; *раса̄ла̄-матхита дадхи* — 15.218;
      шикхарини как образ сладости — Антья 1.128. Пахта в джьяйштху — «Дак-вачана» (Sen 1911, с. 24). Свойства пахты (такра)
      по «Бхава-пракаше» — Амиш 1902, с. 40.
    en: >-
      dadhi, milk, matha, shikharini, mathani, sara — CC Madhya 4.74; takra, rasala, shikharini — 14.33 (Anubhashya:
      takra is buttermilk, ghol; rasala is sherbet, pana); ghola — 15.210; rasala-mathita dadhi — 15.218; shikharini —
      Antya 1.128. Buttermilk in Jyaishtha — Dak-vachana (Sen 1911 p. 24).
  text:
    ru: >-
      Когда из простокваши сбивают масло, остаётся пахта — такра, гхол, матха: кисловатый, лёгкий напиток для жаркого
      месяца джьяйштха. «Шикхарини» — густая простокваша, процеженная через ткань и взбитая с сахаром, камфорой,
      кардамоном и перцем, а «расала» — подобный сладкий напиток, шербет. Их ставили рядом с йогуртом и молоком на пирах
      и Гопалу на Говардхане, и Джаганнатхе; Кришнадас говорит, что игры Господа «сладки, как шикхарини».
    en: >-
      When butter is churned from curd, buttermilk remains — takra, ghol, matha: a sourish light drink for the hot
      month of Jyaishtha. "Shikharini" is thick curd strained through cloth and beaten with sugar, camphor, cardamom and
      pepper, and "rasala" a similar sweet drink, a sherbet. They stood beside curd and milk at the feasts of Gopala on
      Govardhana and of Jagannatha; Krishnadasa says the Lord's pastimes are "sweet as shikharini".
  recipe:
    ru: >-
      Реконструкция (шикхарини — по традиционному составу «Бхава-пракаши»; в PD-кулинарных книгах отдельный рецепт пока не
      найден): густую простоквашу откинуть на ткань, протереть, взбить с сахаром или мисри, добавить щепоть камфоры,
      мелкий кардамон, молотый чёрный перец. Гхол: простоквашу взбить мутовкой с водой, снять масло, посолить; гхол-бада —
      см. mc-bara. Пахту не пить вечером и в холод — правило аюрведы (Амиш 1902, с. 40, о такре).
    en: >-
      Reconstruction (shikharini after the traditional composition of Bhava-prakasha; no separate recipe yet found in
      PD cookbooks): strain thick curd through cloth, press through, beat with sugar or misri, add a pinch of camphor,
      small cardamom, ground black pepper. Ghol: churn curd with water, remove the butter, salt it.
  hagiography: ["ЧЧ Мадхья 4.74", "ЧЧ Мадхья 14.33", "ЧЧ Мадхья 15.210", "ЧЧ Мадхья 15.218", "ЧЧ Антья 1.128"]
  sources: ["«Анубхашья» к ЧЧ Мадхья 14.33 (такра — гхол; расала — шербет, пана)", "Sen 1911, с. 24 («Дак-вачана»: пахта в джьяйштху)",
            "Day 1874, с. 35 (при сбивании гхи остаётся пахта)"]
  images: []
  game: {model: "глиняный кувшин с мутовкой (деревянная мешалка со шнуром); чашки с белым напитком", where: ["mishra-house/kitchen"]}
  todo: "рецепт шикхарини в PD (Bhava-prakasha в пер. XIX в.; Hobson-Jobson?)"

- id: mc-pana-water
  title: {ru: "Пана и благоуханная вода", en: "Pana and scented water"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *пит̣ха̄-па̄на̄* — ЧЧ Мадхья 15.89, 15.221, Антья 10.109, 10.119, 10.125 («напитки» месяц не портились), 12.126
      (примечания: *па̄на̄* — подслащённый напиток; в переводе «сладкий рис»); *па̄на̄* в прасаде Джаганнатхи — Мадхья 14.26;
      *сува̄сита джала* в трёх кувшинах — Мадхья 3.56; *сугандхи ш́ӣтала джала-джха̄рӣ* — 15.220; *сува̄сита джала нава-па̄тре*
      — 4.65, 4.76; вода Ганги Господу — ЧБ Мадхья 9.82. Пить, не касаясь губами сосуда, — Day 1874, с. 27 (поздн.).
    en: >-
      pitha-pana — CC Madhya 15.89, 15.221, Antya 10.109, 10.119, 10.125, 12.126 (pana is a sweetened drink; the
      translation sometimes has "sweet rice"); pana in Jagannatha's prasada — Madhya 14.26; scented water in three jars —
      Madhya 3.56; cool fragrant water in spouted jars — 15.220; scented water in new vessels — 4.65, 4.76; Ganga water
      offered to the Lord — CB Madhya 9.82. Drinking without touching the lips — Day 1874 p. 27.
  text:
    ru: >-
      Пана — прохладный сладкий напиток: вода с сахаром или гуром, соком плодов (манго, бель, тамаринд, лимон) и щепотью
      перца или камфоры; «питха-пана» — пирожки с напитком — обычный дар Господу в Пури. Простую воду к трапезе ставят в
      кувшинах с носиком (джхари) по бокам листа, охлаждая её в пористой глине и ароматизируя камфорой и цветами; на
      праздниках Божеству подносят «благоуханную воду» в новых сосудах. Пьют, не касаясь губами края, — струйкой в рот.
    en: >-
      Pana is a cool sweet drink: water with sugar or gur, fruit juice (mango, bel, tamarind, lemon) and a pinch of
      pepper or camphor; "pitha-pana" — cakes with a drink — was a usual gift to the Lord in Puri. Plain water for the
      meal stands in spouted jars (jhari) beside the leaf, cooled in porous clay and scented with camphor and flowers;
      at festivals the Deity is offered "fragrant water" in new vessels. One drinks without touching the rim — pouring a
      thin stream into the mouth.
  recipe:
    ru: >-
      Реконструкция (состав паны — по традиции Пури; ⚠ в книгах XIX в. её место заняли «шарбаты» с розовой водой и льдом —
      лёд и розовая вода для эпохи не годятся): мякоть спелого беля или манго размять в холодной воде, процедить через
      ткань, подсластить гуром или мисри, добавить щепоть чёрного перца и крупицу камфоры. Мисри-шарбат (Миштанна-пак 1898,
      с. 273): мисри растворить в воде, процедить.
    en: >-
      Reconstruction (Puri tradition; ⚠ 19th-c. books replace it with "sherbets" with rose water and ice — not for the
      period): mash ripe bel or mango pulp in cold water, strain through cloth, sweeten with gur or misri, add a pinch
      of black pepper and a grain of camphor. Misri sherbet (Mishtanna-pak 1898 p. 273): dissolve misri in water, strain.
  hagiography: ["ЧЧ Мадхья 3.56", "ЧЧ Мадхья 4.65", "ЧЧ Мадхья 14.26", "ЧЧ Мадхья 15.89", "ЧЧ Мадхья 15.220–221",
                "ЧЧ Антья 10.109", "ЧЧ Антья 10.125–126", "ЧЧ Антья 12.126", "ЧБ Мадхья 9.82"]
  sources: ["Миштанна-пак 1898, с. 273 (мисрир шарбат)", "Day 1874, с. 27 (пьют, не касаясь губами латунного гхати)",
            "«Анубхашья» к ЧЧ Мадхья 14.33 (расала — шербет, пана)"]
  images: []
  game: {model: "глиняный кувшин-джхари с носиком; чашки с золотистым напитком", where: ["mishra-house/kitchen", "puri/gambhira"]}

- id: mc-kanji
  title: {ru: "Канджи (амани) — кислая рисовая вода", en: "Kanji (amani) — sour rice water"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *ка̄̐джи-бад̣а̄* — ЧЧ Мадхья 15.216 (в переводе «лепёшки на рисовой воде»); *канджи-бара* — Джаянанда (фр. 10, дв. 21;
      прим. 01-53: канджи — кислый рисовый отвар); «Дак-вачана»: в пауш — канджи (Sen 1911, с. 24). Пханта-бхат и амани —
      Амиш 1902, с. 45–47 (поздн., но приём старинный).
    en: >-
      kanji-bada — CC Madhya 15.216; kanji-bara — Jayananda (fr. 10 v. 21; kanji is sour rice water); Dak-vachana:
      kanji in Pausha (Sen 1911 p. 24). Panta-bhat and amani — Amish 1902 pp. 45–47.
  text:
    ru: >-
      Варёный рис, залитый водой и простоявший ночь-другую, слегка закисает: сам рис — «пханта-бхат», а кисловатая вода —
      «амани», или канджи. Это и еда бедняка в жару, и приправа: в канджи вымачивают жареные бады — получаются
      «канджи-бады», которые Сарвабхаума подал Господу. Старинная «Дак-вачана» советует в месяц пауш есть канджи. По
      аюрведе пханта-бхат тяжёл и «возбуждает все три доши», поэтому его считали едой простой, не праздничной.
    en: >-
      Boiled rice covered with water and left a night or two turns slightly sour: the rice itself is "panta-bhat" and
      the sourish water "amani", or kanji. It is a poor man's food in the heat and a seasoning too: fried badas are
      soaked in kanji — "kanji-badas", which Sarvabhauma served the Lord. The old Dak-vachana advises eating kanji in
      Pausha. In Ayurveda panta-bhat is heavy and "excites all three doshas", so it counted as plain, not festive, food.
  recipe:
    ru: >-
      Реконструкция по Амиш 1902, с. 45–47: утром сваренный рис остудить (горячий в воду не класть — испортится), сложить в
      глубокий горшок, залить водой на палец выше; через сутки вода — амани — кислит. Для кислее — сок лимона или
      стручок тамаринда, для аромата — листья лимона. «Амани» второго способа: в новом горшке с водой держать горсть риса,
      закрыть тканью, ставить на солнце 3–4 дня, ежедневно подкладывая горсть свежего риса, — вода станет прозрачно-кислой.
      Канджи-бада: жареные бады из урада опустить в амани с солью. ⚠ Зелёный чили «к пханта-бхату» в книге — опустить.
    en: >-
      Reconstruction after Amish 1902 pp. 45–47: cool the morning's rice (never put hot rice in water), put in a deep
      pot, cover with water a finger above; after a day the water — amani — is sour. For more sourness add lemon juice
      or a tamarind pod, lemon leaves for scent. A second amani: keep a handful of rice in water in a new pot under a
      cloth, sun it 3–4 days adding a handful of fresh rice daily — the water turns clear and sour. Kanji-bada: fried
      urad badas soaked in amani with salt.
  hagiography: ["ЧЧ Мадхья 15.216", "Джаянанда, фр. 10, дв. 21"]
  sources: ["Амиш 1902, с. 45–47 (пханта-бхат, амани; свойства по «Раджа-нигханту»)", "Sen 1911, с. 24 («Дак-вачана»: пауш — канджи)"]
  images: []
  game: {model: "глубокий глиняный горшок с рисом под водой, накрытый тканью", where: ["mishra-house/kitchen"]}

- id: mc-rice-varieties
  title: {ru: "Сорта риса и как варили бхат", en: "Rice varieties and how bhat was cooked"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *ш́а̄лй-анна* (рис шали) горой с жёлтым гхи — ЧЧ Мадхья 3.44, 15.207–208 (*тина-ма̄на тан̣д̣улера* — три мана риса;
      в переводе «почти три кг»), Антья 6.110, 12.125; *ш́а̄лика̄чат̣и-дха̄нйа* (лучший шали) для чиды — Антья 10.27; *а̄тапа*
      (непропаренный) — там же; новый рис в хеманту — барамасья Джаянанды (Васу 1897, строфа 10); рис с примесью сечки —
      ЧБ Мадхья 16.126 (рис Шукламбары). Варка с отливом отвара и правило Чараки — Амиш 1902, с. 39–40; камини — Пак-пранали,
      с. 456.
    en: >-
      shali rice in a mound with yellow ghee — CC Madhya 3.44, 15.207–208 (three manas of rice), Antya 6.110, 12.125;
      shalikachati paddy for chida — Antya 10.27; atapa (unparboiled) — ibid.; new rice in Hemanta — Jayananda's
      baramasya (Vasu 1897 st. 10); rice with broken grains — CB Madhya 16.126 (Shuklambara's rice). Draining the starch
      and Charaka's rule — Amish 1902 pp. 39–40; kamini — Pak-pranali p. 456.
  text:
    ru: >-
      Рис бывает разный: зимний «аман», собираемый в хеманту (ноябрь — декабрь), когда «по всему миру появляется новый
      рис», и летний «аус»; тонкий ароматный «шали» — для гостей и Божества, грубый — для будней. «Атап» — рис, очищенный
      без пропаривания, — чистый, для подношений и пайаса. Рис варят в большом горшке с избытком воды, а потом,
      подлив немного холодной, сливают отвар-«пхен» через прикрытый край — так, по Чараке, рис становится лёгким. Для
      Господа рис выкладывают горой на банановый лист и поливают жёлтым ароматным гхи так, что оно растекается по листу.
    en: >-
      Rice comes in many kinds: winter "aman", reaped in Hemanta (November–December) when "new rice appears all over the
      world", and summer "aus"; fine fragrant "shali" for guests and the Deity, coarse rice for every day. "Atap" is rice
      husked without parboiling — pure, for offerings and payasa. Rice is boiled in a big pot with plenty of water, and
      then, after adding a little cold water, the starch "phen" is poured off past the covered rim — so, says Charaka,
      the rice becomes light. For the Lord the rice is heaped in a mound on a banana leaf and drenched in yellow fragrant
      ghee until it runs over the leaf.
  recipe:
    ru: >-
      Реконструкция по Амиш 1902, с. 39–40: рис промыть, варить в избытке воды; когда разварится, влить немного холодной
      воды и слить отвар (пхен), наклонив горшок с крышкой; есть горячим. «Хорошо промытый, с отлитым отваром, тёплый рис
      лёгок; непромытый, с отваром, холодный — тяжёл» (Чарака). Рис горой с гхи (ЧЧ Мадхья 15.207–208): на лист
      выкладывают горку и поливают сверху растопленным гхи.
    en: >-
      Reconstruction after Amish 1902 pp. 39–40: wash the rice, boil in plenty of water; when soft, add a little cold
      water and pour off the starch (phen), tilting the covered pot; eat hot. "Well washed, drained, warm rice is light;
      unwashed, undrained, cold rice is heavy" (Charaka). The ghee-rice mound (CC Madhya 15.207–208): heap on a leaf and
      pour melted ghee over the top.
