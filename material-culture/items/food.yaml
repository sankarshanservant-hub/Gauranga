- id: mc-shak
  title: {ru: "Шак — тушёная зелень, любимое блюдо Господа", en: "Shak — cooked greens, the Lord's favourite"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Антья 4.279–299 (Шачи готовит 20 видов шака; Господь называет *ачйута̄, пат̣ала, ва̄стука, ка̄ла, са̄лин̃ча̄,
      хелен̃ча̄*); ЧБ Антья 5.88–90 и Джаянанда, фр. 15, дв. 34–38 (шак Рагхавы в Панихати); ЧБ Антья 7.137–154 (шак
      Гададхары, «рос сам»); ЧБ Антья 9.23, 9.56; ЧЧ Мадхья 3.45 (*ва̄стука-ш́а̄ка вивидха*), 15.210 (*даш́а-прака̄ра
      ш́а̄ка*), 15.54, Антья 10.136 («шак, два-четыре вида»). Отождествления видов — по Амиш 1902 и словарям; уточнить.
    en: >-
      CB Antya 4.279–299 (Shachi cooks 20 kinds of shak; the Lord names achyuta, patala, vastuka, kala, salincha,
      helencha); CB Antya 5.88–90 and Jayananda fr. 15 vv. 34–38 (Raghava's shak at Panihati); CB Antya 7.137–154
      (Gadadhara's self-sown shak); CB Antya 9.23, 9.56; CC Madhya 3.45, 15.210 (ten kinds of shak), 15.54, Antya
      10.136. Identification of species after Amish 1902 and dictionaries — to be checked.
  text:
    ru: >-
      Шак — листовая зелень, тушённая или обжаренная с маслом и пряностями. Все жития сходятся: больше всего Господь
      любил шак. Когда Он после санньясы гостил в Шантипуре, Шачи приготовила двадцать видов шака, и Господь, смеясь,
      восхвалял каждый: «кто ест ачьюта-шак, обретает любовь к Кришне; патала, вастука и кала дают общество вайшнавов
      из жизни в жизнь; салинча и хеленча хранят от болезней». В Панихати Рагхава Пандит так угостил Господа шаком,
      что, как говорит Джаянанда, «шак Рагхавы» славится там и поныне. Шак рос у каждого пруда: Гададхара в Пури сорвал
      для Господа шак, который «никто не сажал».
    en: >-
      Shak is leafy greens stewed or fried with oil and spices. All the biographies agree that the Lord loved shak more
      than anything. When He stayed at Shantipur after sannyasa, Shachi cooked twenty kinds, and the Lord, laughing,
      praised each: "whoever eats achyuta-shak gains love for Krishna; patala, vastuka and kala give the company of
      Vaishnavas birth after birth; salincha and helencha guard against illness." At Panihati Raghava Pandita fed the
      Lord such shak that, Jayananda says, "Raghava's shak" is famous there to this day. Shak grew by every pond:
      Gadadhara in Puri picked for the Lord greens that "no one had planted".
  recipe:
    ru: >-
      Виды (предварительно): *ва̄стука* (бетхо-шак, марь белая), *пат̣ала/па̄т̣* (листья джута), *ка̄ла* (?), *са̄лин̃ча̄*
      (?, водная зелень, возможно альтернантера), *хелен̃ча̄/хинче* (ипомея водяная? — у Амиш хинче-шак горький),
      *ачйута̄* (?). Реконструкция «шак бхаджа» по Амиш 1902, с. 194 и сл. и Пак-пранали (общее правило): зелень
      перебрать, вымыть, мелко нарезать; в горчичном масле обжарить пятеро пряностей или тмин, положить шак, посолить,
      томить, пока не уйдёт вода; горький шак (хинче, гиме) жарят с бади и щепотью сахара. Вастука — с имбирём; джутовый
      шак — с рисовой пастой (Амиш, № 156). Анахронизмов в основе нет.
    en: >-
      Species (provisional): vastuka (bathua, Chenopodium album), patala/pat (jute leaves), kala (?), salincha (?, a
      water green), helencha/hinche (?, bitter in Amish), achyuta (?). Reconstruction of "shak bhaja" after Amish 1902
      p. 194 ff. and Pak-pranali: pick over, wash and chop the greens; temper mustard oil with five spices or cumin, add
      the shak and salt, cook until the water is gone; bitter greens are fried with bari and a pinch of sugar.
  hagiography: ["ЧБ Антья 4.279–299", "ЧБ Антья 5.88–90", "ЧБ Антья 7.137–154", "ЧБ Антья 9.23", "ЧБ Антья 9.56",
                "ЧЧ Мадхья 3.45", "ЧЧ Мадхья 15.54", "ЧЧ Мадхья 15.210", "ЧЧ Антья 10.136",
                "Джаянанда, фр. 15, дв. 34–38"]
  sources: ["Амиш 1902, с. 194 и сл. (шак бхаджа; бетхо-шак, хинче, гиме, пат-шак)",
            "Sen 1922, с. 120 (⚠ по «Кадче»: бетхо-шак, «пробуждающий аппетит запахом»)"]
