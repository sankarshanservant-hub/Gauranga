- id: mc-bari
  title: {ru: "Бади — сушёные шарики из дала", en: "Bari — sun-dried lentil drops"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *пхула-бад̣и* — ЧЧ Мадхья 3.47, 15.212–213, Антья 10.137 (*бхр̣ш̣т̣а пхула-бад̣ӣ* — среди любимых Господом);
      *куш̣ма̄н̣д̣а-бад̣и* — Мадхья 3.45, 15.212 (*вр̣ддха куш̣ма̄н̣д̣а-бад̣ӣ*); *бад̣а̄-бад̣и-кад̣и* — Мадхья 4.70; бари у
      Джаянанды (фр. 10, дв. 20). В переводе ЧЧ — «нутовые хлопья», «горохового теста»; бади — из урада (маша). Рецепт —
      Амиш 1902, с. 351–354.
    en: >-
      phula-badi — CC Madhya 3.47, 15.212–213, Antya 10.137 (fried phula-badi among the Lord's favourites);
      kushmanda-badi — Madhya 3.45, 15.212; bada-badi-kadi — Madhya 4.70; bari in Jayananda (fr. 10 v. 20). The CC
      translation has "chickpea flakes"; bari are made of urad. Recipe — Amish 1902 pp. 351–354.
  text:
    ru: >-
      В ясные зимние дни хозяйки встают до рассвета, замачивают и трут на камне урад-дал, взбивают пасту руками до
      белой пышной пены и выкладывают её маленькими «шапочками» на ткань или веялку — сушить на солнце, на крыше или
      во дворе. Лёгкие пхула-бади («цветочные») с пеной и тяжёлые кушманда-бади с тёртой тыквой хранятся месяцами в
      горшке. Их обжаривают до хруста и кладут в шукту, в лау, к патолу — жареные бади Господь особенно любил.
    en: >-
      On clear winter days housewives rise before dawn, soak and grind urad dal on the stone, whip the paste by hand
      into a white fluffy foam and drop it in little "caps" onto a cloth or winnowing fan to dry in the sun, on the roof
      or in the courtyard. Light phula-bari ("flower" bari) and heavy kushmanda-bari with grated pumpkin keep for
      months in a pot. They are fried crisp and added to shukta, to lau, to patol — the Lord especially loved fried bari.
  recipe:
    ru: >-
      Реконструкция по Амиш 1902, с. 351–354 («кумра-бари»): восковую тыкву (≈ 3 сера) натереть и подсушить на веялке;
      цельный урад-маш просушить на солнце, расколоть на жернове, отвеять, накануне замочить, утром отмыть от шелухи
      (лучше в пруду — нужно много воды); растереть с тыквой, тмином, хингом, солью; долго взбивать горстями, пока
      паста не станет белой и лёгкой; выкладывать на смазанную ткань и сушить на солнце 2–3 дня, переворачивая. Пхула-
      бади — та же паста без тыквы, взбитая сильнее (Пак-пранали, с. 59: крепкие бади кладут в начале, пышные — в конце).
      Анахронизмов нет.
    en: >-
      Reconstruction after Amish 1902 pp. 351–354 (kumra-bari): grate an ash gourd and half-dry it on a winnowing fan;
      sun-dry whole urad, split it on the quern, winnow, soak overnight and wash off the husks in the morning (best in
      the pond); grind with the gourd, cumin, hing and salt; whip by the handful until white and light; drop onto an
      oiled cloth and sun-dry 2–3 days, turning. Phula-bari are the same paste without gourd, whipped harder. No
      anachronisms.
  hagiography: ["ЧЧ Мадхья 3.45–47", "ЧЧ Мадхья 4.70", "ЧЧ Мадхья 15.212–213", "ЧЧ Антья 10.137",
                "Джаянанда, фр. 10, дв. 20"]
  sources: ["Амиш 1902, с. 351–354 (кумра-бари)", "Пак-пранали, с. 59 (примечание о твёрдых и пышных бади), с. 67 (сладкие бади)"]
  images: []
  game: {model: "плетёная веялка или ткань с рядами белых шариков-бади, сохнущих на солнце", where: ["mishra-house/courtyard"],
         notes: "зимняя сцена; рядом — каменная тёрка шил-нора"}

- id: mc-mankachu
  title: {ru: "Манакачу — гигантское таро", en: "Mankachu — the giant taro"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      *ма̄накачу* — ЧЧ Мадхья 3.45; *куш̣ма̄н̣д̣а-ма̄нача̄ки* (тыква и манкачу кружочками, жареные) — Мадхья 3.47, 15.213
      (прим. 213 по «Анубхашье»); *ма̄на* (ростки/черенки ман-качу) — ЧБ Антья 4.466. Рецепт и свойства — Амиш 1902,
      с. 176–177 (по «Бхава-пракаше»).
    en: >-
      manakachu — CC Madhya 3.45; kushmanda-manachaki (pumpkin and mankachu rounds, fried) — Madhya 3.47, 15.213; mana
      — CB Antya 4.466. Recipe and properties — Amish 1902 pp. 176–177 (after Bhava-prakasha).
  text:
    ru: >-
      Ман-качу — исполинское таро с листьями-«зонтами» в рост человека; в землю уходит огромный клубень весом в
      несколько серов. Его чистят (сок щиплет руки), режут, варят или обжаривают кружками вместе с тыквой — так
      подавали Господу у Адвайты и у Сарвабхаумы. Сырое таро «кусает» горло, поэтому его едят в начале трапезы,
      с простым рисом и кислинкой; по аюрведе ман-качу «прохладен и лёгок».
    en: >-
      Man-kachu is a gigantic taro with umbrella-leaves as tall as a man; underground lies a huge tuber weighing
      several seers. It is peeled (the juice stings the hands), cut, boiled or fried in rounds together with pumpkin —
      that is how it was served to the Lord at Advaita's and Sarvabhauma's. Taro "bites" the throat, so it is eaten at
      the start of the meal with plain rice and something sour; in Ayurveda mankachu is "cooling and light".
  recipe:
    ru: >-
      Реконструкция по Амиш 1902, с. 176–177 («манкачу бхате»): ¼ сера ман-качу очистить, нарезать на 4–5 кусков,
      варить ~20 минут, откинуть и размять; смешать с пастой горчицы (1 тола), горчичным маслом (1 качча), солью,
      порошком сушёного зелёного манго или ягод кул (¼ толы) или лимонным соком. Есть первым, с простым рисом, не с
      рисом в гхи («щиплет рот»); если щиплет — помогает кислое или гур. ⚠ Чили в книге — заменить имбирём.
    en: >-
      Reconstruction after Amish 1902 pp. 176–177: peel ¼ seer of mankachu, cut into 4–5 pieces, boil ~20 minutes,
      drain and mash; mix with mustard paste, mustard oil, salt and dried green-mango or kul-berry powder or lemon
      juice. Eat first, with plain rice, not with ghee-rice ("it stings the mouth"); something sour or gur helps. ⚠ Use
      ginger instead of the book's chilli.
  hagiography: ["ЧЧ Мадхья 3.45", "ЧЧ Мадхья 3.47", "ЧЧ Мадхья 15.213", "ЧБ Антья 4.466"]
  sources: ["Амиш 1902, с. 176–177 (манкачу бхате; свойства по «Бхава-пракаше»)",
            "Пак-пранали, с. 116 (зимой ман-качу кубиками кладут в дал)"]
