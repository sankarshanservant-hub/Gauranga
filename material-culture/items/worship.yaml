- id: mc-muslims-in-the-lilas
  title: {ru: "Мусульмане в мире житий", en: "Muslims in the world of the hagiographies"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Суд над Харидасом и избиение на 22 базарах — ЧБ Ади 16.96–117; мусульманин-портной Шриваса — ЧЧ Ади 17.231; чиновник в
      Саптаграме — ЧЧ Антья 6.17–34; мусульманский правитель у орисской границы — ЧЧ Мадхья 16.158–200; Гопал прячется
      от набегов — ЧЧ Мадхья 18.24–47; Кази и киртан — ЧЧ Ади 17 (см. mc-kazi-nagar-kirtan).
    en: >-
      The trial of Haridasa and the beating in 22 markets — CB Adi 16.96–117; Shrivasa's Muslim tailor — CC Adi 17.231; an
      official at Saptagram — CC Antya 6.17–34; a Muslim ruler at the Orissa border — CC Madhya 16.158–200; Gopala
      hidden from raids — CC Madhya 18.24–47; the Kazi and kirtan — CC Adi 17 (see mc-kazi-nagar-kirtan).
  text:
    ru: >-
      Бенгалией правил мусульманский султан Гауды, и мусульмане — судьи, сборщики налогов, воины, ремесленники — были
      частью повседневной жизни. Жития говорят о них по-разному. Харидаса Тхакура, родившегося в мусульманской семье,
      судили за то, что он пел имя Хари, и избили на двадцати двух базарах, а он молился за своих мучителей.
      Мусульманин-портной шил одежду для Шриваса, и Господь открыл ему Свой облик. Мусульманский правитель у границы
      Ориссы, услышав о Махапрабху, плакал, кланялся Ему и сам перевёз Его через опасную реку, охраняя от разбойников десятью судами. На
      пути Господа такие встречи кончались одним: сердце смягчалось, и человек начинал повторять «Кришна!»
    en: >-
      Bengal was ruled by the Muslim Sultan of Gauda, and Muslims — judges, tax-collectors, soldiers, craftsmen — were
      part of daily life. The hagiographies speak of them in different ways. Haridasa Thakura, born in a Muslim
      family, was tried for chanting the name of Hari and beaten in twenty-two markets, and he prayed for his
      tormentors. A Muslim tailor sewed clothes for Shrivasa, and the Lord revealed His form to him. A Muslim ruler at
      the Orissa border, hearing of Mahaprabhu, wept, bowed to Him and personally ferried Him across a dangerous river,
      guarding Him from bandits with ten boats. On the Lord's path such meetings ended alike: the heart softened, and the person began
      to say "Krishna!"
  hagiography: ["ЧБ Ади 16.96–117", "ЧЧ Ади 17.231", "ЧЧ Антья 6.17–34", "ЧЧ Мадхья 16.158–200", "ЧЧ Мадхья 18.24–47"]
