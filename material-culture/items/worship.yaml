# Поклонение и вера (TOPICS, раздел 5). Исполнитель worship. Рубрика — rites.
# Взгляд гаудия-вайшнавский: Божество — Сам Господь; о других культах эпохи — спокойно и точно.

- id: mc-shodasha-upachara
  title: {ru: "Шестнадцать подношений (шодаша-упачара)", en: "The sixteen offerings (shodasha-upachara)"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Перечень подношений — ЧБ Мадхья 9.46–48 (*па̄дйа, аргхйа, а̄чаманӣ, гандха, пуш̣па, дхӯпа, прадӣпа, наиведйа,
      вастра… ш̣од̣аш́а упача̄ра*), ЧБ Мадхья 2.135–136, 6.105–110; ЧЧ Мадхья 4.59–66, 4.80. Полный порядок шестнадцати
      действий — по Ward 1863 (ок. 1810, цитата более раннего наблюдателя); у разных школ состав немного различен.
    en: >-
      The list of offerings — CB Madhya 9.46–48 (padya, arghya, achamani, gandha, pushpa, dhupa, pradipa, naivedya,
      vastra… shodasha upachara), CB Madhya 2.135–136, 6.105–110; CC Madhya 4.59–66, 4.80. The full order of the
      sixteen acts follows Ward 1863 (c. 1810, quoting an earlier observer); the exact list varies between schools.
  text:
    ru: >-
      Божеству служат как самому дорогому и почётному Гостю. Сначала предлагают сиденье-престол, затем воду для
      омовения стоп (падья), воду с цветами и рисом в ладонях (аргхья), воду для полоскания рта (ачамания); потом
      омовение, новые одежды и шнур, сандаловую пасту, цветы и листья туласи, благовония, лампаду, угощение
      (наиведья), снова воду и бетель, затем поклоны и обход. Так у Шриваса преданные поклонялись Самому Махапрабху
      «шестнадцатью подношениями» и снова и снова клали на Его стопы цветочки туласи, обмакнутые в сандал. Бедный
      преданный подносит хотя бы воду и лист туласи — и Господь это принимает.
    en: >-
      The Deity is served as the dearest and most honoured Guest. First a seat-throne is offered, then water to wash
      the feet (padya), water with flowers and rice in the palms (arghya), water to rinse the mouth (achamaniya);
      then the bath, new garments and sacred thread, sandal paste, flowers and tulasi leaves, incense, a lamp, food
      (naivedya), again water and betel, and finally bows and circumambulation. So at Shrivasa's house the devotees
      worshipped Mahaprabhu Himself with "the sixteen offerings", laying tulasi buds dipped in sandal on His feet
      again and again. A poor devotee offers at least water and a tulasi leaf — and the Lord accepts it.
  hagiography: ["ЧБ Мадхья 9.46–50", "ЧБ Мадхья 2.135–136", "ЧБ Мадхья 6.105–110", "ЧБ Антья 10.98",
                "ЧЧ Мадхья 4.59–66", "ЧЧ Мадхья 4.80", "ЧЧ Ади 3.103 (лист туласи и пригоршня воды)"]
  sources: ["Ward 1863, p. xliv–xlv (16 обрядов: престол, вода для стоп и рта, омовение из раковины под колокольчик,
            одежды, шнур, тилака, цветы, курение, лампада на гхи, еда, простирание, обход, прощание)"]
  images: []
  game: {model: "низкий престол (синхасана) с Божеством; перед ним медные чашечки для падьи, аргхьи, ачамании,
         поднос с цветами, сандалом, лампадой, курильницей", where: ["mishra-house/thakur-ghar"],
         notes: "мини-игра: подносить упачары в правильном порядке; Божество — Сам Господь"}
  todo: "сверить порядок 16 упачар по «Хари-бхакти-виласе» (XVI в., Гопала Бхатта) — если есть ОД-перевод"

- id: mc-abhisheka
  title: {ru: "Абхишека — омовение Господа", en: "Abhisheka — the bathing of the Lord"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Подробно — ЧЧ Мадхья 4.55–63 (установка Гопала Мадхавендрой Пури: 900 кувшинов, масло, панчагавья, панчамрита,
      гхи, вода из 100 сосудов, раковина) и ЧБ Мадхья 9.25–43 (вода Ганги, процеженная через ткань, с камфарой и
      «четырьмя равными» благовониями, мантры Пуруша-сукты, 108 кувшинов).
    en: >-
      In detail — CC Madhya 4.55–63 (Madhavendra Puri installs Gopala: 900 pots, oil, panchagavya, panchamrita, ghee,
      water from 100 vessels, a conch) and CB Madhya 9.25–43 (Ganga water strained through cloth, with camphor and the
      "four equal" fragrances, the Purusha-sukta mantras, 108 pots).
  text:
    ru: >-
      Торжественное омовение Божества — праздник для всей округи. Когда Мадхавендра Пури устанавливал Гопала, местные
      брахманы носили воду из пруда, процеживали её и наполнили девятьсот кувшинов; под барабаны и пение женщин
      Господа очистили, натёрли ароматным маслом, омыли панчагавьей и панчамритой (молоко, йогурт, гхи, мёд,
      сахар), затем водой из ста сосудов и под конец — ароматной водой из раковины. В Навадвипе преданные так же
      омыли Самого Махапрабху водой Ганги с камфарой, читая Пуруша-сукту; воду носили даже слуги Шриваса, и служанку
      Духкхи («Печальную») Господь назвал Сукхи — «Счастливой».
    en: >-
      A solemn bathing of the Deity is a festival for the whole neighbourhood. When Madhavendra Puri installed Gopala,
      the local brahmins carried water from the pond, strained it and filled nine hundred pots; to drums and the
      women's singing the Lord was cleansed, rubbed with fragrant oil, bathed with panchagavya and panchamrita (milk,
      yoghurt, ghee, honey, sugar), then with water from a hundred vessels, and last with scented water from a conch.
      In Navadvipa the devotees likewise bathed Mahaprabhu Himself with Ganga water and camphor, reciting the
      Purusha-sukta; even Shrivasa's servants carried water, and the Lord renamed the maid Duhkhi ("Sorrowful") as
      Sukhi — "Happy".
  hagiography: ["ЧЧ Мадхья 4.55–63", "ЧБ Мадхья 9.25–43"]
  sources: []
  images: []
  game: {model: "ряды глиняных кувшинов (гхата) с водой, белая раковина для омовения, медный таз (тамракунда),
         тонкая ткань для процеживания", where: ["navadvipa/shrivasa-house", "mishra-house/thakur-ghar"]}

- id: mc-arati
  title: {ru: "Арати — поклонение светом", en: "Arati — worship with light"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Арати в храмах и домах — ЧЧ Мадхья 3.58–59, 4.66, 4.80, 4.121–122, 4.209 (мангала-арати), 5.139; Антья 16.88
      (утреннее арати под раковины и колокола); лампада с пятью фитилями (*пан̃ча-ш́икха̄*) — ЧБ Мадхья 6.109; с семью
      — ЧБ Ади 15.168; арати панды Махапрабху в Пури — Лочан, Мадхья-кханда, ч. 22, ст. 210. Многорожковый медный
      светильник для арати — Mukharji 1888 (поздн.).
    en: >-
      Arati in temples and homes — CC Madhya 3.58–59, 4.66, 4.80, 4.121–122, 4.209 (mangala-arati), 5.139; Antya 16.88
      (morning arati with conches and bells); a five-flamed lamp (pancha-shikha) — CB Madhya 6.109; seven-wicked — CB
      Adi 15.168; a panda's arati to Mahaprabhu in Puri — Lochana, Madhya-khanda pt. 22 v. 210. The many-branched
      copper arati lamp — Mukharji 1888 (later).
  text:
    ru: >-
      После подношения пищи раздаётся звон колокольчика и голос раковины — начинается арати. Служитель медленно
      описывает кругами перед Господом лампаду с гхи — с одним, пятью или многими фитилями, — затем раковину с
      водой, ткань, цветы и опахало-чамару, а все стоят со сложенными ладонями и потом падают ниц с криками «Джая!
      Джая!». Самое раннее, в предрассветный час, — мангала-арати: странствуя, Махапрабху всю ночь пел у храма и
      уходил в путь лишь после него. В доме Адвайты в Шантипуре на вечернее арати звали всех, и лишь затем Кришну
      укладывали отдыхать.
    en: >-
      After the food offering a bell rings and the conch sounds — arati begins. The priest slowly circles a ghee lamp
      before the Lord — with one, five or many wicks — then a conch of water, a cloth, flowers and the chamara whisk,
      while everyone stands with joined palms and then falls prostrate crying "Jaya! Jaya!". The earliest, before
      dawn, is mangala-arati: on His travels Mahaprabhu sang all night by a temple and set out only after it. In
      Advaita's house at Shantipur everyone was called to the evening arati, and only then was Krishna laid down to
      rest.
  hagiography: ["ЧЧ Мадхья 3.58–59", "ЧЧ Мадхья 4.66", "ЧЧ Мадхья 4.80", "ЧЧ Мадхья 4.121–122", "ЧЧ Мадхья 4.209",
                "ЧЧ Мадхья 5.139", "ЧЧ Антья 16.88", "ЧБ Мадхья 6.109", "ЧБ Ади 15.168",
                "Лочан, Мадхья-кханда, ч. 22, ст. 210"]
  sources: ["Mukharji 1888, p. 186–187 (медный светильник с одним или многими рожками для арати)"]
  images: []
  game: {model: "медный светильник-панчапрадипа на ручке (5 чашечек с фитилями), раковина на подставке, колокольчик,
         чамара", where: ["mishra-house/thakur-ghar", "puri/jagannatha-temple"],
         notes: "звук: колокольчик + раковина + караталы; камфорный светильник — проверить для эпохи"}

- id: mc-chamara-chhatra
  title: {ru: "Чамара, опахало и зонт — царские знаки служения", en: "Chamara, fan and parasol — royal signs of service"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Зонт и чамары над младенцем-Господом — ЧБ Ади 2.227; зонт и чамара при маха-пракаше — ЧБ Мадхья 9.45, 22.19;
      опахало — ЧБ Мадхья 9.122, 20.16, Антья 9.49; чамары и зонты на празднике — ЧБ Антья 8.104, 8.110; веера из
      павлиньих перьев у Пундарики Видьянидхи — ЧБ Мадхья 7.62. Материал чамары (хвост яка) — HJ 1903.
    en: >-
      Parasol and chamaras over the infant Lord — CB Adi 2.227; parasol and chamara at the maha-prakasha — CB Madhya
      9.45, 22.19; a fan — CB Madhya 9.122, 20.16, Antya 9.49; chamaras and parasols at a festival — CB Antya 8.104,
      8.110; peacock-feather fans at Pundarika Vidyanidhi's — CB Madhya 7.62. The material of a chamara (yak tail) —
      HJ 1903.
  text:
    ru: >-
      Чамара — пушистое белое опахало из хвоста гималайского яка на резной рукояти, древний знак царского достоинства.
      Им медленно обмахивают Господа во время арати и праздников, рядом держат зонт-чхатру и машут веером из
      пальмового листа или павлиньих перьев. Когда Махапрабху явил Себя на троне у Шриваса, Нитьянанда держал над
      Ним зонт, а счастливцы обмахивали Его чамарой. Знатный Пундарика Видьянидхи сидел, словно принц, и двое слуг
      без устали махали над ним павлиньими веерами — но за этим роскошным обликом скрывался великий преданный.
    en: >-
      A chamara is a fluffy white whisk of Himalayan yak tail on a carved handle, an ancient sign of royal dignity.
      The Lord is slowly fanned with it during arati and festivals, a parasol (chhatra) is held beside, and fans of
      palm leaf or peacock feathers are waved. When Mahaprabhu revealed Himself on the throne at Shrivasa's house,
      Nityananda held a parasol over Him and the fortunate fanned Him with a chamara. The noble Pundarika Vidyanidhi
      sat like a prince while two servants tirelessly waved peacock fans over him — yet behind that luxurious look
      was a great devotee.
  hagiography: ["ЧБ Ади 2.227", "ЧБ Мадхья 9.45", "ЧБ Мадхья 22.19", "ЧБ Мадхья 9.122", "ЧБ Мадхья 20.16",
                "ЧБ Антья 9.49", "ЧБ Антья 8.104", "ЧБ Антья 8.110", "ЧБ Мадхья 7.62"]
  sources: ["HJ 1903, s.v. CHOWRY, p. 214–215 (чамара — хвост тибетского яка на украшенной рукояти, знак царской власти)"]
  images: []
  game: {model: "чамара: белый пучок хвоста яка ~45 см на рукояти 25 см (дерево/серебро); зонт-чхатра с бахромой;
         веер из пальмового листа", where: ["mishra-house/thakur-ghar", "navadvipa/shrivasa-house"]}

- id: mc-puja-copperware
  title: {ru: "Медная утварь для пуджи", en: "Copper vessels for worship"}
  rubric: rites
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      Названия и форма предметов — Mukharji 1888, p. 186–187 (Бенгалия XIX в., названия традиционные). Жития называют
      функции: вода для стоп и рта, раковина для омовения, сосуды с ароматной водой, металлический поднос (ЧЧ Мадхья
      3.42; 4.62, 4.65; ЧБ Мадхья 9.46–47). Медь как металл чистоты для обрядов — по Mukharji (канса для этого «не
      достаточно чиста»).
    en: >-
      The names and shapes — Mukharji 1888, p. 186–187 (19th-c. Bengal, traditional names). The hagiographies give the
      functions: water for feet and mouth, a conch for bathing, vessels of scented water, a metal tray (CC Madhya 3.42;
      4.62, 4.65; CB Madhya 9.46–47). Copper as the pure metal for ritual — per Mukharji (bell-metal is "not pure enough").
  text:
    ru: >-
      Для служения Божеству в Бенгалии брали медь: колокольную бронзу-кансу считали недостаточно чистой. На подносе
      у престола — коша, сосуд в форме лепестка бананового соцветия, и маленькая ложечка-кушӣ для воды; тамракунда —
      медный таз, где омывают Господа; блюдо и плетёная корзинка с ручкой (саджи) для цветов; чашечки для
      сандаловой пасты; светильник для арати. Эту утварь не украшали резьбой, потому что её каждый раз чистят
      землёй или золой, — она сияет чистотой.
    en: >-
      For serving the Deity Bengal used copper: bell-metal (kansa) was not thought pure enough. On the tray by the
      throne stand the kosha, a vessel shaped like a petal of the banana flower, with the little spoon kushi for
      water; the tamrakunda, a copper basin in which the Lord is bathed; a plate and a handled wicker basket (saji)
      for flowers; small cups for sandal paste; and a lamp for arati. This ware was not carved, because it is scoured
      with earth or ash each time — it shines with cleanliness.
  hagiography: ["ЧЧ Мадхья 3.42", "ЧЧ Мадхья 4.62", "ЧЧ Мадхья 4.65", "ЧБ Мадхья 9.46–47"]
  sources: ["Mukharji 1888, p. 186–187 (kosha, kushi, tamrakunda, pushpa-patra, saji, чашечки для сандала, светильник
            для арати; медь — для обрядов)", "Mukharji 1888, p. 157, 186 (канса не годится для обрядов)"]
  images: []
  game: {model: "коша ~20 см (вытянутая чаша-лепесток) с ложечкой кушӣ 12 см; тамракунда Ø 25–30 см; плетёная
         корзинка саджи с дугой-ручкой", where: ["mishra-house/thakur-ghar"]}
  todo: "найти изображение кошa-кушӣ в музеях (CC-лицензия)"

- id: mc-sandal-paste
  title: {ru: "Сандаловая паста (чандана)", en: "Sandal paste (chandana)"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Сандал и камфара для Гопала, растирание сандала, умащение Гопинатхи в Ремуне — ЧЧ Мадхья 4.106–168; сандал в
      упачарах — ЧБ Мадхья 9.43, 9.49, 6.106–107; ЧБ Ади 14.42; тилака из сандала — ЧБ Мадхья 7.63; царь кропит дорогу
      сандаловой водой — ЧЧ Мадхья 13.15–18 (см. mc-king-sweeper); красный сандал — ЧЧ Ади 17.39.
    en: >-
      Sandal and camphor for Gopala, grinding sandal, anointing Gopinatha at Remuna — CC Madhya 4.106–168; sandal in
      the upacharas — CB Madhya 9.43, 9.49, 6.106–107; CB Adi 14.42; sandal tilaka — CB Madhya 7.63; the king sprinkles
      the road with sandal water — CC Madhya 13.15–18 (see mc-king-sweeper); red sandal — CC Adi 17.39.
  text:
    ru: >-
      Сандаловую пасту получают, растирая душистое дерево с водой о плоский камень; в неё добавляют камфару, шафран,
      агуру. Ею умащают тело Господа, особенно в летний зной, в неё обмакивают листья туласи, ею рисуют тилаку.
      Однажды Гопал явился во сне Мадхавендре Пури и сказал, что Ему жарко: «Принеси Мне сандал из Нилачалы».
      Престарелый санньяси пешком прошёл через пол-Индии, собрал в Пури сандал и камфару, но в Ремуне Гопал
      велел: «Умасти Гопинатху — Мы едины, и Мне станет прохладно». Двое спутников Пури и двое храмовых слуг каждый
      день растирали сандал, пока он не кончился.
    en: >-
      Sandal paste is made by rubbing the fragrant wood with water on a flat stone; camphor, saffron and aguru are
      added. The Lord's body is anointed with it, especially in the summer heat; tulasi leaves are dipped in it and
      tilaka drawn with it. Once Gopala appeared in a dream to Madhavendra Puri and said He was hot: "Bring Me sandal
      from Nilachala." The aged sannyasi walked across half of India, gathered sandal and camphor in Puri, but at
      Remuna Gopala said: "Anoint Gopinatha — We are one, and I shall be cooled." Two of Puri's companions and two
      temple servants ground sandal every day until it was used up.
  hagiography: ["ЧЧ Мадхья 4.106–107", "ЧЧ Мадхья 4.150–168", "ЧБ Мадхья 9.43", "ЧБ Мадхья 9.49",
                "ЧБ Мадхья 6.106–107", "ЧБ Ади 14.42", "ЧБ Мадхья 7.63", "ЧЧ Ади 17.39"]
  sources: []
  images: []
  game: {model: "плоский камень для растирания сандала (~25×20 см), палочка сандалового дерева, медная чашечка с
         пастой", where: ["mishra-house/thakur-ghar", "remuna/gopinatha-temple"]}
  todo: "бенгальское название камня для сандала (чандан-пинди? шила?) — проверить по PD-словарю"

- id: mc-tulasi-in-worship
  title: {ru: "Туласи в поклонении: листья, манджари, туласи в горшке", en: "Tulasi in worship: leaves, buds, tulasi in a pot"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Манджари в сандале на стопы — ЧБ Мадхья 6.107, 9.49; лист туласи на каждом блюде — ЧЧ Мадхья 3.56; туласи и
      вода — ЧЧ Ади 3.103–107; Махапрабху сажает туласи в маленький горшок, её несут перед Ним во время счётной джапы
      и ставят рядом — ЧБ Антья 8.154–161. Двор с туласи-манчей — см. mc-tulasi-mancha.
    en: >-
      Buds in sandal placed on the feet — CB Madhya 6.107, 9.49; a tulasi leaf on every dish — CC Madhya 3.56; tulasi
      and water — CC Adi 3.103–107; Mahaprabhu plants tulasi in a small pot, which is carried before Him during His
      counted japa and set beside Him — CB Antya 8.154–161. The courtyard tulasi platform — see mc-tulasi-mancha.
  text:
    ru: >-
      Без туласи подношение Вишну не полно: лист кладут на каждое блюдо, а соцветия-манджари, обмакнутые в
      сандаловую пасту, — к стопам Господа. Писания говорят, что Кришна отдаёт Себя тому, кто поднесёт Ему хотя бы
      листок туласи и пригоршню воды. В Пури Махапрабху посадил туласи в маленький глиняный горшок и сказал: «Без
      туласи Мне не жить, как рыбе без воды». Когда Он шёл, повторяя святые имена, кто-нибудь нёс туласи перед Ним,
      а когда садился за джапу, горшок ставили рядом, и Господь неотрывно смотрел на неё.
    en: >-
      Without tulasi an offering to Vishnu is incomplete: a leaf is placed on each dish, and buds (manjari) dipped in
      sandal paste at the Lord's feet. Scripture says Krishna gives Himself to one who offers Him even a tulasi leaf
      and a handful of water. In Puri Mahaprabhu planted tulasi in a small clay pot and said, "Without tulasi I cannot
      live, like a fish without water." When He walked chanting the holy names someone carried tulasi before Him, and
      when He sat down to chant the pot was set beside Him, and the Lord gazed at her unceasingly.
  hagiography: ["ЧБ Антья 8.154–161", "ЧБ Мадхья 6.107", "ЧБ Мадхья 9.49", "ЧЧ Мадхья 3.56", "ЧЧ Ади 3.103–107"]
  sources: []
  images: []
  game: {model: "маленький глиняный горшок с кустиком туласи (высота горшка ~15 см); манджари — фиолетовые колоски",
         where: ["puri/gambhira", "mishra-house/thakur-ghar"], codex: hs_tulasi}

- id: mc-ganga-puja
  title: {ru: "Поклонение Ганге", en: "Worship of the Ganga"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Ганга-пуджа после омовения с гирляндой и сандалом — ЧБ Ади 8.127–156; кувшины с водой Ганги в доме — ЧБ Ади 8.132;
      поклонение Ганге после рождения ребёнка — ЧБ Ади 4.19; молитвы и поклоны Ганге — ЧБ Антья 1.108–116, Мадхья 1.134,
      28.17; Лочан, Мадхья-кханда, ч. 16, ст. 5; глина Ганги для тилаки — ЧЧ Антья 10 (см. mc-raghava-jhali).
    en: >-
      Ganga-puja after bathing with a garland and sandal — CB Adi 8.127–156; jars of Ganga water in the house — CB Adi
      8.132; worship of the Ganga after a birth — CB Adi 4.19; prayers and bows to the Ganga — CB Antya 1.108–116,
      Madhya 1.134, 28.17; Lochana, Madhya-khanda pt. 16 v. 5; Ganga clay for tilaka — CC Antya 10 (see
      mc-raghava-jhali).
  text:
    ru: >-
      Для вайшнава Ганга — не просто река: она течёт от стоп Вишну, и потому её вода очищает и пробуждает
      преданность. Омывшись, жители Навадвипы складывали ладони, черпали воду, пили глоток и бросали в поток
      цветы и гирлянды, касались лба сандалом. Маленький Нимай однажды потребовал у Шачи масло, плод амалаки для
      мытья волос, гирлянду и сандал «для Ганга-пуджи», а когда мать замешкалась, в гневе разбил горшки с водой
      Ганги, что стояли в доме. Уходя из Навадвипы принимать санньясу, Господь поклонился Ганге.
    en: >-
      For a Vaishnava the Ganga is not merely a river: she flows from Vishnu's feet, and so her water purifies and
      awakens devotion. After bathing, the people of Navadvipa joined their palms, scooped up water, sipped it and
      cast flowers and garlands into the stream, touching their foreheads with sandal. Little Nimai once demanded from
      Shachi oil, an amalaki fruit for washing His hair, a garland and sandal "for Ganga-puja", and when His mother
      delayed He angrily smashed the jars of Ganga water kept in the house. Leaving Navadvipa to take sannyasa, the
      Lord bowed down to the Ganga.
  hagiography: ["ЧБ Ади 8.127–156", "ЧБ Ади 4.19", "ЧБ Антья 1.108–116", "ЧБ Мадхья 1.134", "ЧБ Мадхья 28.17",
                "Лочан, Мадхья-кханда, ч. 16, ст. 5"]
  sources: []
  images: []
  game: {model: "гирлянда, плывущая по воде; глиняный кувшин с водой Ганги в доме", where: ["ganga-ghat"]}

- id: mc-jagannatha-darshan
  title: {ru: "Джаганнатха и даршан от колонны Гаруды", en: "Jagannatha and darshan from the Garuda pillar"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Первый даршан и обморок Господа, охранник, Сарвабхаума — ЧЧ Мадхья 6.3–14; даршан из-за колонны Гаруды — ЧЧ
      Мадхья 2.54, 6.63; Антья 14.23–30, 16.80–92 (привратник у Львиных врат, джагамохан, утреннее угощение
      «гопала-валлабха», арати, прасад и гирлянда от служителей); ЧБ Антья 2.488.
    en: >-
      The Lord's first darshan and swoon, the guard, Sarvabhauma — CC Madhya 6.3–14; darshan from behind the Garuda
      pillar — CC Madhya 2.54, 6.63; Antya 14.23–30, 16.80–92 (the doorkeeper at the Lion Gate, the jagamohana, the
      morning "gopala-vallabha" offering, arati, prasada and garland from the servants); CB Antya 2.488.
  text:
    ru: >-
      В Пури Господь Джаганнатха, «Владыка вселенной», вместе с Баладевой и Субхадрой принимает всех, кто приходит
      через Львиные врата. Впервые увидев Его, Махапрабху бросился обнять Божество и упал без чувств — охранник уже
      замахнулся, но Сарвабхаума остановил его. С тех пор Господь смотрел на Джаганнатху издали, из-за каменной
      колонны с изваянием Гаруды в зале джагамохана, и видел в Нём Кришну с флейтой у губ. Однажды орисская женщина,
      не видя Божества за толпой, залезла на колонну, поставив ногу на плечо Махапрабху; Говинда хотел её стащить, но
      Господь запретил: «Пусть смотрит — Мне бы такую жажду увидеть Господа!»
    en: >-
      In Puri Lord Jagannatha, "Lord of the universe", with Baladeva and Subhadra receives all who come through the
      Lion Gate. On first seeing Him, Mahaprabhu rushed to embrace the Deity and fell senseless — a guard had already
      raised his hand, but Sarvabhauma stopped him. From then on the Lord gazed at Jagannatha from a distance, from
      behind the stone pillar bearing Garuda's image in the jagamohana hall, and saw in Him Krishna with the flute at
      His lips. Once an Oriya woman, unable to see the Deity over the crowd, climbed the pillar, putting her foot on
      Mahaprabhu's shoulder; Govinda wanted to pull her down, but the Lord forbade it: "Let her look — would that I
      had such thirst to see the Lord!"
  hagiography: ["ЧЧ Мадхья 6.3–14", "ЧЧ Мадхья 2.54", "ЧЧ Мадхья 6.63", "ЧЧ Антья 14.23–30", "ЧЧ Антья 16.80–92",
                "ЧБ Антья 2.488"]
  sources: []
  images: []
  game: {model: "каменная колонна с фигурой Гаруды на капители в зале джагамохана; толпа паломников; вдали — алтарь
         трёх Божеств", where: ["puri/jagannatha-temple"],
         notes: "Джаганнатха — Сам Кришна; не изображать как «идола»"}

- id: mc-gopinatha-remuna
  title: {ru: "Гопинатха в Ремуне — «Кхира-чора»", en: "Gopinatha of Remuna — 'Khira-chora'"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: "ЧЧ Мадхья 4.112–168 (рассказ Махапрабху о Мадхавендре Пури); Мадхья 4.204–207; 16.30."
    en: "CC Madhya 4.112–168 (Mahaprabhu's account of Madhavendra Puri); Madhya 4.204–207; 16.30."
  text:
    ru: >-
      В деревне Ремуна в Ориссе стоит храм Гопинатхи. Каждый вечер Ему подносили сладкий рис в двенадцати глиняных
      горшочках — «амрита-кели», знаменитый «Гопинатха-кхир». Мадхавендра Пури лишь на миг пожелал отведать его,
      чтобы готовить такой же для своего Гопала, устыдился и ушёл петь святое имя на пустой базар. Ночью Гопинатха
      явился пуджари во сне: «Я спрятал горшочек под Своей накидкой для санньяси Мадхавендры». С тех пор Божество
      зовут «Кхира-чора» — «Укравший сладкий рис». Пури съел угощение, а черепки горшочка завязал в край одежды и
      каждый день съедал по кусочку. Махапрабху, проходя Ремуну, тоже получил двенадцать горшочков этого кхира.
    en: >-
      In the village of Remuna in Orissa stands the temple of Gopinatha. Every evening He was offered sweet rice in
      twelve clay pots — "amrita-keli", the famous "Gopinatha-khir". Madhavendra Puri for a moment wished to taste it,
      so as to cook the same for his Gopala, was ashamed and went to chant the holy name in the empty market. That
      night Gopinatha appeared to the priest in a dream: "I have hidden a pot under My cloth for the sannyasi
      Madhavendra." Ever since, the Deity is called "Khira-chora", "the one who stole the sweet rice". Puri ate the
      gift, tied the potsherds in the end of his cloth and ate a piece each day. Passing Remuna, Mahaprabhu too
      received twelve pots of this khir.
  hagiography: ["ЧЧ Мадхья 4.112–142", "ЧЧ Мадхья 4.154–168", "ЧЧ Мадхья 4.204–207", "ЧЧ Мадхья 16.30"]
  sources: []
  images: []
  game: {model: "двенадцать глиняных горшочков с кхиром перед алтарём; черепки, завязанные в край ткани",
         where: ["remuna/gopinatha-temple"]}

- id: mc-sakshi-gopala
  title: {ru: "Сакши-Гопал — Господь-свидетель", en: "Sakshi-Gopala — the Lord as witness"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: "ЧЧ Мадхья 5.10–125 и далее (рассказ Нитьянанды по пути в Пури); посещение Махапрабху — ЧЧ Мадхья 5."
    en: "CC Madhya 5.10–125 ff. (Nityananda's account on the way to Puri); Mahaprabhu's visit — CC Madhya 5."
  text:
    ru: >-
      Старый богатый брахман во Вриндаване пообещал отдать дочь юному бедному спутнику, а дома родня заставила его
      отречься от слова. Юноша вернулся во Вриндаван и упросил Гопала стать свидетелем. Господь пошёл за ним пешком
      через всю Индию с условием: не оборачиваться — Его шаги будут слышны по звону ножных колокольчиков; в пути
      брахман каждый день подносил Ему варёный рис. У родной деревни юноша обернулся — и Гопал, улыбаясь, остался
      там навсегда; перед всеми Он подтвердил обещание. Позже царь Ориссы Пурушоттама перенёс Сакши-Гопала в Каттак.
    en: >-
      An old rich brahmin in Vrindavana promised his daughter to his young, poor companion, but at home his relatives
      made him go back on his word. The youth returned to Vrindavana and begged Gopala to be his witness. The Lord
      walked after him across India on one condition: not to look back — His steps would be heard by the jingling of
      His ankle bells; on the way the brahmin offered Him cooked rice every day. Near his home village the youth
      looked back — and Gopala, smiling, remained there for ever; before everyone He confirmed the promise. Later
      King Purushottama of Orissa brought Sakshi-Gopala to Cuttack.
  hagiography: ["ЧЧ Мадхья 5.10–125"]
  sources: []
  images: []
  game: {model: "звон ножных колокольчиков (нупура) — звуковой эффект; Божество Гопала в храме", where: ["puri/road"]}
  todo: "где Сакши-Гопал при жизни Махапрабху — Каттак (по ЧЧ); нынешний Сатьявади — позднее перенесение? проверить"

- id: mc-chandi-worship
  title: {ru: "Мангала-Чанди и ночные песни", en: "Mangala-Chandi and the night-long songs"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Ади 2.64 (*ман̇гала-чан̣д̣ӣра гӣте каре джа̄гаран̣е*), Антья 4.413; ЧБ Ади 12.187; ЧБ Мадхья 13.165–171 (Джагай
      и Мадхай); разбойники и Чанди — ЧБ Антья 5.538–568, 663; Чанди-мандапа во дворе Мукунды Санджая — ЧБ Ади 10.40,
      12.91, 15.7, Мадхья 1.126. Поэма Мукундарамы «Чанди-мангал» — конец XVI в. (позже Господа); почитание без образа,
      перед чашей с водой Ганги, и обеты женщин о детях — Ward 1863 (поздн.).
    en: >-
      CB Adi 2.64 (mangala-chandira gite kare jagarane), Antya 4.413; CB Adi 12.187; CB Madhya 13.165–171 (Jagai and
      Madhai); robbers and Chandi — CB Antya 5.538–568, 663; the Chandi-mandapa in Mukunda Sanjaya's courtyard — CB Adi
      10.40, 12.91, 15.7, Madhya 1.126. Mukundarama's poem "Chandi-mangal" dates to the late 16th c. (after the Lord);
      worship without an image, before a cup of Ganga water, and women's vows for their children — Ward 1863 (later).
  text:
    ru: >-
      Вриндаван Дас говорит, что до Махапрабху вся «религия» Навадвипы сводилась к ночным бдениям с песнями о
      Мангала-Чанди — богине, у которой просили богатства, здоровья детей и удачи. Женщины давали ей обеты; в
      богатых дворах стояла Чанди-мандапа — открытый навес для праздника богини, и в такой мандапе у Мукунды Санджая
      юный Нимай Пандит вёл Свою школу. Пьяные Джагай и Мадхай просили Нимая «спеть песни Мангала-Чанди», а
      разбойники приписывали ей свою удачу. Вайшнавы относятся к богине с почтением как к служанке Господа, но
      поклоняются ей не ради мирских благ: просить у неё богатства — значит упускать самого Кришну.
    en: >-
      Vrindavana Dasa says that before Mahaprabhu the whole "religion" of Navadvipa came down to night-long vigils
      with songs of Mangala-Chandi, a goddess asked for wealth, children's health and luck. Women made vows to her;
      wealthy courtyards had a Chandi-mandapa — an open pavilion for the goddess's festival — and in such a mandapa at
      Mukunda Sanjaya's the young Nimai Pandita kept His school. The drunken Jagai and Madhai asked Nimai to "sing the
      songs of Mangala-Chandi", and robbers credited her with their luck. Vaishnavas respect the goddess as the Lord's
      servant, but do not worship her for worldly gain: to ask her for wealth is to miss Krishna Himself.
  hagiography: ["ЧБ Ади 2.64", "ЧБ Антья 4.413", "ЧБ Ади 12.187", "ЧБ Мадхья 13.165–171", "ЧБ Антья 5.538–568",
                "ЧБ Ади 10.40", "ЧБ Ади 12.91", "ЧБ Ади 15.7", "ЧБ Мадхья 1.126"]
  sources: ["Ward 1863, p. 87 (Чанди почитают перед металлической чашей с водой Ганги; обеты женщин о выздоровлении
            детей; поэма Кавиканканы «Чанди»)"]
  images: []
  game: {model: "Чанди-мандапа: открытый навес на столбах с глиняным помостом во дворе богатого дома",
         where: ["navadvipa/mukunda-sanjaya-house"], notes: "школа Нимая проходит в Чанди-мандапе"}

- id: mc-manasa-vishahari
  title: {ru: "Вишахари (Манаса) — богиня змей", en: "Vishahari (Manasa) — the snake goddess"}
  rubric: rites
  era_evidence: epoch
  evidence_note:
    ru: >-
      Жития: ЧБ Ади 2.65 (*дамбха кари’ виш̣ахари пӯдже*), Антья 4.414, Ади 12.187. Свидетельство эпохи — поэмы о
      Манасе (Sen HBLL 1911, p. 252–253, 278: «Манаса-мангал» Виджаи Гупты — 1484 по Сену, по другим — 1494). Формы почитания (ветви
      молочая, кувшин с глиняными змеями, месяц шравана) — Ward 1863, p. 108–110 (ок. 1810); песня певца Манасы, отца
      Чандравати, XVI в. — см. pd-texts.md (Sen BR 1920).
    en: >-
      Hagiography: CB Adi 2.65 (damba kari' vishahari puje), Antya 4.414, Adi 12.187. Evidence of the epoch — the
      Manasa poems (Sen HBLL 1911, p. 252–253, 278: Vijaya Gupta's "Manasa-mangal" — 1484 per Sen, 1494 per others). Forms of worship
      (euphorbia branches, a pot with clay snakes, the month of Shravana) — Ward 1863, p. 108–110 (c. 1810); a Manasa
      singer, father of Chandravati, 16th c. — see pd-texts.md (Sen BR 1920).
  text:
    ru: >-
      В краю рек и болот, где кобра — частый гость, почитали Вишахари («Уносящую яд»), иначе Манасу, чтобы она
      уберегла семью от укуса змеи. Перед домами сажали ветви молочая, в сезон дождей выставляли кувшин с водой,
      обвитый глиняными змеями, и ночами пели длинные песни о купце Чанде, который не хотел ей поклоняться и потерял
      сыновей. Как раз в годы рождения Махапрабху в Бенгалии слагали поэмы о Манасе. Вриндаван Дас с горечью замечает,
      что Вишахари поклонялись «с великой помпой», а имени Хари почти не произносили.
    en: >-
      In a land of rivers and marshes, where the cobra is a frequent visitor, people worshipped Vishahari ("She who
      takes away poison"), also called Manasa, so that she would keep the family from snakebite. Euphorbia branches
      were planted before houses, in the rains a water pot entwined with clay snakes was set up, and long songs were
      sung at night about the merchant Chand, who would not worship her and lost his sons. Just in the years of
      Mahaprabhu's birth poems about Manasa were being composed in Bengal. Vrindavana Dasa notes with sorrow that Vishahari was
      worshipped "with great pomp" while the name of Hari was hardly spoken.
  hagiography: ["ЧБ Ади 2.65", "ЧБ Антья 4.414", "ЧБ Ади 12.187"]
  sources: ["Ward 1863, p. 108–110", "Sen HBLL 1911, p. 252–253 (ЧБ о гордости почитателей Манасы; змеи в низовьях Ганги), p. 278 (дата Виджаи Гупты)"]
  images: []
  game: {model: "глиняный кувшин-гхата с вылепленными змеями, ветка молочая у порога соседского дома",
         where: ["navadvipa/lane"]}
  todo: "дата Виджаи Гупты (1484/1494) — по современным изданиям"

- id: mc-bhavani-puja-items
  title: {ru: "Подношения Бхавани у двери Шриваса", en: "Offerings to Bhavani at Shrivasa's door"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Ади 17.37–46 (*бхава̄нӣ-пӯджа̄ра саба са̄магрӣ*: на банановом листе *од̣а-пхула*, *харидра̄, синдӯра, ракта-
      чандана, тан̣д̣ула*; *мадйа-бха̄н̣д̣а*); поклонение «вином и мясом» ради богатства — ЧБ Антья 4.415, 5.567–568.
      Ода-пхул = красный гибискус (бенг. джаба) — по словарям, проверить.
    en: >-
      CC Adi 17.37–46 (bhavani-pujara saba samagri: on a banana leaf an oda flower, turmeric, sindur, red sandal, rice;
      a wine pot); worship "with wine and meat" for wealth — CB Antya 4.415, 5.567–568. Oda flower = red hibiscus
      (Beng. jaba) — per dictionaries, to check.
  text:
    ru: >-
      Тантрическое поклонение богине (Бхавани, Дурге) требовало особых предметов, и все в Навадвипе их узнавали:
      алый цветок гибискуса, куркума, красный синдур, красный сандал и рис на банановом листе, а рядом — горшок вина.
      Завистливый брахман Гопала Чапал ночью обмазал место у двери Шриваса и разложил там всё это, чтобы опозорить
      вайшнава, певшего по ночам киртан. Утром Шривас с улыбкой позвал соседей: «Смотрите, вот как я поклоняюсь
      Бхавани!» Соседи возмутились, позвали подметальщика, и место очистили водой с коровьим навозом. Вриндаван Дас
      упоминает и тех, кто поклонялся «вином и мясом» ради богатства и рода, — вайшнавы к таким обрядам не прибегали.
    en: >-
      Tantric worship of the goddess (Bhavani, Durga) called for particular items, and everyone in Navadvipa knew
      them: a scarlet hibiscus flower, turmeric, red sindur, red sandal and rice on a banana leaf, and beside them a
      pot of wine. The envious brahmin Gopala Chapala smeared the ground by Shrivasa's door at night and laid all this
      out, to disgrace the Vaishnava who sang kirtan at night. In the morning Shrivasa smilingly called the
      neighbours: "Look, this is how I worship Bhavani!" The neighbours were indignant, called a sweeper, and the
      place was purified with water and cowdung. Vrindavana Dasa also mentions those who worshipped "with wine and
      meat" for wealth and offspring — Vaishnavas did not resort to such rites.
  hagiography: ["ЧЧ Ади 17.37–46", "ЧБ Антья 4.415", "ЧБ Антья 5.567–568"]
