- id: mc-kazi-nagar-kirtan
  title: {ru: "Кази, разбитая мриданга и шествие киртана", en: "The Kazi, the broken mridanga and the kirtan procession"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Ади 17.121–226 (подробный рассказ; отсылка к ЧБ Мадхья 23); «деревенское родство» Кази с Ниламбарой
      Чакраварти — ЧЧ Ади 17.148–150; лампады и факелы в каждом доме — ЧЧ Ади 17.134; благие предметы у порогов —
      ЧБ Мадхья 23.190, 23.251, 23.303.
    en: >-
      CC Adi 17.121–226 (a detailed account; referring to CB Madhya 23); the Kazi's "village kinship" with Nilambara
      Chakravarti — CC Adi 17.148–150; lamps and torches in every house — CC Adi 17.134; auspicious items at the
      doorsteps — CB Madhya 23.190, 23.251, 23.303.
  text:
    ru: >-
      Кази — мусульманский судья и наместник султана Гауды — правил Навадвипой. Когда по всему городу зазвучали
      мриданги и караталы, мусульмане пожаловались ему, и Чханд Кази, войдя в дом, где пели, разбил мридангу и
      запретил киртан под угрозой лишить касты и имущества. Тогда Махапрабху велел к вечеру зажечь лампады и факелы
      в каждом доме и повёл через весь город три группы киртана; у порогов стояли кувшины с водой, бананы, дурва и
      лампады на гхи. Испуганный Кази спрятался, но потом вышел, и Господь, выразив ему почтение, усадил его рядом.
      Кази напомнил, что по деревенскому обычаю называл деда Господа, Ниламбару Чакраварти, «дядей», — значит, Нимай
      ему как племянник, — и обещал, что никто в его роду не помешает киртану.
    en: >-
      The Kazi — a Muslim judge and governor for the Sultan of Gauda — ruled Navadvipa. When mridangas and
      karatalas sounded throughout the town, Muslims complained to him, and Chand Kazi, entering a house where people
      were singing, broke a mridanga and forbade kirtan on pain of loss of caste and property. Then Mahaprabhu had
      lamps and torches lit in every house by evening and led three kirtan parties through the whole town; at the
      doorsteps stood water pots, bananas, durva and ghee lamps. The frightened Kazi hid, but then came out, and the
      Lord, showing him respect, seated him beside Himself. The Kazi recalled that by village custom he had called
      the Lord's grandfather, Nilambara Chakravarti, "uncle" — so Nimai was as a nephew to him — and promised that
      no one of his line would hinder kirtan.
  hagiography: ["ЧЧ Ади 17.121–150", "ЧЧ Ади 17.174–226", "ЧБ Мадхья 23.190", "ЧБ Мадхья 23.251", "ЧБ Мадхья 23.303"]
