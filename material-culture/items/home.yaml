- id: mc-courtyard
  title: {ru: "Двор (ангина) и глиняный цоколь", en: "Courtyard (angina) and clay plinth"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "Двор как место жизни семьи — в житиях постоянно; материалы и разметка — реконструкция."
    en: "The courtyard as the family's living space appears constantly in the hagiographies; materials and layout are reconstructed."
  text:
    ru: >-
      Сердце дома — открытый двор, утоптанный и гладко обмазанный глиной. Здесь сушат зерно, работают, принимают
      гостей, здесь же малыш Нимай учился ходить и играл. Когда вора-«похитителя» обманули и Нимай вернулся, весь
      двор наполнился криками «Хари!»; однажды ночью Шачи увидела, что двор полон небожителей. Хижины поставлены на
      цоколь, чтобы в сезон дождей вода не заливала пол.
    en: >-
      The heart of the home is an open courtyard, trodden hard and smoothly plastered with clay. Grain is dried here,
      work is done here, guests are received here — and here little Nimai learned to walk and play. When the thieves
      were bewildered and Nimai came back, the whole courtyard rang with "Hari!"; one night Shachi saw the courtyard
      filled with heavenly beings. The huts stand on plinths so the rains do not flood the floors.
  hagiography: ["ЧБ Ади 4.77 (начал ходить и играть по всему двору)", "ЧБ Ади 4.126", "ЧЧ Ади 14.80",
                "Лочан, Ади-кханда, ч. 2, ст. 111"]
  sources: ["Day, Bengal Peasant Life (1874), с. 28 («uthan … indispensable to the house of every peasant»)",
            "Martin, Eastern India (1838), т. 3, с. 100 (усадьба-бари из отдельных хижин вокруг двора-ангана, огороженная)"]
  images: [{file: "material-culture/img/hodges-1786-farmyard-bengal-huts.jpg", license: "PD (Public Domain Mark 1.0)", author: "William Hodges (1744–1797).", url: "https://wellcomecollection.org/works/xrs5r8g9", note: "1 августа 1786 (London: J. Wells), мягкий лак с акватинтой, сепия.; Wellcome Collection — 26670i (Sierra b11845168; image V0050414)."},
           {file: "material-culture/img/tayler-1842-village-bengal-barber.jpg", license: "PD (Public Domain Mark 1.0)", author: "William Tayler (1808–1892), литограф O. Bouvier", url: "https://wellcomecollection.org/works/xdevqe2e", note: "1 февраля 1842 (London: T. McLean).; Wellcome Collection — 37172i (b11950006; image V0019798)."}]
  game: {model: "плоский глиняный двор ~12×10 м, светлый, чуть выше уровня дорожки; цоколи хижин по периметру",
         where: ["mishra-house/courtyard"]}

- id: mc-tulasi-mancha
  title: {ru: "Туласи-манча", en: "Tulasi platform (tulasi-mancha)"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Служение туласи (полив, обход, лист туласи в подношении) — в ЧБ и ЧЧ. Форма алтаря-манчи (глиняный постамент
      с нишей для лампады) — реконструкция по позднейшему обычаю.
    en: >-
      Service to tulasi (watering, circumambulation, tulasi leaf in the offering) is in CB and CC. The shape of the
      mancha (a clay pedestal with a niche for a lamp) is reconstructed from later custom.
  text:
    ru: >-
      Посреди вайшнавского двора на глиняном постаменте растёт туласи. Махапрабху в юности, совершив поклонение
      Вишну, поливал туласи, обходил вокруг неё и лишь потом садился обедать; Лакшмиприя постоянно служила туласи.
      Адвайта Ачарья призывал Господа, поднося Кришне листья и соцветия туласи с водой Ганги. Туласи — не просто
      растение: это вечная служанка Господа, без её листа подношение Вишну не полно.
    en: >-
      In the middle of a Vaishnava courtyard tulasi grows on a clay pedestal. As a youth Mahaprabhu, after worshipping
      Vishnu, watered tulasi, walked around her and only then sat down to eat; Lakshmipriya served tulasi constantly.
      Advaita Acharya called the Lord down by offering Krishna tulasi leaves and buds with Ganga water. Tulasi is not
      merely a plant: she is the Lord's eternal maidservant, and no offering to Vishnu is complete without her leaf.
  hagiography: ["ЧБ Ади 8.73", "ЧБ Ади 8.166", "ЧБ Ади 12.101", "ЧБ Ади 14.43", "ЧБ Ади 2.81",
                "ЧЧ Ади 3.104–107", "ЧЧ Ади 13.70", "ЧЧ Мадхья 3.56 (цветы туласи на каждом блюде)"]
  sources: []
  images: [{file: "material-culture/img/tulasi-mancha-gour-nitai-temple-tejpal-bankura.jpg", license: "CC-BY 4.0", author: "Amitabha Gupta / Wikimedia Commons, CC BY 4.0", url: "https://commons.wikimedia.org/wiki/File:Tulsi-Mancha-of-Gour-Nitai-Temple-Tejpal-Bankura.jpg", note: "; Wikimedia Commons; памятник под охраной ASI (храм Гаура-Нитай, Теджпал, округ Банкура)."}]
  game: {model: "глиняный побелённый постамент 70–90 см, квадратный, с нишей для лампады; куст туласи",
         where: ["mishra-house/courtyard"], codex: hs_tulasi,
         notes: "вечером — лампада в нише; рядом медный/глиняный кувшинчик для полива"}

- id: mc-thakur-ghar
  title: {ru: "Комната Божества и Шалаграма", en: "The Deity room and the Shalagrama"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "Шалаграма в доме Мишры — ЧЧ Ади 14.9; «дева-гриха» (комната Божества) — ЧБ Ади 14.41."
    en: "The Shalagrama in Mishra's house — CC Adi 14.9; the deva-griha (Deity room) — CB Adi 14.41."
  text:
    ru: >-
      В доме Мишры было своё Божество — Шри Дамодара-шалаграма-шила, в которой, как говорил Джаганнатха Мишра, всегда присутствует
      Сам Кришна. Когда в доме появились следы детских стоп со знаками Вишну, Мишра подумал, что это играет Кришна из
      шалаграмы. Для Божества отводили чистую комнату (дева-гриха): Лакшмиприя украшала её пол узорами, готовила
      сандаловую пасту, цветы, благовония, лампады и ароматную воду.
    en: >-
      Mishra's house had its own Deity — Shri Damodara Shalagrama-shila, in which, Jagannatha Mishra said, Krishna Himself is
      always present. When footprints with Vishnu's marks appeared in the house, Mishra thought it was Krishna of the
      Shalagrama at play. A clean room (deva-griha) was set apart for the Deity: Lakshmipriya decorated its floor with
      designs and prepared sandal paste, flowers, incense, lamps and scented water.
  hagiography: ["ЧБ Ади 5.12 (домашнее Божество — Шри Дамодара-шалаграма-шила; жареный рис на гхи для Него)", "ЧЧ Ади 14.9", "ЧБ Ади 14.41–42", "ЧБ Ади 5.20 (паломник носит Бала-Гопала и шалаграму на шее)"]
  sources: []
  images: [{file: "material-culture/img/belnos-1851-brahmin-worship-shalagram.jpg", license: "PD (Public Domain Mark 1.0)", author: "Sophie Charlotte Belnos (1795–1865), из альбома «The Sundhya, or the Daily Prayers of the Brahmins» (London: Day & Son, 1851; рисовано в Бенгалии).", url: "https://wellcomecollection.org/works/nuh7qmdb", note: "1851.; Wellcome Collection — 580425i (b15804252; image V0046126)."}]
  game: {model: "небольшая хижина или комната с низким деревянным престолом (синхасаной), медные сосуды, колокольчик",
         where: ["mishra-house/thakur-ghar"],
         notes: "Божество — Сам Господь, не «статуя/идол»; кликабельно только с почтительным текстом"}

- id: mc-alpana
  title: {ru: "Узоры на полу (алпана)", en: "Floor designs (alpana)"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Ади 14.41: Лакшми рисует в комнате Божества свастики, раковины и диски (свастика-мандали, шанкха-чакра).
      Название «алпана» и техника (рисовая паста) — по позднейшему обычаю, проверить.
    en: >-
      CB Adi 14.41: Lakshmi draws svastikas, conches and discs in the Deity room. The name "alpana" and the technique
      (rice paste) follow later custom — to be checked.
  text:
    ru: >-
      Женщины украшали обмазанный глиной пол благоприятными узорами. Вриндаван Дас рассказывает, что Лакшмиприя с
      радостью рисовала в комнате Божества свастики, раковины и диски — знаки Вишну. По живому бенгальскому обычаю
      такие узоры (алпана) пишут пальцем жидкой рисовой пастой: лотосы, лепестки, следы стоп Лакшми; рисуют к
      праздникам и обрядам, и узор живёт до следующей обмазки пола.
    en: >-
      Women adorned the clay-plastered floor with auspicious designs. Vrindavana Dasa tells that Lakshmipriya joyfully
      drew svastikas, conches and discs — Vishnu's emblems — in the Deity room. In living Bengali custom such designs
      (alpana) are painted with a finger in liquid rice paste: lotuses, petals, the footprints of Lakshmi; they are
      drawn for festivals and rites and last until the floor is plastered again.
  hagiography: ["ЧБ Ади 14.41"]
  sources: ["Sen, Folk-Literature of Bengal (1920), с. 74 (двор расписан алипаной к проводам купца — сказка)"]
  images: []
  game: {model: "декаль на полу: белые узоры (свастика, раковина, диск, лотос) у порога и в комнате Божества",
         where: ["mishra-house/thakur-ghar", "mishra-house/courtyard"], codex: hs_alpana}
  todo: "найти PD-описание алпаны (Shib Chunder Bose 1881? Ward?) и самое раннее упоминание слова"

- id: mc-clay-lamp
  title: {ru: "Глиняная лампада (прадипа)", en: "Clay oil lamp (pradipa)"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "Лампады в служении и на празднике — ЧБ, ЧЧ; форма глиняной чашечки — археология и этнография."
    en: "Lamps in worship and at festivals — CB, CC; the clay-saucer form — archaeology and ethnography."
  text:
    ru: >-
      Свет в доме — маленькая чашечка из обожжённой глины с маслом и хлопковым фитилём. Лампада — непременная часть
      поклонения: Лакшмиприя готовила для Вишну благовония и масляные лампадки. На свадьбе Махапрабху Его встречали
      лампадой с семью фитилями, а перед шествием киртана к дому Кази Господь велел зажечь лампады и факелы в
      каждом доме. Для Божества лучшее масло — гхи; в быту жгли горчичное и кунжутное.
    en: >-
      Light in the house is a small saucer of fired clay with oil and a cotton wick. A lamp is an indispensable part of
      worship: Lakshmipriya prepared incense and oil lamps for Vishnu. At Mahaprabhu's wedding He was greeted with a
      seven-wicked lamp, and before the kirtan procession to the Kazi's house the Lord had lamps and torches lit in every
      house. Ghee is the best fuel for the Deity's lamp; in daily use mustard and sesame oil were burned.
  hagiography: ["ЧБ Мадхья 6.109 (лампада с пятью фитилями)", "ЧБ Ади 14.42", "ЧБ Ади 15.168 (лампада с семью фитилями)", "ЧБ Ади 15.144, 15.183",
                "ЧЧ Ади 17.134"]
  sources: ["Sen 1911, с. 382 (глиняный светильник сохранил старое имя «прадип» при персидских названиях люстр)",
            "Sen 1911, с. 23 («Дак-вачана»: вечером зажигают светильник)",
            "Sen, Folk-Literature of Bengal (1920), с. 72 (светильники на гхи у богатых — сказки)"]
  images: [{file: "material-culture/img/devis-1797-bengal-potter-and-wares.jpg", license: "PD (Public Domain Mark 1.0)", author: "Arthur William Devis (1762–1822), гравёр John Wright", url: "https://wellcomecollection.org/works/ck4y7dp4", note: "ок. 1797 (по рисункам, сделанным в Бенгалии в 1790-е).; Wellcome Collection — 580109i (b15801093; image V0046114)."}]
