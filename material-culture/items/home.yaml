- id: mc-guest-reception
  title: {ru: "Приём гостя: омовение стоп и сиденье", en: "Receiving a guest: washing the feet, offering a seat"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 5.22–31 — подробный рассказ о приёме странствующего брахмана."
    en: "CB Adi 5.22–31 is a detailed account of receiving a wandering brahmin."
  text:
    ru: >-
      Гость в бенгальском доме — посланник Бога. Когда к дому подошёл странствующий брахман, Джаганнатха Мишра встал,
      поклонился, омыл ему стопы и предложил достойное сиденье, а потом спросил, откуда он. Паломник-вайшнав ел только
      то, что сам приготовил и поднёс своему Гопалу, поэтому Мишра велел вымыть кухню и приготовить для гостя лучшие
      продукты. Гостей сажали на низкую деревянную скамеечку (пиди) или на циновку.
    en: >-
      A guest in a Bengali home is a messenger of God. When a wandering brahmin came to the house, Jagannatha Mishra
      rose, bowed, washed his feet and offered him a proper seat, and only then asked where he came from. The pilgrim
      Vaishnava ate only what he himself had cooked and offered to his Gopala, so Mishra had the kitchen washed and the
      best provisions made ready for him. Guests sat on a low wooden stool (pidi) or on a mat.
  hagiography: ["ЧБ Ади 5.22–31", "ЧЧ Мадхья 3.40 (Адвайта омыл стопы Махапрабху)", "ЧБ Ади 17.83"]
  sources: []
  images: []
  game: {model: "латунный кувшин-гхати и широкая чаша для омовения стоп; пиди — доска 40×25 см на коротких ножках",
         where: ["mishra-house/courtyard"], codex: hs_stool}

- id: mc-pidi-mat
  title: {ru: "Пиди и циновки", en: "Pidi stool and mats"}
  rubric: home
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      В житиях — «сиденье» и «асана»; конкретные пиди и циновки (мадур, шитал-пати) — по этнографии; проверить. Мадур
      и шитал-пати описаны у Mukharji 1888 (шитал-пати — ремесло Силхета, родины семьи Мишры).
    en: >-
      The hagiographies speak of a 'seat' and 'asana'; the specific pidi and mats (madur, shital-pati) follow
      ethnography; to be checked. Madur and shital-pati are described by Mukharji 1888 (shital-pati is a Sylhet craft
      — Sylhet was the Mishra family's homeland).
  text:
    ru: >-
      Стульев и столов в бенгальском доме не было: сидели на полу. Для почёта и для трапезы ставили пиди — низкую
      доску-скамеечку на коротких ножках, — а на пол стелили циновки из тростника. На асану садились и для поклонения:
      гость-брахман, приготовив пищу, сел на асану, чтобы поднести её Кришне.
    en: >-
      A Bengali house had no chairs or tables: people sat on the floor. For honour and for meals a pidi was set out —
      a low plank stool on short legs — and reed mats were spread on the floor. One also sat on an asana for worship:
      the guest brahmin, having cooked, sat on an asana to offer the food to Krishna.
  hagiography: ["ЧБ Ади 5.24", "ЧБ Ади 5.31"]
  sources: ["Bose, The Hindoos as They Are (1881), с. 72 (деревянные pirays)",
            "Mukharji, Art-Manufactures of India (1888), с. 310–312 (мадур из осоки; шитал-пати — Силхет и Вост. Бенгалия)",
            "Hunter, Statistical Account of Bengal, т. 2 (1875), с. 240 (циновки, сундук, плетёные короба-петара)"]
  images: []
  game: {model: "пиди 40×25×8 см, тёмное дерево; циновка 180×90 см, тростник",
         where: ["mishra-house/courtyard", "mishra-house/kitchen"]}
  todo: "слова «пиди/мадур/шитал-пати» в текстах XV–XVI вв."

- id: mc-bed-cradle
  title: {ru: "Постель и детская колыбель", en: "Bed and cradle"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 4.32 (ш́айане — «в постельке»); Лочан, Ади-кханда, ч. 2, ст. 123 (шёлковое покрывало, тюфячок)."
    en: "CB Adi 4.32 (shayane — 'in bed'); Lochana, Adi-khanda pt. 2 v. 123 (a silk coverlet and a small mattress)."
  text:
    ru: >-
      Младенец спал рядом с матерью или в своей маленькой постельке. Вриндаван Дас рассказывает, как Нимай, услышав
      шаги Шачи, тут же забирался в постельку и начинал плакать, будто ничего не разбрасывал. Лочан Дас описывает, как
      Шачи стелила шёлковое покрывало, а поверх — тюфячок из тонкой ткани, ложилась на бок и кормила сына, напевая,
      что вот-вот отец принесёт сгущённого молока и бананов.
    en: >-
      The baby slept beside his mother or in his own little bed. Vrindavana Dasa tells how Nimai, hearing Shachi's
      steps, would climb straight into bed and start crying as if He had scattered nothing. Lochana Dasa describes
      Shachi spreading a silk coverlet with a mattress of fine cloth on it, lying on her side and nursing her son,
      singing that his father would soon bring thickened milk and bananas.
  hagiography: ["ЧБ Ади 4.30–33", "Лочан, Ади-кханда, ч. 2, ст. 121–124"]
  sources: ["Day 1874, с. 28–29 (в крестьянском доме кровати нет: циновка и стёганое одеяло на глиняном полу)",
            "Martin 1838, т. 3, с. xiii–xiv (кхатия — кровать из жердей с верёвочной сеткой; Бихар)",
            "Hunter 1875, т. 2, с. 240 (дощатая лежанка takhtposh у зажиточных)"]
  images: []
  game: {model: "низкая лежанка на полу: тюфяк, покрывало; рядом — подвесная люлька? (не подтверждено)",
         where: ["mishra-house/main-hut", "mishra-house/sutika-ghar"]}
