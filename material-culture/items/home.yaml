- id: mc-chala-hut
  title: {ru: "Дом-чала", en: "The chala hut"}
  rubric: home
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      Жития говорят только о «доме» (гхара) и отдельных комнатах; облик хижины восстанавливается по терракотовым
      храмам XVII в., повторяющим соломенную кровлю, и по этнографии XIX в. Соломенная кровля на бамбуковых столбах
      засвидетельствована поэтами XVI в. (Мукундарам, Чандравати — по Сену, 1911/1920); изогнутый конёк — Martin 1838.
    en: >-
      The hagiographies mention only the "house" (ghara) and separate rooms; the look of the hut is reconstructed from
      17th-c. terracotta temples that copy thatched roofs and from 19th-c. ethnography. Thatch on bamboo posts is
      attested by 16th-c. poets (Mukundaram, Chandravati — via Sen 1911/1920); the curved ridge — Martin 1838.
  text:
    ru: >-
      Бенгальский дом — не одно здание, а несколько хижин вокруг общего двора. Каждая стоит на поднятом глиняном
      цоколе, стены из утрамбованной глины или плетёного бамбука, обмазанного глиной, кровля — толстая солома на
      бамбуковом каркасе. Скаты кровли выгнуты, а края опущены к углам, чтобы муссонный ливень скатывался быстро:
      двускатная хижина называется до-чала, четырёхскатная — чар-чала, с надстройкой — ат-чала. В доме Мишры, по Лочану
      Дасу, у Джаганнатхи и Шачи были отдельные комнаты.
    en: >-
      A Bengali home is not one building but several huts round a shared courtyard. Each stands on a raised clay
      plinth, with walls of rammed clay or clay-daubed bamboo wattle and a thick thatch on a bamboo frame. The roof
      slopes are curved and the eaves droop to the corners so that monsoon rain runs off quickly: a two-slope hut is a
      do-chala, a four-slope one a char-chala, one with a second tier an at-chala. In Mishra's house, according to
      Lochana Dasa, Jagannatha and Shachi had separate rooms.
  hagiography: ["Лочан, Ади-кханда, ч. 2, ст. 126 (Джаганнатха в одной комнате, Шачи — в другой)",
                "ЧБ Ади 4.100–101 (Нимай забирается в соседские дома)"]
  sources: ["Терракотовые храмы Бишнупура: Шьям-рай (1643), Джор-бангла (1655) — повторяют кровлю чала (проверить даты по изданию)",
            "см. research/pd-texts.md (Hunter 1875, Risley 1891 — описания жилищ)",
            "Sen, History of Bengali Language and Literature (1911), с. 295 (соломенные хижины и кирпичные молельни), 301 (хижина Пхуллары у Мукундарама, ок. 1590-х) — XVI в.",
            "Sen, Bengali Ramayanas (1920), с. 187–188 (Чандравати, XVI в.: соломенная кровля на бамбуковых столбах)",
            "Martin, Eastern India (1838), т. 3, с. 100–101 (кровля «бангла» с изогнутым коньком; четырёхскатная chautarka) — ок. 1810",
            "Day, Bengal Peasant Life (1874), гл. V, с. 28–31 (bara ghar: толстые глиняные стены, солома больше локтя, цоколь до 5 футов)",
            "Kennedy, The Chaitanya Movement (1925), с. 88–89; Ward (1863), с. 178 — храм джор-бангла как две хижины"]
  images: [{file: "material-culture/img/hodges-1786-farmyard-bengal-huts.jpg", license: "PD (Public Domain Mark 1.0)", author: "William Hodges (1744–1797).", url: "https://wellcomecollection.org/works/xrs5r8g9", note: "1 августа 1786 (London: J. Wells), мягкий лак с акватинтой, сепия.; Wellcome Collection — 26670i (Sierra b11845168; image V0050414)."},
           {file: "material-culture/img/bengal-thatched-huts-dog-etching.jpg", license: "PD (Public Domain Mark 1.0)", author: "неизвестен (подписи по-французски; вероятно, из французского издания Сольвинса «Les Hindoûs», 1808–1812, или естественно-исторической серии).", url: "https://wellcomecollection.org/works/kmqst6k6", note: "нач. XIX в. (в каталоге без даты).; Wellcome Collection — 42184i (Sierra b12000036; image V0022885)."},
           {file: "material-culture/img/solvyns-1799-man-outside-hut.jpg", license: "PD (Public Domain Mark 1.0)", author: "François Balthazar Solvyns (1760–1824).", url: "https://wellcomecollection.org/works/kh93xg86", note: "1799 (Калькутта, серия «A Collection of Two Hundred and Fifty Coloured Etchings…»).; Wellcome Collection — 30574i (Sierra b11884149; image V0050381EL)."},
