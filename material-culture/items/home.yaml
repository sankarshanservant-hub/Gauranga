         where: ["ganga-ghat", "mishra-house/pond"], codex: hs_pond}
  todo: "были ли гхаты Навадвипы ок. 1500 г. кирпичными? (Хантер, Нади)"

- id: mc-cowdung-plaster
  title: {ru: "Обмазка пола коровьим навозом", en: "Plastering floors with cowdung"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "ЧЧ Ади 17.44 — место очищают водой с коровьим навозом; повседневная обмазка полов — этнография."
    en: "CC Adi 17.44 — a place is purified with water mixed with cowdung; daily floor-plastering is ethnography."
  text:
    ru: >-
      Глиняный пол и двор регулярно обмазывают жидкой смесью глины и коровьего навоза: так пол становится ровным,
      не пылит, и по обычаю он считается очищенным. Когда у двери Шриваса нашли нечистые предметы, которые ночью
      подбросил брахман Гопала Чапал, позвали подметальщика: тот всё убрал и очистил место водой с коровьим навозом.
      Обмазывают по утрам и перед обрядами, после чего рисуют узоры.
    en: >-
      The clay floor and courtyard are regularly smeared with a thin mixture of clay and cowdung: the floor becomes
      even and dust-free, and by custom it is considered purified. When impure objects, left at night by the brahmin
      Gopala Chapala, were found at Shrivasa's door, a sweeper was called, who removed them and purified the spot with
      water and cowdung. Floors are plastered in the mornings and before rites, after which designs are drawn.
  hagiography: ["ЧЧ Ади 17.44"]
  sources: ["Ward, A View of the History… of the Hindoos (изд. 1863), с. 12, 153 (утром порог натирают коровьим навозом; нечистые места очищают навозом)"]
  images: []
  game: {model: "свежие полукруглые разводы на полу, тёмно-оливковые; горшок со смесью и тряпка",
         where: ["mishra-house/courtyard"], codex: hs_dung}

- id: mc-pot-heap
  title: {ru: "Место выброшенных горшков", en: "Heap of discarded pots"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Ади 14.73–75; Мурари 1.6 (беседа о чистом и нечистом); Лочан, Ади-кханда, ч. 2, ст. 202–203. Эпоха: Линсхотен
      (1596) — бенгальцы не варят дважды в одном глиняном горшке, а каждый раз берут новый: отсюда и груды битых
      горшков у домов.
    en: >-
      CC Adi 14.73–75; Murari 1.6 (discourse on pure and impure); Lochana, Adi-khanda pt. 2, vv. 202–203. Period:
      Linschoten (1596) — Bengalis never cook twice in one earthen pot but take a new one each time: hence the heaps
      of broken pots by the houses.
  text:
    ru: >-
      Глиняная кухонная посуда дешева, и оскверневший горшок не отмывают, а выбрасывают: у каждого дома была куча
      битых и брошенных горшков. Убегая от матери, маленький Нимай уселся прямо на такую кучу. Шачи велела Ему скорее
      омыться в Ганге, а Он ответил ей речью о том, что чистое и нечистое — лишь представление ума, ведь всё пронизано
      Господом. Мать удивилась — но всё-таки отправила Его мыться.
    en: >-
      Clay cookware was cheap, and a pot that had become impure was not washed but thrown away: every house had a heap
      of broken and discarded pots. Running from His mother, little Nimai sat right down on such a heap. Shachi told
      Him to go and bathe in the Ganga at once, and He answered with a talk on how pure and impure are only notions of
      the mind, since everything is pervaded by the Lord. His mother was amazed — but she still sent Him to bathe.
  hagiography: ["ЧЧ Ади 14.73–75", "Мурари 1, сарга 6 (ст. 9–16)", "Лочан, Ади-кханда, ч. 2, ст. 202–203"]
  sources: ["Day 1874, с. 31 (яма для мусора и золы за кухней)",
            "Hunter 1875, т. 2, с. 240–241 (глиняные горшки — ежемесячная статья расходов)",
            "Linschoten (1596), Hakluyt Society 1885, т. I, с. 94"]
  images: []
  game: {model: "куча черепков и целых закопчённых ханди за кухней, у ограды",
         where: ["mishra-house/backyard"], notes: "место эпизода-вопроса о чистоте (диалог)"}

- id: mc-cowshed
  title: {ru: "Коровник", en: "Cowshed"}
  rubric: home
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      Коровы как богатство и свадебный дар — ЧБ Ади 15.189; молочное в доме Шачи — ЧБ Ади 4.30–34. Собственный
      коровник Мишры прямо не упомянут.
    en: >-
      Cows as wealth and a wedding gift — CB Adi 15.189; dairy in Shachi's house — CB Adi 4.30–34. A cowshed of
      Mishra's own is not mentioned directly.
  text:
    ru: >-
      Корова в бенгальском доме — кормилица: молоко, простокваша, гхи, навоз для топлива и обмазки. Коров дарили на
      свадьбу вместе с землёй и утварью — так поступил отец невесты на свадьбе Махапрабху с Вишнуприей. Самому Мишре,
      бедному брахману, коровник приписывается по обычному устройству усадьбы: навес под соломой у края двора, ясли и
      стог рисовой соломы.
    en: >-
      In a Bengali home the cow is the provider: milk, curd, ghee, and dung for fuel and plastering. Cows were given at
      weddings together with land and household goods — as the bride's father did at Mahaprabhu's wedding to
      Vishnupriya. A cowshed for Mishra himself, a poor brahmin, is inferred from the usual homestead layout: a
      thatched shelter at the edge of the yard, a manger and a stack of rice straw.
  hagiography: ["ЧБ Ади 15.189", "ЧЧ Ади 17.153 (корова — мать, бык — отец)"]
  sources: ["Day 1874, с. 29–30 (коровник-гоал: глиняные кормушки, колья, дымный костёр из кизяка от комаров)"]
  images: [{file: "material-culture/img/hodges-1786-farmyard-bengal-huts.jpg", license: "PD (Public Domain Mark 1.0)", author: "William Hodges (1744–1797).", url: "https://wellcomecollection.org/works/xrs5r8g9", note: "1 августа 1786 (London: J. Wells), мягкий лак с акватинтой, сепия.; Wellcome Collection — 26670i (Sierra b11845168; image V0050414)."}]
