- id: mc-water-jar
  title: {ru: "Глиняный кувшин для воды (калаши)", en: "Clay water pot (kalashi)"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: "ЧЧ Ади 14.32 — Шачи объясняет: в глиняном кувшине легко носить воду."
    en: "CC Adi 14.32 — Shachi explains that water is easily carried in a clay pot."
  text:
    ru: >-
      Воду носили из Ганги и пруда в круглобоких глиняных кувшинах — на бедре или на голове. Этим кувшином Шачи-мата
      и вразумляла маленького Нимая, когда Он ел землю: пища — тоже земля, но земля, ставшая пищей, питает тело, как
      глина, ставшая кувшином, удерживает воду, а вода, вылитая на землю, просто впитается. В сердцах Нимай разбивал
      дома горшки и кувшины.
    en: >-
      Water was carried from the Ganga and the pond in round-bellied clay pots, on the hip or on the head. Mother
      Shachi used this very pot to reason with little Nimai when He ate earth: food is earth too, but earth that has
      become food nourishes, as clay that has become a pot holds water, while water poured on the ground just soaks
      away. In a temper Nimai would smash the pots and jars at home.
  hagiography: ["ЧЧ Ади 14.25–35", "ЧЧ Ади 14.43", "ЧЧ Ади 10.68 (разбитый железный кувшин Шридхара)"]
  sources: []
  images: [{file: "material-culture/img/devis-1797-bengal-potter-and-wares.jpg", license: "PD (Public Domain Mark 1.0)", author: "Arthur William Devis (1762–1822), гравёр John Wright", url: "https://wellcomecollection.org/works/ck4y7dp4", note: "ок. 1797 (по рисункам, сделанным в Бенгалии в 1790-е).; Wellcome Collection — 580109i (b15801093; image V0046114)."}]
  game: {model: "кувшин Ø 30 см, узкое горло, красно-коричневая обожжённая глина; ряд кувшинов у кухни",
         where: ["mishra-house/kitchen", "ganga-ghat"]}

- id: mc-pond-and-ghat
  title: {ru: "Пруд, гхат и Ганга", en: "Pond, ghat and the Ganga"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Омовения в Ганге — постоянно в житиях (дом Мишры у Ганги, ЧЧ Ади 13.57–58). Собственный пруд у дома Мишры в
      житиях не упомянут — реконструкция по обычному устройству бенгальской усадьбы.
    en: >-
      Bathing in the Ganga is constant in the hagiographies (Mishra's house was on the Ganga, CC Adi 13.57–58). A pond
      of Mishra's own is not mentioned — reconstructed from the usual layout of a Bengali homestead.
  text:
    ru: >-
      Джаганнатха Мишра поселился в Навадвипе на берегу Ганги, и вся жизнь семьи шла у её вод: туда спускались по
      ступеням-гхату омыться, туда мать впервые вынесла младенца, туда бегал купаться с друзьями маленький Нимай и там
      соседские девочки совершали обряды. Коснувшись нечистого, следовало сразу омыться в Ганге. В бенгальских
      усадьбах обычно был ещё и свой пруд для хозяйства.
    en: >-
      Jagannatha Mishra settled in Navadvipa on the bank of the Ganga, and the family's whole life went on beside its
      waters: one went down the steps of the ghat to bathe, the mother first carried her baby there, little Nimai ran
      there to swim with his friends, and the neighbourhood girls performed their rites there. After touching
      anything impure one bathed in the Ganga at once. Bengali homesteads usually also had a pond of their own.
  hagiography: ["ЧЧ Ади 13.57–58", "ЧЧ Ади 14.48–49", "ЧЧ Ади 14.74", "ЧБ Ади 4.18–19", "ЧБ Ади 4.137"]
  sources: ["Sen 1911, с. 21–22 («Дак-вачана»: на востоке — пруд, на западе — бамбук, на севере — сад, юг открыт)",
            "Sen 1911, с. 23 (вода — кувшином из пруда)",
            "Day 1874, с. 30 (пруд к востоку от двора; питьевая вода — из большого пруда)"]
  images: [{file: "material-culture/img/belnos-1851-brahmin-bathing-ganges.jpg", license: "PD (Public Domain Mark 1.0)", author: "S. C. Belnos («The Sundhya…»)", url: "https://wellcomecollection.org/works/vx4mta93", note: "1851.; Wellcome Collection — 587478i (b15874783)."}]
