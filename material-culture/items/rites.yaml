- id: mc-wedding-procession
  title: {ru: "Свадебное шествие: паланкин, лампады, фейерверк", en: "The wedding procession: palanquin, lamps, fireworks"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Ади 15.135–163 (*дола̄* от Буддхиманты Кхана; *сахасра дӣпа*; *на̄на̄-видха ба̄джи* — «разные огненные потехи»).
      Фейерверки в Бенгалии ок. 1508 г. — по тексту ЧБ (ок. 1540-х); ранняя история пороховых потех в Индии — проверить.
    en: >-
      CB Adi 15.135–163 (a dola from Buddhimanta Khan; sahasra dipa; nana-vidha baji — 'various fireworks'). Fireworks in
      Bengal c. 1508 — per the CB text (c. 1540s); the early history of gunpowder displays in India — to check.
  text:
    ru: >-
      К вечеру Буддхиманта Кхан привёз для Господа роскошный паланкин. Жених не пошёл прямо к невесте: при свете
      заката процессия обошла Навадвипу и двинулась вдоль Ганги под молодым месяцем. Люди зажгли тысячи лампад и
      факелов, пускали огненные потехи, дети плясали под музыку. У дома невесты Санатана Мишра снял Господа с паланкина
      и встретил Его омовением стоп, аргхьей, тканью и украшениями, а музыканты жениха и невесты принялись состязаться.
    en: >-
      Toward evening Buddhimanta Khan brought a splendid palanquin for the Lord. The groom did not go straight to the
      bride: in the sunset the procession went round Navadvipa and then along the Ganga under the young moon. People
      lit thousands of lamps and torches and set off fireworks, and children danced to the music. At the bride's house
      Sanatana Mishra helped the Lord down from the palanquin and received Him with foot-water, arghya, cloth and
      ornaments, while the musicians of both parties began to compete.
  hagiography: ["ЧБ Ади 15.135–166"]
  sources: []
  images: [{file: "material-culture/img/palki-old-palanquin-bankura-photo.jpg", license: "CC-BY-SA 3.0", author: "Jonoikobangali / Wikimedia Commons, CC BY-SA 3.0", url: "https://commons.wikimedia.org/wiki/File:PalkiBankura.JPG", note: "; Wikimedia Commons; предмет — семья Датта, Рамсагар, округ Банкура."}]
  game: {model: "паланкин-дола, факелы (масляные, на бамбуке), цепочка огней вдоль берега", where: ["navadvipa/ganga-bank"]}

- id: mc-wedding-rite
  title: {ru: "Свадебный обряд: семь обходов, взгляд, гирлянды", en: "The wedding rite: seven rounds, the first glance, garlands"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Ади 15.168–189 (*антах̣пат̣а* — занавес между женихом и невестой: в переводе «завязали глаза»; *сапта
      прадакш̣ин̣а*); Лочан, Ади-кханда, ч. 11, ст. 105–112, ч. 14, ст. 157; первая свадьба — ЧБ Ади 10.
    en: >-
      CB Adi 15.168–189 (antahpata — a cloth screen between groom and bride, rendered 'blindfolded' in the translation;
      sapta pradakshina); Lochana, Adi-khanda pt. 11 vv. 105–112, pt. 14 v. 157; the first wedding — CB Adi 10.
  text:
    ru: >-
      Мать невесты встретила жениха дурвой, рисом и лампадой с семью фитилями. Невесту в нарядах внесли на сиденье;
      между нею и женихом держали полотнище-занавес, и невеста семь раз обошла вокруг Господа. Потом занавес убрали —
      жених и невеста впервые взглянули друг на друга, их осыпали цветами, и они обменялись гирляндами. Отец невесты
      подарил молодым коров, землю, постель, слуг и служанок.
    en: >-
      The bride's mother welcomed the groom with durva, rice and a seven-wicked lamp. The bride, in all her finery, was
      carried in on a seat; a cloth screen was held between her and the groom, and the bride went round the Lord seven
      times. Then the screen was removed — bride and groom looked at each other for the first time, flowers were
      showered on them, and they exchanged garlands. The bride's father gave the couple cows, land, bedding, and men-
      and maidservants.
  hagiography: ["ЧБ Ади 15.166–189", "Лочан, Ади-кханда, ч. 11, ст. 105–112", "Лочан, Ади-кханда, ч. 14, ст. 157",
                "ЧБ Ади 10 (свадьба с Лакшмиприей)"]
  sources: []
  images: [{file: "material-culture/img/shankha-pola-bengali-bride-hands-photo.jpg", license: "CC-BY-SA 4.0", author: "AnkitaaDeb / Wikimedia Commons, CC BY-SA 4.0", url: "https://commons.wikimedia.org/wiki/File:Bride_wearing_Shankha_Pola_at_a_Bengali_Wedding.jpg", note: "; Wikimedia Commons."}]
