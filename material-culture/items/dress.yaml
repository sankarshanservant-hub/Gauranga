- id: mc-shankha-bangles
  title: {ru: "Раковинные браслеты (шакха) и железный браслет", en: "Conch-shell bangles (shankha) and the iron bangle"}
  rubric: dress
  era_evidence: epoch
  evidence_note:
    ru: >-
      Шакха и синдур как знак замужества — в «Манаса-мангале» (вдовы ломают раковинные браслеты) и других мангал-кавьях
      (Sen 1911, с. 240, 248, 262); мастера шанкхари в Навадвипе — ЧБ Ади 12.146–149; обряд надевания и железный
      браслет — Mukharji 1888, с. 99–100, 147–148 (XIX в.).
    en: >-
      Shankha and sindur as signs of marriage — in the Manasa-mangal (widows break their shell bangles) and other
      mangal-kavyas (Sen 1911, pp. 240, 248, 262); shankhari craftsmen in Navadvipa — CB Adi 12.146–149; the
      putting-on rite and the iron bangle — Mukharji 1888, pp. 99–100, 147–148 (19th c.).
  text:
    ru: >-
      Замужняя бенгалка носит на запястьях белые браслеты, выпиленные из морской раковины, и синдур в проборе; овдовев,
      она ломает браслеты и стирает синдур — так описывают вдов уже поэты «Манаса-мангала». Браслеты делали мастера-
      шанкхари, которые жили и в Навадвипе; в поэмах сам Шива, переодевшись продавцом браслетов, приходит к Парвати.
      По позднему обычаю, прежде чем надеть шакху, её чествуют синдуром, травой и рисом; на левом запястье замужней
      носят ещё и простой железный браслет.
    en: >-
      A married Bengali woman wears white bangles sawn from sea conch on her wrists and sindur in her hair parting;
      when widowed she breaks the bangles and wipes off the sindur — so the poets of the Manasa-mangal already describe
      widows. The bangles were made by shankhari craftsmen, who lived in Navadvipa too; in the poems Shiva himself,
      disguised as a bangle-seller, comes to Parvati. By later custom the shankha is honoured with sindur, grass and
      rice before it is put on, and a plain iron bangle is also worn on the married woman's left wrist.
  hagiography: ["ЧБ Ади 12.146–149"]
  sources: ["Sen 1911, с. 240, 248, 262", "Mukharji 1888, с. 99–100, 147–148, 281–282", "Bose 1881, с. 72, 75 (железный браслет)"]
  images: [{file: "material-culture/img/shankha-conch-bangles-kolkata-photo.jpg", license: "CC-BY 3.0", author: "Biswarup Ganguly / Wikimedia Commons, CC BY 3.0", url: "https://commons.wikimedia.org/wiki/File:Shankha_-_Conch_Bangles_-_Kolkata_2014-10-03_9326.JPG", note: "; Wikimedia Commons."},
           {file: "material-culture/img/shankhari-carving-conch-bracelet-photo.jpg", license: "CC-BY-SA 3.0", author: "Nasir Khan Saikat / Wikimedia Commons, CC BY-SA 3.0", url: "https://commons.wikimedia.org/wiki/File:Designing_the_conch_bracelet_(%E0%A6%B6%E0%A6%BE%E0%A6%81%E0%A6%96%E0%A6%BE_%E0%A6%A4%E0%A7%88%E0%A6%B0%E0%A7%80).jpg", note: "; Wikimedia Commons."},
           {file: "material-culture/img/shankha-pola-bengali-bride-hands-photo.jpg", license: "CC-BY-SA 4.0", author: "AnkitaaDeb / Wikimedia Commons, CC BY-SA 4.0", url: "https://commons.wikimedia.org/wiki/File:Bride_wearing_Shankha_Pola_at_a_Bengali_Wedding.jpg", note: "; Wikimedia Commons."}]
