# Рубрика «Одежда и облик» (dress): первая порция — то, что нужно для тестового уровня. Формат — README.md.

- id: mc-child-ornaments
  title: {ru: "Украшения младенца", en: "A baby's ornaments"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Ади 4.65 (колокольчики на пояске), 4.109–114 (воры и браслеты); ЧЧ Ади 13.112–113; Лочан, Ади-кханда, ч. 2,
      ст. 105, 136; ЧЧ Ади 14.78–79 (звон без колокольчиков).
    en: >-
      CB Adi 4.65 (bells on the waistband), 4.109–114 (thieves and bracelets); CC Adi 13.112–113; Lochana, Adi-khanda
      pt. 2 vv. 105, 136; CC Adi 14.78–79 (tinkling with no bells).
  text:
    ru: >-
      Даже в бедной семье ребёнка украшали: браслеты на запястьях и плечах, ожерелье, золотая цепочка или поясок с
      колокольчиками на талии, браслеты на ножках. Звон колокольчиков ползающего Нимая очаровывал всех; однажды
      родители услышали этот звон, хотя на Нём не было колокольчиков. Именно из-за украшений двое воров унесли
      малыша на плечах — и, сбившись с пути, принесли Его обратно к дому Мишры.
    en: >-
      Even in a poor family a child was adorned: bracelets on wrists and upper arms, a necklace, a gold chain or a
      waistband with little bells, anklets. The tinkling of crawling Nimai's bells charmed everyone; once His parents
      heard it though He wore no bells at all. It was for His ornaments that two thieves carried the boy off on their
      shoulders — and, losing their way, brought Him back to Mishra's house.
  hagiography: ["ЧБ Ади 4.65", "ЧБ Ади 4.108–131", "ЧЧ Ади 13.112–113", "ЧЧ Ади 14.38", "ЧЧ Ади 14.78–79",
                "Лочан, Ади-кханда, ч. 2, ст. 105, 136"]
  sources: []
  images: []
  game: {model: "тонкие золотые браслеты, поясок-цепочка с бубенчиками, ножные браслеты", where: ["mishra-house/courtyard"]}

- id: mc-sari
  title: {ru: "Сари", en: "The sari"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Расшитые сари среди даров — ЧЧ Ади 13.113; край сари — Лочан, Ади-кханда, ч. 3, ст. 271; ч. 4, ст. 359.
      Лиф-канчули — у поэтов от Виджая Гупты (1494) до XVIII в. (Sen 1911, с. 388–389). Белое сари с красной каймой —
      по позднейшим данным.
    en: >-
      Embroidered saris among the gifts — CC Adi 13.113; the end of the sari — Lochana, Adi-khanda pt. 3 v. 271; pt. 4
      v. 359. The kanchuli bodice — in poets from Vijay Gupta (1494) to the 18th c. (Sen 1911, pp. 388–389). The white
      sari with a red border follows later data.
  text:
    ru: >-
      Женщины носили сари — несшитое полотно в несколько локтей, обёрнутое вокруг тела и переброшенное через плечо;
      край (анчал) покрывал голову и служил всем: им прикрывали подношение, за него цеплялся капризный малыш. Знатные и
      нарядные женщины, по описаниям бенгальских поэтов начиная с Виджая Гупты (1494), носили под сари лиф-канчули и
      лёгкое покрывало-одну; привычная нынешняя сшитая блузка вошла в обиход гораздо позже. Сари хлопковые, у богатых —
      шёлковые и расшитые: такие привезла Сита Тхакурани.
    en: >-
      Women wore the sari — an unstitched length of several cubits wrapped round the body and thrown over the
      shoulder; its end (anchal) covered the head and served for everything: an offering was carried under it, a
      fretful child clung to it. Noble and festively dressed women, as Bengali poets describe from Vijay Gupta (1494)
      onwards, wore a kanchuli bodice under the sari and a light veil (odna); today's stitched blouse came into use much
      later. Saris were of cotton, and for the wealthy of silk and embroidered: such were the ones Sita Thakurani brought.
  hagiography: ["ЧЧ Ади 13.113", "Лочан, Ади-кханда, ч. 3, ст. 271", "Лочан, Ади-кханда, ч. 4, ст. 359"]
  images: [{file: "material-culture/img/kalighat-1890-yashoda-and-krishna-cma.jpg", license: "CC0 1.0", author: "художник Калигхата", url: "https://clevelandart.org/art/2003.159", note: "ок. 1890.; The Cleveland Museum of Art — 2003.159; 42 × 26 см."}]
  sources: ["Sen 1911, с. 388–389 (канчули, одна, нивибандха — XV–XVIII вв.)", "Bose 1881, с. 293 (сари 5 ярдов с цветной каймой — XIX в.)"]
  game: {model: "простое хлопковое сари (белое/небелёное, цветная кайма); у знатных — лиф-канчули; край на голове у замужних",
         where: ["mishra-house/courtyard"], codex: hs_sari}
  todo: "покрой канчули XV–XVI вв. (терракоты XVII в.?); носили ли его простые брахманки"

- id: mc-sindur-kunkuma
  title: {ru: "Синдур и кумкума", en: "Sindur and kunkuma"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: "Лочан, Ади-кханда, ч. 1, ст. 81 и сноска; ч. 10, ст. 85; ЧБ Ади 4.43; ЧЧ Ади 13.110, 13.114; ЧБ Ади 4.21."
    en: "Lochana, Adi-khanda pt. 1 v. 81 and note; pt. 10 v. 85; CB Adi 4.43; CC Adi 13.110, 13.114; CB Adi 4.21."
  text:
    ru: >-
      Красный порошок синдур в проборе и на лбу — знак замужней женщины. На наречении Нимая собрались благочестивые
      женщины, украшенные кумкумой; на празднике рождения почтенные жёны раздавали синдур, им же одаривали друг друга
      после обрядов. Лочан описывает праздничный убор: синдур на лбу у самых локонов, а под ним — капля сандала.
    en: >-
      Red sindur powder in the hair parting and on the forehead marks a married woman. At Nimai's naming pious women
      adorned with kunkuma gathered; at the birth festival the respectable wives handed out sindur, and it was
      exchanged as a gift after rites. Lochana describes festive attire: sindur on the forehead right at the hairline,
      and below it a dot of sandal paste.
  hagiography: ["Лочан, Ади-кханда, ч. 1, ст. 81", "Лочан, Ади-кханда, ч. 10, ст. 85", "ЧБ Ади 4.43", "ЧЧ Ади 13.110",
                "ЧЧ Ади 13.114", "ЧБ Ади 4.21"]
  sources: []
  images: []
  game: {model: "красная линия в проборе у замужних; деревянный/латунный ларчик для синдура", where: ["mishra-house/courtyard"]}

# --- Порция 2 ---

- id: mc-dhoti-uttariya
  title: {ru: "Дхоти и уттарья", en: "Dhoti and uttariya"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Жёлтое полотно Нимая — ЧБ Ади 12.243; свадебное *трикаччха* — ЧБ Ади 15.130; заштопанная одежда Шридхара — ЧБ Ади
      12.185–186; «платок» (уттарья) в дарах — ЧБ Ади 15.166.
    en: >-
      Nimai's yellow cloth — CB Adi 12.243; the wedding trikaccha — CB Adi 15.130; Shridhara's patched clothes — CB Adi
      12.185–186; a cloth (uttariya) among gifts — CB Adi 15.166.
  text:
    ru: >-
      Мужская одежда — два несшитых полотна: дхоти, обёрнутое вокруг пояса и подоткнутое между ног и сзади (у
      брахманов в торжественных случаях — в трёх местах, «трикаччха»), и уттарья — накидка на плечи. Юный учитель Нимай
      ходил по Навадвипе «одетый как царь», в жёлтой ткани, словно Кришна; бедняк Шридхар — в заплатанной одежде. По Виджаю
      Гупте (1494), знатный бенгалец носил три полотна: дхоти, тюрбан и покрывало. До XVI в. бенгальцы, по Сену, носили
      длинные умащённые волосы — длинные волосы были и у Нимая до санньясы.
    en: >-
      Men's dress is two unstitched cloths: the dhoti, wrapped round the waist and tucked between the legs and at the
      back (by brahmins on solemn occasions in three places, "trikaccha"), and the uttariya, a shawl over the
      shoulders. The young teacher Nimai walked through Navadvipa "dressed like a king", in yellow cloth, like Krishna;
      poor Shridhara wore patched clothes. According to Vijay Gupta (1494), a Bengali of rank wore three cloths: dhoti,
      turban and shawl. Until the 16th c., says Sen, Bengalis wore their hair long and scented — and Nimai had long hair
      until His sannyasa.
  hagiography: ["ЧБ Ади 12.243", "ЧБ Ади 15.130", "ЧБ Ади 12.185–186", "ЧБ Ади 15.166"]
  sources: ["Sen 1911, с. 387–389 (Виджай Гупта: дхоти, тюрбан, покрывало; длинные волосы до XVI в.)", "Hunter 1875, т. 2, с. 240 (дхоти, чадар, гамчха — XIX в.)", "Sen, Folk-Literature (1920), с. 100 (обычный костюм — дхоти и чадар)"]
  images: [{file: "material-culture/img/kalighat-1890-nitai-and-gaur-cma.jpg", license: "CC0 1.0", author: "художник-патуа Калигхата", url: "https://clevelandart.org/art/2003.154", note: "ок. 1890.; The Cleveland Museum of Art — 2003.154 (Gift of William E. Ward in memory of his wife, Evelyn Svec Ward). Гуммитемпера, графит, тушь, олово на бумаге; 45,4 × 27,8 см."},
           {file: "material-culture/img/calcutta-art-studio-chaitanya-devotees-kirtan-chromolitho.jpg", license: "PD (Public Domain Mark 1.0)", author: "Calcutta Art Studio (185 Bowbazar Street, Calcutta)", url: "https://wellcomecollection.org/works/cqkxvkhr", note: "ок. 1880-х (в каталоге без даты; студия работала с 1878).; Wellcome Collection — 26213i (b11840602; image V0045019)."}]
  game: {model: "белое/небелёное хлопковое дхоти до щиколоток, уттарья через левое плечо; у Нимая — жёлтое",
         where: ["mishra-house/courtyard", "navadvipa/market"]}
  todo: "форма тюрбана; цирюльник, остригший Господа перед санньясой (ЧЧ/ЧБ) — сверить"

- id: mc-tilak-shikha-thread
  title: {ru: "Тилака, шикха и шнур", en: "Tilaka, shikha and sacred thread"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: "Тилака — ЧБ Ади 12.245, 15.128; шнур — ЧБ Ади 8.14, 8.186; Лочан, Ади-кханда, ч. 1, ст. 85 (тилака из горочаны). Форма вайшнавской тилаки в эпоху — проверить."
    en: "Tilaka — CB Adi 12.245, 15.128; sacred thread — CB Adi 8.14, 8.186; Lochana, Adi-khanda pt. 1 v. 85 (gorochana tilaka). The form of Vaishnava tilaka in the period — to check."
  text:
    ru: >-
      Облик брахмана-вайшнава: на лбу тилака — знак, нанесённый глиной, сандалом или горочаной; на макушке оставлен пучок
      волос (шикха); через левое плечо — белый хлопковый шнур, полученный при упанаяне. У Нимая лоб украшала тилака,
      в руках были книги; на свадьбе Ему нарисовали полумесяц из сандала с агуру.
    en: >-
      The look of a Vaishnava brahmin: a tilaka on the forehead, drawn in clay, sandal paste or gorochana; a tuft of hair
      (shikha) left on the crown; a white cotton thread over the left shoulder, received at the upanayana. Nimai's
      forehead bore a tilaka and He carried books; at the wedding a crescent of sandal with aguru was drawn on Him.
  hagiography: ["ЧБ Мадхья 7.63 (*ӯрдхва-пун̣д̣ра* из сандала)", "ЧЧ Мадхья 18.14 (тилака глиной Радха-кунды)", "ЧБ Ади 12.245", "ЧБ Ади 15.128", "ЧБ Ади 8.14", "ЧБ Ади 8.186", "Лочан, Ади-кханда, ч. 1, ст. 85"]
  sources: []
  images: [{file: "material-culture/img/belnos-1851-tilaka-signs-of-brahmins.jpg", license: "PD (Public Domain Mark 1.0)", author: "Sophie Charlotte Belnos", url: "https://wellcomecollection.org/works/f2877av8", note: "1851 (London: Day & Son).; Wellcome Collection — 580611i (b1580611x; image V0046127)."},
           {file: "material-culture/img/company-brahmin-japa-beads.jpg", license: "PD (Public Domain Mark 1.0)", author: "неизвестный индийский художник", url: "https://wellcomecollection.org/works/k2zgf6ww", note: "XIX в. (1800–1899?).; Wellcome Collection — 576052i (b15760522; image V0045540)."}]
