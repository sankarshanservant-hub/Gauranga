# Рубрика «Жизнь» (исполнитель life): детство, время и меры, языки, огонь и ночь, промыслы, приметы, развлечения,
# порядок и война, запахи и цвета, письма и вести, мусульманский мир Бенгалии. Рубрики — town / home / rites.
# Формат — material-culture/README.md. Проверка: python3 material-culture/tools/check.py
