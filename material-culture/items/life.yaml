- id: mc-cow-and-purity
  title: {ru: "Корова, мясо и чистота: граница двух миров", en: "The cow, meat and purity: the line between two worlds"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Спор Господа с Кази о забое коров: «корова — мать, бык — отец» (ЧЧ Ади 17.153–171); мусульманский чиновник в
      наказание три дня готовит говядину в дурга-мандапе Рамачандры Кхана — ЧЧ Антья 3.149–161; Рупа и Санатана о
      себе: «общение с мясоедами-*млеччхами* сделало нас врагами коров и брахманической культуры» — ЧЧ Мадхья
      1.197; Харидас «из семьи мясоедов» — ЧЧ Антья 11.30; мусульманин «был безжалостен к коровам, брахманам и
      вайшнавам» — ЧЧ Мадхья 16.189. Общий обзор — mc-muslims-in-the-lilas; Кази — mc-kazi.
    en: >-
      The Lord's debate with the Kazi on cow-slaughter: 'the cow is mother, the bull father' (CC Adi 17.153–171); a
      Muslim official, as a punishment, cooks beef for three days in Ramachandra Khan's Durga-mandapa — CC Antya
      3.149–161; Rupa and Sanatana of themselves: 'association with meat-eating *mlecchas* made us enemies of cows and
      brahminical culture' — CC Madhya 1.197; Haridasa 'from a family of meat-eaters' — CC Antya 11.30; the Muslim
      who 'was merciless to cows, brahmins and Vaishnavas' — CC Madhya 16.189. General survey — mc-muslims-in-the-lilas;
      the Kazi — mc-kazi.
  text:
    ru: >-
      Главная бытовая граница между индусами и мусульманами Бенгалии проходила через кухню и коровник. Для индуса
      корова — мать, бык — отец: они кормят и пашут, и убить их — тяжкий грех; для мусульманина говядина была
      обычной пищей. Поэтому самым страшным осквернением индусского дома было приготовить в нём мясо коровы — именно
      так мусульманский чиновник наказал Рамачандру Кхана, оскорбившего Харидаса. Брахманы на службе султана, как Рупа
      и Санатана, считали себя «осквернёнными» общением с мясоедами. Но Махапрабху меряет человека не рождением:
      Харидас, выросший в мусульманской семье, — Намачарья, учитель святого имени, и Господь Сам, восклицая
      «Харибол!», засыпает его тело песком на берегу океана.
    en: >-
      The chief everyday line between Hindus and Muslims in Bengal ran through the kitchen and the cowshed. For a Hindu
      the cow is mother and the bull father: they feed and plough, and to kill them is a grave sin; for a Muslim beef
      was ordinary food. So the worst defilement of a Hindu house was to cook beef in it — which is exactly how a
      Muslim official punished Ramachandra Khan, who had offended Haridasa. Brahmins in the Sultan's service, like Rupa
      and Sanatana, considered themselves 'defiled' by the company of meat-eaters. But Mahaprabhu measures a person
      not by birth: Haridasa, raised in a Muslim family, is the Namacharya, teacher of the holy name, and the Lord
      Himself, crying 'Haribol!', pours sand over his body with His own hands on the ocean shore.
  hagiography: ["ЧЧ Ади 17.153–171", "ЧЧ Антья 3.149–161", "ЧЧ Мадхья 1.197", "ЧЧ Антья 11.30", "ЧЧ Мадхья 16.189",
                "ЧЧ Антья 11.59–69"]
