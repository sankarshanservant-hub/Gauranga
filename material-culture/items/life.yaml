- id: mc-lunar-calendar
  title: {ru: "Лунный календарь: титхи, пакша, месяцы", en: "The lunar calendar: tithi, paksha, months"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Даты житий — по лунным месяцам и фазам: явление в полнолуние пхалгуны (ЧЧ Ади 13.19–20, 13.89), зачатие в
      магху (13.80), санньяса — светлая половина магхи (ЧЧ Мадхья 1.16, 3.3, 7.4), Дола-ятра в конце пхалгуны,
      уход на Юг в начале вайшакхи (Мадхья 7.5–6), «в картику ещё холодно» (Мадхья 16.9), Макара-санкранти в магху
      (Мадхья 18.145), «в пауше приду» (Антья 2.42); Божества-покровители 12 месяцев (Мадхья 20.199–200); пост в
      экадаши (ЧЧ Ади 15.9–10). Титхи — 1/30 лунного месяца — Prinsep 1858, II, p. 151.
    en: >-
      The hagiographies date events by lunar months and phases: the appearance on the full moon of Phalguna (CC Adi
      13.19–20, 13.89), conception in Magha (13.80), sannyasa in the bright half of Magha (CC Madhya 1.16, 3.3, 7.4),
      Dola-yatra at the end of Phalguna, departure south at the start of Vaishakha (Madhya 7.5–6), 'Kartika is still
      cold' (Madhya 16.9), Makara-sankranti in Magha (Madhya 18.145), 'I shall come in Pausha' (Antya 2.42); the
      presiding Deities of the 12 months (Madhya 20.199–200); the Ekadashi fast (CC Adi 15.9–10). A tithi is 1/30
      of a lunar month — Prinsep 1858, II, p. 151.
  text:
    ru: >-
      Время года и праздники считали по луне. Лунный месяц делится на две половины-пакши — светлую (растущая луна,
      шукла) и тёмную (кришна), — а каждая пакша на пятнадцать лунных дней-титхи; одиннадцатый день каждой половины,
      экадаши, вайшнавы проводят без зерна, в памятовании о Господе. Двенадцать месяцев носят имена звёзд: вайшакха,
      джйештха, ашадха, шравана, бхадра, ашвина, картика, аграхаяна, пауша, магха, пхалгуна, чайтра — и у каждого
      свой Господь-покровитель, от Мадхавы в магху до Кешавы в аграхаяну. Так и говорят в житиях: «явился в
      полнолуние пхалгуны», «принял санньясу в светлую половину магхи», «приду в пауше».
    en: >-
      Seasons and festivals were reckoned by the moon. A lunar month falls into two halves, pakshas — the bright
      (waxing, shukla) and the dark (krishna) — and each paksha into fifteen lunar days, tithis; the eleventh day of
      each half, Ekadashi, Vaishnavas keep without grain, remembering the Lord. The twelve months bear the names of
      stars: Vaishakha, Jyeshtha, Ashadha, Shravana, Bhadra, Ashvina, Kartika, Agrahayana, Pausha, Magha, Phalguna,
      Chaitra — and each has its presiding Lord, from Madhava in Magha to Keshava in Agrahayana. So the
      hagiographies say: 'He appeared on the full moon of Phalguna', 'He took sannyasa in the bright half of Magha',
      'I shall come in Pausha'.
  hagiography: ["ЧЧ Ади 13.19–20", "ЧЧ Ади 13.80", "ЧЧ Ади 13.89", "ЧЧ Мадхья 1.16", "ЧЧ Мадхья 7.4–6",
                "ЧЧ Мадхья 16.9", "ЧЧ Мадхья 18.145", "ЧЧ Мадхья 20.199–200", "ЧЧ Антья 2.42", "ЧЧ Ади 15.9–10"]
  sources: ["J. Prinsep, Essays on Indian Antiquities… Useful Tables, 1858, vol. II, p. 151"]
  images: []
  game: {model: "UI-календарь: фаза луны + месяц; панджика (альманах) на пальмовых листах у астролога",
         where: ["mishra-house/thakur-ghar"], notes: "экадаши — в игре день без зерновых блюд"}
  todo: "Бенгальские названия месяцев (байшакх, джоиштхо…) и с какого месяца начинали год в Бенгалии XVI в."

- id: mc-shaka-era
  title: {ru: "Эра Шака: как считали годы", en: "The Shaka era: how years were counted"}
  rubric: rites
  era_evidence: epoch
  evidence_note:
    ru: >-
      Годы в житиях — только по Шаке: явление 1407 г. Шака (ЧЧ Ади 13.9, 13.89), уход 1455 г. (13.9), окончание ЧЧ —
      1537 г. Шака (ЧЧ Антья 20.158, дата спорна). Эра Шака начинается в 78 г. н. э. — Prinsep 1858, II, p. 154.
      Бенгальская «сан» (Бангабда) введена как фискальный год от восшествия Акбара (1556); мнение, что её ввёл
      Хуссейн-шах, Принсеп отвергает — p. 169. ⚠ Для 1486–1534 гг. — только Шака (и хиджра при дворе).
    en: >-
      Years in the hagiographies are given only in Shaka: the appearance in Shaka 1407 (CC Adi 13.9, 13.89), the
      departure in 1455 (13.9), the completion of CC in Shaka 1537 (CC Antya 20.158, date disputed). The Shaka era
      begins in AD 78 — Prinsep 1858, II, p. 154. The Bengali san (Bangabda) was introduced as a fiscal year from
      Akbar's accession (1556); the opinion that Husain Shah introduced it Prinsep rejects — p. 169. ⚠ For 1486–1534
      — Shaka only (and the Hijra at court).
  text:
    ru: >-
      Индусская Бенгалия считала годы по эре Шака, начавшейся в 78 году н. э., — прибавь к её году 78, и
      получишь год от Рождества Христова. Господь явился в 1407 году Шака (1486), а скрылся в 1455-м (1534). В
      гороскопах, дарственных и колофонах рукописей пишут год Шака, месяц и титхи. При мусульманском дворе Гауды
      счёт вели по хиджре, лунным годам от переселения Пророка; привычный нынче бенгальский год «сан» появился лишь
      при Акбаре, через двадцать с лишним лет после ухода Махапрабху.
    en: >-
      Hindu Bengal counted years by the Shaka era — add 78 and you get the year AD. The Lord appeared in Shaka 1407
      (1486) and withdrew in 1455 (1534). Horoscopes, deeds of gift and the colophons of manuscripts give the Shaka
      year, the month and the tithi. At the Muslim court of Gauda the count was by the Hijra, lunar years from the
      Prophet's emigration; the Bengali 'san' year familiar today appeared only under Akbar, over twenty years after
      Mahaprabhu's departure.
  hagiography: ["ЧЧ Ади 13.9", "ЧЧ Ади 13.89", "ЧЧ Антья 20.158"]
  sources: ["J. Prinsep, Essays on Indian Antiquities… Useful Tables, 1858, vol. II, p. 154, 169"]
  images: []
  game: {model: "колофон рукописи: «шакабда 1407»; бенгальские цифры", where: ["mishra-house/thakur-ghar"]}

- id: mc-length-distance
  title: {ru: "Меры длины и пути: локоть, пядь, крош, йоджана", en: "Measures of length and road: cubit, span, krosha, yojana"}
  rubric: town
  era_evidence: epoch
  evidence_note:
    ru: >-
      Жития: «рост и размах рук в четыре своих локтя» — признак маха-пуруши (ЧЧ Ади 3.42); «семь своих локтей» —
      Брахма о себе (ЧЧ Ади 5.72); два куска ткани «в одну пядь» (*витасти*) — ЧЧ Антья 6.299; гирлянда в 14 локтей
      — ЧЧ Антья 13.123; путь «в три кроши» — ЧЧ Мадхья 5.146. Система: 24 ангулы = 2 витасти = 1 хаста; 4 хасты =
      1 данда; 2000 данд = 1 крош (≈ 2½ мили); 4 кроша = 1 йоджана — Prinsep 1858, II, p. 122 (по санскритским
      трактатам; на деле кош колебался по областям — HJ 1903, s.v. COSS). Газ (ярд) — мусульманского ввода (Prinsep).
    en: >-
      Hagiographies: 'height and arm-span of four of one's own cubits' — a mark of the maha-purusha (CC Adi 3.42);
      'seven of my own cubits' — Brahma of himself (CC Adi 5.72); two pieces of cloth 'one span' (*vitasti*) each —
      CC Antya 6.299; a garland of 14 cubits — CC Antya 13.123; a road of 'three kroshas' — CC Madhya 5.146. The
      system: 24 angulas = 2 vitastis = 1 hasta; 4 hastas = 1 danda; 2000 dandas = 1 krosha (≈ 2½ miles); 4 kroshas = 1
      yojana — Prinsep 1858, II, p. 122 (after Sanskrit treatises; in practice the kos varied by region — HJ 1903,
      s.v. COSS). The gaz (yard) was a Muslim introduction (Prinsep).
  text:
    ru: >-
      Мерили телом. Ширина пальца — ангула, пядь от большого пальца до мизинца — витасти, локоть от локтевого сгиба до
      кончиков пальцев — хаста (≈ 45 см), четыре локтя — «посох»-данда. Ткань, верёвку, гирлянды, глубину воды под
      лодкой мерят локтями: в Пури Говинда приносит гирлянду Джаганнатхи «в четырнадцать локтей». Дорогу мерят крошами
      — изначально это расстояние, на которое слышен крик, около трёх-четырёх километров; четыре кроша — йоджана.
      Признак великой личности — рост, равный размаху рук, «в четыре своих локтя».
    en: >-
      People measured with the body. A finger's breadth is an angula, the span from thumb to little finger a vitasti,
      the forearm from elbow to fingertips a hasta (≈ 45 cm), four cubits a 'staff', danda. Cloth, rope, garlands and
      the depth of water under a boat are measured in cubits: in Puri Govinda brings a garland of Jagannatha 'fourteen
      cubits long'. Roads are measured in kroshas — originally the distance at which a shout can be heard, some three
      or four kilometres; four kroshas make a yojana. The mark of a great person is a height equal to the arm-span,
      'four of his own cubits'.
  hagiography: ["ЧЧ Ади 3.42", "ЧЧ Ади 5.72", "ЧЧ Антья 6.299", "ЧЧ Антья 13.123", "ЧЧ Мадхья 5.146"]
  sources: ["J. Prinsep, Essays on Indian Antiquities… Useful Tables, 1858, vol. II, p. 122",
            "Hobson-Jobson, 1903, s.v. COSS"]
  images: []
  game: {model: "мерная бамбуковая палка в 1 хасту с зарубками-ангулами; придорожный камень-верста? (нет данных)",
         where: ["navadvipa/lane"], notes: "игровые расстояния в крошах: Навадвипа — Шантипур ≈ 6–7 крош (проверить)"}
  todo: "Есть ли в житиях расстояния Навадвипа — Шантипур / Пури — Катак в крошах или йоджанах?"

- id: mc-weights-scales
  title: {ru: "Вес: рати, маша, тола, сер, ман", en: "Weight: rati, masha, tola, ser, man"}
  rubric: town
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      Жития: Рагхунатха даёт на служение «сто золотых монет и две толы золота» (ЧЧ Антья 6.153). Рати — семя *Abrus
      precatorius* (красное с чёрным пятнышком), древняя мера ювелиров; цепочка мер от «пылинки в солнечном луче»
      до маши — по Ману, HJ 1903, s.v. RUTTEE. Ряд рати → маша → тола → чхатак → сер → ман, «базарный сер = 80 тол»,
      ман = 40 сер — Prinsep 1858, II, p. 96–97 (стандарт 1833 г.; до того сер различался «для каждого товара и
      каждого рынка» — там же). Ман пришёл через арабскую торговлю — HJ, s.v. MAUND. Числа для XVI в. —
      реконструкция.
    en: >-
      Hagiographies: Raghunatha gives 'a hundred gold coins and two tolas of gold' for service (CC Antya 6.153). The
      rati is the seed of *Abrus precatorius* (red with a black spot), an ancient goldsmith's weight; the chain from
      'the mote in a sunbeam' up to the masha — after Manu, HJ 1903, s.v. RUTTEE. The series rati → masha → tola →
      chhatak → ser → man, 'the bazar ser = 80 tolas', man = 40 sers — Prinsep 1858, II, p. 96–97 (the 1833
      standard; before that the ser varied 'for every article sold as well as for every market' — ibid.). The man
      came through Arab trade — HJ, s.v. MAUND. Figures for the 16th c. are a reconstruction.
  text:
    ru: >-
      Золото и лекарства взвешивают на крошечных весах-коромыслах, а гирьками служат семена: алое с чёрным глазком
      семечко рати — самый малый вес ювелира, восемь рати — маша, около ста рати — тола (≈ 11–12 г); недаром
      Рагхунатха шлёт Рагхаве Пандиту «две толы золота». Рис, масло и патоку на базаре отвешивают серами (около
      килограмма) и манами по сорок серов — на больших весах с подвешенными чашами, с каменными или железными гирями.
      Но единого сера не было: в каждом городе, а то и для каждого товара он свой, и торговаться начинали с вопроса,
      «по какому серу».
    en: >-
      Gold and medicines are weighed on tiny beam-scales with seeds for weights: the scarlet, black-eyed rati seed is
      the goldsmith's smallest weight, eight ratis make a masha, about a hundred ratis a tola (≈ 11–12 g) — so
      Raghunatha sends Raghava Pandita 'two tolas of gold'. Rice, oil and molasses in the bazar are weighed by the ser
      (about a kilogram) and the man of forty sers — on big scales with hanging pans and stone or iron weights. But
      there was no single ser: each town, sometimes each commodity, had its own, and bargaining began with the
      question 'by which ser?'.
  hagiography: ["ЧЧ Антья 6.153"]
  sources: ["Hobson-Jobson, 1903, s.v. RUTTEE, SEER, MAUND",
            "J. Prinsep, Essays on Indian Antiquities… Useful Tables, 1858, vol. II, p. 96–97"]
  images: []
  game: {model: "ювелирные весы-коромысло (бронза, чашки ⌀ 4 см) и горсть семян рати; базарные весы с чашами из
         бамбуковых корзин", where: ["navadvipa/market"], notes: "алое семя Abrus — заметная игровая мелочь"}
  todo: "Сколько тол в сере в Бенгалии XVI в. (Айн-и Акбари, 1590-е — PD-пер. Jarrett/Blochmann)?"

- id: mc-languages
  title: {ru: "Языки эпохи: бенгальский, санскрит, ория, персидский", en: "Languages of the age: Bengali, Sanskrit, Oriya, Persian"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Многие не понимали языка друг друга» — толпа в ночь явления (ЧЧ Ади 13.107). Господь шутливо передразнивает
      восточнобенгальский говор (*бангаджа*) — Лочан, Сутра-кханда, ч. 1, ст. 81; Ади-кханда, ч. 9, ст. 710 и
      сноска (предки — из Шрихатты); песня на ория — ЧЧ Антья 10.67; Кази спорит, опираясь на Коран (ЧЧ Ади
      17.155–156), так же патан-учёный (ЧЧ Мадхья 18.187–202); персидские титулы братьев — *Дабир Кхас*, *Сакар
      Маллик* (ЧЧ Мадхья 1.175; ЧБ Антья 9.239–273); тюремщик-мусульманин назван *джинда-пир* (ЧЧ Мадхья 20.5).
      Санскрит — язык тол, писаний и учёных споров (mc-tol-school). Хинди/брадж путников — по косвенным данным
      (раджпут Кришнадас, санодия-брахман — ЧЧ Мадхья 18).
    en: >-
      'Many did not understand one another's language' — the crowd on the night of the appearance (CC Adi 13.107).
      The Lord jokingly mimics the East Bengali accent (*bangaja*) — Lochana, Sutra-khanda pt. 1 v. 81; Adi-khanda pt. 9
      v. 710 and note (His forefathers came from Shrihatta); a song in Oriya — CC Antya 10.67; the Kazi argues from
      the Quran (CC Adi 17.155–156), as does a Pathan scholar (CC Madhya 18.187–202); the brothers' Persian titles —
      *Dabir Khas*, *Sakar Mallik* (CC Madhya 1.175; CB Antya 9.239–273); the Muslim jailer is called *jinda-pir*
      (CC Madhya 20.5). Sanskrit is the language of the tols, scriptures and learned debate (mc-tol-school). Hindi /
      Braj of travellers — by indirect evidence (the Rajput Krishnadasa, the Sanodiya brahmin — CC Madhya 18).
  text:
    ru: >-
      Дома и на базаре в Навадвипе говорят по-бенгальски, но бенгальский неоднороден: выходцы с востока, из Шрихатты и
      с берегов Падмы, говорят так, что Нимай любит смешно передразнивать их «бангальский» выговор — ведь Его
      собственные предки были оттуда. В толах, на диспутах и в храмах звучит санскрит; на нём же сложены шлоки,
      которые повторяет вся Навадвипа. В Ориссе говорят и поют на ория — Махапрабху вспоминает строчку орийской
      песни. Двор султана в Гауде говорит и пишет по-персидски, мулла читает Коран по-арабски, и брахманы на
      государевой службе носят персидские звания — Дабир Кхас, Сакар Маллик. Когда в ночь явления к Ганге сошлись
      толпы со всех концов, многие не понимали языка друг друга — но все пели одно имя Хари.
    en: >-
      At home and in the bazar Navadvipa speaks Bengali, but Bengali is not uniform: people from the east, from
      Shrihatta and the banks of the Padma, speak so that Nimai loves to mimic their 'Bangal' accent comically — His
      own forefathers came from there. In the tols, debates and temples Sanskrit is heard; in it are the verses the
      whole of Navadvipa repeats. In Orissa people speak and sing in Oriya — Mahaprabhu recalls a line of an Oriya
      song. The Sultan's court at Gauda speaks and writes Persian, the mulla reads the Quran in Arabic, and brahmins
      in state service bear Persian titles — Dabir Khas, Sakar Mallik. When crowds from everywhere gathered at the
      Ganga on the night of the appearance, many did not understand one another's language — but all sang the one
      name of Hari.
  hagiography: ["ЧЧ Ади 13.107", "Лочан, Сутра-кханда, ч. 1, ст. 81", "Лочан, Ади-кханда, ч. 9, ст. 710",
                "ЧЧ Антья 10.67", "ЧЧ Ади 17.155–156", "ЧЧ Мадхья 18.187–202", "ЧЧ Мадхья 1.175",
                "ЧБ Антья 9.239–273", "ЧЧ Мадхья 20.5"]
  sources: []
  images: []
  game: {model: "озвучка: бенгальский (запад/восток), санскритные шлоки, ория, персидский при дворе",
         where: ["navadvipa/lane", "ganga-ghat"], notes: "диалектный юмор Нимая — реплики NPC"}
  todo: "Письменности (бенгальская, ория, деванагари, арабская вязь) — отдельная карточка или в mc-manuscript-ink?"

# ── Огонь и ночь ────────────────────────────────────────────────────────────────────────────────────────

- id: mc-fire-making
  title: {ru: "Как добывали и хранили огонь", en: "How fire was made and kept"}
  rubric: home
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      В житиях добывание огня не описано (поиск `кремен|огниво|разжёг|угли` — пусто). Реконструкция по Day 1874, p. 8:
      мешочек с двумя-тремя кремнями, железное кресало и кусочки *шолы* (сердцевина *Aeschynomene*, «индийская
      пробка»), от искры зажигают серную спичку и лампаду с горчичным маслом и хлопковым фитилём (серная спичка ⚠ —
      поздн.). Сохранение огня в очаге и золе, «угли от соседей» — этнография, не проверено по PD (todo).
      Священный огонь обрядов — mc-upanayana, mc-wedding-rite; очаг — mc-chula, топливо — mc-fuel.
    en: >-
      The hagiographies do not describe fire-making (search for flint / striker / kindled / embers — empty).
      Reconstruction after Day 1874, p. 8: a pouch with two or three flints, an iron striker and bits of *shola* (pith
      of *Aeschynomene*, 'Indian cork'); the spark lights a sulphur match and a lamp of mustard oil with a cotton wick
      (sulphur match ⚠ — late). Keeping fire in the hearth and ashes, 'embers from the neighbours' — ethnography, not
      yet checked in PD (todo). Sacred fire of the rites — mc-upanayana, mc-wedding-rite; hearth — mc-chula, fuel —
      mc-fuel.
  text:
    ru: >-
      Спичек не было: огонь высекали. В углу хижины хранится мешочек с кремнями, железным кресалом и лёгкой белой
      сердцевиной болотного растения шолы — от искры она начинает тлеть, и от неё раздувают огонь или зажигают
      фитиль глиняной лампады. Но высекать огонь каждый раз хлопотно, поэтому хозяйка с вечера присыпает угли в очаге
      золой, а утром раздувает их через трубку или просто дыханием; если огонь всё же погас — идут за угольком к
      соседям, неся его в черепке. Огонь в доме не простой: в него совершают возлияния при обрядах, и над ним готовят
      пищу для Вишну.
    en: >-
      There were no matches: fire was struck. In a corner of the hut is a pouch with flints, an iron striker and the
      light white pith of the marsh plant shola — a spark sets it smouldering, and from it a flame is blown up or the
      wick of a clay lamp is lit. But striking fire every time is troublesome, so in the evening the housewife banks
      the embers in the hearth with ash and in the morning blows them up through a pipe or simply with her breath; if
      the fire has gone out after all, one goes to the neighbours for an ember, carrying it in a potsherd. Fire in the
      house is no ordinary thing: offerings are poured into it at the rites, and over it food is cooked for Vishnu.
  hagiography: []
  sources: ["Lal Behari Day, Bengal Peasant Life (Govinda Samanta), 1874/1916, p. 8"]
  images: []
  game: {model: "мешочек из джута: 2 кремня (3–4 см), железное кресало-скоба (≈ 8 см), палочки шолы (белые, ⌀ 1–2 см)",
         where: ["mishra-house/kitchen"], notes: "игровое действие «высечь огонь» — 2–3 удара, искра в шолу"}
  todo: "Найти PD-свидетельство о хранении огня и «угольке от соседей» (Ward 1815? Risley?); бенгальское название кресала (чакмаки?)."

- id: mc-torches
  title: {ru: "Факелы и горшки с маслом", en: "Torches and pots of oil"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Факелы в ночном шествии к Кази: «каждый старался сделать факел побольше», сын готовит свой, хотя отец уже
      сделал; запасные факелы; «наполнили большие горшки маслом и взяли с собой»; хлопали в ладоши, держа факел и
      горшок — ЧБ Мадхья 23.125–139, 23.163–164, 23.224; ЧЧ Ади 17.134. Шриман Пандит держит факел во время ночного
      киртана — ЧЧ Ади 10.37, ЧБ Антья 8.21, ЧБ Мадхья 18.11; Сварупа с преданными ищут Господа с факелами — ЧЧ
      Антья 17.14; «огненный круг от вращения факела» (*алата-чакра*) — ЧЧ Мадхья 13.82, 20.391; факелы на свадьбе
      — ЧБ Ади 15.144. Устройство факела (тряпьё на палке) — реконструкция. Шествие как событие — mc-kazi-nagar-kirtan.
    en: >-
      Torches in the night procession to the Kazi: 'each tried to make the biggest torch', a son makes his own though
      his father has already made one; spare torches; 'they filled big pots with oil and took them along'; they
      clapped while holding torch and pot — CB Madhya 23.125–139, 23.163–164, 23.224; CC Adi 17.134. Shriman Pandita
      holds the torch during night kirtan — CC Adi 10.37, CB Antya 8.21, CB Madhya 18.11; Svarupa and the devotees
      search for the Lord with torches — CC Antya 17.14; 'the circle of fire from a whirled torch' (*alata-chakra*) —
      CC Madhya 13.82, 20.391; torches at the wedding — CB Adi 15.144. The torch's construction (rags on a stick) —
      reconstruction. The procession as an event — mc-kazi-nagar-kirtan.
  text:
    ru: >-
      Ночью улицы Навадвипы темны, и свет несут с собой. Факел — палка или бамбуковое древко с туго намотанной тряпкой;
      его окунают в масло, а рядом идёт человек с глиняным горшком масла и подливает, чтобы огонь не угас. В ночь
      шествия к дому Кази каждый дом готовил свой факел — побольше, чем у соседа, — и запасные; город осветился так,
      что сияние смешалось с лунным светом. На ночных киртанах у Шриваса факел держит Шриман Пандит, освещая танец
      Господа. Если быстро крутить факел, в темноте видится сплошной огненный круг — этим образом Кавирадж поясняет,
      как игры Кришны одна за другой проходят по вселенным.
    en: >-
      At night the streets of Navadvipa are dark, and people carry their light with them. A torch is a stick or bamboo
      staff with a rag wound tight round it; it is dipped in oil, and beside it walks a man with an earthen pot of oil
      who keeps topping it up so the flame does not die. On the night of the procession to the Kazi's house every home
      prepared its torch — bigger than the neighbour's — and spare ones; the city blazed so that the glow mingled with
      the moonlight. At the night kirtans in Shrivasa's house Shriman Pandita holds the torch, lighting the Lord's
      dance. Whirl a torch fast and in the dark you see an unbroken ring of fire — with this image Kaviraja explains
      how Krishna's pastimes pass one after another through the universes.
  hagiography: ["ЧБ Мадхья 23.125–139", "ЧБ Мадхья 23.163–164", "ЧБ Мадхья 23.224", "ЧЧ Ади 17.134", "ЧЧ Ади 10.37",
                "ЧБ Антья 8.21", "ЧБ Мадхья 18.11", "ЧЧ Антья 17.14", "ЧЧ Мадхья 13.82", "ЧЧ Мадхья 20.391",
                "ЧБ Ади 15.144"]
  sources: []
  images: []
  game: {model: "факел: бамбук 1,2–1,5 м, обмотка из тряпья 25–30 см; глиняный горшок с маслом на верёвочной ручке",
         where: ["navadvipa/lane", "shrivasa-house/courtyard"], notes: "динамический свет; частицы искр"}
  todo: "Бенгальское слово для факела в ЧБ Мадхья 23 (*маш́а̄ла*? *дэут̣и*?) — сверить по транслиту."

- id: mc-night
  title: {ru: "Ночь: темнота, звуки, страх и киртан", en: "Night: darkness, sounds, fear and kirtan"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Рыбак в Пури ловит рыбу один по ночам и не боится духов, потому что помнит Нрисимху (ЧЧ Антья 18.57); разбойники
      ждут, пока дом уснёт, просыпаются от карканья ворон на рассвете (ЧБ Антья 5.543–559, 5.570); ночные бдения с
      песнями Мангала-Чанди (ЧБ Ади 2.64; ЧЧ Ади 17.205); ночной киртан за закрытыми дверями — mc-house-kirtan;
      «с наступлением темноты вернулся Рамананда, и всю ночь говорили о Кришне» (ЧЧ Мадхья 9.328); счёт ночи
      прахарами — mc-danda-prahara. Шакал — ночной вор тростника (Day 1874, p. 223) и см. mc-jackal.
    en: >-
      A fisherman in Puri fishes alone at night and is not afraid of ghosts because he remembers Nrisimha (CC Antya
      18.57); robbers wait for the house to fall asleep and wake at dawn to the cawing of crows (CB Antya 5.543–559,
      5.570); night vigils with songs of Mangala-Chandi (CB Adi 2.64; CC Adi 17.205); night kirtan behind closed doors
      — mc-house-kirtan; 'when darkness fell Ramananda returned, and all night they spoke of Krishna' (CC Madhya
      9.328); reckoning the night by praharas — mc-danda-prahara. The jackal as night thief of sugarcane (Day 1874,
      p. 223) and see mc-jackal.
  text:
    ru: >-
      С заходом солнца деревня погружается в почти полную темноту: только лампада у туласи да красный отсвет очагов.
      Лампадное масло дорого, и после ужина большинство ложится спать; слышны вой шакалов, сверчки, плеск рыбы в
      пруду, лай собак. Ночь — время страхов: говорят о духах, что бродят у воды и на пустырях, о ворах, которые
      дожидаются, пока дом уснёт. Но ночь — и время самого сокровенного: за закрытыми дверями дома Шриваса до
      рассвета звучит киртан, а в Пури Господь всю ночь говорит о Кришне с Раманандой. «Я ловлю рыбу один по ночам, и
      духи меня не трогают, потому что я помню Нрисимху», — говорит простой рыбак.
    en: >-
      After sunset the village sinks into near-total darkness: only the lamp at the tulasi and the red glow of
      hearths. Lamp oil is costly, and after supper most people go to sleep; one hears jackals howling, crickets, fish
      splashing in the pond, dogs barking. Night is a time of fears: people talk of spirits that roam by the water and
      on waste ground, of thieves who wait for the house to sleep. But night is also the time of what is most
      intimate: behind the closed doors of Shrivasa's house kirtan resounds until dawn, and in Puri the Lord speaks of
      Krishna with Ramananda all night. 'I fish alone at night, and the ghosts don't touch me because I remember
      Nrisimha,' says a simple fisherman.
  hagiography: ["ЧЧ Антья 18.57", "ЧБ Антья 5.543–570", "ЧБ Ади 2.64", "ЧЧ Ади 17.205", "ЧЧ Мадхья 9.328"]
  sources: ["Lal Behari Day, Bengal Peasant Life, 1874/1916, p. 223"]
  images: []
  game: {model: "ночной режим карты: темнота, точки света (лампады, очаги), звуковой фон", where: ["navadvipa/lane",
         "mishra-house/courtyard"], notes: "звуки: шакалы, сверчки, лягушки в дожди, сова"}

- id: mc-watchmen
  title: {ru: "Стража и сторожа", en: "Guards and watchmen"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Стражники Кази водят Харидаса по 22 рынкам (ЧБ Ади 16.101–128); стражник Кази с обожжённой бородой (ЧЧ Ади
      17.190); храмовый стражник в Пури хватает Нитьянанду за руку (ЧБ Антья 3.195–202); «пятеро стражей днём и
      ночью» (ЧЧ Мадхья 16.229); чудесная стража вокруг дома Хираньи (ЧБ Антья 5.571–579, 5.664–668); пограничная
      застава Ориссы (ЧЧ Мадхья 16.156–161). Слова: *пайк* — пеший воин, гонец, деревенский сторож, в Катаке —
      местное ополчение на служебной земле; *чаукидар* — сторож (поздн. перс. форма); у сторожа XIX в. — копьё, щит и
      меч — HJ 1903, s.v. PYKE, CHOKIDAR.
    en: >-
      The Kazi's guards lead Haridasa through 22 markets (CB Adi 16.101–128); the Kazi's guard with the burnt beard (CC
      Adi 17.190); a temple guard in Puri grabs Nityananda's arm (CB Antya 3.195–202); 'five guards day and night' (CC
      Madhya 16.229); the miraculous guard round Hiranya's house (CB Antya 5.571–579, 5.664–668); the Orissan border
      post (CC Madhya 16.156–161). Words: *paik* — foot-soldier, courier, village watchman, in Cuttack a local militia
      on service land; *chaukidar* — watchman (later Persian form); the 19th-c. watchman carries spear, shield and
      sword — HJ 1903, s.v. PYKE, CHOKIDAR.
  text:
    ru: >-
      Порядок держат пешие стражники — пайки — с палками, копьями и щитами. Они служат кази и наместнику: хватают,
      кого велено, водят провинившегося по рынкам, ходят по городу в ночные часы. В Пури у храмовых дверей стоят свои
      стражники — один попытался удержать Нитьянанду за руку и отлетел на несколько шагов. На границе Ориссы и Гауды
      — заставы с воинами, где проверяют каждого путника. А богатые дома нанимают сторожей; про дом Хираньи
      разбойники рассказывали, что его всю ночь окружали рослые воины в гирляндах, певшие имена Кришны, — так
      Нитьянанда хранил приютивший Его дом.
    en: >-
      Order is kept by foot guards — paiks — with staves, spears and shields. They serve the qazi and the governor:
      they seize whom they are told, lead an offender round the markets, walk the town in the night watches. In Puri
      the temple doors have their own guards — one tried to hold Nityananda by the arm and was flung several paces.
      On the border of Orissa and Gauda there are posts with soldiers where every traveller is checked. Rich houses
      hire watchmen; of Hiranya's house the robbers told that all night it was ringed by tall warriors in garlands
      singing Krishna's names — so Nityananda guarded the house that sheltered Him.
  hagiography: ["ЧБ Ади 16.101–128", "ЧЧ Ади 17.190", "ЧБ Антья 3.195–202", "ЧЧ Мадхья 16.229",
                "ЧБ Антья 5.571–579", "ЧБ Антья 5.664–668", "ЧЧ Мадхья 16.156–161"]
  sources: ["Hobson-Jobson, 1903, s.v. PYKE, CHOKIDAR"]
  images: []
  game: {model: "пайк: дхоти, повязка на голове, бамбуковая палка-латхи 1,8 м или копьё, круглый щит из кожи ⌀ 45 см",
         where: ["navadvipa/lane", "puri/temple"], notes: "NPC-патруль ночью с факелом"}
  todo: "Слово для стражника в ЧБ Ади 16 (*пайка*? *пэйада*?) — сверить по транслиту."

# ── Преступления, оружие, война ─────────────────────────────────────────────────────────────────────────

- id: mc-dacoits
  title: {ru: "Разбойники и воры", en: "Robbers and thieves"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Шайка брахмана-разбойника в Навадвипе: выслеживает украшения Нитьянанды, ждёт ночи, оружие — мечи, щиты, ножи,
      трезубцы; перед «делом» поклоняются Чанди вином и мясом; второй раз выходят «в синих одеждах» — ЧБ Антья
      5.526–600 (особенно 5.537–544, 5.565–570). Разбойники на речном пути в Ориссу — ЧБ Антья 2.135–136; на дорогах
      за Варанаси одинокого бенгальца ловят и заставляют работать — ЧЧ Антья 13.34–35; совет брать спутников «от воров
      и грабителей» — ЧЧ Мадхья 7.16; воры-похитители ребёнка — mc-child-thieves. Отравление путников дурманом
      *дхатура* — ЧЧ Мадхья 18.164–165, 18.181–182 (подозрение патанов); дурман дхатура у воров Индии — Гарсиа да
      Орта (1563), по HJ 1903, s.v. DATURA.
    en: >-
      The gang of a brahmin robber in Navadvipa: it stalks Nityananda's ornaments, waits for night; weapons — swords,
      shields, knives, tridents; before the 'job' they worship Chandi with wine and meat; the second time they set out
      'in blue clothes' — CB Antya 5.526–600 (esp. 5.537–544, 5.565–570). Robbers on the river route to Orissa — CB
      Antya 2.135–136; on the roads beyond Varanasi a lone Bengali is caught and made to work — CC Antya 13.34–35;
      advice to take companions 'because of thieves and robbers' — CC Madhya 7.16; child-snatching thieves —
      mc-child-thieves. Poisoning travellers with *dhatura* — CC Madhya 18.164–165, 18.181–182 (the Pathans'
      suspicion); dhatura used by Indian thieves — Garcia da Orta (1563), via HJ 1903, s.v. DATURA.
  text:
    ru: >-
      Дороги и даже улицы были небезопасны. В Навадвипе жил брахман по рождению, глава шайки: заметив на Нитьянанде
      золото, кораллы и жемчуг, он собрал своих людей с мечами, щитами, ножами и трезубцами и ночью подкрался к дому
      Хираньи Пандита. Разбойники верили, что удачу им даёт богиня Чанди, и перед набегом приносили ей вино и мясо; на
      второй набег вышли в синих одеждах, «как герои», — но так и не смогли войти, а в конце концов их главарь
      раскаялся у стоп Нитьянанды. На дальних дорогах путников опаивали дурманом дхатуры и грабили; поэтому Господу
      советуют не ходить в одиночку, а паломники идут большими партиями.
    en: >-
      Roads and even streets were unsafe. In Navadvipa lived a man brahmin by birth, the head of a gang: seeing gold,
      coral and pearls on Nityananda, he gathered his men with swords, shields, knives and tridents and crept up at
      night to Hiranya Pandita's house. The robbers believed goddess Chandi gave them their luck, and before a raid
      offered her wine and meat; for the second raid they set out in blue clothes, 'like heroes' — but could never get
      in, and in the end their chief repented at Nityananda's feet. On distant roads travellers were drugged with
      dhatura and robbed; so the Lord is advised not to walk alone, and pilgrims travel in large parties.
  hagiography: ["ЧБ Антья 5.526–600", "ЧБ Антья 2.135–136", "ЧЧ Антья 13.34–35", "ЧЧ Мадхья 7.16",
                "ЧЧ Мадхья 18.164–182"]
  sources: ["Hobson-Jobson, 1903, s.v. DATURA (Garcia da Orta, 1563)"]
  images: []
  game: {model: "разбойники в тёмно-синих дхоти и повязках, мечи-кхарга, круглые щиты, ножи, трезубцы; цветок и
         коробочка дхатуры", where: ["navadvipa/lane"], notes: "сцена «ночной набег» — неудачный; без крови"}

- id: mc-weapons-pathans
  title: {ru: "Оружие и конники-патаны", en: "Weapons and Pathan horsemen"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Десять всадников-патанов из войска, спешиваются, хватают спутников Господа, грозят казнью; брахман взывает
      «во имя царя» и к *сикдару* (начальнику); Кришнадас-раджпут: «у меня в деревне двести турок и сотня *ка̄ма̄н*»
      (*ка̄ма̄на* — у ВЧД «пушки»; перс. *kamān* — «лук»: возможно, «сотня лучников/луков» — спорно), «по сигналу
      рожка заберут ваших коней и сёдла»; принц Виджали Кхан, патана-вайшнавы — ЧЧ Мадхья 18.163–212. Оружие
      разбойников — ЧБ Антья 5.542–544, 5.569; помост с мечами — mc-revenue-collector; шестирукий облик с луком — ЧЧ
      Ади 17.13. Слоны и кони знати — mc-elephants-horses.
    en: >-
      Ten Pathan horsemen of the army dismount, seize the Lord's companions and threaten them with death; the brahmin
      appeals 'in the king's name' and to the *sikdar* (commander); the Rajput Krishnadasa: 'in my village I have two
      hundred Turks and a hundred *kaman*' (*kamana* — 'cannons' in the VCD rendering; Persian *kamān* = 'bow': possibly
      'a hundred bows/archers' — disputed), 'at the horn's signal they'll take your horses and saddles'; prince Vijali
      Khan, the Pathan Vaishnavas — CC Madhya 18.163–212. Robbers' weapons — CB Antya 5.542–544, 5.569; the platform
      with swords — mc-revenue-collector; the six-armed form with a bow — CC Adi 17.13. Elephants and horses of the
      nobility — mc-elephants-horses.
  text:
    ru: >-
      Оружие у каждого сословия своё. Разбойники и ночные сторожа — с мечами, щитами, ножами и трезубцами, пайки — с
      палками и копьями. Сила султанов — конница: на пути из Матхуры в Праягу на Господа, упавшего без чувств, наткнулись десять
      всадников-патанов — афганских воинов, — решили, что спутники опоили и обобрали монаха, и уже собирались их
      казнить. Сопровождавший Господа раджпут Кришнадас пригрозил, что по звуку его рожка прибегут двести «турок» с
      оружием. Но когда Махапрабху очнулся с громким «Хари!», патаны сами пали к Его стопам, а их молодой
      предводитель Виджали Кхан стал великим преданным.
    en: >-
      Each class has its own weapons. Robbers and night watchmen carry swords, shields, knives and tridents; paiks,
      staves and spears. The Sultans' strength is cavalry: on the road from Mathura to Prayaga ten Pathan horsemen — Afghan soldiers — came
      upon the Lord lying unconscious, decided His companions had drugged and robbed the monk, and were about to
      execute them. The Rajput Krishnadasa who accompanied the Lord threatened that at the sound of his horn two
      hundred armed 'Turks' would come running. But when Mahaprabhu came to with a loud 'Hari!', the Pathans
      themselves fell at His feet, and their young leader Vijali Khan became a great devotee.
  hagiography: ["ЧЧ Мадхья 18.163–212", "ЧБ Антья 5.542–544", "ЧБ Антья 5.569", "ЧЧ Ади 17.13"]
