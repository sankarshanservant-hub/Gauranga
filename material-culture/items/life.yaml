- id: mc-gauda-orissa-war
  title: {ru: "Граница Гауды и Ориссы: война, заставы, переправы", en: "The Gauda–Orissa border: war, outposts, ferries"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Два царства на грани войны» — ЧБ Антья 2.11–13; Рамачандра Кхан: «люди царя вкопали на дорогах острые пики;
      незнакомца обвиняют в шпионаже и казнят», переправа тайно ночью — ЧБ Антья 2.95–102; султан идёт войной на
      Ориссу, Санатана отказывается — ЧЧ Мадхья 19.24–30; граница при возвращении Господа (1514–15): орисский
      наместник, «мусульманский правитель-пьяница» до Пичхалады, шпион-индус, перемирие, условие «прийти безоружным,
      не более семи слуг», десять сторожевых судов против разбойников, опасная река Мантрешвар — ЧЧ Мадхья
      16.156–200. Катак — столица Пратапарудры (ЧЧ Мадхья 12.5). Сам султан — mc-sultan-gauda.
    en: >-
      'The two kingdoms are on the brink of war' — CB Antya 2.11–13; Ramachandra Khan: 'the king's men have planted
      sharp spikes on the roads; a stranger is accused of spying and executed', a secret night crossing — CB Antya
      2.95–102; the Sultan makes war on Orissa, Sanatana refuses — CC Madhya 19.24–30; the border on the Lord's return
      (1514–15): the Orissan governor, 'the drunken Muslim ruler' as far as Pichhalada, a Hindu spy, a truce, the
      condition 'come unarmed with no more than seven servants', ten guard boats against robbers, the dangerous
      Mantreshvara river — CC Madhya 16.156–200. Cuttack — Prataparudra's capital (CC Madhya 12.5). The Sultan himself —
      mc-sultan-gauda.
  text:
    ru: >-
      Все годы жизни Господа в Пури между мусульманской Гаудой и индусской Ориссой шла то война, то настороженный мир.
      Граница проходила по рекам юго-западной Бенгалии; на дорогах стояли заставы, вкопанные пики преграждали путь,
      незнакомца могли схватить как лазутчика. Паломники пробирались тайно, ночью, на лодках — Рамачандра Кхан
      рисковал всем, переправляя Махапрабху. А когда Господь возвращался в Бенгалию, мусульманский правитель
      пограничья, услышав о Нём от своего шпиона, сам пришёл без оружия, всего с семью слугами, заключил перемирие с
      орисским наместником и под охраной десяти судов перевёз Махапрабху через опасную реку — война отступила перед
      киртаном.
    en: >-
      Throughout the years of the Lord's life in Puri, Muslim Gauda and Hindu Orissa were now at war, now in a wary
      peace. The border ran along the rivers of south-western Bengal; there were outposts on the roads, planted spikes
      barred the way, a stranger could be seized as a spy. Pilgrims slipped through secretly, at night, by boat —
      Ramachandra Khan risked everything to ferry Mahaprabhu across. And when the Lord returned to Bengal, the Muslim
      ruler of the borderland, hearing of Him from his spy, came himself unarmed with only seven servants, made a truce
      with the Orissan governor and under the guard of ten boats ferried Mahaprabhu over the dangerous river — war
      gave way before kirtan.
  hagiography: ["ЧБ Антья 2.11–13", "ЧБ Антья 2.95–102", "ЧЧ Мадхья 19.24–30", "ЧЧ Мадхья 16.156–200",
                "ЧЧ Мадхья 12.5"]
