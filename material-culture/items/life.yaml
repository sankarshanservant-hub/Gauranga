         where: ["travel/orissa-border"], notes: "сюжетный уровень «переход границы» ночью"}
  todo: "Хронология войн Хуссейн-шаха с Ориссой (ок. 1508–1515) — по PD (Stewart 1813, Hunter Orissa 1872) для раздела 13."

# ── Земледелие и промыслы ───────────────────────────────────────────────────────────────────────────────

- id: mc-rice-year
  title: {ru: "Рисовый год: аус, аман, боро", en: "The rice year: aus, aman, boro"}
  rubric: town
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      В житиях земледельческих работ почти нет; недовольные горожане винят киртан в засухе: «боги не посылают дождь,
      рисовые поля пересохли, никто не может ничего заработать» — ЧБ Мадхья 8.246–247; «урожай *шаса*» — Лочан,
      Шеша-кханда, ч. 1, ст. 20. Реконструкция по Day 1874: плуг из акации *бабла* с железным лемехом, пара волов,
      пахарь бранит и уговаривает их (p. 18–19); три урожая — *аус* (сеют в конце марта на высоких землях, жнут в
      августе), *аман* (сеют в мае–июне, жнут в ноябре–декабре, главный), *боро* (в болотах, январь–май); стебли
      амана в низинах до 3–4 м; варёный (*сиддха*) и сушёный (*атап*) рис (p. 200–202). **[поздн., Бардхаман 1840-х]**
    en: >-
      The hagiographies hardly mention field work; disgruntled townsmen blame kirtan for drought: 'the gods send no
      rain, the rice fields have dried up, no one can earn anything' — CB Madhya 8.246–247; 'the *shasa* harvest' —
      Lochana, Shesha-khanda pt. 1 v. 20. Reconstruction after Day 1874: a plough of *babla* acacia with an iron share,
      a pair of bullocks, the ploughman scolding and coaxing them (p. 18–19); three crops — *aus* (sown late March on
      high land, cut in August), *aman* (sown May–June, cut November–December, the main one), *boro* (in swamps,
      January–May); aman stalks in the lowlands up to 3–4 m; parboiled (*siddha*) and sun-dried (*atap*) rice (p.
      200–202). **[late, Burdwan 1840s]**
  text:
    ru: >-
      Жизнь Бенгалии подчинена рису. Весной, после первой грозы, крестьянин выходит в поле с деревянным плугом с
      железным лемехом и парой волов — то бранит их, то ласково уговаривает. На высоких полях сеют быстрый аус, к
      августу он уже созрел; главный же урожай — аман: его сеют перед дождями, поля заливает муссон, стебли тянутся
      вслед за водой, а в ноябре–декабре наступает жатва серпом. В болотистых низинах зимой растёт третий рис — боро.
      Обмолоченное зерно сушат, рушат дхенки и хранят в больших корзинах до нового урожая; засуха или наводнение
      означают голод, и в засуху люди ищут виноватых — даже в киртане.
    en: >-
      Bengal's life is ruled by rice. In spring, after the first thunderstorm, the peasant goes out to the field with
      a wooden plough with an iron share and a pair of bullocks — now scolding them, now coaxing them kindly. On the
      high fields quick aus is sown and is ripe by August; the main crop is aman: sown before the rains, the monsoon
      floods the fields, the stalks rise with the water, and in November–December comes reaping with the sickle. In
      marshy lowlands a third rice, boro, grows through the winter. Threshed grain is dried, husked with the dhenki
      and stored in big baskets till the next harvest; drought or flood means hunger, and in a drought people look
      for someone to blame — even kirtan.
  hagiography: ["ЧБ Мадхья 8.246–247", "Лочан, Шеша-кханда, ч. 1, ст. 20"]
  sources: ["Lal Behari Day, Bengal Peasant Life, 1874/1916, p. 18–19, 200–202"]
  images: []
  game: {model: "плуг (дышло ≈ 2,5 м, рукоять, железный лемех), ярмо на пару волов, серп-каште; рисовое поле по сезонам",
         where: ["navadvipa/fields"], notes: "смена вида полей по игровому календарю"}
  todo: "Названия сортов риса эпохи — в «Манаса-мангале» 1494 (Sen 1911) или у Мукундарама; дхенки — mc-dhenki."

- id: mc-house-garden
  title: {ru: "Огород и сад при доме", en: "The kitchen garden and orchard"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Гададхара в Пури срывает *шак* в своём саду — «никто его не сажал, он рос сам по себе», молодые листья тамаринда
      толчёт с солёной водой — ЧБ Антья 7.137–139; Нимай с друзьями ночью «изображая быка» ломает банановые сады —
      ЧБ Ади 7.155; огород и бананы Шридхара — mc-shridhar-hut; зелень-шак — mc-shak (food.yaml); деревья усадьбы —
      flora.yaml. Набор огородных культур XVI в. — по житиям (тыквы, баклажаны, патол, шак, бананы — см. kitchen,
      food), без поздних (⚠ картофель, томат, чили).
    en: >-
      Gadadhara in Puri picks *shak* in his garden — 'no one planted it, it grew by itself', and pounds young tamarind
      leaves with salt water — CB Antya 7.137–139; Nimai and friends at night 'playing the bull' wreck banana gardens
      — CB Adi 7.155; Shridhara's garden and bananas — mc-shridhar-hut; shak greens — mc-shak (food.yaml); homestead
      trees — flora.yaml. The range of 16th-c. garden crops — from the hagiographies (gourds, aubergines, patol, shak,
      bananas — see kitchen, food), without late ones (⚠ potato, tomato, chilli).
  text:
    ru: >-
      За домом — огород, и почти всё к столу растёт здесь: тыквы и бутылочные тыквы ползут по бамбуковым шпалерам и
      соломенной крыше, рядом баклажаны, патол, грядки зелени-шака, кусты бананов, у пруда — колоказия. Многое растёт и
      само: Гададхара Пандит в Пури рвёт шак, которого никто не сажал, и готовит его для Господа вместе с молодыми
      листьями тамаринда. Огород огораживают плетнём от коров и коз, а мальчишки, играя «в быка», могут за ночь
      переломать соседский банановый сад. Ни картофеля, ни помидоров, ни перца чили в этих огородах ещё нет — их
      привезут позже из Америки.
    en: >-
      Behind the house is the kitchen garden, and nearly everything for the table grows here: pumpkins and bottle
      gourds creep over bamboo trellises and the thatched roof, beside them aubergines, patol, beds of shak greens,
      banana clumps, and taro by the pond. Much grows by itself: Gadadhara Pandita in Puri picks shak that no one
      planted and cooks it for the Lord with young tamarind leaves. The garden is fenced with wattle against cows and
      goats, and boys 'playing the bull' can wreck a neighbour's banana garden in a night. There are no potatoes,
      tomatoes or chillies in these gardens yet — they will come later from America.
  hagiography: ["ЧБ Антья 7.137–139", "ЧБ Ади 7.155"]
  sources: []
  images: []
  game: {model: "грядки, бамбуковая шпалера с тыквами, плетень, кусты банана", where: ["mishra-house/backyard"],
         notes: "собираемые предметы для кухни"}

# ── Сны, астрология, духи и приметы ─────────────────────────────────────────────────────────────────────

- id: mc-dreams
  title: {ru: "Сны: весть от Господа", en: "Dreams: a message from the Lord"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Мишра во сне видит Нимая санньяси — ЧБ Ади 8.92–99; брахман во сне укоряет Мишру — ЧЧ Ади 14.84–90; Тапана
      Мишре во сне велят идти к Нимаю — ЧБ Ади 14.120, ЧЧ Ади 16.12; Кази во сне видит Нрисимху — ЧЧ Ади 17.178–187;
      Гопала во сне просит Мадхавендру принести сандал — ЧЧ Мадхья 4.106; Гопинатха во сне говорит пуджари — Мадхья
      4.126; Нитьянанда во сне является Кришнадасу Кавираджу — ЧЧ Ади 5.180–198; Дигвиджайе во сне — Сарасвати — ЧБ
      Ади 13.125; сон Чандрашекхара — ЧЧ Мадхья 19.245.
    en: >-
      Mishra dreams of Nimai as a sannyasi — CB Adi 8.92–99; a brahmin rebukes Mishra in a dream — CC Adi 14.84–90;
      Tapana Mishra is told in a dream to go to Nimai — CB Adi 14.120, CC Adi 16.12; the Kazi sees Nrisimha in a dream —
      CC Adi 17.178–187; Gopala in a dream asks Madhavendra to bring sandalwood — CC Madhya 4.106; Gopinatha speaks to
      the pujari in a dream — Madhya 4.126; Nityananda appears to Krishnadasa Kaviraja in a dream — CC Adi 5.180–198;
      Sarasvati to the Digvijayi in a dream — CB Adi 13.125; Chandrashekhara's dream — CC Madhya 19.245.
  text:
    ru: >-
      В житиях сон — не игра ума, а дверь, через которую Господь и Его преданные говорят с человеком. Отец Нимая видит
      во сне сына с бритой головой, в одеждах санньяси, танцующего среди вайшнавов, — и в слезах молит Кришну оставить
      мальчика дома. Гопала велит во сне старцу Мадхавендре Пури принести Ему сандал с далёкого юга, Гопинатха будит
      пуджари, чтобы тот отнёс спрятанный кхир, а сам Кришнадас Кавирадж отправляется во Вриндаван по велению
      Нитьянанды, явившегося ему во сне. Даже суровый Кази видит во сне грозного Нрисимху — и отменяет запрет на
      киртан. Вайшнавы рассказывают такие сны с благоговением, но тайну хранят: Господь велит Тапане Мишре никому не
      говорить о своём сне.
    en: >-
      In the hagiographies a dream is no play of the mind but a door through which the Lord and His devotees speak to
      a person. Nimai's father sees his son in a dream with shaven head, in sannyasi's robes, dancing among the
      Vaishnavas — and tearfully begs Krishna to keep the boy at home. Gopala in a dream bids the old Madhavendra Puri
      bring Him sandalwood from the far south, Gopinatha wakes the pujari to take the hidden khira, and Krishnadasa
      Kaviraja himself goes to Vrindavana at the command of Nityananda, who appeared to him in a dream. Even the stern
      Kazi sees fierce Nrisimha in a dream — and lifts his ban on kirtan. Vaishnavas tell such dreams with reverence
      but keep the secret: the Lord forbids Tapana Mishra to speak of his dream to anyone.
  hagiography: ["ЧБ Ади 8.92–99", "ЧЧ Ади 14.84–90", "ЧБ Ади 14.120", "ЧБ Ади 14.155", "ЧЧ Ади 16.12",
                "ЧЧ Ади 17.178–187", "ЧЧ Мадхья 4.106", "ЧЧ Мадхья 4.126", "ЧЧ Ади 5.180–198", "ЧБ Ади 13.125",
                "ЧЧ Мадхья 19.245"]
  sources: []
  images: []
  game: {model: "сцена сна: мягкий свет, размытый фон; Мишра на постели", where: ["mishra-house/courtyard"],
         notes: "механика «сон-подсказка» уместна только как откровение, не как гадание"}

- id: mc-astrologer
  title: {ru: "Астролог и выбор благого часа", en: "The astrologer and the choice of an auspicious hour"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Нимай приходит к астрологу-*сарваджне*, «знающему прошлое, настоящее и будущее», и просит назвать Его прошлое
      рождение; астролог, повторяя Гопала-мантру, видит в медитации Самого Господа — ЧБ Ади 12.153–171, ЧЧ Ади
      17.103–112. Выбор благоприятного дня и мухурты для обрядов — ЧБ Ади 6.2 (начало учёбы), 10.79, 10.90, 15.73,
      15.103 (свадьба: адхиваса в сумерки), ЧЧ Ади 14.18 (имянаречение), ЧБ Ади 14.155 (выход в путь). Гороскоп
      Ниламбары — mc-horoscope.
    en: >-
      Nimai comes to an astrologer, a *sarvajna*, 'knower of past, present and future', and asks him to name His
      previous birth; repeating the Gopala mantra, the astrologer sees the Lord Himself in meditation — CB Adi
      12.153–171, CC Adi 17.103–112. Choosing an auspicious day and muhurta for rites — CB Adi 6.2 (start of
      schooling), 10.79, 10.90, 15.73, 15.103 (wedding: adhivasa at dusk), CC Adi 14.18 (naming), CB Adi 14.155
      (setting out on a journey). Nilambara's horoscope — mc-horoscope.
  text:
    ru: >-
      Ни одно важное дело — начало учёбы, свадьбу, выход в дальний путь — не начинают наугад: брахман-астролог по
      альманаху высчитывает благой день и мухурту, и в назначенный миг звучат раковины. В Навадвипе славился
      астролог-сарваджня, «всеведущий»: к нему пришёл молодой Нимай Пандит и шутливо попросил сказать, кем Он был в
      прошлой жизни. Астролог стал считать, повторяя мантру Гопалы, — и в медитации увидел ослепительный облик
      Господа, прибежище бесчисленных вселенных, и онемел. Вайшнав чтит знание светил как часть ведической жизни, но
      знает: судьбу преданного вершит не планета, а воля Кришны.
    en: >-
      No important undertaking — the start of schooling, a wedding, setting out on a long road — is begun at random: a
      brahmin astrologer reckons from the almanac an auspicious day and muhurta, and at the appointed moment the conches
      sound. Navadvipa had a famous astrologer, a sarvajna, 'all-knowing': young Nimai Pandita came to him and
      playfully asked him to say who He had been in His previous life. The astrologer began his calculations,
      repeating the Gopala mantra — and in meditation saw the dazzling form of the Lord, the shelter of countless
      universes, and fell speechless. A Vaishnava honours the science of the heavenly bodies as part of Vedic life,
      but knows that a devotee's destiny is decided not by a planet but by Krishna's will.
  hagiography: ["ЧБ Ади 12.153–171", "ЧЧ Ади 17.103–112", "ЧБ Ади 6.2", "ЧБ Ади 10.79", "ЧБ Ади 10.90",
                "ЧБ Ади 15.73", "ЧБ Ади 15.103", "ЧЧ Ади 14.18", "ЧБ Ади 14.155"]
  sources: []
  images: []
  game: {model: "астролог на циновке: пальмовая рукопись-панджика, мел, доска с расчерченными домами гороскопа",
         where: ["navadvipa/lane"], notes: "NPC: «благой час» для квеста"}

- id: mc-spirits-omens
  title: {ru: "Духи, сглаз и приметы — и чего боится вайшнав", en: "Spirits, the evil eye and omens — and what a Vaishnava fears"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Мишра боится, что красоту сына сглазят или навредят злые духи, и молится Кришне; «нечисты лишь места, где не
      помнят о Тебе: там селятся духи, ведьмы и демоны» — ЧБ Ади 8.83–91; Сита Тхакурани защищает младенца «от ведьм
      и злых духов» — ЧЧ Ади 13.117; при «вайю» Нимая говорят «им овладел демон», «это проделки ведьмы» — ЧБ Ади
      12.79; брахма-ракшас — ЧЧ Антья 2.156; рыбак боится духа, Сварупа «изгоняет» его, призывая Нрисимху — ЧЧ Антья
      18.57–63; «слёзы на благом обряде — недобрый знак» — Карнапура, сарга 3, ст. 52. Стрёкот ящерицы — дурная
      примета для всех сословий Бенгалии — Day 1874, p. 8–9 **[поздн.]**. Обереги младенца — mc-protective-mantras,
      mc-tiger-claw, mc-name-nimai.
    en: >-
      Mishra fears his son's beauty will draw the evil eye or harm from evil spirits, and prays to Krishna; 'only those
      places are unclean where You are not remembered: there spirits, witches and demons dwell' — CB Adi 8.83–91; Sita
      Thakurani protects the infant 'from witches and evil spirits' — CC Adi 13.117; at Nimai's 'vayu' people say 'a
      demon has seized him', 'it's a witch's doing' — CB Adi 12.79; the brahma-rakshasa — CC Antya 2.156; the
      fisherman fears a ghost, Svarupa 'exorcises' it invoking Nrisimha — CC Antya 18.57–63; 'tears at an auspicious
      rite are a bad sign' — Karnapura, sarga 3 v. 52. The chirp of a lizard is a bad omen for all classes of Bengal —
      Day 1874, p. 8–9 **[late]**. The infant's protections — mc-protective-mantras, mc-tiger-claw, mc-name-nimai.
  text:
    ru: >-
      Мир бенгальской деревни полон невидимых обитателей: бхуты и преты бродят у воды и на пустырях, ведьма-даини может
      сглазить красивого ребёнка, а стрёкот ящерицы с крыши заставляет отложить выход из дома. Слёзы на свадьбе или
      иной благой церемонии считаются недобрым знаком — Шачи даже унимает плачущего сына. Но вайшнавские жития всё
      время переворачивают этот страх: лучшая защита — имя Господа. Джаганнатха Мишра, боясь за сына, не идёт к
      заклинателю, а молится Кришне; Сварупа Дамодара «изгоняет духа» из рыбака, призывая Нрисимху; а Нимай учит мать,
      что нечисто лишь то место, где не помнят о Боге.
    en: >-
      The world of a Bengali village is full of unseen inhabitants: bhutas and pretas roam by the water and on waste
      ground, a witch, a daini, can cast the evil eye on a beautiful child, and a lizard chirping on the roof makes one
      put off leaving the house. Tears at a wedding or other auspicious ceremony are a bad sign — Shachi even hushes
      her weeping son. But the Vaishnava hagiographies keep turning this fear around: the best protection is the
      Lord's name. Jagannatha Mishra, afraid for his son, goes not to an exorcist but prays to Krishna; Svarupa
      Damodara 'drives the ghost' out of the fisherman by invoking Nrisimha; and Nimai teaches His mother that only that
      place is unclean where God is not remembered.
  hagiography: ["ЧБ Ади 8.83–91", "ЧЧ Ади 13.117", "ЧБ Ади 12.79", "ЧЧ Антья 2.156", "ЧЧ Антья 18.57–63",
                "Карнапура, сарга 3, ст. 52"]
  sources: ["Lal Behari Day, Bengal Peasant Life, 1874/1916, p. 8–9"]
  images: []
  game: {model: "ящерица-геккон на стропилах (звук «тик-тик-тик»); тёмный пустырь у воды", where: ["mishra-house/courtyard"],
         notes: "без хоррора; страх снимается именем Хари"}
  todo: "Карнапура 3.48–53: утро свадебного дня, обряд почитания предков; Нимай плачет, вспомнив отца, Шачи с женщинами унимает Его. Бенгальские слова для «сглаза» (*нажар*? *дришти*?) — по PD."

# ── Развлечения ─────────────────────────────────────────────────────────────────────────────────────────

- id: mc-house-drama
  title: {ru: "Представление в доме Чандрашекхары", en: "The play in Chandrashekhara's house"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Мадхья 18.6–101: Господь объявляет «танец по правилам действа (*анка*)», Садашива и Буддхиманта Кхан готовят
      облачения — раковины-браслеты, корсажи, шёлковые сари, украшения — и натягивают большой шатёр (18.7–16);
      распределение ролей (18.9–12); Харидас в роли стража-*котала* с подкрученными усами, тюрбаном и палкой
      (18.39–48); Шривас — Нарада с белой бородой и пятнышками сандала, Рамай несёт ему кувшин и подстилку (18.50–53);
      Шриман держит факел (18.11); женщины семей смотрят (18.29–30); Господь в облике Лакшми/Рукмини — ЧЧ Ади 10.13,
      17.241; письмо Рукмини, написанное слезами на полу, — ЧБ Мадхья 18.72–73; «первую прахару длилось действо» —
      18.101. Спектакль «Дана-кели» у Гададхара даса — ЧЧ Ади 11.17. Слово для стража — сверить по транслиту.
    en: >-
      CB Madhya 18.6–101: the Lord announces 'a dance by the rules of a play (*anka*)', Sadashiva and Buddhimanta Khan
      prepare costumes — conch bangles, bodices, silk saris, ornaments — and put up a large awning (18.7–16); the
      casting (18.9–12); Haridasa as the guard, *kotala*, with twirled moustache, turban and stick (18.39–48); Shrivasa
      as Narada with a white beard and dots of sandal, Ramai carrying his water-pot and mat (18.50–53); Shriman holds
      the torch (18.11); the women of the families watch (18.29–30); the Lord in the form of Lakshmi/Rukmini — CC Adi
      10.13, 17.241; Rukmini's letter written with tears on the floor — CB Madhya 18.72–73; 'the play lasted the first
      prahara' — 18.101. The play 'Dana-keli' at Gadadhara Dasa's — CC Adi 11.17. The word for the guard — check in
      the transliteration.
  text:
    ru: >-
      Театра как здания не было: играли во дворе или в доме, под натянутым навесом, при свете факела, а зрители
      садились на циновки вокруг. Однажды Махапрабху объявил, что сегодня будет «танцевать действо», и Буддхиманта Кхан
      собрал для всех костюмы — шёлковые сари, корсажи, браслеты и украшения. Первым вышел Харидас — грозный страж с
      подкрученными усами, в большом тюрбане и с палкой: «Братья, будьте бдительны!» — все смеялись. За ним Шривас —
      Нарада с белой бородой, и Рамай с кувшином и подстилкой, а потом Гададхара в облике Рукмини и, наконец, Сам
      Господь в облачении Лакшми, так что матери и жёны вайшнавов, пришедшие посмотреть, не узнавали Его и плакали от
      любви.
    en: >-
      There was no theatre as a building: plays were acted in a courtyard or a house under a stretched awning, by
      torchlight, with the audience on mats around. One day Mahaprabhu announced that today He would 'dance a play',
      and Buddhimanta Khan gathered costumes for everyone — silk saris, bodices, bangles and ornaments. First came
      Haridasa — a fierce guard with twirled moustache, a big turban and a stick: 'Brothers, be alert!' — everyone
      laughed. After him Shrivasa as Narada with a white beard, and Ramai with water-pot and mat, then Gadadhara as
      Rukmini and at last the Lord Himself in the guise of Lakshmi, so that the mothers and wives of the Vaishnavas who
      had come to watch did not recognise Him and wept with love.
  hagiography: ["ЧБ Мадхья 18.6–101", "ЧЧ Ади 10.13", "ЧЧ Ади 17.241", "ЧЧ Ади 11.17"]
  sources: []
  images: []
  game: {model: "навес-шамиана над двором, факел, костюмы: накладная борода, тюрбан стража, шёлковые сари",
         where: ["chandrashekhara-house/courtyard"], notes: "сцена-спектакль; см. mc-pretend-lila-games"}

# ── Запахи и цвета ──────────────────────────────────────────────────────────────────────────────────────

- id: mc-scents
  title: {ru: "Запахи эпохи", en: "The smells of the age"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Сандал — mc-sandal-paste, ароматное сандаловое масло, разбитое Джагаданандой: «если кто-то ощутит аромат, решит,
      что Я *дари-санньяси*» — ЧЧ Антья 12.102–119; *агуру* — ЧЧ Ади 6.67; камфора в сладком рисе и прасаде — ЧЧ
      Антья 6.58, 1.180; мускус и голубой лотос — ЧЧ Антья 15.22; цветы *маллика, малати* в лунные ночи чайтры — ЧЧ
      Мадхья 1.58, Антья 1.160; *чатухсама* (смесь четырёх благовоний) — ЧЧ Антья 4.197; ароматные *панч-куди* — ЧЧ
      Антья 10.35; гнилой запах испорченного прасада, который не едят даже коровы у Львиных врат — ЧЧ Антья 6.316;
      жасмины — mc-jasmines; торговцы ароматами — mc-perfumer-florist. Запахи двора и кухни (дым кизяка, горчичное
      масло) — по Day 1874 и kitchen.yaml, в житиях не названы.
    en: >-
      Sandal — mc-sandal-paste, the scented sandal oil smashed by Jagadananda: 'anyone who smells it will think I am a
      *dari-sannyasi*' — CC Antya 12.102–119; *aguru* — CC Adi 6.67; camphor in sweet rice and prasada — CC Antya 6.58,
      1.180; musk and blue lotus — CC Antya 15.22; *mallika, malati* flowers on the moonlit nights of Chaitra — CC
      Madhya 1.58, Antya 1.160; *chatuhsama* (a blend of four fragrances) — CC Antya 4.197; scented *panch-kudi* — CC
      Antya 10.35; the rotten smell of spoilt prasada that even the cows at the Lion Gate won't eat — CC Antya 6.316;
      jasmines — mc-jasmines; perfume sellers — mc-perfumer-florist. Smells of yard and kitchen (dung-cake smoke,
      mustard oil) — after Day 1874 and kitchen.yaml, not named in the hagiographies.
  text:
    ru: >-
      Утро в Навадвипе пахнет дымом кизяка и соломы из очагов, речной водой и свежей обмазкой пола; к полудню — жареным
      в горчичном масле и топлёным маслом-гхи. В доме, где поклоняются Господу, — сандал, растёртый на камне,
      благовонная смола агуру в курильнице, камфора в лампаде арати и в сладком рисе, цветочные гирлянды. Весенними
      лунными ночами веет жасмином-малати и малликой. Запах — и знак: Господь-санньяси отказывается от кувшина
      ароматного сандалового масла, потому что прохожие, учуяв его, сочли бы Его щёголем, а не отрешённым монахом.
    en: >-
      Morning in Navadvipa smells of dung-cake and straw smoke from the hearths, river water and fresh floor plaster;
      by noon, of frying in mustard oil and of ghee. In a house where the Lord is worshipped there is sandal ground on
      a stone, fragrant aguru resin in the censer, camphor in the arati lamp and in the sweet rice, flower garlands. On
      spring moonlit nights the air is full of malati and mallika jasmine. A smell is also a sign: the sannyasi Lord
      refuses a jar of scented sandal oil because passers-by smelling it would take Him for a dandy, not a renunciant.
  hagiography: ["ЧЧ Антья 12.102–119", "ЧЧ Ади 6.67", "ЧЧ Антья 6.58", "ЧЧ Антья 1.180", "ЧЧ Антья 15.22",
                "ЧЧ Мадхья 1.58", "ЧЧ Антья 4.197", "ЧЧ Антья 10.35", "ЧЧ Антья 6.316"]
  sources: []
  images: []
  game: {model: "кодекс-«ароматы»: подписи к предметам (сандаловый камень, курильница-дхупа, камфора, гирлянда)",
         where: ["mishra-house/thakur-ghar", "mishra-house/kitchen"], notes: "в игре — текстовые описания запахов"}

- id: mc-colours
  title: {ru: "Язык цвета", en: "The language of colour"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Синие одежды Нитьянанды-Баларамы (ЧБ Мадхья 3.144; Лочан, Мадхья-кханда, ч. 10, ст. 4; Мурари 4.23.13) — и
      синие одежды разбойников «как у героев» (ЧБ Антья 5.569); мусульманский святой в чёрном (ЧЧ Мадхья 18.185);
      белое — тонкие белые одежды (ЧЧ Антья 18.83), белые одежды мусульман (mc-muslim-dress); алая ткань санньяси —
      mc-aruna-vastra; киноварь, куркума, красная сандаловая паста в подношении (ЧЧ Ади 17.39); синдур замужней —
      mc-sindur-kunkuma; «золотой» Гаура и «тёмный» Кришна в жёлтых одеждах (ЧЧ Ади 3.39, 3.49); краски — mc-dyes.
      Вдовье белое — по этнографии XIX в. (todo).
    en: >-
      The blue garments of Nityananda-Balarama (CB Madhya 3.144; Lochana, Madhya-khanda pt. 10 v. 4; Murari 4.23.13) —
      and the robbers' blue clothes 'like heroes' (CB Antya 5.569); the Muslim holy man in black (CC Madhya 18.185);
      white — fine white garments (CC Antya 18.83), Muslims' white clothes (mc-muslim-dress); the sannyasi's ochre —
      mc-aruna-vastra; vermilion, turmeric, red sandal paste in an offering (CC Adi 17.39); the married woman's
      sindur — mc-sindur-kunkuma; 'golden' Gaura and 'dark' Krishna in yellow garments (CC Adi 3.39, 3.49); dyes —
      mc-dyes. Widow's white — after 19th-c. ethnography (todo).
  text:
    ru: >-
      Цвет одежды говорил о человеке издалека. Белый — обычный цвет хлопковых дхоти и сари, цвет брахмана и
      мусульманина в тонкой рубахе, а у вдовы — белое без каймы. Алая полоска синдура в проборе означает замужнюю
      женщину, алая-охряная ткань — санньяси, отрёкшегося от мира. Синий — цвет Баларамы, и Нитьянанда, Его
      проявление, ходит в синих одеждах и синем тюрбане; в синее же, «как герои», облачаются разбойники, идущие на
      ночной набег. Жёлтый, цвет куркумы, — праздник и свадьба, и в жёлтых одеждах — тёмный Кришна; а Сам Махапрабху
      — «Гаура», золотой, словно расплавленное золото.
    en: >-
      The colour of clothes told about a person from afar. White is the ordinary colour of cotton dhotis and saris,
      the colour of the brahmin and of the Muslim in his fine shirt, and for a widow — white without a border. A red
      streak of sindur in the parting marks a married woman, red-ochre cloth a sannyasi who has renounced the world.
      Blue is Balarama's colour, and Nityananda, His manifestation, goes in blue garments and a blue turban; robbers
      setting out on a night raid also dress in blue, 'like heroes'. Yellow, the colour of turmeric, means festival
      and wedding, and dark Krishna wears yellow; while Mahaprabhu Himself is 'Gaura', golden, like molten gold.
  hagiography: ["ЧБ Мадхья 3.144", "Лочан, Мадхья-кханда, ч. 10, ст. 4", "ЧБ Антья 5.569", "ЧЧ Мадхья 18.185",
                "ЧЧ Антья 18.83", "ЧЧ Ади 17.39", "ЧЧ Ади 3.39", "ЧЧ Ади 3.49"]
  sources: []
  images: []
  game: {model: "палитра персонажей: белый/кремовый хлопок, синий (индиго) Нитьянанды, охра санньяси, жёлтый
         (куркума), алый синдур", where: ["navadvipa/lane"], notes: "единая палитра для художников"}
  todo: "Вдовье белое без каймы — подтвердить по ранним источникам (Мукундарам? Ward 1815?)."

# ── Письма ──────────────────────────────────────────────────────────────────────────────────────────────

- id: mc-letters-riddles
  title: {ru: "Письма: царские, тайные и загадка Адвайты", en: "Letters: royal, secret, and Advaita's riddle"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Загадка-*тарджа* Адвайты через Джагадананду: «Скажи безумцу: все стали безумны; на рынке больше не продают рис;
      безумец больше не занят делами; это сказал безумец» — ЧЧ Антья 19.15–31; Камалаканта пишет царю Пратапарудре о
      долге Адвайты — Господь огорчён (ЧЧ Ади 12.29–33); царь шлёт письма Сарвабхауме из Катака (ЧЧ Мадхья 12.5–12);
      Рамананда пишет царю «с позволения Господа» (ЧЧ Мадхья 9.330); отец Рагхунатхи — письмо Шивананде (ЧЧ Антья
      6.180–182, 6.247); Господь в спектакле пишет письмо Рукмини «чернилами слёз на бумаге пола пальцем-пером» (ЧБ
      Мадхья 18.72). Гонцы и вести вообще — mc-messengers (transport.yaml).
    en: >-
      Advaita's riddle, *tarja*, via Jagadananda: 'Tell the madman: everyone has gone mad; rice is no longer sold in the
      market; the madman is no longer busy with affairs; a madman said this' — CC Antya 19.15–31; Kamalakanta writes to
      King Prataparudra about Advaita's debt — the Lord is displeased (CC Adi 12.29–33); the king sends letters to
      Sarvabhauma from Cuttack (CC Madhya 12.5–12); Ramananda writes to the king 'with the Lord's permission' (CC
      Madhya 9.330); Raghunatha's father writes to Shivananda (CC Antya 6.180–182, 6.247); the Lord in the play writes
      Rukmini's letter 'with tears for ink on the paper of the floor with His finger for a pen' (CB Madhya 18.72).
      Messengers and news in general — mc-messengers (transport.yaml).
  text:
    ru: >-
      Письмо писали на полоске пальмового листа, процарапывая буквы и втирая сажу, сворачивали и перевязывали нитью;
      несли его гонцы, паломники, чиновники. Царь Пратапарудра из столицы Катака шлёт Сарвабхауме письмо за письмом,
      умоляя устроить ему встречу с Господом; отец Рагхунатхи пишет Шивананде: «верни мне моего сына». Но самое
      знаменитое послание житий — устное. Адвайта Ачарья передал Махапрабху с Джагаданандой загадку: «Скажи безумцу,
      что все люди стали безумны, что рис на рынке больше не продаётся, что безумец больше не занят делами, — скажи
      безумцу, что это сказал безумец». Господь лишь улыбнулся: «Таково его повеление», — и с того дня Его разлука с
      Кришной стала вдвое сильнее.
    en: >-
      A letter was written on a strip of palm leaf, the letters scratched in and rubbed with soot, then rolled and tied
      with thread; couriers, pilgrims and officials carried it. King Prataparudra in his capital Cuttack sends
      Sarvabhauma letter after letter begging him to arrange a meeting with the Lord; Raghunatha's father writes to
      Shivananda: 'give me back my son'. But the most famous message of the hagiographies was spoken. Advaita Acharya
      sent Mahaprabhu a riddle through Jagadananda: 'Tell the madman that all people have gone mad, that rice is no
      longer sold in the market, that the madman is no longer busy with affairs — tell the madman that a madman said
      this.' The Lord only smiled: 'Such is his command,' — and from that day His separation from Krishna grew twice
      as strong.
  hagiography: ["ЧЧ Антья 19.15–31", "ЧЧ Ади 12.29–33", "ЧЧ Мадхья 12.5–12", "ЧЧ Мадхья 9.330",
                "ЧЧ Антья 6.180–182", "ЧЧ Антья 6.247", "ЧБ Мадхья 18.72"]
  sources: []
  images: []
  game: {model: "свёрнутое письмо на пальмовом листе (≈ 30 × 4 см), перевязанное нитью", where: ["puri/gambhira"],
         notes: "техника письма на листе — см. mc-manuscript-ink; бумага в Бенгалии XVI в. — проверить"}
  todo: "Писали ли письма в Бенгалии ок. 1500 г. на бумаге (персидская канцелярия) или на пальмовом листе — по PD."

# ── Мусульманский мир ───────────────────────────────────────────────────────────────────────────────────

- id: mc-pirs-fakirs
  title: {ru: "Пиры и факиры: мусульманские святые", en: "Pirs and fakirs: Muslim holy men"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Санатана льстит тюремщику: «ты — *джинда-пир*, живой святой, сведущ в Коране» — ЧЧ Мадхья 20.5; среди
      всадников-патанов — человек в чёрной одежде, которого «простые люди называли святым», учёный в Коране, спорит
      с Господом и становится Рамдасом — ЧЧ Мадхья 18.185–207; патаны после встречи «стали странствующими
      аскетами — патана-вайшнавами» — 18.210–212. *Пир* — мусульманский святой, а также его гробница, место
      паломничества; *факир* — араб. «бедный», нищенствующий дервиш, позднее и о индусских аскетах — HJ 1903, s.v.
      PEER, FAKEER. Гробницы пиров в Бенгалии XVI в. — по житиям не засвидетельствованы (todo).
    en: >-
      Sanatana flatters the jailer: 'you are a *jinda-pir*, a living saint, learned in the Quran' — CC Madhya 20.5;
      among the Pathan horsemen is a man in black whom 'ordinary people called a saint', learned in the Quran, who
      argues with the Lord and becomes Ramadasa — CC Madhya 18.185–207; after the meeting the Pathans 'became
      wandering ascetics — Pathan Vaishnavas' — 18.210–212. *Pir* — a Muslim saint, also his tomb, a place of
      pilgrimage; *fakir* — Arabic 'poor', a mendicant dervish, later also of Hindu ascetics — HJ 1903, s.v. PEER,
      FAKEER. Tombs of pirs in 16th-c. Bengal are not attested in the hagiographies (todo).
  text:
    ru: >-
      У мусульман Бенгалии были свои святые: пир — наставник и чудотворец, к чьей гробнице после смерти ходят с
      обетами и индусы, и мусульмане; факир — «бедняк перед Богом», странствующий дервиш в рубище. Святым считали и
      учёного знатока Корана: в отряде патанов, встретивших Господа на пути из Матхуры, был такой человек в чёрной
      одежде. Он начал доказывать Господу по Корану, что Бог безличен, — и, выслушав Его, признал, что высшая цель
      Корана — служение личному Господу; его нарекли Рамдасом. А Санатана, уговаривая тюремщика-мусульманина,
      называет его «живым пиром», — знак того, как высоко ставили это звание.
    en: >-
      Bengal's Muslims had their own holy men: the pir — a guide and wonder-worker to whose tomb, after his death,
      both Hindus and Muslims come with vows; the fakir — 'poor before God', a wandering dervish in rags. A learned
      master of the Quran was also counted a saint: in the band of Pathans who met the Lord on the road from Mathura
      there was such a man, dressed in black. He began to prove to the Lord from the Quran that God is impersonal —
      and, having heard Him, admitted that the Quran's highest aim is service to the personal Lord; he was named
      Ramadasa. And Sanatana, persuading his Muslim jailer, calls him 'a living pir' — a sign of how highly that title
      was held.
  hagiography: ["ЧЧ Мадхья 20.5", "ЧЧ Мадхья 18.185–212"]
  sources: ["Hobson-Jobson, 1903, s.v. PEER, FAKEER"]
