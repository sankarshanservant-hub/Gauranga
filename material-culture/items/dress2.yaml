- id: mc-kaupina-bahirvasa
  title: {ru: "Каупина и бахирвас — одежда отречённого", en: "Kaupina and bahirvasa — the renunciant's clothing"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 3.29 (одна каупина после омовения), 7.36 (в путь — каупина, накидка, кувшин), 7.60 (четыре набора),
      19.86, 20.78 (Санатана делает из старого дхоти две бахирвасы и две каупины); ЧБ Мадхья 12.22–31, Лочан Мадхья
      ч. 6.73–76, Мурари 2.10.7–8 (лоскутки каупины Нитьянанды); ЧЧ Антья 18.73.
    en: >-
      CC Madhya 3.29 (a single kaupina after bathing), 7.36 (for the road — kaupina, outer cloth, water pot), 7.60 (four
      sets), 19.86, 20.78 (Sanatana makes two bahirvasas and two kaupinas from an old dhoti); CB Madhya 12.22–31,
      Lochana Madhya pt. 6.73–76, Murari 2.10.7–8 (shreds of Nityananda's kaupina); CC Antya 18.73.
  text:
    ru: >-
      Вся одежда санньяси — две вещи: *каупина*, узкая набедренная повязка, и *бахирвас*, внешняя ткань, которой
      обёртывали бёдра или покрывали плечи. Махапрабху, уходя на юг, взял только каупину, накидку и кувшин для воды, а
      Сарвабхаума заранее приготовил Ему четыре таких набора. Санатана Госвами попросил у Тапаны Мишры не новую одежду,
      а поношенное дхоти — и разрезал его на две каупины и две бахирвасы. Лоскутки каупины Нитьянанды преданные
      повязывали на голову как святыню.
    en: >-
      A sannyasi's entire wardrobe was two things: the *kaupina*, a narrow loincloth, and the *bahirvasa*, the outer
      cloth wrapped round the hips or over the shoulders. Leaving for the south, Mahaprabhu took only a kaupina, an
      outer cloth and a water pot, and Sarvabhauma had four such sets ready for Him. Sanatana Gosvami asked Tapana
      Mishra not for new clothes but for a worn dhoti — and cut it into two kaupinas and two bahirvasas. Devotees tied
      shreds of Nityananda's kaupina round their heads as a holy relic.
  hagiography: ["ЧЧ Мадхья 3.29", "ЧЧ Мадхья 7.36", "ЧЧ Мадхья 7.60", "ЧЧ Мадхья 19.86", "ЧЧ Мадхья 20.76–78",
                "ЧЧ Антья 18.73", "ЧБ Мадхья 12.22–31", "Лочан, Мадхья-кханда, ч. 6, ст. 73–76", "Мурари 2, сарга 10, ст. 7–8"]
  sources: []
  images: []
  game: {model: "каупина — полоса ткани ≈15×150 см на поясном шнуре; бахирвас — отрез ≈1×2,5 м, цвет охры; сушатся на верёвке",
         where: ["puri/gambhira"]}

- id: mc-aruna-vastra
  title: {ru: "Алая ткань санньяси (аруна-васана)", en: "The sannyasi's ochre cloth (aruna-vasana)"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Мадхья 28.161 (*арун̣а васана*); ЧЧ Мадхья 7.79, 8.18, 5.136 (шафрановые одежды); Мурари 3.4.14, Карнапура
      14.88 (красная/киноварная ткань); ЧЧ Мадхья 10.108 (*йогапатта* не дали Сварупе); ЧЧ Антья 13.52–61 (красная
      ткань от Мукунды Сарасвати; «вайшнаву не подобает»); ЧБ Антья 6.19 (Нитьянанда сменил шафран на шёлк).
      Окраска охрой *гери* — ЧЧ Антья 13.7.
    en: >-
      CB Madhya 28.161 (*aruna vasana*); CC Madhya 7.79, 8.18, 5.136 (saffron garments); Murari 3.4.14, Karnapura 14.88
      (red/vermilion cloth); CC Madhya 10.108 (Svarupa not given the *yogapatta*); CC Antya 13.52–61 (red cloth from
      Mukunda Sarasvati; "unfitting for a Vaishnava"); CB Antya 6.19 (Nityananda changed saffron for silk). Dyeing
      with *geri* ochre — CC Antya 13.7.
  text:
    ru: >-
      Приняв санньясу в Катве, Махапрабху облачился в *аруна-васану* — ткань цвета утренней зари, красновато-шафрановую,
      какую красили охрой-геру. Такой цвет был знаком отречения: Сварупе Дамодаре, отказавшемуся от шикхи и шнура,
      эту ткань так и не дали, а Джагадананда, получив от Санатаны красную ткань, сперва решил, что это подарок
      Самого Господа. Носить её вайшнаву-домохозяину не подобало. Нитьянанда же, по воле Господа, снял шафран и носил
      шёлк и гирлянды, ведь Он — Баларама, а не монах-аскет.
    en: >-
      Taking sannyasa at Katwa, Mahaprabhu put on the *aruna-vasana* — cloth the colour of dawn, a reddish saffron, such
      as was dyed with geru ochre. The colour marked renunciation: Svarupa Damodara, though he gave up his shikha and
      thread, was never given this cloth, and Jagadananda, receiving a red cloth from Sanatana, at first thought it a
      gift from the Lord Himself. A householder Vaishnava was not to wear it. Nityananda, by the Lord's will, gave up
      saffron and wore silk and garlands, for He is Balarama, not an ascetic monk.
  hagiography: ["ЧБ Мадхья 28.161", "ЧЧ Мадхья 7.79", "ЧЧ Мадхья 8.18", "ЧЧ Мадхья 10.108", "ЧЧ Антья 13.52–61",
                "ЧБ Антья 6.19", "Мурари 3, сарга 4, ст. 14", "Карнапура, сарга 14, ст. 88"]
  sources: ["Mukharji 1888, с. 13 (геру — красная охра)"]
  images: []
  game: {model: "ткань цвета зари/охры (≈ #C8582B…#E07B39), не ярко-оранжевая; та же ткань у Кешавы Бхарати",
         where: ["katwa", "puri/gambhira"]}
  todo: "Оттенок: «аруна» — красноватый, «шафран» перевода — условность; уточнить у специалиста."

- id: mc-danda-kamandalu
  title: {ru: "Данда и камандалу", en: "Danda and kamandalu"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Мадхья 28.163 (данда и камандалу при санньясе); ЧБ Антья 2.203–232 (данда — бамбуковая трость, «в ней все
      боги»; Нитьянанда ломает её на три части; «триданда»); ЧЧ Мадхья 7.20; ЧБ Мадхья 5.62–73 (Нитьянанда ломает свою
      данду и камандалу, обломки — в Гангу); ЧБ Мадхья 3.144 (сосуд, обёрнутый тростником); ЧБ Антья 6.20, Мурари
      4.23.14 (железный посох Нитьянанды).
    en: >-
      CB Madhya 28.163 (danda and kamandalu at sannyasa); CB Antya 2.203–232 (the danda a bamboo staff, "all gods dwell
      in it"; Nityananda breaks it in three; "tridanda"); CC Madhya 7.20; CB Madhya 5.62–73 (Nityananda breaks His own
      danda and kamandalu, the pieces go into the Ganga); CB Madhya 3.144 (a pot wrapped in cane); CB Antya 6.20,
      Murari 4.23.14 (Nityananda's iron staff).
  text:
    ru: >-
      Посох-данда и сосуд для воды камандалу — знаки санньяси, их вручают вместе с алой тканью. Данда Махапрабху была
      из бамбука; Он говорил, что в ней пребывают все боги, и звал её Своей единственной спутницей. По дороге в Пури
      Нитьянанда, державший её, переломил данду на три части и бросил в реку Бхарги близ Камалапура: по Его словам, Тому, Кого Он носит в
      сердце, не пристало носить палку. Камандалу носили как кувшин для воды — у Нитьянанды он был обёрнут плетёным
      тростником.
    en: >-
      The staff (danda) and the water pot (kamandalu) are the sannyasi's insignia, given together with the ochre cloth.
      Mahaprabhu's danda was of bamboo; He said all the gods dwell in it and called it His only companion. On the road
      to Puri Nityananda, who was holding it, broke it in three and threw it into the river Bhargi near Kamalapura: the One He carried in His
      heart, He said, should not have to carry a stick. The kamandalu served as a water pot — Nityananda's was wrapped
      in woven cane.
  hagiography: ["ЧБ Мадхья 28.163", "ЧБ Антья 2.203–232", "ЧЧ Мадхья 5.141–158", "ЧЧ Мадхья 7.20", "ЧБ Мадхья 5.62–73",
                "ЧБ Мадхья 3.144", "ЧБ Антья 6.20"]
  sources: []
  images: []
  game: {model: "бамбуковый посох в рост человека (≈1,8 м) с узлами; камандалу — сосуд из сушёной тыквы/глины/латуни с ручкой, в оплётке",
         where: ["katwa", "road-to-puri"]}
  todo: "Материал камандалу Господа в житиях не назван (тыква-лаука? глина?) — вопрос к специалисту."

- id: mc-sannyasa-shaving
  title: {ru: "Бритьё головы: цирюльник в Катве", en: "Shaving the head: the barber at Katwa"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Мадхья 28.139–153 (*на̄пита* с бритвой-*кш̣ура*, не может коснуться вьющихся волос, к концу дня голова обрита,
      затем омовение в Ганге); ЧЧ Мадхья 3.152 (печаль о длинных локонах); ЧЧ Мадхья 20.68–70 (Санатану бреют и
      отводят к Ганге); ЧБ Ади 6.3 (детское обривание — чудакарана). Имя цирюльника (Дева/Мадху) — по позднему
      преданию у Sen 1911, с. 389.
    en: >-
      CB Madhya 28.139–153 (the *napita* with his razor, *kshura*, cannot touch the curly hair; by day's end the head is
      shaved; then a bath in the Ganga); CC Madhya 3.152 (grief for the long locks); CC Madhya 20.68–70 (Sanatana is
      shaved and taken to the Ganga); CB Adi 6.3 (a child's tonsure — chudakarana). The barber's name (Deva/Madhu) —
      from later tradition in Sen 1911, p. 389.
  text:
    ru: >-
      Перед санньясой Махапрабху сел, чтобы Ему обрили голову вместе с шикхой. Пришёл деревенский цирюльник с бритвой —
      и не смог: увидев вьющиеся волосы Господа, он заплакал и не решался коснуться Его головы, а вокруг рыдали
      преданные и простые жители Катвы. Господь то и дело поднимался в киртане, и лишь к концу дня работа была
      окончена; после бритья Он омылся в Ганге. Цирюльник (*напит*) был в каждой деревне: он брил, стриг ногти,
      участвовал в обрядах — без него не обходились ни свадьба, ни санньяса.
    en: >-
      Before sannyasa Mahaprabhu sat to have His head shaved, shikha and all. The village barber came with his razor —
      and could not do it: seeing the Lord's curling hair he wept and dared not touch His head, while the devotees and
      the plain folk of Katwa wept around them. Again and again the Lord rose up in kirtan, and only at the end of the
      day was the work done; after the shaving He bathed in the Ganga. Every village had its barber (*napit*): he shaved,
      pared nails and took part in rites — neither a wedding nor a sannyasa could do without him.
  hagiography: ["ЧБ Мадхья 28.139–153", "ЧЧ Мадхья 3.152", "ЧЧ Мадхья 20.68–70", "ЧБ Ади 6.3"]
  sources: ["Sen 1911, с. 389", "Taylor 1840, с. 260 (цирюльник в свадебной смете бедняка)", "Bose 1881, с. 169 (лишить цирюльника — кастовое наказание)"]
  images: [{file: "material-culture/img/tayler-1842-village-bengal-barber.jpg", license: "PD (Public Domain Mark 1.0)", author: "William Tayler, лит. O. Bouvier (1842); Wellcome Collection 37172i", url: "https://wellcomecollection.org/works/xdevqe2e"}]
  game: {model: "цирюльник с открытой бритвой, медной чашечкой воды и ящичком; сидит на корточках перед сидящим", where: ["katwa"]}

# --- Порция 3: одежда по людям ---

- id: mc-widow-dress
  title: {ru: "Вдова: белая ткань без украшений", en: "The widow: white cloth, no ornaments"}
  rubric: dress
  era_evidence: epoch
  evidence_note:
    ru: >-
      Эпоха: «Манаса-мангал» (Виджай Гупта, 1494, и др.) — вдовы Чанда надевают белое вдовье сари, стирают синдур,
      ломают раковинные браслеты (Sen 1911, с. 262). Жития: Шачи — «овдовевшая матушка» (ЧБ Мадхья 26.174, 27.32);
      вдова брахмана — ЧЧ Антья 3.15–16; Лакшахира оставляет одну ткань и бреет голову — ЧЧ Антья 3.139 (обет
      отречения, не вдовство). Позднее: вдова без цветной каймы и украшений, кроме бус, голова обрита — Solvyns 1804,
      pl. XXXVIII; простые белые дхоти вдов — N. G. Mukerji 1903.
    en: >-
      Period: the Manasa-mangal (Vijay Gupta, 1494, and others) — Chand's widowed daughters-in-law put on the widow's
      white sari, wipe away their sindur and break their shell bangles (Sen 1911, p. 262). Hagiographies: Shachi, "the
      widowed mother" (CB Madhya 26.174, 27.32); a brahmin's widow — CC Antya 3.15–16; Lakshahira keeps one cloth and
      shaves her head — CC Antya 3.139 (a vow of renunciation, not widowhood). Later: a widow with no coloured border
      and no ornaments but beads, head shaved — Solvyns 1804, pl. XXXVIII; plain white dhotis for widows — N. G.
      Mukerji 1903.
  text:
    ru: >-
      Овдовев, бенгальская женщина стирала синдур с пробора, ломала раковинные браслеты и надевала белую ткань без
      цветной каймы; украшения она больше не носила, разве что простые бусы. Так описывают вдов уже поэты конца XV в.
      После ухода Джаганнатхи Мишры такой стала и Шачи-мата: преданные, отговаривая Нимая от санньясы, напоминали Ему,
      что Он — единственная опора овдовевшей матери. Вдова вела строгую жизнь: постилась, ела раз в день и посвящала
      себя служению Господу и семье.
    en: >-
      Widowed, a Bengali woman wiped the sindur from her parting, broke her shell bangles and put on white cloth with no
      coloured border; she wore ornaments no more, save perhaps plain beads. So poets of the late 15th century already
      describe widows. After Jagannatha Mishra's departure Shachi-mata became such a widow: when devotees tried to
      dissuade Nimai from sannyasa, they reminded Him that He was the only support of His widowed mother. A widow led a
      strict life: she fasted, ate once a day and gave herself to serving the Lord and the family.
  hagiography: ["ЧБ Мадхья 26.174", "ЧБ Мадхья 27.32", "ЧЧ Антья 3.15–16", "ЧЧ Антья 3.139"]
  sources: ["Sen 1911, с. 262 (Манаса-мангал)", "Solvyns 1804, pl. XXXVIII", "N. G. Mukerji 1903 (белые дхоти вдов)", "Taylor 1840, с. 265"]
  images: []
  game: {model: "Шачи после смерти мужа: белое сари без каймы, голова покрыта краем, без шакхи и синдура; тонкие бусы",
         where: ["mishra-house/courtyard"]}
  todo: "Брили ли вдовы голову в Бенгалии XVI в.? (Сольвинс — кон. XVIII в.) Однократное питание и экадаши вдов — подтвердить ранним текстом."

- id: mc-bhota-kambala
  title: {ru: "Шерстяной плед за три золотых", en: "The woollen blanket worth three gold coins"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 20.36 (старый плед), 20.44 (*бхот̣а-камбала* от Шриканты), 20.82–92 (Господь поглядывает на плед;
      «ценой в три золотых»; обмен на старую накидку у Ганги). *Бхота* — Тибет/Бутан, откуда шла шерсть.
    en: >-
      CC Madhya 20.36 (an old blanket), 20.44 (a *bhota-kambala* from Shrikanta), 20.82–92 (the Lord glances at the
      blanket; "worth three gold coins"; exchanged for an old cloth by the Ganga). *Bhota* — Tibet/Bhutan, whence the
      wool came.
  text:
    ru: >-
      Шерсть в жаркой Бенгалии была роскошью: тёплые пледы-*камбалы* привозили с гор, из «Бхота» — Тибета и Бутана.
      Когда бежавший из тюрьмы Санатана шёл в Каши, зять Шрикант подарил ему новый бхотский плед. Махапрабху ничего не
      сказал, но то и дело поглядывал на него; Санатана понял, пошёл к Ганге и выменял плед на старую, протёртую
      накидку бенгальца, сушившего её на берегу. Тогда Господь объяснил: плед ценой в три золотых не к лицу тому, кто
      живёт подаянием.
    en: >-
      Wool was a luxury in hot Bengal: warm *kambala* blankets came from the mountains, from "Bhota" — Tibet and Bhutan.
      When Sanatana, escaped from prison, was on his way to Kashi, his brother-in-law Shrikanta gave him a new Bhota
      blanket. Mahaprabhu said nothing but kept glancing at it; Sanatana understood, went to the Ganga and traded the
      blanket for the old, threadbare cloth of a Bengali who was drying it on the bank. Then the Lord explained: a
      blanket worth three gold coins does not befit one who lives on alms.
  hagiography: ["ЧЧ Мадхья 20.36", "ЧЧ Мадхья 20.42–44", "ЧЧ Мадхья 20.82–92"]
  sources: []
  images: []
  game: {model: "плотный серо-бурый шерстяной плед с полосой, ≈1,5×2 м; рядом — выцветшая протёртая хлопковая накидка",
         where: ["kashi/ganga-ghat"]}

- id: mc-wealthy-brahmin
  title: {ru: "Убор богатого брахмана: Пундарика Видьянидхи", en: "A wealthy brahmin's style: Pundarika Vidyanidhi"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Мадхья 7.57–69: кушетка под красной тканью, балдахины, кровать под тонким шёлком, кувшины *джха̄ри*, латунная
      коробка с паном (*питалера ба̄т̣а̄*), плевательницы (*а̄лава̄т̣и*), зеркало, опахала из павлиньих перьев, тилака
      *ӯрдхва-пун̣д̣ра* из сандала с точками, волосы с маслом *а̄малаки*, паланкин.
    en: >-
      CB Madhya 7.57–69: a couch draped in red cloth, canopies, a bed under fine silk, *jhari* water pots, a brass pan
      box (*pitalera bata*), spittoons (*alavati*), a mirror, peacock-feather fans, an *urdhva-pundra* tilaka of sandal
      with dots, hair dressed with *amalaki* oil, a palanquin.
  text:
    ru: >-
      Пундарика Видьянидхи, великий преданный из Читтагонга, жил как принц — и этим смутил Гададхару. Он сидел на
      кушетке под красной тканью с медными подлокотниками, под тремя балдахинами; рядом — кровать под тончайшим шёлком,
      пять-семь кувшинов с водой, латунная коробочка с готовым паном и две плевательницы. Жуя бетель, он поглядывал в
      зеркало на покрасневшие губы, а двое слуг непрерывно обмахивали его опахалами из павлиньих перьев. На лбу —
      вертикальная тилака из сандала с точками сандала и киновари, волосы уложены и умащены маслом амалаки. Но
      Мукунда прочёл стих о бхакти — и Видьянидхи упал без чувств в слезах любви: роскошь была лишь покровом.
    en: >-
      Pundarika Vidyanidhi, a great devotee from Chittagong, lived like a prince — and so puzzled Gadadhara. He sat on a
      couch draped in red cloth with brass armrests, under three canopies; beside him a bed under the finest silk,
      five or seven water pots, a brass box of ready pan and two spittoons. Chewing betel, he glanced into a mirror at
      his reddened lips, while two servants fanned him without pause with peacock-feather fans. On his forehead a
      vertical tilaka of sandal with dots of sandal and vermilion; his hair dressed and scented with amalaki oil. But
      when Mukunda recited a verse on bhakti, Vidyanidhi fell senseless in tears of love: the luxury was only a veil.
  hagiography: ["ЧБ Мадхья 7.57–69", "ЧБ Мадхья 7.73–88"]
  sources: []
  images: []
  game: {model: "кушетка с красным покрывалом и медными подлокотниками, балдахин; латунная коробка-бата для пана; плевательница; ручное зеркало; два павлиньих опахала",
         where: ["navadvipa/pundarika-house"]}

- id: mc-king-attire
  title: {ru: "Царь и его знаки: Пратапарудра", en: "The king and his insignia: Prataparudra"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 14.4–7 (царь снимает царские наряды и входит в сад в одежде вайшнава), 11.55 (совет прийти «не в
      царских одеждах»), 14.129–130 (царское шествие: опахала, зонты, флаги, служанки с бетелем и кувшинами), 13.15–16
      (золотая метла; см. mc-king-sweeper); Антья 9.107 (царь надевает шёлк на Гопинатху). Царский зонт — общий
      индийский знак власти (ср. «imperial umbrella» у Калидасы — Mukharji 1888, вводная часть; золотой зонт царя в
      мангал-кавьях — Sen 1911).
    en: >-
      CC Madhya 14.4–7 (the king removes his royal dress and enters the garden in Vaishnava dress), 11.55 (advised to
      come "not in royal garments"), 14.129–130 (a royal procession: fans, umbrellas, flags, maids with betel and water
      pots), 13.15–16 (the golden broom; see mc-king-sweeper); Antya 9.107 (the king puts silk on Gopinatha). The royal
      umbrella — a general Indian emblem of sovereignty (cf. the "imperial umbrella" in Kalidasa — Mukharji 1888,
      introduction; the king's golden umbrella in mangal-kavyas — Sen 1911).
  text:
    ru: >-
      Царя Ориссы узнавали издали: над ним держали белый зонт-чхатру, рядом — опахала и чамары, впереди шли музыканты и
      знаменосцы, а служанки несли бетель и кувшины с водой. Но чтобы приблизиться к Махапрабху, который избегал царей,
      Пратапарудра по совету Сарвабхаумы снял царский наряд и вошёл в сад один, в простой одежде вайшнава. Господь лежал
      в трансе, и царь стал растирать Ему стопы, читая стихи «Гопи-гиты», — и Махапрабху обнял его.
    en: >-
      The king of Orissa could be known from afar: a white umbrella (chhatra) was held over him, fans and chamaras beside
      him, musicians and standard-bearers went ahead and maids carried betel and water pots. But to approach
      Mahaprabhu, who avoided kings, Prataparudra on Sarvabhauma's advice laid aside his royal dress and entered the
      garden alone, in a Vaishnava's plain clothes. The Lord lay in trance, and the king began to massage His feet,
      reciting verses of the Gopi-gita — and Mahaprabhu embraced him.
  hagiography: ["ЧЧ Мадхья 11.55", "ЧЧ Мадхья 14.4–7", "ЧЧ Мадхья 14.129–130", "ЧЧ Антья 9.107"]
  sources: []
  images: []
  game: {model: "белый царский зонт на длинном шесте, чамары из хвоста яка; царь в простом белом дхоти и накидке без украшений",
         where: ["puri/gundicha-garden"]}
  todo: "Царский костюм Ориссы XVI в. (тюрбан, украшения) — по храмовым рельефам/рукописям;"

- id: mc-muslim-dress
  title: {ru: "Одежда мусульман Бенгалии", en: "Dress of the Muslims of Bengal"}
  rubric: dress
  era_evidence: epoch
  evidence_note:
    ru: >-
      Эпоха: Барбоза (ок. 1514–1518), пер. Stanley 1866, с. 180 — знатные мусульмане Бенгалии и простой народ (подробно).
      Жития: при дворе султана — лекарь Мукунда и слуга с павлиньим опахалом за султаном (ЧЧ Мадхья 15.120–123); Кази
      Навадвипы (ЧБ Мадхья 23.101–112; одежда не описана); Рупа и Санатана — министры султана (ЧЧ Мадхья 1). ⚠ Барбоза
      описывает портовый город «Бенгала».
    en: >-
      Period: Barbosa (c. 1514–1518), tr. Stanley 1866, p. 180 — Bengal's Muslim nobles and common people (in detail).
      Hagiographies: at the sultan's court — the physician Mukunda and a servant with a peacock fan behind the sultan
      (CC Madhya 15.120–123); the Kazi of Navadvipa (CB Madhya 23.101–112; his dress not described); Rupa and Sanatana
      as the sultan's ministers (CC Madhya 1). ⚠ Barbosa describes the port city "Bengala".
  text:
    ru: >-
      Мусульмане, в отличие от индусов, носили шитую одежду. Знатный мусульманин Бенгалии в дни Махапрабху ходил в
      длинной белой рубахе из тонкой ткани до самых щиколоток, под ней — обёрнутая вокруг пояса ткань, поверх —
      шёлковый кушак с кинжалом в серебре, на пальцах перстни, на голове — тонкая хлопковая шапочка. Простые люди
      носили короткие белые рубахи до середины бедра, штаны и маленькую чалму в три-четыре оборота, а обувь — кожаную,
      расшитую шёлком и золотой нитью. Таким, вероятно, видели Кази Навадвипы и придворных султана Хусейн-шаха.
    en: >-
      Muslims, unlike Hindus, wore stitched clothes. A Muslim noble of Bengal in Mahaprabhu's day went in a long white
      shirt of fine cloth reaching to the ankles, a cloth wrapped round the waist beneath it, over it a silk sash with
      a silver-mounted dagger, rings on his fingers and a fine cotton cap on his head. Common people wore short white
      shirts to mid-thigh, drawers and a small turban of three or four turns, and leather shoes embroidered with silk
      and gold thread. So, probably, the Kazi of Navadvipa and the courtiers of Sultan Husain Shah were seen.
  hagiography: ["ЧЧ Мадхья 15.120–123", "ЧБ Мадхья 23.101–112", "ЧЧ Мадхья 1.175–185"]
  sources: ["Barbosa, пер. Stanley 1866, с. 180"]
  images: []
  game: {model: "кази: белая длинная рубаха-джама до щиколоток, шёлковый кушак, кинжал, белая шапочка/малая чалма, кожаные туфли; слуга с павлиньим опахалом",
         where: ["navadvipa/kazi-house", "gauda/court"]}
  todo: "Одежда кази как судьи (чалма, чёрная?) — искать у Абу-ль-Фазла/Мукундарама."

- id: mc-turban
  title: {ru: "Тюрбан", en: "The turban"}
  rubric: dress
  era_evidence: epoch
  evidence_note:
    ru: >-
      Эпоха: Виджай Гупта (1494) — бенгалец носит три ткани, одна из них — тюрбан (Sen 1911, с. 387–388). Жития:
      синий тюрбан Нитьянанды (ЧБ Мадхья 3.144), шёлковый тюрбан в награду (ЧБ Ади 4.133), большой тюрбан человека с
      палкой (ЧБ Мадхья 18.40), тюрбаны из шёлковых тканей с гирляндами (ЧБ Антья 5.347, 5.511), слуги сбрасывают
      тюрбаны в киртане (ЧБ Мадхья 23.383), пастухи в тюрбанах (Лочан, Шеша ч. 3.175); Мурари 2.13.2 — «тюрбан из новой
      ткани».
    en: >-
      Period: Vijay Gupta (1494) — a Bengali wears three cloths, one of them a turban (Sen 1911, pp. 387–388).
      Hagiographies: Nityananda's blue turban (CB Madhya 3.144), a silk turban as a reward (CB Adi 4.133), a big turban
      on a man with a stick (CB Madhya 18.40), turbans of silk cloths with garlands (CB Antya 5.347, 5.511), servants
      throwing off their turbans in kirtan (CB Madhya 23.383), cowherds in turbans (Lochana, Shesha pt. 3.175); Murari
      2.13.2 — "a turban of new cloth".
  text:
    ru: >-
      В XV–XVI вв. бенгальцы, особенно знатные и служилые люди, повязывали голову тюрбаном — отрезом ткани, обёрнутым
      несколько раз; позже этот обычай в Бенгалии почти исчез. Нитьянанда пришёл в Навадвипу в синем дхоти и большом
      синем тюрбане, словно Баларама. Тюрбан могли пожаловать в награду; слуги, увлёкшись киртаном, сбрасывали
      тюрбаны, чтобы их не узнали. Брахманы-учёные и простые деревенские люди часто ходили с непокрытой головой.
    en: >-
      In the 15th–16th centuries Bengalis, especially men of rank and service, bound their heads in a turban — a length
      of cloth wound round several times; later the custom almost vanished in Bengal. Nityananda came to Navadvipa in a
      blue dhoti and a large blue turban, like Balarama. A turban could be granted as a reward; servants carried away by
      kirtan threw off their turbans so as not to be recognised. Brahmin scholars and plain village folk often went
      bareheaded.
  hagiography: ["ЧБ Мадхья 3.144", "ЧБ Ади 4.133", "ЧБ Мадхья 18.40", "ЧБ Мадхья 23.383", "ЧБ Антья 5.347", "Лочан, Шеша-кханда, ч. 3, ст. 175", "Мурари 2, сарга 13, ст. 2"]
  sources: ["Sen 1911, с. 387–388 (Виджай Гупта)"]
  images: []
  game: {model: "тюрбан из полосы ткани 4–6 м, обмотанной вокруг головы; у Нитьянанды — синий; у пастухов — небрежно повязанный жёлтый",
         where: ["navadvipa/lane"]}
  todo: "«Непокрытая голова брахманов» — утверждение по позднейшим данным; проверить по житиям (носил ли Нимай тюрбан? Лочан Мадхья ч. 5.48 — тюрбан цвета чампаки в описании Господа)."

# --- Порция 4: облик — волосы, косметика, обувь, зонт, бусы ---

- id: mc-mens-hair
  title: {ru: "Длинные волосы мужчин и узел на макушке", en: "Men's long hair and the topknot"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Вьющиеся волосы Нимая — ЧБ Ади 8.185, 13.63, Мадхья 2.247; «волосы, собранные в узел на верху головы» — ЧБ Мадхья
      3.185; масло амалаки — ЧБ Мадхья 7.64 (Пундарика), Лочан Ади ч. 7.531 (перед свадьбой); преданный расчёсывает
      волосы Господа — ЧБ Мадхья 9.122; «сухие волосы» = не купался — ЧБ Ади 6.131; печаль о длинных локонах после
      санньясы — ЧЧ Мадхья 3.152. Общая картина: «до XVI в. бенгальцы носили длинные волосы, умащали и заплетали их» —
      Sen 1911, с. 389.
    en: >-
      Nimai's curling hair — CB Adi 8.185, 13.63, Madhya 2.247; "hair gathered in a knot on the crown" — CB Madhya
      3.185; amalaki oil — CB Madhya 7.64 (Pundarika), Lochana Adi pt. 7.531 (before the wedding); a devotee combs the
      Lord's hair — CB Madhya 9.122; "dry hair" = had not bathed — CB Adi 6.131; grief for the long locks after
      sannyasa — CC Madhya 3.152. General picture: "up to the 16th century the Bengalis wore their hair long, scented
      and plaited it" — Sen 1911, p. 389.
  text:
    ru: >-
      Во времена Махапрабху бенгальцы не стриглись коротко: мужчины носили длинные волосы, умащали их душистым маслом и
      собирали в узел на макушке. У юного Нимая были чёрные вьющиеся кудри; волосы мыли отваром плодов амалаки
      (индийского крыжовника) и смазывали маслом, так что «сухие волосы» выдавали того, кто сегодня не купался.
      Преданные порой расчёсывали Господу волосы, и когда Он обрил их перед санньясой, все горевали — пока не увидели
      Его новый облик. Брахманы оставляли на макушке шикху (см. mc-tilak-shikha-thread).
    en: >-
      In Mahaprabhu's time Bengalis did not crop their hair: men wore it long, anointed it with scented oil and gathered
      it in a knot on the crown. Young Nimai had black curling locks; hair was washed with a decoction of amalaki fruit
      (Indian gooseberry) and oiled, so that "dry hair" betrayed someone who had not bathed that day. Devotees sometimes
      combed the Lord's hair, and when He shaved it off for sannyasa everyone grieved — until they beheld His new form.
      Brahmins kept a shikha tuft on the crown (see mc-tilak-shikha-thread).
  hagiography: ["ЧБ Ади 6.131", "ЧБ Ади 8.185", "ЧБ Ади 13.63", "ЧБ Мадхья 2.247", "ЧБ Мадхья 3.185", "ЧБ Мадхья 7.64",
                "ЧБ Мадхья 9.122", "ЧЧ Мадхья 3.152", "Лочан, Ади-кханда, ч. 7, ст. 531"]
  sources: ["Sen 1911, с. 389"]
  images: []
  game: {model: "Нимай-пандит: волосы до плеч, вьющиеся, собраны в узел на макушке; после санньясы — бритая голова",
         where: []}

- id: mc-womens-festive-attire
  title: {ru: "Праздничный убор женщин Надии", en: "Festive attire of the women of Nadia"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Лочан, Ади-кханда, ч. 10.84–86 (шёлковые сари, каджал, ожерелья, браслеты, пояса с колокольчиками, синдур с
      каплей сандала, бетель в руке) и ч. 14.135–148 (лифы из тонкой ткани, узел *канада*, жемчуг в золоте, алые кисти по
      спине, цветы гандхараджа и чампаки в ушах, гребни в волосах). Канчули у поэтов с 1494 г. — Sen 1911, с. 388.
    en: >-
      Lochana, Adi-khanda pt. 10.84–86 (silk saris, kajal, necklaces, bangles, belts with bells, sindur with a dot of
      sandal, betel in hand) and pt. 14.135–148 (bodices of fine cloth, the *kanada* knot, pearls set in gold, scarlet
      tassels down the back, gandharaja and champaka flowers in the ears, combs in the hair). The kanchuli in poets from
      1494 — Sen 1911, p. 388.
  text:
    ru: >-
      Когда по Надии разнеслась весть о свадьбе Вишвамбхары, горожанки спешно наряжались: шёлковые сари и лифы из
      тонкой ткани, волосы завязаны узлом «канада», в узел вплетён жемчуг в золоте, а по спине спускаются алые кисти.
      Глаза подводили каджалом, в уши вставляли душистые цветы гандхараджа и чампаки, на лоб — синдур у самых волос и
      под ним каплю сандала. Звенели ожерелья, браслеты на плечах и запястьях, пояса с колокольчиками и ножные браслеты;
      в левой руке — свёрнутый бетель. Юные девушки бежали смотреть на жениха, так и не вынув гребней из волос.
    en: >-
      When news of Vishvambhara's wedding spread through Nadia, the townswomen hurried to dress: silk saris and bodices
      of fine cloth, hair tied in the "kanada" knot with pearls set in gold woven in and scarlet tassels hanging down the
      back. They lined their eyes with kajal, set fragrant gandharaja and champaka flowers in their ears, and put sindur
      on the forehead at the hairline with a dot of sandal beneath. Necklaces, armlets, bangles, belts with little bells
      and anklets jingled; in the left hand, a folded betel. Young girls ran to see the bridegroom with combs still in
      their hair.
  hagiography: ["Лочан, Ади-кханда, ч. 10, ст. 84–86", "Лочан, Ади-кханда, ч. 14, ст. 135–148"]
  sources: ["Sen 1911, с. 388–389 (канчули, одна)"]
  images: []
  game: {model: "горожанка: шёлковое сари, лиф-канчули, узел на затылке с жемчужной нитью и алыми кистями, цветок чампаки за ухом, каджал",
         where: ["navadvipa/lane"]}
  todo: "Что такое узел «канада» (кана̄д̣а̄-кхо̄па̄?) — сверить оригинал Лочана."

- id: mc-alta
  title: {ru: "Алта — красная краска для стоп", en: "Alta — red dye for the feet"}
  rubric: dress
  era_evidence: epoch
  evidence_note:
    ru: >-
      Эпоха: Криттибас (XV в.) — стопы Ситы, «окрашенные прекрасной алтой» (Sen 1911, с. ~182); алта в падах о Радхе
      (Sen 1911, с. 542, 727). Состав: «тонкая материя вроде бумаги, которой индуски красят стопы» — Bose 1881, с. 49–50
      (сноска); лак как краситель — Mukharji 1888, с. 348. В наших переводах житий слово «алта» не найдено.
    en: >-
      Period: Krittivasa (15th c.) — Sita's feet "coloured with beautiful Alta" (Sen 1911, p. ~182); alta in padas on
      Radha (Sen 1911, pp. 542, 727). Material: "a thin stuff like paper with which Hindoo females redden their feet" —
      Bose 1881, pp. 49–50 (note); lac as a dye — Mukharji 1888, p. 348. The word "alta" was not found in our
      hagiography translations.
  text:
    ru: >-
      Замужние бенгалки обводили край стоп и красили подошвы ярко-красной алтой. Её делали из лака — красного смолистого
      выделения лакового червеца: краской пропитывали тонкие листки или комочки ваты, смачивали водой и проводили по
      коже. Уже поэт XV в. Криттибас пишет, как Сита, уходя в лес, ступает стопами, окрашенными алтой, по колючей
      земле; в падах Кришна Сам красит алтой стопы Радхи, и следы Её ног принимают за лотосы. Алта — знак радости и
      замужества: вдовы её не носили.
    en: >-
      Married Bengali women outlined the edges of their feet and coloured their soles with bright red alta. It was made
      from lac — the red resinous secretion of the lac insect: thin leaves or tufts of cotton were soaked in the dye,
      moistened with water and drawn across the skin. Already the 15th-century poet Krittivasa tells how Sita, going to
      the forest, treads the thorny ground with alta-painted feet; in the padas Krishna Himself paints Radha's feet with
      alta, and Her footprints are mistaken for lotuses. Alta is a sign of joy and of marriage: widows did not wear it.
  hagiography: []
  sources: ["Sen 1911, с. ~182 (Криттибас), 542, 727 (пады)", "Bose 1881, с. 49–50", "Mukharji 1888, с. 348"]
  images: []
  game: {model: "красная кайма по краю стопы и красные подошвы; плоская бумажка/ватка алты на латунной тарелочке",
         where: ["mishra-house/courtyard"]}
  todo: "Есть ли алта в ЧБ/ЧЧ (а̄лта̄, йа̄вака, ала̄ктака)? Поиск по транслиту оригинала; носили ли алту вне праздников."

- id: mc-footwear
  title: {ru: "Обувь: деревянные кхарам и босые ноги", en: "Footwear: wooden kharam and bare feet"}
  rubric: dress
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      Жития: босые ножки младенца (Лочан Ади ч. 2.136–148; Мурари 1.6.34–35; Карнапура 2.88); «сандалии» — лишь как
      служение Ананты (ЧЧ Ади 5.123; ЧБ Ади 1.46); сандалии Махапрабху в Баранагаре — позднее предание (Sen 1922, с. 233).
      Описание кхарам с колышком — Solvyns 1804, pl. XLIV; деревянная обувь в деревне, кожаная лишь в городе — Taylor
      1840, с. 265; кожаная расшитая обувь мусульман — Barbosa, Stanley 1866, с. 180 (эпоха).
    en: >-
      Hagiographies: the baby's bare feet (Lochana Adi pt. 2.136–148; Murari 1.6.34–35; Karnapura 2.88); "sandals" only
      as Ananta's service (CC Adi 5.123; CB Adi 1.46); Mahaprabhu's sandals at Baranagar — later tradition (Sen 1922,
      p. 233). The pegged kharam — Solvyns 1804, pl. XLIV; wooden footwear in the village, leather only in town —
      Taylor 1840, p. 265; embroidered leather shoes of Muslims — Barbosa, Stanley 1866, p. 180 (period).
  text:
    ru: >-
      Большинство людей ходили босиком, а женщины из приличных семей обуви почти не носили. Брахманы и почтенные
      домохозяева надевали *кхарам* (*падуку*) — деревянную подошву с колышком-грибком, который зажимали между большим
      и вторым пальцем ноги; кожу индусы-брахманы считали нечистой. Деревянные сандалии стучали по глиняным дорожкам и
      оставались у порога: в дом и в комнату Божества входили босыми. Кожаные расшитые туфли носили мусульмане и
      горожане.
    en: >-
      Most people went barefoot, and women of good families hardly wore shoes. Brahmins and respectable householders
      wore *kharam* (*paduka*) — a wooden sole with a mushroom-shaped peg gripped between the big and second toe;
      Hindu brahmins regarded leather as impure. Wooden sandals clattered on the clay paths and were left at the
      threshold: one entered the house and the Deity's room barefoot. Embroidered leather shoes were worn by Muslims
      and townsfolk.
  hagiography: ["Лочан, Ади-кханда, ч. 2, ст. 136–148", "Мурари 1, сарга 6, ст. 34–35", "ЧЧ Ади 5.123"]
  sources: ["Solvyns 1804, pl. XLIV, XXXVI", "Taylor 1840, с. 265", "Barbosa, пер. Stanley 1866, с. 180", "Sen 1922, с. 233", "Bose 1881, с. 59–62 (кхарам в дар жениху)"]
  images: []
  game: {model: "кхарам: деревянная подошва по форме стопы ≈26×9 см, толщина 2–3 см, колышок-грибок ≈4 см; пара у порога",
         where: ["mishra-house/courtyard", "mishra-house/thakur-ghar"]}
  todo: "Носил ли Нимай кхарам — в житиях не найдено; «кожа нечиста для брахмана» — подтвердить PD-текстом."

- id: mc-umbrella
  title: {ru: "Зонт (чхатра)", en: "The umbrella (chhatra)"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Жития: Нитьянанда держит зонт над Господом (ЧБ Мадхья 6.64, 8.306, 9.45, 10.6, 10.113; «зонтиком от солнца» — 22.18);
      Рагхавананда — над Нитьянандой (ЧБ Антья 5.273); зонты в шествиях (ЧЧ Мадхья 14.129; ЧБ Антья 8.104); Нитьянанда
      как «зонт» Господа (ЧБ Мадхья 4.66). Материал — бамбук и пальмовый лист, Mukharji 1888, с. 314 (XIX в.); зонт на
      упанаяне — Bose 1881, с. 185.
    en: >-
      Hagiographies: Nityananda holds an umbrella over the Lord (CB Madhya 6.64, 8.306, 9.45, 10.6, 10.113; "a sunshade"
      — 22.18); Raghavananda over Nityananda (CB Antya 5.273); umbrellas in processions (CC Madhya 14.129; CB Antya
      8.104); Nityananda as the Lord's "umbrella" (CB Madhya 4.66). Material — bamboo and palm leaf, Mukharji 1888,
      p. 314 (19th c.); the umbrella at upanayana — Bose 1881, p. 185.
  text:
    ru: >-
      Зонт — и защита от солнца и дождя, и знак почёта. Простые зонты делали из бамбукового каркаса, покрытого
      пальмовыми листьями; крестьяне в поле носили на голове плоский зонт-шляпу из листьев. Над царём и над Божеством
      поднимали большой белый зонт на длинном шесте. Когда Махапрабху являл Свои божественные облики в домах преданных,
      Нитьянанда держал над Ним зонт, а другие обмахивали Его чамарами; в писаниях Нитьянанда-Ананта Сам становится
      зонтом, ложем и сиденьем Господа.
    en: >-
      An umbrella was both shelter from sun and rain and a mark of honour. Plain umbrellas had a bamboo frame covered
      with palm leaves; peasants in the field wore a flat leaf umbrella-hat on the head. A large white umbrella on a
      long pole was raised over a king and over the Deity. When Mahaprabhu revealed His divine forms in the devotees'
      houses, Nityananda held an umbrella over Him while others fanned Him with chamaras; in scripture Nityananda-Ananta
      Himself becomes the Lord's umbrella, bed and seat.
  hagiography: ["ЧБ Мадхья 6.64", "ЧБ Мадхья 9.45", "ЧБ Мадхья 10.6", "ЧБ Мадхья 22.18", "ЧБ Антья 5.273", "ЧЧ Мадхья 14.129", "ЧБ Мадхья 4.66"]
  sources: ["Mukharji 1888, с. 314", "Bose 1881, с. 185"]
  images: []
  game: {model: "зонт из бамбука и пальмового листа Ø ≈90 см; почётный белый зонт на шесте 2,5 м с бахромой; крестьянская шляпа-зонт из листьев",
         where: ["navadvipa/srivasa-angan", "puri/road"]}
  todo: "Бенгальское название шляпы-зонта из листьев (ма̄тха̄ла?) — в PD-книгах не найдено."

- id: mc-tulasi-mala
  title: {ru: "Туласи-мала: бусы и чётки", en: "Tulasi-mala: neck beads and japa beads"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Антья 13.114 (Господь снимает со Своей шеи бусы и надевает их на Рагхунатху Бхатту), 13.123 (длинная туласи-мала
      Джаганнатхи), 13.134; ЧЧ Мадхья 24.328 (о ношении бус туласи — тема «Хари-бхакти-виласы»), 22.119 и 24.332 (джапа на
      чётках); ЧБ Мадхья 5.1 (Господь, повторяющий имя на чётках). Бусы из дерева туласи для джапы — Ward 1863, с. ~163;
      вайшнав «в ожерелье из туласи» — там же, с. 356–357 [поздн.].
    en: >-
      CC Antya 13.114 (the Lord takes the beads from His own neck and puts them on Raghunatha Bhatta), 13.123
      (Jagannatha's long tulasi-mala), 13.134; CC Madhya 24.328 (wearing tulasi beads — a topic of Hari-bhakti-vilasa),
      22.119 and 24.332 (japa on beads); CB Madhya 5.1 (the Lord chanting the name on beads). Tulasi-wood beads for
      japa — Ward 1863, p. ~163; a Vaishnava "in a necklace of tulasi beads" — ibid., pp. 356–357 [later].
  text:
    ru: >-
      Из дерева священной туласи вытачивали маленькие бусины. Ожерелье из них вайшнав носил на шее не снимая — как знак
      того, что он принадлежит Кришне, а на длинных чётках из 108 бусин повторял святые имена. Махапрабху, отпуская
      Рагхунатху Бхатту домой в Каши, снял со Своей шеи бусы (*кантха-мала*) и надел на него; позже, отправляя его во
      Вриндаван, Господь подарил ему длинную гирлянду туласи с Джаганнатхи, и Рагхунатха всегда носил эти дары с собой. О ношении бус туласи писал в своём
      своде правил Санатана Госвами по велению Господа.
    en: >-
      Small beads were turned from the wood of the sacred tulasi. A Vaishnava wore a necklace of them always, as a sign
      that he belongs to Krishna, and chanted the holy names on a long string of 108 beads. When Mahaprabhu sent
      Raghunatha Bhatta home to Kashi, He took the beads (*kantha-mala*) from His own neck and placed them on him; later,
      sending him to Vrindavana, the Lord gave him Jagannatha's long tulasi garland, and Raghunatha always kept these gifts with him. At the Lord's request Sanatana
      Gosvami wrote on wearing tulasi beads in his code of Vaishnava practice.
  hagiography: ["ЧЧ Антья 13.114", "ЧЧ Антья 13.123", "ЧЧ Антья 13.134", "ЧЧ Мадхья 24.328", "ЧЧ Мадхья 22.119", "ЧБ Мадхья 5.1"]
  sources: ["Ward 1863, с. ~163, 356–357"]
  images: [{file: "material-culture/img/company-brahmin-japa-beads.jpg", license: "PD (Public Domain Mark 1.0)", author: "неизв. индийский художник, XIX в.; Wellcome Collection 576052i", url: "https://wellcomecollection.org/works/k2zgf6ww"}]
  game: {model: "кантхи — двойная нитка мелких бусин туласи на шее (бусина Ø 3–4 мм); чётки-джапа-мала 108 бусин Ø 8–10 мм в мешочке",
         where: ["mishra-house/thakur-ghar", "puri/gambhira"]}
  todo: "ЧЧ Антья 13.114 — *кан̣т̣ха-ма̄ла̄*, материал не назван (туласи — по смыслу). Форма бусин в XVI в. — вопрос к специалисту."

# --- Порция 5: накидка, детская одежда ---

- id: mc-cloth-end-uses
  title: {ru: "Край накидки: узелок, веер, знак смирения", en: "The end of the cloth: bundle, fan, sign of humility"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Прасад, завязанный в край накидки — ЧЧ Мадхья 6.218, Антья 16.92; черепки горшочка в узелке — ЧЧ Мадхья 4.139;
      мусор Гундичи в подоле накидки — ЧЧ Мадхья 12.88; обмахивают накидкой — ЧЧ Мадхья 17.220, Антья 14.97; Говинда
      накрывает Господа своей накидкой — ЧЧ Антья 10.89; накидка, обёрнутая вокруг шеи в знак смирения — ЧЧ Мадхья
      1.185; накидка Господа в дар — ЧЧ Мадхья 12.34, 16.202.
    en: >-
      Prasada tied in the end of the cloth — CC Madhya 6.218, Antya 16.92; potsherds in a knot — CC Madhya 4.139; the
      Gundicha rubbish carried in the cloth — CC Madhya 12.88; fanning with the cloth — CC Madhya 17.220, Antya 14.97;
      Govinda covers the Lord with his cloth — CC Antya 10.89; the cloth wound round the neck in humility — CC Madhya
      1.185; the Lord's cloth as a gift — CC Madhya 12.34, 16.202.
  text:
    ru: >-
      Карманов не было — всё носили в краю накидки-уттарьи. В её узелок Махапрабху завязал прасад и гирлянду Джаганнатхи
      и поспешил с ними к Сарвабхауме; Мадхавендра Пури завязал в накидку черепки горшочка от сладкого риса Гопинатхи.
      Накидкой обмахивали, укрывали спящего, выносили мусор при уборке храма Гундичи. Обернуть накидку вокруг шеи и
      зажать в зубах травинку — знак глубочайшего смирения: так Рупа и Санатана простёрлись перед Господом в Рамакели.
      А накидку с плеча Господа дарили как высшую милость — её получил, например, капитан лодки в Панихати.
    en: >-
      There were no pockets — everything was carried in the end of the uttariya. In its knot Mahaprabhu tied
      Jagannatha's prasada and garland and hurried to Sarvabhauma; Madhavendra Puri tied in his cloth the shards of the
      pot of Gopinatha's sweet rice. The cloth fanned, covered a sleeper, carried out the rubbish when the Gundicha
      temple was cleaned. To wind the cloth round one's neck with a blade of grass between the teeth was a sign of the
      deepest humility: so Rupa and Sanatana prostrated before the Lord at Ramakeli. And a cloth from the Lord's
      shoulder was given as the highest grace — the boat captain at Panihati received one.
  hagiography: ["ЧЧ Мадхья 6.218", "ЧЧ Антья 16.92", "ЧЧ Мадхья 4.139", "ЧЧ Мадхья 12.88", "ЧЧ Мадхья 17.220", "ЧЧ Антья 10.89",
                "ЧЧ Мадхья 1.185", "ЧЧ Мадхья 12.34", "ЧЧ Мадхья 16.202"]
  sources: []
  images: []
  game: {model: "анимация: край уттарьи завязан узелком с прасадом; накидка вокруг шеи при поклоне",
         where: ["puri/temple", "ramakeli"]}

- id: mc-child-dress
  title: {ru: "Одежда ребёнка", en: "A child's clothing"}
  rubric: dress
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Голенький малыш в пыли — ЧБ Ади 7.39; младенец «одетый лишь ветром», с серебряным ожерельем и гирляндой в кудрях —
      Мурари 1.6.4; поясок с колокольчиками — ЧБ Ади 12.160 (видение); мальчик Вишвамбхара: дхоти туго обёрнуто, три
      хохолка, хохолок в пять узелков, бусы, жемчуг, сурьма, браслеты — Лочан, Ади ч. 4.390–391; обривание и прокалывание
      ушей — ЧБ Ади 6.3. Украшения — см. mc-child-ornaments.
    en: >-
      A naked toddler covered in dust — CB Adi 7.39; the baby "clad only in the wind", with a silver necklace and a
      garland in His curls — Murari 1.6.4; a waist-string with bells — CB Adi 12.160 (a vision); the boy Vishvambhara:
      dhoti tightly wrapped, three tufts, a tuft tied in five knots, beads, pearls, kohl, anklets — Lochana, Adi
      pt. 4.390–391; tonsure and ear-piercing — CB Adi 6.3. Ornaments — see mc-child-ornaments.
  text:
    ru: >-
      Маленькие дети бегали голенькими — лишь поясок-шнурок с колокольчиками на животе, ожерелье да браслеты; Нимай,
      весь в пыли, так и играл во дворе. Подрастая, мальчик получал маленькое дхоти, которое туго оборачивали вокруг
      пояса. Волосы ребёнку то брили, то оставляли хохолками: у Вишвамбхары на голове красовались три хохолка, а один
      был завязан пятью узелками; глаза подводили сурьмой. На обряде *чудакарана* ребёнку обривали голову и
      прокалывали уши.
    en: >-
      Little children ran about naked — just a waist-string with bells on the tummy, a necklace and bangles; Nimai,
      covered in dust, played that way in the yard. As he grew, a boy was given a small dhoti, wrapped tightly round the
      waist. A child's hair was now shaved, now left in tufts: Vishvambhara had three tufts on His head, one of them
      tied in five little knots; His eyes were lined with kohl. At the *chudakarana* rite the child's head was shaved and
      the ears pierced.
  hagiography: ["ЧБ Ади 7.39", "ЧБ Ади 12.160", "Мурари 1, сарга 6, ст. 4", "Лочан, Ади-кханда, ч. 4, ст. 390–391", "ЧБ Ади 6.3"]
  sources: []
  images: [{file: "material-culture/img/kalighat-1890-yashoda-and-krishna-cma.jpg", license: "CC0 1.0", author: "художник Калигхата, ок. 1890; Cleveland Museum of Art 2003.159", url: "https://clevelandart.org/art/2003.159"}]
  game: {model: "малыш 2–3 лет: голый, поясок-шнурок с бубенчиками, серебряное ожерелье; мальчик 5–6 лет: маленькое белое дхоти, три хохолка",
