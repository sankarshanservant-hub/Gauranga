- id: mc-govinda-servant
  title: {ru: "Говинда — личный слуга Господа", en: "Govinda — the Lord's personal servant"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Говинда, слуга Ишвары Пури из шудр, по воле гуру приходит служить Господу — ЧЧ Мадхья 10.132–149; растирает
      стопы, переступает через Господа, лежащего в дверях, но не ради себя — ЧЧ Антья 10.85–101; впускает преданных —
      ЧБ Антья 9.196.
    en: >-
      Govinda, Ishvara Puri's shudra-born servant, comes to serve the Lord at his guru's wish — CC Madhya 10.132–149;
      he massages the Lord's feet and steps over the Lord lying in the doorway, but not for his own sake — CC Antya
      10.85–101; he lets devotees in — CB Antya 9.196.
  text:
    ru: >-
      У санньяси нет дома и семьи, но в Пури у Господа был слуга — Говинда, родом из шудр, прежде служивший Ишваре
      Пури. Он стоял у дверей, впускал гостей, принимал от преданных угощения, носил воду и растирал Господу стопы,
      когда тот уставал после танца. Однажды Господь лёг поперёк дверного проёма; Говинда накрыл Его своей накидкой и
      переступил, чтобы служить, — а поесть так и не пошёл, потому что ради себя переступать через Господа не
      смел. Так в быту проявлялся этикет вайшнава-слуги.
    en: >-
      A sannyasi has no house or family, but in Puri the Lord had a servant — Govinda, born a shudra, who had served
      Ishvara Puri before. He kept the door, let visitors in, received the devotees' food gifts, carried water and
      massaged the Lord's feet when He was tired after dancing. Once the Lord lay across the doorway; Govinda covered
      Him with his own cloth and stepped over to serve — but never went to eat, since he did not dare step over the Lord
      for his own sake. Thus a Vaishnava servant's etiquette showed in daily life.
  hagiography: ["ЧЧ Мадхья 10.132–149", "ЧЧ Антья 10.85–101", "ЧБ Антья 9.196"]
  sources: []
  images: []
  game: {model: "персонаж: Говинда с кувшином-карой и опахалом у двери Гамбхиры",
         where: ["puri/gambhira"]}
