- id: mc-doors-bolts
  title: {ru: "Двери и запоры", en: "Doors and bolts"}
  rubric: home
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Родственники советуют «привязать дверь снаружи» (*ба̄ндха ба̄хира дуйа̄ра*), и Мишра садится у двери — ЧБ Ади
      5.114–116; киртан за «крепко запертой» дверью — ЧБ Мадхья 8.229, 5.21; ЧЧ Ади 17.60; три запертые двери
      Гамбхиры — ЧЧ Мадхья 2.8, Антья 17.11. Устройство двери и засова — реконструкция.
    en: >-
      Relatives advise 'tying the door from outside' (bandha bahira duyara), and Mishra sits at the door — CB Adi
      5.114–116; kirtan behind a 'firmly shut' door — CB Madhya 8.229, 5.21; CC Adi 17.60; the three locked doors of
      the Gambhira — CC Madhya 2.8, Antya 17.11. The construction of door and bolt is reconstructed.
  text:
    ru: >-
      Дверь хижины — деревянная или плетёная из бамбука створка в низком проёме; её закрывали изнутри деревянным
      засовом, а снаружи привязывали верёвкой к столбу. Когда малыш Нимай всё время убегал, родные посоветовали
      Джаганнатхе Мишре завязать дверь снаружи, и отец сел сторожить у порога. Ночные киртаны в доме Шриваса шли за
      крепко запертыми дверями, чтобы не мешали насмешники, а в Пури Господь в экстазе оказывался снаружи, хотя все три
      двери Гамбхиры оставались закрытыми.
    en: >-
      A hut door was a wooden or woven-bamboo leaf in a low doorway; it was shut from inside with a wooden bar and tied
      from outside with a rope to a post. When little Nimai kept running off, the relatives advised Jagannatha Mishra
      to tie the door from outside, and the father sat guarding the threshold. The night kirtans in Shrivasa's house
      went on behind firmly shut doors so that scoffers could not interfere, and in Puri the Lord in ecstasy would be
      found outside although all three doors of the Gambhira stayed closed.
  hagiography: ["ЧБ Ади 5.114–116", "ЧБ Мадхья 5.21", "ЧБ Мадхья 8.229", "ЧЧ Ади 17.60", "ЧЧ Мадхья 2.8", "ЧЧ Антья 17.11"]
  sources: []
