# Рубрика «Кухня» (kitchen). Формат — material-culture/README.md.

- id: mc-rannaghar
  title: {ru: "Кухня (раннагхар)", en: "The kitchen hut (rannaghar)"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Кухню моют и готовят к стряпне для Вишну — ЧБ Ади 5.29–30, 5.48–49, 5.112; Махапрабху выходит из кухни
      навстречу учителю — ЧБ Ади 17.83. Отдельная хижина-кухня — реконструкция по устройству усадьбы.
    en: >-
      The kitchen is washed and made ready for cooking for Vishnu — CB Adi 5.29–30, 5.48–49, 5.112; Mahaprabhu steps
      out of the kitchen to greet His guru — CB Adi 17.83. A separate kitchen hut is reconstructed from homestead layout.
  text:
    ru: >-
      Кухня — самое чистое место дома после комнаты Божества, обычно отдельная хижина: огонь подальше от жилья, а
      стряпня — подальше от уличной пыли и посторонних. Когда в дом Мишры пришёл странствующий брахман, кухню
      тщательно вымыли и принесли лучшие продукты и утварь, и он сам приготовил пищу для своего Гопала. Маленький
      Нимай трижды съедал это подношение — и трижды кухню мыли заново.
    en: >-
      After the Deity room, the kitchen is the cleanest place in the house, usually a hut of its own: the fire is kept
      away from the living quarters, and the cooking away from street dust and outsiders. When a wandering brahmin came
      to Mishra's house, the kitchen was washed thoroughly and the best provisions and utensils brought, and he cooked
      for his Gopala himself. Little Nimai ate that offering three times — and three times the kitchen was washed again.
  hagiography: ["ЧБ Ади 5.29–31", "ЧБ Ади 5.48–49", "ЧБ Ади 5.112", "ЧЧ Ади 14.37", "ЧБ Ади 17.83"]
  sources: ["Day 1874, с. 29 (кухня pak-shala/rannaghar на веранде хижины в юго-восточном углу)",
            "Bose 1881, с. 13–15 (кухня во внутренней половине дома; отдельный очаг для «чистой» пищи)",
            "Sen 1911, с. 23 («Дак-вачана»: очаг — на кухне)"]
  images: []
  game: {model: "хижина-чала 4×3 м, низкий вход, дым уходит сквозь соломенную кровлю; внутри — чула, полка с ханди",
         where: ["mishra-house/kitchen"], codex: hs_kitchen,
         notes: "в кухню входят омывшись и в чистой одежде; посторонним — только до порога"}
