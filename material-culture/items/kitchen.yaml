- id: mc-khai-chida
  title: {ru: "Воздушный рис и рисовые хлопья (кхаи, чида)", en: "Puffed rice and flattened rice (khai, chida)"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: "*кхаи* — ЧБ Ади 4.21, 10.87; ЧЧ Ади 13.110, 14.24; чида с йогуртом — ЧЧ Антья 6.51–69 (праздник в Панихати)."
    en: "khai — CB Adi 4.21, 10.87; CC Adi 13.110, 14.24; chida with curd — CC Antya 6.51–69 (the festival at Panihati)."
  text:
    ru: >-
      Рис, обжаренный в горячем песке до лопания (кхаи), — праздничный и будничный перекус и непременный благой дар:
      им, вместе с бананами и маслом, Шачи одаривала женщин после обрядов. Однажды Шачи поставила перед Нимаем большой
      поднос с воздушным рисом и сладостями — а Он стал есть землю, объясняя, что всё это одна и та же земля. Плющеный
      рис (чида) едят с молоком или йогуртом, бананами и сахаром — так кормили всех на празднике в Панихати.
    en: >-
      Rice popped in hot sand (khai) is both an everyday and a festive snack and an essential auspicious gift: Shachi
      gave it, with bananas and oil, to the women after the rites. Once Shachi set a big tray of puffed rice and sweets
      before Nimai — and He began to eat earth, explaining that it is all the same earth. Flattened rice (chida) is
      eaten with milk or curd, bananas and sugar — that is how everyone was fed at the festival in Panihati.
  hagiography: ["ЧБ Ади 4.21", "ЧБ Ади 10.87", "ЧЧ Ади 13.110", "ЧЧ Ади 14.24–29", "ЧЧ Антья 6.51–69"]
  sources: []
  images: []
  game: {model: "плетёный поднос с горкой кхаи и сладостями", where: ["mishra-house/courtyard"]}

- id: mc-dairy
  title: {ru: "Молоко, простокваша, гхи, кхира", en: "Milk, curd, ghee, khira"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧБ Ади 4.30–34, 4.101; Лочан, Ади-кханда, ч. 2, ст. 121; ч. 4, ст. 367; ЧЧ Мадхья 3.53–54; ЧЧ Антья 6.57–58.
      Молочницы с простоквашей на рынке — у Мукундарама (XVI в.).
    en: >-
      CB Adi 4.30–34, 4.101; Lochana, Adi-khanda pt. 2 v. 121; pt. 4 v. 367; CC Madhya 3.53–54; CC Antya 6.57–58.
      Dairy-women taking curd to market — in Mukundaram (16th c.).
  text:
    ru: >-
      Молочное — главная роскошь вайшнавского стола. Молоко кипятят и уваривают до густой кхиры (сгущённого молока),
      заквашивают в глиняных горшках простоквашу (дадхи), снимают сливки и топят гхи. Шачи обещала сыну: «Сейчас придёт
      отец, принесёт сгущённого молока и бананов». А маленький Нимай, оставшись один, разливал по полу молоко, гхи и
      простоквашу и бил горшки — совсем как Кришна во Врадже.
    en: >-
      Dairy is the chief luxury of a Vaishnava table. Milk is boiled and reduced to thick khira, curd (dadhi) is set
      in clay pots, cream is skimmed and ghee clarified. Shachi promised her son, "Your father will come soon with
      thickened milk and bananas." And little Nimai, left alone, spilled milk, ghee and curd over the floor and broke
      the pots — just like Krishna in Vraja.
  hagiography: ["ЧБ Ади 4.30–34", "ЧБ Ади 4.101", "Лочан, Ади-кханда, ч. 2, ст. 121", "Лочан, Ади-кханда, ч. 4, ст. 367",
                "ЧЧ Мадхья 3.53–54", "ЧЧ Антья 6.57–58"]
  sources: ["Sen 1911, с. 299 (Мукундарам, XVI в.: молочницы несут простоквашу на рынок в кувшинах)",
            "Day 1874, с. 35 (молоко → сливки, гхи, простокваша, пахта)"]
  images: [{file: "material-culture/img/kalighat-1890-yashoda-and-krishna-cma.jpg", license: "CC0 1.0", author: "художник Калигхата", url: "https://clevelandart.org/art/2003.159", note: "ок. 1890.; The Cleveland Museum of Art — 2003.159; 42 × 26 см."}]
  game: {model: "горшки с молоком/дадхи, подвешенные в верёвочных сетках (шика) от кошек — проверить; маслобойка-мешалка",
         where: ["mishra-house/kitchen"]}
  todo: "подвесные сетки (шика) — есть ли в житиях?"

- id: mc-sandesh
  title: {ru: "Сладости и сандеш", en: "Sweets and sandesh"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Слово *сандеш́а* — в ЧБ Ади 4.96 (*сандеш́а-кала̄*), 4.116. Чхана (творог из свёрнутого молока) в житиях
      есть: *чха̄на̄, ш́аркара̄* — ЧЧ Мадхья 3.48 (в нашем переводе — «простокваша»), *чха̄на̄* — ЧЧ Мадхья 14.26,
      *чхана-бада* — ЧЧ Мадхья 15.210. Поздним, по распространённому мнению историков кухни (XVIII–XIX вв.), был именно
      прессованный сандеш из чханы; что называли «сандешем» в XVI в. — вопрос к специалисту. Долго хранящиеся сладости
      из уваренного молока — *кш̣ӣраса̄ра, ман̣д̣а* (ЧЧ Антья 10.26).
    en: >-
      The word sandesha occurs in CB Adi 4.96 (sandesha-kala), 4.116. Chhana (curd from split milk) does occur in the
      hagiographies: chhana, sharkara — CC Madhya 3.48 (rendered 'curd' in our translation), chhana — CC Madhya 14.26,
      chhana-bada — CC Madhya 15.210. What is widely thought late (18th–19th c.) is specifically the pressed chhana
      sandesh; what 'sandesh' meant in the 16th c. is a question for a specialist. Long-keeping sweets of reduced milk —
      kshirasara, manda (CC Antya 10.26).
  text:
    ru: >-
      Прохожие на улицах Навадвипы дарили малышу Нимаю бананы и сандеш, а Он раздавал угощение женщинам, которые пели
      святые имена; даже воры, уносившие Его, задабривали Его сандешем. Сладости делали из уваренного молока, сахара,
      кокоса, кунжута и рисовой муки. Чхану с сахаром подавали Господу уже в Шантипуре, но
      привычный сегодня прессованный сандеш, по-видимому, сложился позднее, поэтому в игре сладости эпохи — молочно-
      сахарные шарики, лепёшки и чхана с сахаром.
    en: >-
      Passers-by in Navadvipa gave little Nimai bananas and sandesh, and He shared the treats with the women who sang
      the holy names; even the thieves who carried Him off coaxed Him with sandesh. Sweets were made from reduced
      milk, sugar, coconut, sesame and rice flour. Chhana with sugar was already served to the Lord at Shantipur, but
      today's pressed sandesh seems to have taken shape later, so in the game the sweets of the period are
      milk-and-sugar balls, cakes and chhana with sugar.
  hagiography: ["ЧЧ Мадхья 3.48 (*чха̄на̄, ш́аркара̄*)", "ЧЧ Мадхья 14.26", "ЧЧ Мадхья 15.210", "ЧБ Ади 4.94–97", "ЧБ Ади 4.116", "ЧЧ Ади 14.24", "ЧЧ Мадхья 14.31 (кунжутные сладости и пр.)",
                "ЧЧ Антья 10.25–26 (*кш̣ӣраса̄ра, ман̣д̣а* — долго хранящиеся сладости из уваренного молока)"]
  sources: ["Bose 1881, с. 23 (sundesh и batasha на хари-лут — творожный сандеш XIX в., не для эпохи)"]
  images: []
  game: {model: "светлые шарики и плоские лепёшки на листе; без «современного» прессованного сандеша с узором",
         where: ["mishra-house/courtyard", "navadvipa/lane"]}
  todo: "PD-свидетельство о чхане (D. C. Sen? Hobson-Jobson?) и о раннем значении слова «сандеш»"

- id: mc-cooking-for-vishnu
  title: {ru: "Стряпня для Вишну (бхога)", en: "Cooking for Vishnu (bhoga)"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 5.18–31, 5.47–62; ЧЧ Мадхья 3.41–42, 3.56; Лочан, Ади-кханда, ч. 4, ст. 359."
    en: "CB Adi 5.18–31, 5.47–62; CC Madhya 3.41–42, 3.56; Lochana, Adi-khanda pt. 4 v. 359."
  text:
    ru: >-
      В вайшнавском доме пищу готовят не для себя, а для Господа: ничего не пробуют во время стряпни, готовое ставят
      перед Божеством, кладут на каждое блюдо лист туласи и читают мантры, и лишь затем вкушают остатки — прасад.
      Странствующий брахман у Мишры ел только то, что сам приготовил и поднёс своему Гопалу. В Шантипуре жена Адвайты
      готовила, Адвайта подносил Вишну, на рис и овощи положили цветы туласи, рядом поставили кувшины с ароматной водой.
      Подношение несут прикрытым — Шачи шла с ним, укрыв его краем сари.
    en: >-
      In a Vaishnava home food is cooked not for oneself but for the Lord: nothing is tasted while cooking, the
      finished dishes are placed before the Deity with a tulasi leaf on each and mantras recited, and only then are
      the remnants — prasada — eaten. The wandering brahmin at Mishra's ate only what he had cooked himself and
      offered to his Gopala. At Shantipur Advaita's wife cooked, Advaita offered to Vishnu, tulasi flowers were laid
      on the rice and vegetables and jars of scented water set beside them. An offering is carried covered — Shachi
      carried hers under the end of her sari.
  hagiography: ["ЧБ Ади 5.18–31", "ЧБ Ади 5.47–62", "ЧЧ Мадхья 3.41–42", "ЧЧ Мадхья 3.56",
                "Лочан, Ади-кханда, ч. 4, ст. 359"]
  sources: []
  images: []
  game: {model: "блюдо с бхогой перед алтарём, лист туласи на каждом блюде, колокольчик",
         where: ["mishra-house/thakur-ghar", "mishra-house/kitchen"]}

- id: mc-pan
  title: {ru: "Пан: бетель и арека", en: "Pan: betel leaf and areca nut"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: "*гуйа̄, па̄на* — ЧБ Ади 4.21; ЧБ Ади 10.87; медный кувшин с паном — ЧБ Мадхья 7.60; бетель для брахманов — Лочан, Ади-кханда, ч. 14, ст. 89."
    en: "guya, pana — CB Adi 4.21; CB Adi 10.87; a copper jar of pan — CB Madhya 7.60; betel for brahmins — Lochana, Adi-khanda pt. 14 v. 89."
  text:
    ru: >-
      Лист бетеля, свёрнутый с кусочками ореха арека (гуя) и известью, — знак гостеприимства и благой дар: им
      завершают угощение и обряд. После первого выхода матери с младенцем Шачи одарила женщин паном, орехами,
      воздушным рисом, бананами, маслом и синдуром. Пан подносят и Господу; у состоятельных он хранился в медных
      сосудах.
    en: >-
      A betel leaf folded round pieces of areca nut (guya) and lime is a sign of hospitality and an auspicious gift: it
      ends a meal or a rite. After the mother's first outing with the baby, Shachi gave the women pan, areca nuts,
      puffed rice, bananas, oil and sindur. Pan is also offered to the Lord; in wealthy homes it was kept in copper
      vessels.
  hagiography: ["ЧБ Ади 4.21", "ЧБ Ади 10.87", "ЧБ Мадхья 7.60", "Лочан, Ади-кханда, ч. 14, ст. 89"]
  sources: []
  images: []
  game: {model: "свёрнутые листья бетеля на подносе, орехи арека", where: ["mishra-house/courtyard"]}

- id: mc-dhenki
  title: {ru: "Дхенки — рисовая толчея", en: "Dhenki — the foot-operated rice husker"}
  rubric: kitchen
  era_evidence: later-reconstruction
  evidence_note:
    ru: "В житиях пока не найдено; описание по этнографии XIX в. — нужен PD-источник и проверка для XV–XVI вв."
    en: "Not yet found in the hagiographies; described from 19th-c. ethnography — a PD source and a check for the 15th–16th c. are needed."
  text:
    ru: >-
      Рис рушили в дхенки — длинном тяжёлом бревне на опоре, как качели: женщина ногой нажимает на короткий конец,
      отпускает — и длинный конец с пестом падает в ямку с зерном, сбивая шелуху. Работают вдвоём: одна качает, другая
      ворошит зерно рукой. Мерный стук дхенки — звук бенгальской деревни.
    en: >-
      Rice was husked in a dhenki — a long heavy beam on a pivot, like a seesaw: a woman presses the short end with her
      foot and releases it, and the long end with its pestle drops into a pit of grain, knocking off the husk. Two work
      together: one treads, the other stirs the grain by hand. The measured thud of the dhenki is the sound of a
      Bengali village.
  hagiography: []
  sources: ["Day 1874, с. 29 (дхенки на веранде хижины-дхенкишалы)"]
  images: [{file: "material-culture/img/dhenki-rice-husker-assam-photo.jpg", license: "CC-BY-SA 3.0", author: "PranjalBorah / Wikimedia Commons, CC BY-SA 3.0", url: "https://commons.wikimedia.org/wiki/File:Dhenki_(Side_view).jpg", note: "; Wikimedia Commons."}]
