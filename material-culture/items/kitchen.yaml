- id: mc-fuel
  title: {ru: "Топливо: дрова, солома, кизяк", en: "Fuel: wood, straw, dung cakes"}
  rubric: kitchen
  era_evidence: later-reconstruction
  evidence_note:
    ru: "В житиях Ади-лилы не найдено; по этнографии XIX в. и современному сельскому быту — проверить по PD."
    en: "Not found in the Adi-lila hagiographies; from 19th-c. ethnography and village life — to verify in PD sources."
  text:
    ru: >-
      Очаг топили тем, что давал двор: сухими ветками манго и других деревьев, бамбуком, рисовой соломой, сухими
      листьями. Свежий коровий навоз смешивают с соломой, лепят лепёшки (гхунте) и сушат их, прилепив к стене или
      стволу дерева; они горят ровно и долго. Топливо держат под навесом — в сезон дождей всё отсыревает.
    en: >-
      The hearth burned what the homestead provided: dry branches of mango and other trees, bamboo, rice straw, dry
      leaves. Fresh cowdung is mixed with straw, patted into cakes (ghunte) and dried by slapping them onto a wall or a
      tree trunk; they burn evenly and long. Fuel is kept under a shelter, since in the rains everything gets damp.
  hagiography: []
  sources: ["Martin 1838, т. 3, с. xiii–xiv (топливо — кизяк с шелухой)",
            "Day 1874, с. 29–30 (кизяк в коровнике)",
            "Sen 1911, с. 301 (Мукундарам: зимой — огонь из хвороста, собранного в лесу)"]
  images: []
  game: {model: "поленница под соломенным навесом; лепёшки кизяка на стене коровника; стог рисовой соломы",
         where: ["mishra-house/kitchen", "mishra-house/cowshed"], codex: hs_woodpile,
         notes: "лепёшки кизяка — также hs_dung; стог соломы — hs_haystack"}

- id: mc-handi
  title: {ru: "Глиняные горшки (ханди)", en: "Earthen pots (handi)"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Горшки (бханда) с молоком и простоквашей — ЧБ Ади 4.34, 4.101; «горшки и кувшины» — ЧЧ Ади 14.43; новые глиняные
      горшки для подношения — ЧЧ Мадхья 3.53; горшок на очаге — ЧЧ Антья 13.55. Образ горшка, почерневшего от очага, —
      уже у Криттибаса (XV в.).
    en: >-
      Pots (bhanda) of milk and curd — CB Adi 4.34, 4.101; 'pots and jars' — CC Adi 14.43; new earthen pots for an
      offering — CC Madhya 3.53; a pot on the hearth — CC Antya 13.55. The image of a pot blackened by the hearth
      already occurs in Krittibasa (15th c.).
  text:
    ru: >-
      Рис, дал и овощи варили в круглодонных горшках из обожжённой глины; гончары делали их на круге и обжигали
      сотнями. В горшках же держали молоко, простоквашу и гхи — их-то и разбивал маленький Нимай, разливая всё по
      полу. Для подношения Господу брали новые горшки: в Шантипуре сладкий рис с гхи стоял в новых глиняных горшках.
      Посуда дёшева, поэтому осквернившийся горшок не отмывали, а выбрасывали.
    en: >-
      Rice, dal and vegetables were cooked in round-bottomed pots of fired clay, which potters threw on the wheel and
      fired by the hundred. Milk, curd and ghee were also kept in pots — the very ones little Nimai smashed, spilling
      everything on the floor. New pots were used for an offering to the Lord: at Shantipur the sweet rice with ghee
      stood in new clay pots. Such ware was cheap, so a pot that became impure was thrown away rather than washed.
  hagiography: ["ЧБ Ади 4.30–38", "ЧБ Ади 4.101", "ЧЧ Ади 14.43", "ЧЧ Ади 14.73", "ЧЧ Мадхья 3.53", "ЧЧ Антья 13.55"]
  sources: ["Sen, Bengali Ramayanas (1920), с. 96 (закопчённый горшок — Криттибас, XV в.)",
            "Bose 1881, с. 155 (глиняные горшки на кухне и в кладовой)",
            "Mukharji 1888, с. 56 (расписные горшки sakher hanri)",
            "Day 1874, с. 28–29 (кладовая с ханди, полными припасов)"]
  images: [{file: "material-culture/img/devis-1797-bengal-potter-and-wares.jpg", license: "PD (Public Domain Mark 1.0)", author: "Arthur William Devis (1762–1822), гравёр John Wright", url: "https://wellcomecollection.org/works/ck4y7dp4", note: "ок. 1797 (по рисункам, сделанным в Бенгалии в 1790-е).; Wellcome Collection — 580109i (b15801093; image V0046114)."}]
  game: {model: "ханди Ø 20–35 см, круглое дно, отогнутый венчик, красно-коричневые, закопчённые снизу; стоят на кольцах из соломы",
         where: ["mishra-house/kitchen"], codex: hs_handi}

- id: mc-metal-ware
  title: {ru: "Металлическая посуда: бронза, медь, латунь", en: "Metal ware: bell-metal, copper, brass"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Подношение Кришне на металлическом подносе — ЧЧ Мадхья 3.42; медный кувшин с паном и кувшины для воды — ЧБ
      Мадхья 7.60, 7.83; разбитый железный кувшин Шридхара — ЧЧ Ади 10.68. Колокольная бронза (канса) как сплав и её
      ценность — по позднейшим данным, проверить. По Mukharji 1888, для обрядов в Бенгалии брали медь: кансу считали
      недостаточно чистой.
    en: >-
      An offering to Krishna on a metal plate — CC Madhya 3.42; a copper jar of pan and water jars — CB Madhya 7.60,
      7.83; Shridhara's broken iron pot — CC Adi 10.68. Bell-metal (kansa) as an alloy and its value — later data, to
      check. Per Mukharji 1888, copper was used for ritual in Bengal: kansa was not thought pure enough.
  text:
    ru: >-
      Металлическая посуда была ценностью семьи: тарелки (тхала), чаши (бати), кувшины (гхати, лота) из колокольной
      бронзы-кансы, меди и латуни. Её берегли, передавали по наследству и давали в приданое. На металлическом подносе
      подносили пищу Божеству: в Шантипуре одну из трёх частей угощения поставили перед Кришной на металлическом
      блюде, а две другие разложили на банановых листьях. У бедного Шридхара был лишь разбитый железный кувшин — и
      Махапрабху пил из него с любовью.
    en: >-
      Metal ware was a family treasure: plates (thala), bowls (bati) and water pots (ghati, lota) of bell-metal
      (kansa), copper and brass. It was cherished, handed down and given as dowry. Food was offered to the Deity on a
      metal plate: at Shantipur one of the three portions was set before Krishna on a metal dish, the other two on
      banana leaves. Poor Shridhara owned only a broken iron pot — and Mahaprabhu lovingly drank from it.
  hagiography: ["ЧЧ Мадхья 3.42", "ЧЧ Ади 10.68", "ЧБ Мадхья 7.60, 7.83"]
  sources: ["Mukharji 1888, с. 157 (канса: 4 части меди на 1 олова), 186–192 (обрядовая медная утварь; кухонная латунь hanri, bokno; центры ремесла)",
            "Martin 1838, т. 3, с. 101 (латунь, медь, канса — главная ценность, её зарывают как клад)",
            "Hunter 1875, т. 2, с. 240 (тхала, гхати, гхара)",
            "Bose 1881, с. 76–77 (тхала с чашечками бати)"]
  images: []
  game: {model: "кансовое блюдо Ø 30 см (золотисто-серое), латунная лота с узким горлом, медная чаша",
         where: ["mishra-house/kitchen", "mishra-house/thakur-ghar"], codex: hs_brass}
  todo: "свободное фото кансы/латунной лоты"

- id: mc-banana-leaf-plate
  title: {ru: "Банановый лист вместо тарелки", en: "Banana leaf as a plate"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: "ЧЧ Мадхья 3.43–44, 3.68; ЧЧ Ади 17.39; листья кетаки как тарелки — ЧЧ Мадхья 14.37."
    en: "CC Madhya 3.43–44, 3.68; CC Adi 17.39; ketaki leaves as plates — CC Madhya 14.37."
  text:
    ru: >-
      Обычная тарелка Бенгалии — свежий банановый лист: его омывают водой, на середину кладут горкой рис, вокруг —
      овощи и дал, а после трапезы лист уносят. В Шантипуре угощение для Махапрабху и Нитьянанды разложили на целых,
      неразрезанных листьях огромного банана, на рис сверху полили гхи. Господь Сам просил: «Принеси Нам риса и овощей
      на двух листах банана». На пирах в Пури подавали и сшитые листья кетаки.
    en: >-
      The ordinary Bengali plate is a fresh banana leaf: it is rinsed with water, rice is heaped in the middle with
      vegetables and dal round it, and after the meal the leaf is taken away. At Shantipur the meal for Mahaprabhu and
      Nityananda was laid out on whole, uncut leaves of a huge banana, with ghee poured over the rice. The Lord Himself
      asked, "Bring Us rice and vegetables on two banana leaves." At the feasts in Puri stitched ketaki leaves were also used.
  hagiography: ["ЧЧ Мадхья 3.43–44", "ЧЧ Мадхья 3.68", "ЧЧ Ади 17.39", "ЧЧ Мадхья 14.37"]
  sources: ["Day 1874, с. 27, 40–42 (обед на куске бананового листа, латунный гхати с водой)"]
  images: []
  game: {model: "плоский лист с лёгким изгибом, 40×25 см (для пира — целый лист до 1,5 м)",
         where: ["mishra-house/kitchen", "mishra-house/courtyard"]}

- id: mc-leaf-cups
  title: {ru: "Чашечки из листьев и коры банана (дона, кхола)", en: "Leaf and banana-bark cups (dona, khola)"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: "ЧЧ Мадхья 3.51–52, 15.209; Шридхар продаёт чашки из банановых листьев — ЧБ Ади 12.195, 12.202."
    en: "CC Madhya 3.51–52, 15.209; Shridhara sells banana-leaf cups — CB Adi 12.195, 12.202."
  text:
    ru: >-
      Жидкие блюда — дал, супы, сладкий рис — подают в чашечках, сложенных из листьев или вырезанных из плотной
      коры бананового ствола и сколотых щепочкой. Их делали и продавали на рынке: преданный Шридхар жил продажей
      таких чашек. В Шантипуре вокруг каждой горки риса стояло по сто вместительных и прочных чашечек с овощами;
      после трапезы их, как и листья, выбрасывают.
    en: >-
      Liquid dishes — dal, soups, sweet rice — are served in little cups folded from leaves or cut from the thick bark
      of the banana stem and pinned with a splinter. They were made and sold in the market: the devotee Shridhara made
      his living selling such cups. At Shantipur a hundred roomy, sturdy cups of vegetables stood round each heap of
      rice; after the meal they are thrown away, like the leaves.
  hagiography: ["ЧЧ Мадхья 3.51–52", "ЧЧ Мадхья 15.209", "ЧБ Ади 12.195", "ЧБ Ади 12.202"]
  sources: ["Risley 1891, т. 1, с. 68–69 (каста бари делает тарелки и чашечки из листьев — Бихар)"]
  images: []
  game: {model: "чашечка Ø 8–10 см из сложенного листа/коры, сколота щепкой", where: ["mishra-house/kitchen"]}

- id: mc-rice-dal
  title: {ru: "Рис, дал и зерно", en: "Rice, dal and grain"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 4.34 (*дха̄нйа, ча̄лу, мугда* — неочищенный рис, рис, мунг); ЧЧ Мадхья 3.39, 3.44; ЧБ Ади 5.35."
    en: "CB Adi 4.34 (dhanya, chalu, mudga — paddy, husked rice, mung); CC Madhya 3.39, 3.44; CB Adi 5.35."
  text:
    ru: >-
      Основа бенгальской трапезы — варёный рис (бхат), к нему дал из бобов мунг и овощи. В доме держали запасы
      неочищенного риса, очищенного риса и мунга — маленький Нимай рассыпал их по всему дому. Скромное угощение
      брахмана Адвайта описывает так: «немного риса, суп, простые овощи и шпинат». Неочищенный рис (дхан) вместе со
      свежей травой дурва — и знак благословения.
    en: >-
      The base of a Bengali meal is boiled rice (bhat), with dal of mung beans and vegetables. The house kept stores of
      paddy, husked rice and mung — little Nimai scattered them all over the house. Advaita describes a brahmin's
      modest meal as "a little rice, soup, plain vegetables and spinach." Unhusked rice (dhan) together with fresh
      durva grass is also a sign of blessing.
  hagiography: ["ЧБ Ади 4.34", "ЧБ Ади 5.35", "ЧЧ Мадхья 3.39", "ЧЧ Мадхья 3.44", "ЧЧ Ади 13.114"]
  sources: []
  images: []
  game: {model: "корзины и глиняные кувшины с рисом, мунгом; рассыпанное зерно (эпизод шалости)",
         where: ["mishra-house/kitchen", "mishra-house/main-hut"]}

- id: mc-vegetable-dishes
  title: {ru: "Овощи и блюда бенгальской кухни", en: "Vegetables and dishes of the Bengali kitchen"}
  rubric: kitchen
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Перечень — ЧЧ Мадхья 3.44–54 (угощение в доме Адвайты, ок. 1510). Названия блюд — по переводу; бенгальские
      названия сверить с оригиналом. Новосветских овощей (картофель, томат, перец чили) в эпоху нет.
    en: >-
      The list — CC Madhya 3.44–54 (the meal at Advaita's house, c. 1510). Dish names follow the translation;
      Bengali names to be checked with the original. New World vegetables (potato, tomato, chilli) did not exist then.
  text:
    ru: >-
      Кришнадас Кавирадж перечисляет, что жена Адвайты приготовила для Махапрабху: патол, тыква-лау, клубни манакачу,
      салат из имбиря, разные шпинаты, горьковатое шукто, баклажаны, жаренные с молодыми листьями нима, тыква в
      молоке, карри из банановых цветов, лепёшки-бара из мунга и урада, мякоть кокоса, чхана с сахаром, сладкий рис.
      Острота шла от имбиря и чёрного перца — чили в Бенгалии ещё не знали; картофеля и томатов тоже не было.
    en: >-
      Krishnadasa Kaviraja lists what Advaita's wife cooked for Mahaprabhu: patol, lau gourd, manakachu tubers, a
      ginger salad, several spinaches, bitter shukto, aubergine fried with tender neem leaves, gourd cooked in milk, a
      banana-flower curry, bara fritters of mung and urad, coconut flesh, chhana with sugar and sweet rice. Pungency came from
      ginger and black pepper — chilli was not yet known in Bengal, nor were potatoes or tomatoes.
  hagiography: ["ЧЧ Мадхья 3.44–54", "см. также food.yaml (блюда поимённо, рецепты)"]
  sources: ["Sen 1911, с. 608 (списки блюд вайшнавов — ЧЧ Мадхья 3 и 15, Джаянанда)",
            "Sen 1911, с. 247–248 (порядок трапезы: шукта первой — Рамешвара, XVIII в.)",
            "Sen 1911, с. 24 («Дак-вачана»: сезонная еда — горчичное масло, имбирь, ним, кхаи)",
            "Hunter 1875, т. 2, с. 240–241 (чили и табак в бюджете XIX в. — анахронизм для эпохи)"]
  images: []
  game: {model: "набор блюд для сцены трапезы: горка риса, 6–10 чашечек с овощами", where: ["mishra-house/kitchen"],
         notes: "не рисовать красный перец, картофель, томаты"}
