- id: mc-chula
  title: {ru: "Очаг (чула)", en: "The clay hearth (chula)"}
  rubric: kitchen
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      В житиях по дому Мишры очаг не описан; «поставил горшок на очаг» — ЧЧ Антья 13.55 (Вриндаван). Форма —
      этнография. Слово санскритское (chulli), образ закопчённого горшка — у Криттибаса (XV в.).
    en: >-
      The hearth in Mishra's house is not described; 'set the pot on the hearth' — CC Antya 13.55 (Vrindavana). The
      form follows ethnography. The word is Sanskrit (chulli); the image of the sooty pot is in Krittibasa (15th c.).
  text:
    ru: >-
      Бенгальский очаг лепят из глины прямо в полу кухни: подковообразная выемка с отверстием для топлива спереди и
      тремя выступами сверху, на которые ставят горшок. Иногда делают двойную чулу, чтобы готовить сразу два блюда.
      Очаг каждый день обмазывают свежей глиной — он и сам часть чистоты кухни.
    en: >-
      A Bengali hearth is moulded of clay right in the kitchen floor: a horseshoe-shaped pit with a stoking hole in
      front and three raised lugs on top on which the pot sits. Sometimes a double chula is made to cook two dishes at
      once. The hearth is re-smeared with fresh clay every day — it is itself part of the kitchen's purity.
  hagiography: ["ЧЧ Антья 13.55"]
  sources: ["Hobson-Jobson (1903), s.v. Choola, с. 206–207 (санскр. chulli; очаг из глины, навоза и сырцового кирпича)",
            "Sen, Bengali Ramayanas (1920), с. 96 (горшок чернеет от огня очага — образ у Криттибаса, XV в.)",
            "Sen 1911, с. 266 (очаг из трёх кокосов — «Манаса-мангал»)",
            "Risley, Tribes and Castes of Bengal (1891), т. 1, с. 312 (святость домашнего очага)"]
  images: []
  game: {model: "глиняная чула 45×35 см, высота 20 см, три выступа; красноватые угли; над ней ханди",
         where: ["mishra-house/kitchen"], codex: hs_kitchen}
