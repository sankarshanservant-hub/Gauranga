- id: mc-shil-nora
  title: {ru: "Шил-нора — камень для растирания пряностей", en: "Shil-nora — the spice-grinding stone"}
  rubric: kitchen
  era_evidence: later-reconstruction
  evidence_note:
    ru: "В житиях не найдено; этнография — проверить."
    en: "Not found in the hagiographies; ethnography — to check."
  text:
    ru: >-
      Куркуму, имбирь, горчицу и другие пряности растирают на плоской каменной плите (шил) продолговатым камнем-скалкой
      (нора), подливая воду. Шил — тяжёлая, служит десятилетиями; её насекают зубилом, когда поверхность стирается.
    en: >-
      Turmeric, ginger, mustard and other spices are ground on a flat stone slab (shil) with an oblong stone roller
      (nora), adding water. A shil is heavy and lasts for decades; it is re-pecked with a chisel when its surface
      wears smooth.
