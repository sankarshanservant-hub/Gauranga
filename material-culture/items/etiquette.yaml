- id: mc-seeing-off
  title: {ru: "Проводы в путь", en: "Seeing someone off on a journey"}
  rubric: rites
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Разрешение матери перед Гаей — ЧБ Ади 17.12; Рамананда провожает до Бхадраки — ЧЧ Мадхья 1.149; царские сановники
      — до Яджпура, ЧЧ Мадхья 16.150; Мадхавендре дают брахмана, слугу, деньги на дорогу и пропуск с печатью — ЧЧ
      Мадхья 4.152–153; наместник плачет на берегу — ЧЧ Мадхья 16.197; прощание после Дола-ятры — ЧЧ Антья 1.216, 4.207;
      обход матери при прощании — ЧЧ Мадхья 3.211; выход после мангала-арати — ЧЧ Мадхья 4.209, 5.139.
    en: >-
      The mother's permission before Gaya — CB Adi 17.12; Ramananda escorts Him as far as Bhadraka — CC Madhya 1.149;
      royal officers — as far as Jajpur, CC Madhya 16.150; Madhavendra is given a brahmin, a servant, travel money and a
      sealed pass — CC Madhya 4.152–153; the governor weeps on the bank — CC Madhya 16.197; farewells after Dola-yatra —
      CC Antya 1.216, 4.207; circling the mother at parting — CC Madhya 3.211; setting out after mangala-arati — CC
      Madhya 4.209, 5.139.
  text:
    ru: >-
      Уходя в далёкий путь, сначала просят разрешения у матери и старших, кланяются им и обходят их кругом. Гостя
      не отпускают одного: хозяин или его люди провожают его до границы деревни, а почётного — на много дней пути, как
      Рамананда Рай провожал Махапрабху до Бхадраки, а сановники царя — до Яджпура. В дорогу дают спутников, еду,
      деньги на переправы и пошлины, а иногда — грамоту с царской печатью, чтобы сборщики не задерживали. Выходят
      рано утром, после мангала-арати, с именем Хари на устах, а провожающие долго стоят и смотрят вслед.
    en: >-
      Before setting out on a long journey one first asks leave of one's mother and elders, bows to them and walks
      around them. A guest is not let go alone: the host or his men see him to the edge of the village, and an
      honoured guest for many days' journey, as Ramananda Raya escorted Mahaprabhu to Bhadraka, and the king's officers
      to Jajpur. For the road one is given companions, food, money for ferries and tolls, and sometimes a letter with
      the royal seal so that collectors will not hold one up. One leaves early in the morning, after mangala-arati,
      with Hari's name on the lips, and those who see one off stand long gazing after.
  hagiography: ["ЧБ Ади 17.12", "ЧЧ Мадхья 1.149", "ЧЧ Мадхья 16.150", "ЧЧ Мадхья 4.152–153", "ЧЧ Мадхья 16.197",
                "ЧЧ Антья 1.216", "ЧЧ Мадхья 3.211", "ЧЧ Мадхья 5.139"]
