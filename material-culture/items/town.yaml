- id: mc-manuscript-ink
  title: {ru: "Рукописи, чернила и перо", en: "Manuscripts, ink and pen"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Книги в руках Нимая — ЧБ Ади 6.112, 12.2, 12.245; капли чернил (*ликхана-ка̄ли*) — ЧБ Ади 6.46, 6.113. Материал
      (пальмовый лист или бумага) в Бенгалии ок. 1500 г. — проверить.
    en: >-
      Books in Nimai's hands — CB Adi 6.112, 12.2, 12.245; drops of ink (likhana-kali) — CB Adi 6.46, 6.113. The writing
      material (palm leaf or paper) in Bengal c. 1500 — to check.
  text:
    ru: >-
      «Книга» той эпохи — рукопись (пунтхи): стопка длинных узких листов между двумя дощечками, перевязанная шнуром и
      завёрнутая в ткань. Писали тростниковым пером чёрными чернилами из сажи, и школьник Нимай возвращался домой с
      каплями чернил на коже — Вриндаван Дас сравнивает их с пчёлами вокруг цветка чампаки. Книгу почитают как знание
      и не кладут на землю.
    en: >-
      A "book" of the period is a manuscript (punthi): a stack of long narrow leaves between two boards, tied with a
      cord and wrapped in cloth. One wrote with a reed pen in black soot ink, and the schoolboy Nimai came home with
      drops of ink on His skin — Vrindavana Dasa likens them to bees round a champaka flower. A book is revered as
      knowledge and never placed on the ground.
  hagiography: ["ЧБ Ади 6.46", "ЧБ Ади 6.112–113", "ЧБ Ади 12.2", "ЧБ Ади 12.245", "ЧБ Ади 4.53–55"]
  sources: []
  images: [{file: "material-culture/img/vikramashila-1119-palm-leaf-manuscript-folio-cma.jpg", license: "CC0 1.0", author: "писец монастыря Викрамашила (Бихар); живопись — Катманду", url: "https://clevelandart.org/art/1938.301.4.a", note: "воскресенье, 14 сентября 1119 г. (239 г. эры Невар).; The Cleveland Museum of Art — 1938.301.4.a (J. H. Wade Fund). Гуммитемпера и тушь на пальмовом листе, 5,4 × 56,2 см."},
