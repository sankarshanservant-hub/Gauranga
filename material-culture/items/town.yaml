- id: mc-betel-seller
  title: {ru: "Продавец бетеля (баруи, тамбули)", en: "The betel seller (barui, tambuli)"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 12.135–142 (орехи, пан, камфора); Нимай жуёт бетель на улице — ЧБ Ади 12.244."
    en: "CB Adi 12.135–142 (nuts, pan, camphor); Nimai chewing betel in the street — CB Adi 12.244."
  text:
    ru: >-
      Баруи выращивали лиану бетеля в тенистых крытых садах, а тамбули продавали листья и пан. Продавец бетеля, приняв
      юного Нимая как самого бога любви, сам угостил Его орехами, а потом паном с камфорой и пряностями и не взял
      платы. Пан жевали все: Нимай ходил по улицам Навадвипы с бетелем во рту, с тилакой на лбу и книгами в руках.
    en: >-
      Baruis grew the betel vine in shaded, covered gardens, and tambulis sold the leaves and pan. The betel seller,
      seeing young Nimai as the god of love himself, offered Him areca nuts unasked, then pan with camphor and spices,
      and took no payment. Everyone chewed pan: Nimai walked the streets of Navadvipa with betel in His mouth, tilaka
      on His brow and books in His hands.
  hagiography: ["ЧБ Ади 12.135–142", "ЧБ Ади 12.243–245"]
  sources: []
  images: []
  game: {model: "лоток с листьями бетеля во влажной ткани, орехи, известь в коробочке", where: ["navadvipa/market"]}

- id: mc-shridhar-hut
  title: {ru: "Хижина Шридхара", en: "Shridhara's hut"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 12.184–205 (заштопанная одежда, слетевшая с кровли солома, тыква на крыше с молоком и чёрным перцем)."
    en: "CB Adi 12.184–205 (patched clothes, thatch blown off the roof, a gourd on the roof cooked with milk and black pepper)."
  text:
    ru: >-
      Бедный вайшнав Шридхар жил продажей банановых листьев, цветов, стеблей и чашек из листьев. Нимай поддразнивал его:
      одежда в заплатах, с крыши слетела вся солома — а вот почитатели Чанди живут в достатке! Шридхар отвечал, что не
      голодает и всегда одет. На его соломенной кровле росла тыква, и Господь забирал её и ел, сваренную с молоком и
      чёрным перцем; пил Он и из его разбитого железного кувшина.
    en: >-
      The poor Vaishnava Shridhara lived by selling banana leaves, flowers, stems and leaf cups. Nimai teased him: your
      clothes are patched, all the thatch has blown off your roof — yet the worshippers of Chandi live in plenty!
      Shridhara replied that he did not go hungry and always had something to wear. A gourd grew on his thatched roof,
      and the Lord would take it and eat it cooked with milk and black pepper; He also drank from Shridhara's broken
      iron pot.
  hagiography: ["ЧБ Ади 12.184–205", "ЧЧ Ади 10.67–68"]
  sources: []
  images: []
  game: {model: "низкая хижина с прохудившейся кровлей, лиана тыквы-лау на крыше, кипа банановых листьев",
         where: ["navadvipa/lane"], notes: "чёрный перец — подтверждённая пряность эпохи (в отличие от чили)"}

- id: mc-tol-school
  title: {ru: "Тол — санскритская школа", en: "The tol — Sanskrit school"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Гангадас Пандит — ЧБ Ади 8.26 и далее; Нимай — учитель грамматики, ведёт занятия, спорит с учёными — ЧБ Ади 12.2–40;
      две прахары в школе — ЧБ Ади 6.135. Слово «тол» — «Адвайта-пракаша» (примечание к ст. 21); устройство тола — по
      данным XIX в. (Hunter).
    en: >-
      Gangadasa Pandita — CB Adi 8.26 ff.; Nimai as a grammar teacher, holding classes and debating scholars — CB Adi
      12.2–40; two praharas at school — CB Adi 6.135. The word 'tol' — Advaita-prakasha (note to v. 21); how a tol
      was organised — 19th-c. data (Hunter).
  text:
    ru: >-
      Навадвипа славилась учёностью: здесь преподавали грамматику, поэтику, логику-ньяю и законы. Школа (тол) — это дом
      или навес учителя, где ученики сидят на циновках с рукописями; учитель кормит и поселяет учеников, а живёт
      дарами покровителей. Нимай учился у Гангадаса Пандита, а потом сам стал учителем грамматики и вёл уроки в
      чанди-мандапе — открытом павильоне во дворе дома Мукунды Санджая; днём занимался с учениками, а после полудня приходил с ними на берег Ганги, где спорил с учёными так, что те избегали встречи с Ним.
    en: >-
      Navadvipa was famed for learning: grammar, poetics, nyaya logic and law were taught there. A school (tol) is the
      teacher's house or shed where students sit on mats with manuscripts; the teacher feeds and lodges the students
      and lives on gifts from patrons. Nimai studied under Gangadasa Pandita and then became a grammar teacher Himself,
      holding classes in the chandi-mandapa — an open pavilion in the courtyard of Mukunda Sanjaya's house; He taught by day and in the afternoons came with His students to the Ganga's bank, where He debated scholars so
      keenly that they avoided meeting Him.
  hagiography: ["ЧБ Ади 6.135", "ЧБ Ади 8.26 и далее", "ЧБ Ади 12.2–40", "ЧБ Ади 12.91 (чанди-мандапа Мукунды Санджая)", "ЧЧ Ади 16 (победа над Кешавой Кашмири)"]
  sources: []
  images: [{file: "material-culture/img/solvyns-1799-recital-of-mahabharata-katha.jpg", license: "PD (Public Domain Mark 1.0)", author: "F. B. Solvyns", url: "https://wellcomecollection.org/works/wuevghch", note: "1799.; Wellcome Collection — 31376i (b11892146; image V0050400)."},
           {file: "material-culture/img/solvyns-1799-brahmin-singers-kirtan-audience.jpg", license: "PD (Public Domain Mark 1.0)", author: "F. B. Solvyns", url: "https://wellcomecollection.org/works/tggqxjus", note: "1799.; Wellcome Collection — 31414i (b11892523; image V0050401)."}]
  game: {model: "открытый навес-чандимандап, циновки, связки рукописей, светильник; ученики-брахмачари",
         where: ["navadvipa/tol"]}
