# Рубрика «Город и труд» (town): порция 2 — Навадвипа юности Господа (P04–P05). Формат — README.md.

- id: mc-navadvipa-crafts
  title: {ru: "Ремёсла и лавки Навадвипы", en: "Crafts and shops of Navadvipa"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Прогулка Господа по домам ремесленников — ЧБ Ади 12.106–145 (ткач, пастухи, торговец ароматическими маслами,
      цветочник, продавец бетеля, продавец раковин); касты-ремёсла Надии в XIX в. — Hunter 1875, т. 2, с. 47–48 (см.
      research/pd-texts.md).
    en: >-
      The Lord's walk through the craftsmen's houses — CB Adi 12.106–145 (weaver, cowherds, perfumer, florist,
      betel-seller, conch-seller); craft castes of Nadia in the 19th c. — Hunter 1875, vol. 2, pp. 47–48 (see
      research/pd-texts.md).
  text:
    ru: >-
      Навадвипа была огромным городом, где жили люди всех сословий, и каждое ремесло держалось своей общины. Юный
      учитель Нимай обходил их дома с учениками: ткач дал Ему ткань в долг, пастухи угостили молоком, гхи, простоквашей,
      сливками и маслом, торговец ароматами натёр Его душистым маслом, цветочник надел гирлянду, продавец бетеля
      угостил орехами и паном с камфорой, продавец раковин подарил раковину — и никто не взял с Него денег.
    en: >-
      Navadvipa was a huge town where people of every community lived, and each craft was held by its own caste. The
      young teacher Nimai went round their houses with His students: the weaver gave Him cloth on credit, the cowherds
      served Him milk, ghee, curd, cream and butter, the perfumer rubbed Him with scented oil, the florist put a
      garland on Him, the betel-seller treated Him to areca and pan with camphor, the conch-seller gave Him a conch —
      and none of them took money from Him.
  hagiography: ["ЧБ Ади 12.106–145"]
  sources: ["Hunter, Statistical Account of Bengal, т. 2 (1875), с. 47–48 — касты Надии (через research/pd-texts.md)"]
  images: [{file: "material-culture/img/solvyns-1799-market-scene-calcutta.jpg", license: "PD (Public Domain Mark 1.0)", author: "F. B. Solvyns", url: "https://wellcomecollection.org/works/sdf7rm8x", note: "1799.; Wellcome Collection — 31452i (b11892900; image V0050403)."}]
  game: {model: "улица ремесленников: навесы-лавки перед хижинами; ткацкий станок, горшки с молоком, гирлянды, бетель",
         where: ["navadvipa/market"]}

- id: mc-weaver
  title: {ru: "Ткач (тантуваю)", en: "The weaver (tantuvaya)"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 12.108–112; хлопковое ткачество Бенгалии — PD-источники XIX в. (проверить для эпохи)."
    en: "CB Adi 12.108–112; Bengali cotton weaving — 19th-c. PD sources (to check for the period)."
  text:
    ru: >-
      Ткачи Навадвипы ткали хлопковые дхоти, сари и полотна на ручных станках прямо у дома. Когда Нимай попросил отрез
      ткани и сказал, что денег при Нём нет, ткач ответил: «Бери и носи на здоровье, заплатишь, когда захочешь». Ткань
      и одежду в Бенгалии дарили щедро: на празднике рождения и на свадьбе одежду раздавали всем встречным.
    en: >-
      The weavers of Navadvipa wove cotton dhotis, saris and lengths of cloth on handlooms right by their houses. When
      Nimai asked for a piece of cloth and said He had no money with Him, the weaver replied, "Take it and wear it in
      good health; pay when You wish." Cloth and clothes were given generously in Bengal: at the birth festival and
      at the wedding clothes were handed out to everyone.
  hagiography: ["ЧБ Ади 12.108–112", "ЧБ Ади 12.85", "ЧБ Ади 15.123"]
  sources: []
  images: [{file: "material-culture/img/devis-1797-bengal-spinning-and-weaving.jpg", license: "PD (Public Domain Mark 1.0)", author: "A. W. Devis, гравёр Peltro William Tomkins", url: "https://wellcomecollection.org/works/p42s3muw", note: "1797.; Wellcome Collection — 46141i (b12039536; image V0024688)."}]
  game: {model: "ямный ручной станок под навесом, мотки пряжи", where: ["navadvipa/market"]}
  todo: "тип станка в Бенгалии ок. 1500 (ямный?) — PD (Mukharji 1888)"

- id: mc-cowherds
  title: {ru: "Пастухи-гопы и молочный ряд", en: "Cowherds (gopas) and dairy sellers"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 12.113–121 (веранда дома пастуха; молоко, гхи, дадхи, сливки, масло)."
    en: "CB Adi 12.113–121 (the cowherd's veranda; milk, ghee, dadhi, cream, butter)."
  text:
    ru: >-
      Гопы (гоалы) держали коров и продавали молоко, простоквашу и гхи. Нимай уселся на веранде дома пастуха, в шутку
      подражая брахманам, и попросил «милостыни» — молока и простокваши; пастухи с радостью принесли молоко, гхи,
      простоквашу, сливки и масло. Для вайшнавов гопы — особая община: из неё вышли спутники Кришны во Врадже.
    en: >-
      The gopas (goalas) kept cows and sold milk, curd and ghee. Nimai sat on a cowherd's veranda, jokingly imitating
      the brahmins, and asked for "alms" — milk and curd; the cowherds gladly brought milk, ghee, curd, cream and
      butter. For Vaishnavas the gopas are a special community: Krishna's companions in Vraja came from among them.
  hagiography: ["ЧБ Ади 12.113–121"]
  sources: []
  images: []
  game: {model: "веранда (дава) под свесом соломенной кровли, глиняные горшки с молоком на коромысле",
         where: ["navadvipa/market"]}

- id: mc-perfumer-florist
  title: {ru: "Торговец ароматами и цветочник", en: "The perfumer and the florist"}
  rubric: town
  era_evidence: hagiography
  evidence_note:
    ru: "ЧБ Ади 12.122–134; сандал, агуру, гирлянды на свадьбе — ЧБ Ади 15.84–100."
    en: "CB Adi 12.122–134; sandal, aguru and garlands at the wedding — CB Adi 15.84–100."
  text:
    ru: >-
      Гандхабаники торговали благовониями, ароматическими маслами, сандалом и агуру; малакары растили цветы и плели
      гирлянды. Торговец ароматами натёр Нимая душистым маслом и сказал: если завтра после омовения тело ещё будет
      благоухать, заплатишь сколько хочешь; цветочник без денег надел на Него гирлянду. Без сандаловой пасты и
      гирлянд не обходился ни один праздник: на свадьбе ими одаривали всех брахманов.
    en: >-
      Gandhabaniks traded in incense, scented oils, sandal and aguru; malakars grew flowers and strung garlands. The
      perfumer rubbed Nimai with fragrant oil and said that if the scent still lingered after tomorrow's bath, He could
      pay whatever He liked; the florist put a garland on Him for nothing. No festival went without sandal paste and
      garlands: at the wedding every brahmin was given them.
  hagiography: ["ЧБ Ади 12.122–134", "ЧБ Ади 15.84–100"]
  sources: []
  images: []
  game: {model: "лавка с сосудиками масел; корзины цветов (жасмин, бархатцы? — бархатцы новосветские, не ставить!)",
         where: ["navadvipa/market"], notes: "бархатцы (Tagetes) — американское растение; для гирлянд эпохи — жасмин, мальти, лотос"}
