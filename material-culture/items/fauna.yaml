- id: mc-jharikhanda-animals
  title: {ru: "Звери Джхарикханды поют «Кришна»", en: "The beasts of Jharikhanda chant 'Krishna'"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 17.25–44 (тигры, слоны, носороги, вепри, олени, павлины; тигр, на которого наступил Господь; слоны,
      обрызганные водой), 17.197–218 (олени лижут тело Господа, попугаи и павлины). Позднее житие (ок. 1615) со слов
      Балабхадры Бхаттачарьи через Сварупу/Рагхунатху дасу.
    en: >-
      CC Madhya 17.25–44 (tigers, elephants, rhinoceroses, boars, deer, peacocks; the tiger the Lord stepped on; the
      elephants splashed with water), 17.197–218 (deer licking the Lord's body, parrots and peacocks). A later
      hagiography (c. 1615) from Balabhadra Bhattacharya's account.
  text:
    ru: >-
      По дороге из Пури во Вриндаван Махапрабху с одним спутником, Балабхадрой Бхаттачарьей, шёл через дикие леса
      Джхарикханды — нынешние Джаркханд и север Ориссы. Тигры и слоны сходили с тропы. Однажды Господь в экстазе
      наступил на спящего тигра и воскликнул: «Пой: Кришна!» — и тигр поднялся, запел «Кришна!» и пустился в пляс.
      Стадо диких слонов, обрызганное водой из реки, затрубило и закружилось в танце; тигры и олени шли рядом с Ним,
      обнимались и плакали, а павлины танцевали, и попугаи пели вслед.
    en: >-
      On the way from Puri to Vrindavana Mahaprabhu, with a single companion, Balabhadra Bhattacharya, crossed the wild
      forests of Jharikhanda — today's Jharkhand and northern Orissa. Tigers and elephants left the path. Once in
      ecstasy the Lord stepped on a sleeping tiger and cried, "Chant: Krishna!" — and the tiger rose, chanted "Krishna!"
      and began to dance. A herd of wild elephants, splashed with river water, trumpeted and whirled in dance; tigers
      and deer walked beside Him, embraced and wept, while peacocks danced and parrots sang after Him.
  hagiography: ["ЧЧ Мадхья 17.1", "ЧЧ Мадхья 17.25–44", "ЧЧ Мадхья 17.197–218", "ЧЧ Антья 4.203 (Джхарикханда — плохая вода)"]
  sources: []
  images: []
  game: {model: "лес сал и бамбука, тропа; тигр, слоны у реки, олени-читалы, павлины",
         where: ["travel/jharikhanda"], notes: "ключевой эпизод для уровня «Джхарикханда»"}

- id: mc-tiger
  title: {ru: "Тигр", en: "The tiger"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Тигры на берегу и крокодилы в воде на пути в Пури у Чхатрабхоги — ЧБ Антья 2.135–136; Чайтанья дас (спутник
      Нитьянанды) играл с тиграми и запрыгивал им на спину — ЧБ Антья 5.426–429, ЧЧ Ади 11.20; тигровые шкуры — ЧЧ
      Мадхья 24.239; тигр в Джхарикханде — см. mc-jharikhanda-animals; коготь-оберег — mc-tiger-claw.
    en: >-
      Tigers on the bank and crocodiles in the water on the way to Puri near Chhatrabhoga — CB Antya 2.135–136;
      Chaitanya dasa (Nityananda's associate) played with tigers and leapt on their backs — CB Antya 5.426–429, CC Adi
      11.20; tiger skins — CC Madhya 24.239; the Jharikhanda tiger — see mc-jharikhanda-animals; the claw amulet —
      mc-tiger-claw.
  text:
    ru: >-
      Бенгальский тигр (бенг. багх, санскр. вьягхра) в те времена водился не только в Сундарбане, но и в зарослях вдоль
      рек и в лесах западной Бенгалии и Ориссы. Плывя к Пури через устье Ганги у Чхатрабхоги, лодочники боялись:
      пристанешь к берегу — нападёт тигр, перевернёшься — съедят крокодилы, а в протоках ещё и разбойники. Но для
      преданных Нитьянанды тигр не был страшен: Чайтанья дас, опьянённый премой, гонялся за тиграми и даже садился им
      на спину, и они не трогали его.
    en: >-
      The Bengal tiger (Bengali bagh, Sanskrit vyaghra) then lived not only in the Sundarbans but also in the thickets
      along the rivers and in the forests of western Bengal and Orissa. Sailing to Puri through the Ganga's mouth near
      Chhatrabhoga, the boatmen were afraid: land on the bank and a tiger attacks, capsize and the crocodiles eat you,
      and there are pirates in the channels too. But to Nityananda's devotees the tiger was no terror: Chaitanya dasa,
      intoxicated with prema, chased tigers and even sat on their backs, and they did him no harm.
  hagiography: ["ЧБ Антья 2.135–136", "ЧБ Антья 5.426–429", "ЧБ Антья 5.725", "ЧЧ Ади 11.20", "ЧЧ Мадхья 17.28–29",
                "ЧЧ Мадхья 24.239"]
  sources: []
  images: []
  game: {model: "тигр 2,7–3 м, полосатая шкура; следы на илистом берегу", where: ["travel/chhatrabhoga", "travel/jharikhanda"]}

- id: mc-elephants-horses
  title: {ru: "Слоны и кони знати", en: "Elephants and horses of the nobility"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Царские одежды, слоны, кони…» на Курукшетре (Радха о Кришне) — ЧЧ Мадхья 1.79 (образ); Гопинатха Паттанаяка
      предлагает царской казне более десятка лошадей в уплату долга, царевич занижает цену — ЧЧ Антья 9.21–52; дикие
      слоны Джхарикханды — ЧЧ Мадхья 17.30–33. Конница и боевые слоны султана Гауды и Гаджапати — общеисторически.
    en: >-
      "Royal dress, elephants, horses…" at Kurukshetra (Radha on Krishna) — CC Madhya 1.79 (an image); Gopinatha
      Pattanayaka offers the royal treasury over ten horses against his debt, and the prince undervalues them — CC Antya
      9.21–52; wild elephants of Jharikhanda — CC Madhya 17.30–33. The cavalry and war elephants of the Gauda sultan and
      the Gajapati — general history.
  text:
    ru: >-
      Простые бенгальцы ходили пешком, плыли на лодках или ехали в повозке на быках; кони и слоны были роскошью
      правителей. Сам титул царя Ориссы — Гаджапати, «владыка слонов», а султан Гауды держал конницу и боевых слонов.
      Кони были дорогим товаром: брат Рамананды Рая, Гопинатха Паттанаяка, задолжав казне, предлагал вместо денег
      своих лошадей и рассердился, когда царевич занизил им цену, — за что едва не поплатился жизнью, пока его не
      спасла милость Махапрабху.
    en: >-
      Ordinary Bengalis walked, went by boat or rode in a bullock-cart; horses and elephants were the luxury of rulers.
      The very title of the king of Orissa is Gajapati, "lord of elephants", and the sultan of Gauda kept cavalry and war
      elephants. Horses were costly goods: Ramananda Raya's brother Gopinatha Pattanayaka, in debt to the treasury,
      offered his horses instead of money and was angered when the prince set too low a price on them — for which he
      nearly paid with his life, until Mahaprabhu's mercy saved him.
  hagiography: ["ЧЧ Антья 9.21–52", "ЧЧ Мадхья 1.79", "ЧЧ Мадхья 17.30–33"]
  sources: []
  images: []
  game: {model: "боевой слон с попоной и паланкином-хаудой; конь с седлом и кистями", where: ["puri/palace", "gauda/court"]}
  todo: "найти в ЧБ/ЧЧ слонов и коней Хуссейн-шаха (ЧЧ Мадхья 1, сцена в Рамакели)"

- id: mc-deer
  title: {ru: "Олени", en: "Deer"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Олени Джхарикханды поют и танцуют с тиграми — ЧЧ Мадхья 17.37–42; во Вриндаване олени лижут тело Господа и плачут
      — ЧЧ Мадхья 17.197–207; оленьи шкуры как сиденья — ЧЧ Мадхья 24.239.
    en: >-
      The deer of Jharikhanda sing and dance with tigers — CC Madhya 17.37–42; in Vrindavana deer lick the Lord's body
      and weep — CC Madhya 17.197–207; deerskins as seats — CC Madhya 24.239.
  text:
    ru: >-
      В лесах между Бенгалией и Ориссой паслись пятнистые олени-читалы, тёмные антилопы-кришнасара и мелкие лающие
      олени. Обычно пугливые, они при виде Махапрабху не убегали, а шли за Ним, лизали Ему руки и тело, и из их глаз
      текли слёзы; Господь обнимал их за шеи и плакал вместе с ними, вспоминая оленей Вриндавана, что смотрят на
      Кришну с любовью. Оленья шкура служила аскетам сиденьем для медитации.
    en: >-
      In the forests between Bengal and Orissa grazed spotted chital deer, dark blackbuck (krishnasara) and small
      barking deer. Usually shy, at the sight of Mahaprabhu they did not flee but followed Him, licked His hands and
      body, and tears flowed from their eyes; the Lord put His arms round their necks and wept with them, remembering the
      deer of Vrindavana who gaze on Krishna with love. A deerskin served ascetics as a seat for meditation.
  hagiography: ["ЧЧ Мадхья 17.36–42", "ЧЧ Мадхья 17.197–207", "ЧЧ Мадхья 24.239"]
  sources: []
  images: []
  game: {model: "читал 90 см в холке, рыжий в белых пятнах; самец-кришнасара с винтовыми рогами",
         where: ["travel/jharikhanda", "vrindavan"]}

- id: mc-jackal
  title: {ru: "Шакал", en: "The jackal"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Шакалы и собаки в прасаде и у Ганги — ЧБ Антья 1.118–119, Лочан Мадхья 22.189–196, Сутра 4.256; «логики-шакалы» —
      ЧЧ Мадхья 12.183; «разве шакалы не ходят туда?» (о Каши) — Мурари 2.3.7, Карнапура 6.9; насмешливое прозвище
      «шакал» — ЧБ Ади 14.87. Ночной вой — общее наблюдение (в житиях не найден).
    en: >-
      Jackals and dogs with prasada and by the Ganga — CB Antya 1.118–119, Lochana Madhya 22.189–196, Sutra 4.256;
      "logician-jackals" — CC Madhya 12.183; "do not jackals go there too?" (of Kashi) — Murari 2.3.7, Karnapura 6.9; the
      mocking nickname "jackal" — CB Adi 14.87. The night howling is a general observation (not found in the texts).
  text:
    ru: >-
      С наступлением темноты над бенгальскими деревнями поднимается вой шакалов (бенг. шеял): одна стая заводит
      «хуа-хуа», другая отвечает ей с того берега, и так каждую стражу ночи. Днём шакалы прячутся в зарослях, а ночью
      подходят к жилью и к местам кремации. В житиях шакал — образ пустого крикуна: Сарвабхаума говорит, что, живя
      среди «логиков-шакалов», он и сам мог только лаять. Но и шакал, живущий у Ганги, удачливее богача вдали от неё, а прасад
      Махапрабху, по слову Лочана, достаётся даже шакалам и собакам.
    en: >-
      As darkness falls a howling of jackals (Bengali sheyal) rises over the Bengali villages: one pack starts its
      "hua-hua", another answers from the far bank, and so at every watch of the night. By day jackals hide in the
      thickets; by night they come close to houses and to the cremation grounds. In the hagiographies the jackal is an
      image of empty noise: Sarvabhauma says that living among "logician-jackals" he too could only bark. Yet even a
      jackal living by the Ganga is luckier than a rich man far from her, and Mahaprabhu's prasada, says Lochana, reaches
      even jackals and dogs.
  hagiography: ["ЧЧ Мадхья 12.183", "ЧБ Антья 1.118–119", "ЧБ Ади 14.87", "Лочан, Сутра-кханда, ч. 4, ст. 256",
                "Лочан, Мадхья-кханда, ч. 22, ст. 189, 196", "Мурари 2, сарга 3, ст. 7", "Карнапура, сарга 6.9"]
  sources: []
  images: []
  game: {model: "шакал 70–80 см, рыжевато-серый", where: ["navadvipa/fields", "ganga-ghat"],
         notes: "звук ночного воя — research/audio.md"}

- id: mc-dogs-cats
  title: {ru: "Собаки и кошки", en: "Dogs and cats"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Пёс, прибившийся к паломникам Шивананды Сена: платил лодочнику, кормил рисом, пёс получил от Господа мякоть кокоса
      и стал повторять имя — ЧЧ Антья 1.17–33; «даже собака или кошка в твоём доме обретёт преданность» (Шривасу) — ЧБ
      Мадхья 8.20–21; «даже пёс Кулинаграма Мне дорог» — ЧЧ Ади 10.82; собака на гравюре — img/bengal-thatched-huts-dog-etching.jpg.
    en: >-
      The dog that joined Shivananda Sena's pilgrims: he paid the boatman, fed it rice, and the dog received coconut
      pulp from the Lord and chanted the Name — CC Antya 1.17–33; "even a dog or cat in your house will gain devotion"
      (to Shrivasa) — CB Madhya 8.20–21; "even a dog of Kulinagrama is dear to Me" — CC Adi 10.82.
  text:
    ru: >-
      Собаки в бенгальской деревне живут при домах и на улицах полудикими, их считают нечистыми и в дом не пускают.
      Тем трогательнее история бродячего пса, прибившегося к каравану паломников Шивананды Сена: Шивананда кормил его
      рисом, а когда лодочник не хотел брать собаку на переправу, заплатил за неё. В Пури Махапрабху бросил этому псу
      мякоть зелёного кокоса и сказал: «Повторяй: Рама, Кришна, Хари!» — и пёс повторил имена и получил освобождение.
      Кошки ловили мышей в кладовых; Господь обещал Шривасу, что даже кошка и собака в его доме обретут преданность.
    en: >-
      Dogs in a Bengali village live half-wild around houses and in the lanes; they are held unclean and not let
      indoors. All the more touching is the story of the stray dog that joined Shivananda Sena's caravan of pilgrims:
      Shivananda fed it rice, and when the boatman would not take the dog across, he paid for it. In Puri Mahaprabhu
      threw the dog green-coconut pulp and said, "Chant: Rama, Krishna, Hari!" — and the dog chanted the names and was
      liberated. Cats caught mice in the storerooms; the Lord promised Shrivasa that even the cat and the dog in his
      house would gain devotion.
  hagiography: ["ЧЧ Антья 1.17–33 (кокос — 1.28–30)", "ЧБ Мадхья 8.20–21", "ЧЧ Ади 10.82"]
  sources: []
  images: [{file: "material-culture/img/bengal-thatched-huts-dog-etching.jpg", license: "PD",
            author: "неизвестен (Wellcome Collection 42184i, нач. XIX в.)", url: "https://wellcomecollection.org/works/kmqst6k6"}]
  game: {model: "рыжая пария-собака 50 см; полосатая серая кошка", where: ["navadvipa/lane", "travel/ferry", "puri"]}

- id: mc-cattle-buffalo
  title: {ru: "Быки, буйволы, козы", en: "Bullocks, buffaloes, goats"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Мальчики с Нимаем возвращаются домой, трубя в буйволиные рога (игра в пастушков) — ЧБ Ади 9.31; буйволиный рожок
      в наряде Кришны — ЧБ Антья 5.352, 7.54; коровы из Тайланги у Львиных врат — ЧЧ Антья 17.12–18; «вол маслобойщика
      вечно ходит по кругу» — Лочан, Мадхья 2.169; коза — в поговорках (ЧЧ Мадхья 15.179). Коровы — mc-cowshed.
    en: >-
      The boys with Nimai come home blowing buffalo horns (playing cowherds) — CB Adi 9.31; the buffalo horn in Krishna's
      attire — CB Antya 5.352, 7.54; cows from Tailanga by the Lion Gate — CC Antya 17.12–18; "the oil-man's ox forever
      walks in a circle" — Lochana, Madhya 2.169; goats in proverbs (CC Madhya 15.179). Cows — mc-cowshed.
  text:
    ru: >-
      Корова — кормилица и святыня, а работу делают быки: они пашут поля, тянут повозки, вращают маслобойню и сахарный
      пресс — «как вол маслобойщика, вечно ходящий по кругу», говорит Лочан. Чёрные буйволы с огромными загнутыми
      рогами лежат в прудах, спасаясь от жары; их молоко жирнее коровьего, а из рогов делают рожки — маленький Нимай с
      друзьями, играя в пастушков, возвращался вечером домой, трубя в буйволиные рога. В Пури, у Львиных врат, Господь
      однажды упал без чувств среди коров, пришедших из Тайланги, и они обнюхивали Его и не хотели отходить.
    en: >-
      The cow is nurse and sacred, but the bullocks do the work: they plough, draw carts, turn the oil-mill and the sugar
      press — "like the oil-man's ox that forever walks in a circle", says Lochana. Black buffaloes with huge
      swept-back horns lie in the ponds to escape the heat; their milk is richer than cow's, and their horns make horns
      for blowing — little Nimai and His friends, playing cowherds, came home in the evening blowing buffalo horns. In
      Puri, by the Lion Gate, the Lord once fell unconscious among cows that had come from Tailanga, and they sniffed Him
      and would not leave Him.
  hagiography: ["ЧБ Ади 9.31", "ЧБ Антья 5.352–353", "ЧБ Антья 7.54, 7.67", "ЧЧ Антья 17.12–18", "Лочан, Мадхья-кханда, ч. 2, ст. 169",
                "ЧЧ Мадхья 15.179"]
  sources: []
  images: []
  game: {model: "горбатый бык-зебу (светлый, 1,2 м в холке); чёрный буйвол в пруду; маленькие чёрные бенгальские козы",
         where: ["mishra-house/cowshed", "mishra-house/pond", "puri/simha-dvara"]}

- id: mc-crocodiles
  title: {ru: "Крокодилы Ганги", en: "Crocodiles of the Ganga"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «В сезон дождей Ганга кишит крокодилами», Нитьянанда плавает и пытается их поймать — ЧБ Мадхья 12.6, 13.137;
      хватает крокодила за хвост — ЧБ Мадхья 5.75–76; крокодилы у Чхатрабхоги — ЧБ Антья 2.135–136; Падмавати «прекрасна
      крокодилами, черепахами, рыбами» — Лочан, Ади 12.88. Вид (гавиал / болотный крокодил) в текстах не различается.
    en: >-
      "In the rainy season the Ganga teems with crocodiles", Nityananda swims and tries to catch them — CB Madhya 12.6,
      13.137; He grabs a crocodile by the tail — CB Madhya 5.75–76; crocodiles at Chhatrabhoga — CB Antya 2.135–136; the
      Padmavati "beautiful with crocodiles, turtles and fish" — Lochana, Adi 12.88. The species (gharial / mugger) is not
      distinguished in the texts.
  text:
    ru: >-
      В Ганге водились два вида крокодилов: длиннорылый гавиал, ловящий рыбу узкими челюстями, и опасный для людей
      болотный крокодил-магар (бенг. кумир). В сезон дождей, когда река разливается, их особенно много, и купальщики у
      гхатов остерегаются. Но Нитьянанда, весь в настроении игры, бросался в разлившуюся Гангу и гонялся за
      крокодилами, а однажды схватил одного за хвост — так что Гададхара и Шривас в ужасе звали Махапрабху, и лишь Его
      уговоры вернули Нитьянанду на берег.
    en: >-
      Two kinds of crocodile lived in the Ganga: the long-snouted gharial, catching fish in its narrow jaws, and the
      mugger (Bengali kumir), dangerous to people. In the rains, when the river floods, they are especially many, and
      bathers at the ghats are wary. But Nityananda, all in a playful mood, would plunge into the swollen Ganga and chase
      crocodiles, and once seized one by the tail — so that Gadadhara and Shrivasa called on Mahaprabhu in terror, and
      only His coaxing brought Nityananda back to the bank.
  hagiography: ["ЧБ Мадхья 5.75–76", "ЧБ Мадхья 12.6", "ЧБ Мадхья 13.137", "ЧБ Антья 2.135–136", "Лочан, Ади-кханда, ч. 12, ст. 88"]
