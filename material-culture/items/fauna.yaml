- id: mc-water-birds
  title: {ru: "Водные птицы: чакравака, журавль-сарас, цапли, хамса", en: "Water birds: chakravaka, sarus crane, herons, hamsa"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Пары чакравак появляются из воды в видении Господа — ЧЧ Антья 18.95; ожерелье Кришны — «вереница белых цапель/
      журавлей под тучей» — ЧЧ Мадхья 21.109, Антья 15.66; «цапля среди лебедей» — ЧЧ Антья 5.129, 7.98; «цапля
      пребывает в созерцании» (о лжеаскетах) — Лочан, Мадхья 2.169; святые у Ганги как пчёлы, лебеди и утки — ЧЧ Ади 2.2.
    en: >-
      Pairs of chakravakas rise from the water in the Lord's vision — CC Antya 18.95; Krishna's necklace — "a line of
      white cranes/herons under a cloud" — CC Madhya 21.109, Antya 15.66; "a heron among swans" — CC Antya 5.129, 7.98;
      "the heron is ever in meditation" (of false ascetics) — Lochana, Madhya 2.169; saints by the Ganga like bees,
      swans and ducks — CC Adi 2.2.
  text:
    ru: >-
      Над старицами и рисовыми полями Бенгалии всегда кружат водные птицы. Белые цапли (бак) неподвижно стоят в воде,
      высматривая рыбу, — поговорка называет их притворщиками, «погружёнными в созерцание». Огненно-рыжие утки-чакраваки
      (Tadorna ferruginea) прилетают на зиму и держатся парами; по поверью, ночью супруги разлучаются и перекликаются до
      утра — поэтому чакравака стала образом любящих в разлуке. Огромный серый журавль-сарас с красной головой танцует
      парой на полях, а хамса — белый гусь-лебедь — у поэтов умеет отделять молоко от воды.
    en: >-
      Water birds always circle over the old river-beds and rice fields of Bengal. White egrets (bak) stand motionless
      in the water watching for fish — the proverb calls them hypocrites "sunk in meditation". Flame-coloured ruddy
      shelducks, the chakravakas (Tadorna ferruginea), come for the winter and keep in pairs; by belief the mates are
      parted at night and call to each other till dawn — so the chakravaka became the image of lovers in separation. The
      huge grey sarus crane with its red head dances in pairs in the fields, and the hamsa — the white swan-goose — in
      poetry can separate milk from water.
  hagiography: ["ЧЧ Антья 18.95", "ЧЧ Мадхья 21.109", "ЧЧ Антья 15.66", "ЧЧ Антья 17.43", "ЧЧ Антья 5.129", "ЧЧ Антья 7.98",
                "ЧЧ Ади 2.2", "Лочан, Мадхья-кханда, ч. 2, ст. 169"]
  sources: []
  images: []
  audio: []
  game: {model: "белая цапля 90 см на мелководье; пара рыжих уток; журавль-сарас 1,5 м", where: ["mishra-house/pond", "navadvipa/fields", "ganga-ghat"]}

- id: mc-crow-kite-owl
  title: {ru: "Ворона, коршун, сова", en: "Crow, kite and owl"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Он превратил ворону в Гаруду» (Сарвабхаума о себе) — ЧЧ Мадхья 12.182; вороны клюют плоды нима — ЧЧ Мадхья
      8.257; «как совам нестерпим свет солнца» — ЧЧ Ади 3.85. Коршуны над рынками и гхатами — общее наблюдение
      (в житиях пока не найдены).
    en: >-
      "He turned a crow into Garuda" (Sarvabhauma of himself) — CC Madhya 12.182; crows peck neem fruit — CC Madhya
      8.257; "as owls cannot bear the sunlight" — CC Adi 3.85. Kites over markets and ghats — general observation (not
      yet found in the texts).
  text:
    ru: >-
      Серошейная ворона (бенг. каак) — самая шумная соседка бенгальского двора: она ворует всё, что оставлено без
      присмотра, каркает на крышах с рассвета и, по поверью, карканьем возвещает о гостях. В житиях ворона — образ
      низкого и непреданного: Сарвабхаума Бхаттачарья говорил, что Махапрабху превратил ворону в Гаруду, царя птиц.
      Над рынками и гхатами парят чёрные коршуны (чил), выхватывая куски на лету, а по ночам ухают маленькие пятнистые
      совы (печа) — сова не выносит солнца, как неверующий не выносит истины.
    en: >-
      The house crow (Bengali kak) is the noisiest neighbour of a Bengali yard: it steals anything left unwatched,
      caws on the roofs from dawn and, by belief, announces guests with its cawing. In the hagiographies the crow is an
      image of the low and faithless: Sarvabhauma Bhattacharya said Mahaprabhu had turned a crow into Garuda, king of
      birds. Black kites (chil) soar over the markets and ghats, snatching scraps in flight, and at night little spotted
      owlets (pecha) hoot — the owl cannot bear the sun, as the faithless cannot bear the truth.
  hagiography: ["ЧЧ Мадхья 12.182", "ЧЧ Мадхья 8.257", "ЧЧ Ади 3.85"]
  sources: []
  images: []
  audio: []
  game: {model: "серошейная ворона 40 см; чёрный коршун в небе; пятнистый сыч 20 см в дупле", where: ["mishra-house/courtyard", "ganga-ghat", "navadvipa/market"]}

- id: mc-bees
  title: {ru: "Пчёлы и шмели (бхрамара)", en: "Bees and black bees (bhramara)"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Капли чернил на теле Нимая — «как пчёлы вокруг чампаки» — ЧБ Ади 6.113; шмели кружат у стоп — ЧЧ Ади 5.190;
      шмели поют на пятой ноте во Вриндаване — ЧЧ Мадхья 17.199; преданные — пчёлы у лотосных стоп — ЧЧ Ади 10.1, 11.1,
      12.1; шмели у гирлянды из туласи — ЧЧ Антья 15.51–52; мёд в подношениях — mc-banyan-shashthi (Лочан).
    en: >-
      Ink-drops on Nimai's body "like bees round a champaka" — CB Adi 6.113; black bees circle the feet — CC Adi 5.190;
      bees hum in the fifth note in Vrindavana — CC Madhya 17.199; devotees are bees at the lotus feet — CC Adi 10.1,
      11.1, 12.1; bees at the tulasi garland — CC Antya 15.51–52; honey in offerings — mc-banyan-shashthi (Lochana).
  text:
    ru: >-
      Бхрамара — большой чёрный шмель-плотник, гудящий над цветами, — едва ли не самое частое сравнение житий. Преданные,
      говорит Кришнадас Кавирадж, подобны пчёлам, опьянённым мёдом лотосных стоп Господа; взгляды Кришны — как чёрные
      шмели у цветов; шмели слетаются к Его гирлянде из туласи. Дикие пчёлы (Apis dorsata) лепят огромные соты на
      высоких деревьях и под карнизами; мёд (мадху) собирают лесные люди и продают на рынке — он нужен для обрядов и
      лекарств.
    en: >-
      The bhramara — the big black carpenter bee humming over the flowers — is almost the commonest comparison in the
      hagiographies. Devotees, says Krishnadasa Kaviraja, are like bees drunk on the honey of the Lord's lotus feet;
      Krishna's glances are like black bees at flowers; bees swarm to His tulasi garland. Wild rock bees (Apis dorsata)
      build huge combs on tall trees and under eaves; honey (madhu) is gathered by forest people and sold in the market —
      it is needed for rites and medicines.
  hagiography: ["ЧБ Ади 6.113", "ЧЧ Ади 5.190", "ЧЧ Ади 10.1", "ЧЧ Мадхья 17.199", "ЧЧ Антья 1.158–160", "ЧЧ Антья 15.51–52",
                "Лочан, Шеша-кханда, ч. 4, ст. 256"]
  sources: []
  images: []
  audio: []
  game: {model: "чёрный шмель 2–3 см над цветами; полукруглые соты 1 м на ветви", where: ["mishra-house/courtyard", "navadvipa/garden"]}

- id: mc-night-insects
  title: {ru: "Светлячки, сверчки, цикады, комары", en: "Fireflies, crickets, cicadas, mosquitoes"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Перед тобой, сияющим, как солнце, я — незначительный светлячок» (Рупа) — ЧЧ Антья 1.173; Валлабха Бхатта «как
      светлячок» среди преданных — ЧЧ Антья 7.60. Сверчки, цикады и комары в житиях эпохи пока не найдены — описание по
      общему наблюдению.
    en: >-
      "Before you, shining like the sun, I am an insignificant firefly" (Rupa) — CC Antya 1.173; Vallabha Bhatta "like a
      firefly" among the devotees — CC Antya 7.60. Crickets, cicadas and mosquitoes not yet found in the period's
      hagiographies — described from general observation.
  text:
    ru: >-
      Бенгальская ночь полна звуков и огоньков. В сезон дождей кусты и бамбук вдоль прудов мерцают тысячами светлячков
      (джонаки), и Рупа Госвами, смиряясь, называет себя светлячком перед солнцем — Санатаной. Сверчки звенят всю ночь
      в траве, днём в жару пронзительно трещат цикады, а после дождей звенят тучи комаров — от них спасаются дымом
      сухого навоза и пологом. Хором лягушек в залитых полях начинается муссон.
    en: >-
      A Bengali night is full of sounds and little lights. In the rains the bushes and bamboo along the ponds twinkle
      with thousands of fireflies (jonaki), and Rupa Gosvami, humbling himself, calls himself a firefly before the sun.
      Crickets ring all night in the grass, by day in the heat cicadas shrill, and after the rains swarms of mosquitoes
      whine — people ward them off with the smoke of dry dung and with a net canopy. The monsoon begins with the chorus of
      frogs in the flooded fields.
  hagiography: ["ЧЧ Антья 1.173", "ЧЧ Антья 7.60"]
  sources: []
  images: []
  audio:
    - {file: "material-culture/audio/monsoon-night-pond-frogs-crickets-bankura.ogg", license: "PD", author: "prabuddhamukhopadhyay (radio aporee)",
       url: "https://archive.org/details/aporee_64030_73837"}
    - {file: "material-culture/audio/evening-crickets-frog-sea-roar-coxs-bazar.ogg", license: "PD", author: "Sukanta Majumdar (radio aporee)",
