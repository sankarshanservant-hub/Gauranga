- id: mc-ganga-fish
  title: {ru: "Рыбы Ганги", en: "Fish of the Ganga"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Река «прекрасна рыбами» — Лочан, Ади 12.88; «как рыба без воды» — частое сравнение (ЧЧ Антья 17.59, ЧБ Антья
      8.156, Лочан Ади 12.69); рыбак в Пури вытаскивает сетью Господа — ЧЧ Антья 18.44–60 (эпизод и рыбаки — см.
      mc-fisherman). Виды рыб в житиях не названы — по общим сведениям.
    en: >-
      The river "beautiful with fish" — Lochana, Adi 12.88; "like a fish without water" — a common comparison (CC Antya
      17.59, CB Antya 8.156, Lochana Adi 12.69); the fisherman in Puri hauls up the Lord in his net — CC Antya 18.44–60
      (the episode and fishermen — see mc-fisherman). Fish species are not named in the texts — general knowledge.
  text:
    ru: >-
      Ганга, её старицы и пруды полны рыбы: крупные карпы руи и катла, мригал, сомы, змееголовы, живущие даже в
      пересыхающих лужах, мелкая серебристая рыбёшка и пресноводные креветки. С началом муссона из моря вверх по реке
      поднимается сельдь илиш, и тогда на Ганге выходят на лов целые флотилии лодок. Рыба — повседневная еда многих
      бенгальцев, но вайшнавы её не едят и Господу не подносят. А для житий рыба — прежде всего образ: «как рыба без
      воды» не может жить преданный без Кришны.
    en: >-
      The Ganga, its old beds and ponds teem with fish: big rui and katla carp, mrigal, catfish, snakeheads that live
      even in drying puddles, small silvery fry and freshwater prawns. With the monsoon the hilsa (ilish) comes up the
      river from the sea, and whole fleets of boats go out on the Ganga to fish. Fish is everyday food for many Bengalis,
      but Vaishnavas do not eat it or offer it to the Lord. For the hagiographies the fish is above all an image: "like a
      fish without water" the devotee cannot live without Krishna.
  hagiography: ["Лочан, Ади-кханда, ч. 12, ст. 69, 88", "ЧЧ Антья 17.59", "ЧБ Антья 8.156", "ЧЧ Антья 18.44–60"]
  sources: []
  images: []
  game: {model: "карп руи 60–90 см; серебристая илиш 40 см; змееголов в луже", where: ["ganga-ghat", "mishra-house/pond"]}

- id: mc-turtles-dolphins
  title: {ru: "Черепахи и речные дельфины", en: "Turtles and river dolphins"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Река Падмавати «прекрасна крокодилами, черепахами, рыбами» — Лочан, Ади 12.88; Господь в экстазе «стал похож на
      черепаху» (втянул руки и ноги) — ЧЧ Антья 17.16, 17.70–72, Мадхья 2.13; храм Курмы (Вишну-черепаха) на пути на юг —
      Мурари 1.16.16. Речной дельфин Ганги в житиях не найден — природное сведение.
    en: >-
      The Padmavati river "beautiful with crocodiles, turtles and fish" — Lochana, Adi 12.88; in ecstasy the Lord
      "became like a tortoise" (drew in His limbs) — CC Antya 17.16, 17.70–72, Madhya 2.13; the temple of Kurma (Vishnu
      as tortoise) on the way south — Murari 1.16.16. The Ganges river dolphin not found in the texts — natural history.
  text:
    ru: >-
      На песчаных отмелях Ганги греются речные черепахи (бенг. каччхап), а в мутной воде то и дело с шумным вздохом
      выныривает слепой гангский дельфин — шушук, длиннорылый, серый, видящий мир звуком. Черепаха в Индии — образ
      Курмы, аватары Вишну; Махапрабху на пути на юг посетил Его храм. А в Пури, в высшем экстазе разлуки, Господь,
      лежа среди коров у Львиных врат, втянул руки и ноги в тело и «стал похож на черепаху».
    en: >-
      River turtles (Bengali kachchhap) bask on the Ganga's sandbanks, and in the muddy water the blind Ganges dolphin,
      the shushuk — long-snouted, grey, seeing the world by sound — surfaces again and again with a noisy breath. In India
      the tortoise is the image of Kurma, the avatara of Vishnu; on the way south Mahaprabhu visited His temple. And in
      Puri, in the highest ecstasy of separation, the Lord, lying among the cows by the Lion Gate, drew His hands and feet
      into His body and "became like a tortoise".
  hagiography: ["Лочан, Ади-кханда, ч. 12, ст. 88", "ЧЧ Антья 17.16", "ЧЧ Антья 17.70–72", "ЧЧ Мадхья 2.13", "Мурари 1, сарга 16, ст. 16"]
  sources: []
  images: []
  game: {model: "речная черепаха 50–70 см на отмели; спина и рыло дельфина над водой (2–2,5 м)", where: ["ganga-ghat"]}

- id: mc-monkeys
  title: {ru: "Обезьяны", en: "Monkeys"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Мальчики играют «обезьян» Рамы, Нитьянанда — Лакшмана — ЧБ Ади 9.45–55 (детские игры Нитьянанды в Экачакре); «обезьянье
      отречение» (марката-вайрагья) — ЧЧ Мадхья 16.238, Антья 2.120; преданные — «воины-ванары» на Ратха-ятре — ЧЧ
      Мадхья 15.32. Живые обезьяны в Навадвипе в житиях не найдены.
    en: >-
      Boys play Rama's "monkeys", Nityananda plays Lakshmana — CB Adi 9.45–55 (Nityananda's childhood games in Ekachakra); "monkey
      renunciation" (markata-vairagya) — CC Madhya 16.238, Antya 2.120; devotees as "vanara warriors" — CC Madhya 15.32.
      Living monkeys in Navadvipa not found in the texts.
  text:
    ru: >-
      В Бенгалии живут два вида обезьян: рыжевато-бурые макаки-резусы, ворующие с крыш и рынков, и длиннохвостые
      серые лангуры-хануманы с чёрными мордами, которых не трогают ради Ханумана. Маленький Нитьянанда с мальчиками
      Экачакры играл в Рамаяну: друзья изображали обезьян-ванаров, строящих мост на Ланку, а Он — Лакшмана. Махапрабху же
      предостерегал от «обезьяньего отречения» — показного аскетизма, когда, как обезьяна, живут в лесу на плодах,
      а в душе думают о наслаждениях.
    en: >-
      Two kinds of monkey live in Bengal: reddish-brown rhesus macaques, which steal from roofs and markets, and
      long-tailed grey Hanuman langurs with black faces, left alone for Hanuman's sake. Little Nityananda played the Ramayana
      with the boys of Ekachakra: his friends acted the vanara monkeys building the bridge to Lanka, and He was Lakshmana. Mahaprabhu warned
      against "monkey renunciation" — showy asceticism, living like a monkey in the forest on fruit while the heart
      thinks of pleasures.
  hagiography: ["ЧБ Ади 9.45–55", "ЧЧ Мадхья 16.238", "ЧЧ Антья 2.120", "ЧЧ Мадхья 15.32"]
  sources: []
  images: []
  game: {model: "макака-резус 50 см; лангур 70 см + хвост 1 м", where: ["navadvipa/market", "puri"]}

- id: mc-small-birds
  title: {ru: "Птицы двора: бюльбюль, горлицы, зимородок, дронго", en: "Birds of the yard: bulbul, doves, kingfisher, drongo"}
  rubric: nature
  era_evidence: later-reconstruction
  evidence_note:
    ru: >-
      В житиях эти птицы почти не названы: горлицы и голуби — у Карнапуры (9.83, 9.94), «крики множества разных птиц»
      в лесу — Карнапура 12.128. Набор видов — по природе Нижней Бенгалии (обычные и сейчас виды); для сцен и звукового
      фона.
    en: >-
      These birds are hardly named in the hagiographies: doves and pigeons in Karnapura (9.83, 9.94), "the cries of many
      kinds of birds" in the forest — Karnapura 12.128. The set of species follows the nature of lower Bengal (still
      common species); for scenes and soundscape.
  text:
    ru: >-
      С рассвета двор бенгальского дома полон птичьих голосов. Краснозадый бюльбюль с хохолком весело пересвистывается в
      кустах, пятнистые горлицы воркуют на крыше, сорочья славка-доел поёт с ветки, чёрный дронго с раздвоенным хвостом
      ловит насекомых над пасущимися коровами. Над прудом с резким криком проносится синий зимородок с огромным красным
      клювом, а в бамбуке шумно возятся стайки «семи сестёр» — серых тимелий. Это обычный звуковой фон, на котором
      начинался каждый день в Навадвипе.
    en: >-
      From dawn a Bengali yard is full of bird voices. The crested red-vented bulbul whistles cheerfully in the bushes,
      spotted doves coo on the roof, the magpie-robin (doel) sings from a branch, and the black, fork-tailed drongo
      catches insects over the grazing cows. A blue kingfisher with a huge red bill flashes over the pond with a sharp
      cry, and flocks of grey babblers, the "seven sisters", bustle noisily in the bamboo. This is the everyday soundscape
      with which each day began in Navadvipa.
  hagiography: ["Карнапура, сарга 9.83, 9.94, 12.128"]
  sources: []
  images: []
  audio: []
  game: {model: "бюльбюль 20 см (чёрный хохолок, красное подхвостье); горлица; зимородок 28 см; дронго 30 см",
         where: ["mishra-house/courtyard", "mishra-house/pond"], notes: "звуковой фон утра — research/audio.md"}
