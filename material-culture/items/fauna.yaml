- id: mc-water-birds
  title: {ru: "Водные птицы: чакравака, журавль-сарас, цапли, хамса", en: "Water birds: chakravaka, sarus crane, herons, hamsa"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Пары чакравак появляются из воды в видении Господа — ЧЧ Антья 18.95; ожерелье Кришны — «вереница белых цапель/
      журавлей под тучей» — ЧЧ Мадхья 21.109, Антья 15.66; «цапля среди лебедей» — ЧЧ Антья 5.129, 7.98; «цапля
      пребывает в созерцании» (о лжеаскетах) — Лочан, Мадхья 2.169; святые у Ганги как пчёлы, лебеди и утки — ЧЧ Ади 2.2.
    en: >-
      Pairs of chakravakas rise from the water in the Lord's vision — CC Antya 18.95; Krishna's necklace — "a line of
      white cranes/herons under a cloud" — CC Madhya 21.109, Antya 15.66; "a heron among swans" — CC Antya 5.129, 7.98;
      "the heron is ever in meditation" (of false ascetics) — Lochana, Madhya 2.169; saints by the Ganga like bees,
      swans and ducks — CC Adi 2.2.
  text:
    ru: >-
      Над старицами и рисовыми полями Бенгалии всегда кружат водные птицы. Белые цапли (бак) неподвижно стоят в воде,
      высматривая рыбу, — поговорка называет их притворщиками, «погружёнными в созерцание». Огненно-рыжие утки-чакраваки
      (Tadorna ferruginea) прилетают на зиму и держатся парами; по поверью, ночью супруги разлучаются и перекликаются до
      утра — поэтому чакравака стала образом любящих в разлуке. Огромный серый журавль-сарас с красной головой танцует
      парой на полях, а хамса — белый гусь-лебедь — у поэтов умеет отделять молоко от воды.
    en: >-
      Water birds always circle over the old river-beds and rice fields of Bengal. White egrets (bak) stand motionless
      in the water watching for fish — the proverb calls them hypocrites "sunk in meditation". Flame-coloured ruddy
      shelducks, the chakravakas (Tadorna ferruginea), come for the winter and keep in pairs; by belief the mates are
      parted at night and call to each other till dawn — so the chakravaka became the image of lovers in separation. The
      huge grey sarus crane with its red head dances in pairs in the fields, and the hamsa — the white swan-goose — in
      poetry can separate milk from water.
  hagiography: ["ЧЧ Антья 18.95", "ЧЧ Мадхья 21.109", "ЧЧ Антья 15.66", "ЧЧ Антья 17.43", "ЧЧ Антья 5.129", "ЧЧ Антья 7.98",
                "ЧЧ Ади 2.2", "Лочан, Мадхья-кханда, ч. 2, ст. 169"]
  sources: []
  images: []
  audio: []
  game: {model: "белая цапля 90 см на мелководье; пара рыжих уток; журавль-сарас 1,5 м", where: ["mishra-house/pond", "navadvipa/fields", "ganga-ghat"]}

- id: mc-crow-kite-owl
  title: {ru: "Ворона, коршун, сова", en: "Crow, kite and owl"}
  rubric: nature
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Он превратил ворону в Гаруду» (Сарвабхаума о себе) — ЧЧ Мадхья 12.182; вороны клюют плоды нима — ЧЧ Мадхья
      8.257; «как совам нестерпим свет солнца» — ЧЧ Ади 3.85. Коршуны над рынками и гхатами — общее наблюдение
      (в житиях пока не найдены).
    en: >-
      "He turned a crow into Garuda" (Sarvabhauma of himself) — CC Madhya 12.182; crows peck neem fruit — CC Madhya
      8.257; "as owls cannot bear the sunlight" — CC Adi 3.85. Kites over markets and ghats — general observation (not
      yet found in the texts).
  text:
    ru: >-
      Серошейная ворона (бенг. каак) — самая шумная соседка бенгальского двора: она ворует всё, что оставлено без
      присмотра, каркает на крышах с рассвета и, по поверью, карканьем возвещает о гостях. В житиях ворона — образ
      низкого и непреданного: Сарвабхаума Бхаттачарья говорил, что Махапрабху превратил ворону в Гаруду, царя птиц.
      Над рынками и гхатами парят чёрные коршуны (чил), выхватывая куски на лету, а по ночам ухают маленькие пятнистые
      совы (печа) — сова не выносит солнца, как неверующий не выносит истины.
    en: >-
      The house crow (Bengali kak) is the noisiest neighbour of a Bengali yard: it steals anything left unwatched,
      caws on the roofs from dawn and, by belief, announces guests with its cawing. In the hagiographies the crow is an
      image of the low and faithless: Sarvabhauma Bhattacharya said Mahaprabhu had turned a crow into Garuda, king of
      birds. Black kites (chil) soar over the markets and ghats, snatching scraps in flight, and at night little spotted
      owlets (pecha) hoot — the owl cannot bear the sun, as the faithless cannot bear the truth.
  hagiography: ["ЧЧ Мадхья 12.182", "ЧЧ Мадхья 8.257", "ЧЧ Ади 3.85"]
  sources: []
  images: []
  audio: []
  game: {model: "серошейная ворона 40 см; чёрный коршун в небе; пятнистый сыч 20 см в дупле", where: ["mishra-house/courtyard", "ganga-ghat", "navadvipa/market"]}
