- id: mc-straw-village
  title: {ru: "Деревня на сезон: соломенный городок у кораблей", en: "A village for a season: the straw town by the ships"}
  rubric: town
  era_evidence: epoch
  evidence_note:
    ru: >-
      Федеричи (1569): в Butor (Бетор, у нынешней Хауры), докуда доходят большие корабли, каждый год на время
      стоянки строят целую деревню с домами и лавками из соломы; когда корабли уходят, каждый поджигает свой участок
      (Hakluyt V, 1904, с. 410–411). Это 1560-е, через тридцать лет после Махапрабху; ср. соломенные хижины умирающих
      на берегу (mc-death-by-the-ganga).
    en: >-
      Federici (1569): at Buttor (Betor, by present-day Howrah), as far as the big ships come, a whole village of straw
      houses and shops is built each year for the ships' stay; when the ships leave, everyone sets fire to his plot
      (Hakluyt V, 1904, pp. 410–411). This is the 1560s, thirty years after Mahaprabhu; cf. the straw huts of the dying
      on the bank (mc-death-by-the-ganga).
  text:
    ru: >-
      Солома и бамбук в Бенгалии так дёшевы, что дом можно поставить за день. Ниже Сатгаона, там, где на Ганге
      останавливались большие морские корабли, каждый год на время стоянки вырастала целая деревня — соломенные дома и
      лавки, где торговали рисом, тканями и всем, что нужно мореходам. Когда корабли уходили, каждый поджигал свой
      домик, и на берегу оставались только пепелища — до следующего года.
    en: >-
      Straw and bamboo were so cheap in Bengal that a house could go up in a day. Below Satgaon, where the great
      sea-going ships lay on the Ganga, a whole village sprang up each year for the time of their stay — straw houses
      and shops selling rice, cloth and everything seamen needed. When the ships left, everyone set fire to his little
      house, and only ashes were left on the bank — until the next year.
  hagiography: []
  sources: ["Federici (1569), в: Hakluyt, Principal Navigations V (1904), с. 410–411"]
  images: []
  game: {model: "ряд лёгких соломенных лавок на бамбуковых шестах у воды; вдали — большие корабли на якоре",
         where: ["travel/ganga-bank"]}

- id: mc-sugar-trade
  title: {ru: "Сахар на вывоз: порошок в кожаных мешках", en: "Sugar for export: powder in leather bags"}
  rubric: kitchen
  era_evidence: epoch
  evidence_note:
    ru: >-
      Барбоза (ок. 1516): белый сахар Бенгалии хорош, но «не умеют сливать его в головы» — пакуют порошком в ткань,
      обтянутую сыромятной кожей и плотно зашитую, и грузят им много кораблей; в Малабаре кинтал стоил 2,5 дуката
      (пер. Stanley 1866, с. 179); Вартема (ок. 1505) — «великое количество сахара» (1863, с. 212); Федеричи (1569) —
      «великое изобилие сахара» в Сатгаоне (Hakluyt V, с. 411); Фитч (1586) — из Патны «много сахара везут в
      Бенгалию» (Ryley 1899, с. 110). Тарафдар (1965, с. 148–149). Сахар на кухне и в подношениях — mc-sugar.
    en: >-
      Barbosa (c. 1516): Bengal's white sugar is good, but 'they know not how to cast it in loaves' — they pack it as
      powder in cloth covered with raw hide and tightly sewn, and load many ships with it; in Malabar a quintal cost
      2.5 ducats (tr. Stanley 1866, p. 179); Varthema (c. 1505) — 'a great quantity of sugar' (1863, p. 212); Federici
      (1569) — 'great store of sugar' at Satgaon (Hakluyt V, p. 411); Fitch (1586) — from Patna 'much sugar is carried
      into Bengal' (Ryley 1899, p. 110). Tarafdar (1965, pp. 148–149). Sugar in the kitchen and in offerings — mc-sugar.
  text:
    ru: >-
      Бенгалия была одной из сахарниц Азии. Белый сахар здесь делали очень хороший, но не отливали в твёрдые головы,
      как в Европе, а оставляли рассыпчатым порошком. Его насыпали в мешки из ткани, обтягивали сыромятной кожей и
      плотно зашивали — такие тюки грузили на корабли целыми трюмами и везли в Малабар, Камбей и дальше. В лавках
      Бенгалии продавали и гур, и кханду, и сахар — от тёмного к белому.
    en: >-
      Bengal was one of Asia's sugar bowls. The white sugar made here was very good, but it was not cast in hard loaves
      as in Europe; it was left as a loose powder. It was poured into cloth bags, covered with raw hide and tightly
      sewn — such bales filled whole holds of ships bound for Malabar, Cambay and beyond. Bengal's shops sold gur,
      khanda and sugar — from dark to white.
  hagiography: []
  sources: ["Barbosa (ок. 1516), пер. Stanley 1866, с. 179",
            "Varthema (ок. 1505), пер. Jones–Badger 1863, с. 212",
            "Federici (1569), в: Hakluyt, Principal Navigations V (1904), с. 411",
            "Fitch (1586), в: Ryley, Ralph Fitch (1899), с. 110",
            "Tarafdar, Husain Shahi Bengal (1965), с. 148–149"]
  images: []
  game: {model: "тюк ≈ 60 × 40 × 30 см: ткань, обтянутая сыромятной кожей, грубый шов; рядом — горка белого сахара-порошка",
         where: ["travel/ganga-bank", "navadvipa/market"]}

- id: mc-preserves
  title: {ru: "Варенья из имбиря, цитрусов и миробаланов", en: "Preserves of ginger, citrus and myrobalan"}
  rubric: kitchen
  era_evidence: epoch
  evidence_note:
    ru: >-
      Барбоза (ок. 1516): в Бенгалии делают много варений — из имбиря, апельсинов, лимонов и других местных плодов
      (пер. Stanley 1866, с. 180); Федеричи (1569): из Ориссы вывозят миробаланы сушёные и в варенье (Hakluyt V,
      с. 409–410). Рецепты не описаны; соленья и кашанди — mc-kasundi-achar.
    en: >-
      Barbosa (c. 1516): Bengal makes many preserves — of ginger, oranges, lemons and other local fruits (tr. Stanley
      1866, p. 180); Federici (1569): myrobalans dried and preserved are shipped from Orissa (Hakluyt V, pp. 409–410).
      No recipes are given; pickles and kasundi — mc-kasundi-achar.
  text:
    ru: >-
      Сахара в Бенгалии было много, и в нём варили впрок плоды: молодой имбирь, апельсины, лимоны и другие местные
      фрукты. Такие варенья возили кораблями на продажу, а из Ориссы — ещё и миробаланы (харитаки), сушёные и в
      сиропе: их ели и как лакомство, и как лекарство для пищеварения. Европейские купцы считали эти варенья одним из
      богатств страны.
    en: >-
      Bengal had plenty of sugar, and fruit was cooked in it to keep: young ginger, oranges, lemons and other local
      fruits. Such preserves were shipped for sale, and from Orissa also myrobalans (haritaki), dried and in syrup,
      eaten both as a treat and as a digestive medicine. European merchants counted these preserves among the land's
      riches.
  hagiography: []
  sources: ["Barbosa (ок. 1516), пер. Stanley 1866, с. 180",
            "Federici (1569), в: Hakluyt, Principal Navigations V (1904), с. 409–410"]
  images: []
