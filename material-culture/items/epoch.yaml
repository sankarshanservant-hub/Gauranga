- id: mc-grass-cloth
  title: {ru: "Ткань «из травы»", en: "'Grass' cloth"}
  rubric: dress
  era_evidence: epoch
  evidence_note:
    ru: >-
      Федеричи (1569): из Ориссы вывозят «ткань из трав» — род шёлка, растущего в лесах без труда человека (Hakluyt V,
      1904, с. 409–410); Фитч (1586): в гавани Ориссы — ткань «из травы» (*yerua*), «похожая на шёлк» (Ryley 1899,
      с. 113–114); Линсхотен (1596): из желтоватой «травы Бенгалии» прядут нить, вышивают покрывала, пологи, подушки,
      ковры цветами и фигурами, ткут полотна (*sarrijn*), иногда с шёлком, «прекраснее шёлка», их можно стирать
      (Hakluyt Soc. 1885, т. I, с. 96). ⚠ Что это за волокно — неясно: «шёлк из лесов» Федеричи похож на тасар (дикий
      шёлк), Бёрнелл (примеч. к Линсхотену) гадал о рами; джутовая ткань (*патер пачхра*) — Тарафдар 1965, с. 147–148.
    en: >-
      Federici (1569): from Orissa comes 'cloth of herbs' — a kind of silk growing in the woods without human labour
      (Hakluyt V, 1904, pp. 409–410); Fitch (1586): at an Orissa port, cloth 'of grass' (*yerua*), 'like silk' (Ryley
      1899, pp. 113–114); Linschoten (1596): from a yellowish 'herb of Bengal' thread is spun and quilts, canopies,
      pillows and carpets are embroidered with flowers and figures, and whole cloths (*sarrijn*) woven, sometimes with
      silk, 'fairer than silk', and washable (Hakluyt Soc. 1885, vol. I, p. 96). ⚠ The fibre is uncertain: Federici's
      'silk from the woods' looks like tasar (wild silk), Burnell (note to Linschoten) guessed ramie; jute cloth (*pater
      pachhra*) — Tarafdar 1965, pp. 147–148.
  text:
    ru: >-
      Европейцы XVI в. дивились бенгальской и орисской «ткани из травы»: желтоватая, с блеском, «прекраснее шёлка», и
      при этом её можно стирать. Из её нити вышивали цветами и фигурами покрывала, пологи и подушки и ткали целые
      полотна, иногда пополам с шёлком. Что это было — дикий лесной шёлк-тасар, который собирают с деревьев, или
      растительное волокно, — спорят и сейчас; но такие ткани шли кораблями из Ориссы и Бенгалии во все концы Индии.
    en: >-
      16th-century Europeans marvelled at the 'grass cloth' of Bengal and Orissa: yellowish, lustrous, 'fairer than
      silk', and yet washable. Its thread was used to embroider quilts, canopies and pillows with flowers and figures,
      and whole cloths were woven of it, sometimes half silk. What it was — wild forest tasar silk gathered from trees,
      or a plant fibre — is still debated; but such cloths went by ship from Orissa and Bengal to every corner of India.
  hagiography: []
  sources: ["Federici (1569), в: Hakluyt, Principal Navigations V (1904), с. 409–410",
            "Fitch (1586), в: Ryley, Ralph Fitch (1899), с. 113–114",
            "Linschoten (1596), Hakluyt Society 1885, т. I, с. 96",
            "Tarafdar, Husain Shahi Bengal (1965), с. 147–148"]
  images: []
  game: {model: "отрез золотисто-жёлтой блестящей ткани с вышитыми цветами; покрывало-полог",
         where: ["navadvipa/market"]}
