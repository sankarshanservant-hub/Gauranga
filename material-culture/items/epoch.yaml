         where: ["travel/village-hut"]}

- id: mc-prasad-bazar
  title: {ru: "Базар махапрасада в Пури у Мукундарама", en: "The mahaprasada bazaar of Puri in Mukundaram"}
  rubric: puri
  era_evidence: epoch
  evidence_note:
    ru: >-
      Мукундарам, «Чанди-мангал» (ок. 1590), изд. 1868, с. 149–150 (путь купца через Пури): рядом с Джаганнатхой —
      Вимала-деви, Субхадра и Балай, напротив — Гаруда; пруд Индрадьюмны, Рохини-кунда, Шветаганга; «рис продают на
      базаре», люди четырёх варн едят вместе, «прасад равен воде Ганги»; на базаре — *супа*, *кханда*, *аду-бада*, *джхол*
      из суджи, *кшира-кханда*, *пури*, *кшира-пули*, *падма-чини*, *папра*, *манда*, *кшира-ладу*, *кала-бада*,
      *кхаста*, имбирное *джхал*, *лабра*; играют «15 видов инструментов»; продают жасмин-маллику в листовых чашках и
      бусы из туласи. ⚠ *чхена-ладу*, *чхена-пана* в изд. 1868 — вероятно, поздняя вставка (mc-chhana). В житиях —
      продажа прасада лавочниками у Львиных ворот (ЧЧ Антья 6.315, 10.146).
    en: >-
      Mukundaram, Chandi-mangala (c. 1590), ed. 1868, pp. 149–150 (a merchant's journey through Puri): beside
      Jagannatha — Vimala-devi, Subhadra and Balai, Garuda opposite; Indradyumna's tank, Rohini-kunda, Shvetaganga; 'rice
      is sold in the bazaar', people of the four varnas eat together, 'prasada equals Ganga water'; in the bazaar —
      *supa*, *khanda*, *adu-bada*, *jhol* of semolina, *kshira-khanda*, *puri*, *kshira-puli*, *padma-chini*, *papra*,
      *manda*, *kshira-ladu*, *kala-bada*, *khasta*, ginger *jhal*, *labra*; '15 kinds of instruments' play; jasmine
      (mallika) is sold in leaf cups, and tulasi beads. ⚠ *chhena-ladu*, *chhena-pana* in the 1868 edition are probably
      a later interpolation (mc-chhana). In the hagiographies — shopkeepers selling prasada at the Lion Gate (CC Antya
      6.315, 10.146).
  text:
    ru: >-
      Поэт Мукундарам, проводя своего купца через Пури, описал рынок прасада: здесь прямо на базаре продают рис,
      поднесённый Джаганнатхе, и люди всех четырёх сословий едят его вместе, ведь прасад, говорит поэт, свят, как вода
      Ганги. Вокруг — дал, сахар, имбирные бады, кхир с сахаром, пури, пирожки, сахарные лотосы падма-чини, хрустящие
      лепёшки, лабра из овощей. Тут же играют на пятнадцати видах инструментов, продают душистый жасмин в чашечках из
      листьев и бусы из туласи. Так выглядел Пури в памяти бенгальцев через полвека после Махапрабху.
    en: >-
      The poet Mukundaram, taking his merchant through Puri, described the prasada market: right in the bazaar rice
      offered to Jagannatha is sold, and people of all four orders eat it together, for prasada, says the poet, is holy
      as Ganga water. Around are dal, sugar, ginger badas, kheer with sugar, puris, little cakes, padma-chini sugar
      lotuses, crisp wafers and vegetable labra. Here too fifteen kinds of instruments play, and fragrant jasmine is sold
      in leaf cups along with tulasi beads. So Puri lived in Bengali memory half a century after Mahaprabhu.
  hagiography: ["ЧЧ Антья 6.315", "ЧЧ Антья 10.146"]
  sources: ["Мукундарам, «Чанди-мангал» (ок. 1590), изд. 1868, с. 149–150"]
  images: []
  game: {model: "ряды лотков с глиняными горшками риса и сладостей; продавец жасмина с листовыми чашечками; бусы туласи",
         where: ["puri/lion-gate"]}
