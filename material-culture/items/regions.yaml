# Регионы паломничества (исполнитель life): Орисса, Юг, Варанаси, Праяга, Матхура и Вриндаван — чем быт
# отличался от бенгальского. Рубрики — travel / puri. Формат — material-culture/README.md.
# Дорога Навадвипа — Пури как маршрут — mc-road-to-puri (transport.yaml); Пури — puri.yaml.

- id: mc-orissa-towns
  title: {ru: "Города Ориссы: Яджапур, Катак, Бхуванешвар", en: "Towns of Orissa: Yajapur, Cuttack, Bhuvaneshvara"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Яджапур — «город брахманов» на реке Вайтарани, «каждое здание — храм»; храм Ади-Варахи — ЧБ Антья 2.280–300, ЧЧ
      Мадхья 5.3–4; Катак — столица Пратапарудры на Маханади, Сакши-Гопала (ЧБ Антья 2.301–302; ЧЧ Мадхья 5.5,
      5.123–133, 12.5, 16.35, 16.100; царская столица — mc-gajapati-court); Бхуванешвар — «Гупта-Каши», озеро
      Бинду-саровара, «ряды масляных лампадок во всех направлениях, лингам постоянно омывают водой» — ЧБ Антья
      2.307–311, ЧЧ Мадхья 16.99; по приказу царя в каждой деревне Господу дают новый дом с запасом продуктов — ЧЧ
      Мадхья 16.152. Маршрут — mc-road-to-puri; Сакши-Гопала — mc-sakshi-gopala, Ремуна — mc-gopinatha-remuna. Эпоха:
      «Айн-и Акбари» — Орисса: 5 саркаров, 129 каменных крепостей, хижины из тростника, храмы каменные и очень
      высокие, Катак — каменная крепость между Маханади и Катджури (см. mc-cuttack-palace); Федеричи (1569) — столица
      Катак в 6 днях пути от моря.
    en: >-
      Yajapur — 'the city of brahmins' on the Vaitarani river, 'every building is a temple'; the temple of Adi-Varaha
      — CB Antya 2.280–300, CC Madhya 5.3–4; Cuttack — Prataparudra's capital on the Mahanadi, Sakshi-Gopala (CB Antya
      2.301–302; CC Madhya 5.5, 5.123–133, 12.5, 16.35, 16.100; the royal capital — mc-gajapati-court); Bhuvaneshvara
      — 'Gupta-Kashi', the Bindu-sarovara lake, 'rows of oil lamps in every direction, the linga constantly bathed
      with water' — CB Antya 2.307–311, CC Madhya 16.99; by the king's order in every village the Lord is given a new
      house stocked with provisions — CC Madhya 16.152. The route — mc-road-to-puri; Sakshi-Gopala — mc-sakshi-gopala,
      Remuna — mc-gopinatha-remuna. Period: Ain-i Akbari — Orissa: 5 sarkars, 129 stone forts, reed huts and very tall
      stone temples; Cuttack — a stone fort between the Mahanadi and Katjuri (see mc-cuttack-palace); Federici (1569)
      — the capital Cuttack six days from the sea.
  text:
    ru: >-
      Перейдя границу, бенгальский паломник попадает в страну храмов. В Яджапуре на реке Вайтарани, «городе брахманов»,
      по словам Вриндавана Даса, что ни здание — то храм, и Господь, ускользнув от спутников, один обходит их все. Катак
      на широкой Маханади — столица царя Ориссы, с дворцами, войском и храмом Сакши-Гопалы, Господа-свидетеля. Дальше —
      Бхуванешвар, город Шивы: Махапрабху омывается в священном озере Бинду-саровара, а вокруг храма горят ряды
      масляных лампад и служители непрестанно льют воду на лингам. Здесь говорят на ория, храмы строят из камня, а не
      из глины и бамбука, и Шиву почитают как великого вайшнава, слугу Кришны.
    en: >-
      Once over the border, the Bengali pilgrim enters a land of temples. In Yajapur on the Vaitarani river, 'the city of
      brahmins', says Vrindavana Dasa, every building is a temple, and the Lord, slipping away from His companions,
      visits them all alone. Cuttack on the broad Mahanadi is the capital of the king of Orissa, with palaces, troops and
      the temple of Sakshi-Gopala, the Lord who bore witness. Further on lies Bhuvaneshvara, the city of Shiva:
      Mahaprabhu bathes in the sacred Bindu-sarovara lake, and round the temple burn rows of oil lamps while the priests
      pour water ceaselessly over the linga. Here people speak Oriya, temples are built of stone rather than clay and
      bamboo, and Shiva is honoured as a great Vaishnava, the servant of Krishna.
  hagiography: ["ЧБ Антья 2.280–311", "ЧЧ Мадхья 5.3–5", "ЧЧ Мадхья 5.123–133", "ЧЧ Мадхья 16.35", "ЧЧ Мадхья 16.99–100",
                "ЧЧ Мадхья 16.152"]
  sources: ["Ain-i Akbari (1590-е), пер. Jarrett, т. II (1891), с. 126–127",
            "Federici (1569), в: Hakluyt, Principal Navigations V (1904), с. 409"]
  images: []
  game: {model: "каменные храмы-дэула с изогнутой башней (латерит, песчаник); озеро со ступенями; ряды лампад",
         where: ["travel/orissa"], notes: "архитектура — по сохранившимся храмам Бхуванешвара (Лингарадж XI в.)"}

- id: mc-srirangam-chaturmasya
  title: {ru: "Шрирангам: четыре месяца дождей у Венката Бхатты", en: "Shrirangam: four rainy months with Venkata Bhatta"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      ЧЧ Мадхья 9.79–166: омовение в Кавери, храм Ранганатхи; шри-вайшнав Венката Бхатта приглашает Господа, омывает
      Ему стопы и пьёт эту воду с домочадцами; *чатурмасья* — четыре месяца сезона дождей на одном месте; каждый день
      — Кавери и даршан; все брахманы-вайшнавы Шрирангама приглашают Его «каждый на один день», многим не хватило
      дней (9.91–92); брахман, который «не понимает санскрита», но ежедневно читает всю Гиту, видя Кришну-возничего
      (9.93–107); Венката Бхатта по традиции шри-вайшнавов поклоняется Лакшми-Нараяне, шутливый спор о Лакшми и гопи
      (9.109–163).
    en: >-
      CC Madhya 9.79–166: bathing in the Kaveri, the temple of Ranganatha; the Shri-Vaishnava Venkata Bhatta invites the
      Lord, washes His feet and drinks that water with his household; *chaturmasya* — the four months of the rainy
      season in one place; every day the Kaveri and darshan; all the Vaishnava brahmins of Shrirangam invite Him 'each
      for one day', and many found no day left (9.91–92); the brahmin who 'does not understand Sanskrit' but reads the
      whole Gita daily, seeing Krishna the charioteer (9.93–107); Venkata Bhatta worships Lakshmi-Narayana after the
      Shri-Vaishnava tradition; the playful debate about Lakshmi and the gopis (9.109–163).
  text:
    ru: >-
      На юге, на острове посреди реки Кавери, стоит огромный храм Ранганатхи — Господа, возлежащего на змее Шеше.
      Здесь Махапрабху застали дожди, а в сезон дождей санньяси четыре месяца не странствует, и шри-вайшнав Венката
      Бхатта упросил Его остаться у себя. Господь каждый день омывался в Кавери и танцевал перед Ранганатхой, а
      местные брахманы так наперебой звали Его обедать, что многим за все четыре месяца не досталось ни дня. В храме
      Он встретил простого брахмана, который каждый день вслух читал всю «Гиту», не понимая санскрита, и плакал, видя
      в уме Кришну на колеснице Арджуны, — «твоё чтение совершенно», сказал ему Господь.
    en: >-
      In the south, on an island in the Kaveri river, stands the huge temple of Ranganatha — the Lord reclining on the
      serpent Shesha. Here the rains overtook Mahaprabhu, and in the rainy season a sannyasi does not travel for four
      months, so the Shri-Vaishnava Venkata Bhatta begged Him to stay in his home. Every day the Lord bathed in the Kaveri
      and danced before Ranganatha, and the local brahmins vied so to invite Him to dine that many got not a single day
      in all four months. In the temple He met a simple brahmin who read the whole Gita aloud every day without
      understanding Sanskrit and wept, seeing in his mind Krishna on Arjuna's chariot — 'your reading is perfect,' the
      Lord told him.
  hagiography: ["ЧЧ Мадхья 9.79–166"]
  sources: []
  images: []
  game: {model: "дравидийские башни-гопурамы, каменные дворы с колоннами; дом брахмана с черепичной кровлей (рекон.)",
         where: ["travel/south"], notes: "тилака шри-вайшнавов — U-образная с красной линией (проверить по PD)"}
  todo: "Быт тамильского брахмана XVI в. (дом, одежда — дхоти «кача», еда на банановом листе, рис с тамариндом) — подтвердить PD-источником (Buchanan, Journey through Mysore, 1807; Dubois, 1817)."

- id: mc-south-peoples
  title: {ru: "Люди Юга: шри-вайшнавы, таттвавади, бхаттатхари, буддисты", en: "Peoples of the South: Shri-Vaishnavas, Tattvavadis, Bhattatharis, Buddhists"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      «Все тамошние вайшнавы поклонялись Раме — одни таттвавади, другие шри-вайшнавы» — ЧЧ Мадхья 9.11; брахман,
      непрестанно повторявший имя Рамы, — 9.18–37; приверженцы разных доктрин и буддийский проповедник, споривший с
      Господом, — 9.42–62; Удупи — «главная резиденция таттвавади», Танцующий Гопала Мадхвачарьи, привезённый в лодке
      под грузом *гопи-чанданы*; таттвавади сперва принимают Господа за майявади — 9.245–278; *бхаттатхари* Малабара:
      «кочевники», носят одежды отречения, женщины соблазняют слугу Кришнадаса, с оружием окружают Господа — 9.224–233;
      «южане не уступали силой слонам» — 9.1. Кто такие бхаттатхари (касты Кералы?) — спорно (todo).
    en: >-
      'All the Vaishnavas there worshipped Rama — some Tattvavadis, others Shri-Vaishnavas' — CC Madhya 9.11; the brahmin
      who ceaselessly repeated Rama's name — 9.18–37; followers of various doctrines and a Buddhist preacher who argued
      with the Lord — 9.42–62; Udupi — 'the chief seat of the Tattvavadis', Madhvacharya's Dancing Gopala brought in a
      boat under a load of *gopi-chandana*; the Tattvavadis at first take the Lord for a Mayavadi — 9.245–278; the
      *Bhattatharis* of Malabar: 'nomads', wear renunciants' dress, their women entice the servant Krishnadasa, they
      surround the Lord with weapons — 9.224–233; 'the southerners were strong as elephants' — 9.1. Who the Bhattatharis
      were (Kerala castes?) — disputed (todo).
  text:
    ru: >-
      Юг поразил спутников Махапрабху разнообразием. Здесь давно жили вайшнавские общины: шри-вайшнавы, последователи
      Рамануджи, и таттвавади — ученики Мадхвачарьи из Удупи, где хранится Танцующий Гопала, когда-то приплывший к
      Мадхве в лодке под грузом жёлтой глины гопи-чанданы. Многие южане поклонялись Раме и с детства повторяли Его имя.
      Тут же — учёные разных школ и даже буддийские проповедники, вызывавшие Господа на спор. А на западном побережье, в
      Малабаре, жили бхаттатхари — странники в одеждах отречения, чьи женщины заманили простодушного слугу Господа
      Кришнадаса; Махапрабху пришлось буквально вытащить его оттуда за волосы.
    en: >-
      The South amazed Mahaprabhu's companions with its variety. Vaishnava communities had long lived here: the
      Shri-Vaishnavas, followers of Ramanuja, and the Tattvavadis — disciples of Madhvacharya of Udupi, where the Dancing
      Gopala is kept, who once came to Madhva in a boat under a load of yellow gopi-chandana clay. Many southerners
      worshipped Rama and repeated His name from childhood. Here too were scholars of various schools and even Buddhist
      preachers who challenged the Lord to debate. And on the western coast, in Malabar, lived the Bhattatharis —
      wanderers in renunciants' robes whose women lured the Lord's guileless servant Krishnadasa; Mahaprabhu had
      literally to drag him out by the hair.
  hagiography: ["ЧЧ Мадхья 9.1", "ЧЧ Мадхья 9.11", "ЧЧ Мадхья 9.18–37", "ЧЧ Мадхья 9.42–62", "ЧЧ Мадхья 9.224–233",
                "ЧЧ Мадхья 9.245–278"]
  sources: []
  images: []
  game: {model: "кусок гопи-чанданы (жёлтая глина, брусок ≈ 10 см); лодка-грузовое судно; группа странников",
         where: ["travel/south"], notes: "языки Юга (тамил, малаялам, каннада, телугу) — Господь с южанами, по житиям, без переводчика"}
  todo: "Как Господь объяснялся на Юге (санскрит?) — в ЧЧ прямо не сказано; бхаттатхари — уточнить по Анубхашье и PD (Logan, Malabar 1887)."

- id: mc-pandharpur-krishna-venva
  title: {ru: "Пандарпур и берег Кришна-веньи", en: "Pandharpur and the banks of the Krishna-venva"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Колапур (Лакшми), Пандарпур — храм Виттхалы, омовение в реке Бхима, брахман приглашает Господа; встреча с Шри Ранга
      Пури, весть, что Шанкараранья (Вишварупа) ушёл из мира в Пандарпуре — ЧЧ Мадхья 9.281–303; на Кришна-венье «все
      брахманы — чистые вайшнавы, изучают „Кришна-карнамриту“»; Господь копирует её — 9.304–309; затем Тапи,
      Махишматипур, Нармада — 9.310. Рукопись «Брахма-самхиты» — mc-brahma-samhita-manuscript.
    en: >-
      Kolapur (Lakshmi), Pandharpur — the temple of Vitthala, bathing in the Bhima river, a brahmin invites the Lord; the
      meeting with Shri Ranga Puri, the news that Shankararanya (Vishvarupa) had left the world at Pandharpur — CC Madhya
      9.281–303; on the Krishna-venva 'all the brahmins are pure Vaishnavas and study the Krishna-karnamrita'; the Lord
      copies it — 9.304–309; then the Tapi, Mahishmatipur, the Narmada — 9.310. The manuscript of the Brahma-samhita —
      mc-brahma-samhita-manuscript.
  text:
    ru: >-
      На западе Деккана, в стране маратхов, Махапрабху пришёл в Пандарпур на реке Бхима, к Виттхале — Кришне, стоящему
      на кирпиче, уперев руки в бока. Здесь пели и плясали так же, как в Бенгалии, и Господь танцевал перед Божеством.
      Здесь же Он узнал от старого санньяси Шри Ранги Пури, что Его старший брат Вишварупа, ушедший из дома
      мальчиком, принял санньясу под именем Шанкараранья и оставил этот мир именно в Пандарпуре. А на берегах реки
      Кришна-венья местные брахманы все как один изучали «Кришна-карнамриту» Билвамангалы — Господь Сам переписал эту
      книгу и бережно унёс с Собой в Пури.
    en: >-
      In the western Deccan, in the land of the Marathas, Mahaprabhu came to Pandharpur on the Bhima river, to Vitthala —
      Krishna standing on a brick with His hands on His hips. Here people sang and danced as in Bengal, and the Lord
      danced before the Deity. Here too He learned from the old sannyasi Shri Ranga Puri that His elder brother
      Vishvarupa, who had left home as a boy, had taken sannyasa as Shankararanya and left this world at Pandharpur
      itself. And on the banks of the Krishna-venva river the local brahmins one and all studied Bilvamangala's
      Krishna-karnamrita — the Lord copied the book with His own hand and carried it carefully back to Puri.
  hagiography: ["ЧЧ Мадхья 9.281–310"]
  sources: []
  images: []
  game: {model: "храм на берегу реки со ступенями-гхатами; рукопись на пальмовых листах в тканевой обёртке",
         where: ["travel/south"], notes: "образ Виттхалы «на кирпиче» — по иконографии, в ЧЧ не описан (⚠ проверить)"}

- id: mc-varanasi
  title: {ru: "Варанаси (Каши): город Шивы и философов", en: "Varanasi (Kashi): city of Shiva and of philosophers"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Омовение в Маникарника-гхате, встреча с Тапаной Мишрой, даршан Вишвешвары и Бинду-Мадхавы; сын Тапаны Рагху
      массирует стопы Господа; писец Чандрашекхара: «здесь не говорят ни о чём, кроме шести философских доктрин»;
      Тапана просит не принимать приглашений санньяси-майявади; брахман из Махараштры — ЧЧ Мадхья 17.82–108; Санатана
      у дверей Чандрашекхары, бритьё и смена одежды — ЧЧ Мадхья 20.45–80 (одежда — dress2.yaml); Пракашананда и
      санньяси Каши — ЧЧ Мадхья 25 (обзор), ЧЧ Ади 7.40–150; ЧБ Ади 14.120 (Тапана, Восточная Бенгалия). Вне эпохи
      Господа на полвека: Фитч (1586) в Бенарасе — на рассвете мужчины и женщины моются в Ганге, старики на земляных
      возвышениях дают по 3–4 травинки куши для омовения и ставят метки на лоб; в святилища нельзя входить в обуви,
      перед Божествами непрерывно горят светильники.
    en: >-
      Bathing at Manikarnika ghat, meeting Tapana Mishra, darshan of Vishveshvara and Bindu-Madhava; Tapana's son
      Raghu massages the Lord's feet; the scribe Chandrashekhara: 'here people speak of nothing but the six
      philosophical systems'; Tapana begs Him not to accept invitations from the Mayavadi sannyasis; a brahmin from
      Maharashtra — CC Madhya 17.82–108; Sanatana at Chandrashekhara's door, shaving and change of clothes — CC Madhya
      20.45–80 (dress — dress2.yaml); Prakashananda and the sannyasis of Kashi — CC Madhya 25 (survey), CC Adi
      7.40–150; CB Adi 14.120 (Tapana, East Bengal). Half a century after the Lord: Fitch (1586) in Benares — at dawn
      men and women bathe in the Ganga, old men on earthen platforms give out 3–4 blades of kusha for the bath and
      mark foreheads; shrines may not be entered shod, lamps burn ceaselessly before the Deities.
  text:
    ru: >-
      Каши — древнейший город Индии и город Шивы, где по преданию умирающим даруется освобождение. Длинная лестница гхатов
      спускается к Ганге; на Маникарнике омываются и сжигают умерших. Здесь живут тысячи санньяси, и учёные спорят о
      шести школах философии — бенгалец-вайшнав Чандрашекхара жалуется Господу, что ни о чём ином тут не услышишь. Но
      есть и свои: Тапана Мишра, с которым Нимай познакомился ещё в Восточной Бенгалии, и Чандрашекхара, у которого
      Махапрабху гостит и ест только в их домах, не принимая приглашений гордых монахов-майявади, — пока Сам не
      обратит их главу Пракашананду.
    en: >-
      Kashi is the oldest city of India and the city of Shiva, where, tradition says, the dying are granted liberation.
      A long stair of ghats descends to the Ganga; at Manikarnika people bathe and the dead are burned. Thousands of
      sannyasis live here, and scholars argue about the six schools of philosophy — the Bengali Vaishnava
      Chandrashekhara complains to the Lord that nothing else is heard here. But there are His own people too: Tapana
      Mishra, whom Nimai had met in East Bengal, and Chandrashekhara, with whom Mahaprabhu stays, eating only in their
      homes and declining the invitations of the proud Mayavadi monks — until He Himself converts their leader
      Prakashananda.
  hagiography: ["ЧЧ Мадхья 17.82–108", "ЧЧ Мадхья 20.45–80", "ЧЧ Мадхья 25", "ЧЧ Ади 7.40–150", "ЧБ Ади 14.120"]
  sources: ["Fitch (1586), в: Ryley, Ralph Fitch (1899), с. 104–109"]
  images: []
