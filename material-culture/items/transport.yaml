- id: mc-border-war
  title: {ru: "Граница Гауды и Ориссы: война и пики на дорогах", en: "The Gauda–Orissa border: war and stakes on the roads"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Рамачандра Кхан, правитель Чхатрабхоги: «нет безопасных дорог; люди царя вкопали на дорогах острые пики, чужака
      казнят как шпиона», переправляет Господа тайно ночью — ЧБ Антья 2.82–102; на обратном пути орисский наместник на
      заставе: дальше — владения мусульманского правителя, «из страха никто не переправляется через реку», шпион на
      заставе, перемирие, правитель приходит безоружным с семью слугами и даёт суда — ЧЧ Мадхья 16.156–199; Хусейн-шах
      идёт войной на Ориссу — Мадхья 19.28.
    en: >-
      Ramachandra Khan, governor of Chhatrabhoga: 'there are no safe roads; the king's men have planted sharp stakes on
      the roads and a stranger is executed as a spy', and he ferries the Lord across secretly by night — CB Antya
      2.82–102; on the way back the Oriya governor at the outpost: beyond lies the Muslim ruler's land, 'from fear no one
      crosses the river', a spy at the outpost, a truce, the ruler comes unarmed with seven servants and provides
      vessels — CC Madhya 16.156–199; Husain Shah makes war on Orissa — Madhya 19.28.
  text:
    ru: >-
      При Господе между Бенгальским султанатом и Ориссой шла затяжная пограничная война. На спорных землях дороги
      были перекрыты: воины вкапывали острые колья, ловили чужаков и казнили как шпионов, и путники боялись даже
      переправляться через реки. Правитель Чхатрабхоги Рамачандра Кхан рискнул всем и тайно, ночью, отправил Господа в
      Ориссу на лодке. А через несколько лет на обратном пути шпион мусульманского правителя увидел киртан на орисской
      заставе, и сам правитель, тронутый, заключил перемирие, пришёл безоружным с семью слугами и дал Господу лодки с
      охраной.
    en: >-
      In the Lord's time a long border war went on between the Bengal sultanate and Orissa. On the disputed lands the
      roads were closed: soldiers planted sharp stakes, caught strangers and executed them as spies, and travellers
      were afraid even to cross the rivers. The governor of Chhatrabhoga, Ramachandra Khan, risked everything and
      secretly, by night, sent the Lord on to Orissa by boat. Some years later, on the way back, the Muslim ruler's spy
      saw the kirtan at an Oriya outpost, and the ruler himself, moved, made a truce, came unarmed with seven servants
      and gave the Lord boats with an escort.
  hagiography: ["ЧБ Антья 2.82–102", "ЧЧ Мадхья 16.156–199", "ЧЧ Мадхья 19.28"]
  sources: []
  images: []
  game: {model: "пограничная застава: частокол, вышка, вкопанные колья вдоль дороги; лодки охраны",
         where: ["road-to-puri/border"]}

- id: mc-robbers
  title: {ru: "Разбойники и речные пираты", en: "Robbers and river pirates"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Предводитель разбойников (*бхаумика*, «бхуйя») в горах Патара узнаёт через гадателя о восьми мохурах, хочет убить
      Санатану, но, получив золото, ведёт его ночью через горы с четырьмя людьми — ЧЧ Мадхья 20.16–33; «когда бандиты
      видят одинокого путника-бенгальца, они его пленяют, грабят и заставляют работать на себя» — Антья 13.34–35;
      лодочник: «в этих водах промышляют разбойники» — ЧБ Антья 2.134–137; правитель берёт десять судов охраны «опасаясь
      шаек бандитов» — ЧЧ Мадхья 16.198; воры похищают малыша Нимая ради украшений — Ади 14.38.
    en: >-
      A robber chief (bhaumika, 'bhuiya') in the Patara hills learns through a fortune-teller of eight mohurs and means
      to kill Sanatana but, given the gold, leads him over the hills by night with four men — CC Madhya 20.16–33; 'when
      bandits see a lone Bengali traveller they seize him, rob him and make him work for them' — Antya 13.34–35; the
      boatman: 'robbers prowl these waters' — CB Antya 2.134–137; the ruler takes ten guard boats 'fearing bands of
      bandits' — CC Madhya 16.198; thieves carry off little Nimai for His ornaments — Adi 14.38.
  text:
    ru: >-
      Путь был опасен. В горах и лесах промышляли шайки во главе с местными вождями-бхуйя; на реках и в приморских
      протоках — пираты, и лодочник на пути в Ориссу умолял паломников петь потише. Деньги прятали в поясе, но опытный
      разбойник угадывал добычу: предводитель в горах Патара через гадателя узнал о восьми золотых у слуги Санатаны и
      собирался ночью убить путников. Господь предупреждал Джагананду: после Варанаси иди только с попутчиками-воинами —
      одинокого бенгальца хватают, грабят и обращают в работника.
    en: >-
      The road was dangerous. Bands led by local chiefs, the bhuiyas, prowled the hills and forests, and pirates the
      rivers and coastal creeks; the boatman on the way to Orissa begged the pilgrims to sing more quietly. Money was
      hidden in the waistcloth, but a seasoned robber could guess his prize: the chief in the Patara hills learned
      through a fortune-teller of the eight gold coins carried by Sanatana's servant and meant to kill the travellers
      by night. The Lord warned Jagadananda: beyond Varanasi go only with soldier companions — a lone Bengali is seized,
      robbed and made a labourer.
  hagiography: ["ЧЧ Мадхья 20.16–33", "ЧЧ Антья 13.34–35", "ЧБ Антья 2.134–137", "ЧЧ Мадхья 16.198", "ЧЧ Ади 14.38"]
  sources: []
  images: []
  game: {model: "лесная тропа в холмах, засада: люди с луками и копьями-лаthi; лодка пиратов в протоке",
         where: ["road-to-vrindavan/patara-hills", "road-to-puri/creeks"]}

- id: mc-jungle-dangers
  title: {ru: "Лесной путь: тигры, слоны, крокодилы", en: "The forest road: tigers, elephants, crocodiles"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Джхарикханда: Господь идёт через безлюдные джунгли, мимо тигров, слонов, носорогов и вепрей, наступает на тигра,
      тигры и олени поют «Кришна» и танцуют — ЧЧ Мадхья 17.25–42; Балабхадра собирает в лесу зелень, коренья и плоды —
      17.57–64; лодочник боится тигров на берегу и крокодилов в воде — ЧБ Антья 2.135–136.
    en: >-
      Jharikhanda: the Lord walks through the empty jungle past tigers, elephants, rhinoceros and boar, steps on a
      tiger, and tigers and deer sing 'Krishna' and dance — CC Madhya 17.25–42; Balabhadra gathers greens, roots and
      fruit in the forest — 17.57–64; the boatman fears tigers on the bank and crocodiles in the water — CB Antya
      2.135–136.
  text:
    ru: >-
      Между Ориссой и Варанаси лежал лесной край Джхарикханда — горы и джунгли почти без деревень, где водились тигры,
      дикие слоны, носороги и кабаны. Путники шли днём, ночевали у огня и боялись каждого шороха; в приморских
      протоках Бенгалии к ним прибавлялись крокодилы в воде и тигры на берегу. Господь шёл этим лесом, воспевая
      имена Кришны, и звери уступали Ему дорогу: Он наступил на спящего тигра — и тот вскочил и стал танцевать,
      повторяя «Кришна», а тигры и олени шли за Ним вместе. Спутник Балабхадра собирал для Него в лесу зелень, коренья и
      плоды и готовил из них.
    en: >-
      Between Orissa and Varanasi lay the forest country of Jharikhanda — hills and jungle with hardly a village, where
      tigers, wild elephants, rhinoceros and boar lived. Travellers walked by day, slept by a fire and feared every
      rustle; in the coastal creeks of Bengal there were also crocodiles in the water and tigers on the banks. The Lord
      walked this forest singing Krishna's names, and the beasts gave way to Him: He stepped on a sleeping tiger — and
      it sprang up and began to dance, repeating 'Krishna', and tigers and deer walked after Him together. His companion
      Balabhadra gathered greens, roots and fruit for Him in the forest and cooked them.
  hagiography: ["ЧЧ Мадхья 17.25–42", "ЧЧ Мадхья 17.57–64", "ЧБ Антья 2.135–136"]
  sources: []
  images: []
  game: {model: "лесная тропа Джхарикханды: сал и бамбук, тигр поперёк тропы (событие), костёр на ночёвке",
         where: ["road-to-vrindavan/jharikhanda"]}

- id: mc-messengers
  title: {ru: "Гонцы, письма и вести", en: "Messengers, letters and news"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Рупа посылает в Пури двух человек узнать, когда Господь пойдёт во Вриндаван, они возвращаются с вестью — ЧЧ
      Мадхья 19.10–12, 19.31; письмо Рупы Санатане в тюрьму — 19.32–35, 20.3; отец Рагхунатхи посылает гонца к
      Шивананде узнать о сыне — Антья 6.249–257; Пратапарудра рассылает указ наместникам — Мадхья 16.110; Сарвабхаума
      шлёт Господу лист со стихами — Мадхья 6.250–251.
    en: >-
      Rupa sends two men to Puri to learn when the Lord will set out for Vrindavana, and they return with the news — CC
      Madhya 19.10–12, 19.31; Rupa's letter to Sanatana in prison — 19.32–35, 20.3; Raghunatha's father sends a messenger
      to Shivananda for news of his son — Antya 6.249–257; Prataparudra sends an order to his governors — Madhya 16.110;
      Sarvabhauma sends the Lord a leaf with verses — Madhya 6.250–251.
  text:
    ru: >-
      Почты не было: вести несли пешие гонцы, паломники и купцы. Чтобы узнать, когда Господь отправится во Вриндаван,
      Рупа послал из Рамакели в Пури двух человек и ждал их возвращения, а потом написал брату в тюрьму письмо на
      пальмовом листе. Отец Рагхунатхи узнал, куда исчез сын, только послав гонца к Шивананде Сену, когда тот
      вернулся из Пури. Царь Ориссы рассылал указы наместникам с вестовыми, а ежегодный караван паломников был главной
      «почтой» между Бенгалией и Пури: с ним передавали письма, деньги, угощения и даже слуг.
    en: >-
      There was no post: news travelled with runners, pilgrims and merchants. To learn when the Lord would set out for
      Vrindavana, Rupa sent two men from Ramakeli to Puri and waited for their return, then wrote his brother in prison
      a letter on a palm leaf. Raghunatha's father learned where his son had gone only by sending a messenger to
      Shivananda Sena when he came back from Puri. The king of Orissa sent orders to his governors by courier, and the
      yearly pilgrim caravan was the main 'post' between Bengal and Puri: letters, money, food gifts and even servants
      were sent with it.
  hagiography: ["ЧЧ Мадхья 19.10–12", "ЧЧ Мадхья 19.31–35", "ЧЧ Мадхья 20.3", "ЧЧ Антья 6.249–257", "ЧЧ Мадхья 16.110",
                "ЧЧ Мадхья 6.250–251", "ЧЧ Антья 6.258–268"]
  sources: []
  images: []
