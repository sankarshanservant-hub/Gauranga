- id: mc-mridanga-kartal
  title: {ru: "Мриданга (кхол) и караталы", en: "Mridanga (khol) and karatalas"}
  rubric: music
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Мриданга и караталы в житиях — постоянно (ЧБ Ади 8.10, 15.80; киртан — ЧБ Мадхья). Глиняный корпус бенгальского
      кхола — по позднейшим данным и изображениям; для XVI в. проверить.
    en: >-
      Mridanga and karatalas appear constantly in the hagiographies (CB Adi 8.10, 15.80; kirtan — CB Madhya). The clay
      body of the Bengali khol follows later data and images; to be checked for the 16th c.
  text:
    ru: >-
      Мриданга бенгальского киртана (кхол) — длинный барабан с двумя кожаными мембранами разного размера: широкая даёт
      низкий гул, узкая — звонкий высокий тон; корпус, по позднейшему обычаю, глиняный. Караталы — пара бронзовых
      тарелочек на шнурке, задающих ритм. Вместе с пением святых имён они и есть звук санкиртаны, которую Махапрабху
      начал в Навадвипе.
    en: >-
      The mridanga of Bengali kirtan (khol) is a long drum with two leather heads of different sizes: the broad one
      gives a deep boom, the narrow one a bright high tone; by later custom its body is of clay. Karatalas are a pair of
      bronze hand-cymbals on a cord that keep the rhythm. Together with the chanting of the holy names they are the
      sound of the sankirtana Mahaprabhu began in Navadvipa.
  hagiography: ["ЧБ Ади 8.10", "ЧБ Ади 15.80", "ЧБ Ади 15.148–149"]
  sources: []
  images: []
  game: {model: "кхол 60 см, асимметричный, ремни-растяжки; караталы Ø 6–8 см", where: ["navadvipa/srivasa-angan"]}
