# Рубрика «Путь» (travel). Формат — material-culture/README.md.

- id: mc-palanquin
  title: {ru: "Закрытый паланкин (дола)", en: "Covered palanquin (dola)"}
  rubric: travel
  era_evidence: hagiography
  evidence_note:
    ru: >-
      Сита Тхакурани приезжает «на закрытом паланкине» со служанками — ЧЧ Ади 13.114. Устройство и носильщики —
      реконструкция. Эпоха: «Айн-и Акбари» (1590-е) — в Бенгалии и Ориссе ездят в *сукхасане*: паланкине в форме
      полумесяца, обтянутом камлотом или алым сукном, с металлическими креплениями и жердью на железных крюках; в нём
      можно сидеть, лежать и спать; от солнца и дождя — съёмный навес.
    en: >-
      Sita Thakurani arrives 'in a covered palanquin' with her maidservants — CC Adi 13.114. Construction and bearers
      are reconstructed. Period: Ain-i Akbari (1590s) — in Bengal and Orissa people travel in the *sukhasan*: a
      crescent-shaped palanquin covered with camlet or scarlet cloth, with metal fittings and a pole on iron hooks;
      one can sit, lie and sleep in it; a removable awning keeps off sun and rain.
  text:
    ru: >-
      Знатные женщины путешествовали в закрытом паланкине — ящике или ложе на длинной жерди, которую несли на плечах
      носильщики; занавеси скрывали едущую от посторонних глаз. Так Сита Тхакурани, супруга Адвайты Ачарьи, приехала
      из Шантипура в Навадвипу посмотреть на младенца, а за ней шли служанки с корзинами даров.
    en: >-
      Women of standing travelled in a covered palanquin — a box or litter slung from a long pole carried on bearers'
      shoulders; curtains hid the traveller from strangers' eyes. In this way Sita Thakurani, Advaita Acharya's wife,
      came from Shantipur to Navadvipa to see the baby, followed by maidservants carrying baskets of gifts.
  hagiography: ["ЧБ Ади 15.137 (дола для жениха)", "ЧЧ Ади 13.114"]
  sources: ["Hobson-Jobson (1903), s.v. Palankeen (в Бенгалии — 4 носильщика, жердь выгнута дугой)",
