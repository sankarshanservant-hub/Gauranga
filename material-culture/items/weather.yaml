# Погода и времена года (rubric: nature). Формат — material-culture/README.md.
# Исполнитель `nature`. Уже есть: mc-lunar-calendar и mc-danda-prahara (счёт месяцев и часов, life), mc-festival-year
# (праздники Пури, worship), mc-eclipse-bath (затмение в ночь явления, rites), mc-monsoon и mc-cold-season (body) —
# здесь не повторяются.

- id: mc-six-seasons
  title: {ru: "Шесть времён года Бенгалии", en: "The six seasons of Bengal"}
  rubric: nature
  era_evidence: epoch
  evidence_note:
    ru: >-
      Шесть ритý по два лунных месяца — общеиндийская система санскритской поэзии и календаря, старше эпохи. В житиях —
      «в картику ещё очень холодно для пути» (ЧЧ Мадхья 16.9), «четыре месяца дождей» (Мадхья 16.282–283), жара
      джьяйштхи (Антья 20.109), чайтра с ароматом малати (Антья 1.78). Что делалось по сезонам — частью реконструкция.
    en: >-
      Six ritus of two lunar months each — the pan-Indian system of Sanskrit poetry and calendar, older than the
      period. In the hagiographies: "in Kartika it is still too cold to travel" (CC Madhya 16.9), "the four months of
      rains" (Madhya 16.282–283), the heat of Jyaishtha (Antya 20.109), Chaitra with the scent of malati (Antya 1.78).
      What was done in each season is partly a reconstruction.
  text:
    ru: >-
      Бенгальский год делится на шесть ритý. Гришма, лето (вайшакха–джьяйштха), — палящий зной, грозы-калбайсакхи и
      манго. Варша, дожди (ашадха–шравана), — муссон, заливные поля, Ратха-ятра. Шарат, осень (бхадра–ашвина), — высокая
      вода, ясное небо, белые облака и цветы каша. Хеманта, предзимье (картика–аграхаяна), — жатва риса и туманы. Шита,
      зима (пауша–магха), — холодные ночи, жёлтые поля горчицы, сбор пальмового сока. Васанта, весна (пхалгуна–чайтра), —
      цветы манго, кукушки, Дола-ятра и день явления Махапрабху.
    en: >-
      The Bengali year has six ritus. Grishma, summer (Vaishakha–Jyaishtha): burning heat, kal-baisakhi storms and
      mangoes. Varsha, the rains (Ashadha–Shravana): the monsoon, flooded fields, Ratha-yatra. Sharat, autumn
      (Bhadra–Ashvina): high water, clear skies, white clouds and kash flowers. Hemanta, late autumn
      (Kartika–Agrahayana): the rice harvest and fogs. Shita, winter (Pausha–Magha): cold nights, yellow mustard fields,
      tapping palm sap. Vasanta, spring (Phalguna–Chaitra): mango blossom, cuckoos, Dola-yatra and the day of
      Mahaprabhu's appearance.
  hagiography: ["ЧЧ Мадхья 16.9", "ЧЧ Мадхья 16.282–283", "ЧЧ Антья 20.109", "ЧЧ Антья 1.78"]
  sources: []
  images: []
  game: {model: "смена сезонов в уровне: цвет полей, листва, погодные эффекты", where: ["navadvipa/fields"],
         notes: "таблица для дизайнеров: сезон → цвет полей, цветы, звуки (кокила весной, лягушки в дожди, шакалы зимой)"}
