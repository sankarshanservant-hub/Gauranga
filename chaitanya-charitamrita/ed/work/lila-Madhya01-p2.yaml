- id: cc-P2-08
  source: cc
  ref: "Мадхья 1.168–181"
  file: "chaitanya-charitamrita/ed/vcd/CC_Madhya01.md"
  period: P13
  order: 11
  title: "Владыка Гауды о Господе: «Пусть идёт, куда пожелает»; Кешава Чхатри умаляет Господа, Дабир Кхас (Рупа) открывает Его славу"
  summary: "Мусульманский правитель Гауды, изумлённый влиянием Господа, говорит: кто без даяний ведёт за собой столько людей — несомненно, пророк; пусть никто не чинит Ему препятствий. Кешава Чхатри, чтобы отвратить вражду, умаляет Господа — нищий санньяси, на которого наговаривают, — и через брахмана просит Господа уйти. Наедине царь спрашивает Дабира Кхаса; тот говорит: даровавший тебе царство Господь родился в твоей стране; спроси своё сердце — ты, царь, подобен части Вишну. Царь отвечает: сердце говорит мне, что Он — Сам Ишвара."
  persons: ["@gauda-sultan", "@keshava-vasu", "@rupa-gosvami", "@mahaprabhu"]
  places: ["#gauda", "#ramakeli"]
  kind: lila
  authority: A
  notes: "Ст. 166 — у ВЧД «на окраине Бенгалии» (исправлено: близ Гауды, сноска); ст. 173 — у ВЧД «Твой слуга» (в оригинале — явана; сноска). «Амрита-праваха-бхашья»: владыка Гауды — падишах Хусейн Шах; Кешава намеренно не дал разговору развиться, опасаясь вражды царя к Господу."
  themes: [muslims, revelation]
  years: [1514, 1514]
  date_conf: вероятно
  date_basis: "путь в Гауду, 1514 г. (ev-departure-for-gauda)"
  cc: "Мадхья 1"
  divergence: "У Карнапуры («Чайтанья-чандродая», акт 9) султану объясняет, кто идёт, сам министр Кешава Васу, и султан признаёт Господа Богом; в ЧЧ Кешава Чхатри умаляет Господа, а славу Его открывает Дабир Кхас (Рупа)."
  event: ev-gauda-sultan-sees-crowds
