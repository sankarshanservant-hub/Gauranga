  title: "Существа четырнадцати миров под видом паломников приходят на даршан; Господь гневается на киртан о Нём, народ славит Его; шутливый укор Шриниваса"
  summary: "Живые существа всех четырнадцати миров, приняв облик людей, под видом паломников приходят в Нилачалу увидеть Господа. Однажды Шривас и другие преданные поют киртан о качествах Махапрабху; Господь гневно говорит: «Оставив имена и качества Кришны, что вы поёте? Своевольные, вы погубите мир!» В это время несметные толпы со всех сторон кричат: «Слава Кришне Чайтанье, сыну царя Враджа! Мы пришли издалека — дай нам даршан!» Тронутый их смирением, Господь выходит, поднимает руки и велит: «Говорите „Хари! Хари!“» — и все стороны наполняет звук имени. Люди славят Его как Ишвару; Шринивас шутливо говорит: «Дома Ты прячешься — зачем же являешься снаружи? Закрой им рты рукой! Солнце взошло — и хочет спрятаться». Господь отвечает: «Шринивас, оставь насмешки — вы все вместе Меня позорите», одаряет людей благим взглядом и уходит в дом, исполнив их желание."
