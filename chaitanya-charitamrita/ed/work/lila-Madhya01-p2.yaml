  file: "chaitanya-charitamrita/ed/vcd/CC_Madhya01.md"
  period: P13
  order: 11
  title: "Владыка Гауды о Господе: «Пусть идёт, куда пожелает»; Кешава Чхатри умаляет Господа, Дабир Кхас (Рупа) открывает Его славу"
  summary: "Мусульманский правитель Гауды, изумлённый влиянием Господа, говорит: кто без даяний ведёт за собой столько людей — несомненно, пророк; пусть никто не чинит Ему препятствий. Кешава Чхатри, чтобы отвратить вражду, умаляет Господа — нищий санньяси, на которого наговаривают, — и через брахмана просит Господа уйти. Наедине царь спрашивает Дабира Кхаса; тот говорит: даровавший тебе царство Господь родился в твоей стране; спроси своё сердце — ты, царь, подобен части Вишну. Царь отвечает: сердце говорит мне, что Он — Сам Ишвара."
