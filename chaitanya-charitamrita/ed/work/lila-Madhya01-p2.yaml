  period: P14
  order: 1
  title: "Восемнадцать лет в Нилачале: спутники, живущие с Господом, и ежегодные приходы преданных Гауды на четыре месяца"
  summary: "Вернувшись из Вриндавана, Господь восемнадцать лет живёт в Нилачале и никуда не уходит. Каждый год приходят преданные Гауды и остаются с Ним четыре месяца; Господь непрестанно поёт и пляшет в киртане и дарует любовную преданность всем, вплоть до чандалов. В Нилачале живут Гададхара Пандит, Вакрешвар, Дамодар, Шанкар, Харидас, Джагадананда, Бхавананда, Говинда, Кашишвар, Парамананда Пури, Сварупа Дамодара, Рамананда Рай и другие жители Кшетры; каждый год приходят Адвайта, Нитьянанда, Мукунда, Шривас, Видьянидхи, Васудева, Мурари и другие."
  persons: ["@mahaprabhu", "@gadadhara-pandita", "@vakreshvara", "@damodara-pandita", "@shankara-pandita", "@haridasa-thakura", "@jagadananda-pandita", "@bhavananda-raya", "@govinda-servant", "@kashishvara", "@paramananda-puri", "@svarupa-damodara", "@ramananda-raya", "@advaita", "@nityananda", "@mukunda-datta", "@srivasa", "@pundarika-vidyanidhi", "@vasudeva-datta", "@murari-gupta"]
  places: ["#puri"]
