  summary: "При встрече были Нитьянанда, Харидас, Шривас, Гададхар, Мукунда, Джагадананда, Мурари и Вакрешвар; братья падают к стопам каждого, и все говорят: «Вы благословенны — вы обрели Господа». Прощаясь, они смиренно просят Господа уйти: хоть царь Гауды и почитает Его, он мусульманин, доверять ему нельзя; идти во Вриндаван с толпой в сотни тысяч человек — не подобает. Господу нечего бояться, но Его лила — человеческая. Братья уходят, и Господь решает покинуть деревню."
