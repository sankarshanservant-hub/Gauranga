- id: cc-P2-09
  source: cc
  ref: "Мадхья 1.182–218"
  file: "chaitanya-charitamrita/ed/vcd/CC_Madhya01.md"
  period: P13
  order: 12
  title: "Рамакели: Дабир Кхас и Сакара Маллик в полночь приходят к Господу; молитвы смирения; Господь даёт им имена Рупа и Санатана"
  summary: "Посоветовавшись, братья тайно, в полночь приходят к Господу; сначала их встречают Нитьянанда и Харидас и докладывают о них. С травой в зубах и тканью на шее братья падают ниц, плачут от смирения и молятся: они ниже Джагая и Мадхая — млеччхи по общению и делам; приводят шлоки «Бхакти-расамрита-синдху» (1.2.154) и «Стотра-ратны» (47, 43). Господь говорит: вы — Мои давние слуги, отныне ваши имена — Рупа и Санатана; по вашим письмам Я знал ваши сердца и наставлял вас шлокой о женщине, привязанной к другому; в Гауду Я пришёл только ради вас; скоро Кришна освободит вас. Он возлагает руки им на головы, они — Его стопы себе на головы; Господь просит преданных помиловать братьев, и все восклицают «Хари!»."
  persons: ["@mahaprabhu", "@rupa-gosvami", "@sanatana-gosvami", "@nityananda", "@haridasa-thakura", "@jagai-madhai"]
  places: ["#ramakeli"]
  kind: lila
  authority: A
  notes: "Ст. 202 — по изданию ГМ «садайа» (Милосердный); у ВЧД — по чтению «сва-дайа̄» (сноска). Подробнее — Мадхья 19 (отречение братьев), Антья 1. Джагай и Мадхай — упоминание (ev-jagai-madhai-deliverance)."
  themes: [mercy, muslims]
  teaching: [holy-name, vaishnava]
  scriptures: ["Бхакти-расамрита-синдху, 1.2.154", "Стотра-ратна, 47", "Стотра-ратна, 43"]
  years: [1514, 1514]
  date_conf: вероятно
  date_basis: "путь в Гауду, 1514 г. (ev-departure-for-gauda)"
