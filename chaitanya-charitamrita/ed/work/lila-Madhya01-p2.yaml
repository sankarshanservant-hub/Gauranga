  summary: "Пробыв в Нилачале несколько дней, Господь тайно, ночью, уходит во Вриндаван; с Ним лишь Балабхадра Бхаттачарья. Лесной дорогой Джхарикханды, являя разные игры, Он приходит в Каши; через четыре дня идёт во Вриндаван, видит Матхуру и обходит двенадцать лесов. При виде мест лил Он теряет покой от премы, и Балабхадра уводит Его из Матхуры."
