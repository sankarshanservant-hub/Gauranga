  summary: "Люди весь день без счёта приходили и уходили. Вечером Адвайта начал санкиртану и пустился в пляс, а Господь смотрел; Нитьянанда кружил рядом, поддерживая Ачарью, Харидас радостно плясал позади. Ачарья велел петь песню Радхи: «Что сказать, подруга, — нет предела моей нынешней радости: Мадхава навсегда в моём доме», — и танцевал в поту, дрожи и слезах, с громкими возгласами; кружась, Он снова и снова хватал Господа за стопы: «Много дней Ты обманывал Меня и ускользал; теперь Ты попался в Моём доме — Я свяжу Тебя и не отпущу». Так Адвайта пел и плясал целую прахару (три часа) ночи."
