  notes: "Ст. 161 — у ВЧД «днём люди могли видеть Махапрабху и ощущать заботу Адвайты» (исправлено по «Анубхашье»: днём Господа видит Ачарья; сноска). Ст. 162 — «пралая» у ВЧД «опустошение» (исправлено: обморок; сноска). «Анубхашья» к ст. 165: Шачи — вечно совершенная, сама Яшода, с рождения служила Кришне."
