  title: "Ачарьяратна привозит в паланкине Шачи и жителей Надии; Шачи плачет над бритой головой сына: «Не будь жесток, как Вишварупа»; Господь: «Это тело — твоё, Я останусь там, где ты скажешь»"
  summary: "Утром Ачарьяратна (Чандрашекхара) привёз в паланкине Шачимату, с ним пришли преданные и все жители Надии — женщины, дети, старики. Когда Господь, совершив утренние обязанности, пел святое имя, они прибыли в дом Адвайты. Господь упал перед Шачи, как палка; она взяла Его на колени и заплакала. Не увидев Его волос, Шачи была потрясена: отирала Ему тело, целовала лицо, но не могла разглядеть Его из-за слёз. «Нимай, сыночек, не будь жесток, как Вишварупа: став санньяси, он больше не показался мне; если и Ты так поступишь, я умру». Господь, плача, ответил: «Это тело — твоё, Моего здесь ничего нет; ты родила и взлелеяла его, и Мне не уплатить долг и за миллионы рождений. Сознательно или нет Я принял санньясу, Я никогда не стану к тебе безразличен: Я останусь там, где скажешь, и исполню всё, что велишь». Он снова и снова кланялся, а мать снова и снова брала Его на колени."
  persons: ["@mahaprabhu", "@shachi", "@chandrashekhara-acharya", "@vishvarupa", "@advaita"]
  places: ["#shantipura", "#navadvipa"]
  kind: lila
