- id: cc-P2-04
  source: cc
  ref: "Мадхья 3.150–159"
  file: "chaitanya-charitamrita/ed/vcd/CC_Madhya03.md"
  period: P09
  order: 45.4
  title: "Господь обнимает каждого из преданных Навадвипы (Шриваса, Рамаи, Видьянидхи, Гададхара и другие); дом Адвайты становится Вайкунтхой; неистощимая кладовая Адвайты"
  summary: "Ачарья увёл мать в дом, а Господь поспешил к преданным, встречая каждого по очереди: глядя в лицо, крепко обнимал. Преданные печалились, не видя Его волос, но Его красота дарила им великое счастье. Там были Шриваса, Рамаи, Видьянидхи, Гададхара, Гангадаса, Вакрешвара, Мурари, Шукламбара, Буддхиманта Хан, Нандана, Шридхара, Виджая, Васудева, Дамодара, Мукунда, Санджая и бессчётные жители Навадвипы; всех Господь встречал с улыбкой и милостивым взглядом. Все плясали в блаженстве, восклицая «Хари! Хари!», и дом Ачарьи стал Шри Вайкунтхой. Всем, кто пришёл из Навадвипы и разных деревень, Адвайта много дней давал кров, пищу и питьё, а его кладовая не убывала: сколько тратилось, столько и прибывало."
  persons: ["@mahaprabhu", "@advaita", "@shachi", "@srivasa", "@srirama-pandita", "@pundarika-vidyanidhi", "@gadadhara-pandita", "@gangadasa-pandita", "@vakreshvara", "@murari-gupta", "@shuklambara", "@buddhimanta-khan", "@nandana-acharya", "@shridhara", "@vijaya-dasa", "@vasudeva-datta", "@damodara-pandita", "@mukunda-datta", "@mukunda-sanjaya"]
  places: ["#shantipura", "#navadvipa", "#vaikuntha"]
  kind: lila
  authority: A
  notes: "Отождествления по перечню (ст. 153–154) не однозначны: «Рамаи» — Шри Рама Пандит, брат Шривасы; «Видьянидхи» — Пундарика Видьянидхи; «Гангадаса» — Гангадаса Пандит (вероятно); «Нандана» — Нандана Ачарья (вероятно); «Виджая» — Виджая Дас (вероятно); «Васудева» — Васудева Датта (вероятно); «Дамодара» — Дамодара Пандит (вероятно); «Мукунда» — Мукунда Датта (вероятно); «Санджая» — Мукунда-Санджая (вероятно; может читаться и как одно имя «Мукунда-Санджая»)."
