  title: "Шачи готовит для Господа и преданных; ночной киртан, где Господь в экстазе падает оземь; молитва Шачи Нараяне: «Пусть Нимай не чувствует боли»"
  summary: "С того дня Шачи готовила, и Господь вкушал с преданными. Днём радостью Ачарьи было созерцать Господа, ночью люди смотрели, как Он танцует и поёт. В киртане в Господе пробуждались все чувства — оцепенение, дрожь, волоски дыбом и слёзы, прерывающийся голос, обморок; Он то и дело с размаху падал оземь. Видя это, Шачи плакала: «Мне кажется, тело Нимая разбилось» — и, восклицая «увы!», молила Вишну: «О Нараяна, за всё служение, что я совершала Тебе с детства, дай мне один плод: когда Нимай падает на землю, пусть Он не чувствует боли». Так Шачидеви, охваченная материнской любовью, волновалась от радости, страха и смирения."
