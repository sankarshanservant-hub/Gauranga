  title: "Мукунда поёт песнь разлуки «Яд любви к Кану сжигает тело и ум»; битва чувств в Господе; Он вскакивает с криком «Пойте!» и пляшет прахару, пока Нитьянанда не удерживает Его; десять дней пиров и киртанов"
  summary: "Не находя рядом Кришны, Господь в разлуке ощутил нарастающие волны жгучей любви и упал на землю; Ачарья прекратил танец. Мукунда, зная сердце Господа, запел созвучную песню: «Увы, подруга, чего только не случилось со Мной! Яд любви к Кану сжигает Мои тело и ум; день и ночь горит сердце — куда бы ни полететь, лишь бы найти Кану». Ачарья поднял Господа танцевать, но Тот не мог устоять: слёзы, дрожь, волоски дыбом, пот, прерывающийся голос; Он то вставал, то падал, то плакал. Безнадёжность, уныние, радость, порывистость, гордость и смирение, как войско, бились с Господом; изнурённый их ударами, Он упал без дыхания, а затем вдруг вскочил с рёвом и, крича «Пойте! Пойте!», плясал целую прахару — то в радости, то в печали; Нитьянанда поддерживал Его, Адвайта и Харидас плясали позади. После трёх дней поста и трапезы неистовый танец утомил Господа, хотя в любви Он не замечал усталости; Нитьянанда удержал Его, Адвайта остановил киртан и уложил Господа отдыхать. Так десять дней подряд Адвайта служил Господу трапезами и киртанами."
