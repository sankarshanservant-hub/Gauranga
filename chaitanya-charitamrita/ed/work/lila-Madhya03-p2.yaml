  summary: "Шриваса и другие преданные-брахманы хотели пригласить Господа на трапезу. Услышав это, Шачи умоляла их: «Где я ещё увижу Нимая? Вы встретитесь с Ним и в другом месте, а у меня, несчастной, есть только эта встреча. Пока Нимай в доме Ачарьи, позвольте мне одной кормить Его — прошу у вас этого дара». Преданные, поклонившись, ответили: «Мы все согласны с желанием матери»."
