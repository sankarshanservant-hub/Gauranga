<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гаура-лила по писаниям</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Bengali:wght@400;500&family=Tiro+Devanagari+Sanskrit&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="light" aria-hidden="true"><span class="light__candle"></span><span class="light__sun"></span></div>

<header class="top">
  <div class="top__brand">
    <svg class="top__lotus" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10c6 8 8 16 0 30-8-14-6-22 0-30Zm0 30c4-10 12-16 22-16-2 10-10 17-22 16Zm0 0C20 41 12 34 10 24c10 0 18 6 22 16Zm-20 6h40M18 50h28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <h1 class="top__title" data-i18n="title">Гаура-лила</h1>
      <p class="top__sub" data-i18n="subtitle">Лилы Шри Чайтаньи Махапрабху по писаниям</p>
    </div>
  </div>
  <div class="top__tools">
    <label class="jump">
      <span class="sr" data-i18n="jumpLabel">Перейти к лиле</span>
      <select id="jump"></select>
    </label>
    <button type="button" class="music" id="music" aria-pressed="false" aria-label="Музыка">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/><path class="music__off" d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="lang" role="group" aria-label="Язык / Language">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="band" aria-labelledby="band-title">
    <h2 id="band-title" class="sr" data-i18n="ribbon">Лента лил</h2>
    <button type="button" class="band__arrow band__arrow--prev" id="prev" aria-label="Назад">‹</button>
    <div class="ribbon" id="ribbon" tabindex="0">
      <div class="ribbon__track" id="track"></div>
    </div>
    <button type="button" class="band__arrow band__arrow--next" id="next" aria-label="Вперёд">›</button>
  </section>

  <ul class="mbooks" id="mbooks" aria-live="polite"></ul>

  <p class="hint" data-i18n="hint">Листайте ленту. Нажмите на название лилы, чтобы увидеть писания, где она описана.</p>

  <aside class="legend" aria-label="Достоверность">
    <span data-i18n="legend">Достоверность источника:</span>
    <span><b class="auth auth--A">A</b> <span data-i18n="authA">канонический</span></span>
    <span><b class="auth auth--B">B</b> <span data-i18n="authB">принятый традицией</span></span>
    <span><b class="auth auth--C">C</b> <span data-i18n="authC">с оговорками</span></span>
    <span><b class="auth auth--D">D</b> <span data-i18n="authD">сомнительный</span></span>
  </aside>
</main>

<div class="reader" id="reader" hidden>
  <div class="reader__glow" aria-hidden="true"></div>
  <article class="scroll" role="dialog" aria-modal="false" aria-labelledby="r-title">
    <header class="scroll__head">
      <button type="button" class="scroll__close" id="r-close" aria-label="Закрыть">×</button>
      <p class="scroll__lila" id="r-lila"></p>
      <h2 class="scroll__title" id="r-title"></h2>
      <p class="scroll__author" id="r-author"></p>
      <div class="layers" id="layers" role="group"></div>
    </header>
    <div class="scroll__body" id="r-body" tabindex="0"></div>
    <footer class="scroll__foot">
      <button type="button" class="scroll__nav" id="r-prev" aria-label="Предыдущее писание">←</button>
      <span class="scroll__ref" id="r-ref"></span>
      <button type="button" class="scroll__nav" id="r-next" aria-label="Следующее писание">→</button>
    </footer>
  </article>
</div>

<script src="app.js"></script>
</body>
</html>
