  date_conf: оценка
  date_basis: "во время паломничества Нитьянанды (до встречи с Господом)"
  themes: [revelation, mercy, pilgrimage]
  notes: "«Бхакти-ратнакара» 5.691–723 (рассказ Рагхавы Пандита)."

