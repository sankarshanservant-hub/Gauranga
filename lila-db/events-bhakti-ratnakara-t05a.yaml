  order: 12.3
  date_conf: оценка
  date_basis: "после прихода Рагхунатхи к Радха-кунде"
  themes: [mercy, teaching]
  notes: "«Бхакти-ратнакара» 5.554–562."

- id: ev-raghunatha-sakhisthali-leaf-cup
  title: "Рагхунатха Дас отбрасывает чашку из листьев, сорванных в Сакхистхали — селении Чандравали"
