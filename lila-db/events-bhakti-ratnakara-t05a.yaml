# События, заведённые по «Бхакти-ратнакаре», таранга 5, двустишия 1–1900

- id: ev-advaita-mathura-blasphemer
  title: "Адвайта в Матхуре усмиряет брахмана-хулителя вайшнавов, явив четырёхрукий облик"
  title_en: "Advaita in Mathura subdues a brahmana who reviled Vaishnavas, revealing His four-armed form"
  period: P01
  order: 1.46
  date_conf: оценка
  date_basis: "во время паломничества Адвайты (до явления Господа)"
  themes: [offense, revelation, mercy]
  notes: "«Бхакти-ратнакара» 5.173–197 (рассказ Рагхавы Пандита «со слов старших»)."

- id: ev-radha-kunda-excavation
  title: "Радха-кунда и Шьяма-кунда наполняются водой: дар купца из Бадарикашрамы Рагхунатхе Дасу; Пандавы-деревья"
  title_en: "Radha-kunda and Shyama-kunda are filled with water: a merchant from Badarikashrama brings Raghunatha Dasa money; the Pandavas as trees"
  period: P15
  order: 12.2
  date_conf: оценка
  date_basis: "при жизни Рагхунатхи Даса у Радха-кунды (после 1534)"
  themes: [revelation, mercy]
  notes: "«Бхакти-ратнакара» 5.531–553: Нараяна во сне посылает купца с монетами; Юдхиштхира во сне просит сохранить дерево у Манаса-павана-гхата, поэтому Шьяма-кунда не квадратная."

- id: ev-sanatana-raghunatha-hut
  title: "Санатана видит тигра у Манаса-павана-гхата и велит Рагхунатхе Дасу жить в хижине"
