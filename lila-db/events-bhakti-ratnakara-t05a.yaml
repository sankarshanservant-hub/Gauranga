  period: P15
  order: 12.4
  date_conf: оценка
  date_basis: "при жизни Рагхунатхи у Радха-кунды"
  themes: [separation, krishna-lila]
  notes: "«Бхакти-ратнакара» 5.563–574 (враджаваси Дас)."

- id: ev-raghunatha-mental-sweet-rice
