# «Нитьянанда-вамша-вистара» (приписывается Вриндавану Дасу Тхакуру) — лилы в порядке изложения (формат — ../README.md).
# Перевод — nityananda-vamsha/ru/01.md–10.md (2251 двустишие, нумерация внутри глав). Метки стихов — **N.**
# Поэма о роде Нитьянанды: женитьба на Васудхе и Джахнаве, Вирачандра (Вирабхадра), Джахнава и Васудха,
# странствия Вирачандры. Основная часть — P15; лилы Нитьянанды и Господа при Его жизни привязаны к общим событиям.
# Источник уровня C (поздний; атрибуция Вриндавану Дасу сомнительна). Отождествление Вирачандры с Гаурангой —
# позиция автора; по «Чайтанья-чаритамрите» (Ади 11.8) Вирабхадра — Кширодакашайи Вишну, «ствол» ветви Нитьянанды.
# Датировки — только на записях и лишь там, где текст даёт опору. Записи добавлять в конец.

