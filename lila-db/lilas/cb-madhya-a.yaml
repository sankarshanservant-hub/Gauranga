- id: cb-1022
  source: cb
  ref: "Мадхья 2, 245–340"
  file: "chaitanya-bhagavata/ed/CB_Madhya02.md"
  period: P07
  order: 39.9
  title: "Явление Шривасе в четырёхруком облике; молитва Шривасы; Нараяни плачет, повторяя имя"
  summary: "Бесстрашно пройдя по городу к Ганге и увидев коров, Господь возвещает «Я — Нанда-нандана!», бьёт ногой в дверь комнаты, где Шриваса поклоняется Нрисимхе, и является четырёхруким в позе героя: «Твой киртан и зов Нары привели Меня с Вайкунтхи»; Шриваса славит Его молитвой Брахмы и своими стихами; вся семья и слуги поклоняются Его стопам; Господь обещает: если царь решит схватить Шривасу, Он заставит царя, слонов и птиц плакать, повторяя имя Кришны, — и по Его слову четырёхлетняя Нараяни плачет, восклицая «О Кришна!»; Господь велит хранить тайну."
  persons: ["@mahaprabhu", "@srivasa", "@narayani", "@malini", "@advaita"]
  places: ["#house-srivasa"]
  kind: lila
  authority: A
  notes: "Ст. 264–265: «Нара» — Адвайта. Ст. 333–334: как Кришна родился у Васудевы, а играл у Нанды, так Господь, явившись у Джаганнатхи Мишры, играл в доме Шривасы. Ст. 283: слова Шривасы об «иллюзорной энергии» Господа — йогамайя, скрывающая Его от близких."
