  summary: "Господь велит привести Шридхару, который ночами громко повторяет имена на окраине; Шридхара продаёт банановые листья и стебли, половину заработка тратит на поклонение Ганге, никогда не меняет цены; безбожники смеются над его ночными криками; услышав имя Господа, он падает без чувств, и его приносят к Вишвамбхару, который напоминает: каждый день Нимай приходил к его лавке, часами торговался, отнимал листья — «Я отец Ганги, которой ты поклоняешься!», — а Шридхара, закрыв уши, «Вишну! Вишну!», уступал и давал Ему что-то даром; Господь ест лишь с его листьев, не замечая миллионов подношений без преданности."
