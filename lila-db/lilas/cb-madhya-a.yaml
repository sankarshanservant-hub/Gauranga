  summary: "Узнав о страданиях преданных, Господь в настроении Вишну грозит безбожникам и восклицает «Я — Он!», смеётся, плачет, падает; Шачи думает, что это болезнь, соседи советуют связать Его, поить кокосовым соком и мазать голову маслом; придя по зову Шачи, Шриваса видит, как Господь, обходя туласи, при виде вайшнава лишается чувств, и говорит: «Это высшая према — я бы и сам хотел такого безумия»; Господь обнимает его: «Скажи ты, что Я болен, — Я бы утопился в Ганге»; Шриваса успокаивает Шачи и велит не рассказывать посторонним."
