  kind: teaching
  authority: A
  parallels: "Лочан, lcm-0156"
  notes: "Имя Хари не отлично от Самого Хари (сноска перевода). Шл. 11 — обобщающее упоминание санкиртаны по городам и избавления млеччхов."
  themes: [teaching, kirtan]
  teaching: [yuga-dharma, holy-name]
  event: ev-shrivasa-yuga-dharma-question
