  parallels: "Лочан, lcm-0202, lcm-0204"
  notes: "Сравнение плодов — махатмья святого места; оно не уравнивает богиню с Бхагаваном: Господь лишь кланяется ей как преданный (сноска перевода)."
  themes: [pilgrimage, deities]
  bhava: [devotee]
  event: ev-jajpur-viraja
  verses:
    - {file: "murari-gupta/ru/3.07.md", from: "17", to: "21"}

