  themes: [mercy, learning]
  cc: "Мадхья 11"
  event: ev-gauda-devotees-arrive-puri
  notes: "Две книги — «Брахма-самхита» и «Кришна-карнамрита» (ЧЧ Мадхья 9; ev-brahma-samhita-adikeshava, ev-krishna-karnamrita-found); в этой главе они не названы. В нашем файле ст. 135–136 отсутствуют."
