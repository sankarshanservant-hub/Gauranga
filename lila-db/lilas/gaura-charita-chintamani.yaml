- id: gcc-0005
  source: gaura-charita-chintamani
  ref: "Кирана 2, 1–26a"
  file: "gaura-charita-chintamani/ru/02.md"
  period: P07
  order: 90
  title: "Нишанта: спящая Навадвипа, спутники у дома Господа; Гаура во сне говорит словами Кришны к Радхе"
  summary: "На исходе ночи спит Надия; спутники, ночующие вокруг дома Господа, томятся в ожидании Его пробуждения. Описаны покои и ложе, золотое тело спящего Гауры — словно вершина Сумеру посреди Молочного океана, прекраснее множества Мадан. Во сне Гаура вспоминает игры с Радхой в никундже Враджа и говорит словами Кришны, обращёнными к Ней, и молит: «рождение за рождением да буду Я слугой стоп Владыки гопи»; затем снова затихает во сне."
  persons: ["@mahaprabhu", "@narahari-chakravarti"]
  places: ["#navadvipa"]
  kind: lila
  authority: C
  parallels: "ЧЧ Антья 14–19 (Господь в бхаве Радхи и во сне видит игры Враджа — ср.)"
  notes: "Описание красоты Гауры через действие на женщин — сноска с позицией Бхактисиддханты против гаура-нагари-вады (ЧБ Ади 15). Издание заново нумерует строфы после 2.20 — у переводчика 2.14a–2.26a."
  themes: [krishna-lila, ecstasy]
  teaching: [gaura-tattva]
  event: ev-gaura-ashtakala-nishanta
  verses:
    - {file: "gaura-charita-chintamani/ru/02.md", from: "2.1", to: "2.26a"}

