  summary: "Молодые женщины Навадвипы, исполненные премы к Гауре, на рассвете под предлогом домашних дел тайком собираются и рассказывают друг другу, как накануне, обманув строгих свекровей, золовок и тётушек, хоть на миг увидели Гауру на дороге; одна, вернувшись в слезах, уверяет свекровь, что испугалась змеи; нагари желают счастья лишь в счастье Гауры."
