  summary: "Нарахари (Гханашьяма Дас) в строфах разных размеров и в песнях на раги славит Шри Гурудеву, чьи стопы сокрушают беды и дают бхакти, называет себя падшим и лицемерным, молит о жизни у стоп гуру и о даре чистой бхакти; отвращается от общества тех, кто отвернулся от гуру; затем просит прощения за нарушение порядка в перечне спутников Господа."
