  file: "gaura-charita-chintamani/ru/01.md"
  period: PX
  order: 3
  title: "Нарахари о себе и о книге; слава Надии; размеры поэмы"
  summary: "Спутники Гауры вечны, с вечно новым Владыкой — их вечные игры; Нарахари молит их о служении и рассказывает о себе: родился в Гауде, на берегу Ганги, в семье брахманов, отец — вайшнав Джаганнатха, два имени — Нарахари и Гханашьяма; человеческое рождение прошло впустую; боится, что книга останется незаконченной, и оправдывается шлокой «тад-ваг-висарго…» («Бхагавата» 1.5.11). Тот же Луна Враджа — Луна Надии; слава Надии и сына Шачи; поэт говорит, что сложил размеры многих видов по матрам и слогам, и называет книгу драгоценным самоцветом."
  persons: ["@narahari-chakravarti", "@mahaprabhu"]
  places: ["#navadvipa"]
  kind: author
  authority: C
  parallels: "БР 1 (Нарахари о себе)"
  notes: "Автобиографические сведения Нарахари (отец Джаганнатха, два имени)."
  themes: [author]
  teaching: [gaura-tattva]
  verses:
    - {file: "gaura-charita-chintamani/ru/01.md", from: "1.33", to: "1.58"}

