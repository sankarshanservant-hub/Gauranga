  summary: "Васудева рассказывает Вирачандре о местах игр: в Вришабханупуре на праздник рождения Радхи Кришна и Радха тайно видят друг друга, в Нандаграме на празднике рождения Кришны Лалита и Кундалата устраивают их встречу (песни автора); омовение в Вимала-кунде, Павана-сароваре; Кхадиравана, Джават, Рама-гхат, где Баларама танцевал расу; у Бхандиры, где сам баньян уже скрылся от взоров, Вирачандре в видении являются Рама и Кришна, играющие с пастушками; Нанда-гхат, Чир-гхат, Бхадравана, Лохавана, место рождения Кришны в Гокуле-Махаване, место рождения Радхи в Равале; Вишранти-гхат в Матхуре, Гокарна, место Акруры и храм Говинды во Вриндаване."
