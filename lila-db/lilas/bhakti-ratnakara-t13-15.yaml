  summary: "Рагхунандана наедине говорит Шринивасе: настаёт тяжкое время, в сердцах зародятся сомнения (шлока «Бхаджанамриты»), но Гаура совершит через него много дел — он долго будет жить на земле, со спутниками сохранит дхарму Господа и обратит отвернувшихся от Кришны; затем, вверив сына стопам Гауранги и Мадана-гопала, три дня проводит в упоении санкиртаной и, памятуя о стопах Нарахари, устремив взор на Гопалу и Гаурангу, с именем Шри Кришна Чайтаньи сокрывается в четвёртый день светлой половины шраваны."
