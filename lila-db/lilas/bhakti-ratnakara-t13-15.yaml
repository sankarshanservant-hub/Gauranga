  summary: "Женив сына, Джахнава со спутниками снова идёт во Вриндаван и видит Гопинатху посередине и Радху справа и слева (шлоки Вишванатхи Чакраварти: «тамала меж лианами премы, туча меж молний… Гопинатха меж двух Радх»; Гопинатха подвластен преме Джахнавы); она подносит дары из Гауды, сама готовит рис и яства и кормит Гопинатху с Радхикой, молится Им, затем видит Говинду и Мадана-мохана с Радхикой — жизнь гаудиев (ЧЧ); о её жизни во Вриндаване и о втором походе во Врадж автор отсылает к «Анурага-валли» и другим книгам."
