  summary: "Сын Ачьюты, праведного правителя Раяни, Расикананда (Мурари), сведущий в шастрах, служит родителям (мать — Бхавани, жена — Иччха) и живёт в Гханташиле, где отдыхали Пандавы; размышляя, у кого принять посвящение, он слышит голос с неба: «Ты станешь учеником Шьямананды», — и повторяет его имя как мантру; на исходе ночи Шьямананда во сне обещает прийти на рассвете; утром Расика видит его, идущего с Кишорадасом и другими учениками, с именами Чайтаньи и Нитьянанды на устах, и падает к его стопам; Шьямананда даёт ему мантру Радхи и Кришны и вверяет стопам Нитьянанды и Чайтаньи; Расика приводит гуру в Раяни; Шьямананда испытывает его и радуется его гуру-бхакти, принимает многих учеников."
