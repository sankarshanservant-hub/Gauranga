  summary: "Шриниваса, наставник во всех шастрах, сокрушающий гордыню противников бхакти, ждёт письма Госвами — и Васанта Рай приносит его; Джива сообщает, что Бхугарбха Госвами в полном сознании вручил себя Владыке Вриндавана, спрашивает о старшем сыне Ачарьи Вриндаване Дасе (имя ему дал сам Джива) и его учёбе, о Вьясе Шарме и Васудеве Кавирадже; выверка «Расамрита-синдху», «Мадхава-махотсавы», «Уттара-чампу» и «Хари-намамриты» не закончена, а в сезон дождей книги не посылают; благие пожелания царю Вире Хамбиру."
