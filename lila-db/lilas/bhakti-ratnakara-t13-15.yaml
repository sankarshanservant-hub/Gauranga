  summary: "Странствуя по селениям, Джахнава приходит в Джхаматпур близ Раджбалхата, в дом слуги, где живёт брахман Ядунандана Ачарья, ставший по её милости преданным; по её желанию он отдаёт обеих дочерей, Шримати и Нараяни, Вирачандре; Вирачандра делает Ядунандану учеником, Джахнава принимает в ученицы обеих невест; Вирачандра, неотличный от Чайтаньи (по ГГД — Пайодхишайи, вьюха Санкаршаны), возвращается в Кхардаху, Васудха радуется невесткам."
  persons: ["@virabhadra", "@jahnava", "@yadunandana-acharya-jhamatpur", "@srimati-virachandra", "@narayani-virachandra", "@vasudha", "@mahaprabhu"]
  places: ["#jhamatpur", "#kharadaha"]
  kind: post-advent
  authority: B
  scriptures: ["ГГД (Вирачандра — Пайодхишайи)"]
  parallels: "«Према-виласа», указатель к виласе 24 (Шримати и Нараяни, дочери Ядунанданы из Джхаматпура); «Нитьянанда-вамша-вистара» 3–4"
  divergence: "По «Нитьянанда-вамша-вистаре», Нараяни — дочь Океана, воспитанная Судхамаей, а вторая жена — Вишнуприя; здесь обе жены — дочери Ядунанданы. Здесь свадьба помещена после установления Радхи у Гопинатхи, при жизни Шринивасы в Яджиграме."
  notes: "Джхаматпур близ Раджбалхата (Хугли), по-видимому, не тот, что родина Кришнадаса Кавираджи (сноска перевода); тег места — общий."
