- id: krn-0031
  source: karnananda
  ref: "Нирьяса 6, 49–122"
  file: "karnananda/ru/06.md"
  period: P15
  order: 81
  title: "Обет Шринивасы и повеление Говинды; пады Шринивасы о Говинде и Гуна-манджари; дары Гауры и Рагхунатхи Даса; проводы из Вриндавана"
  summary: "Шринивас соглашается идти в Гауду лишь если связанные с ним обретут стопы Радхи и Кришны; Гопала Бхатта, Рагхунатха Дас, Джива, Рагхунатха Бхатта, Локанатха и Бхугарбха молят Говинду, и Тот подтверждает; Шринивас поёт паду о красоте Говинды, Кришна Пандит надевает ему гирлянду Говинды; Гопала Бхатта повязывает ему на голову каупину и ткань Махапрабху; пада Шринивасы к Гуна-манджари; Рагхунатха Дас, пришедший с Радха-кунды, даёт коснуться камня Говардханы и гирлянды гунджи; Шринивас получает Вамшивадану и шалаграму и с книгами уходит в Гауду, Госвами и враджаваси провожают его с плачем; путь описан в «Према-виласе»."
  persons: ["@srinivasa-acharya", "@gopala-bhatta", "@raghunatha-dasa", "@jiva-gosvami", "@raghunatha-bhatta", "@lokanatha", "@bhugarbha", "@govinda-deity", "@krishna-pandita-govinda", "@mahaprabhu"]
