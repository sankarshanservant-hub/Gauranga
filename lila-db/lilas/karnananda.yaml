  summary: "Шринивас поселяется у Валлабхи и с Валлави Кавираджей приходит во дворец; ночью царь во сне видит Калачанда и Шринивасу и слагает две пады («Прабху мой Шринивас…», «Послушай, подруга моего сердца…»), которые слышит главная царица; она умоляет дать ей прибежище у стоп Шринивасы, и тот даёт ей Хари-наму, мантру Божественной Четы, кама-гаятри и наставляет: без следования группе манджари расы паракии и Враджа не достичь; в сиддха-дехе — служение в уме, во внешнем теле — слушание и киртан."
