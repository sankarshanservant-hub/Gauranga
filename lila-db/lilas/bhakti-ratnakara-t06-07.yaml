  period: P15
  order: 81.8
  title: "Говинда во сне утешает Шринивасу и являет облик Гауры"
  summary: "На исходе ночи Говинда во сне приходит к Шринивасе: «Ты — воплощение Моей премы; желание Моего сердца Я явил через Рупу и Санатану, а через тебя раздам книги и дарую прему; кто примет у тебя прибежище, того Я приму; с учениками ты будешь вкушать санкиртану»; затем Он принимает облик Гауры, кладёт стопы на голову Шринивасы, обнимает, отпускает в Гауду и входит в храм."
