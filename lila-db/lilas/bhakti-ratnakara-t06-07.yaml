  summary: "Утром в храм Говинды сходятся маханты Вриндавана (Гопала Бхатта, Бхугарбха, Локанатха, Парамананда Бхаттачарья, Мадху Пандит, Кришнадас Брахмачари, Рагхава, Двиджа Харидас, Кришнадас Кавираджа и др.); Джива и Кришна Пандит велят принести книги, погрузить сундук на повозку со стражей; Госвами провожают часть пути, Джива и некоторые — до Матхуры, где день и ночь проходят в беседах о Кришне; утром Джива ещё провожает их и, плача, вверяет Нароттаму и Шьямананду Шринивасе."
  persons: ["@srinivasa-acharya", "@narottama-dasa", "@shyamananda", "@jiva-gosvami", "@gopala-bhatta", "@bhugarbha", "@lokanatha", "@paramananda-bhattacharya", "@madhu-pandita", "@krishnadasa-brahmachari", "@raghava-gosvami-govardhana", "@dvija-haridasa", "@krishnadasa-kaviraja", "@krishna-pandita-govinda", "@govinda-deity"]
  places: ["#vrindavana", "#mathura"]
  kind: post-advent
  authority: B
  parallels: "«Нароттама-виласа» 3 (nvl-0020); «Према-виласа» 13 (pvl-0084); «Анурага-валли» 6 (anv-0037)"
  notes: "Названы также Мадхава, Преми Кришнадас, Ядава Ачарья, Нараяна, Пундарикакша Госани, Говинда, Ишана, Вани Кришнадас, Уддхава, Гопала Дас (без тегов)."
  divergence: "В «Нароттама-виласе» с повозкой идут одиннадцать вооружённых враджавасов; в «Према-виласе» за Матхурой Джива наставляет их о Рупе и Санатане как шакти Гауранги. По БР, Кришнадас Кавираджа провожает их до Матхуры живым и здоровым — ср. «Према-виласу» 13 о его уходе при вести о похищении книг."
