  order: 88.23
  title: "Шриниваса у Гададхары Даса в Кантака-нагаре"
  summary: "В Кантака-нагаре Шриниваса кланяется Гауранге и находит Гададхару Даса без еды и питья, плачущего о Гададхаре Пандите («ты ушёл первым, покинув меня»); тот обнимает его, говорит, что слышал всё — о Вриндаване, посвящении у Гопалы Бхатты, Нароттаме, которого Господь призвал в Рамакели, и книгах, найденных в Вишнупуре, — оплакивает сокрытие Шриваса, Вишнуприи и других, предсказывает приход Нароттамы, санкиртану, женитьбу Шринивасы и многих последователей и отпускает его к матери."
