  summary: "Медитируя на десятисложную мантру, Господь плачет: «Кришна, Мой отец, Хари, Моя жизнь, куда Ты ушёл, похитив Моё сердце? Дитя Моё, на кого Ты Меня оставил?» — и катается в пыли; ученикам Он велит вернуться в Навадвипу: Он оставляет мирскую жизнь и идёт в Матхуру к Кришначандре; на рассвете Он уходит, но небесный голос говорит: «Не время идти в Матхуру — вернись в Навадвипу: Ты, Владыка Вайкунтхи, пришёл раздать прему, и Твой киртан наполнит вселенные»; Господь возвращается и в Навадвипе открыто являет служение Кришне."
