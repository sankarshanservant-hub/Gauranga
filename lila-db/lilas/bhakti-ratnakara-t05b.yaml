- id: brt-2014
  source: bhakti-ratnakara
  ref: "Таранга 5, 2263–2328"
  file: "bhakti-ratnakara/ru/05.md"
  period: P05
  order: 1.2
  title: "Пандарпур: Баладева во сне велит Лакшмипати посвятить Нитьянанду"
  summary: "В Пандарпуре, увидев Виттхаланатху, Нитьянанда живёт у кроткого брахмана — собрата по учителю Мадхавы Пури; приходит его гуру, старый Лакшмипати, гуру Мадхавендры, и чувствует в доме присутствие преданного; ночью он плача молит Баладеву о милости, и Баладева — Сам Нитьянанда — является ему во сне, говорит: «Кришна — Владыка Моей жизни» — и велит дать мантру юному авадхуте; наутро Нитьянанда просит посвящения, и Лакшмипати посвящает Его; Нитьянанда уходит, а во втором сне являет облик Баладевы, затем Свой, запретив рассказывать; вскоре Лакшмипати скрывается."
  persons: ["@nityananda", "@lakshmipati-tirtha", "@balarama", "@vitthala-deity", "@madhavendra-puri", "@ishvara-puri", "@ranga-puri"]
  places: ["#pandharpur"]
  kind: vision
  authority: B
  notes: "Известно только по БР. Приводится старинная шлока о Нитьянанде, дорогом Лакшмипати (2310); Ишвара и Ранга Пури — упоминание как учеников Мадхавендры (2273)."
  divergence: "В ЧБ (Ади 9) о посвящении Нитьянанды не говорится, а Мадхавендру Нитьянанда почитает как гуру; здесь Его гуру — Лакшмипати, гуру Мадхавендры."
  themes: [revelation, mercy]
  event: ev-nityananda-lakshmipati-initiation
  verses:
