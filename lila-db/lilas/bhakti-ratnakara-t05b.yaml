  summary: "Придя в Матхуру, Нитьянанда в детском настроении играет с мальчиками, странствует по Враджу; в Гокула-Махаване видит Мадана-гопала, плачет у дома Нанды (строка ЧБ), уходит в Хастинапур; во Вриндаване под Шрингара-ватом то сидит, то катается в пыли, украшает Себя цветами и зовёт: «Где Мой Канаи?»; узнав, что Гаурасундара в Навадвипе явил Себя, Он, влекомый Господом, уходит туда; двадцать лет длилось Его паломничество."
