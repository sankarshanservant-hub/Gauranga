  title: "Встреча Нитьянанды с Мадхавендрой Пури"
  summary: "Странствуя, Нитьянанда встречает Мадхавендру близ Пратичи-тиртхи: Мадхавендра видит в Нём друга, Нитьянанда в Мадхавендре — гуру (приводятся строки ЧБ); Ишвара Пури и другие изумлены и привязываются к Нитьянанде; несколько дней оба погружены в Кришна-расу, затем Нитьянанда идёт к Рамешваре в Сетубандху, а Мадхавендра с Ишварой и другими — к Сараю; в разлуке обоих хранит лишь Кришна-према."
