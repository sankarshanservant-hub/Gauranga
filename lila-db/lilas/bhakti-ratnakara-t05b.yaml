  title: "Обход Вриндавана: Чир-гхат, Нидхувана, Кеши-тиртха, Дхира-самира, Вамшиват и места танца раса"
  summary: "Рагхава показывает Чир-гхат (Чаяна-гхат), где Радха и Кришна с сакхи отдыхали после раса и Кришна спрятал одежды, Нидхувану, Кеши-тиртху, Дхира-самиру, Маникарнику (место, где утихла мана Радхи) и Вамшиват — его затопила Ямуна, и некий Госвами посадил рядом ветвь прежнего дерева; затем — места игр раса по «Бхагаватам»: призыв флейты, испытание гопи, сокрытие Кришны с Радхой и Его возвращение, начало великого танца раса в лунную ночь (шлоки «Бхагаватам», «Гита-говинды», песни)."
