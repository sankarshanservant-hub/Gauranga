- id: brt-2013
  source: bhakti-ratnakara
  ref: "Таранга 5, 2237–2262"
  file: "bhakti-ratnakara/ru/05.md"
  period: P01
  order: 31
  title: "Шрингара-ват; явление Нитьянанды в Экачакре и уход из дома с санньяси"
  summary: "У Шрингара-вата, который зовут и Нитьянанда-ватом, Рагхава рассказывает: Нитьянанда-Рама, одно тело с Чайтаньей, явился в Экачакре у Хадаи Пандита и Падмавати, являл игры прежних аватар и двенадцать лет жил дома; решив не идти в Навадвипу, пока Гаура скрывает Себя, Он задумал паломничество; странствующий санньяси, взяв с Хадаи Ойхи обещание, выпросил Нитьянанду, и Тот ушёл, утешив родителей."
  persons: ["@nityananda", "@hadai-pandita", "@padmavati", "@mahaprabhu", "@raghava-gosvami-govardhana", "@srinivasa-acharya"]
  places: ["#shringara-vata", "#ekachakra"]
  kind: lila
  authority: B
  parallels: "ЧБ Ади 9; «Према-виласа» 7"
  notes: "Явление и детство Нитьянанды (2240–2247) — кратко (ev-nityananda-birth)."
  themes: [family, pilgrimage]
  event: ev-nityananda-leaves-home
