  period: PX
  order: 126
  title: "Раса-мандала: Вринда устраивает танец раса; учение о сангите — нада, шрути, свары, грамы, мурчханы, раги, прабандхи, тала, инструменты, танец и абхиная"
  summary: "Вринда-деви с помощницами устраивает место для танца, и Радха с Кришной и сакхи начинают раса; на этом примере Рагхава излагает Шринивасе науку сангиты (пения, игры на инструментах и танца) по «Сангита-даморе», «Сангита-париджате», Харинаяке, «Нарада-панчама-сара-самхите» и др.: возникновение нады и двадцати двух шрути, семь свар и грамы, мурчханы, аланкары, раги и рагини, алап, прабандхи (шуддха, салага, кшудра), талы, певцы, инструменты, натья, нритья и нритта, тандава и ласья, абхиная рук и глаз; всё это — в танце раса Радхи и Кришны; конец ночи и возвращение Четы домой, восемь частей дня (аштакалия) по «Говинда-лиламрите» и песням."
  persons: ["@raghava-gosvami-govardhana", "@srinivasa-acharya", "@krishna", "@radha", "@vrinda-devi", "@lalita", "@narahari-chakravarti"]
