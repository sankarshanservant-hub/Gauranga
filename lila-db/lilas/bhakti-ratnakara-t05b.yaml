  order: 127
  title: "Кунджи Вриндавана и учение о героях и героинях: виды наяки и наики, восемь состояний героини, помощники, посланницы и сакхи"
  summary: "У разных кундж Рагхава излагает по «Удджвала-ниламани» и «Бхакти-расамрита-синдху» учение о Кришне — венце героев (дхиродатта, дхиралалита, дхирашанта, дхироддхата; анукула, дакшина, шатха, дхришта), о превосходстве Радхи над Чандравали, о героинях (мугдха, мадхья, прагалбха) и восьми состояниях героини (абхисарика, васака-саджджа, уткантхита, випралабдха, кхандита, калахантарита, прошита-бхартрика, свадхина-бхартрика), о према-вайчиттье, помощниках Кришны (чета, вита, видушака, прия-нарма-сакха), о посланницах (сваям-дути, апта-дути), видах сакхи и восьми главных сакхи с их восьмёрками, о видах самбхоги и о семнадцати действиях сакхи; Нарахари вплетает и себя — по знаку сакхи навевающего ветерок Чете (3631)."
