  order: 40.5
  title: "Рупа в созерцании лилы смеётся при виде вайшнава; оба просят прощения"
  summary: "Рупа Госвами во Вриндаване созерцает, как сакхи причёсывают Радхику, а Кришна стоит позади; глянув в поднесённое зеркало, Радха видит в нём Кришну, смущается и укрывается покрывалом, сакхи смеются — и Рупа смеётся с ними; в это время приходит вайшнав, принимает смех на свой счёт и в обиде идёт к Санатане; тот объясняет причину, и вайшнав раскаивается; у Рупы видение тотчас прерывается, он понимает, что кто-то приходил, и идёт к нему; вайшнав падает к его ногам, Рупа кланяется в ответ, оба смиренно просят прощения и вместе приходят к Санатане беседовать о Кришне."
