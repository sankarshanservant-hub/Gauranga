  title: "Ранение стопы Прабху во время танца (орийское предание)"
  summary: "Танцуя в неудержимой бхаве под кхол и картал, Прабху ударяет большой палец левой ноги о кирпич и падает без чувств; Свами, Кашишвара, Яшованта, Шриватса и Ананта поднимают Его и вечером в новолуние несут в северную мандапу; Он приходит в себя, хочет посмотреть танец в храме, но не может встать; Свами всю ночь при Нём."
  persons: ["@mahaprabhu", "@jagannatha-dasa-odia", "@kashishvara", "@yashovanta-odia", "@ananta-odia", "@ramananda-raya"]
  places: ["#puri"]
  kind: lila
  authority: D
  parallels: "Джаянанда, «Чайтанья-мангала» (ранение левой ноги кирпичом)"
  notes: "Понижено до D: орийское предание о конце земной лилы, противоречащее гаудия-вайшнавскому учению; по Бхактисиддханте тело Господа — сач-чид-ананда, не подвластное болезни и разрушению, уход — сокрытие (антардхана) по Его воле (сноски перевода). Переведено точно."
  themes: [departure, kirtan]
  divergence: "ЧЧ и ЧБ о ранении не сообщают; ЧЧ (Антья 20) ухода не описывает."
