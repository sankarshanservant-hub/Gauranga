  summary: "В праздник Чанданы преданные узнают о сокрытии Прабху: «Он слился с телом Джаганнатхи, как молния скрылась в облаке»; вспоминают: «Прабху — Сам Бхагаван»; Панчасакха плачет, Ачьюта упрекает Свами, что тот не удержал Прабху; на Ратха-ятре царь, не найдя Прабху у колесницы, роняет золотую метлу; гаудийцы уносят весть в Гауду."
  persons: ["@mahaprabhu", "@jagannatha-dasa-odia", "@achyutananda-odia", "@kanhai-odia", "@yashovanta-odia", "@ananta-odia", "@prataparudra"]
