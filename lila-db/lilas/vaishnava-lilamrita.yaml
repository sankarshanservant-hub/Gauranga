  summary: "Господь приводит Рупу к Рамананде: «Преподай ему таттву и путь расы»; Рамананда учит его пяти расам и аламкарам (моттаита, килакинчита); десять месяцев Рупа слушает «Бхагавату» у Свами, видя его саттвика-бхавы, и переписывает «Брахма-самхиту» и «Карнамриту»; Каши Мишра требует удалить «министра царя-млеччхи», и Господь посылает Рупу во Вриндаван — создать святую обитель и писать книги."
  persons: ["@mahaprabhu", "@rupa-gosvami", "@ramananda-raya", "@jagannatha-dasa-odia", "@kashi-mishra"]
  places: ["#puri", "#vrindavana"]
