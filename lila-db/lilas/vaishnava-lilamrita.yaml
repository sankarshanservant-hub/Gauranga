  scriptures: ["Брахма-самхита", "Кришна-карнамрита", "Шримад-Бхагаватам"]
  divergence: "В ЧЧ расе Рупу учит Сам Господь в Праяге (Мадхья 19), а Рамананда лишь разбирает его драмы; учёбы у Джаганнатхи Даса и недовольства Каши Мишры в ЧЧ нет (Рупа сам по смирению не подходит к храму); Рупа уходит во Вриндаван после Дола-ятры, через Бенгалию."
