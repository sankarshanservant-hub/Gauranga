- id: vlm-0160
  source: vaishnava-lilamrita
  ref: "Гл. 9, 68–100"
  file: "vaishnava-lilamrita/ru/09.md"
  period: P15
  order: 10
  title: "Последние слова Прабху к Свами; сокрытие Прабху в храме в Акшая-тритью (орийское предание)"
  summary: "Свами ухаживает за Прабху; Прабху говорит ему: «Пока ты здесь, нет для Меня срока; но воля Хари исполняется… Оставив тебя, куда Я уйду? Я буду высматривать дорогу, по которой придёшь ты»; в Акшая-тритью, в брахма-мухурту, по Мадхаве, прана покинула тело Прабху; рядом в храме был один Джаганнатха Дас; на рассвете он посылает за Рамой Раем."
  persons: ["@mahaprabhu", "@jagannatha-dasa-odia", "@ramananda-raya"]
  places: ["#puri"]
  kind: lila
  authority: D
  parallels: "Джаянанда (ранение и жар); Лочана Дас (вхождение в Джаганнатху)"
  notes: "Понижено до D (см. vlm-0159). Слова «прана покинула тело» переведены точно; для гаудия-вайшнавов уход Господа — сокрытие, подобное заходу солнца (БГ 4.9; сноска к 9.90)."
  themes: [departure, separation]
  calendar: "вайшакха, шукла-тритья (Акшая-тритья)"
  divergence: "Дата — Акшая-тритья (у Джаянанды — в связи с Ратха-ятрой; у Лочаны — 7-я титхи ашадхи); при Прабху — Джаганнатха Дас, а не Сварупа и Рамананда (у Мадхавы Сварупа ушёл раньше)."
  event: ev-lord-disappearance
  verses:
    - {file: "vaishnava-lilamrita/ru/09.md", from: "9.68", to: "9.100"}

