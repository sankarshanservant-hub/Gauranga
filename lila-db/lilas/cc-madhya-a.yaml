- id: cc-1088
  source: cc
  ref: "Мадхья 9.14–37"
  file: "chaitanya-charitamrita/ed/vcd/CC_Madhya09.md"
  period: P11
  order: 35
  title: "Гаутами-ганга, Малликарджуна, Ахобала-Нрисимха; в Сиддхавате брахман, повторявший имя Рамы, начинает повторять имя Кришны: «Ты — Сам Кришна»"
  summary: "С этой шлокой Господь омылся в Гаутами-ганге, побывал у Шивы в Малликарджуне, где побуждал всех петь имена Кришны, и у Ахобала-Нрисимхи, а в Сиддхавате — у Рамачандры; брахман, не произносивший ни фразы без имени «Рама», принял Его у себя. Побывав в Сканда-кшетре и Триматхе (Тривикрама), Господь вернулся и увидел, что брахман теперь непрестанно повторяет имя Кришны. Тот объяснил: увидев Господа, он раз произнёс имя Кришны, и оно овладело его языком; он знает шлоки о равенстве имён Рамы и Кришны и о том, что имя Кришны равно трём тысячам имён Вишну (Падма-пурана; Брахманда-пурана), но прежде из любви к Раме повторял Его имя; теперь, увидев Господа, он понял: «Ты — Сам Кришна»."
