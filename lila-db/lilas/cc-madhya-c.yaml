  period: P13
  order: 185.52
  title: "Атмарама-шлока: «иттхам-бхута-гуна» — качества Кришны, перед которыми блаженство Брахмана — солома; Кумары и Шука, гопи и Рукмини, Лакшми; «Хари» — уносящий беды и ум; частицы «ча» и «апи»"
  summary: "«Иттхам-бхута» — полный такого блаженства, перед которым блаженство Брахмана — лужица в следе копыта; качества Кришны вечны, духовны и безграничны, и, ощутив хоть каплю их, оставляют бхукти, сиддхи и мукти, логику и рассуждения. Аромат туласи у Его стоп пленил Кумаров, лилы — Шукадеву, красота — гопи, весть о Нём — Рукмини, флейта — Лакшми; Он привлекает старших женщин Враджа, мужчин, животных, деревья и камни. «Хари» уносит всё неблагоприятное, как огонь дрова, и пленяет ум премой, так что четыре цели жизни теряют цену. «Ча» и «апи» имеют по семь значений."
