  summary: "Утром Ишана ведёт троих из Майяпура в Атопур — древнюю Антардвипу: Брахма, смущённый похищением телят и мальчиков, поклонялся здесь Господу, и Гаурачандра явился ему; Брахма просил родиться в низкой семье, избавиться от гордыни и не быть вновь введённым в заблуждение; Господь втайне (антар) открыл ему, что примет настроение преданного, вкусит прему Радхи и исполнит три Своих желания (ЧЧ Ади 1.6), — отсюда имя; Ишана указывает и на Суварна-вихару."
