  summary: "В Маджите (Мадхьядвипе) семь риши, восхваляя Навадвипу, поклоняются Господу, и в полдень Он является им, подобный полуденному солнцу, велит хранить Его игры в тайне; они селятся у Ганги близ Кумарахатты; в Вамана-паукхере (Брахмана-пушкаре) старому брахману, тоскующему по далёкой Пушкаре, тиртха является прудом и открывает, что в Навадвипе пребывают все тиртхи и вечно — Гаурачандра; в Хатаданге (Уччахатте) боги, собравшись как на рынке, мечтают родиться в Надии и танцуют, воспевая имена Господа."
