- id: brt-6014
  source: bhakti-ratnakara
  ref: "Таранга 12, 625–673, 697–750"
  file: "bhakti-ratnakara/ru/12.md"
  period: P15
  order: 95.761
  title: "Вайкунтхапур и Матапур (Махатпур): Нарада видит Нараяну и Гауру; Пандавы и сон Юдхиштхиры"
  summary: "Нарада, видевший, как Владыка Вайкунтхи радуется о Навадвипе, приходит к Шиве, затем в Двараке Кришна являет ему облик Гауры и велит возвестить о Его приходе; Нарада получает здесь даршан Гаурачандры (Нараяна-питха, Вайкунтхапур); в Махатпуре Пандавы в изгнании: Юдхиштхире в Экачакре во сне Баларама открывает, что Экачакра — место Его игр, а в Навадвипе Кришна и Баладева обещают играть с ними в Кали-югу; пять баньянов и Юдхиштхира-веди; Пандавы уходят в Уткалу, где Бхима убивает ракшаса и остаётся Божество Мадхавы."
