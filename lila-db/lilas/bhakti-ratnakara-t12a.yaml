  summary: "Приближаясь, Шриниваса в слезах кланяется земле Навадвипы; автор по «Вишну-пуране», «Гаура-ганоддеша-дипике», «Бхагавате», «Чайтанья-бхагавате» и «Чайтанья-чарите» Мурари раскрывает смысл имени: девять островов (на востоке Ганги — Антардвипа, Симантадвипа, Годрумадвипа, Мадхьядвипа; на западе — Коладвипа, Ритудвипа, Джахнудвипа, Модадрумадвипа, Рудрадвипа) и девять видов бхакти; названия селений, как во Врадже при Ваджранабхе, со временем спутались; дхама вечна, то явлена, то сокрыта, сжимается и раскрывается, как лотос, и в ней втайне явлены лилы всех прежних воплощений."
