  period: P05
  order: 25.5
  title: "Старый брахман из Вайкунтхапура видит Гауру с Лакшми в великолепии Вайкунтхи"
  summary: "Старый учёный брахман, почитатель Лакшми-Нараяны, которого Валлабха Мишра чтил как гуру, был на свадьбе Лакшмиприи и, увидев Лакшми и Вишвамбхару, заплакал от блаженства; в своей ветхой хижине он молит Гаурачандру о милости, и в ней открывается великолепие Вайкунтхи: Гаура с Лакшми на драгоценном троне, затем Господь становится четырёхруким; Он называет брахмана Своим слугой из рождения в рождение, велит молчать и возлагает стопы ему на голову."
  persons: ["@ishana-navadvipa", "@mahaprabhu", "@lakshmipriya", "@vallabhacharya"]
  places: ["#navadvipa"]
  kind: vision
  authority: B
  notes: "Рассказ Ишаны; известно, по-видимому, только по БР."
  themes: [revelation, family]
  bhava: [aishvarya, shakti]
  event: ev-brahmana-sees-lakshmi-narayana-wedding
