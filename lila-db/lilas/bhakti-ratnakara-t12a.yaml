- id: brt-6017
  source: bhakti-ratnakara
  ref: "Таранга 12, 809–850"
  file: "bhakti-ratnakara/ru/12.md"
  period: P15
  order: 95.763
  title: "Суварна-вихара: царь видит во сне золотого Гауру; возвращение в Майяпур"
  summary: "Вайшнав, великая душа, рассказывает царю этих мест о золотом воплощении Кали и санкиртане в Навадвипе; царь раскаивается в поглощённости царскими делами, небесный голос обещает ему увидеть игры, и во сне он видит танец Вишвамбхары среди тысяч преданных; позже здесь Гаурахари танцевал с преданными, и люди дивились золотому сиянию — отсюда Суварна-вихара; Ишана с тремя спутниками возвращается в Майяпур, в дом Мишры."
  persons: ["@ishana-navadvipa", "@srinivasa-acharya", "@narottama-dasa", "@ramachandra-kaviraja", "@mahaprabhu"]
  places: ["#antardvipa", "#mayapur", "#house-jagannatha-mishra"]
