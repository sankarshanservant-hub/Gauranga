  summary: "Брахману-почитателю Кола-девы Господь является Варахой величиной с гору (отсюда Коладвипа, именуемая Парвата) и обещает, что он увидит Его игры в Навадвипе; брахман по шастрам понимает, что Он придёт в Кали золотистым; в Самудрагархи Океан говорит Ганге о будущих играх Гауры на её берегах, а Ганга скорбит, что Господь уйдёт в Нилачалу к Океану; при явлении Господа Океан, приходя по Ганге, видит Гаурахари на троне с Нитьянандой, Гададхарой и спутниками, — отсюда Самудра-гати."
