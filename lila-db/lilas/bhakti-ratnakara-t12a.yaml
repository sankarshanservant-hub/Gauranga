  title: "Рудрадвипа (Радупур), Бильвапакша (Белпаукхера), Бхарадваджа-тила"
  summary: "В Радупуре Рудра со спутниками ещё до рождения Господа танцует, воспевая Его, и Гаурасундара, явившись незримо для других, обнимает его; в Белпаукхере у Божества пятиликого Шивы брахманы-подвижники полмесяца поклонялись листьями бильвы, и Шива обещал, что они родятся в Надии, будут учиться у Господа и служить Ему (Бильвапакша); на холме у Чакды мудрец Бхарадваджа, покорив Гаурахари премой, получил Его даршан."
  persons: ["@ishana-navadvipa", "@srinivasa-acharya", "@shiva", "@bharadvaja-muni", "@mahaprabhu"]
  places: ["#rudradvipa"]
  kind: lila
