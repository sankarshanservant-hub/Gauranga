  title: "Майяпур — Йогапитха Навадвипы; старый брахман на дороге; Ишана в доме Мишры встречает Шринивасу"
  summary: "Майяпур, где родился Гаурачандра, — Йогапитха Навадвипы; по дороге старый брахман, только что видевший Ишану, рассказывает о его служении Шачи и любви к Нимаю, скорбит о запустении Надии и, узнав Шринивасу, обнимает его; в доме Джаганнатхи Мишры Ишана, плачущий в уединении с возгласами «Вишвамбхара!», обнимает Шринивасу, Нароттаму и Рамачандру; Шриниваса просит показать места Навадвипы, как Рагхава показал Врадж; Ишана обещает утром повести их и знакомит с любимыми спутниками Господа."
  persons: ["@srinivasa-acharya", "@narottama-dasa", "@ramachandra-kaviraja", "@ishana-navadvipa", "@shachi", "@mahaprabhu", "@raghava-gosvami-govardhana"]
