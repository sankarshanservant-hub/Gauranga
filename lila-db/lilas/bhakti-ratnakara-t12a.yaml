  persons: ["@ishana-navadvipa", "@srinivasa-acharya", "@rama", "@sita-devi", "@lakshmana", "@mahaprabhu"]
  places: ["#modadrumadvipa"]
  kind: lila
  authority: B
  notes: "Рассказ Ишаны о Рама-лиле, связанной с Гаурой; Рама — источник пророчества."
