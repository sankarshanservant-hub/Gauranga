  order: 107.8
  title: "Сон Шачи о четырёх мальчиках; Нитьянанда обедает в доме Господа, Ишана подаёт воду"
  summary: "Шачи рассказывает сон: пятилетние Гаура и Нитьянанда, ссорясь, вошли в святилище Вишну; там было четверо — Гаура, Нитьянанда, Кришна и сын Рохини; Нитьянанда взял за руку Кришну, Гаура — Балараму, вчетвером они вырывали друг у друга кушанья, и Нитьянанда попросил у неё риса; Господь велит накормить Нитьянанду; Ишана омывает Им стопы, Шачи созерцает тёмный и белый облики, Ишана собирает остатки с листьев."
  persons: ["@shachi", "@mahaprabhu", "@nityananda", "@krishna", "@balarama", "@gadadhara-pandita", "@ishana-navadvipa"]
  places: ["#house-jagannatha-mishra"]
  kind: lila
  authority: B
  notes: "Трапеза — также ev-nityananda-meal-shachi."
  divergence: "В ЧБ Мадхья 8 Божества Кришны и Баларамы гонят «самозванцев» и спорят с ними; в БР четверо вместе едят и ссорятся из-за кушаний, а Ишана сам служит трапезе."
  themes: ["revelation", "prasada"]
  bhava: ["balarama"]
