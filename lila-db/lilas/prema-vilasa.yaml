# Нитьянанда Дас, «Према-виласа» — лилы в порядке изложения (формат — ../README.md).
# Перевод — prema-vilasa/ru/01.md–23.md (виласы 1–23) и 25.md («Полувиласа»: письма и указатель); 24-я виласа
# (поздняя генеалогическая вставка) не переводилась. Метки стихов — **N.** (нумерация двустиший внутри виласы).
# Начальные «Слава…» и подпись автора («Тот, чья надежда — стопы Шри Джахнавы и Вирачандры…») с колофоном
# включены в первую и последнюю записи виласы (обращения автора о себе — отдельные записи kind: author).
# Книга — о следующем поколении (Шринивас Ачарья, Нароттама, Шьямананда, книги Госвами в Гауде, Джахнава):
# основная часть — P15 («после ухода»); лилы времени Махапрабху, пересказанные в поэме, привязаны к общим событиям.
# Рождение Шринивасы (виласы 1–2) по тексту происходит при жизни Господа — P14.
# Источник уровня C; виласы 21–23 и «Полувиласа» (поздние добавления к поэме: генеалогии, письма, указатель) — D.
# Датировки — только на записях и лишь там, где текст даёт опору. Записи добавлять в конец.

