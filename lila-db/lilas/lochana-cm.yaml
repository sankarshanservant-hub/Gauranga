  kind: lila
  authority: B
  parallels: ""
  notes: "«Васудева Гхош» — Васу Гхош. В изд. 1903 г. двустишие с перечнем Гададхары, Нарахари и др. дано как чтение одной рукописи."

- id: lcm-0163
  source: lochana-cm
  ref: "Мадхья-кханда, «Скорбь матери Шачи», 35–93"
