    - {file: "jayananda/ru/02-vasu-1897.md", from_text: "> В Нилачале, ночью, Чайтанья в обители ", to_text: "> были падения метеоров, удары молний, землетрясения."}
    - {file: "jayananda/ru/04-sarkar-1922.md", from_text: "**Последняя сцена** (перевод из «Чайтань", to_text: "Когда Он плясал на Биджае праздника коле"}

