# Джаянанда, «Чайтанья-мангала» (фрагменты и свидетельства) — лилы по порядку изложения поэмы (формат — ../README.md).
# Полного текста нет: записи собраны по кхандам поэмы (Ади, Надия, Вайрагья, Санньяса, Уткала, Пракаша, Тиртха, Виджая,
# Уттара); одна запись — один эпизод, отрезки — из всех файлов перевода (01 фрагменты, 02–04 статьи Васу и Саркара —
