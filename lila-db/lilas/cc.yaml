  notes: "Подробно — Антья 1. Ст. 63–65 — правило Господа ежедневно навещать Харидаса, Рупу и Санатану (они не входили в храм). Ст. 73: объятие с передачей сил — по-видимому, в Праяге (Мадхья 19)."
