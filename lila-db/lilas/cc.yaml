  summary: "Однажды после санкиртаны Господь, устав, сел и посадил во дворе косточку манго; она тотчас проросла, дерево выросло и на глазах у всех принесло множество спелых плодов. Господь велел сорвать около двухсот, омыл и поднёс Кришне. Плоды, красно-жёлтые, без косточки и кожуры, полные нектарного сока, — одного хватало, чтобы насытиться; Господь сначала вкусил Сам и накормил всех. Двенадцать месяцев дерево плодоносило каждый день, и после киртана Господь устраивал праздник манго; кроме преданных, об этих лилах никто не знал."
