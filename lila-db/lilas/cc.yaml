  summary: "Сначала последователи Ачарьи были единодушны, потом по воле судьбы разделились надвое: одни следуют велению Ачарьи, другие стали независимы и, подвластные судьбе, выдумали свои учения; мнение Ачарьи — суть, а нарушивший Его веление — пуст; называть пустых нет нужды — автор перечисляет всех вместе лишь затем, чтобы видна была разница: так рис сначала меряют с шелухой, а потом шелуху отвеивают."
