  period: P07
  order: 65
  title: "Толкование шлоки «харер нама»: в Кали Кришна нисходит как Имя; «тринад апи сунчена» — как повторять Имя"
  summary: "Шлока «Брихан-нарадия-пураны»: только имя Хари; в Кали нет иного пути. В Кали Кришна нисходит в образе Имени, и Имя освобождает весь мир. «Харер нама» сказано трижды для твёрдости, «эва» — чтобы вразумить непонятливых; «кевала» исключает знание, йогу, аскезу и прочие пути; кто думает иначе, не освободится. Как повторять Имя: смиреннее травы, терпеливее дерева (срубленное, оно молчит, засыхая, не просит воды), не ища почёта и почитая других; вайшнав ни у кого ничего не просит, живёт тем, что приходит само, и всегда доволен. Автор, воздев руки, призывает всех нанизать стих «тринад апи» на нить Имени и носить на шее — тогда непременно обретёшь стопы Кришны."
  persons: ["@mahaprabhu", "@krishnadasa-kaviraja"]
  places: ["#navadvipa"]
  kind: teaching
  authority: A
  notes: "Ст. 23 — у ВЧД роли «харер нама» и «эва» переставлены (исправлено со сноской). Ст. 26–30 — ср. Антья 20.22–26; ст. 31 — шлока из «Шикшаштаки» Господа."
  themes: [teaching]
  teaching: [holy-name, yuga-dharma, vaishnava]
  scriptures: ["Брихан-нарадия-пурана, 38.126", "Шикшаштака, 3"]
  cc: "Ади 17"
  divergence: "У Лочана Даса Господь толкует шлоку в бхаве Вепря в доме Шриваса; в ЧЧ эпизод отнесён к сутре после риса Шукламбары."
  event: ev-harer-nama-explained
