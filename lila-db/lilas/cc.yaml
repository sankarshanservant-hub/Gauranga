  period: P14
  order: 11.5
  title: "Рупа понимает шлоку Господа и пишет ответную на пальмовом листе; Господь находит её в кровле, шлепком и объятием одаряет Рупу милостью и велит Сварупе учить его сокровенной расе"
  summary: "Смысл шлоки знал лишь Сварупа, но в тот год в Пури был и Рупа: услышав её из уст Господа, он тут же сложил стих-разъяснение, записал его на пальмовом листе, засунул в кровлю своего жилища и ушёл омыться в море. Харидас Тхакур, Рупа и Санатана не входили в храм Джаганнатхи; Господь, увидев упала-бхогу, приходил к тому из троих, кто был на месте, и лишь потом шёл к Себе. В тот раз, взглянув вверх, Он нашёл лист со стихом и, прочитав, погрузился в экстаз; Рупа пал перед Ним, как палка; Господь шлёпнул его, обнял и спросил: «Никто не знает замысла Моего стиха — как ты узнал Мой ум?» Показав стих Сварупе, Он спросил и его; Сварупа ответил: «Раз он узнал Твой ум — значит, получил Твою милость». Господь сказал: «Довольный им, Я обнял его и передал ему все силы; он достоин постичь сокровенную расу — объясняй её и ты». Подробнее — в Антье."
  persons: ["@mahaprabhu", "@rupa-gosvami", "@svarupa-damodara", "@haridasa-thakura", "@sanatana-gosvami", "@jagannatha-deity"]
