  title: "Спор о коровах: Господь обличает убийство коров — корова мать, бык отец; Кази ссылается на Коран, Господь — на Веды: убивать можно, лишь умея оживить; Кази признаёт поражение"
  summary: "Господь спросил: «Ты пьёшь молоко коровы — она тебе мать; бык растит зерно — он отец; как же ты убиваешь и ешь их?» Кази ответил: «Как у Тебя Веды и Пураны, так у нас Коран; в нём путь правритти (мирской деятельности) и путь нивритти (отречения); на пути нивритти запрещено убивать живых существ, а на пути правритти есть предписание убивать коров, и по слову писания греха нет; в Твоих Ведах тоже говорится об убийстве коров». Господь возразил: «Веды запрещают убийство коров; убивать можно лишь того, кого можешь оживить: мудрецы убивали старую корову и ведическими мантрами возвращали ей молодость — это было благо, а не убийство; в Кали у брахманов нет такой силы, потому в Кали запрещены пять дел (шлока «Брахма-вайварта-пураны»). Вы не можете оживить — для вас это лишь убийство: убийца коровы гниёт в Раураве столько тысяч лет, сколько волос на теле коровы; составитель вашего писания ошибался». Кази онемел и, поразмыслив, признал: «Ты прав, пандит: наше писание недавнее, выдуманное, не выдерживает разбора, но ради общины я его принимаю». Господь, улыбаясь, задал второй вопрос: «В твоём городе всегда санкиртана — почему ты, Кази, её не запрещаешь?»"
