  title: "Сутры Шеша-лилы: Вриндаван Дас — Вьяса лил Чайтаньи; деление лил: Ади (24 года дома), санньяса в магху, Шеша — Мадхья (шесть лет странствий) и Антья (восемнадцать лет в Нилачале)"
  summary: "Сутры Ади-лилы, подробно описанной Вриндаваном Дасом, уже даны; теперь — главные сутры заключительных лил: описанное в «Чайтанья-мангале» подробно здесь будет дано кратко, а недосказанное там — подробно. Вриндаван Дас — Вьяса лил Чайтаньи; по его велению автор лишь доедает его остатки. Двадцать четыре года Господь жил дома — это Ади-лила; в конце двадцать четвёртого года, в светлую половину месяца магха, Он принял санньясу и ещё двадцать четыре года являл Шеша-лилу. Шеша-лила делится на Мадхью — шесть лет хождений между Нилачалой, Гаудой, Сетубандхой и Вриндаваном — и Антью. Восемнадцать лет Господь жил только в Нилачале, Своим примером уча бхакти; из них шесть лет — с преданными, утверждая према-бхакти в танце и пении."
