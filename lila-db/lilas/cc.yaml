- id: cc-0303
  source: cc
  ref: "Мадхья 1.76–84"
  file: "chaitanya-charitamrita/ed/vcd/CC_Madhya01.md"
  period: P14
  order: 11.51
  title: "Шлока Рупы «прийах со ’йам» и её смысл: Радха на Курукшетре тоскует по Кришне-пастушку во Вриндаване; гопи у Бхагаватам и «Лалита-мадхавы»"
  summary: "Шлока Рупы («Падьявали», 387): «Подруга, это тот же дорогой Кришна, встреченный на Курукшетре, и Я та же Радха, и то же счастье встречи — но Мой ум стремится к лесу на берегу Калинди, где звучит пятая нота Его флейты». Смысл: видя Джаганнатху, Господь чувствует как Радхика, обретшая на Курукшетре даршан Кришны: царские одежды, слоны, кони, толпы — где Его наряд пастушка, где уединённый Вриндаван? Лишь там, с тем Кришной и в том чувстве, исполнится желание. Так и гопи говорят в «Бхагаватам» (10.82.48): «Пусть Твои лотосные стопы, которые созерцают йоги, взойдут и в наших умах, хоть мы и привязаны к дому» — то есть «пусть Твои стопы явятся в Моём доме во Врадже». Обдумав смысл этого стиха, Рупа сложил свой, понятный людям; и в «Лалита-мадхаве» (10.38) гопи зовут Кришну играть на флейте в благословенной земле Матхуры."
  persons: ["@mahaprabhu", "@rupa-gosvami", "@radha", "@krishna", "@jagannatha-deity"]
  places: ["#puri", "#vrindavana"]
  kind: teaching
  authority: A
