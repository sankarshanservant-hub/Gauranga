  summary: "Вайшнавы Вриндавана жаждут услышать о последних лилах; во Вриндаване под древом желаний — золотой храм, маха-йогапитха и трон, где восседает Говинда-дева — Сам трансцендентный Мадана; там тысячи слуг совершают царское служение, управитель которого — Харидас Пандит, ученик Ананты Ачарьи (ученика Гададхары Пандита), украшенный пятьюдесятью качествами Кришны (Бхаг. 5.18.12), всегда слушающий «Чайтанья-мангалу»; он по милости велел автору описать последние лилы Гауранги; того же пожелали Говинда Госани (ученик Кашишвары), Ядавачарья, спутник Рупы, Бхугарбха (ученик Гададхары) и его ученики Чайтанья дас, Мукундананда Чакраварти и Кришнадас, Шивананда Чакраварти (ученик Ачарьи Госани) и другие; по их слову автор пишет, отбросив стыд."
