  order: 85
  title: "Всеведущий астролог: на вопрос о прежнем рождении он видит в медитации Высшую Истину; Господь смеётся: «Я был пастушком»"
  summary: "Пришёл всеведущий астролог; Господь почтил его и попросил вычислить, кем Он был в прошлом рождении. В медитации астролог увидел сияющий облик — прибежище бесчисленных Вайкунтх и вселенных, Высшую Истину, Парабрахмана, Верховного Владыку — и онемел; на повторный вопрос сказал: «Ты был Высшим Прибежищем, Бхагаваном, полным всех достояний, и ныне Ты тот же; Твоя суть — непостижимое вечное блаженство». Господь, смеясь, ответил: «Ты ничего не понял: Я был пастухом, пас коров и за это благочестие стал сыном брахмана». Астролог сказал: «Это я и видел — и, увидев величие, растерялся; тот облик и этот для меня едины, а если вижу различие — это Твоя майя. Кем бы Ты ни был, кланяюсь Тебе». Господь наградил его премой."
  persons: ["@mahaprabhu"]
  places: ["#navadvipa"]
  kind: lila
  authority: A
  notes: "Ст. 104 — по изданию ГМ иной порядок слов (сверено). Ст. 113 «Твоя майя» — сила Самого Господа, скрывающая от смотрящего тождество обликов (не власть майи над Господом)."
  themes: [revelation, mercy]
  bhava: [aishvarya, krishna]
