- id: cc-0254
  source: cc
  ref: "Ади 17.34–54"
  file: "chaitanya-charitamrita/ed/vcd/CC_Adi17.md"
  period: P07
  order: 129
  title: "Год ночного киртана у Шривасы за закрытыми дверями; Гопала Чапала подбрасывает предметы пуджи Бхавани и вино, поражён проказой, и Господь отказывается спасти его"
  summary: "Целый год Господь ночами пел санкиртану в доме Шривасы, закрыв двери; пашанди приходили насмехаться и, не попав внутрь, горели завистью. Брахман Гопала Чапала, глава пашанди, ночью положил у дверей Шривасы всё для поклонения Бхавани — цветы, куркуму, киноварь, красный сандал, рис — и кувшин вина. Утром Шриваса, смеясь, позвал почтенных людей: «Каждую ночь я почитаю Бхавани — смотрите, каково моё величие!»; те ужаснулись, велели убрать всё и очистить место. Через три дня Гопала Чапала заболел проказой: тело покрылось язвами и червями. Сидя под деревом у Ганги, он попросил Господа как «племянника по деревне» спасти его; Господь в гневе ответил: «Ненавистник преданных, Я не спасу тебя: десять миллионов рождений тебя будут есть черви и ты будешь падать в ад Раурава за то, что выставил Шривасу почитателем Бхавани. Я пришёл истребить пашанди и распространить бхакти». Грешник продолжал мучиться, но не умирал."
  persons: ["@mahaprabhu", "@srivasa", "@gopala-chapala"]
  places: ["#house-srivasa", "#ganga", "#navadvipa"]
  kind: lila
  authority: A
  notes: "Имя в оригинале — «гопала чапала» (у ВЧД «Чапал Гопал»; в переводе исправлено)."
  themes: [offense, kirtan]
  teaching: [vaishnava]
  cc: "Ади 17"
  divergence: "В ЧЧ прокажённый — Гопала Чапала, прощён лишь после санньясы в Кулии (ст. 55–59); у Мурари и Карнапуры Господь отказывает безымянному прокажённому, у Лочана Даса Шриваса прощает его сразу и тот исцеляется; у Джаянанды прокажённый отослан к Шривасе в Шантипуре после санньясы."
  event: ev-leper-shrivasa-offense
  verses:
    - {file: "chaitanya-charitamrita/ed/vcd/CC_Adi17.md", from: "34", to: "54"}

