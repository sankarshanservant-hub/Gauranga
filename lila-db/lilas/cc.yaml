  title: "Рассказ Кази: человек-лев с когтями на его груди; обожжённые стражники; мусульмане невольно повторяют «Хари» и «Кришна»; жалоба пашанди на Нимая; «Ты — Нараяна»"
  summary: "Кази назвал Господа Гаурахари и, по Его слову, говорил при близких Ему: в ночь после того, как он разбил мриданг, к нему явился страшный лев с телом человека и львиной головой, вскочил ему на грудь, вонзил когти: «Я разорву твою грудь за мриданг — ты запретил Мой киртан!»; затем смилостивился: «Я лишь проучил тебя; если повторишь — уничтожу тебя с родом и яванов». Кази показал следы когтей. Стражникам, ходившим запрещать киртан, огонь опалил бороды и лица; с тех пор Кази киртан не запрещает. Мусульмане жаловались, что повсюду «Хари! Хари!» и что падишах накажет Кази; а на вопрос, почему они сами твердят имена индусского Бога, двое признались: насмехаясь над индусами, они стали невольно повторять «Хари» и «Кришна». Пришли пять-семь индусов-пашанди: «Нимай после Гаи разрушил дхарму: громкий киртан, не дающий спать, низкие возвышаются, великая мантра теряет силу, если её слышат все; изгони Его». Кази пообещал им запретить, но заключил: «Высший Бог индусов — Нараяна, и я думаю, что это Ты»."
