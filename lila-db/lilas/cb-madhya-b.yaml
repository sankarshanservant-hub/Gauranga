  summary: "Одевшись, Господь погружается в настроение Рукмини, считает Себя царевной Видарбхи и, плача, пишет на полу пальцем слезами письмо — семь шлок «Бхагаваты»: услышав о Кришне, она избавилась от страданий и, утратив стыд, пленилась Им; без Него учёность, род и богатство бессмысленны; пусть Он похитит её, не допустит, чтобы её взял Шишупала, и не убивает её родных; «Брахман, скорей передай Кришне моё желание»; вайшнавы плачут и улыбаются от любви."
  persons: ["@mahaprabhu", "@rukmini", "@krishna", "@haridasa-thakura", "@srivasa"]
