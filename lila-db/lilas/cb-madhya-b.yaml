- id: cb-2018
  source: cb
  ref: "Мадхья 18, 163–208"
  file: "chaitanya-bhagavata/ed/CB_Madhya18.md"
  period: P07
  order: 135
  title: "Господь на троне в настроении Маха-Лакшми; молитвы Матери вселенной; Господь кормит преданных грудным молоком"
  summary: "Посадив на колени Божество Гопинатхи, Господь в настроении Маха-Лакшми садится на трон и велит возносить Ему молитвы; преданные славят Его как Мать вселенной — Лакшми в домах преданных, вера вайшнавов, — и молят о прибежище; на рассвете танец кончается, и преданные и женщины рыдают, как от потери миллионов сыновей; сжалившись, Господь в материнской любви кормит каждого грудным молоком, подтверждая слова Гиты «Я — отец и мать этого мира», и их боль разлуки утихает."
  persons: ["@mahaprabhu", "@shachi", "@chandrashekhara-acharya"]
  places: ["#house-chandrashekhara"]
  kind: lila
  authority: A
  notes: "Ст. 166–182: часть преданных славит Его как Лакшми, часть — как Дургу/Махамайю (молитвы в материнском настроении Господа); по ЧБ все эти облики — проявления Самого Господа (ст. 204, 211–214), а не самостоятельные божества. Ст. 172–176 в издании пропущены."
  themes: [revelation, ecstasy, separation]
