  summary: "Через три часа киртана выходит Гададхара с Брахманандой в роли старой подруги Супрабхи: «Идём в Матхуру»; Харидас, Шриваса и Гангадас шутливо расспрашивают их о мужьях и ночлеге, а Адвайта укоряет: «Чужих жён почитают как мать; потанцуйте — Мой Господь любит танцы»; Гададхара пляшет в облике богини удачи, и река его слёз радует Землю; Господь говорит: «На Вайкунтхе Гададхара — Моя жена»."
