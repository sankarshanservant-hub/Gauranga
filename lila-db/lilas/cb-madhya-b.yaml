  period: P07
  order: 134.99
  title: "Господь выходит в облике высшей Богини; Нитьянанда-«бабушка» падает в экстазе"
  summary: "Господь выходит в облике Богини, а напротив — Нитьянанда в роли старой бабушки; никто, даже Шачи, не узнаёт Его: Камала ли это, Джанаки, Парвати или жемчужина Вриндавана? — лишь вайшнавы по Его благословению не смущены и видят в Нём мать; по словам «Брахман, идёт ли Кришна?» понимают, что Он — царевна Видарбхи, по словам «Бабушка, пойдём во Вриндаван» — девушка Гокулы; слёзы, смех и покачивания являют Гангу, Махачанди, Ревати; Он танцует за всех Своих жён, уча не хулить Его энергии; Нитьянанда теряет сознание, все плачут."
