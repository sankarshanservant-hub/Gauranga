  summary: "Джива ведёт Нароттаму к Гопале Бхатте (шлока о нём) и Радха-рамане, объясняет, что Говинда, Гопинатха и Мадана-мохан вместе являют лицо, грудь и стопы; Мадху Пандит у Гопинатхи, Бхугарбха, Радха-Дамодара и самадхи Рупы (Нароттама без чувств), арати Говинды, Мадана-мохан и Кришнадас Брахмачари, самадхи Санатаны; на Радха-кунде Рагхунатха Дас, на Говардхане Рагхава Пандит."
