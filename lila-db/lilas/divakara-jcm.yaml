  summary: "Джаганнатха Дас каждый день лично служит Махапрабху: умывание, зубная палочка, омовение, одежда, чистка посоха и камандалу. Прабху просит рассказать о его прежнем облике; тот описывает Вайкунтху-лотос, где Кришна в объятии Радхи: из смеха Кришны явился Чайтанья, из смеха Радхи — он сам, и оба посланы на землю. Прабху снимает Своё покрывало, повязывает ему на голову и называет его Атибадой; так его зовёт весь мир, а бенгальские вайшнавы печалятся и идут жаловаться Прабху."
