  summary: "На Вайкунтхе Радха и Кришна восседают на одном сиденье в единой бхаве; глядя на лицо Радхи, Кришна смеётся — из этого смеха является Чайтанья; Радха смеётся, глядя на Кришну, — из Её смеха рождается Ати Бада Джаганнатха; вечный Господь говорит: «Мы оба явимся в мире смертных», и велит Чайтанье с двенадцатью сакхи явиться в Надии и вести киртан имени Хари."
