  title: "Учение о дикше и гуру: кто может и кто не может быть гуру"
  summary: "Плоды посвящения (шлоки о дикше, уничтожающей великие грехи); не-вайшнав не может быть гуру, сколь бы знатен и учён он ни был; посвящённый от брахмана, кшатрия, вайшьи или шудры идёт в разные миры, а от вайшнава обретает всё; длинный перечень телесных и нравственных изъянов, при которых нельзя принимать Имя от гуру; кто поклоняется Хари и знает прему Кишори и Кишоры — годен в гуру для всех варн, будь то шудра или женщина. Джаганнатха Дас просит у Прабху Имя; Прабху велит Матте Балараме посвятить его («Харер нама…»)."
  persons: ["@jagannatha-dasa-odia", "@mahaprabhu", "@balarama-dasa-odia", "@divakara-dasa"]
