  summary: "Придя в Пурушоттаму, Махапрабху слышит, как Джаганнатха Дас излагает Десятую песнь «Бхагаваты» перед Ганешей у баньяна; два с половиной дня оба в узах премы; Прабху говорит: «Ты не отличен от Шри Мурти». Бенгальские вайшнавы ропщут: Он сблизился с орийским брахманом, а уткальские брахманы не получили посвящения и к ним нельзя прикасаться; Прабху отвечает шлокой: «невежда или учёный — брахман есть Моё тело». Джаганнатха Дас приходит в матх с абхадой и признаётся, что не имеет дикши; шлоки о силе дикши."
