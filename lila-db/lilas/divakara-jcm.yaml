  summary: "Вайшнавы зовут Прабху в Гауду и по тиртхам; Он отвечает шлокой и словами: «Мой ум и разум ищут прибежища у Джаганнатхи», и они уходят в Бана-Вишнупур, где ставят матх. Через год Мадхо Дас передаёт: пусть Он идёт по тиртхам, ведь Он стал соблюдать орийские обычаи; Прабху шлёт письмо: Я видел Каши, Матхуру, Вриндаван, Двараку, Айодхью и Бадарику, но Джаганнатха в Нилачале чарует мир — здесь Я и останусь. Вайшнавы решают уйти во Вриндаван и меняют обычаи Пурушоттамы: вместо «Харе Рама Кришна» говорят «Харе Кришна Рама», вместо нирмальи почитают пыль Вриндавана."
