  title: "Подрастающий мальчик: начало учёбы, экадаши Джагадиши и Хираньи, проделки на гхатах"
  summary: "Начало учёбы. Прокалывание ушей. Пострижение. Изучение азбуки. Странные мальчишеские требования. Нимай съел подношения, приготовленные для Вишну в день экадаши Джагадишей и Хираньей Пандитами. Господа могут узнать только Его слуги. Нимай был вожаком всех буйных брахманских мальчишек. Его озорные проделки на гхатах Ганги, где совершают омовение. Подражание этим деяниям со стороны современных лжевоплощений. Сверхъестественные переживания Шачи и Мишры."
