- id: sn-0017
  source: sanyal
  ref: "Т. II, гл. 18"
  file: "sanyal/ru/II-18.md"
  period: P05
  order: 17
  title: "Значение учёных побед: критика шлоки Кешавы, учёность и Истина"
  summary: "Шри Чайтанья подвергает критике текст шлоки Кешавы Бхатты. Богиня мирской учёности всегда вводит в заблуждение своих почитателей. Шри Джива Госвами — не эмпирический полемист. Бедственное положение Кешавы Бхатты. Истинное средство от истинных страданий. Причина и природа избавления Кешавы Бхатты. Эмпирическое знание не даёт обладания силой. Эмпирическое знание становится излишним по достижении духовного просветления. Познать Истину возможно. Нетрансцендентное знание подчинено трансцендентному. Стремление знать тождественно стремлению служить Абсолюту. Как возникает склонность служить Истине. Потрясение духовного пробуждения. Лицезрение Господа. Назначение эмпирической учёности. Предание себя Божественной Личности. Личность и Истина. Трансцендентная личность преданного. Кешаву Бхатту не следует смешивать с Кешавой Кашмири. «Крама-дипика». Отличительная черта слуг Шри Гаурасундары. Почему достижения этого мира преходящи. Злоупотребление эмпирическим знанием усиливает отвращение к Истине. Надменность преданного Господа — совершенство смирения."
  persons: ["@mahaprabhu", "@keshava-kashmiri"]
  places: ["#navadvipa"]
  kind: teaching
  authority: C
  parallels: "ЧБ Ади; ЧЧ Ади 16"
  notes: "Пересказ по ЧБ и ЧЧ с богословским толкованием в духе Шрилы Бхактисиддханты Сарасвати."
