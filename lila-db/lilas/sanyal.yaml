  summary: "Новый метод преподавания. Природа Его учёности, отличной от ущербного интеллектуализма. Пандиты Навадвипы не сумели постичь Истину. Личное посредничество учителя. Нимай Пандит обличает софизмы пандитов Навадвипы. Спор с Кешавой Бхаттой, «покорителем всех сторон света» (*дигвиджаи*). Избавление Кешавы Бхатты. Всеобщее признание учёности Господа."
