- id: sn-0006
  source: sanyal
  ref: "Т. II, гл. 7"
  file: "sanyal/ru/II-07.md"
  period: P04
  order: 6
  title: "Вишварупа и его санньяса; упанаяна; школа Гангадаса; уход Мишры"
  summary: "Нимай заставляет Свою мать пообещать соблюдать пост экадаши. Его буйство всё возрастает. Он боится только Вишварупы, Своего старшего брата. Рассказ о Вишварупе. Притягательность Нимая. Вишварупа отрекается от мира. Адвайта возвещает преданным о несомненном Пришествии Кришны в скором времени. Дитя Нимай являет Себя преданным в ответ на заверение Адвайты. Нимай становится прилежнее в учёбе. Запрет на Его учёбу снят. Принцип, лежащий в основе обрядовой чистоты и нечистоты. Его посвящение священным шнуром. Шри Вамана и царь Бали. Нимая принимают в *чатушпатхи* Шри Гангадаса Пандита. Его отношения с товарищами по учёбе. *Типпани* Нимая к сутрам «Калапа-вьякараны». Мишра видит во сне санньясу Нимая. Уход Мишры."
  persons: ["@mahaprabhu", "@vishvarupa", "@advaita", "@gangadasa-pandita", "@jagannatha-mishra", "@shachi"]
  places: ["#navadvipa"]
