  title: "Нимай Пандит открывает школу; женитьба на Лакшми-деви"
  summary: "Нимай Пандит открывает Свою собственную школу в чанди-мандапе Мукунды-Санджаи. Он сожалеет о неверном толковании шастр эмпирическими учителями Навадвипы. Встреча со Шри Лакшми-деви. Природа брака Бога. Сватом выступает Ванамали Ачарья. Свадебные обряды. Шачи-деви постигает Божественную природу Невесты. Превратные представления о женитьбе Нимая Пандита."
