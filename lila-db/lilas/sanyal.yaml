  summary: "Адвайта призывает Явление Шри Кришны. Явление Господа предвозвещено в Писаниях. Описание Божественного Рождения. Старшие приветствуют Явление Господа. Духовная природа этого события. Явление Господа было встречено воспеванием Хари. Составление гороскопа Божественного Младенца. Шачи-деви поклоняется Ганге и богине Шаштхи. Природа родительской привязанности Джаганнатхи Мишры и Шачи-деви. Аватара (нисхождение) не означает «воплощение»."
