- id: sn-0014
  source: sanyal
  ref: "Т. II, гл. 15"
  file: "sanyal/ru/II-15.md"
  period: P05
  order: 14
  title: "Тилака учеников; женитьба на Шри Вишнуприе-деви"
  summary: "Нанесение знака тилаки на лоб обязательно для Его учеников. Различие между трипундрой и урдхва-пундрой. Является ли знак тилаки «символом»? Нимай Пандит избегает общества женщин. Этим пренебрегает лжесекта гаура-нагари. Писания осуждают половое влечение. Духовная любовь и плотское вожделение. Обвинение в том, что Шри Чайтанья был не в здравом уме. Вторая женитьба Господа. Таинство брака. Поведение Шри Чайтаньи тождественно лиле Шри Кришны и вместе с тем отлично от неё. Шри Чайтанья принимает на Себя роль Шри Радхики. Сватом выступает Кашинатха Пандит. Обряд *адхиваса*."
  persons: ["@mahaprabhu", "@vishnupriya", "@shachi"]
  places: ["#navadvipa"]
