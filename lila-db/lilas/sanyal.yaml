- id: sn-0019
  source: sanyal
  ref: "Т. II, гл. 20"
  file: "sanyal/ru/II-20.md"
  period: PX
  order: 19
  title: "Тхакур Харидас в Фулии, у Адвайты; десять оскорблений Имени; гонения"
  summary: "Тхакур Харидас переселяется в Фулию и встречается с Адвайтой Ачарьей. Воспевание Имени тождественно любовной преданности Враджи. Десять оскорблений Имени. Жизнь Тхакура Харидаса в Фулии совершенно отлична от практики *пракрита-сахаджиев* (филантропов). Удовлетворяет ли учение Тхакура Харидаса потребности нашей мирской жизни, или им следует восхищаться издали, подобно монизму? Истинный смысл жизни Шри Чайтаньи можно постичь, следуя учению Тхакура Харидаса. Тхакур Харидас — то же, что Брахма. Воспевание Имени соответствует современным условиям. Постижение приходит постепенно. Как не попасть в когти лжесадху. Кази настраивает мусульманского наместника против Тхакура Харидаса. Совет Тхакура Харидаса узникам. Нуждается ли воспевающий Имя в так называемых «предметах первой необходимости»? Наместник приказывает избивать Тхакура Харидаса, пока тот не испустит дух. Не следует неверно понимать форму диалога, используемую в трансцендентных повествованиях. Принцип религиозной терпимости легко понять превратно. Почему преследование Тхакура Харидаса невозможно оправдать. Неуязвимость Тхакура Харидаса для телесной боли и увечий."
  persons: ["@haridasa-thakura", "@advaita"]
  places: ["#phulia", "#shantipura"]
  kind: lila
  authority: C
  parallels: "ЧБ Ади; ЧЧ Ади 16"
  notes: "Пересказ по ЧБ и ЧЧ с богословским толкованием в духе Шрилы Бхактисиддханты Сарасвати."
