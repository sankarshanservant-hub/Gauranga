  title: "Ранняя юность: золото для семьи, ученик Гангадаса, Мурари Гупта"
  summary: "Любовь Шачи-деви к Нимаю. Своенравное поведение Нимая по отношению к Шачи-деви. Нимай необъяснимым образом добывает для семьи золото. Вайшнавизм — не сентиментализм. Жизни и деяниям Шри Чайтаньи нужно следовать, а не подражать. Прекрасный облик Нимая-ученика. Ученики Гангадаса Пандита почитают Его. Повседневные занятия в школе Гангадаса Пандита. Мурари Гупта. Нимай выступает против способа обучения, принятого в школах Навадвипы."
