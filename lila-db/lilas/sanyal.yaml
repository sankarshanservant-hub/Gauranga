  title: "Детство: Нимай пляшет при Имени, воры, следы Вишну, брахман-паломник и облик Гопалы"
  summary: "Дитя Нимай пляшет, когда женщины воспевают Хари. Он выпрашивает у прохожих фрукты и сладости и отдаёт их в награду этим женщинам. Его безудержные набеги на соседские дома. Чрезвычайно шаловливое Дитя. Мальчика застают за поеданием сырой земли, которую Он предпочитает жареному рису и сладостям. Дитя похищают двое воров. Родители видят в комнате Ребёнка отпечатки стоп Вишну. Нимай съедает пищу, которую паломник-брахман приготовил для подношения Божественному Пастушку, и являет ему Свой Божественный облик Гопалы."
