- id: sn-0012
  source: sanyal
  ref: "Т. II, гл. 13"
  file: "sanyal/ru/II-13.md"
  period: P05
  order: 12
  title: "Идеальный домохозяин; уход Лакшми-деви"
  summary: "Гостеприимство к случайным гостям. Благотворительность и щедрое гостеприимство к случайным гостям — главные обязанности всякого домохозяина. Принцип, лежащий в основе этого предписания. Забота о бедных. Отношение домохозяина к санньяси. Особая природа благотворительности Шри Гаурасундары. Обязанности вайшнава-домохозяина. Лакшми-деви готовит пищу для семьи. Описание её домашних обязанностей. Положение жены в доме мужа. Личное служение Богу. Исполнение домашних обязанностей ради удовольствия Верховного Господа. Чёрная работа и личное подчинение. Желание чувственных наслаждений — коренная причина всех мирских бед. Филантропы грубо искажают отношения Шри Лакшми-деви к Шри Гаурасундаре. Путешествие Господа в Восточную Бенгалию. Шри Гаурасундара учит брахманов Восточной Бенгалии. Плоды Его посещения. Тхакур Вриндаван Дас осуждает тех, кто притязает на роль спасителя. Нравственное поведение обязательно для всех. Нравственная жизнь — не цель человеческой деятельности. Уход Шри Лакшми-деви. Личность Шри Лакшми-деви."
  persons: ["@mahaprabhu", "@lakshmipriya", "@shachi"]
  places: ["#navadvipa"]
  kind: lila
  authority: C
  parallels: "ЧБ Ади; ЧЧ Ади 16"
  notes: "Пересказ по ЧБ и ЧЧ с богословским толкованием в духе Шрилы Бхактисиддханты Сарасвати."
  themes: [family, teaching]
