- id: sn-0011
  source: sanyal
  ref: "Т. II, гл. 12"
  file: "sanyal/ru/II-12.md"
  period: P05
  order: 11
  title: "На улицах Навадвипы: посещения горожан, предсказатель, беседа со Шридхарой"
  summary: "Посещения горожан после полудня. В доме ткача. В квартале молочников. В домах торговца благовониями, плетельщика гирлянд, продавца бетеля, торговца раковинами. В доме предсказателя, который вычисляет Его прежние рождения. Прозрение предсказателя. Беседа Господа со Шридхарой. Цель этих посещений. Философия Шридхары. Законное ли занятие для брахманов — жить подаянием? Одобрял ли Шри Гаурасундара торговлю продавца бетеля? Вечно свободное состояние души. Шачи слышит звуки Божественной флейты, и ей открывается видение нескончаемых Божественных проявлений. Природа служения Шри Шачи-деви. Надменность Шри Гаурасундары. Шри Гаурасундара не предавался любовным играм с вымышленными возлюбленными. Дживам не следует подражать поведению Кришны. Милость Шри Гаурасундары. Шриваса Пандит не одобряет надменности Шри Гаурасундары. Служение в благоговении и служение в доверительной близости."
  persons: ["@mahaprabhu", "@shridhara"]
  places: ["#navadvipa"]
  kind: lila
  authority: C
  parallels: "ЧБ Ади; ЧЧ Ади 16"
  notes: "Пересказ по ЧБ и ЧЧ с богословским толкованием в духе Шрилы Бхактисиддханты Сарасвати."
