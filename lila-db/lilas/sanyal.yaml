- id: sn-0013
  source: sanyal
  ref: "Т. II, гл. 14"
  file: "sanyal/ru/II-14.md"
  period: P05
  order: 13
  title: "Тапана Мишра; возвращение из Восточной Бенгалии"
  summary: "Нимай Пандит принимает подарки от Своих учеников. Торговля религиозным учением запрещена. Тапана Мишра спрашивает об истинной природе цели и метода духовной практики. Сон Тапаны Мишры. Господь открывает Тапане Мишре Божественное установление для века Кали. Махамантра. Замечания о символе веры. Превратные толкования. Простейший из возможных символов веры. Разумна ли вера в символ веры? Махамантра — не магическая формула. Природа духовного просветления. Возвращение Нимая Пандита из Восточной Бенгалии. Он узнаёт об уходе Шри Лакшми-деви. Нимай Пандит утешает Свою мать. Духовное поведение и мирские нужды. Скорбь Шри Гаурасундары."
