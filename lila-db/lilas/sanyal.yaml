  title: "Младенчество: имя Вишвамбхара, испытание склонностей, младенец на змее"
  summary: "За Младенцем ухаживали все женщины по соседству, которые постоянно пели Имя Хари, чтобы унять Его плач. Каждый день происходили необычайные и забавные случаи. Наречение Младенца. Значение имени «Вишвамбхара». Обычай испытывать склонности новорождённого воплощает принцип, лежащий в основе института варнашрамы. Деяния Младенца Нимая очень ценят преданные. Младенец хватает ядовитую змею и покоится на её кольцах. Деяния Шри Чайтаньи — не проявления йогических сил."
