  title: "Годы учительства: Мукунда, Гададхара, встреча с Ишварой Пури, диспуты"
  summary: "Профессором Нимаем восхищались все, кроме вайшнавов. Мукунда Датта. Распространённое мнение о киртане как способе поклонения. Нимай Пандит знакомится со Шри Ишварой Пури. «Шри Кришна-лиламрита». Любовная преданность Шри Ишвары Пури Кришне. Споры Нимая Пандита с Мукундой Даттой и Гададхарой. Логические загадки Нимая Пандита. Прогуливается по улицам Навадвипы в окружении Своих учеников, вызывая всех на публичный диспут на любую тему. Беседы с учениками на берегу Ганги."
