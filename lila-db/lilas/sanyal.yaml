  summary: "Соответствие между лилами Шри Кришны и Шри Кришны Чайтаньи. Родственники, спутники и слуги Господа составляют вечное Божественное окружение. Шри Джаганнатха Мишра; Шри Нитьянанда; Шри Тхакур Харидас; Шри Адвайта Ачарья; Шри Мадхавендра Пури; Шри Ишвара Пури. Смысл имени «Шри Кришна Чайтанья»."
