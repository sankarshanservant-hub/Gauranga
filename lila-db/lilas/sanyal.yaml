- id: sn-0018
  source: sanyal
  ref: "Т. II, гл. 19"
  file: "sanyal/ru/II-19.md"
  period: PX
  order: 18
  title: "Тхакур Харидас до встречи с Господом: посланник Святого Имени"
  summary: "Тхакур Харидас — уполномоченный Божественный посланник для распространения воспевания Святого Имени — нового установления для этой эпохи. Рождён в мусульманской семье. Обращение блудницы. Объяснение того, как воспевание Имени исправляет грешников. Это не слепая вера. Чувственность препятствует вере. Условная и подлинная нравственность. «Реформаторы» часто превратно понимают Писания. Обучение шастрам — обязанность брахманов. Новизна нового поклонения вызывает негодование индусов. Эмпиризм не может последовательно возражать против воспевания Имени. Единственная функция души. Тхакур Харидас — подлинный брахман. Рагхунатха Дас Госвами, тогда ещё мальчик, встречается с Тхакуром Харидасом и получает его милость. Гопала Чакраварти выступает против изложенного Тхакуром Харидасом учения о воспевании Имени, считая, что оно противоречит принципам монистического толкования веданты. Преданность, деятельность и знание. Пессимизм и оптимизм в противоположность абсолютизму. Истина — не то безличное, которое составляет предел всякого рационального рассуждения [?]. Подчинение «не-Богу». Трансцендентный Звук. Грубость идеала освобождения. Наслаждение и любовь. Общение с садху благотворно для детей."
  persons: ["@haridasa-thakura"]
  places: ["#benapola"]
  kind: lila
  authority: C
  parallels: "ЧБ Ади; ЧЧ Ади 16"
  notes: "Пересказ по ЧБ и ЧЧ с богословским толкованием в духе Шрилы Бхактисиддханты Сарасвати."
