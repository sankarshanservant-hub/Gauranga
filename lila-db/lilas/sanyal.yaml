  title: "Нераспознанное проявление: Божественные состояния под видом «нервного недуга»"
  summary: "Проявление Себя как Бога под видом нервного недуга. Причины превратного понимания духовного проявления. Не противоречит ли такое проявление Его роли преданного? Полное понимание этого предмета невозможно иначе как по милости духовного учителя. Особое затруднение, стоящее перед врачами, которые верят в медицинскую науку. Взгляд на религию как на отдельную область. Истинная природа духовной деятельности."
