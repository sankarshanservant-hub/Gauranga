  summary: "Нароттама садится под необыкновенной ашваттхой, тень которой возвращает ему самообладание; старый брахман, каждый день приходящий к этому месту игр Нимая, узнаёт в нём того, кому Нимай даровал милость, и рассказывает: после санньясы и сокрытия Господа в Нилачале, после ухода Шриваса, Вишнуприи и других Надия погружается во тьму; сам он, увлечённый логикой, не распознал в Нимае Нараяну; под этим деревом Нимай занимался шастрами среди учеников, и однажды брахман вновь увидел Его здесь среди тысяч учеников — с тех пор приходит каждый день; он благословляет Нароттаму на бхакти и посылает в Майяпур, к дому Джаганнатхи Мишры."
  persons: ["@narottama-dasa", "@mahaprabhu", "@vishnupriya", "@srivasa", "@keshava-bharati"]
  places: ["#navadvipa", "#mayapur"]
  kind: vision
  authority: B
  notes: "Брахман по имени не назван. Вишнуприя, по его словам, сокрылась «совсем недавно»."
