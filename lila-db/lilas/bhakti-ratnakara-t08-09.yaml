  summary: "Слепой бродит в толпе, услышав, что танцует сын Нитьянанды; узнав имя Вирабхадры, толкует его: «вира» — уничтожение злых, «бхадра» — уничтожение неблагого — и в слезах просит милости; Вирабхадра, узнав, взглядывает на него с состраданием — слепой прозревает и свободно смотрит на его танец; мир наполняется кличем «Джая!»"
