  summary: "После ухода Нароттамы Рагхунандана приходит в Яджиграм и устраивает свадьбу: Гопала Чакраварти (Гопала Дас) рад отдать дочь Шринивасе; в 3-й день тёмной половины вайшакхи свадьба; дочь, прежде Драупади, во время свадьбы получает имя Ишвари и посвящение от Ачарьи; Гопала и его сыновья Шьямадас и Рамачандра (Шьямананда и Рамачаран) становятся учениками Ачарьи; Нарахари Саркар и Дас Гададхара радуются."
