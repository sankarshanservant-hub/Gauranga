  parallels: "«Анурага-валли» 6 (anv-0040); «Према-виласа» 16–17 (pvl-0114, pvl-0121); «Нароттама-виласа» 6 (nvl-0038)"
  divergence: "В «Анурага-валли» и «Нароттама-виласе» женитьбы требует Нарахари Саркар, здесь её устраивает Рагхунандана; в «Према-виласе» две женитьбы (дочь Гопалы Даса и Падмавати, дочь Рагху Чакраварти) и весть приносит Гопале Бхатте Чайтанья Дас Аулия; там же — месяц пхалгуна."
