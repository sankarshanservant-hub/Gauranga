  title: "Рамачандра Кавираджа проезжает в свадебных носилках мимо Шринивасы и становится его учеником — «второй глаз»"
  summary: "Сидя у пруда к западу от дома, Шриниваса видит в носилках прекрасного новобрачного и думает: «Это тело обретёт смысл, если он будет служить Кришне»; ему говорят: это Рамачандра, кави-нрипати, врач из вайдьев из Кумара-нагара; Рамачандра слышит, проводит ночь у брахмана в Яджиграме и на рассвете падает к стопам Ачарьи; тот обнимает его: «Ты мой друг из рождения в рождение; ты и Нароттама — два моих глаза, две руки»; угадывает его невысказанное желание, велит читать книги Госвами и даёт мантру Радхи и Кришны; автор ссылается на книгу Кавираджи Карнапуры."
  persons: ["@srinivasa-acharya", "@ramachandra-kaviraja", "@narottama-dasa"]
  places: ["#yajigrama", "#kumaranagara"]
  kind: post-advent
  authority: B
  parallels: "«Карнананда» 1 (krn-0005); «Анурага-валли» 6 (anv-0039); «Према-виласа» 13–14 (pvl-0094, pvl-0096)"
  divergence: "Как в «Карнананде» (носилки после свадьбы, пруд к западу от дома). В «Према-виласе» Рамачандра сам ищет Шринивасу из Телия Будхари, спорит с Вьясой и Шринивасой и лишь затем посвящён."
  notes: "Кавираджа Карнапура (554) — по-видимому, ученик Шринивасы, не Кави Карнапура; его книга не установлена."
