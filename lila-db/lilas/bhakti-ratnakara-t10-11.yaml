  summary: "Вступив в Гауду, Джахнава подходит к Кхетури; Нароттама, Рамачандра, Сантоша Датта и другие выходят навстречу и катаются в пыли у её стоп, Говинда Кавираджа кланяется Рамачандре и Нароттаме; во дворе Господа даршан успокаивает её сердце; Сантоша снова размещает махантов и по его желанию все, омывшись, надевают подаренные им новые белые одежды — надевает их и Джахнава, сама одаряя служанок."
