  summary: "Рагхунатха Дас, исхудавший в разлуке с Рупой, не может прийти и передаёт смиренное послание через Кришнадаса Кавираджу, Рагхаву Пандита и других; Госвами советуют Джахнаве съездить к Кунде и вернуться отдохнуть перед обходом лесов; через Бахулавану она приходит к Радха-кунде, Кавираджа докладывает о ней Дасу Госвами, тот выходит в слезах, и Джахнава плачет, видя его сияющее исхудавшее тело; три-четыре дня она готовит, подносит бхогу Кришне и кормит враджаваси Арита."
