  parallels: "«Према-виласа» 19 (pvl-0157: Чандика во сне укрощает пашанди); «Нароттама-виласа» 9 (nvl-0053: по пути обращает пашанди)"
  notes: "Чанди здесь — служанка, почитающая Джахнаву как супругу Нитьянанды-Баларамы (48); шлока «Я поклоняюсь Шри Джахнаве…» (52) — источник не установлен."
