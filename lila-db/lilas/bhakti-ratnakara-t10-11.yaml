  summary: "В Матхуре Джахнава чтит брахманов-матхуров, омывается у Вишрама-гхата, видит Вараху и Кешаву; наутро с вайшнавами Матхуры идёт во Вриндаван; у места Акруры её встречают Госвами — Парамешвари Дас называет ей Гопалу Бхатту, Бхугарбху, Локанатху, Кришнадаса Брахмачари, Кришну Пандита, Мадху Пандита и Дживу; Госвами кланяются, и Джахнава, считая себя ничтожной, делает то, что их смущает; Парамешвари знакомит Госвами с учениками Шринивасы — Говиндой, сыном Чирандживы, и Бхагаваном Кавираджей."
