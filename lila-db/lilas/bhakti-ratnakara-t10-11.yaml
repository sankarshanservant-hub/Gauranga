  order: 95.31
  title: "Прощание Джахнавы с Вриндаваном: Божества, самадхи Госвами и Гауридаса; Бара Гангадас"
  summary: "Госвами назначают время отъезда, вайшнавы сходятся во Вриндаван; Джахнава в слезах прощается с Говиндой, Гопинатхой, Мадана-моханом, Радха-винодой, Радха-Дамодарой, Радха-раманой, Гопишварой и Вриндой; плачет у самадхи Рагхунатхи Бхатты, Кашишвары, Санатаны и Рупы, у самадхи Гауридаса Пандита видит что-то чудесное и успокаивается словами Бары Гангадаса — сына сестры её матери Бхадравати, ученика Гауридаса, который по сну учителя пришёл во Вриндаван и служит у Дхира-самира."
