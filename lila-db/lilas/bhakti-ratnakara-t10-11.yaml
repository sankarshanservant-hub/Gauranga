  summary: "В одном большом селении пашанды смеются, видя, как бхагаваты кланяются Джахнаве («кланяются человеку, а не Чанди»), и в храме Чанди просят её погубить пришельцев; Чанди в гневе является им во сне с мечом: «Вы хулили бхагават; та, кого вы назвали женой брахмана, — супруга Нитьянанды-Баларамы, которую я ношу на голове; лишь её милость спасёт вас»; утром пашанды в слезах падают к стопам махантов, Джахнава являет им милость, и они погружаются в бхакти."
