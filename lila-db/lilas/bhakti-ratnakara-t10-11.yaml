  title: "Ночной киртан в полнолуние: незримое явление Радхи и Кришны — сияние, благоухание, звон ножных колокольчиков"
  summary: "В ночь полнолуния Нароттама с Рамачандрой, Гокулой и другими поёт о раса-лиле; внезапно всё озаряется, как молнией в туче, разливается чудесное благоухание, слышен звон ножных колокольчиков; когда это скрывается, все лишаются чувств, Рамачандра и Нароттама в слезах, Девидас и Гокула катаются по земле; поняв, что это сверхъестественная лила Кришны с Возлюбленной, они по воле Кришны приходят в себя и в уединении вкушают Его деяния."
