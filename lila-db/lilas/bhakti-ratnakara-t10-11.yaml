  summary: "Говинда Кавираджа с собратьями прощается с Госвами; Гопала Бхатта обнимает его; Локанатха велит передать Нароттаме: быть внимательным в служении Божеству, почитать вайшнавов, соблюдать дни Вишну и вайшнавов, вкушать бхакти-расу с Рамачандрой, — и известить Шринивасу; Бхугарбха тоже шлёт послание; Джива посылает объятия всем, обещает писать Шринивасе, просит присылать песни Говинды и даёт «Гопала-вирудавали», написанную по велению Рупы во сне; Кришнадас Кавираджа и другие обнимают Говинду и Бхагавана Кавираджу."
