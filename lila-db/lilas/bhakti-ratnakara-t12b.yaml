  title: "В Барагачхи: Сурьядас у стоп Нитьянанды; адхиваса жениха и невест"
  summary: "Из Навадвипы все с Нитьянандой идут в Барагачхи, жители встречают Его; Сурьядас, велев младшему брату Кришнадасу идти следом с припасами и брахманами, первым приходит, плачет у стоп Нитьянанды, и Тот обнимает его; брат Гауридас вне себя от радости; в час годхули — адхиваса Нитьянанды (пада Мангала); затем Сурьядас дома совершает адхивасу дочерей (пада Бхупали: мать не чует земли)."
  persons: ["@ishana-navadvipa", "@srinivasa-acharya", "@nityananda", "@suryadasa-pandita", "@krishnadasa-sarakhela", "@gauridasa-pandita", "@krishnadasa-badagachhi", "@vasudha", "@jahnava"]
