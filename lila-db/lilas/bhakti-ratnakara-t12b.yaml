  period: P05
  order: 62
  title: "Победа над дигвиджаей Кешавой Кашмири; его преемство в нимбарка-сампрадае"
  summary: "Сидя с учениками на берегу Ганги, Господь слышит о дигвиджае, перед которым трепещут учителя Навадвипы; встретив его, Вишвамбхара просит описать Гангу, тот слагает трудные стихи, Господь толкует их и указывает ошибки; побеждённый, дигвиджаи по милости Сарасвати понимает: «Гаура — полный Брахман» — и принимает прибежище у Его стоп; Ишана перечисляет преемство его учителей от Нараяны, Хамсы, Санаки, Нарады и Нимбадитьи до Гокулы Бхатты, чьим учеником был Кешава Кашмири; стыдясь прежней гордыни, он подписывал описания лил «Лагху-Кешава»; повсюду славят: «Нимай Пандит — венец учителей»."
  persons: ["@ishana-navadvipa", "@srinivasa-acharya", "@mahaprabhu", "@keshava-kashmiri", "@narada"]
  places: ["#navadvipa", "#ganga"]
  kind: lila
  authority: B
  notes: "Перечень учителей нимбарка-сампрадаи (2255–2271) — только здесь; Шринивасачарья и Гопала Бхатта этого списка — ачарьи нимбарка-сампрадаи, не герои книги (сноски перевода)."
  divergence: "ЧЧ и ЧБ не называют сампрадаю и учителей Кешавы Кашмири и не говорят о «Лагху-Кешаве»."
  themes: [learning, mercy]
