# «Бхакти-ратнакара» Нарахари Чакраварти, таранга 12, двустишия 2001–4079 и колофон (brt-7001…).
# Рамка: Ишана водит Шринивасу, Нароттаму и Рамачандру по Навадвипе и у каждого места рассказывает о лилах
# Господа и Его спутников (событие рамки — ev-navadvipa-parikrama-ishana, заведено по первой половине таранги).
# Лилы, рассказанные у мест, — отдельные записи с периодом самой лилы; Ишана и Шриниваса — рассказчик и слушатель.

