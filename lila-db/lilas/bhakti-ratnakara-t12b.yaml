  summary: "По воле Нитьянанды все желают Его женить; особенно стремится к этому Кришнадас, сын Хари Хода из Барагачхи; в Шалиграме живёт Сурьядас Саркхел, богатый чиновник царя Гауды, с дочерьми Васудхой и Джахнавой; старый брахман говорит ему: в Экачакре жил Хадаи Пандит (Мукунда; цитаты «Вайшнавабхидханы» и «Гаура-ганоддеша-дипики»: родители — Рохини и Васудева), его сын Нитьянанда, авадхута, оставивший данду в Надии, — достойный жених; Сурьядас молчит, но ночью во сне отдаёт дочерей Нитьянанде, видит Его Баладевой, а их — Варуни и Ревати, и плачет от блаженства."
