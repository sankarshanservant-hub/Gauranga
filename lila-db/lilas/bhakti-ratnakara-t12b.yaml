  summary: "Ишана говорит: Адвайта со спутниками то в Шантипуре, то в Надии упоён воспеванием Гауры (пада Камода: после ухода родителей странствовал по тиртхам, вернувшись, привёл Гору, ходил к Нему в Нилачалу); Шривас, Мурари и другие воспевают Его деяния; «Всего, что я видел, не рассказать — сердце разрывается», — и, договорив, Ишана теряет самообладание от премы."
