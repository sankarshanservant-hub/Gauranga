  summary: "Господь велит горожанам петь санкиртану; пашанды доносят кази, тот враждует; Господь со спутниками снаряжается усмирить его; шествие отдельными сампрадаями (Адвайта, Харидас, Шривас, Господь с Нитьянандой и Гададхарой, Вакрешвара), с ними незримо Нарада и боги; сотни тысяч светильников; пады Камода; Господь пляшет у Своего гхата, через гхат Мадхая, Баракона-гхат и Нагария-гхат; Шива-кшетрапала Навадвипы в облике пляшет в киртане, Господь исполняет желания Ганеши (его Божество скрылось при санньясе Господа) и Парвати — богини Сималии; у дома кази тот в страхе, Господь усмиряет его и оказывает милость; гордость пашандов сломлена."
