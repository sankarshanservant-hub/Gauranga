- id: brt-7143
  source: bhakti-ratnakara
  ref: "Таранга 12, 4032–4076"
  file: "bhakti-ratnakara/ru/12.md"
  period: P15
  order: 95.76
  title: "Ночь во дворе Господа: Шриниваса во сне созерцает вечную Навадвипу"
  summary: "Ишана с тремя гостями ложится во дворе Господа; Шриниваса не спит и дивится: «Отчего дом Господа из травы, отчего спутники, ушедшие в дальние края, не видели игр Надии?»; во сне он видит золотую Надию с гхатами из самоцветов, чертоги Гауры и на троне Гауру с Лакшми и Вишнуприей; затем — собрание всех спутников (Нитьянанда, Адвайта, Гададхара, Шривас, Мурари, Харидас, Сварупа, Рамананда, Пратапарудра, Мадхавендра Пури, Санатана, Рупа, Джива, Рагхунатха Дас и бесчисленные другие), но, когда хочет поклониться, сон прерывается; далее — Вишвамбхару, которому поклоняются Брахма, Шива и Индра, игры Вайкунтхи, Айодхьи, Двараки, Матхуры и Враджа, где среди гопи видит себя, раса-мандалу и игры в никундже; на рассвете он приходит в себя и размышляет о милости Господа."
  persons: ["@srinivasa-acharya", "@ishana-navadvipa", "@narottama-dasa", "@ramachandra-kaviraja", "@mahaprabhu", "@lakshmipriya", "@vishnupriya", "@nityananda", "@advaita", "@gadadhara-pandita", "@srivasa", "@murari-gupta", "@haridasa-thakura", "@svarupa-damodara", "@ramananda-raya", "@prataparudra", "@madhavendra-puri", "@sanatana-gosvami", "@rupa-gosvami", "@jiva-gosvami", "@raghunatha-dasa", "@brahma", "@shiva", "@indra"]
