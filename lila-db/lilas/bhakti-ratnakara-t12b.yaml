  summary: "Господь размышляет: «Моё нисхождение — чтобы явить према-бхакти; вернувшись из Гаи, Я уничтожу скорбь преданных»; успокоив мать, отправляется в Гаю, первую ночь проводит в доме здешнего брахмана, утром с учениками уходит; в Гае оказывает милость Ишваре Пури, там начинается проявление према-бхакти, и Он возвращается в Навадвипу."
