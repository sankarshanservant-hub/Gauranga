  summary: "Джават (Яограм): дом Абхиманью, которого йогамайя не допускает коснуться и тени Радхики; игры Радхи и Кришны (Кришна-малини, Кундалата, Кришна в облике брахмана-двиджараджи); Кокилавана; Аджанак (Кришна наносит Радхе сурьму); Биджоари и Парашо, Ши (Кришна уезжает с Акрурой, поток слёз гопи); Камаи и Карала (Лалита, Чандравали и их родня); Пиясо, Сахара (Упананда, Субхадра, Кундалата); Сакхи (Шанкхачуда); Чхатравана: Кришна-царь и Радха-умрао, Мадхумангала."
