  summary: "Рагхунатхе Дасу пришло желание, чтобы обе кунды наполнились водой, и он укорял себя за тень желания богатства. Богатому паломнику в Бадарикашраме Нараяна во сне велел отнести поднесённые монеты Рагхунатхе в Арит-граму и напомнить ему о его замысле; Рагхунатха, оцепенев, велел расчистить кунды. Когда хотели срубить старое дерево у Шьяма-кунды, Юдхиштхира во сне открыл Рагхунатхе, что пятеро Пандавов пребывают здесь деревьями; дерево сохранили, поэтому Шьяма-кунда не стала квадратной."
