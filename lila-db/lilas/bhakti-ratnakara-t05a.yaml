  title: "Байтхан: любовь враджаваси к Санатане"
  summary: "Байтхан — место, где садились на совет пастухи; здесь, связанный любовью враджаваси, жил Санатана. Когда он обходил Врадж, в каждом селении старики, женщины и дети встречали его как родного сына и брата, упрекали, что забыл их, кормили простоквашей и молоком; он расспрашивал всех о детях, свадьбах, коровах и здоровье, утешал и наутро уходил, а они с плачем провожали его. Его правило — одна ночь в селении, но жители Байтхана со слезами упросили его остаться, и он жил здесь, даруя всем счастье."
