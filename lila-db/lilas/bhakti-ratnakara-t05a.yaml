- id: brt-1037
  source: bhakti-ratnakara
  ref: "Таранга 5, 1298–1311"
  file: "bhakti-ratnakara/ru/05.md"
  period: P14
  order: 17.21
  title: "Санатана у Павана-саровара: Кришна-пастушок приносит молоко; хижина"
  summary: "Санатана жил тайно в лесу у Павана-саровара, не заботясь о пище; Кришна в облике пастушка в тюрбане принёс ему горшок молока: «Я пасу здесь коров; выпей, а горшок Я заберу; живи в хижине — иначе враджаваси будут печалиться». Выпив молоко, Санатана в преме потерял самообладание; Господь незримо утешил его и руками враджаваси построил ему хижину; здесь временами жил и Рупа."
  persons: ["@sanatana-gosvami", "@krishna", "@rupa-gosvami", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa"]
  places: ["#pavana-sarovara", "#nandagrama"]
  kind: miracle
  authority: B
  parallels: "БР 1.781–795 (brt-0041, по «Лагху-тошани»)"
  notes: "Рассказ Рагхавы у хижины Санатаны."
  themes: ["revelation", "mercy"]
