  period: P15
  order: 81.536
  title: "Бхандира-ват, Мунджатави, Чир-гхат, Нанда-гхат, Ватсавана и другие места"
  summary: "Каччхавана, Бхушанавана; Бхандира-ват — Баларама убивает Праламбу, Радха с сакхи борется с Кришной в наряде борцов; Мунджатави — Кришна выпивает лесной пожар; Тапована, Гопи-гхат, Чир-гхат (похищение одежд); Нанда-гхат (посланец Варуны уносит Нанду); Ватсавана, Сеи, Чомуха (Брахма похищает телят и пастушков), Сарпа-стхали (Агхасура), Тароли, Магхера, Атас, Шакароя, Варахар, Харасали; возвращение к Нанда-гхату."
  persons: ["@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa", "@krishna", "@radha", "@balarama", "@brahma", "@nanda"]
  places: ["#bhandiravana", "#chira-ghata"]
