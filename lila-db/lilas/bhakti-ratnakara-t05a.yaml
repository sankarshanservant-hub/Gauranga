  title: "Махапрабху в пещере Нандишвары: Нанда, Яшода и Кришна"
  summary: "Господь входит в пещеру, где по сторонам — Нанда и Яшода, а посередине — Кришначандра; поклонившись стопам Нанды и Яшоды, Он касается всего тела Кришны и в упоении премой танцует и поёт; люди говорят: «Это Нараяна из Вайкунтхи», «не сын ли Нанды явился?», — видя, как Он снова и снова падает к стопам Нанды и плачет."
