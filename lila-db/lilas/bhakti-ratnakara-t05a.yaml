  summary: "Богатый брахман у Говардханы, любивший Балараму, бродил по лесам в уверенности, что Тот явится ему; странствуя по святым местам, Нитьянанда остановился в уединённом месте; брахман угостил Его и просил показать сына Рохини; во сне Нитьянанда явился ему Баладевой в украшениях, и голос с неба велел ждать до утра; брахман задумал надеть на Прабху украшения, и Нитьянанда, открыв ему истину, сказал, что позже будет украшен, а пока велел оправить в золото камень Говардханы и надел его на шею. Нитьянанда прожил здесь несколько дней и просил не открывать эту лилу."
