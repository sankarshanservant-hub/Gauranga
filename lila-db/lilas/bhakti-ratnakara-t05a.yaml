  summary: "Тадага-тиртха — аскеза Парджаньи (мантра от Нарады) и рождение его сыновей; кунды Кшунахара, Дхояни, Кришна-, Лалита-, Сурья-, Вишакха-кунда; обитель Паурнамаси и Нандимукхи; Яшода-кунда — игры Кришны в возрастах каумара, пауганда и кайшора (по три ступени); кухня Радхи, место пахтания, проводы Радхи Яшодой; Сахаси- и Мукта-кунда; место Акруры (Крур), место Уддхавы; коровники; Гендукхор, роща Баларамы."
