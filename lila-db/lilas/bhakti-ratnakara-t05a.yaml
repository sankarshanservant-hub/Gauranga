- id: brt-1049
  source: bhakti-ratnakara
  ref: "Таранга 5, 1770–1776, 1790–1801, 1828–1835"
  file: "bhakti-ratnakara/ru/05.md"
  period: P13
  order: 50.1
  title: "Путь Махапрабху из Праяги через Гокулу-Махавану и Равал в Матхуру"
  summary: "Из Праяги Господь дошёл до Аграваны, затем в Ренуку — ашрам Джамадагни, через Раджаграм пришёл в Гокулу и сидел под древним деревом; с толпой и нама-санкиртаной пошёл к месту рождения Кришны в Махаване, танцевал под песни праздника рождения и, увидев Мадана-гопала, потерял самообладание; люди говорили: «Это не санньяси — это Кришна». Из Гокулы Он со спутниками пришёл в Равал, где Его экстаз не описать, и оттуда с брахманом-санодией отправился в Матхуру."
  persons: ["@mahaprabhu", "@krishnadasa-mathura", "@madana-mohana-vrindavana", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa"]
  places: ["#prayaga", "#agra", "#gokula", "#raval", "#mathura"]
  kind: lila
  authority: B
  parallels: "Мурари 4.2.3–8 (mkc-0197; цитируется в 1796–1800); Лочан, Шеша-кханда «Господь видит Вриндаван» 39–47 (lcm-0231)"
  divergence: "По ЧЧ Господь из Праяги идёт прямо в Матхуру, встречает санодию там, а Махавану и Гокулу видит позднее в обходе (Мадхья 18.67); здесь, вслед за Мурари, путь лежит через Ренуку, Раджаграм и Гокулу, а Равал и танец в Махаване — только по БР. По Лочану (lcm-0231), увидев Матхуру, Господь три дня лежит без чувств."
  cc: "Мадхья 17.155–163; 18.67"
  themes: ["pilgrimage", "ecstasy", "kirtan"]
  event: ev-arrival-mathura
  verses:
    - {file: "bhakti-ratnakara/ru/05.md", from: "1770", to: "1776"}
    - {file: "bhakti-ratnakara/ru/05.md", from: "1790", to: "1801"}
