  summary: "Враджаваси Дас, любимый Рагхунатхой, видя, что тот в разлуке оставил рис и пьёт лишь одну дону пахты, принёс пахту в большой чашке из листьев палаши, сорванных в Сакхистхали; услышав название — селение Чандравали, — Рагхунатха в гневе отбросил её и затем велел Дасу туда не ходить. Дас понял, что это деяние совершенного в теле садхаки; автор: тела таких преданных — вечно совершенны."
