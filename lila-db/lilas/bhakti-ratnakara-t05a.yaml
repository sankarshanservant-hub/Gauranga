  title: "Граница Враджа, Кхеланавана, Рама-гхат: раса Баларамы"
  summary: "Кхамба, Кхами, Баначари — граница Враджа; Кхараро, Уджани (Ямуна течёт вспять от флейты), Кхеланавана; Рама-гхат: Баларама, придя из Двараки, два месяца — чайтру и вайшакху — утешает Нанду, Яшоду и гопи и совершает раса с юными гопи, не участвовавшими в раса Кришны; дхьяна Баларамы по пуранам, пение и танец, варуни, притягивание Ямуны плугом и её молитвы."
