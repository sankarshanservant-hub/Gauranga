  title: "Санатана в Махаване: Мадана-гопал играет с детьми на Раманака-валу"
  summary: "Санатана жил в Махаване, радуясь даршану Мадана-гопала, и жители оживали при виде его. Однажды Мадана-гопал в облике пастушка пришёл с детьми Махаваны на песчаный берег Ямуны; Санатана понял, что это не обычный ребёнок, пошёл следом и увидел, как мальчик вошёл в храм — там был лишь Мадана-мохан; поклонившись, Санатана молча вернулся."
  persons: ["@sanatana-gosvami", "@madana-mohana-vrindavana", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa"]
  places: ["#gokula"]
  kind: miracle
  authority: B
  parallels: "БР 2.454–472 (brt-0061); «Према-виласа» 23 (pvl-0197)"
  divergence: "В «Према-виласе» Мадана-мохан пребывает в доме Дамодары Чаубе и Сам велит Санатане взять Его; здесь — игра с детьми на Раманака-валу."
