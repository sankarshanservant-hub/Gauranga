- id: brt-1047
  source: bhakti-ratnakara
  ref: "Таранга 5, 1626–1670"
  file: "bhakti-ratnakara/ru/05.md"
  period: P15
  order: 12.81
  title: "Джива и Валлабха Бхатта: Рупа удаляет Дживу; Санатана добивается прощения; дигвиджайи побеждён письмом"
  summary: "Пока Рупа писал книгу, юный Джива обмахивал его веером; Валлабха Бхатта, увидев мангалачарану «Бхакти-расамриты», сказал, что исправит её; Джива, пойдя к Ямуне будто за водой, опроверг все его доводы. Узнав от Бхатты, кто этот юноша, Рупа сказал Дживе: «Ради моего блага он хотел исправить книгу, а ты не стерпел» — и велел уйти на восток, пока не успокоится ум. Джива жил в хижине из листьев у Нанда-гхата, почти без пищи, желая оставить тело; Санатана, услышав от селян о юном подвижнике, нашёл его и рассказал Рупе, который, заканчивая «Бхакти-расамрита-синдху», ждал Дживу для выверки; Рупа велел привести его, выходил, и Рупа и Санатана вверили ему все труды. Пришедший во Вриндаван дигвиджайи потребовал грамоту победы, но, прочтя письмо Дживы, признал поражение."
  persons: ["@jiva-gosvami", "@rupa-gosvami", "@sanatana-gosvami", "@vallabha-bhatta", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa"]
  places: ["#vrindavana"]
  kind: post-advent
  authority: B
  parallels: "«Валлабха-варта», Нидж-варта 31 (vlb-0004); ср. «Према-виласа» 23 (pvl-0199, ev-jiva-exiled-by-rupa)"
  notes: "Рассказ Рагхавы у Нанда-гхата, где жил Джива. Валлабха Бхатта ушёл в 1531 г., так что эпизод относится ко времени до ухода Господа, хотя событие в базе отнесено к P15."
  divergence: "В варте вместо Рупы — Чайтанья; в «Према-виласе» Рупа удаляет Дживу за гнев на побеждённого дигвиджайи Рупу Нараяну, а прощения добивается Санатана. Здесь дигвиджайи (не назван) побеждён письмом Дживы уже после возвращения."
  themes: ["learning", "offense", "mercy"]
  teaching: ["vaishnava"]
  event: ev-jiva-vallabha-dispute
  verses:
    - {file: "bhakti-ratnakara/ru/05.md", from: "1626", to: "1670"}

