  title: "Джива посылает Шринивасу и Нароттаму обойти Врадж с Рагхавой Пандитом; ночлег у Субуддхи в Матхуре"
  summary: "Джива решает показать Шринивасе и Нароттаме все святые места; в это время с Говардханы приходит Рагхава Госвами, собиравшийся обходить Врадж, и Джива отпускает их с ним; они приходят в Матхуру и останавливаются у храма Кешава-девы, где жил Субуддхи, вечером поют святое имя. Слава Рагхавы: брахман с юга, автор «Бхакти-ратна-пракаши», живёт на Говардхане, иногда с Дасом Госвами, суровый отреченный; по ГГД 162 — Чампакалата; Шринивасу и Нароттаму он любит как одно целое и рассказывает им об играх Кришны в Матхура-мандале."
  persons: ["@jiva-gosvami", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa", "@subuddhi-raya", "@raghunatha-dasa"]
