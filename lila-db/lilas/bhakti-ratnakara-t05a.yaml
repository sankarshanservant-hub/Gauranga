  title: "Локанатха у Кишори-кунды (Умрао) с Радха-винодой"
  summary: "Здесь жил Локанатха Госвами, которому Радха-винода явил милость: он подносил Божеству плоды, коренья и зелень, в дожди и холода жил под деревом в ветхом одеяле, промокая сам, а Божество храня в дупле; в иное время носил Его у груди в ветхой сумке и плакал, вспоминая игры Гаурачандры. Рассказывая это, Рагхава плачет, Шриниваса и Нароттама катаются в пыли."
