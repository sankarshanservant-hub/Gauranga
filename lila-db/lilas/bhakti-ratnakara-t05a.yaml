  title: "Гопала в Гантхули: Махапрабху созерцает Его; служители Гопалы"
  summary: "Рагхава приходит на даршан Гопалы, которому служит Виттхаланатха, сын Валлабхи. Господь в настроении преданного не ступал на Говардхану; Гопала под предлогом пришёл в Гантхули, и Гаурахари танцевал и пел, а все теряли самообладание. Служение Гопале было вверено двум брахманам из Гауды — ученикам Мадхавендры; после их ухода служил некий счастливец, затем Дас Госвами и другие, посовещавшись, вверили его Виттхалешваре, который после ухода отца жил в Матхуре и ныне весь во власти игр Гаурачандры."
  persons: ["@mahaprabhu", "@shrinathji-deity", "@vitthalanatha", "@vallabha-bhatta", "@madhavendra-puri", "@raghunatha-dasa", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa"]
