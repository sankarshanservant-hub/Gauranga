  title: "У Радха-кунды: встреча с Рагхунатхой Дасом и Кришнадасом Кавираджей"
  summary: "Служение Рагхунатхи — кунда, шила с Говардханы и ожерелье из гунджи; Рагхава показывает место встречи кунд, Мальяхари-кунду (игра с жемчужным ожерельем из «Мукта-чариты» Рагхунатхи), Шивакхору и Бханукхору и ведёт обоих к Дасу Госвами: иссохший от отречения, тот поднимается и обнимает их; приходят Кришнадас Кавираджа, почитающий Шринивасу как свою жизнь, Дас-враджаваси и вайшнавы кунды; Шриниваса и Нароттама омываются у Манаса-павана-гхата (где деревьями пребывают Пандавы) и почитают маха-прасад у хижины Гопалы Бхатты."
  persons: ["@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa", "@raghunatha-dasa", "@krishnadasa-kaviraja", "@dasa-vrajavasi-radha-kunda", "@gopala-bhatta"]
  places: ["#radha-kunda"]
  kind: post-advent
  authority: B
  parallels: "«Анурага-валли» 6.32–80 (anv-0036): тот же обход с провожатым от Дживы (у Радха-кунды — у Рагхунатхи Даса); «Анурага-валли» 5.3–22 (anv-0032); «Нароттама-виласа» 2 (nvl-0017)"
  divergence: "По «Анурага-валли» 5 Шриниваса ночевал у Рагхунатхи и обходил с ним Говардхану; Кришнадас Кавираджа там не упомянут."
