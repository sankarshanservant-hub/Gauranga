- id: brt-1045
  source: bhakti-ratnakara
  ref: "Таранга 5, 1549–1562"
  file: "bhakti-ratnakara/ru/05.md"
  period: P05
  order: 1.3
  title: "Нитьянанда на Рама-гхате: «Когда явит Себя Владыка Навадвипы?»"
  summary: "Во время паломничества Нитьянанда жил на Рама-гхате, играл с пастушками, ел йогурт, молоко, коренья и плоды; в настроении Баладевы Он не мог скрыться, и все говорили: «Это сын Рохини в облике авадхуты». Одному брахману, не мыслившему жизни без Баладевы, Он явился Баладевой; Ямуна вознесла Ему молитвы, боги плакали. Лёжа в упоении на пыли под деревом, Он твердил: «Когда придёт избавление безбожников? Когда Владыка Навадвипы явит Себя в Навадвипе, и Я увижу Его своими глазами?»"
  persons: ["@nityananda", "@balarama", "@mahaprabhu", "@raghava-gosvami-govardhana", "@srinivasa-acharya", "@narottama-dasa"]
  places: ["#rama-ghata"]
  kind: lila
  authority: B
  parallels: "ЧБ Ади 9.194–210 (cb-0071), Мадхья 3.107–120 (cb-1027): Нитьянанда во Вриндаване ждёт явления Господа"
  cb: "Ади 9"
  themes: ["ecstasy", "revelation", "separation"]
  bhava: ["balarama"]
  event: ev-nityananda-pilgrimage
  verses:
    - {file: "bhakti-ratnakara/ru/05.md", from: "1549", to: "1562"}

- id: brt-1046
