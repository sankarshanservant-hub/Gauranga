# События, заведённые по «Бхакти-ратнакаре», таранга 5 (двустишия 1901–3837). Формат — как events.yaml.

- id: ev-gaura-appears-sanatana-dvadashaditya
  title: "Гаура является Санатане как бы во сне на Двадашадитья-тиле"
  title_en: "Gaura appears to Sanatana as if in a dream at Dvadashaditya-tila"
  period: P14
  order: 15.2
  date_conf: оценка
  date_basis: "после возвращения Санатаны во Вриндаван по повелению Господа (БР 5.2023)"
  themes: [revelation, separation, mercy]
  notes: "«Бхакти-ратнакара» 5.2023–2028: Санатана, поселившийся у Двадашадитья-тилы и приготовивший место для Господа, тревожится; Гаура на дивном троне является ему, обнимает и утешает."

- id: ev-nityananda-lakshmipati-initiation
  title: "Нитьянанда получает посвящение у Лакшмипати в Пандарпуре"
  title_en: "Nityananda receives initiation from Lakshmipati at Pandharpur"
  period: P05
  order: 1.2
  date_conf: оценка
  date_basis: "в двадцатилетнее паломничество Нитьянанды, до встречи с Мадхавендрой (БР 5.2263–2330)"
  themes: [revelation, mercy]
  notes: "«Бхакти-ратнакара» 5.2263–2328: Баладева во сне являет Лакшмипати Тиртхе, гуру Мадхавендры, мантру и велит посвятить юного авадхуту; наутро Нитьянанда сам просит посвящения; во втором сне Нитьянанда являет ему облик Баладевы, затем Свой; вскоре Лакшмипати скрывается. В ЧБ эпизода нет."

- id: ev-rupa-laughs-vaishnava-offense
  title: "Рупа в созерцании лилы смеётся при виде вайшнава; взаимное испрашивание прощения"
  title_en: "Rupa, absorbed in the vision of the lila, laughs on seeing a Vaishnava; mutual asking of forgiveness"
  period: P14
  order: 40.5
  date_conf: оценка
  date_basis: "при жизни Рупы и Санатаны во Вриндаване"
  themes: [offense, revelation]
  notes: "«Бхакти-ратнакара» 5.3805–3831: Рупа созерцает, как Радхика видит в зеркале Кришну, и смеётся вместе с сакхи; пришедший вайшнав принимает смех на свой счёт; Санатана объясняет; видение у Рупы прерывается, и оба просят друг у друга прощения."
