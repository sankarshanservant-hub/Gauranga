  period: P05
  order: 25.5
  date_conf: оценка
  date_basis: "в день свадьбы с Лакшмиприей и после неё (БР 12.678)"
  themes: [revelation, family]
  notes: "Только «Бхакти-ратнакара» 12.674–697: друг и почитаемый гуру Валлабхи Мишры из Вайкунтхапура; в его хижине открывается великолепие Вайкунтхи: Гаура с Лакшми на троне, затем Он становится четырёхруким; велит хранить это в тайне."

