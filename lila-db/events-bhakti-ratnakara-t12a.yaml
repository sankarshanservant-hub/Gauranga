# События, заведённые по «Бхакти-ратнакаре», таранга 12, двустишия 1–2000 (формат — README.md, как events.yaml).
# Новые события добавлять в конец.

- id: ev-navadvipa-parikrama-ishana
  title: "Обход Навадвипы: Ишана водит Шринивасу, Нароттаму и Рамачандру по девяти островам"
  title_en: "The Navadvipa parikrama: Ishana guides Srinivasa, Narottama and Ramachandra through the nine islands"
  period: P15
  order: 95.75
  date_conf: оценка
  date_basis: "после возвращения Джахнавы из Вриндавана в Кхардаху (БР 12.17)"
  themes: [pilgrimage, separation]
  notes: "«Бхакти-ратнакара» 12: Шриниваса из Яджиграма через Шрикханду идёт в Навадвипу; Ишана, слуга Шачи, в доме Мишры встречает их и на другой день ведёт по Антардвипе, Симантадвипе, Годрумадвипе, Мадхьядвипе, Коладвипе, Ритудвипе, Джахнудвипе, Модадрумадвипе и Рудрадвипе, рассказывая о славе мест и о лилах Господа; в Майяпуре — о рождении и играх Господа. Ср. ev-narottama-gauda-pilgrimage («Нароттама-виласа» 3)."

- id: ev-rama-worshipper-sees-newborn-as-rama
  title: "Брахман — почитатель Рамы в час явления Господа видит в Нём Раму"
  title_en: "A brahmana worshipper of Rama sees the newborn Lord as Rama"
  period: P02
  order: 1.5
  years: [1486, 1486]
  date_conf: оценка
  date_basis: "в день явления Господа (БР 12.600)"
  themes: [revelation, mercy]
  notes: "Только «Бхакти-ратнакара» 12.599–624: брахман из Маугачхи, бывший в доме Мишры в час явления, узнаёт в Мишре Дашаратху, в Шачи — Каушалью; во сне ему является Гаурачандра, затем Рама с луком и стрелами и Хануманом; Господь велит хранить это в тайне; перед уходом брахман поведал об этом Ишане."

