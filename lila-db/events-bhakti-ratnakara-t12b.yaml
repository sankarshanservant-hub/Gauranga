- id: ev-nimai-feeds-sannyasis
  title: "Нимай-пандит приводит домой и угощает двадцать санньяси"
  title_en: "Nimai Pandita brings twenty sannyasis home and feeds them"
  period: P05
  order: 63
  date_conf: оценка
  date_basis: "в годы учительства, между победой над дигвиджаей и поездкой в Восточную Бенгалию (порядок рассказа БР 12)"
  themes: [prasada, family]
  notes: "Известно по «Бхакти-ратнакаре» 12.2280–2282: Господь с почтением приводит домой встреченных двадцать санньяси и угощает их; так Он постоянно кормит санньяси, и люди дивятся, не видя у Него заработка."

- id: ev-advaita-gopi-bhava-dance
  title: "Адвайта пляшет в бхаве гопи в доме Шривасы"
  title_en: "Advaita dances in the mood of a gopi at Srivasa's house"
  period: P07
  order: 101
  date_conf: оценка
  date_basis: "годы киртана в Навадвипе (БР 12.3439, со ссылкой на ЧБ Мадхья-кханду)"
  cb: "Мадхья (цитата в БР 12.3440)"
  themes: [kirtan, ecstasy]
  notes: "«Бхакти-ратнакара» 12.3439–3449: Адвайта в санкиртане пляшет в настроении гопи, плачет и молит Господа, и Тот приходит; это же настроение Адвайта позже просил у Господа как дар в Нилачале (шлока «Чайтанья-чандродая-натаки»). Сразу после — вселенский облик, явленный Адвайте (ev-vishvarupa-shown-advaita)."
