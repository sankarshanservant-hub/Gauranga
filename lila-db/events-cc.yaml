  cc: "Ади 5.50–118"
  cb: ""
  themes: [teaching]
  teaching: [associates-tattva, maya, scripture]
  notes: "Богословская тема, не эпизод жизни: толкование шлок Сварупы Дамодары (Ади 1.9–11): Маха-Вишну в Причинном океане взглядом оплодотворяет майю, но её не касается — пракрити лишь второстепенная причина, как железо, жгущее силой огня; вселенные выходят из пор Его тела с выдохом; Гарбходакашайи входит во вселенные, из Его пупка — лотос Брахмы; Кширодакашайи — Параматма и хранитель, Его форма — Шеша. Ср. ev-tattva-nityananda-advaita, ev-tattva-krishna-mula-narayana (Ади 2)."
