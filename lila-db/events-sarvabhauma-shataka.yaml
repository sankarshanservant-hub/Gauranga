  title_en: "By the Lord's order the Vaishnavas carry the Name to every land and every home"
  period: PX
  order: 51
  cc: "ср. Ади 7.92–98; Мадхья 7.128"
  cb: ""
  themes: [teaching, mercy, kirtan]
  notes: "«Сарвабхаума-шатака» 30–35, 47–49, 62: взгляд «задним числом» на распространение Имени — чандалы, яваны и грешники поют Имя, вайшнавы из милости умоляют падших его принять."
