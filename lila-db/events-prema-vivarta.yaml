# События, заведённые при внесении «Према-виварты» (приписана Джагадананде Пандиту; формат — README.md, раздел «События»).
# Почти все — известны только по этой поэме. Дописывать в конец; порядок на шкале — поле order.

- id: ev-shivananda-raises-jagadananda
