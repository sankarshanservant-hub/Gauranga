# Координаты мест для карты (WGS 84): "#тег": {lat, lon, precision, basis}
# precision: точно — точка по OSM или общеизвестная; примерно — селение/область в целом или отождествление не
#   вполне надёжно; условно — место лишь указано относительно соседних (по тексту или по карте Навадвипа-мандалы
#   1888 г. в «Навадвипа-дхама-махатмье», изд. ШЧСМ 2015, с. 517; карта схематична, ошибка до 2–4 км).
# basis: на чём основано. «карта НДМ 1888» — положение надписи на карте, пересчитанное по опорным точкам OSM
#   (Йогапитха, Навадвип, Самудрагарх, Чампахати, Пурбастхали, Белпукур, Дхубулия, Амгхата, Бхалука, самадхи Кази,
#   слияние Джаланги с Гангой) с поправкой по ближайшим опорам.
# Духовные и мифические места (Голока, Вайкунтха, небеса …), реки и обширные области — без координат.
# Проверка: python3 lila-db/build.py (неизвестный тег — ошибка); координаты попадают в export/places.json (geo).

