- id: ev-prataparudra-proclaims-chaitanya-prabhu
  title: "Царь у Панчасакхи и Прабху; на Ратха-ятре провозглашает: «Это — Прабху!»"
  title_en: "The king with the Panchasakha and the Lord; at the Ratha-yatra he proclaims: 'This is the Lord!'"
  period: P14
  order: 6
  cc: "Мадхья 12–14 (ср.)"
  cb: ""
  themes: [festival, ecstasy, mercy]
  notes: "Орийская традиция («Вайшнава-лиламрита» 7.93–113): после войны царь ищет утешения у Баларамы Даса и Прабху; видя танец Прабху перед колесницей (Расараджа, махабхава), говорит: «Это не человек — это воочию бхава Радхи» и провозглашает Чайтанью Прабху перед народом."

- id: ev-nagara-kirtan-khol-origin
  title: "Нагара-киртан в Пури: тряпица ребёнка на мриданге — откуда название «кхол»"
  title_en: "Nagara-kirtan in Puri: the child's cloth on the mridanga — how the 'khol' got its name"
  period: P14
  order: 7
  cc: ""
  cb: ""
  themes: [kirtan, mercy]
  notes: "Орийская традиция («Вайшнава-лиламрита» 8.1–30): на рассвете Прабху с Панчасакхой ведёт нагара-киртан; ребёнок, выбежав, падает с пинды, мать в гневе бросает в киртан тряпицы с нечистотами; Прабху кладёт их на мридангу, называя сандалом, и велит впредь покрывать мридангу тканью — отсюда «кхол»."

- id: ev-odisha-kirtan-circuit
  title: "Ежегодный круг киртана по Ориссе с Панчасакхой"
  title_en: "The yearly kirtan circuit through Odisha with the Panchasakha"
  period: P14
  order: 8
  cc: ""
  cb: ""
  themes: [pilgrimage, kirtan, festival]
  notes: "Орийская традиция («Вайшнава-лиламрита» 8.32–88): анавасара — в Аларнатхе; пауша — Экамра-кшетра (Ананта-Васудева, Лингараджа); Макара — Ниали, Кендули; Чандрабхага (Конарк); Какатпур; Дола — в Катаке у царя; Вираджа, Вайтарани, Джаджпур — родовое место предков Господа; Туласи-кшетра; к Снана-ятре — в Пури. В ЧЧ последние годы Господа — в Пури."

- id: ev-lord-ancestors-jajpur
  title: "Предки Господа в Джаджпуре: Упендра Мишра бежит от Капилендры в Шрихатту"
  title_en: "The Lord's ancestors at Jajpur: Upendra Mishra flees Kapilendra for Shrihatta"
  period: P01
  order: 0.5
  cc: "Ади 13 (Упендра Мишра — в Шрихатте; об Ориссе не сказано)"
  cb: ""
  themes: [family]
  notes: "Орийская традиция («Вайшнава-лиламрита» 8.70–80): дед Господа Упендра — из Ватсасы, ведийский брахман, владелец шасаны в Джаджпуре; бежал от угроз Капилешвара-девы в Шрихатту; родичи в Джаджпуре чтят Прабху."

- id: ev-jhankad-sarala-rasa
  title: "Раса в Джханкаде у Сарала-Чанди"
  title_en: "The rasa at Jhankad by Sarala-Chandi"
  period: P14
  order: 8.6
  cc: ""
  cb: ""
  themes: [kirtan, pilgrimage]
  notes: "Орийская традиция («Вайшнава-лиламрита» 8.103–114): по зову Рамачандры, ученика Ачьютананды, Прабху с Панчасакхой устраивает расу в Джханкаде; Сарала-Чанди названа пратимой Радхи. Гаудия-вайшнавы различают Дургу (теневую энергию, Брахма-самхита 5.44) и Радху (хладини) — сноска перевода."

- id: ev-svarupa-damodara-departure
  title: "Уход Сварупы Дамодары"
  title_en: "Svarupa Damodara's departure"
  period: P14
  order: 950
  cc: ""
  cb: ""
  themes: [departure, separation]
  notes: "Орийская традиция («Вайшнава-лиламрита» 9.18–24): после болезни Сварупа уходит в Гамбхире в шукла-экадаши Магхи, Панчасакха предаёт его тело морю. По ЧЧ (Антья 14–20) Сварупа неотлучно при Махапрабху до конца его лилы."

- id: ev-gadadhara-sent-to-gauda
  title: "Гададхара послан в Гауду с вестью об уходе Сварупы"
  title_en: "Gadadhara sent to Gauda with news of Svarupa's departure"
  period: P14
  order: 951
  cc: "Мадхья 16 (обет Гададхары не покидать Пури)"
  cb: ""
  themes: [separation]
  notes: "Орийская традиция («Вайшнава-лиламрита» 9.25–27); противоречит ЧЧ и самому Мадхаве (8.92)."

- id: ev-balarama-dasa-departure
  title: "Уход Баларамы Даса"
  title_en: "Balarama Dasa's departure"
  period: P14
  order: 952
  cc: ""
  cb: ""
  themes: [departure]
  notes: "Орийская традиция («Вайшнава-лиламрита» 9.28–41): Баларама Дас, автор «Рамаяны», оставляет пищу и уходит в шукла-дашами Пхалгуны в мандапе; по Мадхаве, «входит в тело Джаганнатхи»; тело погребено в песке у моря."

- id: ev-ramananda-departure-janmashtami
  title: "Уход Рамананды Рая в Джанмаштами"
  title_en: "Ramananda Raya's departure on Janmashtami"
  period: P15
  order: 30
  cc: ""
  cb: ""
  themes: [departure, separation]
  calendar: "бхадра, кришна-аштами (Джанмаштами)"
  notes: "Орийская традиция («Вайшнава-лиламрита» 9.151–163): в Джанмаштами того же года, после ухода Господа, Рамананда приходит в северную мандапу, беседует со Свами и вечером уходит с именем «О Кришна!»; Джаганнатха Дас называет его сиддхой."

- id: ev-chaitra-navami-kashi-mishra-gathering
  title: "Собрание в доме Каши Мишры в шукла-навами чайтры: Господь в самадхи обнимает Рамананду"
  title_en: "The gathering at Kashi Mishra's house on the bright ninth of Chaitra: the Lord in trance embraces Ramananda"
  period: P14
  order: 40
  cc: ""
  cb: ""
  themes: [ecstasy, prasada]
  calendar: "чайтра, шукла-навами (?)"
  notes: "Орийская традиция («Махабхава-пракаша» 1.99–107): преданные украшают двор Каши Мишры; Господь застывает со слезами, глядя вверх, затем обнимает Рамананду и даёт преданным махапрасад."

- id: ev-ramananda-asks-jagannatha-tattva
  title: "Смех Господа в дашами и вопрос Рамананды о таттве Джаганнатхи"
  title_en: "The Lord's laughter on dashami and Ramananda's question on the truth of Jagannatha"
  period: P14
  order: 41
  cc: ""
  cb: ""
  themes: [teaching, ecstasy]
  notes: "Орийская традиция («Махабхава-пракаша» 1.108 и далее): после утреннего киртана Господь смеётся: «Сегодня Я увидел Джаганнатху смеющимся»; царь растирает Его стопы, Сарвабхаума держит светильник; Рамананда спрашивает, почему у Джаганнатхи нет трибханги и флейты и в каком бхаве Господь стал Джаганнатхой."
