  notes: "Орийская традиция («Вайшнава-лиламрита» 7.1–18): по слову Прабху Свами принимает мантру от шудры Баларамы Даса; Каши Мишра гневается, Свами отвечает: «Шудра или брахман — все равны»; Сарвабхаума и Лакшмидхара его вразумляют."

- id: ev-kondavidu-fall-virabhadra
