  period: P14
  order: 16
  cc: ""
  cb: ""
  themes: [teaching, kirtan]
  notes: "Орийская традиция («Вайшнава-лиламрита» 6.1–18): Канхаи — за «Харе Рама», Шивананда — за «Харе Кришна»; по Мадхаве, Господь решает: в Нилачале — «Харе Рама», в Гауде — «Харе Кришна». У гаудия-вайшнавов (Бхактисиддханта) махамантра начинается с «Харе Кришна»."

- id: ev-shivananda-kanhai-pilgrims-quarrel
