  period: P14
  order: 14
  cc: ""
  cb: ""
  themes: [teaching]
  notes: "Орийская традиция Атибади («Вайшнава-лиламрита» 5.109–129, 27-й анк Пратапарудры): рассказ о рождении Господа из смеха Кришны, а Джаганнатхи Даса — из смеха Радхи; Господь называет его «Атибада» и провозглашает перед преданными. В ЧЧ/ЧБ нет; гаудия-вайшнавы числят «ативади» среди апасампрадай."

- id: ev-balarama-dasa-sand-chariot
  title: "Баларама Дас и песчаная колесница: колесница Джаганнатхи не движется"
  title_en: "Balarama Dasa's sand chariot: Jagannatha's chariot will not move"
  period: P14
  order: 15
  cc: ""
  cb: ""
  themes: [jagannatha, festival, mercy]
  notes: "Орийская традиция («Вайшнава-лиламрита» 5.130–164): служители прогоняют Балараму Даса с колесницы; на берегу моря он делает колесницу из песка и зовёт три Божества; колесница на Бада-данде не трогается, пока царь по сну с Господом, Свами и преданными не приводит Балараму с почётом."

- id: ev-mahamantra-order-dispute
  title: "Спор о начале махамантры: «Харе Рама» или «Харе Кришна»"
