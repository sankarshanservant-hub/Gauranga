  cb: ""
  themes: [teaching]
  notes: "Орийская традиция («Вайшнава-лиламрита» 5.82–99): год в Пури, учение о Кришне, дживе, энергиях, аватарах, мадхурье, кама-гаятри и раганугe от Джаганнатхи Даса; затем Господь посылает Санатану во Вриндаван."

- id: ev-atibada-name
  title: "Джаганнатха Дас получает имя «Атибада»"
