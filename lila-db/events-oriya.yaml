  cb: ""
  themes: [teaching, learning]
  notes: "Орийская традиция («Вайшнава-лиламрита» 5.43–61): по просьбе Господа Рамананда учит Рупу расам и аламкарам; десять месяцев Рупа слушает «Бхагавату» у Джаганнатхи Даса, переписывает «Брахма-самхиту» и «Карнамриту»; недовольство Каши Мишры, и Господь посылает Рупу во Вриндаван."

