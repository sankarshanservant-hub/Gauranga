- id: ev-jagannatha-dasa-bhagavata-meeting
  title: "Встреча с Джаганнатхой Дасом, толкователем «Бхагаваты»"
  title_en: "Meeting with Jagannatha Dasa, expounder of the Bhagavata"
  period: P10
  order: 12
  cc: ""
  cb: ""
  themes: [ecstasy, learning]
  notes: "Эпизод орийской традиции («Вайшнава-лиламрита» 4.36–50; Дивакар Дас): Господь слушает толкование орийской «Бхагаваты» Джаганнатхи Даса у Бата-Ганеши в храме Джаганнатхи; в ЧЧ и ЧБ не упоминается."

- id: ev-jagannatha-dasa-rahasa
  title: "Рахаса Джаганнатхи Даса у Бата-Ганеши"
  title_en: "Jagannatha Dasa's rahasa at Bata-Ganesha"
  period: P10
  order: 11
  cc: ""
  cb: ""
  themes: [kirtan, jagannatha]
  notes: "Орийская традиция («Вайшнава-лиламрита» 2.1–30; 4.37): собрания нама-санкиртаны с представлением раса-лилы у Бата-Ганеши в храме Джаганнатхи; ко времени прихода Господа в Пури рахаса уже существует. Время основания не указано."

- id: ev-chodaganga-rahasa-origin
  title: "Царь Чодаганга обновляет храм Джаганнатхи и учреждает киртан и танец махари"
  title_en: "King Chodaganga renews the Jagannatha temple and institutes kirtan and the maharis' dance"
  period: P00
  order: 900
  cc: ""
  cb: ""
  themes: [jagannatha, kirtan]
  notes: "Предыстория рахасы по орийской традиции («Вайшнава-лиламрита» 2.31–54); XII в. (Чодаганга ≈1078–1147)."

- id: ev-jayadeva-in-puri
  title: "Джаядева приходит в Пури"
  title_en: "Jayadeva comes to Puri"
  period: P00
  order: 905
  cc: ""
  cb: ""
  themes: [jagannatha]
  notes: "Орийская традиция («Вайшнава-лиламрита» 2.55 и далее): брахман Джаядева из Кендули на Прачи, служивший Мадхаве в Ниали, приходит в Пури; XII в."

- id: ev-gita-govinda-seva-puri
  title: "Служение танцем «Гита-говинды» в храме Джаганнатхи"
  title_en: "The Gita-govinda dance service in the Jagannatha temple"
  period: P00
  order: 906
  cc: ""
  cb: ""
  themes: [jagannatha, kirtan]
  notes: "Орийская традиция («Вайшнава-лиламрита» 2.59–74): Джаядева слагает «Гита-говинду» в Пури, Падмавати танцует; царь (Бхимадева) делает танец ежедневным служением и строит натамандиру; XII–XIII вв."

- id: ev-sridhara-svami-bhavartha-dipika
  title: "Шридхара Свами слагает «Бхавартха-дипику»"
  title_en: "Shridhara Svami composes the Bhavartha-dipika"
  period: P00
  order: 910
  cc: "Антья 7 (упоминание)"
  cb: ""
  themes: [learning]
  notes: "Орийская традиция («Вайшнава-лиламрита» 2.75–101): Шридхара из Мареи, служитель Гопинатхи в Ремуне, санньяси в Пури, махант в Капиласе; пандиты Каши, Навадвипы и Шрирангама принимают его толкование «Бхагаваты»."

- id: ev-meghanada-wall
  title: "Возведение стены Мегханада вокруг храма Джаганнатхи"
  title_en: "Building of the Meghanada wall round the Jagannatha temple"
  period: P00
  order: 915
  cc: ""
  cb: ""
  themes: [jagannatha]
  notes: "Орийская традиция («Вайшнава-лиламрита» 2.102–111): собака входит во время рахасы, царь велит возвести стену; при Капилендре (XV в.) ставится драма «Парашурама-виджая»."

- id: ev-purushottama-chhera-panhara-kanchi
  title: "Пурушоттама-дева: чхера-панхара и поход на Канчи"
  title_en: "Purushottama-deva: the chhera-panhara and the Kanchi expedition"
  period: P00
  order: 920
  cc: "Мадхья 13 (чхера-панхара при Пратапарудре)"
  cb: ""
  themes: [jagannatha]
  notes: "Орийская традиция («Вайшнава-лиламрита» 2.112–130): Бхога-мандапа, труппа танцовщиц для рахасы, царь метёт путь колесниц золотой метлой; Джага и Балия (Джаганнатха и Баладева) на конях сражаются за царя, он берёт в жёны дочь правителя Канчи; конец XV в. Ср. ЧЧ Мадхья 5 (Сакши-Гопала, Катак)."
