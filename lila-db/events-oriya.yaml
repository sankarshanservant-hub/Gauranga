  order: 925
  cc: ""
  cb: ""
  themes: [jagannatha, kirtan]
  notes: "Орийская традиция («Вайшнава-лиламрита» 3.1–46; ср. Приядас в «Бхактамале»): «Абхинава Гита-говинда» Дивакары с подписью Пурушоттама-девы и «Гита-говинда» Джаядевы положены на ночь в храм; наутро книга Джаядевы сверху; Рудрадева (Пратапарудра) велит петь в храме только «Гита-говинду» и высекает указ у ворот Джая-Виджаи (надпись ≈1499)."

