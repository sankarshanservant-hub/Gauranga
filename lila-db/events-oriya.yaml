  cc: ""
  cb: ""
  themes: [offense]
  notes: "Орийская традиция («Вайшнава-лиламрита» 6.19–25); Каши Мишра мирит их. В ЧЧ Шивананда Сен сам несёт расходы бенгальских преданных (Мадхья 16, Антья 12)."

- id: ev-madhavi-in-goshthi
  title: "Мадхави Даси поёт в собрании; уход недовольных преданных"
  title_en: "Madhavi Dasi sings in the assembly; the displeased devotees leave"
  period: P14
  order: 18
  cc: "Антья 2 (Мадхави-деви — сестра Шикхи Махити)"
  cb: ""
  themes: [kirtan, offense]
  notes: "Орийская традиция («Вайшнава-лиламрита» 6.26–45): по Мадхаве, Господь позволяет Мадхави сидеть в гоштхи, преданные уходят в знак протеста, и её приход запрещают. Гаудия-вайшнавы, следуя ЧЧ (Антья 2), подчёркивают, что Махапрабху как санньяси строжайше избегал общения с женщинами."

- id: ev-gaudiyas-leave-nilachala
  title: "Гаудии покидают Нилачалу; «восемь шлок»"
  title_en: "The Gaudiyas leave Nilachala; the 'eight verses'"
  period: P14
  order: 20
  cc: ""
  cb: ""
  themes: [separation, offense]
  notes: "Орийская традиция («Вайшнава-лиламрита» 6.59–85): обидевшись, что Господь возвеличивает Джаганнатху Даса, гаудии уходят ночью; «восемь шлок» (Шикшаштака), по Мадхаве, пишет Свами, а Шивананда выдаёт их за письмо Прабху; гаудии не возвращаются, идут во Вриндаван и на Говардхане ссорятся с учениками Валлабхи. В ЧЧ/ЧБ этого нет; «Шикшаштака» — сочинение Самого Махапрабху (ЧЧ Антья 20)."

- id: ev-gaudiyas-govardhana-clash
