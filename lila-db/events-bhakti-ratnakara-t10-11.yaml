- id: ev-dvija-haridasa-departure
  title: "Двиджа Харидас Ачарья уходит один во Вриндаван и сокрывается там"
  title_en: "Dvija Haridasa Acharya goes alone to Vrindavana and disappears there"
  period: P15
  order: 96.55
  date_conf: оценка
  date_basis: "сокрылся в магху, экадаши тёмной половины, когда Шриниваса был на пути во Вриндаван во второй раз (БР 10.13, 42)"
