  themes: [departure, separation]
  notes: "«Бхакти-ратнакара» 10.32–43 (рассказ очевидца): после сокрытия Махапрабху Харидас хотел оставить тело, велел сыновьям принять посвящение у Шринивасы и ушёл во Вриндаван, где встречался со Шринивасой; после ухода утешил его во сне."

