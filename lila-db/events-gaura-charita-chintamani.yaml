  notes: "Лила-смарана Нарахари Чакраварти («Гаура-чарита-чинтамани», кирана 2): спящая Навадвипа; спутники, ночующие у дома Господа, ждут Его пробуждения; красота спящего Гауры; во сне Он говорит словами Кришны к Радхе. Ср. «Гауранга-смарана-мангала-стотру» Бхактивиноды и аштакалия-лилу Кришны Вишванатхи Чакраварти и Кришнадаса Кавираджа («Говинда-лиламрита»)."

