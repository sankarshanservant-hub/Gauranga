# События аштакалия-лилы Гауры по «Гаура-чарита-чинтамани» Нарахари Чакраварти (формат — README.md, раздел «События»).
# Это лила-смарана (вечные игры по часам суток в Навадвипе), а не единичные исторические эпизоды; период — P07.

- id: ev-gaura-ashtakala-nishanta
  title: "Аштакалия-лила Гауры: нишанта — сон Господа на исходе ночи"
  title_en: "Gaura's ashtakaliya-lila: nishanta — the Lord's sleep at the end of night"
  period: P07
  order: 90
  cc: ""
  cb: ""
  themes: [krishna-lila, ecstasy]
  notes: "Лила-смарана Нарахари Чакраварти («Гаура-чарита-чинтамани», кирана 2): спящая Навадвипа; спутники, ночующие у дома Господа, ждут Его пробуждения; красота спящего Гауры; во сне Он говорит словами Кришны к Радхе. Ср. «Гауранга-смарана-мангала-стотру» Бхактивиноды и аштакалия-лилу Кришны Вишванатхи Чакраварти и Кришнадаса Кавираджа («Говинда-лиламрита»)."

