- id: ev-gcc-radha-krishna-yavata
  title: "Игры Радхи и Кришны в Явате (рассказ Ямуны Ганге, «Гаура-чарита-чинтамани»)"
  title_en: "Radha and Krishna's pastimes at Yavata (Yamuna's account to Ganga, Gaura-charita-chintamani)"
  period: P00
  order: 50
  cc: ""
  cb: ""
  themes: [krishna-lila]
  notes: "Вставной рассказ кираны 17: Кришна подплывает к купающейся Радхе под видом лотоса; переодетый молодой женой, с Кундалатой разминает Радхе стопы; переодетый брахманом, постящимся ради луны, получает позволение Джатилы прийти к Радхе. Према гопи — чистая према, брак гопи — устроение йогамайи (сноски перевода)."
