  return new Promise((res) => { markerWait = res; });
}

// ---------------------------------------------------------------- режиссёр сценария
const spotOrFig = (n) => figs[n] ? figs[n].root.getWorldPosition(new THREE.Vector3()) : (spots[n] ?? new THREE.Vector3());
async function step(s) {
  const f = figs[s.who];
  const off = s.offset ? new THREE.Vector3(...s.offset) : new THREE.Vector3();
  switch (s.do) {
    case 'place': if (f.root.parent !== scene) { scene.attach(f.root); f.carried = false; }
      f.stop(); f.pos.copy(spots[s.at]).add(off); f.root.rotation.set(0, 0, 0);
      placed[s.who] = true; f.root.visible = !f.celestial || celestial; break;
    case 'hide': f.root.visible = false; placed[s.who] = false; break;
    case 'pose': f.pose = s.pose; break;
    case 'face': f.faceTo(spotOrFig(s.to)); break;
    case 'walk': {
      if (s.with && s.carry) { const c = figs[s.with]; c.carried = true; f.upper.add(c.root); c.root.position.set(0, 0.12, 0.28);
        c.root.rotation.set(0, 0, 0); c.body.rotation.set(0, 0, 0); c.pose = 'sit'; f.carrying = true; }
      const p = f.walk(findPath(f.pos, spots[s.to].clone().add(off)), !!s.run);
      if (!s.nowait) await p; break; }
    case 'drop': { const by = figs[s.by]; scene.attach(f.root); f.carried = false; by.carrying = false;
      f.pos.copy(nearest(by.pos.clone().add(off))); f.root.rotation.set(0, 0, 0); f.pose = 'idle'; break; }
    case 'say': await ui.say(s.as ?? f?.name ?? s.who, s.text, s.ref ?? '', figColor(s.who)); break;
    case 'narrate': await ui.say('Шри Чайтанья-бхагавата', s.text, s.ref ?? '', '#8a6a2a', true); break;
    case 'narrate_game': await ui.say(player.name, s.text, '', figColor('player'), true); break;
    case 'hint': ui.hint(s.text); break;
    case 'objective': ui.setObjective(s.text); break;
    case 'title': await ui.title(s.text, s.sub ?? '', s.sec ?? 3); break;
    case 'fade': await ui.fade(s.text, s.ref ?? ''); break;
    case 'time': await setTime(s.value, s.sec ?? 2); break;
    case 'choice': { const i = await ui.choose(player.name, s.prompt, s.options.map((o) => o.text), figColor('player'));
      flags.push(s.options[i].flag ?? ''); await ui.say(player.name, s.options[i].reply, '', figColor('player'), true); break; }
    case 'unlock': openEntry(s.id, codex.lilas[s.id]); break;
    case 'vision': await ui.vision(!!s.on, s.on ? spotOrFig(s.at).add(new THREE.Vector3(0, 0.6, 0)) : null); break;
    case 'wait': await sleep((s.sec ?? 1) * 1000); break;
    case 'end': await finale(); break;
  }
}
const flags = [];
async function finale() {
  await ui.title('Слава Бала-Гопалу!', `Вы открыли ${Object.keys(found).length} из ${hsIds.length} предметов быта.\n\nИсточники лилы: «Шри Чайтанья-бхагавата», Ади 5.16–166; «Шри Чайтанья-чаритамрита», Ади 14.37; Мурари Гупта, 1.6.8; «Гаура-кришнодая», 3; «Бхакти-ратнакара», 12.\n\nКонец пробного уровня.`, 6);
  ui.setObjective('Пробный уровень пройден. Можно бродить по двору и открывать предметы.');
  if (AUTOPLAY) window.__done = true;
}
async function run() {
  for (const beat of scenario.beats) {
    if (beat.marker) await waitMarker(beat.marker, beat.marker_hint ?? '');
    for (const s of beat.steps) await step(s);
    if (AUTOPLAY && beat.id === 'intro') await autoExplore();
  }
}

// ---------------------------------------------------------------- автотест (?autoplay)
let shotN = 0;
function autoShot() { if (window.__shot) window.__shot(++shotN); }
async function autoExplore() {
  for (const id of ['hs_tulasi', 'hs_handi', 'hs_chala']) { await walkToHotspot(id); await sleep(300); }
  toggleHighlight(); await sleep(300); autoShot(); toggleHighlight();
  toggleCelestial(); await sleep(800); autoShot(); toggleCelestial();
  ui.toggleJournal(); await sleep(300); autoShot(); ui.toggleJournal();
}

// ---------------------------------------------------------------- цикл
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(tw.t / tw.dur, 1); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }
  for (const id in figs) figs[id].update(dt);
  if (marker.visible) { marker.rotation.y += dt * 0.8; const s = 1 + 0.08 * Math.sin(performance.now() / 300); marker.scale.set(s, 1, s);
    if (markerWait && player.pos.distanceTo(marker.position) < 1.7) { marker.visible = false; const r = markerWait; markerWait = null; r(); } }
  perceptTick(dt);
  hovered = pickHover();
  for (const id of hsIds) hsMarks[id].visible = highlight || hovered === id;
  const tip = $('tip');
  if (hovered && mouse.x >= 0) {
    tip.textContent = hovered.startsWith('npc:') ? figs[hovered.slice(4)].name : codex.items[hovered].title + (found[hovered] ? '  ✓' : '');
    tip.hidden = false; tip.style.left = (mouse.x + 18) + 'px'; tip.style.top = (mouse.y + 18) + 'px';
  } else tip.hidden = true;
  drawSparks(dt);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
fit();
$('loading').hidden = true;
ui.counter();
requestAnimationFrame(frame);
run();
</script>
